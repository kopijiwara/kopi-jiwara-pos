<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background: rgba(11, 46, 35, 0.78);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* POS RESPONSIVE GRID (HP / TAB / DESKTOP) */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
        <div style="width:54px;height:54px;border-radius:16px;background:#093814;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.28);">
          <svg viewBox="0 0 100 100" width="52" height="52">
            <rect width="100" height="100" fill="#093814"/>
            <circle cx="50" cy="50" r="35" fill="#FFFFFF"/>
            <path d="M 33 53 C 32 69, 37 78, 52 78 C 66 78, 70 69, 72 44 C 73 29, 68 25, 48 25 C 33 25, 29 30, 30 35 C 31 41, 41 44, 52 43 C 60 42, 62 37, 58 34 C 54 31, 45 32, 44 36" fill="none" stroke="#093814" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:18px;padding:13px;margin-bottom:14px;">
        <label style="display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;color:#FACC15;text-transform:uppercase;margin-bottom:6px;" for="loginStaffSelect">Pilih Pegawai Bertugas</label>
        <select id="loginStaffSelect" class="login-select" onchange="clearPinPad()"></select>
      </div>

      <div>
        <div style="text-align:center;font-size:11px;font-weight:800;letter-spacing:0.06em;color:#FBCFE8;text-transform:uppercase;">Otentikasi PIN 4-Digit</div>
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <div class="numpad-grid">
          <button type="button" class="num-btn" onclick="pressPin('1')">1</button>
          <button type="button" class="num-btn" onclick="pressPin('2')">2</button>
          <button type="button" class="num-btn" onclick="pressPin('3')">3</button>
          <button type="button" class="num-btn" onclick="pressPin('4')">4</button>

      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v2';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });

    function rp(num) {
      const n = Math.round(Number(num) || 0);
      return (n < 0 ? '-' : '') + 'Rp ' + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDigits(val) {
      const d = String(val || '').replace(/\D/g, '');
      return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function parseDigits(val) {
      return Number(String(val || '').replace(/\D/g, '')) || 0;
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatOrderDateTime(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return String(isoStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) +
        ' • ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(msg, isError = false) {
      const wrap = document.getElementById('toastWrap');
      const box = document.getElementById('toastBox');
      box.className = 'toast-box' + (isError ? ' error' : '');
      box.textContent = msg;
      wrap.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => wrap.classList.add('hidden'), 2600);
    }

    // ==================== GOOGLE SHEETS MASTER POS & ERP SYNC (v2.0) ====================
    const OFFLINE_QUEUE_KEY = 'kopi_jiwara_sync_queue_v1';

    function enqueueOfflineSync(item) {
      try {
        const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
        q.push(item);
        localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q.slice(-200)));
      } catch (e) {}
    }

    function flushOfflineSyncQueue() {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url || !navigator.onLine) return;
      try {
        const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
        if (q.length === 0) return;
        localStorage.removeItem(OFFLINE_QUEUE_KEY);
        q.forEach(item => {
          fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item)
          }).catch(() => enqueueOfflineSync(item));
        });
        showToast(`${q.length} data transaksi offline berhasil disinkronkan ke Google Sheets.`);
      } catch (e) {}
    }

    window.addEventListener('online', () => {
      showToast('Koneksi internet kembali aktif.');
      flushOfflineSyncQueue();
    });

    function syncMasterEvent(eventType, payload) {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url) return;
      const bodyObj = {
        source: 'KOPI_JIWARA_POS_ERP_V2',
        eventType,
        timestamp: new Date().toISOString(),
        outlet: db.outlet.name,
        payload
      };
      if (!navigator.onLine) {
        enqueueOfflineSync(bodyObj);
        return;
      }
      try {
        fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyObj)
        }).catch(() => enqueueOfflineSync(bodyObj));
      } catch (e) {
        enqueueOfflineSync(bodyObj);
      }
    }

      const enrichedProducts = (db.products || []).map(p => ({

function doPost(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var data = JSON.parse(e.postData.contents);
    var eventType = data.eventType || 'UNKNOWN';
    var ts = data.timestamp || new Date().toISOString();
    var tgl = ts.slice(0, 10);
    var jam = ts.slice(11, 19);
    var p = data.payload || {};

    if (eventType === 'SALE_COMPLETED') {
      var shSales = getOrCreateSheet(ss, 'POS_TRANSAKSI', [
        'Timestamp', 'No_Nota', 'Tanggal', 'Jam', 'Outlet', 'Jenis_Order',
        'Nama_Pelanggan', 'No_WA_CRM', 'Kasir', 'Metode_Bayar',
        'Subtotal', 'Diskon_Promo', 'Total_Net', 'Total_HPP', 'Laba_Kotor',
        'Uang_Diterima', 'Kembalian', 'Ringkasan_Item'
      ]);
      var itemsText = (p.items || []).map(function(i) { return i.name + ' x' + i.qty; }).join(', ');
      var hppTotal = Number(p.costTotal) || 0;
      shSales.appendRow([
        ts, p.id, tgl, jam, data.outlet, p.orderType,
        p.customer || 'Walk-in', p.customerPhone || '', p.cashier, p.paymentMethod,
        p.subtotal, p.discount || 0, p.total, hppTotal, (p.total - hppTotal),
        p.cashPaid || p.total, p.change || 0, itemsText
      ]);

      var shItems = getOrCreateSheet(ss, 'POS_ITEM_TERJUAL', [
        'Timestamp', 'Tanggal', 'No_Nota', 'Jenis_Order', 'SKU', 'Nama_Menu',
        'Kategori', 'Brand', 'Qty', 'Harga_Satuan', 'HPP_Satuan',
        'Subtotal_Jual', 'Subtotal_HPP', 'Profit_Item'
      ]);
      var brandMap = p.brandMap || {};
      (p.items || []).forEach(function(it) {
        var subJual = (Number(it.price) || 0) * (Number(it.qty) || 0);
        var subHpp = (Number(it.cost) || 0) * (Number(it.qty) || 0);
        var br = brandMap[it.id] || 'Kopi Jiwara';
        shItems.appendRow([
          ts, tgl, p.id, p.orderType, it.sku || '-', it.name,
          it.category || '-', br, it.qty, it.price, it.cost || 0,
          subJual, subHpp, (subJual - subHpp)
        ]);
      });

      var shCf = getOrCreateSheet(ss, 'ARUS_KAS_CASHFLOW', [
        'Timestamp', 'Tanggal', 'No_Ref', 'Kategori_Kas', 'Metode',

        p.total, 0, p.cashier
      ]);

    } else if (eventType === 'CASH_DRAWER') {
      var shCf2 = getOrCreateSheet(ss, 'ARUS_KAS_CASHFLOW', [
        'Timestamp', 'Tanggal', 'No_Ref', 'Kategori_Kas', 'Metode',
        'Keterangan', 'Debit_Masuk', 'Kredit_Keluar', 'PIC'
      ]);
      var isIn = p.type === 'IN';
      shCf2.appendRow([
        ts, tgl, p.id, isIn ? 'Kas Masuk Laci' : 'Biaya Operasional', 'Cash Laci',
        p.note, isIn ? p.amount : 0, isIn ? 0 : p.amount, p.cashier
      ]);

    } else if (eventType === 'ATTENDANCE') {
      var shAtt = getOrCreateSheet(ss, 'ABSENSI_KARYAWAN', [
        'Timestamp', 'ID_Absen', 'Tanggal', 'Nama_Karyawan',
        'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian', 'Status'
      ]);
      shAtt.appendRow([ts, p.id || '-', p.date, p.staffName, p.clockIn, p.clockOut || '-', p.wage || 0, p.status]);

    } else if (eventType === 'CLOSE_SHIFT') {
      var shCls = getOrCreateSheet(ss, 'CLOSING_SHIFT', [
        'Timestamp', 'ID_Closing', 'Tanggal', 'Kasir', 'Modal_Awal',
        'Sales_Cash', 'Sales_QRIS', 'Sales_Transfer', 'Sales_Online_Food',

      shCls.appendRow([
        ts, p.id, tgl, p.cashier, p.openingCash,
        p.cashSales, p.qrisSales, p.transferSales, p.onlineFoodSales || 0,
        p.totalSales, p.expectedCash, p.actualCash, p.diff
      ]);

    } else if (eventType === 'ORDER_AUDIT' || eventType === 'ORDER_CANCELLED') {
      var shAud = getOrCreateSheet(ss, 'AUDIT_OTORISASI', [

      shAud.appendRow([ts, p.id, p.action || eventType, p.orderId, detail, p.reason, p.cashier, p.approvedBy]);

    } else if (eventType === 'FULL_MASTER_SYNC') {
      var shMenu = getOrCreateSheet(ss, 'MASTER_MENU', [

      (p.products || []).forEach(function(pr) {
        var mRp = (Number(pr.price) || 0) - (Number(pr.cost) || 0);

        shMenu.appendRow([ts, pr.sku, pr.name, pr.category, pr.brand || 'Kopi Jiwara', pr.unit, pr.price, pr.cost || 0, mRp, mPct, pr.fav ? 'Ya' : 'Tidak']);

      shInv.clearContents();
      shInv.appendRow(['Update_Time', 'SKU', 'Nama_Bahan', 'Kategori_Gudang', 'Stok_Saat_Ini', 'Stok_Minimum', 'Satuan', 'Status_Stok']);
      (p.inventory || []).forEach(function(item) {
        var st = Number(item.stock) <= Number(item.minStock) ? 'RESTOCK' : 'AMAN';
        shInv.appendRow([ts, item.sku, item.name, item.category, item.stock, item.minStock, item.unit, st]);
      });

      var shCrm = getOrCreateSheet(ss, 'CRM_PELANGGAN', [
        'ID_CRM', 'Nama_Pelanggan', 'No_WhatsApp', 'Tier_Member',
        'Total_Kunjungan', 'Total_Belanja', 'Kunjungan_Terakhir',

      (p.customers || []).forEach(function(c) {
        shCrm.appendRow([c.id, c.name, c.phone || '-', c.tier || 'Regular', c.totalVisits || 0, c.totalSpent || 0, (c.lastVisit || '').slice(0, 10), c.specialVoucher || '-', c.notes || '-']);
      });
    }

    return ContentService.createTextOutput(JSON.stringify({ status: 'OK', eventType: eventType })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'ERROR', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

      if (pr.endDate && today > pr.endDate) return false;

    function getCartTotals() {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const activePromos = db.promos.filter(pr => isPromoValidToday(pr));
      const isManualPromo = cartPromoCode === '__MANUAL__';
      const promo = !isManualPromo ? activePromos.find(pr => pr.code === cartPromoCode) : null;
      const discount = isManualPromo
        ? Math.min(subtotal, Math.max(0, Number(cartManualDiscount) || 0))
        : (promo ? (promo.type === 'percent' ? Math.round(subtotal * promo.value / 100) : Math.min(subtotal, promo.value)) : 0);
      const grandTotal = Math.max(0, subtotal - discount);
      return { subtotal, discount, grandTotal, isManualPromo, promo };
    }

    function addToCart(prodId) {
      const prod = db.products.find(p => p.id === prodId);
      if (!prod) return;
      const existing = cart.find(c => c.id === prodId);
      if (existing) existing.qty += 1;
      else cart.push({ id: prod.id, sku: prod.sku, name: prod.name, category: prod.category, price: prod.price, cost: prod.cost || 0, qty: 1 });
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function handleCartPromoSelect(val) {
      cartPromoCode = val;
      if (val !== '__MANUAL__') cartManualDiscount = 0;
      renderCashierPOS(document.getElementById('mainContentArea'));
      if (val === '__MANUAL__') {
        const inp = document.getElementById('manualPromoInput');
        if (inp) inp.focus();
      }
    }

    function handleManualDiscountInput(el) {
      const rawDigits = el.value.replace(/\D/g, '');
      cartManualDiscount = Number(rawDigits) || 0;
      el.value = rawDigits ? formatDigits(rawDigits) : '';
      const summaryEl = document.getElementById('cartSummarySection');
      if (summaryEl) summaryEl.innerHTML = buildCartSummaryHTML();
    }

    function setQuickManualDiscount(amount) {
      cartManualDiscount = amount;
      const inp = document.getElementById('manualPromoInput');
      if (inp) inp.value = amount > 0 ? formatDigits(amount) : '';
      const summaryEl = document.getElementById('cartSummarySection');
      if (summaryEl) summaryEl.innerHTML = buildCartSummaryHTML();
    }

    function updateCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;
      if (delta < 0 && editingOpenOrderId) {
        const lockedMin = savedOpenOrderBaseline[prodId] || 0;
        if (lockedMin > 0 && cart[idx].qty <= lockedMin) {
          openManagerPinAuthModal('REDUCE_ITEM', editingOpenOrderId, prodId);
          return;
        }
      }
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function clearCart() {
      cart = [];
      editingOpenOrderId = null;
      editingOpenOrderDate = null;
      savedOpenOrderBaseline = {};
      cartCustomer = '';
      cartCustomerPhone = '';
      cartPromoCode = '';
      cartManualDiscount = 0;
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function openManagerPinAuthModal(actionType, orderId, prodId = '') {
      const ord = db.transactions.find(t => t.id === orderId);
      const item = prodId ? cart.find(c => c.id === prodId) : null;
      const title = actionType === 'CANCEL_ORDER'
        ? `Batalkan Pesanan Tersimpan (${esc(orderId)})`
        : `Kurangi Item Tersimpan (${esc(item ? item.name : '')})`;
      const desc = actionType === 'CANCEL_ORDER'
        ? `Pesanan milik "${esc(ord ? ord.customer : orderId)}" akan dibatalkan permanen. Wajib verifikasi PIN Owner / Manager & alasan.`
        : `Item "${esc(item ? item.name : '')}" sudah tersimpan pada pesanan ${esc(orderId)}. Pengurangan item wajib verifikasi PIN Owner / Manager & alasan.`;

      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-pink" style="margin-bottom:4px;">OTORISASI OWNER / MANAGER</span>
            <h3 style="margin:0;font-size:16px;">${title}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <p style="font-size:12px;color:var(--text-muted);margin:0 0 12px;">${desc}</p>

        <div style="display:grid;gap:10px;margin-bottom:14px;">
          <div>
            <label class="field-label">Pilih Alasan</label>
            <select id="mgrAuthReason" class="styled-select">
              ${CANCEL_REASONS.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="field-label">PIN Owner / Manager (4-Digit)</label>
            <input id="mgrAuthPin" type="password" inputmode="numeric" maxlength="4" class="styled-input" style="font-size:18px;letter-spacing:0.25em;text-align:center;" placeholder="••••" />
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px;">
          <button type="button" class="btn btn-soft" onclick="closeModal()">Batal</button>
          <button type="button" class="btn btn-pink" style="padding:12px;" onclick="confirmManagerPinAuth('${esc(actionType)}', '${esc(orderId)}', '${esc(prodId)}')">
            ${actionType === 'CANCEL_ORDER' ? 'Verifikasi & Batalkan Order' : 'Verifikasi & Kurangi Item'}
          </button>
        </div>
      `);
      setTimeout(() => {
        const pinInp = document.getElementById('mgrAuthPin');
        if (pinInp) pinInp.focus();
      }, 60);
    }

    function confirmManagerPinAuth(actionType, orderId, prodId) {
      const reason = document.getElementById('mgrAuthReason')?.value || CANCEL_REASONS[0];
      const pin = (document.getElementById('mgrAuthPin')?.value || '').trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pin);
      if (!approver) {
        showToast('PIN Owner/Manager tidak valid!', true);
        return;
      }

      if (!db.orderAuditLogs) db.orderAuditLogs = [];

      if (actionType === 'REDUCE_ITEM') {
        const idx = cart.findIndex(c => c.id === prodId);
        if (idx === -1) { closeModal(); return; }
        const item = cart[idx];
        const prevQty = item.qty;
        item.qty -= 1;

        if (savedOpenOrderBaseline[prodId] > item.qty) {
          savedOpenOrderBaseline[prodId] = Math.max(0, item.qty);
        }
        if (item.qty <= 0) {
          cart.splice(idx, 1);
          delete savedOpenOrderBaseline[prodId];
        }

        const ordIdx = db.transactions.findIndex(t => t.id === orderId);
        if (ordIdx >= 0) {
          if (cart.length === 0) {
            db.transactions[ordIdx].status = 'CANCELLED';
            db.transactions[ordIdx].cancelReason = reason;
            db.transactions[ordIdx].cancelledBy = approver.name;
            db.transactions[ordIdx].cancelledAt = new Date().toISOString();
          } else {
            const newSub = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const newCost = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
            db.transactions[ordIdx].items = JSON.parse(JSON.stringify(cart));
            db.transactions[ordIdx].subtotal = newSub;
            db.transactions[ordIdx].total = newSub;
            db.transactions[ordIdx].costTotal = newCost;
          }
        }

        const logEntry = {
          id: 'AUD-' + Date.now(),
          date: new Date().toISOString(),
          action: 'REDUCE_OPEN_ITEM',
          orderId,
          itemName: item.name,
          fromQty: prevQty,
          toQty: Math.max(0, prevQty - 1),
          reason,
          cashier: currentUser.name,
          approvedBy: approver.name
        };
        db.orderAuditLogs.unshift(logEntry);
        syncMasterEvent('ORDER_AUDIT', logEntry);
        saveDB();
        closeModal();

        if (cart.length === 0) {
          clearCart();
          showToast(`Item dikurangi hingga kosong, order ${orderId} dibatalkan (${reason})`);
        } else {
          renderCashierPOS(document.getElementById('mainContentArea'));
          showToast(`Item dikurangi (${reason}) — Disetujui ${approver.name}`);
        }
      } else if (actionType === 'CANCEL_ORDER') {
        const ordIdx = db.transactions.findIndex(t => t.id === orderId);
        const ordObj = ordIdx >= 0 ? db.transactions[ordIdx] : null;
        if (ordObj) {
          ordObj.status = 'CANCELLED';
          ordObj.paymentMethod = 'BATAL';
          ordObj.cancelReason = reason;
          ordObj.cancelledBy = approver.name;
          ordObj.cancelledAt = new Date().toISOString();
        }

        const logEntry = {
          id: 'AUD-' + Date.now(),
          date: new Date().toISOString(),
          action: 'CANCEL_OPEN_ORDER',
          orderId,
          customer: ordObj ? ordObj.customer : '-',
          total: ordObj ? ordObj.total : 0,
          reason,
          cashier: currentUser.name,
          approvedBy: approver.name
        };
        db.orderAuditLogs.unshift(logEntry);
        syncMasterEvent('ORDER_CANCELLED', logEntry);
        saveDB();
        closeModal();

        if (editingOpenOrderId === orderId) {
          clearCart();
        } else {
          renderCashierPOS(document.getElementById('mainContentArea'));
        }
        showToast(`Order ${orderId} dibatalkan (${reason}) — Disetujui ${approver.name}`);
      }
    }

    function handleCartCustomerInput(val) {
      cartCustomer = val;
      const found = (db.customers || []).find(c => c.name.toLowerCase() === val.trim().toLowerCase());
      if (found && found.phone && !cartCustomerPhone) {
        cartCustomerPhone = found.phone;
        const pInp = document.getElementById('cartPhoneInput');
        if (pInp) pInp.value = found.phone;
      }
    }

    function handleCartPhoneInput(val) {
      cartCustomerPhone = val;
      const clean = val.replace(/\D/g, '');
      if (clean.length >= 9) {
        const found = (db.customers || []).find(c => (c.phone || '').replace(/\D/g, '') === clean);
        if (found) {
          if (!cartCustomer.trim()) {
            cartCustomer = found.name;
            renderCashierPOS(document.getElementById('mainContentArea'));
          }
          if (found.specialVoucher && !cartPromoCode) {
            const validPromo = db.promos.find(pr => pr.code === found.specialVoucher && isPromoValidToday(pr));
            if (validPromo) {
              cartPromoCode = validPromo.code;
              renderCashierPOS(document.getElementById('mainContentArea'));
              showToast(`Voucher CRM ${validPromo.code} milik ${found.name} otomatis terdeteksi!`);
            }
          }
        }
      }
    }

    function upsertCRMCustomerFromOrder(name, phone, orderTotal, promoUsed) {
      const cleanName = String(name || '').trim();
      const cleanPhone = String(phone || '').trim();
      if (!cleanPhone && (!cleanName || cleanName === 'Walk-in' || cleanName === 'Split Bill')) return;
      if (!db.customers) db.customers = [];

      const digits = cleanPhone.replace(/\D/g, '');
      let existing = digits
        ? db.customers.find(c => (c.phone || '').replace(/\D/g, '') === digits)
        : db.customers.find(c => c.name.toLowerCase() === cleanName.toLowerCase());

      if (existing) {
        if (cleanName && cleanName !== 'Walk-in') existing.name = cleanName;
        if (cleanPhone) existing.phone = cleanPhone;
        existing.totalVisits = (Number(existing.totalVisits) || 0) + 1;
        existing.totalSpent = (Number(existing.totalSpent) || 0) + (Number(orderTotal) || 0);
        existing.lastVisit = new Date().toISOString();
        if (existing.totalSpent >= 500000) existing.tier = 'VIP Member';
        else if (existing.totalSpent >= 150000) existing.tier = 'Gold Member';
      } else {
        db.customers.unshift({
          id: 'CRM-' + Math.floor(100 + Math.random() * 900),
          name: cleanName || ('Pelanggan ' + cleanPhone),
          phone: cleanPhone,
          tier: orderTotal >= 150000 ? 'Gold Member' : 'Regular',
          totalVisits: 1,
          totalSpent: Number(orderTotal) || 0,
          lastVisit: new Date().toISOString(),
          notes: promoUsed ? `Menggunakan promo ${promoUsed}` : 'Pelanggan POS',
          specialVoucher: ''
        });
      }
    }

    function saveAsOpenOrder() {
      if (cart.length === 0) return;
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const costTotal = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const trxId = editingOpenOrderId || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
      const savedDate = editingOpenOrderDate || new Date().toISOString();
      const orderObj = {
        id: trxId, date: savedDate, updatedAt: new Date().toISOString(), orderType: cartOrderType,
        customer: cartCustomer.trim() || 'Pelanggan ' + trxId,
        customerPhone: cartCustomerPhone.trim(),
        cashier: currentUser.name,
        status: 'OPEN', paymentMethod: 'OPEN', subtotal, discount: 0, total: subtotal, costTotal,
        cashPaid: 0, change: 0, items: JSON.parse(JSON.stringify(cart))
      };
      const exIdx = db.transactions.findIndex(t => t.id === trxId);
      if (exIdx >= 0) db.transactions[exIdx] = orderObj;
      else db.transactions.unshift(orderObj);
      saveDB();
      clearCart();
      showToast(`Order ${trxId} disimpan ke Daftar Open`);
    }

    function loadOpenOrderToCart(trxId) {
      const ord = db.transactions.find(t => t.id === trxId);
      if (!ord) return;
      cart = JSON.parse(JSON.stringify(ord.items));
      cartOrderType = ord.orderType;
      cartCustomer = ord.customer;
      cartCustomerPhone = ord.customerPhone || '';
      editingOpenOrderId = ord.id;
      editingOpenOrderDate = ord.date;
      savedOpenOrderBaseline = {};
      ord.items.forEach(it => {
        savedOpenOrderBaseline[it.id] = (savedOpenOrderBaseline[it.id] || 0) + (Number(it.qty) || 0);
      });
      posSubTab = 'menu';
      renderCashierPOS(document.getElementById('mainContentArea'));
      showToast(`Order ${ord.id} (${formatOrderDateTime(ord.date)}) dimuat ke keranjang.`);
    }

    // ==================== SPLIT BILL ====================
    let splitSelectedQty = {};
    let pendingSplitContext = null;

    function openSplitBillModal() {
      if (cart.length === 0) return;
      splitSelectedQty = {};
      cart.forEach(item => { splitSelectedQty[item.id] = item.qty; });
      renderSplitBillModalContent();
    }

    function renderSplitBillModalContent() {
      const selectedTotal = cart.reduce((s, it) => s + it.price * (splitSelectedQty[it.id] || 0), 0);
      const fullTotal = cart.reduce((s, it) => s + it.price * it.qty, 0);
      const remainingTotal = fullTotal - selectedTotal;

      openModal(`
        <div class="modal-head">
          <div>
            <h3 style="margin:0;font-size:17px;">Split Bill / Pisah Pembayaran</h3>
            <div style="font-size:11px;color:var(--text-muted);">Pilih menu yang ingin dibayar sekarang (sisanya masuk Open Order)</div>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <div style="display:grid;gap:8px;margin-bottom:14px;">
          ${cart.map(item => {
            const selQ = splitSelectedQty[item.id] || 0;
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;border:1.5px solid ${selQ > 0 ? 'var(--green-deep)' : 'var(--border-glass)'};background:${selQ > 0 ? '#F2FAF6' : '#FFF'};">
                <div>
                  <div style="font-size:13px;font-weight:800;">${esc(item.name)}</div>
                  <div style="font-size:11px;color:var(--text-muted);">${rp(item.price)} • Pesanan: ${item.qty}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <button class="btn btn-soft btn-sm" onclick="adjustSplitItem('${esc(item.id)}', -1, ${item.qty})">-</button>
                  <span style="font-size:13px;font-weight:900;min-width:28px;text-align:center;">${selQ}/${item.qty}</span>
                  <button class="btn btn-dark btn-sm" onclick="adjustSplitItem('${esc(item.id)}', 1, ${item.qty})">+</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="kpi-tile dark" style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div class="kpi-label">Nominal Split Dibayar</div>
              <div class="kpi-value">${rp(selectedTotal)}</div>
            </div>
            <div style="text-align:right;">
              <div class="kpi-label">Sisa Belum Dibayar</div>
              <div style="font-size:14px;font-weight:800;color:#FBCFE8;">${rp(remainingTotal)}</div>
            </div>
          </div>
        </div>

        <button class="btn btn-yellow" style="width:100%;padding:13px;font-size:13px;" onclick="proceedSplitToCheckout()" ${selectedTotal <= 0 ? 'disabled' : ''}>
          Bayar Menu Terpilih (${rp(selectedTotal)})
        </button>
      `);
    }

    function adjustSplitItem(prodId, delta, maxQty) {
      const cur = splitSelectedQty[prodId] || 0;
      splitSelectedQty[prodId] = Math.max(0, Math.min(maxQty, cur + delta));
      renderSplitBillModalContent();
    }

    function proceedSplitToCheckout() {
      const paidItems = [];
      const leftoverItems = [];
      cart.forEach(item => {
        const payQ = splitSelectedQty[item.id] || 0;
        const remQ = item.qty - payQ;
        if (payQ > 0) paidItems.push({ ...item, qty: payQ });
        if (remQ > 0) leftoverItems.push({ ...item, qty: remQ });
      });
      if (paidItems.length === 0) return;

      const paidTotal = paidItems.reduce((s, i) => s + i.price * i.qty, 0);
      pendingSplitContext = { paidItems, leftoverItems };
      openCheckoutModal(paidTotal, paidTotal, 0, true);
    }

    // ==================== CHECKOUT MODAL ====================
    let checkoutMethod = 'Cash';

    function openCheckoutModal(total, subtotal, discount, isSplit = false) {
      if (!isSplit) pendingSplitContext = null;
      const isOnlineOrder = ['GoFood', 'GrabFood', 'ShopeeFood'].includes(cartOrderType);
      checkoutMethod = isOnlineOrder ? 'Online Food' : 'Cash';
      const roundUp = Math.ceil(total / 10000) * 10000;
      openModal(`
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);">${isSplit ? 'PEMBAYARAN TRANSAKSI (SPLIT BILL)' : 'PEMBAYARAN TRANSAKSI'}</div>
            <div style="font-size:24px;font-weight:900;color:var(--green-deep);">${rp(total)}</div>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <label class="field-label">Pilihan Metode Pembayaran</label>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;">
          <button type="button" id="payOptCash" class="btn ${checkoutMethod === 'Cash' ? 'btn-dark' : 'btn-soft'}" onclick="selectCheckoutMethod('Cash', ${total})">Cash</button>
          <button type="button" id="payOptQRIS" class="btn ${checkoutMethod === 'QRIS' ? 'btn-dark' : 'btn-soft'}" onclick="selectCheckoutMethod('QRIS', ${total})">QRIS</button>
          <button type="button" id="payOptTransfer" class="btn ${checkoutMethod === 'Transfer' ? 'btn-dark' : 'btn-soft'}" onclick="selectCheckoutMethod('Transfer', ${total})">Transfer</button>
          <button type="button" id="payOptOnlineFood" class="btn ${checkoutMethod === 'Online Food' ? 'btn-dark' : 'btn-soft'}" onclick="selectCheckoutMethod('Online Food', ${total})">Online Food</button>
        </div>

        <div id="cashInputPanel" style="display:${checkoutMethod === 'Cash' ? 'block' : 'none'};background:var(--green-soft);padding:14px;border-radius:16px;margin-bottom:14px;">
          <label class="field-label" for="cashReceivedField">Uang Cash Diterima (Rp)</label>
          <input id="cashReceivedField" type="text" inputmode="numeric" class="styled-input" style="font-size:18px;" value="${formatDigits(total)}" oninput="handleCashReceivedTyping(this, ${total})" />
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
            <button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(${total}, ${total})">Uang Pas (${rp(total)})</button>
            ${roundUp > total ? `<button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(${roundUp}, ${total})">${rp(roundUp)}</button>` : ''}
            <button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(50000, ${total})">Rp 50.000</button>
            <button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(100000, ${total})">Rp 100.000</button>
            <button type="button" class="btn btn-pink btn-sm" onclick="setQuickCash(0, ${total})">Reset</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border-glass);">
            <span style="font-size:12px;font-weight:700;">Kembalian:</span>
            <strong id="cashChangeDisplay" style="font-size:18px;color:var(--green-deep);">Rp 0</strong>
          </div>
        </div>

        <div id="onlineFoodNotePanel" style="display:${checkoutMethod === 'Online Food' ? 'block' : 'none'};background:#FEFCE8;border:1px solid rgba(250,204,21,0.7);padding:11px 13px;border-radius:14px;margin-bottom:14px;font-size:12px;color:var(--green-deep);font-weight:700;">
          Pembayaran masuk otomatis melalui aplikasi Online Food (${esc(cartOrderType)}).
        </div>

        <button class="btn btn-yellow" style="width:100%;padding:14px;font-size:14px;" onclick="completeCheckout(${total}, ${subtotal}, ${discount})">
          Selesaikan Pembayaran & Cetak Struk
        </button>
      `);
    }

    function selectCheckoutMethod(method, total) {
      checkoutMethod = method;
      const btnMap = {
        'Cash': 'payOptCash',
        'QRIS': 'payOptQRIS',
        'Transfer': 'payOptTransfer',
        'Online Food': 'payOptOnlineFood'
      };
      Object.entries(btnMap).forEach(([m, elId]) => {
        const el = document.getElementById(elId);
        if (el) el.className = 'btn ' + (m === method ? 'btn-dark' : 'btn-soft');
      });
      const panel = document.getElementById('cashInputPanel');
      if (panel) panel.style.display = method === 'Cash' ? 'block' : 'none';
      const ofPanel = document.getElementById('onlineFoodNotePanel');
      if (ofPanel) ofPanel.style.display = method === 'Online Food' ? 'block' : 'none';
    }

    function handleCashReceivedTyping(inputEl, total) {
      const formatted = formatDigits(inputEl.value);
      inputEl.value = formatted;
      updateCashChangeUI(parseDigits(formatted), total);
    }

    function setQuickCash(amount, total) {
      const el = document.getElementById('cashReceivedField');
      if (el) {
        el.value = amount > 0 ? formatDigits(amount) : '';
        updateCashChangeUI(amount, total);
      }
    }

    function updateCashChangeUI(received, total) {
      const disp = document.getElementById('cashChangeDisplay');
      if (!disp) return;
      const diff = received - total;
      if (diff < 0) {
        disp.style.color = '#BE185D';
        disp.textContent = `Kurang ${rp(Math.abs(diff))}`;
      } else {
        disp.style.color = '#0B2E23';
        disp.textContent = rp(diff);
      }
    }

    function completeCheckout(total, subtotal, discount) {
      let cashPaid = total;
      let change = 0;
      if (checkoutMethod === 'Cash') {
        const el = document.getElementById('cashReceivedField');
        cashPaid = parseDigits(el ? el.value : total);
        if (cashPaid < total) {
          showToast('Nominal uang cash diterima masih kurang.', true);
          return;
        }
        change = cashPaid - total;
      }

      const isSplitFlow = Boolean(pendingSplitContext);
      const itemsToPay = isSplitFlow ? pendingSplitContext.paidItems : JSON.parse(JSON.stringify(cart));
      const leftoverItems = isSplitFlow ? pendingSplitContext.leftoverItems : [];

      const trxId = 'TRX-' + Math.floor(1000 + Math.random() * 9000);
      const costTotal = itemsToPay.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const customerLabel = isSplitFlow
        ? ((cartCustomer.trim() || 'Split Bill') + ' (Split)')
        : (cartCustomer.trim() || 'Walk-in');

      const trx = {
        id: trxId, date: new Date().toISOString(), orderType: cartOrderType,
        customer: customerLabel,
        customerPhone: cartCustomerPhone.trim(),
        cashier: currentUser.name,
        status: 'PAID', paymentMethod: checkoutMethod, subtotal, discount, total, costTotal,
        cashPaid, change, items: itemsToPay
      };

      db.transactions.unshift(trx);
      deductProductStock(itemsToPay);
      upsertCRMCustomerFromOrder(cartCustomer.trim(), cartCustomerPhone.trim(), total, cartPromoCode !== '__MANUAL__' ? cartPromoCode : '');

      const brandMap = {};
      trx.items.forEach(it => { brandMap[it.id] = getBrandFromCategory(it.category); });
      syncMasterEvent('SALE_COMPLETED', { ...trx, brandMap });

      if (isSplitFlow && leftoverItems.length > 0) {
        const remTotal = leftoverItems.reduce((s, i) => s + i.price * i.qty, 0);
        const remCost = leftoverItems.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
        const openId = editingOpenOrderId || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
        const preservedDate = editingOpenOrderDate || new Date().toISOString();
        const openOrd = {
          id: openId, date: preservedDate, orderType: cartOrderType,
          customer: (cartCustomer.trim() || 'Sisa Split Bill'), cashier: currentUser.name,
          status: 'OPEN', paymentMethod: 'OPEN', subtotal: remTotal, discount: 0,
          total: remTotal, costTotal: remCost, cashPaid: 0, change: 0, items: leftoverItems
        };
        const exIdx = db.transactions.findIndex(t => t.id === openId);
        if (exIdx >= 0) db.transactions[exIdx] = openOrd;
        else db.transactions.unshift(openOrd);
      } else if (editingOpenOrderId) {
        db.transactions = db.transactions.filter(t => t.id !== editingOpenOrderId);
      }

      pendingSplitContext = null;
      saveDB();
      clearCart();
      closeModal();
      printThermalReceipt(trx);
      showToast(`${isSplitFlow ? 'Split Bill' : 'Transaksi'} ${trxId} berhasil (${checkoutMethod})`);
    }

    function deductProductStock(items) {
      items.forEach(it => {
        const prod = db.products.find(p => p.id === it.id);
        if (prod) prod.stock = Math.max(0, (Number(prod.stock) || 0) - it.qty);
      });
    }

    // ==================== 3. LAPORAN KASIR (TERMASUK CUSTOM DATE) ====================
    function filterTransactionsByPreset(preset, customStart = '', customEnd = '') {
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const yest = new Date(now);
      yest.setDate(now.getDate() - 1);
      const yestStr = yest.toISOString().slice(0, 10);

      return db.transactions.filter(t => {
        const d = new Date(t.date);
        const dStr = t.date.slice(0, 10);
        if (preset === 'Custom Date') {
          if (customStart && dStr < customStart) return false;
          if (customEnd && dStr > customEnd) return false;
          return true;
        }
        if (preset === 'Hari Ini') return dStr === todayStr;
        if (preset === 'Kemarin') return dStr === yestStr;
        if (preset === '7 Hari Terakhir') return (now - d) / (1000 * 60 * 60 * 24) <= 7;
        if (preset === 'Minggu Ini') {
          const s = new Date(now); s.setDate(now.getDate() - now.getDay());
          return d >= s;
        }
        if (preset === 'Minggu Lalu') {
          const st = new Date(now); st.setDate(now.getDate() - now.getDay());
          const sl = new Date(st); sl.setDate(st.getDate() - 7);
          return d >= sl && d < st;
        }
        if (preset === 'Bulan Ini') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        if (preset === 'Bulan Lalu') {
          const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
        }
        return true;
      });
    }

    function filterDateStringByPreset(dateStr, preset, customStart = '', customEnd = '') {
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const yest = new Date(now);
      yest.setDate(now.getDate() - 1);
      const yestStr = yest.toISOString().slice(0, 10);
      const d = new Date(dateStr + 'T00:00:00');

      if (preset === 'Custom Date') {
        if (customStart && dateStr < customStart) return false;
        if (customEnd && dateStr > customEnd) return false;
        return true;
      }
      if (preset === 'Hari Ini') return dateStr === todayStr;
      if (preset === 'Kemarin') return dateStr === yestStr;
      if (preset === '7 Hari Terakhir') return (now - d) / (1000 * 60 * 60 * 24) <= 7;
      if (preset === 'Minggu Ini') {
        const s = new Date(now); s.setDate(now.getDate() - now.getDay());
        s.setHours(0, 0, 0, 0);
        return d >= s;
      }
      if (preset === 'Minggu Lalu') {
        const st = new Date(now); st.setDate(now.getDate() - now.getDay());
        st.setHours(0, 0, 0, 0);
        const sl = new Date(st); sl.setDate(st.getDate() - 7);
        return d >= sl && d < st;
      }
      if (preset === 'Bulan Ini') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (preset === 'Bulan Lalu') {
        const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
      }
      return true;
    }

    function updateClosingDiff(el, expectedCash) {
      el.value = formatDigits(el.value);
      const actual = parseDigits(el.value);
      const diff = actual - expectedCash;
      const lbl = document.getElementById('closingDiffLabel');
      if (!lbl) return;
      if (diff === 0) { lbl.style.color = '#065F46'; lbl.textContent = 'Selisih Laci: Rp 0 (Klop / Sesuai)'; }
      else if (diff > 0) { lbl.style.color = '#0B2E23'; lbl.textContent = `Selisih Laci: +${rp(diff)} (Lebih)`; }
      else { lbl.style.color = '#BE185D'; lbl.textContent = `Selisih Laci: -${rp(Math.abs(diff))} (Kurang)`; }
    }

    function fillExpectedCash(val) {
      const el = document.getElementById('closingActualCash');
      if (el) { el.value = val > 0 ? formatDigits(val) : ''; updateClosingDiff(el, val); }
    }

    function finalizeShiftClosing(totalSales, cashSales, qrisSales, transferSales, onlineFoodSales, expectedCash) {
      const pin = document.getElementById('closingPinVerify').value;
      if (pin !== currentUser.pin) { showToast('PIN Kasir tidak sesuai.', true); return; }
      const actualCash = parseDigits(document.getElementById('closingActualCash').value);
      const rec = {
        id: 'CLS-' + Math.floor(1000 + Math.random() * 9000), closedAt: new Date().toISOString(),
        cashier: currentUser.name, openingCash: db.shift.openingCash, cashSales, qrisSales, transferSales,
        onlineFoodSales, totalSales, expectedCash, actualCash, diff: actualCash - expectedCash
      };
      db.shiftClosings.unshift(rec);
      db.shift.isOpen = false;
      syncMasterEvent('CLOSE_SHIFT', rec);
      saveDB();
      showToast('Shift berhasil ditutup & laporan tersimpan.');

    function buildCashflowEntries(period, customStart, customEnd) {
      const entries = [];
      const paidTrx = filterTransactionsByPreset(period, customStart, customEnd).filter(t => t.status === 'PAID');
      paidTrx.forEach(t => {
        entries.push({
          id: t.id,
          date: t.date,
          debit: t.total,
          kredit: 0,
          category: 'Penjualan POS',
          method: t.paymentMethod,
          note: `Sales ${t.paymentMethod} (${t.orderType}) — ${t.customer || 'Walk-in'}`,
          pic: t.cashier
        });
      });

      (db.cashDrawerLogs || []).forEach(c => {
        if (filterDateStringByPreset(c.date.slice(0, 10), period, customStart, customEnd)) {
          entries.push({
            id: c.id,
            date: c.date,
            debit: c.type === 'IN' ? c.amount : 0,
            kredit: c.type === 'OUT' ? c.amount : 0,
            category: c.type === 'IN' ? 'Kas Masuk Laci' : 'Biaya Operasional',
            method: 'Cash Laci',
            note: c.note,
            pic: c.cashier
          });
        }
      });

      return entries.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function saveCRMVoucherCampaign() {
      const code = document.getElementById('crmVchCode').value.trim().toUpperCase();
      const name = document.getElementById('crmVchName').value.trim();
      const type = document.getElementById('crmVchType').value;
      const value = Number(document.getElementById('crmVchVal').value) || 0;
      const startDate = document.getElementById('crmVchStart').value;
      const endDate = document.getElementById('crmVchEnd').value;
      const target = document.getElementById('crmVchTarget').value;
      if (!code || !name || value <= 0) { showToast('Lengkapi kode, nama, dan nilai voucher.', true); return; }

      db.promos.unshift({ id: 'prm-' + Date.now(), code, name, type, value, startDate, endDate, active: true });
      if (target === 'ALL') {
        (db.customers || []).forEach(c => { c.specialVoucher = code; });
      } else if (target === 'VIP_GOLD') {
        (db.customers || []).forEach(c => { if (c.tier === 'VIP Member' || c.tier === 'Gold Member') c.specialVoucher = code; });
      }
      saveDB();
      closeModal();
      renderOwnerCRMTab(document.getElementById('mainContentArea'));
      showToast(`Voucher CRM ${code} berhasil dibuat & aktif di Kasir!`);
    }

    function sendCRMVoucherWhatsApp(custId) {
      const cust = (db.customers || []).find(c => c.id === custId);
      if (!cust || !cust.phone) return;
      let waPhone = cust.phone.replace(/\D/g, '');
      if (waPhone.startsWith('0')) waPhone = '62' + waPhone.slice(1);
      const promoObj = db.promos.find(p => p.code === cust.specialVoucher);
      const voucherLine = promoObj
        ? `Gunakan kode voucher khusus *${promoObj.code}* (${promoObj.name} - potongan ${promoObj.type === 'percent' ? promoObj.value + '%' : rp(promoObj.value)}) pada kunjungan Anda berikutnya!`
        : `Terima kasih telah menjadi pelanggan setia *${db.outlet.name}*!`;
      const msg = `Halo Kak *${cust.name}* (${cust.tier || 'Member'}),\n\nSalam hangat dari *${db.outlet.name}*.\n${voucherLine}\n\nKami tunggu kedatangannya kembali ya!`;
      window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function updateInventoryStock(invId, val) {
      const item = db.inventory.find(i => i.id === invId);
      if (!item) return;
      item.stock = Math.max(0, Number(val) || 0);
      saveDB();
      showToast(`Stok ${item.name} diperbarui menjadi ${item.stock} ${item.unit}`);
    }

    function applyInventoryDelta(sign) {
      const invId = document.getElementById('mutInvSelect').value;
      const qty = Math.max(0, Number(document.getElementById('mutInvQty').value) || 0);
      if (qty <= 0) { showToast('Masukkan jumlah valid.', true); return; }
      const item = db.inventory.find(i => i.id === invId);
      if (!item) return;
      item.stock = Math.max(0, Number(item.stock) + sign * qty);
      saveDB();
      renderOwnerInventoryTab(document.getElementById('mainContentArea'));
      showToast(`Stok ${item.name} sekarang ${item.stock} ${item.unit}`);
    }

    function handleOutletLogoUpload(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 220;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          db.outlet.logoDataUrl = canvas.toDataURL('image/png', 0.9);
          saveDB();
          renderWorkspace();
          showToast('Logo outlet berhasil diperbarui.');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

      db.outlet.logoDataUrl = DEFAULT_JIWARA_LOGO_URL;

          <div style="margin-bottom:12px;">
            <label class="field-label">Google Apps Script Webhook URL</label>
            <input id="outWebhookInp" class="styled-input" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(db.outlet.webhookUrl || '')}" />
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-dark" onclick="saveWebhookOnly()">Simpan URL Webhook</button>
            <button class="btn btn-yellow" onclick="syncFullMasterDatabase()">Sync Semua Data ke Master v2</button>
            <button class="btn btn-pink" onclick="openMasterScriptModal()">Skrip Google Sheets v2 (10 Sheet)</button>
          </div>
        </div>
      `;
    }

    function saveWebhookOnly() {
      db.outlet.webhookUrl = document.getElementById('outWebhookInp').value.trim();
      saveDB();
      showToast('URL Webhook Google Sheets berhasil disimpan.');
    }

    function openMasterScriptModal() {
      const code = getMasterAppsScriptCode();
      openModal(`
        <div class="modal-head">
          <div>
            <h3 style="margin:0;font-size:16px;">Google Apps Script — Master POS & ERP v2.0</h3>
            <div style="font-size:11px;color:var(--text-muted);">Tempel di Extensions → Apps Script, lalu jalankan <strong>inisialisasiSemuaSheetMaster()</strong> 1x</div>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        <textarea id="appsScriptBox" readonly style="width:100%;height:240px;font-family:monospace;font-size:11px;padding:10px;border-radius:12px;border:1px solid var(--border-glass);background:#0B2E23;color:#FACC15;margin-bottom:10px;">${esc(code)}</textarea>
        <button class="btn btn-yellow" style="width:100%;padding:12px;" onclick="copyMasterScript()">Salin Kode Apps Script v2.0</button>
      `);
    }

    function copyMasterScript() {
      const ta = document.getElementById('appsScriptBox');
      if (!ta) return;
      ta.select();
      document.execCommand('copy');
      showToast('Kode Google Apps Script v2.0 berhasil disalin.');
    }

    if (!restoreSessionState()) {
      initLoginScreen();
    }
    flushOfflineSyncQueue();
  </script>
</body>
</html>
