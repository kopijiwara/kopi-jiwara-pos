    function sendTrxWhatsApp(trxId, phoneRaw = '') {
      const trx = db.transactions.find(t => t.id === trxId);
      if (!trx) return;
      let digits = String(phoneRaw || trx.customerPhone || '').replace(/\D/g, '');
      if (!digits) return showToast('Masukkan nomor WhatsApp pelanggan terlebih dahulu.', true);
      if (digits.startsWith('0')) digits = '62' + digits.slice(1);
      else if (digits.startsWith('8')) digits = '62' + digits;

      const itemsTxt = (trx.items || []).map(i => `• ${i.name} (${i.qty}x) = ${formatRp(i.price * i.qty)}`).join('\n');
      const contactLine = [
        db.settings.outletPhone ? `Telp/WA: ${db.settings.outletPhone}` : '',
        db.settings.outletSocial ? db.settings.outletSocial : ''
      ].filter(Boolean).join(' • ');

      const msg = [
        `*STRUK PEMBAYARAN — ${db.settings.outletName.toUpperCase()}*`,
        db.settings.outletAddress ? `_${db.settings.outletAddress}_` : '',
        contactLine ? `_${contactLine}_` : '',
        `────────────────────`,
        `No. Nota : *${trx.id}*`,
        `Waktu : ${trx.date} ${trx.time}`,
        `Pesanan : ${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''}`,
        `Kasir : ${trx.cashier}`,
        `────────────────────`,
        itemsTxt,
        `────────────────────`,
        `Subtotal : ${formatRp(trx.subtotal)}`,
        trx.discount > 0 ? `Diskon : -${formatRp(trx.discount)}` : '',
        `*TOTAL BAYAR : ${formatRp(trx.total)}*`,
        `Metode : ${trx.paymentMethod} (LUNAS)`,
        trx.paymentMethod === 'Cash' ? `Tunai : ${formatRp(trx.cashReceived || trx.total)} | Kembali : ${formatRp(trx.changeAmount || 0)}` : '',
        `────────────────────`,
        db.settings.receiptFooter || 'Terima kasih telah mampir ke Kopi Jiwara!'
      ].filter(Boolean).join('\n');

      window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function confirmVoidPaidTrx(trxId) {
      const reason = document.getElementById('voidPaidReasonInp').value.trim() || 'Pembatalan Nota';
      const pin = document.getElementById('voidPaidPinInp').value.trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && String(s.pin) === pin);
      if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);

      const t = db.transactions.find(x => x.id === trxId);
      if (!t) return;
      t.status = 'CANCELLED';
      t.voidReason = reason;
      t.voidBy = approver.name;
      (t.items || []).forEach(it => {
        const p = db.products.find(x => x.id === it.id || x.sku === it.sku);
        if (p) p.stock += it.qty;
      });

      const auditEntry = {
        id: 'AUD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderId: t.id,
        itemName: `VOID NOTA (${formatRp(t.total)})`,
        cashier: currentUser.name,
        authorizedBy: approver.name,
        reason
      };
      db.auditLogs.unshift(auditEntry);

      saveDB();
      syncMasterEvent('PAID_TRX_CANCELLED', { id: t.id, reason, voidBy: approver.name });
      syncMasterEvent('AUDIT_VOID_ITEM', auditEntry);
      autoSyncMasterSlices(['products']);
      closeModal();
      renderWorkspace();
      showToast(`Nota ${t.id} berhasil dibatalkan!`);
    }

    // ==================== TAB 5: KELUAR KASIR (CLOSING SHIFT) ====================
    function getClosingStats() {
      const paid = db.transactions.filter(t => t.status === 'PAID' && t.date === todayISO());
      const grossSales = paid.reduce((s, t) => s + t.total, 0);
      const cashSales = paid.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + t.total, 0);
      const qrisSales = paid.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0);
      const transferSales = paid.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
      const onlineSales = paid.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);

      const cfToday = db.cashflow.filter(c => c.date === todayISO());
      const cashIn = cfToday.filter(c => c.type === 'IN').reduce((s, c) => s + c.amount, 0);
      const cashOut = cfToday.filter(c => c.type === 'OUT').reduce((s, c) => s + c.amount, 0);
      const expectedCash = (db.shift.openingCash || 0) + cashSales + cashIn - cashOut;

      const prodMap = {};
      let totalQty = 0;
      paid.forEach(t => {
        (t.items || []).forEach(it => {
          prodMap[it.name] = (prodMap[it.name] || 0) + (Number(it.qty) || 0);
          totalQty += (Number(it.qty) || 0);
        });
      });
      const soldProducts = Object.entries(prodMap).map(([name, qty]) => ({ name, qty })).sort((a, b) => b.qty - a.qty);

      return { count: paid.length, grossSales, cashSales, qrisSales, transferSales, onlineSales, cashIn, cashOut, expectedCash, soldProducts, totalQty };
    }

    // ==================== TAB 6: LAPORAN & SETTLEMENT BRAND ====================
    function getReportDateFilterFn() {
      const today = todayISO();
      return (dStr) => {
        if (reportPeriod === 'today') return dStr === today;
        if (reportPeriod === '7d') {
          const d = new Date();
          d.setDate(d.getDate() - 6);
          const minStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          return dStr >= minStr && dStr <= today;
        }
        if (reportPeriod === 'month') return dStr.slice(0, 7) === today.slice(0, 7);
        return true;
      };
    }

    function renderReportPnlSub(box) {
      const inPeriod = getReportDateFilterFn();
      const paid = db.transactions.filter(t => t.status === 'PAID' && inPeriod(t.date));
      const gross = paid.reduce((s, t) => s + (t.subtotal || t.total), 0);
      const disc = paid.reduce((s, t) => s + (t.discount || 0), 0);
      const netSales = paid.reduce((s, t) => s + t.total, 0);
      const hpp = paid.reduce((s, t) => s + (t.items || []).reduce((si, i) => si + ((i.cost || 0) * i.qty), 0), 0);
      const grossProfit = netSales - hpp;

      const opsOut = db.cashflow.filter(c => c.type === 'OUT' && inPeriod(c.date) && c.category === 'Biaya Operasional').reduce((s, c) => s + c.amount, 0);
      const wages = db.attendance.filter(a => inPeriod(a.date)).reduce((s, a) => s + (a.wageEarned || 0), 0);
      const netProfit = grossProfit - opsOut - wages;
      const margin = netSales > 0 ? Math.round((netProfit / netSales) * 100) : 0;

      box.innerHTML = `

    function getSettlementBounds() {
      const now = new Date();
      const day = now.getDay();
      const diffMon = day === 0 ? -6 : 1 - day;
      const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffMon);
      const fmt = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');

      if (settlementPeriodMode === 'this_week') {
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
        return { start: fmt(mon), end: fmt(sun), label: `${fmt(mon)} s/d ${fmt(sun)}` };
      }
      if (settlementPeriodMode === 'last_week') {
        const lMon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() - 7);
        const lSun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() - 1);
        return { start: fmt(lMon), end: fmt(lSun), label: `${fmt(lMon)} s/d ${fmt(lSun)}` };
      }
      return { start: settlementCustomStart, end: settlementCustomEnd, label: `${settlementCustomStart} s/d ${settlementCustomEnd}` };
    }

    function renderReportSettlementSub(box) {
      const bounds = getSettlementBounds();
      const periodTrx = db.transactions.filter(t => t.status === 'PAID' && t.date >= bounds.start && t.date <= bounds.end);
      const autoPayroll = db.attendance.filter(a => a.date >= bounds.start && a.date <= bounds.end).reduce((s, a) => s + (a.wageEarned || 0), 0);
      const activePayroll = db.manualPeriodSalary !== null ? Number(db.manualPeriodSalary) : autoPayroll;

      const brands = getActiveBrands();
      const statsMap = {};
      brands.forEach(b => { statsMap[b] = { totalQty: 0, commQty: 0, commGross: 0, salQty: 0, grossSales: 0 }; });

      let totalSalaryBasisQty = 0;
      periodTrx.forEach(t => {
        const ratio = t.subtotal > 0 ? (t.total / t.subtotal) : 1;
        (t.items || []).forEach(it => {
          const bName = brands.includes(it.brand) ? it.brand : (it.brand || 'Kopi Jiwara');
          if (!statsMap[bName]) statsMap[bName] = { totalQty: 0, commQty: 0, commGross: 0, salQty: 0, grossSales: 0 };
          const lineNet = Math.round((it.price * it.qty) * ratio);
          statsMap[bName].totalQty += it.qty;
          statsMap[bName].grossSales += lineNet;
          if (it.includeCommissionShare !== false) {
            statsMap[bName].commQty += it.qty;
            statsMap[bName].commGross += lineNet;
          }
          if (it.includeSalaryShare !== false) {
            statsMap[bName].salQty += it.qty;
            totalSalaryBasisQty += it.qty;
          }
        });

            </td>

                <button type="button" class="btn btn-pink btn-sm" onclick="sendBrandSettleWa('${esc(bName)}','${esc(bounds.label)}',${st.totalQty},${st.grossSales},${commPct},${commCut},${salCut},${netTransfer})" ${netTransfer <= 0 ? 'disabled' : ''}>Kirim WA</button>
              </div>
            </td>

          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">

    function recordBrandSettlement(brand, periodLabel, grossSales, commissionPct, commissionCut, salaryCut, netTransfer) {
      const rec = {
        id: 'STL-' + Date.now().toString().slice(-6),
        date: todayISO(),
        periodLabel,
        brand,
        grossSales,
        commissionPct,
        commissionCut,
        salaryCut,
        netTransfer,
        pic: currentUser.name
      };
      db.brandSettlements.unshift(rec);
      const cf = {
        id: 'CF-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OUT',
        category: 'Setoran Brand Owner',
        amount: netTransfer,
        note: `Transfer Sales ${brand} (${periodLabel})`,
        pic: currentUser.name
      };
      db.cashflow.unshift(cf);
      saveDB();
      syncMasterEvent('BRAND_SETTLEMENT_PAID', rec);
      syncMasterEvent('CASHFLOW_ADDED', cf);
      renderWorkspace();
      showToast(`Settlement ${brand} (${formatRp(netTransfer)}) dicatat!`);
    }

    function sendBrandSettleWa(brand, periodLabel, qty, grossSales, commissionPct, commissionCut, salaryCut, netTransfer) {
      const cfg = db.brandConfig[brand] || {};
      let digits = String(cfg.waNumber || '').replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '62' + digits.slice(1);
      else if (digits.startsWith('8')) digits = '62' + digits;
      const msg = [
        `*BERITA ACARA SETTLEMENT — ${db.settings.outletName.toUpperCase()}*`,
        `Brand   : *${brand}*`,
        `Periode : ${periodLabel}`,
        `────────────────────`,
        `Item Terjual : ${qty} porsi`,
        `Omzet Kotor  : ${formatRp(grossSales)}`,
        `Komisi (${commissionPct}%) : -${formatRp(commissionCut)}`,
        `Porsi Gaji   : -${formatRp(salaryCut)}`,
        `────────────────────`,
        `*NET TRANSFER : ${formatRp(netTransfer)}*`
      ].join('\n');
      window.open(digits ? `https://wa.me/${digits}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

      const it = db.inventory.find(x => x.id === invId);

      openModal(`

    function confirmAdjInv(invId) {
      const it = db.inventory.find(x => x.id === invId);
      if (!it) return;
      const type = document.getElementById('invAdjType').value;
      const qty = Number(document.getElementById('invAdjQty').value) || 0;
      if (type.includes('(+)')) it.stock += qty;
      else if (type.includes('(-)')) it.stock = Math.max(0, it.stock - qty);
      else it.stock = qty;
      it.lastOpname = todayISO();

      const log = {
        id: 'LOG-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        itemName: it.name,
        type,
        qty,
        afterStock: it.stock,
        pic: currentUser.name
      };
      db.stockLogs.unshift(log);
      saveDB();
      syncMasterEvent('INVENTORY_STOCK_ADJUSTED', log);
      autoSyncMasterSlices(['inventory']);
      closeModal();
      renderWorkspace();
      showToast('Stok diperbarui!');

    function moveCatStep(catName, delta) {
      const list = normalizeUniqueCategories(db.categories);
      const idx = list.indexOf(catName);
      if (idx <= 0) return;
      const target = idx + delta;
      if (target < 1 || target >= list.length) return;
      [list[idx], list[target]] = [list[target], list[idx]];
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['categories']);
      renderWorkspace();
      showToast('Urutan kategori diperbarui!');
    }

    function moveCatPos(catName, zeroIdx) {
      const list = normalizeUniqueCategories(db.categories);
      const oldIdx = list.indexOf(catName);
      if (oldIdx <= 0) return;
      const clamped = Math.max(1, Math.min(list.length - 1, zeroIdx));
      list.splice(oldIdx, 1);
      list.splice(clamped, 0, catName);
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['categories']);
      renderWorkspace();
      showToast(`"${catName}" dipindah ke urutan #${clamped + 1}`);
    }

    // ==================== BLUETOOTH THERMAL PRINTER ENGINE ====================
    function buildEscPosReceiptBytes(trx) {
      const encoder = new TextEncoder();
      const lineWidth = db.settings.paperWidth === '80' ? 42 : 32;
      const hr = '-'.repeat(lineWidth) + '\n';
      const center = (txt) => {
        const s = String(txt || '').slice(0, lineWidth);
        const pad = Math.max(0, Math.floor((lineWidth - s.length) / 2));
        return ' '.repeat(pad) + s + '\n';
      };
      const lr = (l, r) => {
        const space = Math.max(1, lineWidth - String(l).length - String(r).length);
        return String(l) + ' '.repeat(space) + String(r) + '\n';
      };
      const isDraft = Boolean(trx.isProforma);
      const totalQty = (trx.items || []).reduce((s, i) => s + (Number(i.qty) || 0), 0);

      let out = '\x1B\x40\x1B\x61\x01\x1B\x45\x01' + (db.settings.outletName || 'KOPI JIWARA') + '\n\x1B\x45\x00';
      if (isDraft) out += '\x1B\x45\x01*** CEK PESANAN / TAGIHAN ***\n\x1B\x45\x00';
      out += (db.settings.outletAddress || '') + '\n';
      if (db.settings.outletPhone) out += 'Telp/WA: ' + db.settings.outletPhone + '\n';
      if (db.settings.outletSocial) out += db.settings.outletSocial + '\n';
      out += '\x1B\x61\x00' + hr;
      out += `Nota  : ${trx.id}\n`;
      out += `Waktu : ${trx.date} ${trx.time}\n`;
      out += `Tipe  : ${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''}\n`;
      out += `Kasir : ${trx.cashier}\n` + hr;

      (trx.items || []).forEach(item => {
        out += `${item.name}\n`;
        out += lr(`  ${item.qty} x ${item.price.toLocaleString('id-ID')}`, (item.qty * item.price).toLocaleString('id-ID'));
      });

      out += hr;
      out += lr('Total Pesanan', `${totalQty} Item`);
      out += lr('Subtotal', formatRp(trx.subtotal));
      if (trx.discount > 0) out += lr('Diskon', '-' + formatRp(trx.discount));
      out += '\x1B\x45\x01' + lr(isDraft ? 'TOTAL TAGIHAN' : 'TOTAL', formatRp(trx.total)) + '\x1B\x45\x00';
      if (!isDraft) {
        out += lr('Bayar (' + trx.paymentMethod + ')', formatRp(trx.cashReceived || trx.total));
        if (trx.paymentMethod === 'Cash') out += lr('Kembalian', formatRp(trx.changeAmount || 0));
      }
      out += hr + center(isDraft ? 'Struk sementara untuk pengecekan' : (db.settings.receiptFooter || 'Terima kasih!'));
      out += '\n\n\n\x1D\x56\x41\x03';
      return encoder.encode(out);
    }

    async function connectAndLockBtPrinter() {
      if (!navigator.bluetooth) return showToast('Browser ini tidak mendukung Web Bluetooth langsung.', true);
      try {
        showToast('Memindai printer thermal Bluetooth...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb',
            '49535343-fe7d-4ae5-8fa9-9fafd205e455',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '0000ff00-0000-1000-8000-00805f9b34fb'
          ]
        });
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        let writeChar = null;
        for (const svc of services) {
          const chars = await svc.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.write || ch.properties.writeWithoutResponse) {
              writeChar = ch;
              break;
            }
          }
          if (writeChar) break;
        }
        if (!writeChar) return showToast('Karakteristik tulis printer tidak ditemukan.', true);
        btPrinterDevice = device;
        btPrinterCharacteristic = writeChar;
        db.settings.printerName = device.name || 'Thermal Printer BT';
        saveDB();
        renderWorkspace();
        showToast(`Printer "${db.settings.printerName}" berhasil dikunci!`);
      } catch (e) {
        showToast('Koneksi Bluetooth dibatalkan atau gagal.', true);
      }
    }

    function unlockBtPrinter() {
      btPrinterDevice = null;
      btPrinterCharacteristic = null;
      db.settings.printerName = '';
      saveDB();
      renderWorkspace();
      showToast('Kunci printer dilepas.');
    }

    async function writeBytesToBtPrinter(bytes) {
      if (!btPrinterCharacteristic && navigator.bluetooth && db.settings.printerName && navigator.bluetooth.getDevices) {
        try {
          const devs = await navigator.bluetooth.getDevices();
          const dev = devs.find(d => d.name === db.settings.printerName) || devs[0];
          if (dev) {
            const server = await dev.gatt.connect();
            const services = await server.getPrimaryServices();
            for (const svc of services) {
              const chars = await svc.getCharacteristics();
              for (const ch of chars) {
                if (ch.properties.write || ch.properties.writeWithoutResponse) {
                  btPrinterCharacteristic = ch;
                  break;
                }
              }
              if (btPrinterCharacteristic) break;
            }
          }
        } catch (e) {}
      }
      if (!btPrinterCharacteristic) return false;
      try {
        for (let i = 0; i < bytes.length; i += 100) {
          await btPrinterCharacteristic.writeValue(bytes.slice(i, i + 100));
        }
        return true;
      } catch (e) {
        btPrinterCharacteristic = null;
        return false;
      }
    }

function readSheetObjects(ss, name) {
  var sh = ss.getSheetByName(name);
  if (!sh || sh.getLastRow() < 2) return [];
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rows = sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).getValues();
  return rows.map(function(r) {
    var obj = {};
    headers.forEach(function(h, idx) { obj[h] = r[idx]; });
    return obj;
  });
}

function writeSheetByHeaders(ss, name, defaultHeaders, rowsData) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).clearContent();
  }
  if (rowsData && rowsData.length > 0) {
    var matrix = rowsData.map(function(rowObj) {
      return headers.map(function(h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
    });
    sh.getRange(2, 1, matrix.length, headers.length).setValues(matrix);
  }
}

function appendRowByHeaders(ss, name, defaultHeaders, rowObj) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rowArr = headers.map(function(h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
  sh.appendRow(rowArr);
}

  setupMasterJiwaraSheets();
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var props = PropertiesService.getScriptProperties();
  var body = JSON.parse(e.postData.contents);
  var type = body.eventType;
  var d = body.data || {};

  if (type === 'OUTLET_PROFILE_UPDATED') {
    props.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(d));
  } else if (type === 'POS_TRANSACTION_PAID') {
    var existing = readSheetObjects(ss, 'POS_TRANSAKSI').some(function(r) { return String(r.No_Nota) === String(d.id); });
    if (!existing) {
      appendRowByHeaders(ss, 'POS_TRANSAKSI',
        ['No_Nota', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Subtotal', 'Diskon', 'Kode_Promo', 'Total_Bayar', 'Metode_Bayar', 'Status'],
        {
          No_Nota: d.id, Tanggal: d.date, Jam: d.time, Tipe_Order: d.orderType,
          Meja_Pelanggan: d.tableOrCustomer || '-', No_WA: d.customerPhone || '',
          Kasir: d.cashier, Subtotal: d.subtotal, Diskon: d.discount || 0,
          Kode_Promo: d.promoCode || '-', Total_Bayar: d.total, Metode_Bayar: d.paymentMethod, Status: 'PAID'
        }
      );
      (d.items || []).forEach(function(it) {
        var sub = (it.price || 0) * (it.qty || 1);
        var hpp = (it.cost || 0) * (it.qty || 1);
        appendRowByHeaders(ss, 'POS_ITEM_TERJUAL',
          ['No_Nota', 'Tanggal', 'Jam', 'SKU', 'Nama_Menu', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Qty', 'Harga_Satuan', 'HPP_Satuan', 'Subtotal_Item', 'Total_HPP', 'Laba_Kotor_Item'],
          {
            No_Nota: d.id, Tanggal: d.date, Jam: d.time, SKU: it.sku || '-', Nama_Menu: it.name,
            Brand: it.brand || 'Kopi Jiwara',
            Kena_Komisi_Brand: it.includeCommissionShare === false ? 'Tidak' : 'Ya',
            Hitung_Porsi_Gaji: it.includeSalaryShare === false ? 'Tidak' : 'Ya',
            Qty: it.qty, Harga_Satuan: it.price, HPP_Satuan: it.cost || 0,
            Subtotal_Item: sub, Total_HPP: hpp, Laba_Kotor_Item: sub - hpp
          }
        );
      });
    }
  } else if (type === 'PAID_TRX_CANCELLED') {
    var shTrx = ss.getSheetByName('POS_TRANSAKSI');
    if (shTrx && shTrx.getLastRow() > 1) {
      var hdrs = shTrx.getRange(1, 1, 1, shTrx.getLastColumn()).getValues()[0].map(function(h) { return String(h).trim(); });
      var cNota = hdrs.indexOf('No_Nota') + 1;
      var cStat = hdrs.indexOf('Status') + 1;
      if (cNota > 0 && cStat > 0) {
        var vals = shTrx.getRange(2, cNota, shTrx.getLastRow() - 1, 1).getValues();
        for (var i = 0; i < vals.length; i++) {
          if (String(vals[i][0]) === String(d.id)) shTrx.getRange(i + 2, cStat).setValue('CANCELLED');
        }
      }
    }
  } else if (type === 'CASHFLOW_ADDED') {
    var isOut = d.type === 'OUT';
    appendRowByHeaders(ss, 'ARUS_KAS_CASHFLOW',
      ['ID_Kas', 'Tanggal', 'Jam', 'Kategori_Kas', 'Keterangan', 'Terima_Dari_Kepada', 'Debit_Masuk', 'Kredit_Keluar', 'No_Nota_Ref', 'PIC'],
      {
        ID_Kas: d.id, Tanggal: d.date, Jam: d.time, Kategori_Kas: d.category || (isOut ? 'Biaya Operasional' : 'Kas Masuk Tambahan'),
        Keterangan: d.note, Terima_Dari_Kepada: d.pic || '-',
        Debit_Masuk: isOut ? 0 : d.amount, Kredit_Keluar: isOut ? d.amount : 0, No_Nota_Ref: '-', PIC: d.pic
      }
    );
  } else if (type === 'ATTENDANCE_CLOCK_IN') {
    appendRowByHeaders(ss, 'ABSENSI_KARYAWAN',
      ['Tanggal', 'Nama_Pegawai', 'Jabatan', 'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian', 'Status'],
      { Tanggal: d.date, Nama_Pegawai: d.staffName, Jabatan: d.role, Jam_Masuk: d.clockIn, Jam_Pulang: '-', Upah_Harian: d.wageEarned, Status: 'Hadir' }
    );
  } else if (type === 'ATTENDANCE_CLOCK_OUT') {
    var shAtt = ss.getSheetByName('ABSENSI_KARYAWAN');
    if (shAtt && shAtt.getLastRow() > 1) {
      var av = shAtt.getRange(2, 1, shAtt.getLastRow() - 1, 6).getValues();
      for (var k = av.length - 1; k >= 0; k--) {
        if (String(av[k][0]) === String(d.date) && String(av[k][1]) === String(d.staffName)) {
          shAtt.getRange(k + 2, 5).setValue(d.clockOut);
          break;
        }
      }
    }
  } else if (type === 'SHIFT_CLOSED') {
    appendRowByHeaders(ss, 'CLOSING_SHIFT',
      ['ID_Closing', 'Tanggal', 'Jam', 'Kasir', 'Modal_Awal', 'Sales_Cash', 'Sales_QRIS', 'Sales_Transfer', 'Sales_Online', 'Total_Omzet', 'Ekspektasi_Cash_Laci', 'Uang_Fisik_Laci', 'Selisih_Laci'],
      {
        ID_Closing: d.id, Tanggal: d.date, Jam: d.time, Kasir: d.cashier,
        Modal_Awal: d.openingCash, Sales_Cash: d.cashSales, Sales_QRIS: d.qrisSales,
        Sales_Transfer: d.transferSales, Sales_Online: d.onlineSales, Total_Omzet: d.totalSales,
        Ekspektasi_Cash_Laci: d.expectedCash, Uang_Fisik_Laci: d.actualCash, Selisih_Laci: d.diff
      }
    );
  } else if (type === 'AUDIT_VOID_ITEM') {
    appendRowByHeaders(ss, 'AUDIT_OTORISASI',
      ['ID_Audit', 'Tanggal', 'Jam', 'No_Order_Nota', 'Tindakan_Item', 'Kasir', 'Otorisasi_Oleh', 'Alasan'],
      { ID_Audit: d.id, Tanggal: d.date, Jam: d.time, No_Order_Nota: d.orderId, Tindakan_Item: d.itemName, Kasir: d.cashier, Otorisasi_Oleh: d.authorizedBy, Alasan: d.reason }
    );
  } else if (type === 'INVENTORY_STOCK_ADJUSTED') {
    appendRowByHeaders(ss, 'LOG_STOK_GUDANG',
      ['ID_Log', 'Tanggal', 'Jam', 'Nama_Bahan', 'Jenis_Mutasi', 'Jumlah', 'Sisa_Stok', 'PIC'],
      { ID_Log: d.id, Tanggal: d.date, Jam: d.time, Nama_Bahan: d.itemName, Jenis_Mutasi: d.type, Jumlah: d.qty, Sisa_Stok: d.afterStock, PIC: d.pic }
    );
  } else if (type === 'BRAND_SETTLEMENT_PAID') {
    appendRowByHeaders(ss, 'SETTLEMENT_BRAND',
      ['ID_Settlement', 'Tanggal', 'Periode_Mingguan', 'Brand', 'Omzet_Kotor', 'Komisi_Pct', 'Potongan_Komisi_Rp', 'Porsi_Beban_Gaji_Rp', 'Net_Wajib_Transfer_Rp', 'Status_Transfer', 'PIC'],
      {
        ID_Settlement: d.id, Tanggal: d.date, Periode_Mingguan: d.periodLabel, Brand: d.brand,
        Omzet_Kotor: d.grossSales, Komisi_Pct: d.commissionPct, Potongan_Komisi_Rp: d.commissionCut,
        Porsi_Beban_Gaji_Rp: d.salaryCut, Net_Wajib_Transfer_Rp: d.netTransfer, Status_Transfer: 'Sudah Transfer', PIC: d.pic
      }
    );
  } else if (type === 'SYNC_MASTER_SNAPSHOT') {
    if (d.brands) props.setProperty('BRANDS_LIST_JSON', JSON.stringify(d.brands));
    if (d.brandConfig) props.setProperty('BRAND_CONFIG_JSON', JSON.stringify(d.brandConfig));
    if (d.products) {
      writeSheetByHeaders(ss, 'MASTER_MENU',
        ['SKU', 'Nama_Menu', 'Kategori', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Satuan_Jual', 'Harga_Jual', 'HPP_Modal', 'Stok_Sistem', 'Favorit', 'Status'],
        d.products.map(function(p) {
          return {
            SKU: p.sku, Nama_Menu: p.name, Kategori: p.category, Brand: p.brand,
            Kena_Komisi_Brand: p.includeCommissionShare === false ? 'Tidak' : 'Ya',
            Hitung_Porsi_Gaji: p.includeSalaryShare === false ? 'Tidak' : 'Ya',
            Satuan_Jual: 'Porsi', Harga_Jual: p.price, HPP_Modal: p.cost,
            Stok_Sistem: p.stock, Favorit: p.isFavorite ? 'Ya' : 'Tidak', Status: p.active === false ? 'Nonaktif' : 'Aktif'
          };
        })
      );
    }
    if (d.categories) {
      writeSheetByHeaders(ss, 'MASTER_KATEGORI', ['Urutan', 'Nama_Kategori'],
        d.categories.map(function(c, i) { return { Urutan: i + 1, Nama_Kategori: c }; })
      );
    }
    if (d.inventory) {
      writeSheetByHeaders(ss, 'GUDANG_STOK',
        ['Kode_Bahan', 'Nama_Bahan', 'Kategori', 'Stok_Sistem', 'Min_Stok', 'Satuan', 'Status_Stok', 'Update_Terakhir'],
        d.inventory.map(function(i) {
          return {
            Kode_Bahan: i.code, Nama_Bahan: i.name, Kategori: i.category,
            Stok_Sistem: i.stock, Min_Stok: i.minStock, Satuan: i.unit,
            Status_Stok: Number(i.stock) <= Number(i.minStock) ? 'Perlu Restock' : 'Aman',
            Update_Terakhir: i.lastOpname || ''
          };
        })
      );
    }
    if (d.staff) {
      writeSheetByHeaders(ss, 'MASTER_PEGAWAI',
        ['ID_Staf', 'Nama_Pegawai', 'Jabatan', 'PIN_4_Digit', 'Upah_Harian', 'Status'],
        d.staff.map(function(s) {
          return { ID_Staf: s.id, Nama_Pegawai: s.name, Jabatan: s.role, PIN_4_Digit: s.pin, Upah_Harian: s.dailyWage, Status: s.active === false ? 'Nonaktif' : 'Aktif' };
        })
      );
    }
    if (d.promos) {
      writeSheetByHeaders(ss, 'MASTER_PROMO',
        ['Kode_Promo', 'Judul_Promo', 'Jenis_Potongan', 'Nilai_Potongan', 'Min_Belanja', 'Berlaku_Sampai', 'Status'],
        d.promos.map(function(p) {
          return { Kode_Promo: p.code, Judul_Promo: p.name, Jenis_Potongan: p.type, Nilai_Potongan: p.value, Min_Belanja: p.minOrder || 0, Berlaku_Sampai: p.validUntil || '', Status: p.active === false ? 'Nonaktif' : 'Aktif' };
        })
      );
    }
    if (d.customers) {
      writeSheetByHeaders(ss, 'CRM_PELANGGAN',
        ['ID_Pelanggan', 'Nama_Pelanggan', 'No_WA', 'Tier_Member', 'Kunjungan', 'Total_Belanja', 'Voucher_Khusus', 'Potongan_Voucher', 'Berlaku_Sampai'],
        d.customers.map(function(c) {
          return {
            ID_Pelanggan: c.id, Nama_Pelanggan: c.name, No_WA: c.phone || '', Tier_Member: c.tier || 'Regular',
            Kunjungan: c.visits || 0, Total_Belanja: c.totalSpend || 0, Voucher_Khusus: c.specialVoucher || '',
            Potongan_Voucher: c.voucherDiscount || 0, Berlaku_Sampai: c.voucherExpiry || '2026-12-31'
          };
        })
      );
    }
    if (d.openOrders !== undefined) {
      writeSheetByHeaders(ss, 'OPEN_ORDERS',
        ['ID_Order', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Total_Tagihan', 'JSON_Items'],
        d.openOrders.map(function(o) {
          return { ID_Order: o.id, Tanggal: o.date, Jam: o.time, Tipe_Order: o.orderType, Meja_Pelanggan: o.tableOrCustomer || '-', No_WA: o.customerPhone || '', Kasir: o.cashier, Total_Tagihan: o.total, JSON_Items: JSON.stringify(o.items || []) };
        })
      );
    }
  }
  return ContentService.createTextOutput(JSON.stringify({ status: 'ok', eventType: type })).setMimeType(ContentService.MimeType.JSON);
}`;

      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:16px;">Skrip Google Sheets v3.0 (Header-Aware 2-Way Sync)</h3><button type="button" class="close-circle" onclick="closeModal()">x</button></div>
        <ol style="font-size:12px;color:var(--text-muted);padding-left:18px;margin-top:0;line-height:1.5;">
          <li>Buka file Google Spreadsheets <strong>Master POS & ERP - KOPI JIWARA</strong> baru Anda -> klik <strong>Extensions -> Apps Script</strong>.</li>
          <li>Hapus seluruh isi editor lama, tempel kode <strong>v3.0</strong> di bawah ini -> tekan <strong>Save</strong>.</li>
          <li>Klik <strong>Deploy -> New deployment</strong> (Type: <em>Web app</em>, Execute as: <em>Me</em>, Who has access: <em>Anyone</em>) -> <strong>Deploy</strong> & salin URL Web App-nya.</li>
        </ol>
        <textarea id="gasV30Box" readonly style="width:100%;height:190px;font-family:monospace;font-size:11px;padding:10px;border-radius:12px;border:1px solid var(--border-glass);background:#F8FAFC;">${esc(code)}</textarea>
        <button type="button" class="btn btn-dark" style="width:100%;margin-top:10px;" onclick="navigator.clipboard.writeText(document.getElementById('gasV30Box').value);showToast('Skrip Google Sheets v3.0 berhasil disalin!')">Salin Skrip Google Sheets v3.0</button>
      `);
    }

    // ==================== INIT APP ====================
    function initApp() {
      renderLoginStaffDropdown();
      checkExistingSession();
      if (!currentUser) {
        startCloudAutoPullLoop();
        if (db.settings.webhookUrl && navigator.onLine) {
          pullFromCloudMaster(false);
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
