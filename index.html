<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background: rgba(11, 46, 35, 0.78);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* CRM SUGGESTION DROPDOWN */
    .crm-suggest-box {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #FFFFFF;
      border: 1.5px solid var(--green-deep);
      border-radius: 14px;
      box-shadow: var(--shadow-float);
      z-index: 60;
      max-height: 170px;
      overflow-y: auto;
    }
    .crm-suggest-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .crm-suggest-item:last-child { border-bottom: none; }
    .crm-suggest-item:hover { background: var(--green-soft); }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
        <div style="width:54px;height:54px;border-radius:16px;background:#093814;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.28);">
          <svg viewBox="0 0 100 100" width="52" height="52">

    function renderJiwaraPngIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

    (function setupOfflineServiceWorker() {
      try {
        const startUrl = window.location.href.split('#')[0];
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v12';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              if (e.request.url.includes('script.google.com')) return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});

        if (!Array.isArray(merged.brandSettlements)) {

    function getAllAvailableBrands() {
      const deletedSet = new Set((db.deletedBrands || []).map(b => String(b).toLowerCase()));
      const set = new Set();
      (db.brandConfigs || []).forEach(b => {
        if (b.brand && b.active !== false && !deletedSet.has(b.brand.toLowerCase())) {
          set.add(b.brand);
        }
      });
      (db.products || []).forEach(p => {
        if (p.brand && !deletedSet.has(p.brand.toLowerCase())) {
          set.add(p.brand);
        }
      });
      if (set.size === 0) set.add('Kopi Jiwara');
      return Array.from(set);
    }

    function formatWhatsAppPhone(rawPhone) {
      let clean = String(rawPhone || '').replace(/[^0-9]/g, '');
      if (!clean) return '';
      if (clean.startsWith('0')) clean = '62' + clean.slice(1);
      else if (clean.startsWith('8')) clean = '62' + clean;
      return clean;
    }

    function buildWhatsAppReceiptText(trx) {
      const contactInfo = [
        db.settings.phone ? `Telp/WA: ${db.settings.phone}` : '',
        db.settings.socialMedia ? `Sosmed: ${db.settings.socialMedia}` : ''
      ].filter(Boolean).join(' | ');

      const lines = [
        `*STRUK PEMBAYARAN — ${db.settings.outletName}*`,
        ...(db.settings.address ? [db.settings.address] : []),
        ...(contactInfo ? [contactInfo] : []),
        `--------------------------------`,
        `No. Nota : ${trx.id}`,
        `Tanggal  : ${trx.date} (${trx.time})`,
        `Pesanan  : ${trx.orderType}${trx.tableOrCustomer ? ' • ' + trx.tableOrCustomer : ''}`,
        `Kasir    : ${trx.cashier || '-'}`,
        `--------------------------------`,
        ...trx.items.map(i => `• ${i.name} (${i.qty}x) = ${rp(i.price * i.qty)}`),
        `--------------------------------`,
        `Subtotal : ${rp(trx.subtotal)}`
      ];
      if ((trx.discount || 0) > 0) {
        lines.push(`Potongan : -${rp(trx.discount)}`);
      }
      lines.push(`*TOTAL BAYAR : ${rp(trx.total)}*`);
      lines.push(`Metode Bayar : ${trx.paymentMethod}`);
      if (trx.paymentMethod === 'Cash' && (trx.cashReceived || 0) > 0) {
        lines.push(`Tunai Diterima : ${rp(trx.cashReceived)}`);
        lines.push(`Kembalian      : ${rp(trx.change || 0)}`);
      }
      lines.push(`Status : *LUNAS*`);
      lines.push(``);
      lines.push(`${db.settings.receiptFooter || 'Terima kasih telah berbelanja di Kopi Jiwara!'}`);
      return lines.join('\n');
    }

    function getDateRangeBounds(period, customStart, customEnd) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const endOfToday = new Date(today);
      endOfToday.setHours(23, 59, 59, 999);

      if (period === 'TODAY') {
        return { start: today, end: endOfToday, label: 'Hari Ini' };
      }
      if (period === 'YESTERDAY') {
        const y1 = new Date(today);
        y1.setDate(y1.getDate() - 1);
        const y2 = new Date(y1);
        y2.setHours(23, 59, 59, 999);
        return { start: y1, end: y2, label: 'Kemarin' };
      }
      if (period === 'THIS_WEEK') {
        const w1 = new Date(today);
        const day = w1.getDay();
        const diffToMon = (day === 0 ? -6 : 1 - day);
        w1.setDate(w1.getDate() + diffToMon);
        return { start: w1, end: endOfToday, label: 'Minggu Ini (Sen–Min)' };
      }
      if (period === 'LAST_WEEK') {
        const w1 = new Date(today);
        const day = w1.getDay();
        const diffToMon = (day === 0 ? -6 : 1 - day) - 7;
        w1.setDate(w1.getDate() + diffToMon);
        const w2 = new Date(w1);
        w2.setDate(w1.getDate() + 6);
        w2.setHours(23, 59, 59, 999);
        return { start: w1, end: w2, label: 'Minggu Lalu' };
      }
      if (period === '7D') {
        const d7 = new Date(today);
        d7.setDate(d7.getDate() - 6);
        return { start: d7, end: endOfToday, label: '7 Hari Terakhir' };
      }
      if (period === 'MONTH') {
        const m1 = new Date(today.getFullYear(), today.getMonth(), 1);
        return { start: m1, end: endOfToday, label: 'Bulan Ini' };
      }
      const cs = customStart ? new Date(customStart + 'T00:00:00') : today;
      const ce = customEnd ? new Date(customEnd + 'T23:59:59') : endOfToday;
      return { start: cs, end: ce, label: `${customStart || todayISO()} s/d ${customEnd || todayISO()}` };
    }

    function isDateInBounds(isoDateStr, bounds) {
      if (!isoDateStr) return false;
      const d = new Date(isoDateStr + 'T12:00:00');
      return d >= bounds.start && d <= bounds.end;
    }

    // ==================== CLOUD WEBHOOK SYNC (2-WAY REALTIME) ====================
    let isPullingFromCloud = false;
    let lastCloudSyncTimeStr = '';

    function syncMasterEvent(eventType, payload) {
      const url = (db.settings.webhookUrl || '').trim();
      const record = {
        eventType,
        outlet: db.settings.outletName,
        timestamp: new Date().toISOString(),
        payload
      };
      if (!url) return;

      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record)
      }).catch(() => {
        db.offlineQueue.push(record);
        saveDB();
      });
    }

    function autoSyncMasterSlices(slices = []) {
      const url = (db.settings.webhookUrl || '').trim();
      if (!url) return;
      const data = {};
      if (slices.includes('products')) {
        data.products = db.products.map(p => ({
          ...p,
          brand: getProductBrand(p),
          includeCommissionShare: p.includeCommissionShare !== false,
          includeSalaryShare: p.includeSalaryShare !== false
        }));
      }
      if (slices.includes('inventory')) data.inventory = db.inventory;
      if (slices.includes('staff')) data.staff = db.staff;
      if (slices.includes('promos')) data.promos = db.promos;
      if (slices.includes('customers')) data.customers = db.customers;
      if (slices.includes('openOrders')) {
        data.openOrders = (db.transactions || []).filter(t => t.status === 'OPEN');
      }
      if (slices.includes('outlet')) {
        data.outletProfile = {
          outletName: db.settings.outletName || '',
          address: db.settings.address || '',
          phone: db.settings.phone || '',
          socialMedia: db.settings.socialMedia || '',
          receiptFooter: db.settings.receiptFooter || ''
        };
      }
      if (slices.includes('meta') || slices.includes('products')) {
        db.categories = normalizeUniqueCategories(db.categories);
        data.categories = db.categories;
        data.brandConfigs = db.brandConfigs || [];
        data.deletedBrands = db.deletedBrands || [];
      }
      syncMasterEvent('SYNC_MASTER_TABLES', data);
    }

    function updateHeaderCloudSyncBadge(isSyncing, customText = '') {
      const btn = document.getElementById('headerCloudSyncBtn');

        btn.classList.add('syncing');
        lbl.textContent = 'Menyinkron...';

        btn.classList.remove('syncing');
        lbl.textContent = customText || (lastCloudSyncTimeStr ? `Live • ${lastCloudSyncTimeStr}` : 'Live Sync');

    function isUserActivelyTyping() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = (el.tagName || '').toUpperCase();
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    async function pullFromCloudMaster(manualTrigger = false) {
      const url = (db.settings.webhookUrl || '').trim();
      if (!url) {
        if (manualTrigger) showToast('Isi & simpan URL Webhook terlebih dahulu.', true);
        return;
      }
      if (isPullingFromCloud) return;
      isPullingFromCloud = true;
      updateHeaderCloudSyncBadge(true);

      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=pull&t=${Date.now()}`, { method: 'GET' });
        const data = await res.json();
        if (!data || data.status !== 'OK') {
          throw new Error(data?.message || 'Respons cloud belum valid');
        }

        const changed = applyCloudPullData(data);
        const now = new Date();
        lastCloudSyncTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        updateHeaderCloudSyncBadge(false);

        if (manualTrigger) {
          showToast(changed ? 'Data terbaru dari Cloud berhasil diterapkan!' : 'Semua data di perangkat ini sudah paling mutakhir.');
          if (currentUser) renderWorkspace();
        } else if (changed && currentUser && document.getElementById('modalBackdrop')?.classList.contains('hidden') && !isUserActivelyTyping()) {
          renderWorkspace();
        }
      } catch (err) {
        updateHeaderCloudSyncBadge(false, 'Sync Retry');
        if (manualTrigger) {
          showToast('Gagal menarik data Cloud. Pastikan Google Apps Script sudah di-deploy versi v2.6 (Anyone).', true);
        }
      } finally {
        isPullingFromCloud = false;
      }
    }

    function applyCloudPullData(data) {
      let changed = false;

      if (data.outletProfile && typeof data.outletProfile === 'object') {
        const op = data.outletProfile;
        if (op.outletName && op.outletName !== db.settings.outletName) { db.settings.outletName = op.outletName; changed = true; }
        if (op.address !== undefined && op.address !== db.settings.address) { db.settings.address = op.address; changed = true; }
        if (op.phone !== undefined && op.phone !== db.settings.phone) { db.settings.phone = op.phone; changed = true; }
        if (op.socialMedia !== undefined && op.socialMedia !== db.settings.socialMedia) { db.settings.socialMedia = op.socialMedia; changed = true; }
        if (op.receiptFooter !== undefined && op.receiptFooter !== db.settings.receiptFooter) { db.settings.receiptFooter = op.receiptFooter; changed = true; }
      }

      if (Array.isArray(data.products) && data.products.length > 0) {
        const prevStr = JSON.stringify(db.products);
        const oldMap = new Map(db.products.map(p => [p.sku, p]));
        db.products = data.products.map((cp, idx) => {
          const old = oldMap.get(cp.sku);
          return {
            id: old ? old.id : ('PRD-' + (idx + 1) + '-' + cp.sku),
            sku: cp.sku,
            name: cp.name,
            category: String(cp.category || 'Kopi Jiwara').trim(),
            brand: cp.brand || 'Kopi Jiwara',
            includeCommissionShare: cp.includeCommissionShare !== false,
            includeSalaryShare: cp.includeSalaryShare !== false,
            unit: cp.unit || 'Cup',
            price: Number(cp.price) || 0,
            cost: Number(cp.cost) || 0,
            fav: Boolean(cp.fav),
            stock: old ? old.stock : 50
          };
        });

        const prevCats = JSON.stringify(db.categories);
        const rawMergedCats = Array.isArray(data.categories) && data.categories.length > 0
          ? [...data.categories, ...db.products.map(p => p.category)]
          : [...(db.categories || []), ...db.products.map(p => p.category)];
        db.categories = normalizeUniqueCategories(rawMergedCats);
        if (JSON.stringify(db.categories) !== prevCats) changed = true;

        if (Array.isArray(data.brandConfigs) && data.brandConfigs.length > 0) {
          const prevBr = JSON.stringify(db.brandConfigs);
          db.brandConfigs = data.brandConfigs;
          if (Array.isArray(data.deletedBrands)) db.deletedBrands = data.deletedBrands;
          if (JSON.stringify(db.brandConfigs) !== prevBr) changed = true;
        }

        if (JSON.stringify(db.products) !== prevStr) changed = true;
      } else if (Array.isArray(data.categories) && data.categories.length > 0) {
        const prevCats = JSON.stringify(db.categories);
        db.categories = normalizeUniqueCategories(data.categories);
        if (JSON.stringify(db.categories) !== prevCats) changed = true;
      }

      if (Array.isArray(data.inventory) && data.inventory.length > 0) {
        const prevStr = JSON.stringify(db.inventory);
        const oldInvMap = new Map(db.inventory.map(i => [i.sku, i]));
        db.inventory = data.inventory.map((ci, idx) => {
          const old = oldInvMap.get(ci.sku);
          return {
            id: old ? old.id : ('INV-' + (idx + 1) + '-' + ci.sku),
            sku: ci.sku,
            name: ci.name,
            category: ci.category || 'Bahan Baku',
            unit: ci.unit || 'Pcs',
            stock: Number(ci.stock) || 0,
            minStock: Number(ci.minStock) || 0,
            costPerUnit: Number(ci.costPerUnit) || 0
          };
        });
        if (JSON.stringify(db.inventory) !== prevStr) changed = true;
      }

      if (Array.isArray(data.staff) && data.staff.length > 0) {
        const prevStr = JSON.stringify(db.staff);
        db.staff = data.staff.map((cs, idx) => ({
          id: cs.id || ('STF-' + (idx + 1)),
          name: cs.name,
          role: cs.role || 'Kasir & Barista',
          pin: String(cs.pin || '1111').padStart(4, '0'),
          dailyWage: Number(cs.dailyWage) || 0,
          active: cs.active !== false
        }));
        if (JSON.stringify(db.staff) !== prevStr) changed = true;
      }

      if (Array.isArray(data.promos)) {
        const prevStr = JSON.stringify(db.promos);
        db.promos = data.promos.map((cp, idx) => ({
          id: cp.id || ('PRM-' + (idx + 1)),
          code: cp.code,
          title: cp.title,
          type: cp.type === 'NOMINAL' ? 'NOMINAL' : 'PERCENT',
          value: Number(cp.value) || 0,
          minPurchase: Number(cp.minPurchase) || 0,
          validUntil: cp.validUntil || '2026-12-31',
          active: cp.active !== false
        }));
        if (JSON.stringify(db.promos) !== prevStr) changed = true;
      }

      if (Array.isArray(data.customers) && data.customers.length > 0) {
        const prevStr = JSON.stringify(db.customers);
        db.customers = data.customers.map((cc, idx) => ({
          id: cc.id || ('CST-' + (idx + 1)),
          name: cc.name,
          phone: String(cc.phone || ''),
          tier: cc.tier || 'Regular',
          totalVisits: Number(cc.totalVisits) || 0,
          totalSpent: Number(cc.totalSpent) || 0,
          voucherCode: cc.voucherCode || '',
          voucherDiscount: Number(cc.voucherDiscount) || 0
        }));
        if (JSON.stringify(db.customers) !== prevStr) changed = true;
      }

      if (Array.isArray(data.openOrders)) {
        const localPaidIds = new Set(db.transactions.filter(t => t.status === 'PAID' || t.status === 'CANCELLED').map(t => t.id));
        const localOpenMap = new Map(db.transactions.filter(t => t.status === 'OPEN').map(t => [t.id, t]));
        const cloudOpenIds = new Set();

        data.openOrders.forEach(co => {
          if (!co || !co.id || localPaidIds.has(co.id)) return;
          cloudOpenIds.add(co.id);
          const existing = localOpenMap.get(co.id);
          if (!existing || JSON.stringify(existing.items) !== JSON.stringify(co.items) || existing.total !== co.total) {
            db.transactions = db.transactions.filter(t => t.id !== co.id);
            db.transactions.unshift({
              ...co,
              status: 'OPEN'
            });
            changed = true;
          }
        });

        const beforeLen = db.transactions.length;
        db.transactions = db.transactions.filter(t => t.status !== 'OPEN' || cloudOpenIds.has(t.id) || t.id === activeOpenOrderId);
        if (db.transactions.length !== beforeLen) changed = true;
      }

      if (Array.isArray(data.paidTransactions)) {
        const localMap = new Map(db.transactions.map(t => [t.id, t]));
        data.paidTransactions.forEach(pt => {
          if (!pt || !pt.id) return;
          const existing = localMap.get(pt.id);
          if (!existing) {
            db.transactions.push({
              id: pt.id,
              status: 'PAID',
              date: pt.date || todayISO(),
              time: pt.time || '00:00',
              orderType: pt.orderType || 'Meja',
              tableOrCustomer: pt.tableOrCustomer || '',
              customerId: '',
              cashier: pt.cashier || 'Cloud',
              items: Array.isArray(pt.items) ? pt.items : [],
              subtotal: Number(pt.subtotal) || Number(pt.total) || 0,
              discount: Number(pt.discount) || 0,
              promoCode: pt.promoCode || '',
              total: Number(pt.total) || 0,
              paymentMethod: pt.paymentMethod || 'Cash',
              cashReceived: Number(pt.total) || 0,
              change: 0
            });
            changed = true;
          } else if (existing.status === 'OPEN') {
            existing.status = 'PAID';
            existing.paymentMethod = pt.paymentMethod || existing.paymentMethod;
            existing.total = Number(pt.total) || existing.total;
            changed = true;
          }
        });
      }

      if (Array.isArray(data.cashDrawer)) {
        const localCashIds = new Set(db.cashDrawer.map(c => c.id));
        data.cashDrawer.forEach(cc => {
          if (cc && cc.id && !localCashIds.has(cc.id)) {
            db.cashDrawer.push({
              id: cc.id,
              date: cc.date || todayISO(),
              time: cc.time || '00:00',
              type: cc.type === 'OUT' ? 'OUT' : 'IN',
              amount: Number(cc.amount) || 0,
              note: cc.note || '',
              by: cc.by || 'Cloud'
            });
            changed = true;
          }
        });
      }

      if (changed) saveDB();
      return changed;
    }

    // ==================== BLUETOOTH THERMAL PRINTER ENGINE ====================
    let btPrinterDevice = null;
    let btPrinterCharacteristic = null;

    function buildEscPosBytesFromLines(lines) {
      const encoder = new TextEncoder();
      const chunks = [];
      chunks.push(new Uint8Array([0x1B, 0x40]));
      chunks.push(new Uint8Array([0x1B, 0x61, 0x01]));
      chunks.push(new Uint8Array([0x1B, 0x45, 0x01]));
      chunks.push(encoder.encode((db.settings.outletName || 'KOPI JIWARA') + '\n'));
      chunks.push(new Uint8Array([0x1B, 0x45, 0x00]));
      if (db.settings.address) chunks.push(encoder.encode(db.settings.address + '\n'));
      if (db.settings.phone) chunks.push(encoder.encode('Telp/WA: ' + db.settings.phone + '\n'));
      if (db.settings.socialMedia) chunks.push(encoder.encode('Sosmed: ' + db.settings.socialMedia + '\n'));
      chunks.push(new Uint8Array([0x1B, 0x61, 0x00]));

      lines.forEach(line => {
        chunks.push(encoder.encode(String(line) + '\n'));
      });
      chunks.push(encoder.encode('\n\n\n'));
      chunks.push(new Uint8Array([0x1D, 0x56, 0x42, 0x00]));

      const totalLen = chunks.reduce((sum, arr) => sum + arr.length, 0);
      const merged = new Uint8Array(totalLen);
      let offset = 0;
      chunks.forEach(arr => {
        merged.set(arr, offset);
        offset += arr.length;
      });
      return merged;
    }

    async function sendRawBytesToBluetooth(bytes) {
      if (!btPrinterCharacteristic) return false;
      const chunkSize = 100;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const slice = bytes.slice(i, i + chunkSize);
        if (btPrinterCharacteristic.writeValueWithoutResponse) {
          await btPrinterCharacteristic.writeValueWithoutResponse(slice);
        } else {
          await btPrinterCharacteristic.writeValue(slice);
        }
        await new Promise(r => setTimeout(r, 25));
      }
      return true;
    }

    async function scanAndLockBluetoothPrinter() {
      if (!navigator.bluetooth) {
        showToast('Browser ini belum mendukung Web Bluetooth langsung. Gunakan Chrome Android/Desktop atau sambungkan printer via Pengaturan Bluetooth perangkat.', true);
        return;
      }
      try {
        showToast('Memindai perangkat Printer Bluetooth terdekat...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb',
            '49535343-fe7d-4ae5-8fa9-9fafd205e455',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '0000ff00-0000-1000-8000-00805f9b34fb'
          ]
        });
        if (!device) return;

        showToast(`Menyambungkan ke ${device.name || 'Printer Bluetooth'}...`);
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        let foundChar = null;

        for (const srv of services) {
          const chars = await srv.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.write || ch.properties.writeWithoutResponse) {
              foundChar = ch;
              break;
            }
          }
          if (foundChar) break;
        }

        if (!foundChar) {
          showToast('Perangkat tersambung, namun kanal cetak ESC/POS tidak ditemukan.', true);
          return;
        }

        btPrinterDevice = device;
        btPrinterCharacteristic = foundChar;
        db.settings.printerName = device.name || 'Printer Thermal BT';
        db.settings.printerDeviceId = device.id || '';
        db.settings.printerLocked = true;
        saveDB();

        device.addEventListener('gattserverdisconnected', () => {
          btPrinterCharacteristic = null;
          if (currentUser && activeTab === 'settings' && settingsSubTab === 'SINKRON') {
            renderSettingsSinkron(document.getElementById('settingsSubBody'));
          }
        });

        renderSettingsSinkron(document.getElementById('settingsSubBody'));
        showToast(`Printer "${db.settings.printerName}" berhasil terhubung & dikunci!`);
      } catch (err) {
        if (err && err.name !== 'NotFoundError') {
          showToast('Gagal menyambungkan printer Bluetooth: ' + (err.message || 'Coba ulangi'), true);
        }
      }
    }

    async function testPrintBluetoothPrinter() {
      const lines = [
        '--------------------------------',
        'TEST KONEKSI PRINTER THERMAL',

            { id: 'inventory', label: 'Inventori' },
            { id: 'settings', label: 'Pengaturan' }
          ]
        : [
            { id: 'pos', label: 'Kasir' },
            { id: 'sales', label: 'Penjualan' },
            { id: 'kas_kasir', label: 'Kas Kasir' },
            { id: 'absensi', label: 'Absensi' },
            { id: 'keluar_kasir', label: 'Keluar Kasir' }
          ];

      if (!navItems.some(n => n.id === activeTab)) {
        activeTab = navItems[0].id;
      }

      const navBar = document.getElementById('mainNavBar');
      navBar.innerHTML = navItems.map(n => `
        <button type="button" class="nav-pill ${activeTab === n.id ? 'active' : ''}" onclick="switchTab('${n.id}')">${esc(n.label)}</button>
      `).join('');

      const area = document.getElementById('mainContentArea');
      if (activeTab === 'pos') renderPosTab(area);
      else if (activeTab === 'sales') renderSalesTab(area);
      else if (activeTab === 'report') renderReportTab(area);
      else if (activeTab === 'customers') renderCustomersTab(area);
      else if (activeTab === 'inventory') renderInventoryTab(area);
      else if (activeTab === 'settings') renderSettingsTab(area);
      else if (activeTab === 'kas_kasir') renderKasKasirTab(area);
      else if (activeTab === 'absensi') renderAbsensiTab(area);
      else if (activeTab === 'keluar_kasir') renderKeluarKasirTab(area);
    }

    function switchTab(tabId) {
      activeTab = tabId;
      renderWorkspace();
    }

    // ==================== CRM AUTO-SUGGESTION & AUTO-SAVE ====================
    function handleTableOrCustomerInput(val) {
      tableOrCustomerNote = val;
      const box = document.getElementById('crmSuggestBox');
      if (!box) return;
      const q = val.trim().toLowerCase();
      if (!q || q.startsWith('meja')) {
        box.classList.add('hidden');
        return;
      }
      const matches = (db.customers || []).filter(c =>
        (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q)
      ).slice(0, 6);

      if (matches.length === 0) {
        box.classList.add('hidden');
        return;
      }

      box.innerHTML = matches.map(c => `
        <div class="crm-suggest-item" onmousedown="applySuggestedCrmCustomer('${esc(c.id)}')">
          <div>
            <strong>${esc(c.name)}</strong>
            ${c.phone ? `<span style="font-size:11px;color:var(--text-muted);margin-left:6px;">${esc(c.phone)}</span>` : ''}
          </div>
          <span class="badge-pill badge-green">${esc(c.tier || 'Regular')}</span>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function applySuggestedCrmCustomer(custId) {
      const c = db.customers.find(x => x.id === custId);
      if (!c) return;
      selectedCustomerId = c.id;
      tableOrCustomerNote = c.name;
      if (c.phone) customerPhoneInput = c.phone;
      if (c.voucherCode && c.voucherDiscount > 0) {
        selectedPromoCode = '__CUST_VOUCHER__';
      }
      const box = document.getElementById('crmSuggestBox');
      if (box) box.classList.add('hidden');
      renderPosTab(document.getElementById('mainContentArea'));
      showToast(`Pelanggan CRM "${c.name}" dipilih.`);
    }

    function upsertCustomerToCRM(rawName, rawPhone, spentAmount = 0, incrementVisit = true) {
      const cleanName = String(rawName || '').trim();
      const cleanPhone = String(rawPhone || '').trim();
      const waPhone = formatWhatsAppPhone(cleanPhone);
      const isTableLabel = !cleanName || /^meja\s*\d*/i.test(cleanName);

      if (isTableLabel && !waPhone) return null;

      let cust = null;
      if (selectedCustomerId) {
        cust = db.customers.find(c => c.id === selectedCustomerId) || null;
      }
      if (!cust && waPhone) {
        cust = db.customers.find(c => formatWhatsAppPhone(c.phone) === waPhone) || null;
      }
      if (!cust && !isTableLabel) {
        cust = db.customers.find(c => (c.name || '').trim().toLowerCase() === cleanName.toLowerCase()) || null;
      }

      if (cust) {
        if (!isTableLabel && cleanName) cust.name = cleanName;
        if (cleanPhone) cust.phone = cleanPhone;
        if (incrementVisit) {
          cust.totalVisits = (cust.totalVisits || 0) + 1;
          cust.totalSpent = (cust.totalSpent || 0) + spentAmount;
        }
        if (cust.totalVisits >= 10) cust.tier = 'VIP Jiwara';
        else if (cust.totalVisits >= 5) cust.tier = 'Loyal';
        return cust;
      }

      const finalName = !isTableLabel ? cleanName : `Pelanggan ${cleanPhone.slice(-4)}`;
      const newCust = {
        id: 'CST-' + Date.now(),
        name: finalName,
        phone: cleanPhone,
        tier: 'Regular',
        totalVisits: incrementVisit ? 1 : 0,
        totalSpent: incrementVisit ? spentAmount : 0,
        voucherCode: '',
        voucherDiscount: 0
      };
      db.customers.unshift(newCust);
      return newCust;
    }
