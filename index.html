function buildPlainReceiptText(trxOrBill, isProforma = false) {
  const line = '--------------------------------';
  const rows = [
    db.settings.outletName.toUpperCase(),
    db.settings.outletAddress,
    db.settings.outletPhone ? `Telp/WA: ${db.settings.outletPhone}` : '',
    db.settings.outletSocial ? `IG/TikTok: ${db.settings.outletSocial}` : '',
    line,
    isProforma ? '*** BILL SEMENTARA ***' : `Nota : ${trxOrBill.id}`,
    `Waktu: ${trxOrBill.date} ${trxOrBill.time}`,
    `Order: ${trxOrBill.orderType} - ${trxOrBill.tableOrCustomer}`,
    `Kasir: ${trxOrBill.cashier}`,
    line
  ].filter(Boolean);

  trxOrBill.items.forEach(it => {
    rows.push(`${it.name}`);
    rows.push(`  ${it.qty} x ${it.price.toLocaleString('id-ID')} = ${(it.qty * it.price).toLocaleString('id-ID')}`);
  });

  rows.push(line);
  rows.push(`Subtotal : ${formatRp(trxOrBill.subtotal)}`);
  if (trxOrBill.discount > 0) rows.push(`Diskon   : -${formatRp(trxOrBill.discount)}`);
  rows.push(`TOTAL    : ${formatRp(trxOrBill.total)}`);
  if (!isProforma) rows.push(`Bayar    : ${trxOrBill.paymentMethod}`);
  rows.push(line);
  rows.push(db.settings.receiptFooter);
  rows.push('\n\n');
  return rows.join('\n');
}

async function ensureBtPrinterConnected() {
  if (btCharacteristic && btCharacteristic.service && btCharacteristic.service.device && btCharacteristic.service.device.gatt.connected) {
    return btCharacteristic;
  }
  if (btCharacteristic && btCharacteristic.service && btCharacteristic.service.device) {
    try {
      const server = await btCharacteristic.service.device.gatt.connect();
      const services = await server.getPrimaryServices();
      for (const srv of services) {
        const chars = await srv.getCharacteristics();
        for (const ch of chars) {
          if (ch.properties.write || ch.properties.writeWithoutResponse) {
            btCharacteristic = ch;
            return btCharacteristic;
          }
        }
      }
    } catch (e) {}
  }
  return null;
}

async function sendTextToPrinter(plainText) {
  const activeChar = await ensureBtPrinterConnected();
  if (activeChar) {
    try {
      const enc = new TextEncoder();
      const data = enc.encode(plainText);
      const chunkSize = 100;
      for (let i = 0; i < data.length; i += chunkSize) {
        await activeChar.writeValue(data.slice(i, i + chunkSize));
      }
      showToast('Struk dikirim ke Printer Bluetooth (' + (db.settings.printerName || 'Terkunci') + ')');
      return;
    } catch (e) {
      showToast('Koneksi Bluetooth terputus, beralih ke cetak browser...', true);
    }
  }
  const pa = document.getElementById('printArea');
  pa.innerHTML = `<pre style="margin:0;white-space:pre-wrap;font-size:11px;">${esc(plainText)}</pre>`;
  window.print();
}

function printReceiptForTrx(trxId) {

  sendTextToPrinter(buildPlainReceiptText(trx, false));

// ==================== SHARED PERIOD FILTER HELPER ====================
function getDateRangeForPeriod(periodKey, customStart, customEnd) {
  const today = todayISO();
  const now = new Date();
  if (periodKey === 'ALL_TIME') {
    return { start: '2020-01-01', end: '2099-12-31', label: 'Semua Waktu (Historis Lengkap)' };
  }
  if (periodKey === 'TODAY') {
    return { start: today, end: today, label: `Hari Ini (${today})` };
  }
  if (periodKey === 'YESTERDAY') {
    const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    const yStr = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    return { start: yStr, end: yStr, label: `Kemarin (${yStr})` };
  }
  if (periodKey === 'THIS_WEEK') {
    const day = now.getDay();
    const diffToMon = (day === 0 ? -6 : 1) - day;
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
    const mStr = mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
    return { start: mStr, end: today, label: `Minggu Ini (${mStr} s/d ${today})` };
  }
  if (periodKey === 'LAST_WEEK') {
    const day = now.getDay();
    const diffToMon = (day === 0 ? -6 : 1) - day;
    const thisMon = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMon);
    const lastMon = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - 7);
    const lastSun = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - 1);
    const sStr = lastMon.getFullYear() + '-' + String(lastMon.getMonth() + 1).padStart(2, '0') + '-' + String(lastMon.getDate()).padStart(2, '0');
    const eStr = lastSun.getFullYear() + '-' + String(lastSun.getMonth() + 1).padStart(2, '0') + '-' + String(lastSun.getDate()).padStart(2, '0');
    return { start: sStr, end: eStr, label: `Minggu Lalu (${sStr} s/d ${eStr})` };
  }
  if (periodKey === 'THIS_MONTH') {
    const sStr = today.slice(0, 7) + '-01';
    return { start: sStr, end: today, label: `Bulan Ini (${today.slice(0, 7)})` };
  }
  if (periodKey === 'LAST_MONTH') {
    const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lmEnd = new Date(now.getFullYear(), now.getMonth(), 0);
    const sStr = lm.getFullYear() + '-' + String(lm.getMonth() + 1).padStart(2, '0') + '-01';
    const eStr = lmEnd.getFullYear() + '-' + String(lmEnd.getMonth() + 1).padStart(2, '0') + '-' + String(lmEnd.getDate()).padStart(2, '0');
    return { start: sStr, end: eStr, label: `Bulan Lalu (${sStr.slice(0, 7)})` };
  }
  const s = customStart || today;
  const e = customEnd || s;
  return { start: s, end: e, label: `${s} s/d ${e}` };
}

function isDateInRange(dateStr, range) {
  const d = normalizeCloudDate(dateStr);
  return d >= range.start && d <= range.end;
}

function voidPaidTransaction(trxId) {
  const trx = db.transactions.find(t => t.id === trxId);
  if (!trx || trx.status !== 'PAID') return;
  requestManagerPinAuthorization(`Pembatalan Nota Lunas (Void) ${trx.id} senilai ${formatRp(trx.total)}`, (authorizer, reason) => {
    trx.status = 'CANCELLED';
    trx.items.forEach(it => {
      const p = db.products.find(x => x.id === it.id || x.sku === it.sku);
      if (p) p.stock += it.qty;
    });
    const invRestored = applyRecipeInventoryAdjustment(trx.items, 1, trx.id);
    const audit = {
      id: 'AUD-' + Date.now().toString().slice(-6),
      date: todayISO(),
      time: nowTimeStr(),
      orderId: trx.id,
      itemName: 'Void Nota Lunas (' + formatRp(trx.total) + ')',
      cashier: currentUser.name,
      authorizedBy: authorizer,
      reason
    };
    db.auditLogs.unshift(audit);
    saveDB();
    syncMasterEvent('PAID_TRX_CANCELLED', { id: trx.id, reason, authorizedBy: authorizer });
    syncMasterEvent('AUDIT_VOID_ITEM', audit);
    autoSyncMasterSlices(invRestored ? ['products', 'inventory'] : ['products']);
    renderWorkspace();
    showToast(`Nota ${trx.id} dibatalkan (VOID) & stok dikembalikan.`);
  });
}

function updateClosingDiff(expected) {
  const actual = Number(document.getElementById('closingActualCash').value) || 0;
  const diff = actual - expected;
  const lbl = document.getElementById('closingDiffLabel');
  lbl.textContent = `Selisih Kas Laci: ${formatRp(diff)}`;
  lbl.style.color = diff === 0 ? '#065F46' : '#BE185D';
}

function sendClosingReportWhatsApp(openingCash, cashSales, nonCashSales, cashIn, cashOut, expectedCash) {
  const actualCash = Number(document.getElementById('closingActualCash').value) || 0;
  const diff = actualCash - expectedCash;
  const shiftTrxs = db.shift.isOpen
    ? db.transactions.filter(t => t.status === 'PAID' && isRecordInActiveShift(t))
    : db.transactions.filter(t => t.date === todayISO() && t.status === 'PAID');
  const qrisSum = shiftTrxs.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0);
  const trfSum = shiftTrxs.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
  const onlSum = shiftTrxs.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);

  const itemSummary = {};
  shiftTrxs.forEach(t => t.items.forEach(it => {
    itemSummary[it.name] = (itemSummary[it.name] || 0) + it.qty;
  }));
  const itemLines = Object.entries(itemSummary).map(([k, v]) => `• ${k}: ${v}x`).join('\n') || '• Belum ada produk terjual';

  const msg = [
    `*LAPORAN TUTUP KASIR — ${db.settings.outletName}*`,
    `Tanggal: ${todayISO()} ${nowTimeStr()}`,
    `Kasir: ${currentUser.name}`,
    `-----------------------------`,
    `*RINCIAN PENJUALAN:*`,
    `• Tunai (Cash): ${formatRp(cashSales)}`,
    `• QRIS: ${formatRp(qrisSum)}`,
    `• Transfer: ${formatRp(trfSum)}`,
    `• Online Food: ${formatRp(onlSum)}`,
    `*Total Omzet: ${formatRp(cashSales + nonCashSales)}*`,
    `-----------------------------`,
    `*REKAP UANG LACI:*`,
    `• Modal Awal: ${formatRp(openingCash)}`,
    `• Kas Masuk: +${formatRp(cashIn)}`,
    `• Kas Keluar/Setoran: -${formatRp(cashOut)}`,
    `• Ekspektasi Laci: ${formatRp(expectedCash)}`,
    `• Uang Fisik Aktual: ${formatRp(actualCash)}`,
    `• Selisih Laci: ${formatRp(diff)}`,
    `-----------------------------`,
    `*PRODUK TERJUAL:*`,
    itemLines
  ].join('\n');

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function confirmCloseShift(openingCash, cashSales, nonCashSales, expectedCash) {
  const pin = document.getElementById('closingPinInput').value.trim();
  if (pin !== String(currentUser.pin)) return showToast('PIN Kasir tidak sesuai!', true);
  const actualCash = Number(document.getElementById('closingActualCash').value) || 0;

  const shiftTrxs = db.shift.isOpen
    ? db.transactions.filter(t => t.status === 'PAID' && isRecordInActiveShift(t))
    : db.transactions.filter(t => t.date === todayISO() && t.status === 'PAID');
  const closingRecord = {
    id: 'CLS-' + Date.now().toString().slice(-6),
    shiftId: getActiveShiftId(),
    date: todayISO(),
    time: nowTimeStr(),
    cashier: currentUser.name,
    openingCash,
    cashSales,
    qrisSales: shiftTrxs.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0),
    transferSales: shiftTrxs.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0),
    onlineSales: shiftTrxs.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0),
    totalSales: cashSales + nonCashSales,
    expectedCash,
    actualCash,
    diff: actualCash - expectedCash
  };

  db.closingHistory.unshift(closingRecord);
  db.shift = { isOpen: false, shiftId: '', openedBy: '', openedAt: '', openingCash: 0 };
  saveDB();
  syncMasterEvent('SHIFT_CLOSED', closingRecord);
  showToast('Shift kasir berhasil ditutup!');
  handleLogoutAction();
}

function getSettlementDateRange() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  if (settlementPeriodMode === 'this_month') {
    const start = `${y}-${String(m + 1).padStart(2, '0')}-01`;
    const end = todayISO();
    const monthName = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    return { start, end, label: `Bulan Ini (${monthName})` };
  }
  if (settlementPeriodMode === 'last_month') {
    const first = new Date(y, m - 1, 1);
    const last = new Date(y, m, 0);
    const start = `${first.getFullYear()}-${String(first.getMonth() + 1).padStart(2, '0')}-01`;
    const end = `${last.getFullYear()}-${String(last.getMonth() + 1).padStart(2, '0')}-${String(last.getDate()).padStart(2, '0')}`;
    const monthName = first.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    return { start, end, label: `Bulan Lalu (${monthName})` };
  }
  if (settlementPeriodMode === 'pick_month') {
    const ym = settlementSelectedMonth || todayISO().slice(0, 7);
    const [py, pm] = ym.split('-').map(Number);
    const first = new Date(py, (pm || 1) - 1, 1);
    const last = new Date(py, pm || 1, 0);
    const start = `${first.getFullYear()}-${String(first.getMonth() + 1).padStart(2, '0')}-01`;
    const end = `${last.getFullYear()}-${String(last.getMonth() + 1).padStart(2, '0')}-${String(last.getDate()).padStart(2, '0')}`;
    const monthName = first.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    return { start, end, label: `Bulan ${monthName}` };
  }
  if (settlementPeriodMode === 'this_week') {
    const day = now.getDay();
    const diffToMon = (day === 0 ? -6 : 1) - day;
    const mon = new Date(now);
    mon.setDate(now.getDate() + diffToMon);
    const s = mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
    return { start: s, end: todayISO(), label: `Minggu Ini (${s} s/d ${todayISO()})` };
  }
  if (settlementPeriodMode === 'last_week') {
    const day = now.getDay();
    const diffToMon = (day === 0 ? -6 : 1) - day;
    const thisMon = new Date(now);
    thisMon.setDate(now.getDate() + diffToMon);
    const lastMon = new Date(thisMon);
    lastMon.setDate(thisMon.getDate() - 7);
    const lastSun = new Date(thisMon);
    lastSun.setDate(thisMon.getDate() - 1);
    const s = lastMon.getFullYear() + '-' + String(lastMon.getMonth() + 1).padStart(2, '0') + '-' + String(lastMon.getDate()).padStart(2, '0');
    const e = lastSun.getFullYear() + '-' + String(lastSun.getMonth() + 1).padStart(2, '0') + '-' + String(lastSun.getDate()).padStart(2, '0');
    return { start: s, end: e, label: `Minggu Lalu (${s} s/d ${e})` };
  }
  return { start: settlementCustomStart, end: settlementCustomEnd, label: `${settlementCustomStart} s/d ${settlementCustomEnd}` };
}

function renderSettlementSubtab(box) {
  const range = getSettlementDateRange();
  const paidTrx = db.transactions.filter(t => t.status === 'PAID' && isDateInRange(t.date, range));
  const periodCashflows = db.cashflow.filter(c => isDateInRange(c.date, range));

  const autoWageSum = db.attendance
    .filter(a => isDateInRange(a.date, range))
    .reduce((s, a) => s + (a.wageEarned || 0), 0);
  const cashflowWageSum = periodCashflows
    .filter(c => c.type === 'OUT' && (c.category.toLowerCase().includes('gaji') || c.note.toLowerCase().includes('gaji')))
    .reduce((s, c) => s + c.amount, 0);
  const detectedPeriodWage = autoWageSum > 0 ? autoWageSum : cashflowWageSum;
  const totalPeriodWage = db.manualPeriodSalary !== null ? Number(db.manualPeriodSalary) : detectedPeriodWage;

  const cashflowSalesIn = periodCashflows
    .filter(c => c.type === 'IN' && /sales|penjualan/i.test(c.category + ' ' + c.note))
    .reduce((s, c) => s + c.amount, 0);
  const posGrossTotal = paidTrx.reduce((s, t) => s + t.total, 0);
  const combinedSalesIn = posGrossTotal + cashflowSalesIn;

  const cashflowSettlementOut = periodCashflows
    .filter(c => c.type === 'OUT' && (/setoran brand/i.test(c.category) || /^transfer sales/i.test(c.note.trim())))
    .reduce((s, c) => s + c.amount, 0);

  const activeBrandList = getActiveBrands().filter(b => {
    const cfg = db.brandConfig[b] || {};
    return cfg.active !== false;
  });

  const brandStats = {};
  activeBrandList.forEach(b => {
    brandStats[b] = { qty: 0, gross: 0, commEligibleSales: 0, salaryEligibleQty: 0 };
  });

  let totalSalaryEligibleQtyAll = 0;
  paidTrx.forEach(t => t.items.forEach(it => {
    const b = it.brand || 'Kopi Jiwara';
    if (!brandStats[b]) {
      const cfg = db.brandConfig[b] || {};
      if (cfg.active === false) return;
      brandStats[b] = { qty: 0, gross: 0, commEligibleSales: 0, salaryEligibleQty: 0 };
    }
    const itemTotal = it.price * it.qty;
    brandStats[b].qty += it.qty;
    brandStats[b].gross += itemTotal;
    if (it.includeCommissionShare !== false) {
      brandStats[b].commEligibleSales += itemTotal;
    }
    if (it.includeSalaryShare !== false) {
      brandStats[b].salaryEligibleQty += it.qty;
      totalSalaryEligibleQtyAll += it.qty;
    }
  }));

  const rows = Object.keys(brandStats).map(brand => {
    const cfg = db.brandConfig[brand] || { commissionPct: 10, salarySharePct: 0, waNumber: '', active: true };
    const st = brandStats[brand];
    const commCut = Math.round(st.commEligibleSales * ((Number(cfg.commissionPct) || 0) / 100));
    const salCut = totalSalaryEligibleQtyAll > 0 && st.salaryEligibleQty > 0
      ? Math.round(totalPeriodWage * (st.salaryEligibleQty / totalSalaryEligibleQtyAll))
      : 0;
    const netTransfer = Math.max(0, st.gross - commCut - salCut);

    const periodSettlements = db.brandSettlements.filter(s => s.brand === brand && isDateInRange(s.date, range));
    const cfBrandTransfers = periodCashflows.filter(c =>
      c.type === 'OUT' &&
      (/setoran brand/i.test(c.category) || /^transfer sales/i.test(c.note.trim())) &&
      c.note.toLowerCase().includes(brand.toLowerCase())
    );
    const alreadyTransferredAmount = periodSettlements.length > 0
      ? periodSettlements.reduce((sum, s) => sum + (Number(s.netTransfer) || 0), 0)
      : cfBrandTransfers.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);

    return {
      brand,
      qty: st.qty,
      gross: st.gross,
      commPct: cfg.commissionPct,
      commCut,
      salCut,
      netTransfer,
      waNumber: cfg.waNumber || '',
      alreadyTransferredAmount
    };
  });

  const periodHistory = db.brandSettlements.filter(s => isDateInRange(s.date, range));

  box.innerHTML = `

      </div>
      <div class="kpi-tile yellow">
        <div class="kpi-label">Total Beban Gaji Periode</div>
        <div class="kpi-value">${formatRp(totalPeriodWage)}</div>

      <div class="kpi-tile">

      <div class="kpi-tile pink">

function saveManualSettlementFromCashflow() {
  const brand = document.getElementById('manStlBrand').value;
  const dateVal = document.getElementById('manStlDate').value || todayISO();
  const periodLabel = document.getElementById('manStlPeriod').value.trim() || 'Bulanan';
  const grossSales = Math.max(0, Number(document.getElementById('manStlGross').value) || 0);
  const commissionCut = Math.max(0, Number(document.getElementById('manStlComm').value) || 0);
  const salaryCut = Math.max(0, Number(document.getElementById('manStlSal').value) || 0);
  const netTransfer = Math.max(0, Number(document.getElementById('manStlNet').value) || 0);
  const cfg = db.brandConfig[brand] || { commissionPct: 10 };

  if (netTransfer <= 0) return showToast('Masukkan nominal Net Transfer dengan benar!', true);

  const stl = {
    id: 'STL-' + Date.now().toString().slice(-6),
    date: dateVal,
    periodLabel,
    brand,
    grossSales: grossSales || (netTransfer + commissionCut + salaryCut),
    commissionPct: cfg.commissionPct || 10,
    commissionCut,
    salaryCut,
    netTransfer,
    pic: currentUser.name
  };
  db.brandSettlements.unshift(stl);

  const cf = {
    id: 'CF-' + (Date.now() + 1).toString().slice(-6),
    date: dateVal,
    time: nowTimeStr(),
    type: 'OUT',
    category: 'Setoran Brand Owner',
    amount: netTransfer,
    note: `Transfer Sales ${brand} (${periodLabel})`,
    pic: currentUser.name
  };
  db.cashflow.unshift(cf);
  saveDB();
  syncMasterEvent('BRAND_SETTLEMENT_PAID', stl);
  syncMasterEvent('CASHFLOW_ADDED', cf);
  closeModal();
  renderWorkspace();
  showToast(`Settlement ${brand} (${formatRp(netTransfer)}) tercatat ke Arus Kas!`);
}

function sendSettlementWhatsApp(brand, periodLabel, qty, gross, commPct, commCut, salCut, netTransfer, waNumber) {
  const msg = [
    `*BERITA ACARA SETTLEMENT — ${db.settings.outletName}*`,
    `Brand: *${brand}*`,
    `Periode: ${periodLabel}`,
    `-----------------------------`,
    `• Total Item Terjual: ${qty} porsi`,
    `• Omzet Kotor Brand: ${formatRp(gross)}`,
    `• Potongan Komisi (${commPct}%): -${formatRp(commCut)}`,
    `• Potongan Porsi Beban Gaji: -${formatRp(salCut)}`,
    `-----------------------------`,
    `*NET WAJIB TRANSFER: ${formatRp(netTransfer)}*`,
    `Terima kasih atas kerja samanya!`
  ].join('\n');

  let cleanWa = String(waNumber || '').replace(/\D/g, '');
  if (cleanWa.startsWith('0')) cleanWa = '62' + cleanWa.slice(1);
  const url = cleanWa ? `https://wa.me/${cleanWa}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function renderCashflowSubtab(box) {
  const range = getDateRangeForPeriod(reportPeriod, reportCustomStart, reportCustomEnd);
  const drawer = getDrawerLiveCashState();

  // Hitung Saldo Terakhir Keseluruhan dari seluruh riwayat buku kas + penjualan POS yang belum dicatat manual di buku kas
  const allCfIn = db.cashflow.filter(c => c.type === 'IN').reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const allCfOut = db.cashflow.filter(c => c.type === 'OUT').reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const hasManualSalesInCf = db.cashflow.some(c => c.type === 'IN' && /sales|penjualan/i.test(`${c.category} ${c.note}`));
  const allPaidPosSales = db.transactions.filter(t => t.status === 'PAID').reduce((s, t) => s + (Number(t.total) || 0), 0);
  const unrecordedPosSales = hasManualSalesInCf ? 0 : allPaidPosSales;
  const cumulativeBookBalance = (allCfIn + unrecordedPosSales) - allCfOut;

  // Hitung Arus Kas khusus periode terpilih
  const periodCashflows = db.cashflow.filter(c => isDateInRange(c.date, range));
  const periodCfIn = periodCashflows.filter(c => c.type === 'IN').reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const periodCfOut = periodCashflows.filter(c => c.type === 'OUT').reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const periodPaidPos = db.transactions
    .filter(t => t.status === 'PAID' && isDateInRange(t.date, range))
    .reduce((s, t) => s + (Number(t.total) || 0), 0);
  const periodHasManualSales = periodCashflows.some(c => c.type === 'IN' && /sales|penjualan/i.test(`${c.category} ${c.note}`));
  const totalPeriodIn = periodCfIn + (periodHasManualSales ? 0 : periodPaidPos);

  const allLedgerRows = db.cashflow.slice().sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
  let runningBal = 0;
  const runningBalMap = new Map();
  allLedgerRows.forEach(row => {
    runningBal += row.type === 'IN' ? (Number(row.amount) || 0) : -(Number(row.amount) || 0);
    runningBalMap.set(row.id, runningBal);
  });

  box.innerHTML = `
    <div class="bento-grid-4" style="margin-bottom:14px;">
      <div class="kpi-tile dark">
        <div class="kpi-label">Saldo Terakhir Buku Kas (Keseluruhan)</div>
        <div class="kpi-value">${formatRp(cumulativeBookBalance)}</div>
        <div class="kpi-sub">Total Masuk: ${formatRp(allCfIn + unrecordedPosSales)} • Keluar: ${formatRp(allCfOut)}</div>
      </div>
      <div class="kpi-tile yellow">
        <div class="kpi-label">${drawer.isOpen ? 'Saldo Cash di Laci Kasir (Live)' : 'Saldo Akhir Laci (Setelah Tutup Shift)'}</div>
        <div class="kpi-value">${formatRp(drawer.expectedCash)}</div>
        <div class="kpi-sub">${drawer.isOpen ? 'Shift Aktif: ' + esc(drawer.openedBy) + ' (Modal ' + formatRp(drawer.openingCash) + ')' : (drawer.lastClosing ? 'Tutup Shift: ' + esc(drawer.lastClosing.cashier) + ' (' + esc(drawer.lastClosing.time) + ')' : 'Shift sedang tutup')}</div>
      </div>
      <div class="kpi-tile">
        <div class="kpi-label">Arus Masuk (${esc(range.label)})</div>
        <div class="kpi-value" style="color:#065F46;">+${formatRp(totalPeriodIn)}</div>
        <div class="kpi-sub">Buku Kas: ${formatRp(periodCfIn)}${!periodHasManualSales && periodPaidPos > 0 ? ' • POS: ' + formatRp(periodPaidPos) : ''}</div>
      </div>
      <div class="kpi-tile pink">
        <div class="kpi-label">Arus Keluar (${esc(range.label)})</div>
        <div class="kpi-value">-${formatRp(periodCfOut)}</div>
        <div class="kpi-sub">Selisih Periode: ${formatRp(totalPeriodIn - periodCfOut)}</div>
      </div>
    </div>

    <div class="bento-card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <div>
          <h3 style="margin:0;font-size:16px;">Buku Besar Arus Kas & Biaya Operasional (${esc(range.label)})</h3>
          <div style="font-size:11px;color:var(--text-muted);">Menampilkan seluruh catatan pemasukan, belanja operasional, gaji, dan transfer settlement beserta saldo berjalan.</div>
        </div>
        <button class="btn btn-dark btn-sm" onclick="openOwnerCashflowModal()">+ Catat Biaya / Pemasukan</button>
      </div>
      <div class="table-box">
        <table class="compact-table">
          <thead><tr><th>Tanggal & Jam</th><th>Kategori</th><th>Keterangan</th><th>PIC</th><th>Nominal</th><th>Saldo Buku Kas</th></tr></thead>
          <tbody>
            ${periodCashflows.length === 0
              ? `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted);">Belum ada mutasi arus kas pada periode ${esc(range.label)}.</td></tr>`
              : periodCashflows.map(c => `
                <tr>
                  <td>${esc(c.date)} ${esc(c.time)}</td>
                  <td><strong>${esc(c.category)}</strong></td>
                  <td>${esc(c.note)}</td>
                  <td>${esc(c.pic)}</td>
                  <td style="font-weight:900;color:${c.type === 'IN' ? '#065F46' : '#BE185D'};">${c.type === 'IN' ? '+' : '-'}${formatRp(c.amount)}</td>
                  <td><strong>${formatRp(runningBalMap.get(c.id) || 0)}</strong></td>
                </tr>
              `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="bento-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
        <div>
          <h3 style="margin:0;font-size:15px;">Riwayat Serah Terima & Tutup Shift Kasir</h3>
          <div style="font-size:11px;color:var(--text-muted);">Catatan aktual uang cash kasir sebelum & sesudah tutup kasir / pergantian shift.</div>
        </div>
        <span class="badge-pill badge-green">${db.closingHistory.length} Riwayat Shift</span>
      </div>
      <div class="table-box">
        <table class="compact-table">
          <thead>
            <tr>
              <th>Tanggal & Jam</th>
              <th>Kasir Shift</th>
              <th>Modal Awal</th>
              <th>Sales Cash</th>
              <th>Non-Tunai</th>
              <th>Ekspektasi Laci</th>
              <th>Aktual Uang Laci</th>
              <th>Selisih</th>
            </tr>
          </thead>
          <tbody>
            ${db.closingHistory.length === 0
              ? `<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted);">Belum ada riwayat tutup kasir / serah terima shift.</td></tr>`
              : db.closingHistory.map(cl => {
                const nonCash = (cl.qrisSales || 0) + (cl.transferSales || 0) + (cl.onlineSales || 0);
                return `
                  <tr>
                    <td>${esc(cl.date)} ${esc(cl.time)}</td>
                    <td><strong>${esc(cl.cashier)}</strong></td>
                    <td>${formatRp(cl.openingCash)}</td>
                    <td>${formatRp(cl.cashSales)}</td>
                    <td>${formatRp(nonCash)}</td>
                    <td>${formatRp(cl.expectedCash)}</td>
                    <td><strong style="color:#065F46;">${formatRp(cl.actualCash)}</strong></td>
                    <td><span class="badge-pill ${cl.diff === 0 ? 'badge-green' : 'badge-pink'}">${formatRp(cl.diff)}</span></td>
                  </tr>
                `;
              }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

    if (!agg[it.name]) agg[it.name] = { brand: it.brand, qty: 0, rev: 0, profit: 0 };
    agg[it.name].qty += it.qty;
    agg[it.name].rev += it.price * it.qty;
    agg[it.name].profit += (it.price - (it.cost || 0)) * it.qty;

function saveNewCustomer() {
  const name = document.getElementById('crmName').value.trim();
  const phone = document.getElementById('crmPhone').value.trim();
  const specialVoucher = document.getElementById('crmVoucher').value.trim().toUpperCase();
  const voucherDiscount = Math.max(0, Number(document.getElementById('crmDisc').value) || 0);
  if (!name) return showToast('Nama pelanggan wajib diisi!', true);
  db.customers.unshift({
    id: 'CST-' + Date.now().toString().slice(-6),
    name,
    phone,
    tier: 'Member Aktif',
    visits: 1,
    totalSpend: 0,
    specialVoucher,
    voucherDiscount,
    voucherExpiry: '2026-12-31'
  });
  saveDB();
  autoSyncMasterSlices(['customers']);
  closeModal();
  renderWorkspace();
  showToast('Data pelanggan tersimpan!');
}

function openEditCustomerModal(custId) {
  const c = db.customers.find(x => x.id === custId);
  if (!c) return;
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Edit Pelanggan & Voucher</h3><button class="close-circle" onclick="closeModal()">x</button></div>
    <div style="margin-bottom:10px;"><label class="field-label">Nama Pelanggan</label><input id="editCrmName" type="text" class="styled-input" value="${esc(c.name)}" /></div>
    <div style="margin-bottom:10px;"><label class="field-label">No. WhatsApp</label><input id="editCrmPhone" type="tel" class="styled-input" value="${esc(c.phone || '')}" /></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      <div><label class="field-label">Kode Voucher Khusus</label><input id="editCrmVoucher" type="text" class="styled-input" value="${esc(c.specialVoucher || '')}" /></div>
      <div><label class="field-label">Potongan (Rp)</label><input id="editCrmDisc" type="number" class="styled-input" value="${c.voucherDiscount || 0}" /></div>
    </div>
    <button class="btn btn-dark" style="width:100%;" onclick="saveEditedCustomer('${c.id}')">Simpan Perubahan</button>
  `);
}

function saveEditedCustomer(custId) {
  const c = db.customers.find(x => x.id === custId);
  if (!c) return;
  c.name = document.getElementById('editCrmName').value.trim() || c.name;
  c.phone = document.getElementById('editCrmPhone').value.trim();
  c.specialVoucher = document.getElementById('editCrmVoucher').value.trim().toUpperCase();
  c.voucherDiscount = Math.max(0, Number(document.getElementById('editCrmDisc').value) || 0);
  saveDB();
  autoSyncMasterSlices(['customers']);
  closeModal();
  renderWorkspace();
  showToast('Data pelanggan diperbarui!');
}

function sendVoucherWa(custId) {
  const c = db.customers.find(x => x.id === custId);
  if (!c) return;
  const msg = `Halo Kak *${c.name}*! Terima kasih telah menjadi pelanggan setia *${db.settings.outletName}*.\n` +
    (c.specialVoucher ? `Gunakan kode voucher khusus Anda: *${c.specialVoucher}* untuk potongan *${formatRp(c.voucherDiscount)}* pada kunjungan berikutnya!` : `Dapatkan promo spesial hari ini di Kopi Jiwara!`);
  const cleanPhone = formatWaPhoneIndonesia(c.phone);
  const url = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

  const br = batchId ? db.batchRecipes.find(x => x.id === batchId) : null;

function updateBatchProductionPreview() {
  const bId = document.getElementById('prodBatchSelect').value;
  const mult = Math.max(0.1, Number(document.getElementById('prodBatchMult').value) || 1);
  const br = db.batchRecipes.find(b => b.id === bId);
  const box = document.getElementById('prodBatchPreviewBox');
  const actualInp = document.getElementById('prodBatchActualYield');
  if (!br || !box) return;

  const outInv = db.inventory.find(i => i.code === br.outputInvCode);
  const unit = outInv ? outInv.unit : 'ml';
  const expectedYield = Math.round(br.targetYield * mult * 100) / 100;
  if (actualInp) actualInp.value = expectedYield;

  let totalCost = 0;
  const lines = (br.ingredients || []).map(ing => {
    const raw = db.inventory.find(i => i.code === ing.invCode);
    const needQty = Math.round(ing.qty * mult * 100) / 100;
    const cost = raw ? (Number(raw.costPerUnit) || 0) * needQty : 0;
    totalCost += cost;
    const sisa = raw ? raw.stock : 0;
    return `• ${raw ? esc(raw.name) : esc(ing.invCode)}: <strong>-${needQty} ${raw ? esc(raw.unit) : ''}</strong> (Sisa gudang: ${sisa})`;
  });

  box.innerHTML = `
    <div style="font-weight:900;margin-bottom:4px;">Bahan Mentah Terpakai:</div>
    <div style="margin-bottom:6px;line-height:1.45;">${lines.join('<br/>')}</div>
    <div style="border-top:1px dashed var(--border-glass);padding-top:6px;display:flex;justify-content:space-between;">
      <span>Target Yield: <strong>${expectedYield} ${esc(unit)}</strong></span>
      <span>Total Modal Bahan: <strong>${formatRp(totalCost)}</strong></span>
    </div>
  `;
}

function confirmBatchProduction() {
  const bId = document.getElementById('prodBatchSelect').value;
  const mult = Math.max(0.1, Number(document.getElementById('prodBatchMult').value) || 1);
  const actualYield = Math.max(0.01, Number(document.getElementById('prodBatchActualYield').value) || 0);
  const calNote = document.getElementById('prodBatchCalNote').value.trim();
  const br = db.batchRecipes.find(b => b.id === bId);
  if (!br) return;

  const outInv = db.inventory.find(i => i.code === br.outputInvCode);
  if (!outInv) return showToast('Item output Pre-Batch tidak ditemukan di Gudang!', true);

  let totalModal = 0;
  const usedSummary = [];

  (br.ingredients || []).forEach(ing => {
    const raw = db.inventory.find(i => i.code === ing.invCode);
    if (!raw) return;
    const needQty = Math.round(ing.qty * mult * 1000) / 1000;
    totalModal += (Number(raw.costPerUnit) || 0) * needQty;
    raw.stock = Math.max(0, Math.round((raw.stock - needQty) * 1000) / 1000);
    raw.lastOpname = todayISO();
    usedSummary.push(`${raw.name} (${needQty} ${raw.unit})`);

    const logOut = {
      id: 'LOG-' + Date.now().toString().slice(-6) + '-' + Math.floor(Math.random() * 90 + 10),
      date: todayISO(),
      time: nowTimeStr(),
      itemName: raw.name,
      type: `Produksi Pre-Batch (${br.name})`,
      qty: needQty,
      afterStock: raw.stock,
      pic: currentUser.name
    };
    db.stockLogs.unshift(logOut);
    syncMasterEvent('INVENTORY_STOCK_ADJUSTED', logOut);
  });

  const prevStock = Number(outInv.stock) || 0;
  const prevCost = Number(outInv.costPerUnit) || 0;
  const newStock = Math.round((prevStock + actualYield) * 1000) / 1000;
  const batchHppPerUnit = actualYield > 0 ? Math.round((totalModal / actualYield) * 100) / 100 : prevCost;
  const weightedCost = newStock > 0
    ? Math.round(((prevStock * prevCost) + totalModal) / newStock * 100) / 100
    : batchHppPerUnit;

  outInv.stock = newStock;
  if (totalModal > 0) outInv.costPerUnit = weightedCost;
  outInv.lastOpname = todayISO();

  const logIn = {
    id: 'LOG-' + (Date.now() + 1).toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    itemName: outInv.name,
    type: `Hasil Pre-Batch (${mult}x batch)`,
    qty: actualYield,
    afterStock: outInv.stock,
    pic: currentUser.name
  };
  db.stockLogs.unshift(logIn);
  syncMasterEvent('INVENTORY_STOCK_ADJUSTED', logIn);

  const batchLog = {
    id: 'PBL-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    batchName: `${br.name} (${mult}x)`,
    outputName: outInv.name,
    targetYield: Math.round(br.targetYield * mult * 100) / 100,
    actualYield,
    unit: outInv.unit,
    totalCost: Math.round(totalModal),
    hppPerUnit: batchHppPerUnit,
    ingredientsSummary: usedSummary.join(', '),
    calibrationNote: calNote || 'Kalibrasi sesuai takaran',
    pic: currentUser.name
  };
  db.batchLogs.unshift(batchLog);
  syncMasterEvent('PREBATCH_PRODUCED', batchLog);

  saveDB();
  autoSyncMasterSlices(['inventory']);
  closeModal();
  renderWorkspace();
  showToast(`Produksi ${outInv.name} (+${actualYield} ${outInv.unit}) selesai & terkalibrasi!`);
}

function confirmStockAdjust(invId) {
  const inv = db.inventory.find(i => i.id === invId);
  const type = document.getElementById('stkMutType').value;

  if (type.includes('Masuk')) inv.stock = Math.round((inv.stock + qty) * 1000) / 1000;
  else if (type.includes('Opname')) inv.stock = qty;
  else inv.stock = Math.max(0, Math.round((inv.stock - qty) * 1000) / 1000);
  inv.lastOpname = todayISO();

  const logEntry = {
    id: 'LOG-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    itemName: inv.name,
    type,
    qty,
    afterStock: inv.stock,
    pic: currentUser.name
  };
  db.stockLogs.unshift(logEntry);
  saveDB();
  syncMasterEvent('INVENTORY_STOCK_ADJUSTED', logEntry);

  renderWorkspace();
  showToast('Stok gudang diperbarui!');

function handleOutletLogoUpload(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 200;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const compressed = canvas.toDataURL('image/png', 0.9);
      db.settings.logoDataUrl = compressed;
      saveDB();
      updateTopBarHeader();
      const prevEl = document.getElementById('settingsLogoPreview');
      if (prevEl) prevEl.src = compressed;
      showToast('Logo outlet berhasil diperbarui!');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function cleanDate_(val) {
  if (val === undefined || val === null || val === '') return '';
  if (val instanceof Date) {
    if (val.getFullYear() <= 1900) return '';
    return Utilities.formatDate(val, 'Asia/Jakarta', 'yyyy-MM-dd');
  }
  var s = String(val).trim();
  var m = s.match(/^(\\d{4}-\\d{2}-\\d{2})/);
  return m ? m[1] : s;
}

function cleanTime_(val) {
  if (val === undefined || val === null || val === '') return '';
  if (val instanceof Date) {
    return Utilities.formatDate(val, 'Asia/Jakarta', 'HH:mm');
  }
  var s = String(val).trim();
  if (s === '-') return '-';
  var m = s.match(/(\\d{1,2}):(\\d{2})(?::\\d{2})?/);
  if (m) return ('0' + m[1]).slice(-2) + ':' + ('0' + m[2]).slice(-2);
  return s;
}

function readSheetObjects(ss, name) {
  var sh = ss.getSheetByName(name);
  if (!sh || sh.getLastRow() < 2) return [];
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rows = sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).getValues();
  return rows.map(function(r) {
    var obj = {};
    headers.forEach(function(h, idx) { obj[h] = r[idx]; });
    return obj;
  });
}

function writeSheetByHeaders(ss, name, defaultHeaders, rowsData) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).clearContent();
  }
  if (rowsData && rowsData.length > 0) {
    var matrix = rowsData.map(function(rowObj) {
      return headers.map(function(h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
    });
    var range = sh.getRange(2, 1, matrix.length, headers.length);
    range.setValues(matrix);
    headers.forEach(function(h, idx) {
      if (h === 'Tanggal' || h === 'Jam' || h === 'Jam_Masuk' || h === 'Jam_Pulang') {
        sh.getRange(2, idx + 1, matrix.length, 1).setNumberFormat('@');
      }
    });
  }
}

function appendRowByHeaders(ss, name, defaultHeaders, rowObj) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rowArr = headers.map(function(h) {
    var val = rowObj[h] !== undefined ? rowObj[h] : '';
    if (h === 'Tanggal') return cleanDate_(val);
    if (h === 'Jam' || h === 'Jam_Masuk' || h === 'Jam_Pulang') return cleanTime_(val);
    return val;
  });
  var nextRow = sh.getLastRow() + 1;
  sh.getRange(nextRow, 1, 1, rowArr.length).setValues([rowArr]);
  headers.forEach(function(h, idx) {
    if (h === 'Tanggal' || h === 'Jam' || h === 'Jam_Masuk' || h === 'Jam_Pulang') {
      sh.getRange(nextRow, idx + 1).setNumberFormat('@');
    }
  });
}

    var kredit = Number(r.Kredit_Keluar) || 0;
    var isOut = kredit > 0;
    return {
      id: String(r.ID_Kas), date: cleanDate_(r.Tanggal), time: cleanTime_(r.Jam),
      type: isOut ? 'OUT' : 'IN', category: String(r.Kategori_Kas || 'Operasional'),
      amount: isOut ? kredit : debit, note: String(r.Keterangan || ''), pic: String(r.PIC || 'System')
    };
  });

  var attendance = readSheetObjects(ss, 'ABSENSI_KARYAWAN').slice(-100).filter(function(r) { return r.Nama_Pegawai; }).map(function(r) {
    return {
      date: cleanDate_(r.Tanggal), staffName: String(r.Nama_Pegawai), role: String(r.Jabatan || ''),
      clockIn: cleanTime_(r.Jam_Masuk) || '-', clockOut: cleanTime_(r.Jam_Pulang) || '-',
      wageEarned: Number(r.Upah_Harian) || 0, status: String(r.Status || 'Hadir')
    };
  });

  var closingHistory = readSheetObjects(ss, 'CLOSING_SHIFT').slice(-60).filter(function(r) { return r.ID_Closing; }).map(function(r) {
    return {
      id: String(r.ID_Closing), date: cleanDate_(r.Tanggal), time: cleanTime_(r.Jam), cashier: String(r.Kasir),
      openingCash: Number(r.Modal_Awal) || 0, cashSales: Number(r.Sales_Cash) || 0,
      qrisSales: Number(r.Sales_QRIS) || 0, transferSales: Number(r.Sales_Transfer) || 0,
      onlineSales: Number(r.Sales_Online) || 0, totalSales: Number(r.Total_Omzet) || 0,
      expectedCash: Number(r.Ekspektasi_Cash_Laci) || 0, actualCash: Number(r.Uang_Fisik_Laci) || 0,
      diff: Number(r.Selisih_Laci) || 0
    };
  });

  var auditLogs = readSheetObjects(ss, 'AUDIT_OTORISASI').slice(-80).filter(function(r) { return r.ID_Audit; }).map(function(r) {
    return {
      id: String(r.ID_Audit), date: cleanDate_(r.Tanggal), time: cleanTime_(r.Jam),
      orderId: String(r.No_Order_Nota || '-'), itemName: String(r.Tindakan_Item || '-'),
      cashier: String(r.Kasir || '-'), authorizedBy: String(r.Otorisasi_Oleh || '-'), reason: String(r.Alasan || '-')
    };
  });

  var stockLogs = readSheetObjects(ss, 'LOG_STOK_GUDANG').slice(-80).filter(function(r) { return r.ID_Log; }).map(function(r) {
    return {
      id: String(r.ID_Log), date: cleanDate_(r.Tanggal), time: cleanTime_(r.Jam),
      itemName: String(r.Nama_Bahan || '-'), type: String(r.Jenis_Mutasi || '-'),
      qty: Number(r.Jumlah) || 0, afterStock: Number(r.Sisa_Stok) || 0, pic: String(r.PIC || '-')
    };
  });

  var brandSettlements = readSheetObjects(ss, 'SETTLEMENT_BRAND').slice(-80).filter(function(r) { return r.ID_Settlement; }).map(function(r) {
    return {
      id: String(r.ID_Settlement), date: cleanDate_(r.Tanggal), periodLabel: String(r.Periode_Mingguan || ''),
      brand: String(r.Brand || ''), grossSales: Number(r.Omzet_Kotor) || 0,
      commissionPct: Number(r.Komisi_Pct) || 10, commissionCut: Number(r.Potongan_Komisi_Rp) || 0,
      salaryCut: Number(r.Porsi_Beban_Gaji_Rp) || 0, netTransfer: Number(r.Net_Wajib_Transfer_Rp) || 0,
      pic: String(r.PIC || 'Owner')
    };
  });

  var outletProfile = props.getProperty('OUTLET_PROFILE_JSON');
  var brandsJson = props.getProperty('BRANDS_LIST_JSON');
  var brandConfigJson = props.getProperty('BRAND_CONFIG_JSON');
  var manualSalaryRaw = props.getProperty('MANUAL_PERIOD_SALARY');
  var batchRecipesJson = props.getProperty('BATCH_RECIPES_JSON');

  return ContentService.createTextOutput(JSON.stringify({
    status: 'ok',
    outletProfile: outletProfile ? JSON.parse(outletProfile) : null,
    brands: brandsJson ? JSON.parse(brandsJson) : null,
    brandConfig: brandConfigJson ? JSON.parse(brandConfigJson) : null,
    batchRecipes: batchRecipesJson ? JSON.parse(batchRecipesJson) : null,
    manualPeriodSalary: (manualSalaryRaw !== null && manualSalaryRaw !== '') ? Number(manualSalaryRaw) : null,
    products: products, categories: categories, inventory: inventory, batchLogs: batchLogs,
    staff: staff, promos: promos, customers: customers,
    openOrders: openOrders, transactions: transactions, transactionItems: transactionItems,
    cashflow: cashflow, attendance: attendance, closingHistory: closingHistory, auditLogs: auditLogs, stockLogs: stockLogs, brandSettlements: brandSettlements
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(10000);
  } catch (err) {}
  try {
    setupMasterJiwaraSheets();
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var props = PropertiesService.getScriptProperties();
    var body = JSON.parse(e.postData.contents);
    var type = body.eventType;
    var d = body.data || {};

    if (type === 'OUTLET_PROFILE_UPDATED') {
      props.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(d));
    } else if (type === 'POS_TRANSACTION_PAID') {
      var existing = readSheetObjects(ss, 'POS_TRANSAKSI').some(function(r) { return String(r.No_Nota).trim() === String(d.id).trim(); });
      if (!existing) {
        appendRowByHeaders(ss, 'POS_TRANSAKSI',
          ['No_Nota', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Subtotal', 'Diskon', 'Kode_Promo', 'Total_Bayar', 'Metode_Bayar', 'Status'],
          {
            No_Nota: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Tipe_Order: d.orderType,
            Meja_Pelanggan: d.tableOrCustomer || '-', No_WA: d.customerPhone || '',
            Kasir: d.cashier, Subtotal: d.subtotal, Diskon: d.discount || 0,
            Kode_Promo: d.promoCode || '-', Total_Bayar: d.total, Metode_Bayar: d.paymentMethod, Status: 'PAID'
          }
        );
        (d.items || []).forEach(function(it) {
          var sub = (it.price || 0) * (it.qty || 1);
          var hpp = (it.cost || 0) * (it.qty || 1);
          appendRowByHeaders(ss, 'POS_ITEM_TERJUAL',
            ['No_Nota', 'Tanggal', 'Jam', 'SKU', 'Nama_Menu', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Qty', 'Harga_Satuan', 'HPP_Satuan', 'Subtotal_Item', 'Total_HPP', 'Laba_Kotor_Item'],
            {
              No_Nota: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), SKU: it.sku || '-', Nama_Menu: it.name,
              Brand: it.brand || 'Kopi Jiwara',
              Kena_Komisi_Brand: it.includeCommissionShare === false ? 'Tidak' : 'Ya',
              Hitung_Porsi_Gaji: it.includeSalaryShare === false ? 'Tidak' : 'Ya',
              Qty: it.qty, Harga_Satuan: it.price, HPP_Satuan: it.cost || 0,
              Subtotal_Item: sub, Total_HPP: hpp, Laba_Kotor_Item: sub - hpp
            }
          );
        });
      }
    } else if (type === 'PAID_TRX_CANCELLED') {
      var shTrx = ss.getSheetByName('POS_TRANSAKSI');
      if (shTrx && shTrx.getLastRow() > 1) {
        var hdrs = shTrx.getRange(1, 1, 1, shTrx.getLastColumn()).getValues()[0].map(function(h) { return String(h).trim(); });
        var cNota = hdrs.indexOf('No_Nota') + 1;
        var cStat = hdrs.indexOf('Status') + 1;
        if (cNota > 0 && cStat > 0) {
          var vals = shTrx.getRange(2, cNota, shTrx.getLastRow() - 1, 1).getValues();
          for (var i = 0; i < vals.length; i++) {
            if (String(vals[i][0]).trim() === String(d.id).trim()) shTrx.getRange(i + 2, cStat).setValue('CANCELLED');
          }
        }
      }
    } else if (type === 'CASHFLOW_ADDED') {
      var existingCf = readSheetObjects(ss, 'ARUS_KAS_CASHFLOW').some(function(r) { return String(r.ID_Kas).trim() === String(d.id).trim(); });
      if (!existingCf) {
        var isOut = d.type === 'OUT';
        appendRowByHeaders(ss, 'ARUS_KAS_CASHFLOW',
          ['ID_Kas', 'Tanggal', 'Jam', 'Kategori_Kas', 'Keterangan', 'Terima_Dari_Kepada', 'Debit_Masuk', 'Kredit_Keluar', 'No_Nota_Ref', 'PIC'],
          {
            ID_Kas: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Kategori_Kas: d.category || (isOut ? 'Biaya Operasional' : 'Kas Masuk Tambahan'),
            Keterangan: d.note, Terima_Dari_Kepada: d.pic || '-',
            Debit_Masuk: isOut ? 0 : d.amount, Kredit_Keluar: isOut ? d.amount : 0, No_Nota_Ref: '-', PIC: d.pic
          }
        );
      }
    } else if (type === 'ATTENDANCE_CLOCK_IN') {
      var existingAtt = readSheetObjects(ss, 'ABSENSI_KARYAWAN').some(function(r) {
        return cleanDate_(r.Tanggal) === cleanDate_(d.date) && String(r.Nama_Pegawai).trim() === String(d.staffName).trim();
      });
      if (!existingAtt) {
        appendRowByHeaders(ss, 'ABSENSI_KARYAWAN',
          ['Tanggal', 'Nama_Pegawai', 'Jabatan', 'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian', 'Status'],
          { Tanggal: cleanDate_(d.date), Nama_Pegawai: d.staffName, Jabatan: d.role, Jam_Masuk: cleanTime_(d.clockIn), Jam_Pulang: '-', Upah_Harian: d.wageEarned, Status: 'Hadir' }
        );
      }
    } else if (type === 'ATTENDANCE_CLOCK_OUT') {
      var shAtt = ss.getSheetByName('ABSENSI_KARYAWAN');
      if (shAtt && shAtt.getLastRow() > 1) {
        var av = shAtt.getRange(2, 1, shAtt.getLastRow() - 1, 6).getValues();
        for (var k = av.length - 1; k >= 0; k--) {
          if (cleanDate_(av[k][0]) === cleanDate_(d.date) && String(av[k][1]).trim() === String(d.staffName).trim()) {
            var cellOut = shAtt.getRange(k + 2, 5);
            cellOut.setValue(cleanTime_(d.clockOut));
            cellOut.setNumberFormat('@');
            break;
          }
        }
      }
    } else if (type === 'SHIFT_CLOSED') {
      var existingCls = readSheetObjects(ss, 'CLOSING_SHIFT').some(function(r) { return String(r.ID_Closing).trim() === String(d.id).trim(); });
      if (!existingCls) {
        appendRowByHeaders(ss, 'CLOSING_SHIFT',
          ['ID_Closing', 'Tanggal', 'Jam', 'Kasir', 'Modal_Awal', 'Sales_Cash', 'Sales_QRIS', 'Sales_Transfer', 'Sales_Online', 'Total_Omzet', 'Ekspektasi_Cash_Laci', 'Uang_Fisik_Laci', 'Selisih_Laci'],
          {
            ID_Closing: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Kasir: d.cashier,
            Modal_Awal: d.openingCash, Sales_Cash: d.cashSales, Sales_QRIS: d.qrisSales,
            Sales_Transfer: d.transferSales, Sales_Online: d.onlineSales, Total_Omzet: d.totalSales,
            Ekspektasi_Cash_Laci: d.expectedCash, Uang_Fisik_Laci: d.actualCash, Selisih_Laci: d.diff
          }
        );
      }
    } else if (type === 'AUDIT_VOID_ITEM') {
      var existingAud = readSheetObjects(ss, 'AUDIT_OTORISASI').some(function(r) { return String(r.ID_Audit).trim() === String(d.id).trim(); });
      if (!existingAud) {
        appendRowByHeaders(ss, 'AUDIT_OTORISASI',
          ['ID_Audit', 'Tanggal', 'Jam', 'No_Order_Nota', 'Tindakan_Item', 'Kasir', 'Otorisasi_Oleh', 'Alasan'],
          { ID_Audit: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), No_Order_Nota: d.orderId, Tindakan_Item: d.itemName, Kasir: d.cashier, Otorisasi_Oleh: d.authorizedBy, Alasan: d.reason }
        );
      }
    } else if (type === 'INVENTORY_STOCK_ADJUSTED') {
      var existingLog = readSheetObjects(ss, 'LOG_STOK_GUDANG').some(function(r) { return String(r.ID_Log).trim() === String(d.id).trim(); });
      if (!existingLog) {
        appendRowByHeaders(ss, 'LOG_STOK_GUDANG',
          ['ID_Log', 'Tanggal', 'Jam', 'Nama_Bahan', 'Jenis_Mutasi', 'Jumlah', 'Sisa_Stok', 'PIC'],
          { ID_Log: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Nama_Bahan: d.itemName, Jenis_Mutasi: d.type, Jumlah: d.qty, Sisa_Stok: d.afterStock, PIC: d.pic }
        );
      }
    } else if (type === 'PREBATCH_PRODUCED') {
      var existingPb = readSheetObjects(ss, 'RESEP_DAN_BATCH').some(function(r) { return String(r.ID_Record).trim() === String(d.id).trim(); });
      if (!existingPb) {
        appendRowByHeaders(ss, 'RESEP_DAN_BATCH',
          ['ID_Record', 'Tipe_Record', 'Tanggal', 'Jam', 'Nama_Formula_Menu', 'Output_PreBatch', 'Bahan_Terpakai', 'Target_Yield', 'Actual_Yield', 'Total_Modal_Rp', 'HPP_Per_Satuan', 'Catatan_Kalibrasi', 'PIC'],
          {
            ID_Record: d.id, Tipe_Record: 'PRODUKSI_BATCH', Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time),
            Nama_Formula_Menu: d.batchName, Output_PreBatch: d.outputName, Bahan_Terpakai: d.ingredientsSummary,
            Target_Yield: d.targetYield, Actual_Yield: d.actualYield, Total_Modal_Rp: d.totalCost,
            HPP_Per_Satuan: d.hppPerUnit, Catatan_Kalibrasi: d.calibrationNote, PIC: d.pic
          }
        );
      }
    } else if (type === 'BRAND_SETTLEMENT_PAID') {
      var existingStl = readSheetObjects(ss, 'SETTLEMENT_BRAND').some(function(r) { return String(r.ID_Settlement).trim() === String(d.id).trim(); });
      if (!existingStl) {
        appendRowByHeaders(ss, 'SETTLEMENT_BRAND',
          ['ID_Settlement', 'Tanggal', 'Periode_Mingguan', 'Brand', 'Omzet_Kotor', 'Komisi_Pct', 'Potongan_Komisi_Rp', 'Porsi_Beban_Gaji_Rp', 'Net_Wajib_Transfer_Rp', 'Status_Transfer', 'PIC'],
          {
            ID_Settlement: d.id, Tanggal: cleanDate_(d.date), Periode_Mingguan: d.periodLabel, Brand: d.brand,
            Omzet_Kotor: d.grossSales, Komisi_Pct: d.commissionPct, Potongan_Komisi_Rp: d.commissionCut,
            Porsi_Beban_Gaji_Rp: d.salaryCut, Net_Wajib_Transfer_Rp: d.netTransfer, Status_Transfer: 'Sudah Transfer', PIC: d.pic
          }
        );
      }
    } else if (type === 'SYNC_MASTER_SNAPSHOT') {
      if (d.brands) props.setProperty('BRANDS_LIST_JSON', JSON.stringify(d.brands));
      if (d.brandConfig) props.setProperty('BRAND_CONFIG_JSON', JSON.stringify(d.brandConfig));
      if (d.batchRecipes) props.setProperty('BATCH_RECIPES_JSON', JSON.stringify(d.batchRecipes));
      if (d.manualPeriodSalary !== undefined) {
        if (d.manualPeriodSalary === null) props.deleteProperty('MANUAL_PERIOD_SALARY');
        else props.setProperty('MANUAL_PERIOD_SALARY', String(d.manualPeriodSalary));
      }
      if (d.products) {
        writeSheetByHeaders(ss, 'MASTER_MENU',
          ['SKU', 'Nama_Menu', 'Kategori', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Satuan_Jual', 'Harga_Jual', 'HPP_Modal', 'Stok_Sistem', 'Favorit', 'Status', 'JSON_Resep'],
          d.products.map(function(p) {
            return {
              SKU: p.sku, Nama_Menu: p.name, Kategori: p.category, Brand: p.brand,
              Kena_Komisi_Brand: p.includeCommissionShare === false ? 'Tidak' : 'Ya',
              Hitung_Porsi_Gaji: p.includeSalaryShare === false ? 'Tidak' : 'Ya',
              Satuan_Jual: 'Porsi', Harga_Jual: p.price, HPP_Modal: p.cost,
              Stok_Sistem: p.stock, Favorit: p.isFavorite ? 'Ya' : 'Tidak', Status: p.active === false ? 'Nonaktif' : 'Aktif',
              JSON_Resep: JSON.stringify(p.recipe || [])
            };
          })
        );
      }
      if (d.categories) {
        writeSheetByHeaders(ss, 'MASTER_KATEGORI', ['Urutan', 'Nama_Kategori'],
          d.categories.map(function(c, i) { return { Urutan: i + 1, Nama_Kategori: c }; })
        );
      }
      if (d.inventory) {
        writeSheetByHeaders(ss, 'GUDANG_STOK',
          ['Kode_Bahan', 'Nama_Bahan', 'Jenis_Stok', 'Kategori', 'Stok_Sistem', 'Min_Stok', 'Satuan', 'HPP_Per_Satuan', 'Status_Stok', 'Update_Terakhir'],
          d.inventory.map(function(i) {
            return {
              Kode_Bahan: i.code, Nama_Bahan: i.name,
              Jenis_Stok: i.itemType === 'PREBATCH' ? 'Pre-Batch' : 'Bahan Mentah',
              Kategori: i.category,
              Stok_Sistem: i.stock, Min_Stok: i.minStock, Satuan: i.unit,
              HPP_Per_Satuan: Number(i.costPerUnit) || 0,
              Status_Stok: Number(i.stock) <= Number(i.minStock) ? 'Perlu Restock' : 'Aman',
              Update_Terakhir: cleanDate_(i.lastOpname)
            };
          })
        );
      }
      if (d.staff) {
        writeSheetByHeaders(ss, 'MASTER_PEGAWAI',
          ['ID_Staf', 'Nama_Pegawai', 'Jabatan', 'PIN_4_Digit', 'Upah_Harian', 'Status'],
          d.staff.map(function(s) {
            return { ID_Staf: s.id, Nama_Pegawai: s.name, Jabatan: s.role, PIN_4_Digit: s.pin, Upah_Harian: s.dailyWage, Status: s.active === false ? 'Nonaktif' : 'Aktif' };
          })
        );
      }
      if (d.promos) {
        writeSheetByHeaders(ss, 'MASTER_PROMO',
          ['Kode_Promo', 'Judul_Promo', 'Jenis_Potongan', 'Nilai_Potongan', 'Min_Belanja', 'Berlaku_Sampai', 'Status'],
          d.promos.map(function(p) {
            return { Kode_Promo: p.code, Judul_Promo: p.name, Jenis_Potongan: p.type, Nilai_Potongan: p.value, Min_Belanja: p.minOrder || 0, Berlaku_Sampai: cleanDate_(p.validUntil), Status: p.active === false ? 'Nonaktif' : 'Aktif' };
          })
        );
      }
      if (d.customers) {
        writeSheetByHeaders(ss, 'CRM_PELANGGAN',
          ['ID_Pelanggan', 'Nama_Pelanggan', 'No_WA', 'Tier_Member', 'Kunjungan', 'Total_Belanja', 'Voucher_Khusus', 'Potongan_Voucher', 'Berlaku_Sampai'],
          d.customers.map(function(c) {
            return {
              ID_Pelanggan: c.id, Nama_Pelanggan: c.name, No_WA: c.phone || '', Tier_Member: c.tier || 'Regular',
              Kunjungan: c.visits || 0, Total_Belanja: c.totalSpend || 0, Voucher_Khusus: c.specialVoucher || '',
              Potongan_Voucher: c.voucherDiscount || 0, Berlaku_Sampai: cleanDate_(c.voucherExpiry) || '2026-12-31'
            };
          })
        );
      }
      if (d.openOrders !== undefined) {
        writeSheetByHeaders(ss, 'OPEN_ORDERS',
          ['ID_Order', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Total_Tagihan', 'JSON_Items'],
          d.openOrders.map(function(o) {
            return { ID_Order: o.id, Tanggal: cleanDate_(o.date), Jam: cleanTime_(o.time), Tipe_Order: o.orderType, Meja_Pelanggan: o.tableOrCustomer || '-', No_WA: o.customerPhone || '', Kasir: o.cashier, Total_Tagihan: o.total, JSON_Items: JSON.stringify(o.items || []) };
          })
        );
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ status: 'ok', eventType: type })).setMimeType(ContentService.MimeType.JSON);
  } finally {
    try { lock.releaseLock(); } catch (err) {}
  }
}`;

  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px;">Skrip Google Apps Script v3.5 (Resep BOM & Pre-Batch Kalibrasi)</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:0;">Salin skrip terbaru ini ke <strong>Extensions -> Apps Script</strong> di file Google Spreadsheets Anda, lalu klik <strong>Deploy -> Manage deployments -> Edit -> Version: New version -> Deploy</strong>.</p>
    <textarea id="gasCodeBox" readonly style="width:100%;height:230px;font-family:monospace;font-size:11px;padding:10px;border-radius:12px;border:1px solid var(--border-glass);background:#F8FAFC;">${esc(gasCode)}</textarea>
    <button class="btn btn-dark" style="width:100%;margin-top:10px;" onclick="navigator.clipboard.writeText(document.getElementById('gasCodeBox').value);showToast('Skrip Google Sheets v3.5 berhasil disalin!')">Salin Skrip v3.5</button>
  `);
}

function addNewBrandOwner() {
  const name = document.getElementById('newBrandNameInput').value.trim();
  const comm = Math.max(0, Number(document.getElementById('newBrandCommInput').value) || 0);
  if (!name) return showToast('Masukkan nama Brand Owner!', true);
  const current = getActiveBrands();
  if (current.some(b => b.toLowerCase() === name.toLowerCase())) {
    return showToast('Brand tersebut sudah terdaftar!', true);
  }
  db.brands = [...current, name];
  db.brandConfig[name] = { commissionPct: comm, salarySharePct: 0, waNumber: '', active: true };
  saveDB();
  autoSyncMasterSlices(['brands', 'brandConfig']);
  renderWorkspace();
  showToast(`Brand "${name}" ditambahkan!`);
}

function toggleBrandActiveStatus(brandName) {
  const prev = db.brandConfig[brandName] || { commissionPct: 10, salarySharePct: 0, waNumber: '', active: true };
  const nextActive = prev.active === false ? true : false;
  db.brandConfig[brandName] = { ...prev, active: nextActive };
  saveDB();
  autoSyncMasterSlices(['brands', 'brandConfig']);
  renderWorkspace();
  showToast(`Status brand "${brandName}" diubah menjadi ${nextActive ? 'Aktif' : 'Inactive'}.`);
}

function openEditBrandModal(brandName) {
  const cfg = db.brandConfig[brandName] || { commissionPct: 10, waNumber: '', active: true };
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Edit Brand: ${esc(brandName)}</h3><button class="close-circle" onclick="closeModal()">x</button></div>

    <div style="margin-bottom:10px;"><label class="field-label">No. WhatsApp Pemilik Brand</label><input id="ebWa" type="text" class="styled-input" value="${esc(cfg.waNumber || '')}" placeholder="0812..." /></div>

function saveEditedBrand(brandName) {

  };
  saveDB();
  autoSyncMasterSlices(['brands', 'brandConfig']);
  closeModal();

function deleteBrandOwner(brandName) {
  if (brandName === 'Kopi Jiwara') return showToast('Brand utama Kopi Jiwara tidak dapat dihapus.', true);
  db.brands = getActiveBrands().filter(b => b !== brandName);
  delete db.brandConfig[brandName];
  saveDB();
  autoSyncMasterSlices(['brands', 'brandConfig']);
  renderWorkspace();
  showToast(`Brand "${brandName}" dihapus dari daftar.`);
}

function addMenuCategory() {
  const val = document.getElementById('newCatNameInput').value.trim();
  if (!val) return showToast('Masukkan nama kategori!', true);
  db.categories = normalizeUniqueCategories([...db.categories, val]);
  saveDB();
  autoSyncMasterSlices(['categories']);
  renderWorkspace();
  showToast(`Kategori "${val}" ditambahkan!`);
}

function moveCategoryOrder(fromIdx, delta) {
  const arr = normalizeUniqueCategories([...db.categories, ...db.products.map(p => p.category).filter(Boolean)]);
  const toIdx = fromIdx + delta;
  if (fromIdx < 1 || toIdx < 1 || toIdx >= arr.length) return;
  const moved = arr.splice(fromIdx, 1)[0];
  arr.splice(toIdx, 0, moved);
  db.categories = arr;
  saveDB();
  autoSyncMasterSlices(['categories']);
  renderWorkspace();
  showToast(`Urutan "${moved}" diperbarui!`);
}

function setCategoryExactPosition(fromIdx, rawPos) {
  const arr = normalizeUniqueCategories([...db.categories, ...db.products.map(p => p.category).filter(Boolean)]);
  const targetPos = Math.max(2, Math.min(arr.length, Number(rawPos) || 2));
  const toIdx = targetPos - 1;
  if (fromIdx < 1 || fromIdx === toIdx) return;
  const moved = arr.splice(fromIdx, 1)[0];
  arr.splice(toIdx, 0, moved);
  db.categories = arr;
  saveDB();
  autoSyncMasterSlices(['categories']);
  renderWorkspace();
  showToast(`Kategori "${moved}" dipindah ke urutan #${targetPos}.`);
}

function renameMenuCategory(oldName) {
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Ubah Nama Kategori</h3><button class="close-circle" onclick="closeModal()">x</button></div>
    <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori Baru</label><input id="renameCatInput" type="text" class="styled-input" value="${esc(oldName)}" /></div>
    <button class="btn btn-dark" style="width:100%;" onclick="confirmRenameCategory('${esc(oldName)}')">Simpan Nama Baru</button>
  `);
}

function confirmRenameCategory(oldName) {
  const newName = document.getElementById('renameCatInput').value.trim();
  if (!newName) return showToast('Nama tidak boleh kosong!', true);
  db.categories = normalizeUniqueCategories(db.categories.map(c => c === oldName ? newName : c));
  db.products.forEach(p => { if (p.category === oldName) p.category = newName; });
  saveDB();
  autoSyncMasterSlices(['categories', 'products']);
  closeModal();
  renderWorkspace();
  showToast('Nama kategori diperbarui!');
}

function deleteMenuCategory(catName) {
  const fallback = db.categories.find(c => c !== 'Favorit' && c !== catName) || 'Kopi Jiwara';
  db.categories = normalizeUniqueCategories(db.categories.filter(c => c !== catName));
  db.products.forEach(p => { if (p.category === catName) p.category = fallback; });
  saveDB();
  autoSyncMasterSlices(['categories', 'products']);
  renderWorkspace();
  showToast(`Kategori "${catName}" dihapus.`);
}

let draftProductRecipe = [];

function renderDraftRecipeRowsHtml() {
  const box = document.getElementById('pfRecipeRowsBox');
  if (!box) return;
  if (draftProductRecipe.length === 0) {
    box.innerHTML = `<div style="font-size:11px;color:var(--text-muted);padding:8px;text-align:center;">Belum ada bahan baku ditautkan. Klik <strong>+ Tambah Bahan</strong> agar stok gudang otomatis berkurang saat menu terjual.</div>`;
    return;
  }
  box.innerHTML = draftProductRecipe.map((row, idx) => {
    const invObj = db.inventory.find(i => i.code === row.invCode) || db.inventory[0];
    const unitLbl = invObj ? invObj.unit : 'gram';
    return `
      <div style="display:grid;grid-template-columns:2fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;">
        <select class="styled-select" style="padding:7px 9px;font-size:12px;" onchange="updateDraftRecipeCode(${idx}, this.value)">
          ${db.inventory.map(inv => `<option value="${esc(inv.code)}" ${row.invCode === inv.code ? 'selected' : ''}>${esc(inv.name)} (${esc(inv.unit)})</option>`).join('')}
        </select>
        <div style="display:flex;align-items:center;gap:4px;">
          <input type="number" step="any" class="styled-input" style="padding:7px 9px;font-size:12px;" value="${row.qty}" placeholder="Takaran" oninput="updateDraftRecipeQty(${idx}, this.value)" />
          <span style="font-size:11px;font-weight:800;color:var(--text-muted);min-width:32px;">${esc(unitLbl)}</span>
        </div>
        <button type="button" class="btn btn-danger btn-sm" style="padding:6px 9px;" onclick="removeDraftRecipeRow(${idx})">x</button>
      </div>
    `;
  }).join('');
}

function addDraftRecipeRow() {
  const firstInv = db.inventory[0];
  if (!firstInv) return showToast('Tambahkan item bahan di tab Inventori terlebih dahulu!', true);
  draftProductRecipe.push({ invCode: firstInv.code, qty: 1 });
  renderDraftRecipeRowsHtml();
}

function updateDraftRecipeCode(idx, code) {
  if (!draftProductRecipe[idx]) return;
  draftProductRecipe[idx].invCode = code;
  renderDraftRecipeRowsHtml();
}

function updateDraftRecipeQty(idx, val) {
  if (!draftProductRecipe[idx]) return;
  draftProductRecipe[idx].qty = Math.max(0, Number(val) || 0);
}

function removeDraftRecipeRow(idx) {
  draftProductRecipe.splice(idx, 1);
  renderDraftRecipeRowsHtml();
}

function saveProductForm(prodId) {
  const sku = document.getElementById('pfSku').value.trim();
  const name = document.getElementById('pfName').value.trim();
  const category = document.getElementById('pfCat').value;
  const brand = document.getElementById('pfBrand').value;
  const price = Math.max(0, Number(document.getElementById('pfPrice').value) || 0);
  const cost = Math.max(0, Number(document.getElementById('pfCost').value) || 0);
  const stock = Math.max(0, Number(document.getElementById('pfStock').value) || 0);
  const isFavorite = document.getElementById('pfFav').checked;
  const includeCommissionShare = document.getElementById('pfComm').checked;
  const includeSalaryShare = document.getElementById('pfSal').checked;
  const cleanRecipe = normalizeRecipeList(draftProductRecipe);

  if (!name) return showToast('Nama menu wajib diisi!', true);

  if (prodId) {
    const p = db.products.find(x => x.id === prodId);
    if (p) Object.assign(p, { sku, name, category, brand, price, cost, stock, isFavorite, includeCommissionShare, includeSalaryShare, recipe: cleanRecipe });
  } else {
    db.products.unshift({
      id: 'PRD-' + Date.now().toString().slice(-6),
      sku, name, category, brand, price, cost, stock, isFavorite,
      active: true, includeCommissionShare, includeSalaryShare, recipe: cleanRecipe
    });
  }
  saveDB();
  autoSyncMasterSlices(['products']);
  closeModal();
  renderWorkspace();
  showToast('Data produk & resep bahan baku disimpan!');
}

function deleteProduct(prodId) {
  db.products = db.products.filter(p => p.id !== prodId);
  saveDB();
  autoSyncMasterSlices(['products']);
  renderWorkspace();
  showToast('Produk dihapus.');
}

            ${db.staff.map(s => `
              <tr>
                <td><strong>${esc(s.name)}</strong></td>
                <td>${esc(s.role)}</td>
                <td><code>****</code></td>
                <td>${formatRp(s.dailyWage)}</td>
                <td><span class="badge-pill ${s.active ? 'badge-green' : 'badge-pink'}">${s.active ? 'Aktif' : 'Nonaktif'}</span></td>
                <td><button class="btn btn-soft btn-sm" onclick="openStaffFormModal('${s.id}')">Edit</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function openStaffFormModal(staffId = null) {
  const s = staffId ? db.staff.find(x => x.id === staffId) : null;
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">${s ? 'Edit Pegawai' : 'Tambah Pegawai Baru'}</h3><button class="close-circle" onclick="closeModal()">x</button></div>
    <div style="margin-bottom:10px;"><label class="field-label">Nama Lengkap</label><input id="sfName" type="text" class="styled-input" value="${esc(s ? s.name : '')}" /></div>
    <div style="margin-bottom:10px;">
      <label class="field-label">Jabatan</label>
      <select id="sfRole" class="styled-select">
        ${['Owner', 'Manager', 'Kasir & Barista', 'Kasir & Kitchen', 'Barista'].map(r => `<option value="${r}" ${s && s.role === r ? 'selected' : ''}>${r}</option>`).join('')}
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div><label class="field-label">PIN 4-Digit</label><input id="sfPin" type="text" maxlength="4" class="styled-input" value="${esc(s ? s.pin : '1111')}" /></div>
      <div><label class="field-label">Upah Harian (Rp)</label><input id="sfWage" type="number" class="styled-input" value="${s ? s.dailyWage : 85000}" /></div>
    </div>
    <div style="margin-bottom:14px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;">
        <input id="sfActive" type="checkbox" ${!s || s.active ? 'checked' : ''} /> Pegawai Aktif
      </label>
    </div>
    <button class="btn btn-dark" style="width:100%;" onclick="saveStaffForm('${s ? s.id : ''}')">Simpan Data Pegawai</button>
  `);
}

function saveStaffForm(staffId) {
  const name = document.getElementById('sfName').value.trim();
  const role = document.getElementById('sfRole').value;
  const pin = document.getElementById('sfPin').value.trim();
  const dailyWage = Math.max(0, Number(document.getElementById('sfWage').value) || 0);
  const active = document.getElementById('sfActive').checked;
  if (!name || pin.length !== 4) return showToast('Nama dan PIN 4-digit wajib diisi!', true);

  if (staffId) {
    const s = db.staff.find(x => x.id === staffId);
    if (s) Object.assign(s, { name, role, pin, dailyWage, active });
  } else {
    db.staff.push({ id: 'STF-' + Date.now().toString().slice(-5), name, role, pin, dailyWage, active });
  }
  saveDB();
  autoSyncMasterSlices(['staff']);
  closeModal();
  renderWorkspace();
  showToast('Data pegawai diperbarui!');
}

function renderSettingsPromosSubtab(box) {
  box.innerHTML = `

function openPromoFormModal() {
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Tambah Kode Promo Baru</h3><button class="close-circle" onclick="closeModal()">x</button></div>
    <div style="margin-bottom:10px;"><label class="field-label">Kode Promo</label><input id="pmCode" type="text" class="styled-input" placeholder="CONTOH: JUMATBERKAH" /></div>
    <div style="margin-bottom:10px;"><label class="field-label">Judul Promo</label><input id="pmName" type="text" class="styled-input" placeholder="Diskon Spesial Akhir Pekan" /></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div>
        <label class="field-label">Jenis Potongan</label>

      </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">

      <div><label class="field-label">Berlaku Sampai</label><input id="pmExp" type="date" class="styled-input" value="2026-12-31" /></div>
    </div>
    <button class="btn btn-dark" style="width:100%;" onclick="saveNewPromo()">Simpan Promo</button>
  `);
}

function saveNewPromo() {
  const code = document.getElementById('pmCode').value.trim().toUpperCase();
  const name = document.getElementById('pmName').value.trim();
  const type = document.getElementById('pmType').value;
  const value = Math.max(0, Number(document.getElementById('pmVal').value) || 0);
  const minOrder = Math.max(0, Number(document.getElementById('pmMin').value) || 0);
  const validUntil = document.getElementById('pmExp').value || '2026-12-31';
  if (!code || !name) return showToast('Kode dan judul promo wajib diisi!', true);

  db.promos.push({ id: 'PRM-' + Date.now(), code, name, type, value, minOrder, validUntil, active: true });
  saveDB();
  autoSyncMasterSlices(['promos']);
  closeModal();
  renderWorkspace();
  showToast('Promo baru ditambahkan!');
}

function deletePromo(promoId) {
  db.promos = db.promos.filter(p => p.id !== promoId);
  saveDB();
  autoSyncMasterSlices(['promos']);
  renderWorkspace();
  showToast('Promo dihapus.');
}

        <button class="btn btn-dark" onclick="pairAndLockBluetoothPrinter()">Pindai & Kunci Printer BT</button>
        <button class="btn btn-yellow" onclick="testThermalPrintSample()">Tes Cetak Struk</button>
      </div>
    </div>
  `;
}

async function pairAndLockBluetoothPrinter() {
  if (!navigator.bluetooth) {
    return showToast('Browser ini tidak mendukung Web Bluetooth. Gunakan Google Chrome di Android/Windows.', true);
  }
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
    });
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();
    for (const srv of services) {
      const chars = await srv.getCharacteristics();
      for (const ch of chars) {
        if (ch.properties.write || ch.properties.writeWithoutResponse) {
          btCharacteristic = ch;
          db.settings.printerName = device.name || 'Thermal Printer BT';
          saveDB();
          renderWorkspace();
          showToast('Printer terkunci: ' + db.settings.printerName);
          return;
        }
      }
    }
    showToast('Karakteristik tulis printer tidak ditemukan.', true);
  } catch (e) {
    showToast('Pemindaian Bluetooth dibatalkan atau gagal.', true);
  }
}

}
