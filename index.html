<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background: rgba(11, 46, 35, 0.78);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
        <div style="width:54px;height:54px;border-radius:16px;background:#093814;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.28);">
          <svg viewBox="0 0 100 100" width="52" height="52">
            <rect width="100" height="100" fill="#093814"/>
            <circle cx="50" cy="50" r="35" fill="#FFFFFF"/>
            <path d="M 33 53 C 32 69, 37 78, 52 78 C 66 78, 70 69, 72 44 C 73 29, 68 25, 48 25 C 33 25, 29 30, 30 35 C 31 41, 41 44, 52 43 C 60 42, 62 37, 58 34 C 54 31, 45 32, 44 36" fill="none" stroke="#093814" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:18px;padding:13px;margin-bottom:14px;">
        <label style="display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;color:#FACC15;text-transform:uppercase;margin-bottom:6px;" for="loginStaffSelect">Pilih Pegawai Bertugas</label>
        <select id="loginStaffSelect" class="login-select" onchange="clearPinPad()"></select>
      </div>

      <div>

      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v9';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              if (e.request.url.includes('script.google.com')) return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});

          currentTab,
          settingsSubTab,
          invSubTab,
          ownerReportSubTab
        }));
      } catch (e) {}
    }

    function restoreSessionState() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return false;
        const sess = JSON.parse(raw);
        const st = db.staff.find(s => s.id === sess.userId && s.active);
        if (!st) return false;
        currentUser = st;
        workspaceMode = sess.workspaceMode || (st.role === 'Owner' ? 'owner' : 'cashier');
        currentTab = sess.currentTab || (st.role === 'Owner' ? 'penjualan' : 'kasir');
        if (sess.settingsSubTab) settingsSubTab = sess.settingsSubTab;
        if (sess.invSubTab) invSubTab = sess.invSubTab;
        if (sess.ownerReportSubTab) ownerReportSubTab = sess.ownerReportSubTab;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appWorkspace').classList.remove('hidden');
        renderWorkspace();
        startAutoCloudPolling();
        pullFromCloudMaster(false);
        return true;
      } catch (e) {
        return false;
      }
    }

    // ==================== HELPERS ====================
    function rp(num) {
      const n = Math.round(Number(num) || 0);
      return (n < 0 ? '-' : '') + 'Rp ' + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDigits(val) {
      const d = String(val || '').replace(/\D/g, '');
      return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function parseDigits(val) {
      return Number(String(val || '').replace(/\D/g, '')) || 0;
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatOrderDateTime(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return String(isoStr);
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) +
        ' • ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(msg, isError = false) {
      const wrap = document.getElementById('toastWrap');
      const box = document.getElementById('toastBox');
      box.className = 'toast-box' + (isError ? ' error' : '');
      box.textContent = msg;
      wrap.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => wrap.classList.add('hidden'), 2600);
    }

    function openModal(html) {
      document.getElementById('modalCardBody').innerHTML = html;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
      document.getElementById('modalCardBody').innerHTML = '';
    }

    function inferBrandFromCategory(cat) {
      const c = String(cat || '').toLowerCase();
      if (c.includes('ayam') || c.includes('baba')) return 'Ayam Baba Jay';
      if (c.includes('jovangel')) return 'Jovangels';
      if (c.includes('jihyo') || c.includes('dimsum')) return 'Jihyo';
      return 'Kopi Jiwara';
    }

    function getProductBrand(itemOrProd) {
      if (!itemOrProd) return 'Kopi Jiwara';
      if (itemOrProd.brand && String(itemOrProd.brand).trim()) return String(itemOrProd.brand).trim();
      const matched = (db.products || []).find(p => p.id === itemOrProd.id || (p.sku && p.sku === itemOrProd.sku));
      if (matched && matched.brand) return matched.brand;
      return inferBrandFromCategory(itemOrProd.category);
    }

    function isProductIncludedInCommission(itemOrProd) {
      if (!itemOrProd) return true;
      if (itemOrProd.includeCommissionShare !== undefined) return Boolean(itemOrProd.includeCommissionShare);
      const matched = (db.products || []).find(p => p.id === itemOrProd.id || (p.sku && p.sku === itemOrProd.sku));
      if (matched && matched.includeCommissionShare !== undefined) return Boolean(matched.includeCommissionShare);
      return true;
    }

    function isProductIncludedInSalaryShare(itemOrProd) {
      if (!itemOrProd) return true;
      if (itemOrProd.includeSalaryShare !== undefined) return Boolean(itemOrProd.includeSalaryShare);
      const matched = (db.products || []).find(p => p.id === itemOrProd.id || (p.sku && p.sku === itemOrProd.sku));
      if (matched && matched.includeSalaryShare !== undefined) return Boolean(matched.includeSalaryShare);
      return true;
    }

    function getAllAvailableBrands() {
      const set = new Set(BRAND_LIST);
      (db.brandConfigs || []).forEach(b => { if (b.brand) set.add(b.brand); });
      (db.products || []).forEach(p => { if (p.brand) set.add(p.brand); });
      return Array.from(set);
    }

    function getBrandConfig(brandName) {
      if (!db.brandConfigs) db.brandConfigs = getDefaultBrandConfigs();
      let cfg = db.brandConfigs.find(b => b.brand.toLowerCase() === String(brandName || '').toLowerCase());
      if (!cfg) {
        cfg = { brand: brandName, commissionPct: 10, salaryShareActive: true, ownerPhone: '' };
        db.brandConfigs.push(cfg);
      }
      return cfg;
    }

    // ==================== WHATSAPP RECEIPT SENDER ====================
    function formatWhatsAppReceiptText(trx) {
      const dateStr = new Date(trx.date).toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const itemLines = (trx.items || []).map(it =>
        `• ${it.name} (${it.qty}x @${rp(it.price)}) = *${rp((Number(it.price) || 0) * (Number(it.qty) || 0))}*`
      ).join('\n');

      let msg = `*BUKTI PEMBAYARAN — ${db.outlet.name}*\n`;
      if (db.outlet.address) msg += `${db.outlet.address}\n`;
      msg += `--------------------------------\n`;
      msg += `No. Nota : *${trx.id}*\n`;
      msg += `Waktu    : ${dateStr}\n`;
      msg += `Jenis    : ${trx.orderType}\n`;
      msg += `Pelanggan: ${trx.customer || 'Walk-in'}\n`;
      msg += `Kasir    : ${trx.cashier || '-'}\n`;
      msg += `--------------------------------\n`;
      msg += `*DETAIL PESANAN:*\n${itemLines}\n`;
      msg += `--------------------------------\n`;
      if ((trx.discount || 0) > 0) {
        msg += `Subtotal : ${rp(trx.subtotal || trx.total)}\n`;
        msg += `Diskon   : -${rp(trx.discount)}\n`;
      }
      msg += `*TOTAL (${trx.paymentMethod}): ${rp(trx.total)}*\n`;
      if (trx.paymentMethod === 'Cash') {
        msg += `Tunai    : ${rp(trx.cashPaid)}\n`;
        msg += `Kembalian: ${rp(trx.change)}\n`;
      }
      msg += `--------------------------------\n`;
      msg += `${db.outlet.receiptFooter || 'Terima kasih telah menikmati Kopi Jiwara!'}`;
      return msg;
    }

    function executeSendWhatsAppReceipt(trxId) {
      const trx = db.transactions.find(t => t.id === trxId);
      if (!trx) return;
      const rawPhone = (document.getElementById('waReceiptPhoneInput')?.value || '').trim();
      let cleanDigits = rawPhone.replace(/\D/g, '');
      if (!cleanDigits || cleanDigits.length < 8) {
        showToast('Masukkan nomor WhatsApp pelanggan yang valid (minimal 8 digit).', true);
        return;
      }

      if (document.getElementById('waSaveToCrmCheck')?.checked) {
        trx.customerPhone = rawPhone;
        const crmSaved = upsertCRMCustomerFromOrder(trx.customer, rawPhone, 0, '');
        saveDB();
        if (crmSaved) autoSyncMasterSlices(['customers']);
      }

      let intlPhone = cleanDigits;
      if (intlPhone.startsWith('0')) intlPhone = '62' + intlPhone.slice(1);
      else if (intlPhone.startsWith('8')) intlPhone = '62' + intlPhone;

      const text = formatWhatsAppReceiptText(trx);
      closeModal();
      window.open(`https://wa.me/${intlPhone}?text=${encodeURIComponent(text)}`, '_blank');
      showToast(`Membuka WhatsApp untuk mengirim struk ${trx.id}...`);
    }

    function updatePinDots() {

        else dot.classList.remove('filled');

    function clearPinPad() {
      pinBuffer = '';

    function pressPin(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += String(digit);
      updatePinDots();
      if (pinBuffer.length === 4) {

    // ==================== 2-WAY REAL-TIME GOOGLE SHEETS SYNC (PUSH + PULL) ====================
    const OFFLINE_QUEUE_KEY = 'kopi_jiwara_sync_queue_v1';

    function enqueueOfflineSync(item) {
      try {
        const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
        q.push(item);
        localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q.slice(-200)));
      } catch (e) {}
    }

    function flushOfflineSyncQueue() {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url || !navigator.onLine) return;
      try {
        const q = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || '[]');
        if (q.length === 0) return;
        localStorage.removeItem(OFFLINE_QUEUE_KEY);
        q.forEach(item => {
          fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(item)
          }).catch(() => enqueueOfflineSync(item));
        });
        showToast(`${q.length} data offline berhasil disinkronkan ke Google Sheets.`);
      } catch (e) {}
    }

    window.addEventListener('online', () => {
      showToast('Koneksi internet kembali aktif.');
      flushOfflineSyncQueue();
      pullFromCloudMaster(false);
    });

    function syncMasterEvent(eventType, payload) {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url) return;
      const bodyObj = {
        source: 'KOPI_JIWARA_POS_ERP_V2_5',
        eventType,
        timestamp: new Date().toISOString(),
        outlet: db.outlet.name,
        payload
      };
      if (!navigator.onLine) {
        enqueueOfflineSync(bodyObj);
        return;
      }
      try {
        fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(bodyObj)
        }).catch(() => enqueueOfflineSync(bodyObj));
      } catch (e) {
        enqueueOfflineSync(bodyObj);
      }
    }

    function autoSyncMasterSlices(slices) {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url) return;
      const data = {};
      if (slices.includes('products')) {
        data.products = (db.products || []).map(p => ({
          ...p,
          brand: getProductBrand(p),
          includeCommissionShare: isProductIncludedInCommission(p),
          includeSalaryShare: isProductIncludedInSalaryShare(p)
        }));
      }
      if (slices.includes('inventory')) {
        data.inventory = db.inventory || [];
      }
      if (slices.includes('customers')) {
        data.customers = db.customers || [];
      }
      if (slices.includes('staff')) {
        data.staff = db.staff || [];
      }
      if (slices.includes('promos')) {
        data.promos = db.promos || [];
      }
      if (slices.includes('openOrders')) {
        data.openOrders = (db.transactions || []).filter(t => t.status === 'OPEN');
      }
      syncMasterEvent('SYNC_MASTER_TABLES', data);
    }

    function updateHeaderCloudSyncBadge(isSyncing, customText = '') {
      const btn = document.getElementById('headerCloudSyncBtn');
      const lbl = document.getElementById('headerCloudSyncLabel');
      if (!btn || !lbl) return;
      const hasUrl = Boolean((db.outlet && db.outlet.webhookUrl || '').trim());
      if (!hasUrl) {
        btn.classList.add('hidden');
        return;
      }
      btn.classList.remove('hidden');
      if (isSyncing) {
        btn.classList.add('syncing');
        lbl.textContent = customText || 'Menarik Data...';
      } else {
        btn.classList.remove('syncing');
        lbl.textContent = customText || (lastCloudPullTime ? `Live • ${lastCloudPullTime}` : 'Live Sync');
      }
    }

    function isUserActivelyTyping() {
      const ae = document.activeElement;
      if (!ae) return false;
      const tag = (ae.tagName || '').toUpperCase();
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    async function pullFromCloudMaster(manualTrigger = false) {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url) {
        if (manualTrigger) showToast('Isi & simpan URL Google Apps Script terlebih dahulu.', true);
        return;
      }
      if (!navigator.onLine) {
        if (manualTrigger) showToast('Perangkat sedang offline. Sync otomatis berjalan saat online.', true);
        return;
      }
      if (cloudSyncInProgress) return;
      if (!manualTrigger && isUserActivelyTyping()) return;

      cloudSyncInProgress = true;
      updateHeaderCloudSyncBadge(true, 'Syncing...');

      try {
        const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'action=pull&t=' + Date.now();
        const res = await fetch(fetchUrl, { method: 'GET', redirect: 'follow' });
        const data = await res.json();

        if (!data || data.status !== 'OK') {
          throw new Error((data && data.message) || 'Respon tidak valid');
        }

        let changed = false;

        if (Array.isArray(data.products) && data.products.length > 0) {
          const prevStr = JSON.stringify(db.products);
          const existingBySku = {};
          (db.products || []).forEach(p => { existingBySku[p.sku] = p; });

          db.products = data.products.map((rpItem, idx) => {
            const old = existingBySku[rpItem.sku];
            return {
              id: old ? old.id : ('prd-cloud-' + (rpItem.sku || idx)),
              sku: String(rpItem.sku || ('SKU-' + (idx + 1))),
              name: String(rpItem.name || 'Menu'),
              category: String(rpItem.category || 'Kopi Jiwara'),
              brand: String(rpItem.brand || (old && old.brand) || inferBrandFromCategory(rpItem.category)),
              includeCommissionShare: rpItem.includeCommissionShare !== undefined
                ? Boolean(rpItem.includeCommissionShare)
                : (old ? Boolean(old.includeCommissionShare) : true),
              includeSalaryShare: rpItem.includeSalaryShare !== undefined
                ? Boolean(rpItem.includeSalaryShare)
                : (old ? Boolean(old.includeSalaryShare) : true),
              fav: Boolean(rpItem.fav),
              price: Number(rpItem.price) || 0,
              cost: Number(rpItem.cost) || 0,
              unit: String(rpItem.unit || 'Cup'),
              stock: old ? old.stock : 50
            };
          });

          const catSet = new Set(['Favorit', ...(db.categories || [])]);
          db.products.forEach(p => { if (p.category) catSet.add(p.category); });
          db.categories = Array.from(catSet);

          if (JSON.stringify(db.products) !== prevStr) changed = true;
        }

        if (Array.isArray(data.inventory) && data.inventory.length > 0) {
          const prevInv = JSON.stringify(db.inventory);
          const oldInvMap = {};
          (db.inventory || []).forEach(i => { oldInvMap[i.sku] = i; });
          db.inventory = data.inventory.map((it, idx) => {
            const old = oldInvMap[it.sku];
            return {
              id: old ? old.id : ('inv-cloud-' + (it.sku || idx)),
              sku: String(it.sku || ('BHN-' + (idx + 1))),
              name: String(it.name || 'Bahan'),
              category: String(it.category || 'Operasional Dapur'),
              stock: Number(it.stock) || 0,
              minStock: Number(it.minStock) || 0,
              unit: String(it.unit || 'Pcs')
            };
          });
          if (JSON.stringify(db.inventory) !== prevInv) changed = true;
        }

        if (Array.isArray(data.staff) && data.staff.length > 0) {
          const prevStf = JSON.stringify(db.staff);
          db.staff = data.staff.map((s, idx) => ({
            id: String(s.id || ('stf-' + (idx + 1))),
            name: String(s.name || 'Staf'),
            role: String(s.role || 'Kasir'),
            pin: String(s.pin || '1111'),
            dailyWage: Number(s.dailyWage) || 0,
            active: s.active !== false
          }));
          if (JSON.stringify(db.staff) !== prevStf) changed = true;
        }

        if (Array.isArray(data.promos) && data.promos.length > 0) {
          const prevPrm = JSON.stringify(db.promos);
          db.promos = data.promos.map((pr, idx) => ({
            id: String(pr.id || ('prm-' + (idx + 1))),
            code: String(pr.code || '').toUpperCase(),
            name: String(pr.name || 'Promo'),
            type: pr.type === 'fixed' ? 'fixed' : 'percent',
            value: Number(pr.value) || 0,
            startDate: String(pr.startDate || ''),
            endDate: String(pr.endDate || ''),
            active: pr.active !== false
          }));
          if (JSON.stringify(db.promos) !== prevPrm) changed = true;
        }

        if (Array.isArray(data.customers) && data.customers.length > 0) {
          const prevCrm = JSON.stringify(db.customers);
          db.customers = data.customers.map((c, idx) => ({
            id: String(c.id || ('CRM-' + (idx + 1))),
            name: String(c.name || 'Pelanggan'),
            phone: String(c.phone === '-' ? '' : (c.phone || '')),
            tier: String(c.tier || 'Regular'),
            totalVisits: Number(c.totalVisits) || 0,
            totalSpent: Number(c.totalSpent) || 0,
            lastVisit: String(c.lastVisit || new Date().toISOString()),
            specialVoucher: String(c.specialVoucher === '-' ? '' : (c.specialVoucher || '')),
            notes: String(c.notes === '-' ? '' : (c.notes || ''))
          }));
          if (JSON.stringify(db.customers) !== prevCrm) changed = true;
        }

        const voidedIds = new Set(Array.isArray(data.voidedOrderIds) ? data.voidedOrderIds.map(String) : []);
        (db.transactions || []).forEach(t => { if (t.status === 'CANCELLED') voidedIds.add(String(t.id)); });

        if (Array.isArray(data.transactions) || Array.isArray(data.openOrders)) {
          const prevTrx = JSON.stringify(db.transactions);
          const trxMap = {};
          (db.transactions || []).forEach(t => { trxMap[t.id] = t; });

          if (Array.isArray(data.transactions)) {
            data.transactions.forEach(ct => {
              if (!ct || !ct.id) return;
              const existingLocal = trxMap[ct.id];
              const isVoid = voidedIds.has(String(ct.id)) || (existingLocal && existingLocal.status === 'CANCELLED');
              trxMap[ct.id] = {
                ...existingLocal,
                ...ct,
                status: isVoid ? 'CANCELLED' : 'PAID',
                paymentMethod: isVoid ? 'BATAL' : (ct.paymentMethod || 'Cash')
              };
            });
          }

          if (Array.isArray(data.openOrders)) {
            const cloudOpenIds = new Set();
            data.openOrders.forEach(oo => {
              if (!oo || !oo.id || voidedIds.has(String(oo.id))) return;
              cloudOpenIds.add(oo.id);
              if (!trxMap[oo.id] || trxMap[oo.id].status === 'OPEN') {
                trxMap[oo.id] = {
                  ...oo,
                  status: 'OPEN',
                  paymentMethod: 'OPEN'
                };
              }
            });
            Object.keys(trxMap).forEach(k => {
              if (trxMap[k].status === 'OPEN' && !cloudOpenIds.has(k) && k !== editingOpenOrderId) {
                delete trxMap[k];
              }
            });
          }

          db.transactions = Object.values(trxMap).sort((a, b) => new Date(b.date) - new Date(a.date));
          if (JSON.stringify(db.transactions) !== prevTrx) changed = true;
        }

        if (Array.isArray(data.cashDrawerLogs) && data.cashDrawerLogs.length > 0) {
          const prevCf = JSON.stringify(db.cashDrawerLogs);
          const cfMap = {};
          (db.cashDrawerLogs || []).forEach(c => { cfMap[c.id] = c; });
          data.cashDrawerLogs.forEach(cc => {
            if (cc && cc.id && !cfMap[cc.id]) cfMap[cc.id] = cc;
          });
          db.cashDrawerLogs = Object.values(cfMap).sort((a, b) => new Date(b.date) - new Date(a.date));
          if (JSON.stringify(db.cashDrawerLogs) !== prevCf) changed = true;
        }

        lastCloudPullTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (changed) {
          saveDB();
          const modalOpen = !document.getElementById('modalBackdrop').classList.contains('hidden');
          if (!modalOpen && currentUser) {
            renderWorkspace();
          }
          if (manualTrigger) showToast('Data terbaru berhasil ditarik dari Google Sheets!');
        } else if (manualTrigger) {
          showToast('Semua data sudah sinkron & paling baru.');
        }
      } catch (err) {
        if (manualTrigger) {
          showToast('Gagal menarik data. Pastikan Skrip Google Sheets sudah diperbarui ke v2.5.', true);
        }
      } finally {
        cloudSyncInProgress = false;
        updateHeaderCloudSyncBadge(false);
        if (settingsSubTab === 'sinkronisasi' && currentTab === 'pengaturan') {
          const subBody = document.getElementById('settingsSubBody');
          if (subBody) renderSettingsSystemSync(subBody);
        }
      }
    }

      autoPullTimer = setInterval(() => {

function doGet(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var result = {
      status: 'OK',
      serverTime: new Date().toISOString(),
      products: readMenuSheet(ss),
      inventory: readInventorySheet(ss),
      staff: readStaffSheet(ss),
      promos: readPromoSheet(ss),
      customers: readCustomersSheet(ss),
      openOrders: readOpenOrdersSheet(ss),
      transactions: readRecentTransactionsSheet(ss),
      voidedOrderIds: readVoidedOrderIds(ss),
      cashDrawerLogs: readCashDrawerSheet(ss)
    };
    return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'ERROR', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function readVoidedOrderIds(ss) {
  var sh = ss.getSheetByName('AUDIT_OTORISASI');
  if (!sh || sh.getLastRow() <= 1) return [];
  var rows = sh.getDataRange().getValues();
  var out = [];
  for (var r = 1; r < rows.length; r++) {
    var act = String(rows[r][2] || '');
    if (act === 'CANCEL_PAID_TRANSACTION' || act === 'PAID_TRX_CANCELLED' || act === 'CANCEL_OPEN_ORDER' || act === 'ORDER_CANCELLED') {
      if (rows[r][3]) out.push(String(rows[r][3]));

  }
  return out;
}

    });

function doPost(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var data = JSON.parse(e.postData.contents);
    var eventType = data.eventType || 'UNKNOWN';
    var ts = data.timestamp || new Date().toISOString();
    var tgl = ts.slice(0, 10);
    var jam = ts.slice(11, 19);
    var p = data.payload || {};

    if (eventType === 'PING_TEST') {
      var shPing = getOrCreateSheet(ss, 'AUDIT_OTORISASI', [
        'Timestamp', 'ID_Audit', 'Jenis_Aksi', 'No_Order',
        'Detail_Perubahan', 'Alasan', 'Kasir_Pelaksana', 'Disetujui_Oleh_PIN'
      ]);
      shPing.appendRow([ts, 'PING-' + Date.now(), 'TEST_KONEKSI_OK', '-', 'Koneksi POS & ERP Terhubung', 'Test Manual', p.tester || 'Owner', '-']);

    } else if (eventType === 'SALE_COMPLETED') {
      var shSales = getOrCreateSheet(ss, 'POS_TRANSAKSI', [
        'Timestamp', 'No_Nota', 'Tanggal', 'Jam', 'Outlet', 'Jenis_Order',
        'Nama_Pelanggan', 'No_WA_CRM', 'Kasir', 'Metode_Bayar',
        'Subtotal', 'Diskon_Promo', 'Total_Net', 'Total_HPP', 'Laba_Kotor',
        'Uang_Diterima', 'Kembalian', 'Ringkasan_Item', 'Items_JSON'
      ]);
      var itemsText = (p.items || []).map(function(i) { return i.name + ' x' + i.qty; }).join(', ');
      var hppTotal = Number(p.costTotal) || 0;
      shSales.appendRow([
        ts, p.id, tgl, jam, data.outlet, p.orderType,
        p.customer || 'Walk-in', p.customerPhone || '', p.cashier, p.paymentMethod,
        p.subtotal, p.discount || 0, p.total, hppTotal, (p.total - hppTotal),
        p.cashPaid || p.total, p.change || 0, itemsText, JSON.stringify(p.items || [])
      ]);

      var shItems = getOrCreateSheet(ss, 'POS_ITEM_TERJUAL', [
        'Timestamp', 'Tanggal', 'No_Nota', 'Jenis_Order', 'SKU', 'Nama_Menu',
        'Kategori', 'Brand', 'Kena_Komisi', 'Hitung_Porsi_Gaji', 'Qty', 'Harga_Satuan', 'HPP_Satuan',
        'Subtotal_Jual', 'Subtotal_HPP', 'Profit_Item'
      ]);
      var brandMap = p.brandMap || {};
      (p.items || []).forEach(function(it) {
        var subJual = (Number(it.price) || 0) * (Number(it.qty) || 0);
        var subHpp = (Number(it.cost) || 0) * (Number(it.qty) || 0);
        var br = it.brand || brandMap[it.id] || 'Kopi Jiwara';
        var incCom = it.includeCommissionShare === false ? 'Tidak' : 'Ya';
        var incSal = it.includeSalaryShare === false ? 'Tidak' : 'Ya';
        shItems.appendRow([
          ts, tgl, p.id, p.orderType, it.sku || '-', it.name,
          it.category || '-', br, incCom, incSal, it.qty, it.price, it.cost || 0,
          subJual, subHpp, (subJual - subHpp)
        ]);
      });

      var shCf = getOrCreateSheet(ss, 'ARUS_KAS_CASHFLOW', [
        'Timestamp', 'Tanggal', 'No_Ref', 'Kategori_Kas', 'Metode',
        'Keterangan', 'Debit_Masuk', 'Kredit_Keluar', 'PIC'
      ]);
      shCf.appendRow([
        ts, tgl, p.id, 'Penjualan POS', p.paymentMethod,
        'Sales ' + p.paymentMethod + ' (' + p.orderType + ') - ' + (p.customer || 'Walk-in'),
        p.total, 0, p.cashier
      ]);

    } else if (eventType === 'BRAND_SETTLEMENT') {
      var shSet = getOrCreateSheet(ss, 'SETTLEMENT_BRAND', [
        'Timestamp', 'ID_Settlement', 'Periode', 'Brand',
        'Qty_Terjual', 'Qty_Hitung_Gaji', 'Omzet_Brand', 'Omzet_Kena_Komisi',
        'Persen_Komisi', 'Potongan_Komisi', 'Porsi_Beban_Gaji',
        'Net_Transfer_Brand', 'PIC'
      ]);
      shSet.appendRow([
        ts, p.id, p.periodLabel, p.brand,
        p.totalQty, p.qualifyingQty, p.grossSales, p.commissionableSales || p.grossSales,
        p.commissionPct + '%', p.commissionAmount, p.salaryDeduction,
        p.netTransfer, p.pic
      ]);

      var shCfSet = getOrCreateSheet(ss, 'ARUS_KAS_CASHFLOW', [
        'Timestamp', 'Tanggal', 'No_Ref', 'Kategori_Kas', 'Metode',
        'Keterangan', 'Debit_Masuk', 'Kredit_Keluar', 'PIC'
      ]);
      shCfSet.appendRow([
        ts, tgl, p.id, 'Setoran Brand Owner', 'Transfer Bank',
        'Transfer Sales ' + p.brand + ' (' + p.periodLabel + ')',
        0, p.netTransfer, p.pic
      ]);

    } else if (eventType === 'CASH_DRAWER') {
      var shCf2 = getOrCreateSheet(ss, 'ARUS_KAS_CASHFLOW', [
        'Timestamp', 'Tanggal', 'No_Ref', 'Kategori_Kas', 'Metode',
        'Keterangan', 'Debit_Masuk', 'Kredit_Keluar', 'PIC'
      ]);
      var isIn = p.type === 'IN';
      var isSetoran = String(p.note || '').toLowerCase().indexOf('setoran') === 0;
      shCf2.appendRow([
        ts, tgl, p.id, isIn ? 'Kas Masuk Laci' : (isSetoran ? 'Setoran Kasir ke Finance' : 'Biaya Operasional'), 'Cash Laci',
        p.note, isIn ? p.amount : 0, isIn ? 0 : p.amount, p.cashier
      ]);

    } else if (eventType === 'ATTENDANCE') {
      var shAtt = getOrCreateSheet(ss, 'ABSENSI_KARYAWAN', [
        'Timestamp', 'ID_Absen', 'Tanggal', 'Nama_Karyawan',
        'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian', 'Status'
      ]);
      var rows = shAtt.getDataRange().getValues();
      var updatedRow = -1;
      for (var r = 1; r < rows.length; r++) {
        if (p.id && String(rows[r][1]) === String(p.id)) {
          updatedRow = r + 1;
          break;
        }
      }
      if (updatedRow > 0) {
        shAtt.getRange(updatedRow, 1, 1, 8).setValues([[ts, p.id, p.date, p.staffName, p.clockIn, p.clockOut || '-', p.wage || 0, p.status]]);
      } else {
        shAtt.appendRow([ts, p.id || '-', p.date, p.staffName, p.clockIn, p.clockOut || '-', p.wage || 0, p.status]);
      }

    } else if (eventType === 'CLOSE_SHIFT') {
      var shCls = getOrCreateSheet(ss, 'CLOSING_SHIFT', [
        'Timestamp', 'ID_Closing', 'Tanggal', 'Kasir', 'Modal_Awal',
        'Sales_Cash', 'Sales_QRIS', 'Sales_Transfer', 'Sales_Online_Food',
        'Total_Omzet', 'Ekspektasi_Cash_Laci', 'Cash_Fisik_Aktual', 'Selisih_Laci'
      ]);
      shCls.appendRow([
        ts, p.id, tgl, p.cashier, p.openingCash,
        p.cashSales, p.qrisSales, p.transferSales, p.onlineFoodSales || 0,
        p.totalSales, p.expectedCash, p.actualCash, p.diff
      ]);

    } else if (eventType === 'ORDER_AUDIT' || eventType === 'ORDER_CANCELLED' || eventType === 'PAID_TRX_CANCELLED') {
      var shAud = getOrCreateSheet(ss, 'AUDIT_OTORISASI', [
        'Timestamp', 'ID_Audit', 'Jenis_Aksi', 'No_Order',
        'Detail_Perubahan', 'Alasan', 'Kasir_Pelaksana', 'Disetujui_Oleh_PIN'
      ]);
      var detail = p.itemName ? (p.itemName + ' (' + p.fromQty + ' -> ' + p.toQty + ')') : ('Batal Transaksi (' + (p.customer || '-') + ' - Rp ' + (p.total || 0) + ')');
      shAud.appendRow([ts, p.id, p.action || eventType, p.orderId, detail, p.reason, p.cashier, p.approvedBy]);

      if (eventType === 'PAID_TRX_CANCELLED' && p.total > 0) {
        var shCfVoid = getOrCreateSheet(ss, 'ARUS_KAS_CASHFLOW', [
          'Timestamp', 'Tanggal', 'No_Ref', 'Kategori_Kas', 'Metode',
          'Keterangan', 'Debit_Masuk', 'Kredit_Keluar', 'PIC'
        ]);
        shCfVoid.appendRow([
          ts, tgl, p.orderId, 'Pembatalan Transaksi (Void)', p.paymentMethod || 'POS',
          'Void Nota ' + p.orderId + ' (' + p.reason + ') - Disetujui ' + p.approvedBy,
          0, p.total, p.cashier
        ]);
      }

    } else if (eventType === 'SYNC_MASTER_TABLES' || eventType === 'FULL_MASTER_SYNC') {
      writeMasterTables(ss, ts, p);
    }

    return ContentService.createTextOutput(JSON.stringify({ status: 'OK', eventType: eventType })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'ERROR', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function getOrCreateSheet(ss, name, headers) {
  var sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.appendRow(headers);
    sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
    sh.setFrozenRows(1);
  }
  return sh;
}`;

    function isPromoValidToday(pr) {
      if (!pr || !pr.active) return false;
      const today = new Date().toISOString().slice(0, 10);
      if (pr.startDate && today < pr.startDate) return false;
      if (pr.endDate && today > pr.endDate) return false;
      return true;
    }

    function getCartTotals() {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const activePromos = db.promos.filter(pr => isPromoValidToday(pr));
      const isManualPromo = cartPromoCode === '__MANUAL__';
      const promo = !isManualPromo ? activePromos.find(pr => pr.code === cartPromoCode) : null;
      const discount = isManualPromo
        ? Math.min(subtotal, Math.max(0, Number(cartManualDiscount) || 0))
        : (promo ? (promo.type === 'percent' ? Math.round(subtotal * promo.value / 100) : Math.min(subtotal, promo.value)) : 0);
      const grandTotal = Math.max(0, subtotal - discount);
      return { subtotal, discount, grandTotal, isManualPromo, promo };
    }

                const isProtectedReduce = editingOpenOrderId && lockedMin > 0 && item.qty <= lockedMin;
                return `
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border-glass);">
                    <div style="min-width:0;flex:1;">
                      <div style="font-size:12px;font-weight:900;color:var(--green-deep);">
                        ${esc(item.name)}
                        ${lockedMin > 0 ? `<span class="badge-pill badge-yellow" style="margin-left:4px;font-size:9px;">Tersimpan: ${lockedMin}</span>` : ''}
                      </div>
                      <div style="font-size:11px;color:var(--text-muted);">${rp(item.price)} x ${item.qty} = <strong>${rp(item.price * item.qty)}</strong></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                      <button type="button" class="btn ${isProtectedReduce ? 'btn-pink' : 'btn-soft'} btn-sm" style="padding:4px 9px;" title="${isProtectedReduce ? 'Butuh PIN Manager/Owner untuk mengurangi' : 'Kurangi'}" onclick="updateCartQty('${esc(item.id)}', -1)">-</button>
                      <span style="font-size:12px;font-weight:900;min-width:18px;text-align:center;">${item.qty}</span>
                      <button type="button" class="btn btn-dark btn-sm" style="padding:4px 9px;" onclick="updateCartQty('${esc(item.id)}', 1)">+</button>

              <label class="field-label">Promo & Potongan Diskon</label>
              <select class="styled-select" style="padding:8px 11px;font-size:12px;" onchange="handleCartPromoSelect(this.value)">
                <option value="" ${cartPromoCode === '' ? 'selected' : ''}>Tanpa Promo / Diskon</option>
                ${activePromos.map(pr => `
                  <option value="${esc(pr.code)}" ${cartPromoCode === pr.code ? 'selected' : ''}>
                    ${esc(pr.code)} — ${esc(pr.name)} (${pr.type === 'percent' ? pr.value + '%' : rp(pr.value)})
                  </option>
                `).join('')}
                <option value="__MANUAL__" ${isManualPromo ? 'selected' : ''}>Potongan Manual (Promo Online / Custom Rp)</option>
              </select>
              ${isManualPromo ? `
                <div style="margin-top:6px;">
                  <input id="manualPromoInput" type="text" inputmode="numeric" class="styled-input" style="padding:8px 11px;font-size:13px;" placeholder="Ketik nominal potongan (contoh: 15.000)..." value="${cartManualDiscount > 0 ? formatDigits(cartManualDiscount) : ''}" oninput="handleManualDiscountInput(this)" />

                    <button type="button" class="btn btn-soft btn-sm" onclick="setQuickManualDiscount(5000)">Rp 5.000</button>
                    <button type="button" class="btn btn-soft btn-sm" onclick="setQuickManualDiscount(10000)">Rp 10.000</button>
                    <button type="button" class="btn btn-soft btn-sm" onclick="setQuickManualDiscount(15000)">Rp 15.000</button>
                    <button type="button" class="btn btn-soft btn-sm" onclick="setQuickManualDiscount(20000)">Rp 20.000</button>

    function addToCart(prodId) {
      const prod = db.products.find(p => p.id === prodId);
      if (!prod) return;
      const existing = cart.find(c => c.id === prodId);
      if (existing) existing.qty += 1;
      else {
        cart.push({
          id: prod.id,
          sku: prod.sku,
          name: prod.name,
          category: prod.category,
          brand: getProductBrand(prod),
          includeCommissionShare: isProductIncludedInCommission(prod),
          includeSalaryShare: isProductIncludedInSalaryShare(prod),
          price: prod.price,
          cost: prod.cost || 0,
          qty: 1
        });
      }
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function handleCartPromoSelect(val) {
      cartPromoCode = val;
      if (val !== '__MANUAL__') cartManualDiscount = 0;
      renderCashierPOS(document.getElementById('mainContentArea'));
      if (val === '__MANUAL__') {
        const inp = document.getElementById('manualPromoInput');
        if (inp) inp.focus();
      }
    }

    function handleManualDiscountInput(el) {
      const rawDigits = el.value.replace(/\D/g, '');
      cartManualDiscount = Number(rawDigits) || 0;
      el.value = rawDigits ? formatDigits(rawDigits) : '';
      const summaryEl = document.getElementById('cartSummarySection');
      if (summaryEl) summaryEl.innerHTML = buildCartSummaryHTML();
    }

    function setQuickManualDiscount(amount) {
      cartManualDiscount = amount;
      const inp = document.getElementById('manualPromoInput');
      if (inp) inp.value = amount > 0 ? formatDigits(amount) : '';
      const summaryEl = document.getElementById('cartSummarySection');
      if (summaryEl) summaryEl.innerHTML = buildCartSummaryHTML();
    }

    function updateCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;
      if (delta < 0 && editingOpenOrderId) {
        const lockedMin = savedOpenOrderBaseline[prodId] || 0;
        if (lockedMin > 0 && cart[idx].qty <= lockedMin) {
          openManagerPinAuthModal('REDUCE_ITEM', editingOpenOrderId, prodId);
          return;
        }
      }
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function clearCart() {
      cart = [];
      editingOpenOrderId = null;
      editingOpenOrderDate = null;
      savedOpenOrderBaseline = {};
      cartCustomer = '';
      cartCustomerPhone = '';
      cartPromoCode = '';
      cartManualDiscount = 0;
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function openManagerPinAuthModal(actionType, orderId, prodId = '') {
      const ord = db.transactions.find(t => t.id === orderId);
      const item = prodId ? cart.find(c => c.id === prodId) : null;
      let title = `Kurangi Item Tersimpan (${esc(item ? item.name : '')})`;
      let desc = `Item "${esc(item ? item.name : '')}" sudah tersimpan pada pesanan ${esc(orderId)}. Pengurangan item wajib verifikasi PIN Owner / Manager & alasan.`;
      let btnText = 'Verifikasi & Kurangi Item';

      if (actionType === 'CANCEL_ORDER') {
        title = `Batalkan Pesanan Tersimpan (${esc(orderId)})`;
        desc = `Pesanan milik "${esc(ord ? ord.customer : orderId)}" akan dibatalkan permanen. Wajib verifikasi PIN Owner / Manager & alasan.`;
        btnText = 'Verifikasi & Batalkan Order';
      } else if (actionType === 'CANCEL_PAID_TRX') {
        title = `Batalkan Transaksi Lunas (${esc(orderId)})`;
        desc = `Transaksi lunas milik "${esc(ord ? ord.customer : orderId)}" sebesar <strong>${rp(ord ? ord.total : 0)}</strong> akan dibatalkan (Void). Saldo omzet akan dikurangi & wajib otorisasi PIN Owner / Manager.`;
        btnText = 'Verifikasi & Batalkan Transaksi';
      }

      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-pink" style="margin-bottom:4px;">OTORISASI OWNER / MANAGER</span>
            <h3 style="margin:0;font-size:16px;">${title}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <p style="font-size:12px;color:var(--text-muted);margin:0 0 12px;">${desc}</p>

        <div style="display:grid;gap:10px;margin-bottom:14px;">
          <div>
            <label class="field-label">Pilih Alasan Pembatalan / Perubahan</label>
            <select id="mgrAuthReason" class="styled-select">
              ${CANCEL_REASONS.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="field-label">PIN Owner / Manager (4-Digit)</label>
            <input id="mgrAuthPin" type="password" inputmode="numeric" maxlength="4" class="styled-input" style="font-size:18px;letter-spacing:0.25em;text-align:center;" placeholder="••••" />
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px;">
          <button type="button" class="btn btn-soft" onclick="closeModal()">Kembali</button>
          <button type="button" class="btn btn-pink" style="padding:12px;" onclick="confirmManagerPinAuth('${esc(actionType)}', '${esc(orderId)}', '${esc(prodId)}')">
            ${btnText}
          </button>
        </div>
      `);
      setTimeout(() => {
        const pinInp = document.getElementById('mgrAuthPin');
        if (pinInp) pinInp.focus();
      }, 60);
    }

    function confirmManagerPinAuth(actionType, orderId, prodId) {
      const reason = document.getElementById('mgrAuthReason')?.value || CANCEL_REASONS[0];
      const pin = (document.getElementById('mgrAuthPin')?.value || '').trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pin);
      if (!approver) {
        showToast('PIN Owner/Manager tidak valid!', true);
        return;
      }

      if (!db.orderAuditLogs) db.orderAuditLogs = [];

      if (actionType === 'REDUCE_ITEM') {
        const idx = cart.findIndex(c => c.id === prodId);
        if (idx === -1) { closeModal(); return; }
        const item = cart[idx];
        const prevQty = item.qty;
        item.qty -= 1;

        if (savedOpenOrderBaseline[prodId] > item.qty) {
          savedOpenOrderBaseline[prodId] = Math.max(0, item.qty);
        }
        if (item.qty <= 0) {
          cart.splice(idx, 1);
          delete savedOpenOrderBaseline[prodId];
        }

        const ordIdx = db.transactions.findIndex(t => t.id === orderId);
        if (ordIdx >= 0) {
          if (cart.length === 0) {
            db.transactions[ordIdx].status = 'CANCELLED';
            db.transactions[ordIdx].cancelReason = reason;
            db.transactions[ordIdx].cancelledBy = approver.name;
            db.transactions[ordIdx].cancelledAt = new Date().toISOString();
          } else {
            const newSub = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const newCost = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
            db.transactions[ordIdx].items = JSON.parse(JSON.stringify(cart));
            db.transactions[ordIdx].subtotal = newSub;
            db.transactions[ordIdx].total = newSub;
            db.transactions[ordIdx].costTotal = newCost;
          }
        }

        const logEntry = {
          id: 'AUD-' + Date.now(),
          date: new Date().toISOString(),
          action: 'REDUCE_OPEN_ITEM',
          orderId,
          itemName: item.name,
          fromQty: prevQty,
          toQty: Math.max(0, prevQty - 1),
          reason,
          cashier: currentUser.name,
          approvedBy: approver.name
        };
        db.orderAuditLogs.unshift(logEntry);
        syncMasterEvent('ORDER_AUDIT', logEntry);
        autoSyncMasterSlices(['openOrders']);
        saveDB();
        closeModal();

        if (cart.length === 0) {
          clearCart();
          showToast(`Item dikurangi hingga kosong, order ${orderId} dibatalkan (${reason})`);
        } else {
          renderCashierPOS(document.getElementById('mainContentArea'));
          showToast(`Item dikurangi (${reason}) — Disetujui ${approver.name}`);
        }
      } else if (actionType === 'CANCEL_ORDER') {
        const ordIdx = db.transactions.findIndex(t => t.id === orderId);
        const ordObj = ordIdx >= 0 ? db.transactions[ordIdx] : null;
        if (ordObj) {
          ordObj.status = 'CANCELLED';
          ordObj.paymentMethod = 'BATAL';
          ordObj.cancelReason = reason;
          ordObj.cancelledBy = approver.name;
          ordObj.cancelledAt = new Date().toISOString();
        }

        const logEntry = {
          id: 'AUD-' + Date.now(),
          date: new Date().toISOString(),
          action: 'CANCEL_OPEN_ORDER',
          orderId,
          customer: ordObj ? ordObj.customer : '-',
          total: ordObj ? ordObj.total : 0,
          reason,
          cashier: currentUser.name,
          approvedBy: approver.name
        };
        db.orderAuditLogs.unshift(logEntry);
        syncMasterEvent('ORDER_CANCELLED', logEntry);
        autoSyncMasterSlices(['openOrders']);
        saveDB();
        closeModal();

        if (editingOpenOrderId === orderId) {
          clearCart();
        } else {
          renderWorkspace();
        }
        showToast(`Order ${orderId} dibatalkan (${reason}) — Disetujui ${approver.name}`);
      } else if (actionType === 'CANCEL_PAID_TRX') {
        const ordIdx = db.transactions.findIndex(t => t.id === orderId);
        const ordObj = ordIdx >= 0 ? db.transactions[ordIdx] : null;
        const prevMethod = ordObj ? ordObj.paymentMethod : 'POS';
        if (ordObj) {
          ordObj.status = 'CANCELLED';
          ordObj.prevPaymentMethod = prevMethod;
          ordObj.paymentMethod = 'BATAL';
          ordObj.cancelReason = reason;
          ordObj.cancelledBy = approver.name;
          ordObj.cancelledAt = new Date().toISOString();

          (ordObj.items || []).forEach(it => {
            const prod = db.products.find(p => p.id === it.id);
            if (prod) prod.stock = (Number(prod.stock) || 0) + (Number(it.qty) || 0);
          });
        }

        const logEntry = {
          id: 'AUD-' + Date.now(),
          date: new Date().toISOString(),
          action: 'CANCEL_PAID_TRANSACTION',
          orderId,
          customer: ordObj ? ordObj.customer : '-',
          paymentMethod: prevMethod,
          total: ordObj ? ordObj.total : 0,
          reason,
          cashier: currentUser.name,
          approvedBy: approver.name
        };
        db.orderAuditLogs.unshift(logEntry);
        syncMasterEvent('PAID_TRX_CANCELLED', logEntry);
        saveDB();
        closeModal();
        renderWorkspace();
        showToast(`Transaksi ${orderId} dibatalkan (${reason}) — Disetujui ${approver.name}`);
      }
    }

          <button type="button" class="btn btn-danger" style="width:100%;" onclick="openManagerPinAuthModal('CANCEL_PAID_TRX', '${esc(trx.id)}')">Batalkan Pesanan (PIN)</button>
        ` : (!isCancelled ? `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button type="button" class="btn btn-dark" onclick="closeModal();loadOpenOrderToCart('${esc(trx.id)}')">Muat ke Kasir</button>
            <button type="button" class="btn btn-danger" onclick="openManagerPinAuthModal('CANCEL_ORDER', '${esc(trx.id)}')">Batalkan Order (PIN)</button>

        ` : `

    function handleCartCustomerInput(val) {
      cartCustomer = val;
      const found = (db.customers || []).find(c => c.name.toLowerCase() === val.trim().toLowerCase());
      if (found && found.phone && !cartCustomerPhone) {
        cartCustomerPhone = found.phone;
        const pInp = document.getElementById('cartPhoneInput');
        if (pInp) pInp.value = found.phone;
      }
    }

    function handleCartPhoneInput(val) {
      cartCustomerPhone = val;
      const clean = val.replace(/\D/g, '');
      if (clean.length >= 9) {
        const found = (db.customers || []).find(c => (c.phone || '').replace(/\D/g, '') === clean);
        if (found) {
          if (!cartCustomer.trim()) {
            cartCustomer = found.name;
            renderCashierPOS(document.getElementById('mainContentArea'));
          }
          if (found.specialVoucher && !cartPromoCode) {
            const validPromo = db.promos.find(pr => pr.code === found.specialVoucher && isPromoValidToday(pr));
            if (validPromo) {
              cartPromoCode = validPromo.code;
              renderCashierPOS(document.getElementById('mainContentArea'));
              showToast(`Voucher CRM ${validPromo.code} milik ${found.name} otomatis terdeteksi!`);
            }
          }
        }
      }
    }

    function upsertCRMCustomerFromOrder(name, phone, orderTotal, promoUsed) {
      const cleanName = String(name || '').trim();
      const cleanPhone = String(phone || '').trim();
      if (!cleanPhone && (!cleanName || cleanName === 'Walk-in' || cleanName === 'Split Bill')) return false;
      if (!db.customers) db.customers = [];

      const digits = cleanPhone.replace(/\D/g, '');
      let existing = digits
        ? db.customers.find(c => (c.phone || '').replace(/\D/g, '') === digits)
        : db.customers.find(c => c.name.toLowerCase() === cleanName.toLowerCase());

      if (existing) {
        if (cleanName && cleanName !== 'Walk-in') existing.name = cleanName;
        if (cleanPhone) existing.phone = cleanPhone;
        if (orderTotal > 0) {
          existing.totalVisits = (Number(existing.totalVisits) || 0) + 1;
          existing.totalSpent = (Number(existing.totalSpent) || 0) + (Number(orderTotal) || 0);
          existing.lastVisit = new Date().toISOString();
          if (existing.totalSpent >= 500000) existing.tier = 'VIP Member';
          else if (existing.totalSpent >= 150000) existing.tier = 'Gold Member';
        }
      } else {
        db.customers.unshift({
          id: 'CRM-' + Math.floor(100 + Math.random() * 900),
          name: cleanName || ('Pelanggan ' + cleanPhone),
          phone: cleanPhone,
          tier: orderTotal >= 150000 ? 'Gold Member' : 'Regular',
          totalVisits: orderTotal > 0 ? 1 : 0,
          totalSpent: Number(orderTotal) || 0,
          lastVisit: new Date().toISOString(),
          notes: promoUsed ? `Menggunakan promo ${promoUsed}` : 'Pelanggan POS',
          specialVoucher: ''
        });
      }
      return true;
    }

    function saveAsOpenOrder() {
      if (cart.length === 0) return;
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const costTotal = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const trxId = editingOpenOrderId || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
      const savedDate = editingOpenOrderDate || new Date().toISOString();
      const orderObj = {
        id: trxId, date: savedDate, updatedAt: new Date().toISOString(), orderType: cartOrderType,
        customer: cartCustomer.trim() || 'Pelanggan ' + trxId,
        customerPhone: cartCustomerPhone.trim(),
        cashier: currentUser.name,
        status: 'OPEN', paymentMethod: 'OPEN', subtotal, discount: 0, total: subtotal, costTotal,
        cashPaid: 0, change: 0, items: JSON.parse(JSON.stringify(cart))
      };
      const exIdx = db.transactions.findIndex(t => t.id === trxId);
      if (exIdx >= 0) db.transactions[exIdx] = orderObj;
      else db.transactions.unshift(orderObj);
      saveDB();
      autoSyncMasterSlices(['openOrders']);
      clearCart();
      showToast(`Order ${trxId} disimpan & disinkronkan ke semua kasir.`);

    function loadOpenOrderToCart(trxId) {
      const ord = db.transactions.find(t => t.id === trxId);
      if (!ord) return;
      cart = JSON.parse(JSON.stringify(ord.items));
      cartOrderType = ord.orderType;
      cartCustomer = ord.customer;
      cartCustomerPhone = ord.customerPhone || '';
      editingOpenOrderId = ord.id;
      editingOpenOrderDate = ord.date;

      });

    // ==================== SPLIT BILL ====================

      splitSelectedQty = {};

      const selectedTotal = cart.reduce((s, it) => s + it.price * (splitSelectedQty[it.id] || 0), 0);

                  <span style="font-size:13px;font-weight:900;min-width:28px;text-align:center;">${selQ}/${item.qty}</span>
                  <button class="btn btn-dark btn-sm" onclick="adjustSplitItem('${esc(item.id)}', 1, ${item.qty})">+</button>
                </div>
              </div>
            `;

            <div>
              <div class="kpi-label">Nominal Split Dibayar</div>
              <div class="kpi-value">${rp(selectedTotal)}</div>

          Bayar Menu Terpilih (${rp(selectedTotal)})
        </button>
      `);
    }

    function adjustSplitItem(prodId, delta, maxQty) {
      const cur = splitSelectedQty[prodId] || 0;
      splitSelectedQty[prodId] = Math.max(0, Math.min(maxQty, cur + delta));
      renderSplitBillModalContent();
    }

    function proceedSplitToCheckout() {
      const paidItems = [];
      const leftoverItems = [];
      cart.forEach(item => {
        const payQ = splitSelectedQty[item.id] || 0;
        const remQ = item.qty - payQ;
        if (payQ > 0) paidItems.push({ ...item, qty: payQ });
        if (remQ > 0) leftoverItems.push({ ...item, qty: remQ });
      });
      if (paidItems.length === 0) return;

      const paidTotal = paidItems.reduce((s, i) => s + i.price * i.qty, 0);
      pendingSplitContext = { paidItems, leftoverItems };
      openCheckoutModal(paidTotal, paidTotal, 0, true);
    }

    function updateCashChangeUI(received, total) {

      if (diff < 0) {

        disp.textContent = `Kurang ${rp(Math.abs(diff))}`;

        disp.style.color = '#0B2E23';
