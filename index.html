<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background: rgba(11, 46, 35, 0.78);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* CRM SUGGESTION DROPDOWN */
    .crm-suggest-box {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #FFFFFF;
      border: 1.5px solid var(--green-deep);
      border-radius: 14px;
      box-shadow: var(--shadow-float);
      z-index: 60;
      max-height: 170px;
      overflow-y: auto;
    }
    .crm-suggest-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .crm-suggest-item:last-child { border-bottom: none; }
    .crm-suggest-item:hover { background: var(--green-soft); }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .prod-card:active {
      transform: scale(0.97);
      border-color: var(--green-deep);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
        <div style="width:54px;height:54px;border-radius:16px;background:#093814;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.28);">

    function renderJiwaraPngIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

    (function setupOfflineServiceWorker() {
      try {
        const startUrl = window.location.href.split('#')[0];
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v15';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              if (e.request.url.includes('script.google.com')) return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});

    function getDateBounds(period, customStart, customEnd) {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      let label = 'Hari Ini';

      if (period === 'YESTERDAY') {
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
        label = 'Kemarin';
      } else if (period === 'THIS_WEEK') {
        const day = start.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        start.setDate(start.getDate() + diffToMon);
        label = 'Minggu Ini (Sen–Min)';
      } else if (period === 'LAST_WEEK') {
        const day = start.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        start.setDate(start.getDate() + diffToMon - 7);
        end.setTime(start.getTime());
        end.setDate(start.getDate() + 6);
        end.setHours(23, 59, 59);
        label = 'Minggu Lalu';
      } else if (period === '7D') {
        start.setDate(start.getDate() - 6);
        label = '7 Hari Terakhir';
      } else if (period === 'MONTH') {
        start.setDate(1);
        label = 'Bulan Ini';
      } else if (period === 'CUSTOM') {
        const s = customStart || todayISO();
        const e = customEnd || todayISO();
        const sd = new Date(s + 'T00:00:00');
        const ed = new Date(e + 'T23:59:59');
        return { start: sd, end: ed, label: `${s} s/d ${e}` };
      }
      return { start, end, label };
    }

    function isDateInBounds(isoDateStr, bounds) {
      if (!isoDateStr) return false;
      const norm = normalizeCloudDate(isoDateStr);
      const d = new Date(norm + 'T12:00:00');
      return d >= bounds.start && d <= bounds.end;
    }

    function normalizeCloudDate(rawDate) {
      if (!rawDate) return todayISO();
      const s = String(rawDate).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        }
        return s.slice(0, 10);
      }
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (dmy) {
        return `${dmy[3]}-${String(dmy[2]).padStart(2, '0')}-${String(dmy[1]).padStart(2, '0')}`;
      }
      const parsed = new Date(s);
      if (!isNaN(parsed.getTime())) {
        return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
      }
      return todayISO();
    }

    function applyCloudPullData(data) {
      if (!data || typeof data !== 'object') return false;
      let changed = false;

      if (data.outletProfile && typeof data.outletProfile === 'object') {
        const op = data.outletProfile;
        if (op.outletName && op.outletName !== db.settings.outletName) { db.settings.outletName = op.outletName; changed = true; }
        if (op.address && op.address !== db.settings.address) { db.settings.address = op.address; changed = true; }
        if (op.phone !== undefined && op.phone !== db.settings.phone) { db.settings.phone = op.phone; changed = true; }
        if (op.socialMedia !== undefined && op.socialMedia !== db.settings.socialMedia) { db.settings.socialMedia = op.socialMedia; changed = true; }
        if (op.receiptFooter !== undefined && op.receiptFooter !== db.settings.receiptFooter) { db.settings.receiptFooter = op.receiptFooter; changed = true; }
      }

      if (Array.isArray(data.deletedBrands)) {
        const mergedDeleted = Array.from(new Set([...(db.deletedBrands || []), ...data.deletedBrands]));
        if (JSON.stringify(mergedDeleted) !== JSON.stringify(db.deletedBrands || [])) {
          db.deletedBrands = mergedDeleted;
          changed = true;
        }
      }

      if (Array.isArray(data.products) && data.products.length > 0) {
        const deletedSet = new Set((db.deletedBrands || []).map(b => b.toLowerCase()));
        const cleanProds = data.products.map(p => ({
          ...p,
          brand: (p.brand && !deletedSet.has(String(p.brand).toLowerCase())) ? p.brand : 'Kopi Jiwara',
          includeCommissionShare: p.includeCommissionShare !== false,
          includeSalaryShare: p.includeSalaryShare !== false
        }));
        if (JSON.stringify(cleanProds) !== JSON.stringify(db.products)) {
          db.products = cleanProds;
          changed = true;
        }
      }

      if (Array.isArray(data.categories) && data.categories.length > 0) {
        const mergedCats = normalizeUniqueCategories(data.categories);
        if (JSON.stringify(mergedCats) !== JSON.stringify(db.categories)) {
          db.categories = mergedCats;
          changed = true;
        }
      }

      if (Array.isArray(data.brandConfigs) && data.brandConfigs.length > 0) {
        const deletedSet = new Set((db.deletedBrands || []).map(b => b.toLowerCase()));
        const filteredBrands = data.brandConfigs.filter(b => b && b.brand && !deletedSet.has(String(b.brand).toLowerCase()));
        if (filteredBrands.length > 0 && JSON.stringify(filteredBrands) !== JSON.stringify(db.brandConfigs)) {
          db.brandConfigs = filteredBrands;
          changed = true;
        }
      }

      if (Array.isArray(data.inventory) && data.inventory.length > 0) {
        if (JSON.stringify(data.inventory) !== JSON.stringify(db.inventory)) {
          db.inventory = data.inventory;
          changed = true;
        }
      }

      if (Array.isArray(data.staff) && data.staff.length > 0) {
        if (JSON.stringify(data.staff) !== JSON.stringify(db.staff)) {
          db.staff = data.staff;
          changed = true;
        }

      if (Array.isArray(data.promos)) {
        if (JSON.stringify(data.promos) !== JSON.stringify(db.promos)) {
          db.promos = data.promos;
          changed = true;
        }
      }

      if (Array.isArray(data.customers)) {
        if (JSON.stringify(data.customers) !== JSON.stringify(db.customers)) {
          db.customers = data.customers;
          changed = true;
        }
      }

      if (Array.isArray(data.openOrders)) {
        const nonOpen = db.transactions.filter(t => t.status !== 'OPEN');
        const currentOpen = db.transactions.filter(t => t.status === 'OPEN');
        const cloudOpen = data.openOrders.map(o => ({ ...o, status: 'OPEN', date: normalizeCloudDate(o.date) }));
        if (JSON.stringify(cloudOpen) !== JSON.stringify(currentOpen)) {
          db.transactions = [...nonOpen, ...cloudOpen];
          changed = true;

      if (Array.isArray(data.paidTransactions)) {
        const localMap = new Map(db.transactions.map(t => [t.id, t]));
        const itemsByTrx = {};
        if (Array.isArray(data.paidItems)) {
          data.paidItems.forEach(it => {
            if (!it || !it.trxId) return;
            if (!itemsByTrx[it.trxId]) itemsByTrx[it.trxId] = [];
            itemsByTrx[it.trxId].push({
              id: it.id || ('PRD-' + (it.sku || it.name)),

        data.paidTransactions.forEach(pt => {
          if (!pt || !pt.id) return;
          const normDate = normalizeCloudDate(pt.date);
          const cloudItems = itemsByTrx[pt.id] || (Array.isArray(pt.items) ? pt.items : []);
          const cloudCost = cloudItems.reduce((s, i) => s + (Number(i.cost) || 0) * (Number(i.qty) || 1), 0);
          const existing = localMap.get(pt.id);

          if (!existing) {
            db.transactions.push({

              status: 'PAID',
              date: normDate,
              time: pt.time || '00:00',
              orderType: pt.orderType || 'Meja',

              existing.total = Number(pt.total) || existing.total;
              changed = true;
            }
            if (existing.date !== normDate) {
              existing.date = normDate;
              changed = true;
            }
            if ((!existing.items || existing.items.length === 0) && cloudItems.length > 0) {
              existing.items = cloudItems;
              existing.totalCost = cloudCost;
              changed = true;
            }
          }
        });
      }

      if (Array.isArray(data.cashDrawer)) {
        const localCashIds = new Set(db.cashDrawer.map(c => c.id));
        data.cashDrawer.forEach(cc => {
          if (cc && cc.id && !localCashIds.has(cc.id)) {

            changed = true;

      if (Array.isArray(data.attendance)) {
        const localAttIds = new Set(db.attendance.map(a => a.id));
        data.attendance.forEach(ca => {
          if (ca && ca.id && !localAttIds.has(ca.id)) {

      if (Array.isArray(data.brandSettlements)) {
        const localStlIds = new Set((db.brandSettlements || []).map(s => s.id));
        data.brandSettlements.forEach(cs => {
          if (cs && cs.id && !localStlIds.has(cs.id)) {
            db.brandSettlements.push({
              ...cs,
              date: normalizeCloudDate(cs.date)
            });
            changed = true;
          }
        });
      }

      if (changed) saveDB();
      return changed;
    }

    async function pullFromCloudMaster(manualTrigger = false) {
      const url = (db.settings.webhookUrl || '').trim();
      if (!url) {
        if (manualTrigger) showToast('Isi URL Webhook Google Apps Script terlebih dahulu.', true);
        return;
      }
      if (!navigator.onLine) {
        updateLiveSyncIndicator('Offline', false);
        if (manualTrigger) showToast('Perangkat sedang offline.', true);
        return;
      }
      if (isPullingCloud) return;

      isPullingCloud = true;
      updateLiveSyncIndicator('Menyinkron...', true);
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=pull&t=${Date.now()}`, { method: 'GET' });
        const json = await res.json();
        const hasChanges = applyCloudPullData(json);
        const nowStr = nowTimeStr();
        updateLiveSyncIndicator(`Live • ${nowStr}`, false);
        if (manualTrigger) {
          showToast(hasChanges ? 'Data terbaru dari Cloud berhasil ditarik!' : 'Semua perangkat sudah sinkron (terbaru).');
        }
        if (hasChanges && currentUser && !isUserActivelyTyping()) {
          const modalOpen = !document.getElementById('modalBackdrop')?.classList.contains('hidden');
          if (!modalOpen) renderWorkspace();
        }
      } catch (err) {
        updateLiveSyncIndicator('Sync Error', false);
        if (manualTrigger) {
          showToast('Gagal menarik data. Pastikan Apps Script sudah di-deploy dengan fungsi doGet().', true);
        }
      } finally {
        isPullingCloud = false;
      }
    }

    // ==================== BLUETOOTH THERMAL PRINTER ENGINE ====================
    let btPrinterDevice = null;

    const BT_PRINTER_SERVICES = [
      '000018f0-0000-1000-8000-00805f9b34fb',
      '49535343-fe7d-4ae5-8fa9-9fafd205e455',
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2',

    ];

    async function findWritableBtCharacteristic(server) {
      const services = await server.getPrimaryServices();
      for (const svc of services) {
        const chars = await svc.getCharacteristics();
        for (const ch of chars) {
          if (ch.properties.write || ch.properties.writeWithoutResponse) {
            return ch;
          }
        }
      }
      return null;
    }

    async function ensureBtPrinterConnected(silent = true) {
      if (btPrinterCharacteristic && btPrinterDevice && btPrinterDevice.gatt && btPrinterDevice.gatt.connected) {
        return true;
      }
      if (!navigator.bluetooth) return false;

      try {
        if (btPrinterDevice && btPrinterDevice.gatt) {
          const server = await btPrinterDevice.gatt.connect();
          const ch = await findWritableBtCharacteristic(server);
          if (ch) {
            btPrinterCharacteristic = ch;
            return true;
          }
        }

        if (db.settings.printerLocked && typeof navigator.bluetooth.getDevices === 'function') {
          const pairedDevices = await navigator.bluetooth.getDevices();
          const target = pairedDevices.find(d =>
            (db.settings.printerDeviceId && d.id === db.settings.printerDeviceId) ||
            (db.settings.printerName && d.name === db.settings.printerName)
          ) || pairedDevices[0];

          if (target && target.gatt) {
            const server = await target.gatt.connect();
            const ch = await findWritableBtCharacteristic(server);
            if (ch) {
              btPrinterDevice = target;
              btPrinterCharacteristic = ch;
              return true;
            }
          }
        }
      } catch (err) {
        if (!silent) showToast('Menghubungkan ke printer Bluetooth...', false);
      }
      return false;
    }

    function buildEscPosReceiptBytes(trx) {
      const encoder = new TextEncoder();
      const lineWidth = db.settings.printerPaperSize === '80mm' ? 42 : 32;
      const hr = '-'.repeat(lineWidth) + '\n';
      const center = (txt) => {
        const s = String(txt || '').slice(0, lineWidth);
        const pad = Math.max(0, Math.floor((lineWidth - s.length) / 2));
        return ' '.repeat(pad) + s + '\n';
      };
      const lr = (left, right) => {
        const l = String(left || '');
        const r = String(right || '');
        const space = Math.max(1, lineWidth - l.length - r.length);
        return l + ' '.repeat(space) + r + '\n';
      };

      const isDraft = Boolean(trx.isDraftBill);
      const totalQty = (trx.items || []).reduce((s, i) => s + (Number(i.qty) || 0), 0);

      let out = '\x1B\x40';
      out += '\x1B\x61\x01\x1B\x45\x01' + (db.settings.outletName || 'KOPI JIWARA') + '\n\x1B\x45\x00';
      if (isDraft) {
        out += '\x1B\x45\x01*** CEK PESANAN / TAGIHAN ***\n\x1B\x45\x00';
      }
      out += (db.settings.address || '') + '\n';
      if (db.settings.phone) out += 'Telp/WA: ' + db.settings.phone + '\n';
      if (db.settings.socialMedia) out += db.settings.socialMedia + '\n';
      out += '\x1B\x61\x00' + hr;
      out += `Nota  : ${trx.id}\n`;
      out += `Waktu : ${trx.date} ${trx.time}\n`;
      out += `Tipe  : ${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''}\n`;
      out += `Kasir : ${trx.cashier}\n` + hr;

      trx.items.forEach(item => {
        out += `${item.name}\n`;
        out += lr(`  ${item.qty} x ${item.price.toLocaleString('id-ID')}`, (item.qty * item.price).toLocaleString('id-ID'));
      });

      out += hr;
      out += lr('Total Pesanan', `${totalQty} Item`);
      out += lr('Subtotal', rp(trx.subtotal));
      if (trx.discount > 0) out += lr('Diskon', '-' + rp(trx.discount));
      out += '\x1B\x45\x01' + lr(isDraft ? 'TOTAL TAGIHAN' : 'TOTAL', rp(trx.total)) + '\x1B\x45\x00';
      if (isDraft) {
        out += lr('Status', 'BELUM LUNAS (DRAFT)');
      } else {
        out += lr('Bayar (' + trx.paymentMethod + ')', rp(trx.cashReceived || trx.total));
        if (trx.paymentMethod === 'Cash') out += lr('Kembalian', rp(trx.change || 0));
      }
      out += hr + center(isDraft ? 'Struk sementara untuk pengecekan' : (db.settings.receiptFooter || 'Terima kasih!'));
      out += '\n\n\n\x1D\x56\x41\x03';
      return encoder.encode(out);
    }

    async function connectAndLockBluetoothPrinter() {
      if (!navigator.bluetooth) {
        showToast('Browser ini tidak mendukung Web Bluetooth langsung. Gunakan Chrome Android/Desktop.', true);
        return;
      }
      try {
        showToast('Memindai printer thermal Bluetooth...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: BT_PRINTER_SERVICES
        });
        const server = await device.gatt.connect();
        const writeChar = await findWritableBtCharacteristic(server);
        if (!writeChar) {
          showToast('Karakteristik tulis printer tidak ditemukan.', true);
          return;
        }
        btPrinterDevice = device;
        btPrinterCharacteristic = writeChar;
        device.addEventListener('gattserverdisconnected', () => {
          btPrinterCharacteristic = null;
        });
        db.settings.printerName = device.name || 'Thermal Printer BT';
        db.settings.printerDeviceId = device.id || 'BT-LOCKED';
        db.settings.printerLocked = true;
        saveDB();
        renderSettingsTab(document.getElementById('mainContentArea'));
        showToast(`Printer "${db.settings.printerName}" berhasil terhubung & dikunci!`);
      } catch (err) {
        showToast('Koneksi Bluetooth dibatalkan atau gagal.', true);
      }
    }

    function unlockBluetoothPrinter() {
      btPrinterDevice = null;
      btPrinterCharacteristic = null;
      db.settings.printerLocked = false;
      db.settings.printerName = '';
      db.settings.printerDeviceId = '';
      saveDB();
      renderSettingsTab(document.getElementById('mainContentArea'));
      showToast('Kunci printer Bluetooth dilepas.');
    }

    async function writeBytesToBtPrinter(bytes) {
      const connected = await ensureBtPrinterConnected(true);
      if (!connected || !btPrinterCharacteristic) return false;
      try {
        const chunkSize = 100;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const slice = bytes.slice(i, i + chunkSize);
          await btPrinterCharacteristic.writeValue(slice);
        }
        return true;
      } catch (e) {
        btPrinterCharacteristic = null;
        return false;
      }
    }

    function renderLoginStaffDropdown() {
      const sel = document.getElementById('loginStaffSelect');
      if (!sel) return;
      const activeStaff = db.staff.filter(s => s.active);
      sel.innerHTML = activeStaff.map(s => `<option value="${esc(s.id)}">${esc(s.name)} • ${esc(s.role)}</option>`).join('');

    function updatePinDotsUI() {
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      dots.forEach((d, idx) => d.classList.toggle('filled', idx < pinBuffer.length));
    }

    function pressPin(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      updatePinDotsUI();
      if (pinBuffer.length === 4) setTimeout(submitPinLogin, 120);
    }

    function clearPinPad() {
      pinBuffer = '';
      updatePinDotsUI();
    }

    function submitPinLogin() {
      const staffId = document.getElementById('loginStaffSelect').value;
      const staff = db.staff.find(s => s.id === staffId);
      if (!staff) {
        showToast('Pilih pegawai terlebih dahulu.', true);
        return;
      }
      if (pinBuffer !== staff.pin) {
        showToast('PIN salah! Silakan coba lagi.', true);
        clearPinPad();
        return;
      }
      currentUser = staff;
      const isMgmt = staff.role === 'Owner' || staff.role === 'Manager';
      workspaceMode = isMgmt ? 'OWNER' : 'KASIR';
      activeTab = 'pos';
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ staffId: staff.id, workspaceMode }));
      clearPinPad();
      enterWorkspace();
      showToast(`Selamat bertugas, ${staff.name}!`);
    }

    function enterWorkspace() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appWorkspace').classList.remove('hidden');
      renderWorkspace();
      startCloudAutoPullLoop();
      if (db.settings.webhookUrl) pullFromCloudMaster(false);
      if (db.settings.printerLocked) ensureBtPrinterConnected(true);

      if (workspaceMode === 'KASIR') {
        activeTab = 'keluar_kasir';

        showToast('Silakan selesaikan Tutup Kasir terlebih dahulu sebelum keluar.');

      if (activeTab === 'pos') renderPosTab(area);
      else if (activeTab === 'penjualan') renderSalesTab(area);
      else if (activeTab === 'kas_kasir') renderKasKasirTab(area);
      else if (activeTab === 'absensi_kasir') renderAbsensiKasirTab(area);
      else if (activeTab === 'keluar_kasir') renderKeluarKasirTab(area);
      else if (activeTab === 'laporan') renderLaporanTab(area);
      else if (activeTab === 'pelanggan') renderPelangganTab(area);
      else if (activeTab === 'inventori') renderInventoriTab(area);
      else if (activeTab === 'pengaturan') renderPengaturanTab(area);
    }

    // ==================== TAB 1: POS KASIR ====================
    function getCartTotals() {
      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const totalCost = cart.reduce((sum, i) => sum + ((i.cost || 0) * i.qty), 0);
      let promoDiscount = 0;

      if (selectedPromoCode && selectedPromoCode !== 'MANUAL_DISC' && selectedPromoCode !== 'ONLINE_DISC') {
        const promo = db.promos.find(p => p.code === selectedPromoCode && p.active);
        if (promo && subtotal >= (promo.minPurchase || 0)) {
          promoDiscount = promo.type === 'PERCENT'
            ? Math.round(subtotal * (promo.value / 100))
            : Math.min(subtotal, promo.value);
        }
      }

      const manDisc = selectedPromoCode === 'MANUAL_DISC' ? Math.max(0, Number(manualDiscountNominal) || 0) : 0;
      const onlDisc = selectedPromoCode === 'ONLINE_DISC' ? Math.max(0, Number(onlineDiscountNominal) || 0) : 0;
      const totalDiscount = Math.min(subtotal, promoDiscount + manDisc + onlDisc);
      const grandTotal = Math.max(0, subtotal - totalDiscount);
      return { subtotal, totalCost, promoDiscount, manDisc, onlDisc, totalDiscount, grandTotal };
    }

    function handleCustomerNameInput(val) {
      tableOrCustomerNote = val;
      const box = document.getElementById('crmSuggestBox');
      if (!box) return;
      const q = val.trim().toLowerCase();
      if (!q) {
        selectedCustomerId = '';
        box.classList.add('hidden');
        return;
      }
      const matches = db.customers.filter(c =>
        c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(q))
      ).slice(0, 5);
      if (matches.length === 0) {
        box.classList.add('hidden');
        return;
      }
      box.innerHTML = matches.map(c => `
        <div class="crm-suggest-item" onmousedown="selectCrmSuggestion('${esc(c.id)}')">
          <div>
            <strong>${esc(c.name)}</strong>
            <div style="font-size:10px;color:var(--text-muted);">${esc(c.phone || 'Tanpa No. WA')} • ${esc(c.tier || 'Member')}</div>
          </div>
          <span class="badge-pill badge-green">Pilih</span>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function hideCrmSuggestBox() {
      const box = document.getElementById('crmSuggestBox');
      if (box) box.classList.add('hidden');
    }

    function selectCrmSuggestion(custId) {
      const c = db.customers.find(x => x.id === custId);
      if (!c) return;
      selectedCustomerId = c.id;
      tableOrCustomerNote = c.name;
      if (c.phone) customerPhoneInput = c.phone;
      if (c.voucher && !selectedPromoCode) selectedPromoCode = c.voucher;
      hideCrmSuggestBox();
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function handlePromoOrDiscountSelect(val) {
      selectedPromoCode = val;
      if (val !== 'MANUAL_DISC') manualDiscountNominal = 0;
      if (val !== 'ONLINE_DISC') onlineDiscountNominal = 0;
      renderPosTab(document.getElementById('mainContentArea'));
    }

    let lastPosTapTimestamp = 0;
    function triggerPosGridSelection(event) {
      const card = event.target.closest('.prod-card');
      if (!card) return;
      const now = Date.now();
      if (now - lastPosTapTimestamp < 180) return;
      lastPosTapTimestamp = now;

      const prodId = card.getAttribute('data-prod-id') || '';
      const prodSku = card.getAttribute('data-prod-sku') || '';
      addToCart(prodId, prodSku);
    }

    document.addEventListener('click', function(e) {
      if (e.target && e.target.closest('#posProductGrid .prod-card')) {
        triggerPosGridSelection(e);
      }
    });

    function addToCart(prodId, prodSku = '') {
      const targetId = String(prodId || '').trim();
      const targetSku = String(prodSku || '').trim();
      const prod = db.products.find(p =>
        (targetId && String(p.id).trim() === targetId) ||
        (targetSku && String(p.sku).trim() === targetSku)
      );
      if (!prod) {
        showToast('Data produk tidak ditemukan, silakan muat ulang menu.', true);
        return;
      }
      const canonicalId = String(prod.id || prod.sku || targetId);
      const existing = cart.find(c =>
        String(c.id).trim() === canonicalId ||
        (prod.sku && String(c.sku).trim() === String(prod.sku).trim())
      );
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: canonicalId,
          sku: prod.sku || '',
          name: prod.name,
          brand: prod.brand || 'Kopi Jiwara',
          includeCommissionShare: prod.includeCommissionShare !== false,
          includeSalaryShare: prod.includeSalaryShare !== false,
          price: Number(prod.price) || 0,
          cost: Number(prod.cost) || 0,
          qty: 1
        });
      }
      renderPosTab(document.getElementById('mainContentArea'));
      showToast(`+1 ${prod.name}`);
    }

    function updateCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;
      const nextQty = cart[idx].qty + delta;
      if (nextQty <= 0) {
        if (activeOpenOrderId) {
          requestPinAuthorization(`Hapus item ${cart[idx].name} dari Open Order`, () => {
            cart.splice(idx, 1);
            renderPosTab(document.getElementById('mainContentArea'));
          });
          return;
        }
        cart.splice(idx, 1);
      } else {
        cart[idx].qty = nextQty;
      }
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function clearCart() {
      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      customerPhoneInput = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      onlineDiscountNominal = 0;
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function saveAsOpenOrder() {
      if (cart.length === 0) return;
      const totals = getCartTotals();
      const id = activeOpenOrderId || ('ORD-' + Date.now().toString().slice(-6));
      const existingIdx = db.transactions.findIndex(t => t.id === id);
      const record = {
        id,
        status: 'OPEN',
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote.trim(),
        customerPhone: customerPhoneInput.trim(),
        customerId: selectedCustomerId,
        cashier: currentUser.name,
        items: JSON.parse(JSON.stringify(cart)),
        subtotal: totals.subtotal,
        discount: totals.totalDiscount,
        promoCode: selectedPromoCode,
        total: totals.grandTotal,
        totalCost: totals.totalCost,
        paymentMethod: 'UNPAID'
      };
      if (existingIdx >= 0) db.transactions[existingIdx] = record;
      else db.transactions.unshift(record);
      saveDB();
      autoSyncMasterSlices(['OPEN_ORDERS']);
      clearCart();
      showToast(`Open Order ${id} disimpan!`);
    }

    function loadOpenOrderToCart(trxId) {
      const trx = db.transactions.find(t => t.id === trxId && t.status === 'OPEN');
      if (!trx) return;
      activeOpenOrderId = trx.id;
      orderType = trx.orderType || 'Meja';
      tableOrCustomerNote = trx.tableOrCustomer || '';
      customerPhoneInput = trx.customerPhone || '';
      selectedCustomerId = trx.customerId || '';
      selectedPromoCode = trx.promoCode || '';
      cart = JSON.parse(JSON.stringify(trx.items));
      activeTab = 'pos';
      renderWorkspace();
      showToast(`Open Order ${trx.id} dimuat ke keranjang.`);
    }

    // ==================== CHECKOUT & ITEMIZED SPLIT BILL MODAL ====================
    function openCheckoutModal() {
      if (!db.shift.isOpen) {
        showToast('Buka Shift Kasir terlebih dahulu sebelum menerima pembayaran!', true);
        return;
      }
      if (cart.length === 0) return;
      payModalMode = 'FULL';
      singlePayMethod = 'Cash';
      splitSelectedItems = {};
      cart.forEach(item => { splitSelectedItems[item.id] = 0; });
      const totals = getCartTotals();
      cashReceivedInput = totals.grandTotal;
      renderCheckoutModalBody();
    }

    function getSplitSelectionSummary() {
      const fullTotals = getCartTotals();
      const selectedItems = [];
      let selectedSubtotal = 0;
      let totalCartQty = 0;
      let selectedQty = 0;

      cart.forEach(item => {
        totalCartQty += item.qty;
        const pickQty = Math.min(item.qty, Math.max(0, Number(splitSelectedItems[item.id]) || 0));
        selectedQty += pickQty;
        if (pickQty > 0) {
          selectedItems.push({ ...item, qty: pickQty });
          selectedSubtotal += item.price * pickQty;
        }
      });

      const discountRatio = fullTotals.subtotal > 0 ? (selectedSubtotal / fullTotals.subtotal) : 0;
      const proportionalDiscount = Math.min(selectedSubtotal, Math.round(fullTotals.totalDiscount * discountRatio));
      const splitGrandTotal = Math.max(0, selectedSubtotal - proportionalDiscount);

      return {
        selectedItems,
        selectedSubtotal,
        proportionalDiscount,
        splitGrandTotal,
        selectedQty,
        totalCartQty,
        remainingQty: totalCartQty - selectedQty
      };
    }

    function changeSplitItemQty(prodId, delta) {
      const item = cart.find(c => c.id === prodId);
      if (!item) return;
      const cur = Number(splitSelectedItems[prodId]) || 0;
      splitSelectedItems[prodId] = Math.max(0, Math.min(item.qty, cur + delta));
      const splitInfo = getSplitSelectionSummary();
      cashReceivedInput = splitInfo.splitGrandTotal;
      renderCheckoutModalBody();
    }

    function autoRecordOrUpdateCrmCustomer(nameRaw, phoneRaw, grandTotal) {
      const cleanName = (nameRaw || '').trim();
      const cleanPhone = (phoneRaw || '').trim();
      const waDigits = sanitizeWaPhone(cleanPhone);

      let cust = null;
      if (selectedCustomerId) {
        cust = db.customers.find(c => c.id === selectedCustomerId);
      }
      if (!cust && waDigits) {
        cust = db.customers.find(c => sanitizeWaPhone(c.phone) === waDigits);
      }
      if (!cust && cleanName && !/^meja\s*\d+/i.test(cleanName)) {
        cust = db.customers.find(c => c.name.toLowerCase() === cleanName.toLowerCase());
      }

      const earnedPts = Math.floor((grandTotal || 0) / 10000);
      if (cust) {
        if (cleanPhone && !cust.phone) cust.phone = cleanPhone;
        if (cleanName && !/^meja\s*\d+/i.test(cleanName)) cust.name = cleanName;
        cust.points = (Number(cust.points) || 0) + earnedPts;
        if (cust.points >= 50) cust.tier = 'Gold Member';
        autoSyncMasterSlices(['CUSTOMERS']);
        return cust;
      }

      if (cleanPhone || (cleanName && !/^meja\s*\d+/i.test(cleanName))) {
        const newCust = {
          id: 'CST-' + Date.now().toString().slice(-5),
          name: cleanName || `Pelanggan ${cleanPhone.slice(-4)}`,
          phone: cleanPhone,
          tier: 'Silver Member',
          points: earnedPts,
          voucher: ''
        };
        db.customers.push(newCust);
        autoSyncMasterSlices(['CUSTOMERS']);
        return newCust;
      }
      return null;
    }

    function completeCheckoutPayment() {
      const fullTotals = getCartTotals();
      let itemsToPay = [];
      let subtotalPaid = 0;
      let discountPaid = 0;
      let totalPaid = 0;
      let remainingItems = [];

      if (payModalMode === 'SPLIT') {
        const splitInfo = getSplitSelectionSummary();
        if (splitInfo.selectedItems.length === 0) {
          showToast('Pilih minimal 1 item untuk dibayar.', true);
          return;
        }
        itemsToPay = splitInfo.selectedItems;
        subtotalPaid = splitInfo.selectedSubtotal;
        discountPaid = splitInfo.proportionalDiscount;
        totalPaid = splitInfo.splitGrandTotal;

        cart.forEach(item => {
          const picked = Math.min(item.qty, Math.max(0, Number(splitSelectedItems[item.id]) || 0));
          const remQty = item.qty - picked;
          if (remQty > 0) {
            remainingItems.push({ ...item, qty: remQty });
          }
        });
      } else {
        itemsToPay = JSON.parse(JSON.stringify(cart));
        subtotalPaid = fullTotals.subtotal;
        discountPaid = fullTotals.totalDiscount;
        totalPaid = fullTotals.grandTotal;
      }

      if (singlePayMethod === 'Cash' && cashReceivedInput < totalPaid) {
        showToast('Uang tunai diterima kurang dari total tagihan!', true);
        return;
      }

      const costPaid = itemsToPay.reduce((s, i) => s + ((i.cost || 0) * i.qty), 0);
      const trxId = 'TRX-' + Date.now().toString().slice(-6);

      itemsToPay.forEach(item => {
        const prod = db.products.find(p => p.id === item.id);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
      });

      const recordedCust = autoRecordOrUpdateCrmCustomer(tableOrCustomerNote, customerPhoneInput, totalPaid);

      const trx = {
        id: trxId,
        status: 'PAID',
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote.trim(),
        customerPhone: customerPhoneInput.trim() || (recordedCust ? recordedCust.phone : ''),
        customerId: recordedCust ? recordedCust.id : selectedCustomerId,
        cashier: currentUser.name,
        items: itemsToPay,
        subtotal: subtotalPaid,
        discount: discountPaid,
        promoCode: selectedPromoCode,
        total: totalPaid,
        totalCost: costPaid,
        paymentMethod: singlePayMethod,
        cashReceived: singlePayMethod === 'Cash' ? cashReceivedInput : totalPaid,
        change: singlePayMethod === 'Cash' ? Math.max(0, cashReceivedInput - totalPaid) : 0
      };

      db.transactions.unshift(trx);

      let remainingOpenOrder = null;
      if (remainingItems.length > 0) {
        const remSubtotal = remainingItems.reduce((s, i) => s + (i.price * i.qty), 0);
        const remDiscount = Math.max(0, fullTotals.totalDiscount - discountPaid);
        const remTotal = Math.max(0, remSubtotal - remDiscount);
        const remCost = remainingItems.reduce((s, i) => s + ((i.cost || 0) * i.qty), 0);
        const openId = activeOpenOrderId || ('ORD-' + (Date.now() + 1).toString().slice(-6));
        const existingOpenIdx = db.transactions.findIndex(t => t.id === openId);
        remainingOpenOrder = {
          id: openId,
          status: 'OPEN',
          date: todayISO(),
          time: nowTimeStr(),
          orderType,
          tableOrCustomer: tableOrCustomerNote.trim(),
          customerPhone: customerPhoneInput.trim(),
          customerId: recordedCust ? recordedCust.id : selectedCustomerId,
          cashier: currentUser.name,
          items: remainingItems,
          subtotal: remSubtotal,
          discount: remDiscount,
          promoCode: selectedPromoCode,
          total: remTotal,
          totalCost: remCost,
          paymentMethod: 'UNPAID'
        };
        if (existingOpenIdx >= 0) db.transactions[existingOpenIdx] = remainingOpenOrder;
        else db.transactions.unshift(remainingOpenOrder);
      } else if (activeOpenOrderId) {
        db.transactions = db.transactions.filter(t => !(t.id === activeOpenOrderId && t.status === 'OPEN'));
      }

      saveDB();
      syncMasterEvent('POS_TRANSACTION_PAID', trx);
      autoSyncMasterSlices(['MENU', 'OPEN_ORDERS']);

      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      customerPhoneInput = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      onlineDiscountNominal = 0;

      renderPosTab(document.getElementById('mainContentArea'));
      showPostPaymentReceiptModal(trx, remainingOpenOrder);
    }

    function confirmCancelTransactionWithReason(trxId) {
      const trx = db.transactions.find(t => t.id === trxId);
      if (!trx) return;
      const reason = document.getElementById('cancelReasonSel').value;
      const pin = document.getElementById('cancelAuthPinInp').value;

      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pin);
      if (!approver) {
        showToast('PIN Manager / Owner tidak valid!', true);
        return;
      }

      const wasPaid = trx.status === 'PAID';
      if (wasPaid) {
        trx.items.forEach(item => {
          const prod = db.products.find(p => p.id === item.id);
          if (prod) prod.stock = (Number(prod.stock) || 0) + item.qty;
        });
      }

      trx.status = 'CANCELLED';
      trx.cancelReason = reason;
      trx.cancelledBy = approver.name;
      trx.cancelledAt = `${todayISO()} ${nowTimeStr()}`;

      const logEntry = {
        id: 'LOG-' + Date.now().toString().slice(-5),
        date: todayISO(),
        time: nowTimeStr(),
        action: `Batalkan Pesanan ${trx.id} (${reason})`,
        requestedBy: currentUser.name,
        approvedBy: approver.name
      };
      db.auditLogs.unshift(logEntry);
      saveDB();

      syncMasterEvent('SECURITY_PIN_AUDIT', logEntry);
      if (wasPaid) {
        syncMasterEvent('PAID_TRX_CANCELLED', { trxId: trx.id, reason, approvedBy: approver.name });
        autoSyncMasterSlices(['MENU']);
      } else {
        autoSyncMasterSlices(['OPEN_ORDERS']);
      }

      closeModal();
      renderWorkspace();
      showToast(`Pesanan ${trx.id} dibatalkan (${reason}).`);
    }

    // ==================== KASIR TABS: KAS KASIR, ABSENSI, KELUAR KASIR ====================
    function computeTodayCashStats() {
      const today = todayISO();
      const paidToday = db.transactions.filter(t => t.status === 'PAID' && t.date === today);
      const grossSales = paidToday.reduce((s, t) => s + t.total, 0);
      const cashSales = paidToday.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + t.total, 0);
      const qrisSales = paidToday.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0);
      const tfSales = paidToday.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
      const onlineSales = paidToday.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);

      const soldMap = {};
      let totalQtySold = 0;
      paidToday.forEach(t => {
        t.items.forEach(item => {
          totalQtySold += item.qty;
          soldMap[item.name] = (soldMap[item.name] || 0) + item.qty;
        });
      });
      const soldProductsList = Object.entries(soldMap)
        .map(([name, qty]) => ({ name, qty }))
        .sort((a, b) => b.qty - a.qty);

      const drawerToday = db.cashDrawer.filter(c => c.date === today);
      const cashIn = drawerToday.filter(c => c.type === 'IN').reduce((s, c) => s + c.amount, 0);
      const cashOut = drawerToday.filter(c => c.type === 'OUT').reduce((s, c) => s + c.amount, 0);
      const expectedCash = (db.shift.openingCash || 0) + cashSales + cashIn - cashOut;

      return {
        count: paidToday.length,
        grossSales,
        cashSales,
        qrisSales,
        tfSales,
        onlineSales,
        cashIn,
        cashOut,
        expectedCash,
        totalQtySold,
        soldProductsList
      };
    }

        return;

      const actualCash = Number(document.getElementById('closingActualCash').value) || 0;
      const stats = computeTodayCashStats();
      const diff = actualCash - stats.expectedCash;
      const closingRecord = {
        id: 'CLS-' + Date.now().toString().slice(-5),
        date: todayISO(),
        time: nowTimeStr(),
        closedBy: currentUser.name,
        expectedCash: stats.expectedCash,
        actualCash,
        difference: diff,
        grossSales: stats.grossSales
      };
      db.shift.closingHistory.unshift(closingRecord);
      db.shift.isOpen = false;
      db.shift.openedBy = '';
      db.shift.openingCash = 0;
      saveDB();
      syncMasterEvent('SHIFT_CLOSING_REPORT', closingRecord);

    // ==================== BRAND MANAGEMENT & SETTLEMENT HELPERS ====================
    function getAllAvailableBrands() {
      const deletedSet = new Set((db.deletedBrands || []).map(b => b.toLowerCase()));
      const seen = new Set();
      const list = [];
      const addUniqueBrand = (raw) => {
        const clean = String(raw || '').trim();
        if (!clean) return;
        const key = clean.toLowerCase();
        if (deletedSet.has(key)) return;
        if (!seen.has(key)) {
          seen.add(key);
          list.push(clean);
        }
      };

      (db.brandConfigs || []).forEach(bc => {
        if (bc.active !== false) addUniqueBrand(bc.brand);
      });
      db.products.forEach(p => addUniqueBrand(p.brand));
      if (list.length === 0) addUniqueBrand('Kopi Jiwara');
      return list;
    }

    function getBrandConfig(brandName) {
      if (!Array.isArray(db.brandConfigs)) db.brandConfigs = [];
      let cfg = db.brandConfigs.find(b => b.brand.toLowerCase() === String(brandName || '').toLowerCase());
      if (!cfg) {
        cfg = { brand: brandName, commissionPct: 10, salaryShareActive: true, ownerPhone: '', active: true };
        db.brandConfigs.push(cfg);
      }
      return cfg;
    }

      if (brandName.toLowerCase() === 'kopi jiwara') {

    // ==================== SETTLEMENT BRAND MINGGUAN ENGINE ====================
    function computeBrandSettlementSummary(bounds) {
      const paidTrx = db.transactions.filter(t => t.status === 'PAID' && isDateInBounds(t.date, bounds));
      const attLogs = db.attendance.filter(a => isDateInBounds(a.date, bounds));
      const cashLogs = db.cashDrawer.filter(c => isDateInBounds(c.date, bounds));

      const attPayroll = attLogs.reduce((s, a) => s + (Number(a.wage) || 0), 0);
      const manualSalaryCashOut = cashLogs
        .filter(c => c.type === 'OUT' && /gaji/i.test(c.note || ''))
        .reduce((s, c) => s + (Number(c.amount) || 0), 0);
      const autoCalculatedPayroll = attPayroll + manualSalaryCashOut;
      const totalWeeklyPayroll = (settleManualPayrollInput !== null && settleManualPayrollInput !== '')
        ? Math.max(0, Number(settleManualPayrollInput) || 0)
        : autoCalculatedPayroll;

      const brands = getAllAvailableBrands();
      const brandMap = {};
      brands.forEach(b => {
        const cfg = getBrandConfig(b);
        brandMap[b] = {
          brand: b,
          commissionPct: Number(cfg.commissionPct) || 0,
          ownerPhone: cfg.ownerPhone || '',
          totalQty: 0,
          commissionEligibleQty: 0,
          salaryEligibleQty: 0,
          grossSales: 0,
          commissionEligibleSales: 0
        };
      });

      let totalSalaryEligibleQtyAllBrands = 0;

      paidTrx.forEach(trx => {
        const trxSub = trx.subtotal > 0 ? trx.subtotal : trx.items.reduce((s, i) => s + (i.price * i.qty), 0);
        const netRatio = trxSub > 0 ? Math.max(0, (trx.total / trxSub)) : 1;

        trx.items.forEach(item => {
          const prodRef = db.products.find(p => p.id === item.id || p.sku === item.sku);
          const rawBrand = item.brand || (prodRef ? prodRef.brand : 'Kopi Jiwara') || 'Kopi Jiwara';
          const brandName = brandMap[rawBrand] ? rawBrand : 'Kopi Jiwara';
          const includeComm = item.includeCommissionShare !== undefined
            ? Boolean(item.includeCommissionShare)
            : (prodRef ? prodRef.includeCommissionShare !== false : true);
          const includeSal = item.includeSalaryShare !== undefined
            ? Boolean(item.includeSalaryShare)
            : (prodRef ? prodRef.includeSalaryShare !== false : true);

          if (!brandMap[brandName]) {
            brandMap[brandName] = {
              brand: brandName,
              commissionPct: 10,
              ownerPhone: '',
              totalQty: 0,
              commissionEligibleQty: 0,
              salaryEligibleQty: 0,
              grossSales: 0,
              commissionEligibleSales: 0
            };
          }

          const itemNetRev = Math.round((item.price * item.qty) * netRatio);
          brandMap[brandName].totalQty += item.qty;
          brandMap[brandName].grossSales += itemNetRev;

          if (includeComm) {
            brandMap[brandName].commissionEligibleQty += item.qty;
            brandMap[brandName].commissionEligibleSales += itemNetRev;
          }

          if (includeSal) {
            brandMap[brandName].salaryEligibleQty += item.qty;
            totalSalaryEligibleQtyAllBrands += item.qty;
          }
        });
      });

      const rows = Object.values(brandMap).map(row => {
        const commFee = Math.round(row.commissionEligibleSales * (row.commissionPct / 100));
        const salaryShareRatio = totalSalaryEligibleQtyAllBrands > 0
          ? (row.salaryEligibleQty / totalSalaryEligibleQtyAllBrands)
          : 0;
        const salaryDeduction = Math.round(totalWeeklyPayroll * salaryShareRatio);
        const netTransfer = Math.max(0, row.grossSales - commFee - salaryDeduction);
        return {
          ...row,
          commissionFee: commFee,
          salarySharePct: Math.round(salaryShareRatio * 1000) / 10,
          salaryDeduction,
          netTransfer
        };
      });

      return {
        bounds,
        rows,
        totalWeeklyPayroll,
        autoCalculatedPayroll,
        attPayroll,
        manualSalaryCashOut,
        totalSalaryEligibleQtyAllBrands
      };
    }

    function executeBrandSettlementTransfer(brandName) {
      const bounds = getDateBounds(settlePeriod, settleCustomStart, settleCustomEnd);
      const summary = computeBrandSettlementSummary(bounds);
      const row = summary.rows.find(r => r.brand === brandName);
      if (!row || row.netTransfer <= 0) {
        showToast('Nominal transfer bersih Rp 0, tidak ada yang perlu ditransfer.', true);
        return;
      }

      const stlId = 'STL-' + Date.now().toString().slice(-6);
      const settlementRec = {
        id: stlId,
        date: todayISO(),
        periodLabel: bounds.label,
        brand: row.brand,
        totalQty: row.totalQty,
        salaryEligibleQty: row.salaryEligibleQty,
        grossSales: row.grossSales,
        commissionPct: row.commissionPct,
        commissionFee: row.commissionFee,
        salarySharePct: row.salarySharePct,
        salaryShare: row.salaryDeduction,
        netTransfer: row.netTransfer,
        by: currentUser ? currentUser.name : 'Owner'
      };

      if (!Array.isArray(db.brandSettlements)) db.brandSettlements = [];
      db.brandSettlements.unshift(settlementRec);

      const cashEntry = {
        id: 'KAS-' + (Date.now() + 1).toString().slice(-5),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OUT',
        amount: row.netTransfer,
        note: `Transfer Sales ${row.brand} (${bounds.label})`,
        by: currentUser ? currentUser.name : 'Owner'
      };
      db.cashDrawer.unshift(cashEntry);
      saveDB();

      syncMasterEvent('BRAND_SETTLEMENT_TRANSFER', settlementRec);
      syncMasterEvent('CASH_DRAWER_MUTATION', cashEntry);
      renderBrandSettlementSubtab(document.getElementById('reportSubContent'));
      showToast(`Transfer Sales ${row.brand} (${rp(row.netTransfer)}) tercatat!`);
    }

    function submitOwnerCashFlow() {
      const type = document.getElementById('ownerCashType').value;
      const amount = Number(document.getElementById('ownerCashAmount').value) || 0;
      const note = document.getElementById('ownerCashNote').value.trim();
      if (amount <= 0 || !note) {
        showToast('Lengkapi nominal dan keterangan biaya.', true);
        return;
      }
      const entry = {
        id: 'KAS-' + Date.now().toString().slice(-5),
        date: todayISO(),
        time: nowTimeStr(),
        type,
        amount,
        note,
        by: currentUser.name
      };
      db.cashDrawer.unshift(entry);
      saveDB();
      syncMasterEvent('CASH_DRAWER_MUTATION', entry);
      renderLaporanTab(document.getElementById('mainContentArea'));
      showToast('Arus kas operasional tersimpan.');
    }

    function saveStockAdjustment() {
      const id = document.getElementById('adjInvId').value;
      const type = document.getElementById('adjInvType').value;
      const qty = Math.max(1, Number(document.getElementById('adjInvQty').value) || 0);
      const note = document.getElementById('adjInvNote').value.trim() || 'Penyesuaian stok';
      const item = db.inventory.find(i => i.id === id);
      if (!item) return;

      item.stock = type === 'IN' ? item.stock + qty : Math.max(0, item.stock - qty);
      const logEntry = {
        id: 'STK-' + Date.now().toString().slice(-5),
        date: todayISO(),
        time: nowTimeStr(),
        itemId: item.id,
        itemName: item.name,
        type,
        qty,
        note,
        by: currentUser.name
      };
      db.stockLogs.unshift(logEntry);
      saveDB();
      syncMasterEvent('INVENTORY_STOCK_ADJUST', logEntry);
      autoSyncMasterSlices(['INVENTORY']);
      closeModal();
      renderInventoriTab(document.getElementById('mainContentArea'));
      showToast('Stok berhasil diperbarui.');
    }

    function moveCategoryOrder(catName, direction) {
      const list = normalizeUniqueCategories(db.categories);
      const idx = list.findIndex(c => c.toLowerCase() === catName.toLowerCase());
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      const temp = list[idx];
      list[idx] = list[targetIdx];
      list[targetIdx] = temp;
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['CATEGORIES_BRANDS']);
      renderPengaturanTab(document.getElementById('mainContentArea'));
      showToast(`Urutan kategori "${catName}" diperbarui.`);
    }

    function setCategoryOrderPosition(catName, newPosRaw) {
      const list = normalizeUniqueCategories(db.categories);
      const oldIdx = list.findIndex(c => c.toLowerCase() === catName.toLowerCase());
      if (oldIdx === -1) return;
      const targetIdx = Math.max(0, Math.min(list.length - 1, (parseInt(newPosRaw, 10) || 1) - 1));
      if (oldIdx === targetIdx) return;
      const [moved] = list.splice(oldIdx, 1);
      list.splice(targetIdx, 0, moved);
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['CATEGORIES_BRANDS']);
      renderPengaturanTab(document.getElementById('mainContentArea'));
      showToast(`Kategori "${catName}" dipindah ke urutan #${targetIdx + 1}.`);
    }
