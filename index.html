      return `
        <div style="display:grid;grid-template-columns:1fr;gap:14px;">
          <!-- KATEGORI MENU -->
          <div class="bento-card" style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <div>
                <h3 style="margin:0;font-size:15px;font-weight:900;">Daftar Kategori Menu</h3>
                <p style="margin:2px 0 0;font-size:11px;color:var(--text-muted);">Klik baris kategori untuk edit nama atau hapus kategori</p>
              </div>
              <button class="btn btn-pink" onclick="openAddMenuCategoryModal()">+ Tambah Kategori</button>
            </div>

            <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;">
              <input type="text" class="styled-input" style="padding:9px 12px;font-size:12px;"
                placeholder="Cari nama kategori..." value="${escapeHtml(catSearch)}"
                oninput="catSearch=this.value;catPage=1;renderOwnerContent()" />
              <select class="styled-select" style="padding:9px 10px;font-size:12px;width:auto;"
                onchange="catPageSize=Number(this.value);catPage=1;renderOwnerContent()">
                <option value="10" ${catPageSize === 10 ? 'selected' : ''}>10 / hal</option>
                <option value="20" ${catPageSize === 20 ? 'selected' : ''}>20 / hal</option>
                <option value="50" ${catPageSize === 50 ? 'selected' : ''}>50 / hal</option>
                <option value="100" ${catPageSize === 100 ? 'selected' : ''}>100 / hal</option>
              </select>
            </div>

            <div class="table-box" style="max-height:310px;overflow-y:auto;">
              <table class="compact-table">
                <thead>
                  <tr>
                    <th style="width:52px;">No</th>
                    <th>Nama Kategori</th>
                    <th>Jumlah Produk</th>
                    <th style="text-align:right;">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  ${catSlice.length === 0 ? `
                    <tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:16px;">Kategori tidak ditemukan.</td></tr>
                  ` : catSlice.map((c, i) => `
                    <tr style="cursor:pointer;" onclick="openEditMenuCategoryModal(${c.idx})">
                      <td style="font-weight:800;color:var(--text-muted);">${(catPage - 1) * catPageSize + i + 1}</td>
                      <td style="font-weight:900;">${escapeHtml(c.name)}</td>
                      <td><span class="badge-pill badge-green">${c.count} Produk</span></td>
                      <td style="text-align:right;">
                        <button type="button" class="btn btn-soft btn-sm" onclick="event.stopPropagation();openEditMenuCategoryModal(${c.idx})">Edit</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:800;color:var(--text-muted);padding-top:4px;">
              <span>Halaman ${catPage} / ${totalCatPages} (${filteredCats.length} kategori)</span>
              <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                <button type="button" class="btn btn-soft btn-sm" ${catPage <= 1 ? 'disabled style="opacity:0.45;cursor:not-allowed;"' : ''} onclick="goCategoryPage(${catPage - 1})">‹ Sebelumnya</button>
                ${renderPagePills(catPage, totalCatPages, 'goCategoryPage')}
                <button type="button" class="btn btn-dark btn-sm" ${catPage >= totalCatPages ? 'disabled style="opacity:0.45;cursor:not-allowed;"' : ''} onclick="goCategoryPage(${catPage + 1})">Selanjutnya ›</button>
              </div>
            </div>
          </div>

          <!-- DAFTAR PRODUK JUAL -->
          <div class="bento-card" style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <div>
                <h3 style="margin:0;font-size:15px;font-weight:900;">Daftar Produk Jual</h3>
                <p style="margin:2px 0 0;font-size:11px;color:var(--text-muted);">Klik baris produk untuk edit detail atau hapus produk</p>
              </div>
              <button class="btn btn-yellow" onclick="openProductFormModal()">+ Tambah Produk</button>
            </div>

            <div style="display:grid;grid-template-columns:1fr;gap:8px;">
              <input type="text" class="styled-input" style="padding:9px 12px;font-size:12px;"
                placeholder="Cari nama produk atau SKU..." value="${escapeHtml(prodSearch)}"
                oninput="prodSearch=this.value;prodPage=1;renderOwnerContent()" />
              <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:8px;">
                <select class="styled-select" style="padding:9px 10px;font-size:12px;" onchange="prodCatFilter=this.value;prodPage=1;renderOwnerContent()">
                  <option value="Semua">Semua Kategori</option>
                  ${db.categories.filter(c => c !== 'Favorit').map(c => `<option value="${escapeHtml(c)}" ${prodCatFilter === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
                </select>
                <select class="styled-select" style="padding:9px 10px;font-size:12px;" onchange="prodPageSize=Number(this.value);prodPage=1;renderOwnerContent()">
                  <option value="10" ${prodPageSize === 10 ? 'selected' : ''}>Tampil: 10</option>
                  <option value="20" ${prodPageSize === 20 ? 'selected' : ''}>Tampil: 20</option>
                  <option value="50" ${prodPageSize === 50 ? 'selected' : ''}>Tampil: 50</option>
                  <option value="100" ${prodPageSize === 100 ? 'selected' : ''}>Tampil: 100</option>
                </select>
              </div>
            </div>

            <div class="table-box" style="max-height:390px;overflow-y:auto;">
              <table class="compact-table">
                <thead>
                  <tr>
                    <th>SKU</th>
                    <th>Nama Produk</th>
                    <th>Kategori</th>
                    <th>Harga Jual</th>
                    <th>Satuan</th>
                    <th style="text-align:right;">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  ${slice.length === 0 ? `
                    <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:16px;">Produk tidak ditemukan.</td></tr>
                  ` : slice.map(p => `
                    <tr style="cursor:pointer;" onclick="openProductFormModal('${p.id}')">
                      <td style="font-weight:800;white-space:nowrap;">${escapeHtml(p.sku)}</td>
                      <td style="font-weight:800;">${escapeHtml(p.name)} ${p.fav ? '<span class="badge-pill badge-yellow">★</span>' : ''}</td>
                      <td><span class="badge-pill badge-green">${escapeHtml(p.category)}</span></td>
                      <td style="font-weight:900;white-space:nowrap;">${formatRp(p.price)}</td>
                      <td>${escapeHtml(p.unit)}</td>
                      <td style="text-align:right;white-space:nowrap;">
                        <button type="button" class="btn btn-soft btn-sm" onclick="event.stopPropagation();openProductFormModal('${p.id}')">Edit →</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:800;color:var(--text-muted);padding-top:4px;">
              <span>Halaman ${prodPage} / ${totalPages} (${filtered.length} produk)</span>
              <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                <button type="button" class="btn btn-soft btn-sm" ${prodPage <= 1 ? 'disabled style="opacity:0.45;cursor:not-allowed;"' : ''} onclick="goProductPage(${prodPage - 1})">‹ Sebelumnya</button>
                ${renderPagePills(prodPage, totalPages, 'goProductPage')}
                <button type="button" class="btn btn-dark btn-sm" ${prodPage >= totalPages ? 'disabled style="opacity:0.45;cursor:not-allowed;"' : ''} onclick="goProductPage(${prodPage + 1})">Selanjutnya ›</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Menu Category Modals
    function openAddMenuCategoryModal() {
      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-pink">KATEGORI MENU</span>
            <h3 style="margin:4px 0 0;font-size:17px;font-weight:900;">Tambah Kategori Menu</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <label class="field-label">Nama Kategori Baru</label>
            <input id="newMenuCatName" type="text" class="styled-input" placeholder="Contoh: Non-Coffee / Dessert" />
          </div>
          <button class="btn btn-dark" style="padding:12px;" onclick="saveNewMenuCategory()">Simpan Kategori</button>
        </div>
      `);
    }

    function saveNewMenuCategory() {
      const name = document.getElementById('newMenuCatName').value.trim();
      if (!name) {
        showToast('Nama kategori wajib diisi!', true);
        return;
      }
      if (db.categories.some(c => c.toLowerCase() === name.toLowerCase())) {
        showToast('Kategori tersebut sudah ada.', true);
        return;
      }
      db.categories.push(name);
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast(`Kategori "${name}" berhasil ditambahkan!`);
    }

    function openEditMenuCategoryModal(idx) {
      const catName = db.categories[idx];
      if (!catName) return;
      const isProtected = catName === 'Favorit';
      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-yellow">KELOLA KATEGORI</span>
            <h3 style="margin:4px 0 0;font-size:17px;font-weight:900;">Edit Kategori Menu</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <label class="field-label">Nama Kategori</label>
            <input id="editMenuCatName" type="text" class="styled-input" value="${escapeHtml(catName)}" ${isProtected ? 'disabled' : ''} />
            ${isProtected ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Kategori sistem "Favorit" tidak dapat diubah atau dihapus.</div>` : ''}
          </div>
          ${isProtected ? `
            <button class="btn btn-soft" onclick="closeModal()">Tutup</button>
          ` : `
            <div style="display:flex;gap:8px;">
              <button class="btn btn-danger" style="flex:1;" onclick="deleteMenuCategory(${idx})">Hapus</button>
              <button class="btn btn-dark" style="flex:1.5;" onclick="saveEditMenuCategory(${idx})">Simpan Perubahan</button>
            </div>
          `}
        </div>
      `);
    }

    function saveEditMenuCategory(idx) {
      const oldName = db.categories[idx];
      const newName = document.getElementById('editMenuCatName').value.trim();
      if (!newName) {
        showToast('Nama kategori wajib diisi!', true);
        return;
      }
      db.categories[idx] = newName;
      db.products.forEach(p => {
        if (p.category === oldName) p.category = newName;
      });
      if (prodCatFilter === oldName) prodCatFilter = newName;
      if (posCategory === oldName) posCategory = newName;
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast('Kategori menu diperbarui!');
    }

    function deleteMenuCategory(idx) {
      const removed = db.categories[idx];
      if (!removed || removed === 'Favorit') return;
      const fallback = db.categories.find(c => c !== 'Favorit' && c !== removed) || 'Menu Paket';
      db.categories.splice(idx, 1);
      db.products.forEach(p => {
        if (p.category === removed) p.category = fallback;
      });
      if (prodCatFilter === removed) prodCatFilter = 'Semua';
      if (posCategory === removed) posCategory = 'Favorit';
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast(`Kategori "${removed}" dihapus.`);
    }

    // Product Add / Edit / Delete Modal
    function openProductFormModal(prodId = '') {
      const p = prodId ? db.products.find(x => x.id === prodId) : null;
      const availCats = db.categories.filter(c => c !== 'Favorit');
      const nextNum = String(db.products.length + 1).padStart(2, '0');

      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-yellow">${p ? 'EDIT PRODUK' : 'PRODUK BARU'}</span>
            <h3 style="margin:4px 0 0;font-size:17px;font-weight:900;">${p ? 'Ubah Detail Produk' : 'Tambah Produk Baru'}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:grid;grid-template-columns:1fr 1.6fr;gap:8px;">
            <div>
              <label class="field-label">Kode SKU</label>
              <input id="pfSku" type="text" class="styled-input" value="${p ? escapeHtml(p.sku) : 'JW-' + nextNum}" />
            </div>
            <div>
              <label class="field-label">Nama Produk</label>
              <input id="pfName" type="text" class="styled-input" placeholder="Nama menu..." value="${p ? escapeHtml(p.name) : ''}" />
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:8px;">
            <div>
              <label class="field-label">Kategori Menu</label>
              <select id="pfCategory" class="styled-select">
                ${availCats.map(c => `<option value="${escapeHtml(c)}" ${p && p.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="field-label">Satuan</label>
              <input id="pfUnit" type="text" class="styled-input" placeholder="Cup / Porsi" value="${p ? escapeHtml(p.unit) : 'Cup'}" />
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div>
              <label class="field-label">Harga Jual (Rp)</label>
              <input id="pfPrice" type="text" inputmode="numeric" class="styled-input"
                value="${p && p.price ? p.price.toLocaleString('id-ID') : ''}" oninput="formatThousandInput(this)" />
            </div>
            <div>
              <label class="field-label">HPP / Modal (Rp)</label>
              <input id="pfCost" type="text" inputmode="numeric" class="styled-input"
                value="${p && p.cost ? p.cost.toLocaleString('id-ID') : ''}" oninput="formatThousandInput(this)" />
            </div>
          </div>

          <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;padding:6px 0;">
            <input id="pfFav" type="checkbox" ${p && p.fav ? 'checked' : ''} style="width:16px;height:16px;" />
            Tampilkan di Tab Favorit Kasir (★)
          </label>

          <div style="display:flex;gap:8px;margin-top:4px;">
            ${p ? `<button type="button" class="btn btn-danger" style="flex:1;" onclick="deleteProductItem('${p.id}')">Hapus</button>` : ''}
            <button type="button" class="btn btn-dark" style="flex:1.6;padding:12px;" onclick="saveProductForm('${p ? p.id : ''}')">Simpan Produk</button>
          </div>
        </div>
      `);
    }

    function saveProductForm(prodId) {
      const sku = document.getElementById('pfSku').value.trim() || ('PRD-' + Date.now().toString().slice(-4));
      const name = document.getElementById('pfName').value.trim();
      const category = document.getElementById('pfCategory').value;
      const unit = document.getElementById('pfUnit').value.trim() || 'Porsi';
      const price = parseNum(document.getElementById('pfPrice').value);
      const cost = parseNum(document.getElementById('pfCost').value);
      const fav = document.getElementById('pfFav').checked;

      if (!name || price <= 0) {
        showToast('Nama produk dan harga jual wajib diisi!', true);
        return;
      }

      if (prodId) {
        const idx = db.products.findIndex(x => x.id === prodId);
        if (idx !== -1) {
          db.products[idx] = { ...db.products[idx], sku, name, category, unit, price, cost, fav };
        }
      } else {
        db.products.unshift({
          id: 'prd-' + Date.now(),
          sku,
          name,
          category,
          fav,
          price,
          cost,
          unit,
          stock: 50
        });
      }
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast(prodId ? 'Produk berhasil diperbarui!' : 'Produk baru ditambahkan!');
    }

    function deleteProductItem(prodId) {
      db.products = db.products.filter(x => x.id !== prodId);
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast('Produk dihapus.');
    }

    function goCategoryPage(page) {
      const total = Math.max(1, Math.ceil(db.categories.filter(c => !catSearch || c.toLowerCase().includes(catSearch.toLowerCase())).length / catPageSize));
      catPage = Math.min(Math.max(1, page), total);
      renderOwnerContent();
    }

    function goProductPage(page) {
      const filtered = db.products.filter(p => {
        const matchCat = prodCatFilter === 'Semua' || p.category === prodCatFilter;
        const matchQ = !prodSearch || p.name.toLowerCase().includes(prodSearch.toLowerCase()) || p.sku.toLowerCase().includes(prodSearch.toLowerCase());
        return matchCat && matchQ;
      });
      const total = Math.max(1, Math.ceil(filtered.length / prodPageSize));
      prodPage = Math.min(Math.max(1, page), total);
      renderOwnerContent();
    }

    // Staff & PIN Management
    function buildSettingsStaffHTML() {
      return `
        <div class="bento-card" style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div>
              <h3 style="margin:0;font-size:15px;font-weight:900;">Manajemen Pegawai & PIN Akses</h3>
              <p style="margin:2px 0 0;font-size:11px;color:var(--text-muted);">Atur PIN 4-digit, jabatan, status aktif, dan tarif upah harian tim</p>
            </div>
            <button class="btn btn-yellow" onclick="openStaffFormModal()">+ Tambah Pegawai</button>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;">
            ${db.staff.map(s => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:#F8FBFA;border-radius:15px;border:1px solid var(--border-soft);flex-wrap:wrap;">
                <div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <span style="font-size:14px;font-weight:900;">${escapeHtml(s.name)}</span>
                    <span class="badge-pill ${s.role === 'Owner' ? 'badge-yellow' : 'badge-green'}">${escapeHtml(s.role)}</span>
                    <span class="badge-pill ${s.active ? 'badge-green' : 'badge-pink'}">${s.active ? 'Aktif' : 'Nonaktif'}</span>
                  </div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:3px;">
                    PIN: <strong>${escapeHtml(s.pin)}</strong> • Upah Harian: <strong>${formatRp(s.dailyWage || 0)}</strong>
                  </div>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="btn btn-soft btn-sm" onclick="toggleStaffActive('${s.id}')">${s.active ? 'Nonaktifkan' : 'Aktifkan'}</button>
                  <button class="btn btn-dark btn-sm" onclick="openStaffFormModal('${s.id}')">Edit & PIN</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleStaffActive(staffId) {
      const s = db.staff.find(x => x.id === staffId);
      if (!s) return;
      if (s.id === activeUser?.id) {
        showToast('Tidak dapat menonaktifkan akun yang sedang login.', true);
        return;
      }
      s.active = !s.active;
      saveDB();
      renderOwnerContent();
      showToast(`Status ${s.name} diubah menjadi ${s.active ? 'Aktif' : 'Nonaktif'}.`);
    }

    function openStaffFormModal(staffId = '') {
      const s = staffId ? db.staff.find(x => x.id === staffId) : null;
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:16px;font-weight:900;">${s ? 'Edit Pegawai & PIN' : 'Tambah Pegawai Baru'}</h3>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div>
            <label class="field-label">Nama Pegawai</label>
            <input id="stName" type="text" class="styled-input" value="${s ? escapeHtml(s.name) : ''}" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div>
              <label class="field-label">Jabatan / Hak Akses</label>
              <select id="stRole" class="styled-select">
                <option value="Kasir" ${s && s.role === 'Kasir' ? 'selected' : ''}>Kasir</option>
                <option value="Owner" ${s && s.role === 'Owner' ? 'selected' : ''}>Owner / Management</option>
              </select>
            </div>
            <div>
              <label class="field-label">PIN 4-Digit</label>
              <input id="stPin" type="text" inputmode="numeric" maxlength="4" class="styled-input" value="${s ? escapeHtml(s.pin) : ''}" />
            </div>
          </div>
          <div>
            <label class="field-label">Tarif Upah Harian (Rp)</label>
            <input id="stWage" type="text" inputmode="numeric" class="styled-input"
              value="${s && s.dailyWage ? s.dailyWage.toLocaleString('id-ID') : ''}" oninput="formatThousandInput(this)" />
          </div>
          <button class="btn btn-dark" style="padding:12px;" onclick="saveStaffForm('${s ? s.id : ''}')">Simpan Data Pegawai</button>
        </div>
      `);
    }

    function saveStaffForm(staffId) {
      const name = document.getElementById('stName').value.trim();
      const role = document.getElementById('stRole').value;
      const pin = document.getElementById('stPin').value.trim();
      const dailyWage = parseNum(document.getElementById('stWage').value);

      if (!name || !/^\d{4}$/.test(pin)) {
        showToast('Nama wajib diisi dan PIN harus 4 digit angka!', true);
        return;
      }
      if (staffId) {
        const idx = db.staff.findIndex(x => x.id === staffId);
        if (idx !== -1) db.staff[idx] = { ...db.staff[idx], name, role, pin, dailyWage };
      } else {
        db.staff.push({ id: 'stf-' + Date.now(), name, role, pin, active: true, dailyWage });
      }
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast('Data pegawai & PIN diperbarui!');
    }

    // Promo Management
    function buildSettingsPromoHTML() {
      return `
        <div class="bento-card" style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3 style="margin:0;font-size:15px;font-weight:900;">Daftar Promo Aktif</h3>
            <button class="btn btn-yellow btn-sm" onclick="openPromoModal()">+ Tambah Promo</button>
          </div>
          ${db.promos.map(pr => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#F8FBFA;border-radius:14px;border:1px solid var(--border-soft);">
              <div>
                <div style="font-size:13px;font-weight:800;">${escapeHtml(pr.name)}</div>
                <div style="font-size:11px;color:var(--text-muted);">${pr.type === 'percent' ? pr.value + '%' : formatRp(pr.value)}</div>
              </div>
              <button class="btn btn-soft btn-sm" onclick="togglePromo('${pr.id}')">${pr.active ? 'Aktif' : 'Nonaktif'}</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function togglePromo(id) {
      const p = db.promos.find(x => x.id === id);
      if (p) { p.active = !p.active; saveDB(); renderOwnerContent(); }
    }

    function openPromoModal() {
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:16px;font-weight:900;">Tambah Promo Baru</h3>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <input id="prmName" type="text" class="styled-input" placeholder="Nama Promo" />
          <select id="prmType" class="styled-select">
            <option value="percent">Persentase (%)</option>
            <option value="nominal">Nominal Rupiah (Rp)</option>
          </select>
          <input id="prmVal" type="number" class="styled-input" placeholder="Nilai diskon" />
          <button class="btn btn-dark" style="padding:12px;" onclick="savePromo()">Simpan Promo</button>
        </div>
      `);
    }

    function savePromo() {
      const name = document.getElementById('prmName').value.trim();
      const type = document.getElementById('prmType').value;
      const value = Number(document.getElementById('prmVal').value) || 0;
      if (!name || value <= 0) return;
      db.promos.push({ id: 'prm-' + Date.now(), name, type, value, active: true });
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast('Promo baru ditambahkan!');
    }

    // Info Outlet & Google Sheets Integration
    function buildSettingsOutletHTML() {
      const o = db.outlet;
      return `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;">
          <div class="bento-card" style="display:flex;flex-direction:column;gap:10px;">
            <h3 style="margin:0;font-size:15px;font-weight:900;">Detail & Logo Outlet</h3>
            <div>
              <label class="field-label">Nama Outlet</label>
              <input id="outName" type="text" class="styled-input" value="${escapeHtml(o.name)}" />
            </div>
            <div>
              <label class="field-label">Alamat Outlet</label>
              <input id="outAddr" type="text" class="styled-input" value="${escapeHtml(o.address)}" />
            </div>
            <div>
              <label class="field-label">Telepon / WhatsApp Laporan (628xxx)</label>
              <input id="outPhone" type="text" class="styled-input" value="${escapeHtml(o.phone)}" />
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
              <div>
                <label class="field-label">Facebook</label>
                <input id="outFb" type="text" class="styled-input" style="font-size:12px;" value="${escapeHtml(o.facebook)}" />
              </div>
              <div>
                <label class="field-label">Instagram</label>
                <input id="outIg" type="text" class="styled-input" style="font-size:12px;" value="${escapeHtml(o.instagram)}" />
              </div>
              <div>
                <label class="field-label">TikTok</label>
                <input id="outTt" type="text" class="styled-input" style="font-size:12px;" value="${escapeHtml(o.tiktok)}" />
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <div>
                <label class="field-label">Logo Outlet</label>
                <input type="file" accept="image/*" style="font-size:11px;width:100%;" onchange="handleLogoUpload(this, 'outletLogo')" />
              </div>
              <div>
                <label class="field-label">Logo Struk</label>
                <input type="file" accept="image/*" style="font-size:11px;width:100%;" onchange="handleLogoUpload(this, 'receiptLogo')" />
              </div>
            </div>
            <button class="btn btn-dark" style="padding:12px;" onclick="saveOutletDetails()">Simpan Detail Outlet</button>
          </div>

          <div class="bento-card" style="display:flex;flex-direction:column;gap:10px;">
            <h3 style="margin:0;font-size:15px;font-weight:900;">Sinkronisasi Google Spreadsheets</h3>
            <p style="margin:0;font-size:12px;color:var(--text-muted);">Hubungkan POS ke Master Google Sheets (Dapur Jiwara Financial Records) via Google Apps Script Webhook.</p>
            <div>
              <label class="field-label">Google Apps Script Webhook URL</label>
              <input id="outWebhook" type="url" class="styled-input" style="font-size:12px;" placeholder="https://script.google.com/macros/s/..." value="${escapeHtml(o.webhookUrl || '')}" />
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-yellow" onclick="saveOutletDetails(); pushWebhook({event:'TEST_PING', ts:new Date().toISOString()}); showToast('Test sinkronisasi dikirim!')">Test Sync</button>
              <button class="btn btn-pink" onclick="showAppsScriptModal()">Skrip Google Sheets</button>
              <button class="btn btn-soft" onclick="exportTransactionsCSV()">Export CSV</button>
            </div>
          </div>
        </div>
      `;
    }

    function handleLogoUpload(input, field) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        db.outlet[field] = reader.result;
        saveDB();
        renderWorkspace();
        showToast('Logo berhasil diperbarui!');
      };
      reader.readAsDataURL(file);
    }

    function saveOutletDetails() {
      db.outlet.name = document.getElementById('outName').value.trim();
      db.outlet.address = document.getElementById('outAddr').value.trim();
      db.outlet.phone = document.getElementById('outPhone').value.trim();
      db.outlet.facebook = document.getElementById('outFb').value.trim();
      db.outlet.instagram = document.getElementById('outIg').value.trim();
      db.outlet.tiktok = document.getElementById('outTt').value.trim();
      db.outlet.webhookUrl = document.getElementById('outWebhook').value.trim();
      saveDB();
      renderWorkspace();
      showToast('Pengaturan outlet tersimpan!');
    }

    function showAppsScriptModal() {
      const code = `function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var payload = JSON.parse(e.postData.contents);
  var sheet = ss.getSheetByName('POS_Log') || ss.insertSheet('POS_Log');
  sheet.appendRow([new Date(), payload.event, JSON.stringify(payload.data || payload)]);
  return ContentService.createTextOutput(JSON.stringify({status:'ok'})).setMimeType(ContentService.MimeType.JSON);
}`;
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:16px;font-weight:900;">Kode Google Apps Script</h3>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin:0 0 8px;">Tempel kode ini di Extensions → Apps Script pada Spreadsheet Anda, lalu Deploy sebagai Web App (Anyone).</p>
        <textarea id="gasCodeBox" readonly style="width:100%;height:160px;font-family:monospace;font-size:11px;padding:10px;border-radius:12px;border:1px solid var(--border-soft);">${code}</textarea>
        <button class="btn btn-dark" style="width:100%;margin-top:10px;" onclick="copyGasCode()">Salin Kode Script</button>
      `);
    }

    function copyGasCode() {
      const ta = document.getElementById('gasCodeBox');
      ta.select();
      document.execCommand('copy');
      showToast('Kode Apps Script disalin!');
    }

    function exportTransactionsCSV() {
      const rows = [['No Nota', 'Tanggal', 'Kasir', 'Jenis Order', 'Pelanggan', 'Metode', 'Total', 'Status']];
      db.transactions.forEach(t => {
        rows.push([t.id, t.createdAt, t.cashier, t.orderType, t.customerName, t.payMethod, t.total, t.status]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Kopi_Jiwara_Sales_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    async function pushWebhook(payload) {
      if (!db.outlet.webhookUrl) return;
      try {
        await fetch(db.outlet.webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {}
    }

    // Boot App
    initLoginScreen();
  </script>
</body>
</html>
