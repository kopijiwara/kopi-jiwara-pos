<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E8F3EE;
      --yellow: #FACC15;
      --yellow-dark: #EAB308;
      --pink: #F472B6;
      --pink-dark: #EC4899;
      --bg-page: #F4F7F5;
      --surface: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #5B736A;
      --border-soft: rgba(11, 46, 35, 0.12);
      --radius-lg: 22px;
      --radius-md: 15px;
      --radius-sm: 11px;
      --shadow-card: 0 10px 28px -8px rgba(11, 46, 35, 0.10);
      --shadow-float: 0 20px 44px -12px rgba(11, 46, 35, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg-page);
      color: var(--text-main);
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* SCROLLBAR CLEAN */
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: var(--green-deep);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow-float);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeDown 0.22s ease;
    }
    .toast-box.error {
      background: #991B1B;
      color: #FFFFFF;
      border-color: var(--pink);
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LOGIN SCREEN - GLASSMORPHISM */
    .login-bg {
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(circle at 12% 18%, rgba(250, 204, 21, 0.22), transparent 36%),
        radial-gradient(circle at 88% 82%, rgba(244, 114, 182, 0.24), transparent 38%),
        linear-gradient(145deg, #071F17 0%, #0B2E23 52%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 24px 22px;
      border: 2px solid rgba(250, 204, 21, 0.65);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
    }
    .brand-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .spiral-badge {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--green-deep);
      border: 2px solid var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(11, 46, 35, 0.25);
    }
    .pill-tag {
      background: rgba(244, 114, 182, 0.22);
      color: var(--green-deep);
      border: 1px solid rgba(244, 114, 182, 0.5);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid var(--border-soft);
      background: #F8FBFA;
      color: var(--green-deep);
      font-size: 14px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.18s;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      background: #FFFFFF;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--green-deep);
      background: transparent;
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      border-color: var(--green-deep);
      transform: scale(1.12);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }
    .num-btn {
      padding: 14px 0;
      border-radius: 15px;
      border: 1.5px solid var(--border-soft);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(11, 46, 35, 0.05);
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.95);
      background: var(--green-soft);
    }
    .num-btn.pink {
      background: rgba(244, 114, 182, 0.2);
      color: #9D174D;
      border-color: rgba(244, 114, 182, 0.45);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
      font-size: 13px;
    }

    /* TOP HEADER & GLASS NAV */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, #0B2E23 0%, #134636 100%);
      color: #FFFFFF;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(11, 46, 35, 0.22);
      border-bottom: 2px solid rgba(250, 204, 21, 0.35);
    }
    .topbar-inner {
      max-width: 1340px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .outlet-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shift-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .shift-pill.open {
      background: var(--yellow);
      color: var(--green-deep);
    }
    .shift-pill.closed {
      background: rgba(244, 114, 182, 0.28);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.5);
    }

    /* MAIN NAV PILLS */
    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .nav-pill {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px rgba(250, 204, 21, 0.35);
    }
    .nav-pill.pink-btn {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
    }

    /* MAIN CONTAINER */
    .main-wrap {
      max-width: 1340px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 84px;
    }

    /* BENTO CARDS */
    .bento-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-card);
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--surface);
      border-radius: 20px;
      padding: 14px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-card);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(135deg, var(--green-deep), var(--green-mid));
      color: #FFFFFF;
    }
    .kpi-tile.pink {
      background: linear-gradient(135deg, #FDF2F8, #FCE7F3);
      border-color: rgba(236, 72, 153, 0.3);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-value {
      font-size: 17px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 21px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 15px;
      border-radius: 14px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); }
    .btn-pink { background: var(--pink); color: var(--green-deep); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-soft); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* POS LAYOUT */
    .pos-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 1024px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.45fr) minmax(350px, 0.95fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 4px 0;
    }
    .cat-chip {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1.5px solid var(--border-soft);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 640px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px;
      border: 1.5px solid var(--border-soft);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 112px;
      position: relative;
      transition: border-color 0.15s, transform 0.1s;
    }
    .prod-card:active { transform: scale(0.98); }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F4FBF8;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    /* TABLES & COMPACT LISTS */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover {
      background: #F7FBF9;
    }

    /* SUB-TABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: #FFFFFF;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      margin-bottom: 14px;
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }
    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card {
        border-radius: 26px;
        border: 2px solid var(--yellow);
      }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    /* MOBILE INVENTORY & PRODUCT CARDS */
    .mobile-only { display: block; }
    .desktop-only { display: none; }
    @media (min-width: 768px) {
      .mobile-only { display: none; }
      .desktop-only { display: block; }
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    .hidden { display: none !important; }

    /* THERMAL PRINT */
    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <!-- Thermal Print Container -->
  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-card">
      <div class="brand-head">
        <div class="brand-left">
          <div class="spiral-badge" id="loginLogoWrap">
            <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
              <path d="M16 20C16 13 48 13 48 20C48 26 22 26 22 20C22 17 40 17 40 20" stroke="#FACC15" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M18 22L22 46C22.8 50 26 52 32 52C38 52 41.2 50 42 46L46 22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div style="min-width:0;">
            <div style="font-size:19px;font-weight:900;color:#0B2E23;letter-spacing:-0.02em;">KOPI JIWARA</div>
            <div style="font-size:11px;font-weight:700;color:#5B736A;">POS & ERP Management System</div>
          </div>
        </div>
        <span class="pill-tag">Dapur Jiwara</span>
      </div>

      <div style="margin-bottom:12px;">
        <label class="field-label" for="loginStaffSelect">Pilih Pegawai Bertugas</label>
        <select id="loginStaffSelect" class="styled-select" onchange="clearPinPad()"></select>
      </div>

      <div>
        <label class="field-label">Masukkan PIN Akses</label>
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <div class="numpad-grid">
          <button type="button" class="num-btn" onclick="pressPin('1')">1</button>
          <button type="button" class="num-btn" onclick="pressPin('2')">2</button>
          <button type="button" class="num-btn" onclick="pressPin('3')">3</button>
          <button type="button" class="num-btn" onclick="pressPin('4')">4</button>
          <button type="button" class="num-btn" onclick="pressPin('5')">5</button>
          <button type="button" class="num-btn" onclick="pressPin('6')">6</button>
          <button type="button" class="num-btn" onclick="pressPin('7')">7</button>
          <button type="button" class="num-btn" onclick="pressPin('8')">8</button>
          <button type="button" class="num-btn" onclick="pressPin('9')">9</button>
          <button type="button" class="num-btn pink" onclick="clearPinPad()">Hapus</button>
          <button type="button" class="num-btn" onclick="pressPin('0')">0</button>
          <button type="button" class="num-btn enter" onclick="submitPinLogin()">Masuk</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div id="appWorkspace" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-row">
          <div class="outlet-info">
            <div class="spiral-badge" style="width:40px;height:40px;border-radius:13px;" id="headerLogoWrap">
              <svg width="24" height="24" viewBox="0 0 64 64" fill="none">
                <path d="M16 20C16 13 48 13 48 20C48 26 22 26 22 20C22 17 40 17 40 20" stroke="#FACC15" stroke-width="4.5" stroke-linecap="round"/>
                <path d="M18 22L22 46C22.8 50 26 52 32 52C38 52 41.2 50 42 46L46 22" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div style="min-width:0;">
              <div style="display:flex;align-items:center;gap:7px;">
                <span class="outlet-title" id="headerOutletName">KOPI JIWARA</span>
                <span id="headerShiftBadge" class="shift-pill closed">Shift Tutup</span>
              </div>
              <div class="outlet-sub" id="headerUserMeta">Staf Aktif</div>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <button id="modeSwitchBtn" class="btn btn-yellow btn-sm hidden" onclick="toggleWorkspaceMode()">Mode Kasir</button>
            <button class="btn btn-pink btn-sm" onclick="handleLogoutAction()">Keluar</button>
          </div>
        </div>

        <nav id="mainNavBar" class="nav-bar no-scroll"></nav>
      </div>
    </header>

    <main class="main-wrap" id="mainContentArea"></main>
  </div>

  <!-- ==================== UNIVERSAL MODAL ==================== -->
  <div id="modalBackdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeModal()">
    <div class="modal-card" id="modalCardBody"></div>
  </div>

  <script>
    // ==================== PWA MANIFEST ====================
    (function setupPWA() {
      try {

          const seed = getSeedData();
          return {
            ...seed,
            ...parsed,
            invCategories: parsed.invCategories && parsed.invCategories.length ? parsed.invCategories : seed.invCategories,
            inventory: parsed.inventory || seed.inventory,
            outlet: { ...seed.outlet, ...(parsed.outlet || {}) }
          };
        }
      } catch (e) {}
      return getSeedData();

    function initLoginScreen() {

      const activeStaff = db.staff.filter(s => s.active);
      sel.innerHTML = activeStaff.map(s => `<option value="${s.id}">${escapeHtml(s.name)} — ${escapeHtml(s.role)}</option>`).join('');

        document.getElementById('loginLogoWrap').innerHTML = `<img src="${db.outlet.outletLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;" />`;
      }
      clearPinPad();

    function pressPin(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      renderPinDots();
      if (pinBuffer.length === 4) {
        setTimeout(submitPinLogin, 120);
      }
    }

    function clearPinPad() {
      pinBuffer = '';
      renderPinDots();
    }

    function renderPinDots() {
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      dots.forEach((d, idx) => {
        d.classList.toggle('filled', idx < pinBuffer.length);
      });
    }

    function submitPinLogin() {
      const staffId = document.getElementById('loginStaffSelect').value;
      const user = db.staff.find(s => s.id === staffId && s.active);
      if (!user || user.pin !== pinBuffer) {
        showToast('PIN tidak sesuai. Silakan coba lagi.', true);
        clearPinPad();
        return;
      }
      activeUser = user;
      clearPinPad();
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appWorkspace').classList.remove('hidden');

      if (user.role === 'Owner') {
        workspaceMode = 'owner';
        ownerTab = 'penjualan';
      } else {
        workspaceMode = 'cashier';
        cashierTab = 'kasir';
      }

      renderWorkspace();

      if (user.role !== 'Owner' && !getOpenShift()) {
        promptOpenRegisterModal();
      }
    }

      if (workspaceMode === 'cashier') {
        cashierTab = 'keluar';

    function buildCashierSalesHTML() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const list = db.transactions.filter(t => {
        const trxDate = (t.createdAt || '').slice(0, 10);
        const matchDate = !csDateFilter || trxDate === csDateFilter;
        const matchPay = csPayFilter === 'all' || t.payMethod === csPayFilter;
        const q = csSearchFilter.toLowerCase();
        const matchQ = !q ||
          (t.id || '').toLowerCase().includes(q) ||
          (t.customerName || '').toLowerCase().includes(q) ||
          (t.orderType || '').toLowerCase().includes(q) ||
          t.items.some(i => (i.name || '').toLowerCase().includes(q));
        return matchDate && matchPay && matchQ;
      });

      const paidList = list.filter(t => t.status === 'paid');
      const totalOmzet = paidList.reduce((s, t) => s + t.total, 0);
      const cashTotal = paidList.filter(t => t.payMethod === 'Cash').reduce((s, t) => s + t.total, 0);
      const nonCashTotal = paidList.filter(t => t.payMethod !== 'Cash').reduce((s, t) => s + t.total, 0);

      return `
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="bento-card" style="display:flex;flex-direction:column;gap:12px;">

        ? (promoObj.type === 'percent' ? Math.round(subtotal * (promoObj.value / 100)) : promoObj.value)

                      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">

                      <div>
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">

                          <span class="badge-pill badge-yellow">${escapeHtml(o.orderType)}</span>
                          <span class="badge-pill badge-pink">${escapeHtml(o.id)}</span>

                    <div style="display:flex;gap:6px;flex-wrap:wrap;">

          <div class="bento-card" style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div>
                <h3 style="margin:0;font-size:16px;font-weight:900;">Keranjang Pesanan</h3>

            <div style="max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;">
              ${cart.length === 0 ? `

                  Ketuk menu di samping untuk menambahkan pesanan

              ` : cart.map(item => `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;background:#F8FBFA;border-radius:13px;border:1px solid var(--border-soft);">
                  <div style="min-width:0;flex:1;">
                    <div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.name)}</div>
                    <div style="font-size:11px;font-weight:700;color:#047857;">${formatRp(item.price * item.qty)}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <button class="btn btn-soft btn-sm" style="padding:4px 9px;" onclick="changeCartQty('${item.id}', -1)">-</button>
                    <span style="font-size:12px;font-weight:900;min-width:16px;text-align:center;">${item.qty}</span>
                    <button class="btn btn-dark btn-sm" style="padding:4px 9px;" onclick="changeCartQty('${item.id}', 1)">+</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <div>
                <label class="field-label">Menu Diskon / Promo</label>
                <select class="styled-select" style="padding:8px 10px;font-size:12px;" onchange="selectedPromoId=this.value;renderCashierContent()">
                  <option value="">Tanpa Promo</option>
                  ${db.promos.filter(pr => pr.active).map(pr => `
                    <option value="${pr.id}" ${selectedPromoId === pr.id ? 'selected' : ''}>${escapeHtml(pr.name)}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">Diskon Manual (Rp)</label>
                <input type="text" inputmode="numeric" class="styled-input" style="padding:8px 10px;font-size:12px;"
                  placeholder="0" value="${manualDiscount > 0 ? manualDiscount.toLocaleString('id-ID') : ''}"
                  oninput="formatThousandInput(this); manualDiscount=parseNum(this.value); updateCartTotalsLive()" />
              </div>
            </div>

            <div style="padding-top:10px;border-top:1.5px dashed var(--border-soft);display:flex;flex-direction:column;gap:4px;">
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);">
                <span>Subtotal</span>
                <span id="cartSubtotalText" style="font-weight:700;">${formatRp(subtotal)}</span>
              </div>

              </div>

                <span style="font-size:13px;font-weight:900;">Total Tagihan</span>
                <span id="cartGrandTotalText" style="font-size:20px;font-weight:900;color:var(--green-deep);">${formatRp(grandTotal)}</span>
              </div>

              <button class="btn btn-pink" style="padding:12px 8px;" onclick="saveOrderAsOpen()">Simpan (Open)</button>
              <button class="btn btn-yellow" style="padding:12px 8px;" onclick="openSplitBillModal()">Split Bill</button>

    function updateCartTotalsLive() {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const promoObj = db.promos.find(pr => pr.id === selectedPromoId && pr.active);
      const promoDisc = promoObj
        ? (promoObj.type === 'percent' ? Math.round(subtotal * (promoObj.value / 100)) : promoObj.value)
        : 0;
      const totalDiscount = Math.min(subtotal, promoDisc + manualDiscount);
      const grandTotal = Math.max(0, subtotal - totalDiscount);
      const subEl = document.getElementById('cartSubtotalText');
      const discEl = document.getElementById('cartDiscountText');
      const grandEl = document.getElementById('cartGrandTotalText');
      if (subEl) subEl.textContent = formatRp(subtotal);
      if (discEl) discEl.textContent = '-' + formatRp(totalDiscount);
      if (grandEl) grandEl.textContent = formatRp(grandTotal);
    }

    function addToCart(prodId) {
      const p = db.products.find(x => x.id === prodId);
      if (!p) return;
      const existing = cart.find(c => c.id === prodId);
      if (existing) existing.qty += 1;
      else cart.push({ id: p.id, name: p.name, category: p.category, price: p.price, cost: p.cost || 0, qty: 1 });
      renderCashierContent();
    }

    function changeCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCashierContent();
    }

    function resetCart() {
      cart = [];
      editingOpenId = null;
      customerName = '';
      customerPhone = '';
      selectedPromoId = '';
      manualDiscount = 0;
      renderCashierContent();
    }

    function calculateCartSummary() {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const promoObj = db.promos.find(pr => pr.id === selectedPromoId && pr.active);
      const promoDisc = promoObj
        ? (promoObj.type === 'percent' ? Math.round(subtotal * (promoObj.value / 100)) : promoObj.value)
        : 0;
      const discount = Math.min(subtotal, promoDisc + manualDiscount);
      const total = Math.max(0, subtotal - discount);
      return { subtotal, discount, total };
    }

    function saveOrderAsOpen() {
      if (cart.length === 0) {
        showToast('Keranjang masih kosong.', true);
        return;
      }
      const { subtotal, discount, total } = calculateCartSummary();
      const shift = getOpenShift();

      if (editingOpenId) {
        const idx = db.transactions.findIndex(t => t.id === editingOpenId);
        if (idx !== -1) {
          db.transactions[idx] = {
            ...db.transactions[idx],
            orderType,
            customerName: customerName.trim() || 'Pelanggan Umum',
            customerPhone: customerPhone.trim(),
            items: JSON.parse(JSON.stringify(cart)),
            subtotal,
            discount,
            total
          };
        }
      } else {
        db.transactions.unshift({
          id: 'ORD-' + Date.now().toString().slice(-5),
          shiftId: shift ? shift.id : 'NO-SHIFT',
          cashier: activeUser.name,
          outlet: db.outlet.name,
          orderType,
          customerName: customerName.trim() || 'Pelanggan Umum',
          customerPhone: customerPhone.trim(),
          items: JSON.parse(JSON.stringify(cart)),
          subtotal,
          discount,
          total,
          payMethod: 'Belum Bayar',
          cashReceived: 0,
          change: 0,
          status: 'open',
          createdAt: new Date().toISOString()
        });
      }
      saveDB();
      resetCart();
      posSubView = 'open';
      renderCashierContent();
      showToast('Order berhasil disimpan ke Daftar Order!');
    }

    function resumeOpenOrder(ordId) {
      const ord = db.transactions.find(t => t.id === ordId);
      if (!ord) return;
      editingOpenId = ord.id;
      cart = JSON.parse(JSON.stringify(ord.items));
      orderType = ord.orderType;
      customerName = ord.customerName;
      customerPhone = ord.customerPhone || '';
      manualDiscount = ord.discount || 0;
      posSubView = 'menu';
      renderCashierContent();
    }

    function payOpenOrderDirectly(ordId) {
      resumeOpenOrder(ordId);
      openPaymentModal();
    }

    function printProformaBill(ordId) {
      const ord = db.transactions.find(t => t.id === ordId);
      if (!ord) return;
      triggerThermalReceipt(ord, true);
    }

    function openVoidOrderModal(ordId) {
      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-pink">OTORISASI MANAGER</span>
            <h3 style="margin:4px 0 0;font-size:17px;font-weight:900;">Batalkan Pesanan (${escapeHtml(ordId)})</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div>
            <label class="field-label">Alasan Pembatalan</label>
            <select id="voidReasonSel" class="styled-select">
              <option value="Batal Pesanan">Batal Pesanan</option>
              <option value="Salah Proses">Salah Proses</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div>
            <label class="field-label">Catatan Detail</label>
            <input id="voidNoteInp" type="text" class="styled-input" placeholder="Tulis keterangan..." />
          </div>
          <div>
            <label class="field-label">PIN Otorisasi Manager / Owner</label>
            <input id="voidManagerPinInp" type="password" inputmode="numeric" maxlength="4" class="styled-input" placeholder="••••" />
          </div>
          <button class="btn btn-danger" style="padding:12px;margin-top:4px;" onclick="confirmVoidOrder('${ordId}')">Konfirmasi Batalkan Order</button>
        </div>
      `);
    }

    // ==================== SPLIT BILL / PISAH BAYAR ====================
    let splitMode = 'items'; // 'items' | 'amount'
    let splitSelectedQty = {};
    let splitPayMethod = 'Cash';
    let splitPartAmount = 0;

    function openSplitBillModal() {
      if (cart.length === 0) {
        showToast('Keranjang masih kosong.', true);
        return;
      }
      if (!getOpenShift()) {
        showToast('Harap Buka Kasir terlebih dahulu!', true);
        promptOpenRegisterModal();
        return;
      }
      splitMode = 'items';
      splitPayMethod = 'Cash';
      splitSelectedQty = {};
      cart.forEach(item => {
        splitSelectedQty[item.id] = 0;
      });
      const { total } = calculateCartSummary();
      splitPartAmount = Math.ceil(total / 2);
      renderSplitBillModal();
    }

    function renderSplitBillModal() {
      const { subtotal, discount, total } = calculateCartSummary();

      let selectedSubtotal = 0;
      let selectedCount = 0;
      cart.forEach(item => {
        const q = splitSelectedQty[item.id] || 0;
        selectedSubtotal += item.price * q;
        selectedCount += q;
      });
      const proportionalDisc = subtotal > 0 ? Math.round(discount * (selectedSubtotal / subtotal)) : 0;
      const itemBillTotal = Math.max(0, selectedSubtotal - proportionalDisc);
      const activeSplitTotal = splitMode === 'items' ? itemBillTotal : Math.min(total, splitPartAmount);
      const remainingAfterSplit = Math.max(0, total - activeSplitTotal);

      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-pink">SPLIT BILL / PISAH BAYAR</span>
            <h3 style="margin:4px 0 0;font-size:18px;font-weight:900;">Total Tagihan: ${formatRp(total)}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;">
          <button type="button" class="btn ${splitMode === 'items' ? 'btn-dark' : 'btn-soft'}" onclick="splitMode='items';renderSplitBillModal()">
            Pilih Menu Dibayar
          </button>
          <button type="button" class="btn ${splitMode === 'amount' ? 'btn-dark' : 'btn-soft'}" onclick="splitMode='amount';renderSplitBillModal()">
            Pisah Nominal Bayar
          </button>
        </div>

        ${splitMode === 'items' ? `
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <label class="field-label" style="margin:0;">Pilih Menu & Qty yang Dibayar Sekarang</label>
              <button type="button" class="btn btn-soft btn-sm" onclick="selectAllSplitItems()">Pilih Semua</button>
            </div>
            <div style="max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;">
              ${cart.map(item => {
                const selQ = splitSelectedQty[item.id] || 0;
                return `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:13px;background:${selQ > 0 ? '#F4FBF8' : '#F8FBFA'};border:1.5px solid ${selQ > 0 ? 'var(--green-deep)' : 'var(--border-soft)'};">
                    <div style="min-width:0;flex:1;">
                      <div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.name)}</div>
                      <div style="font-size:11px;color:var(--text-muted);">${formatRp(item.price)} • Pesanan: <strong>${item.qty}x</strong></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <button type="button" class="btn btn-soft btn-sm" style="padding:4px 9px;" onclick="adjustSplitItemQty('${item.id}', -1)">-</button>
                      <span style="font-size:12px;font-weight:900;min-width:26px;text-align:center;">${selQ}/${item.qty}</span>
                      <button type="button" class="btn btn-dark btn-sm" style="padding:4px 9px;" onclick="adjustSplitItemQty('${item.id}', 1)">+</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        ` : `
          <div style="background:#F8FBFA;padding:12px;border-radius:16px;border:1px solid var(--border-soft);margin-bottom:12px;">
            <label class="field-label">Nominal Pembayaran Bagian Ini (Rp)</label>
            <input id="splitPartAmtInp" type="text" inputmode="numeric" class="styled-input" style="font-size:16px;font-weight:900;background:#FFFFFF;"
              value="${splitPartAmount > 0 ? splitPartAmount.toLocaleString('id-ID') : ''}"
              oninput="formatThousandInput(this); splitPartAmount=Math.min(${total}, parseNum(this.value)); renderSplitBillModal()" />
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
              <button type="button" class="btn btn-soft btn-sm" onclick="splitPartAmount=Math.round(${total}/2);renderSplitBillModal()">Bagi 2 (50%)</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="splitPartAmount=Math.round(${total}/3);renderSplitBillModal()">Bagi 3</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="splitPartAmount=Math.round(${total}/4);renderSplitBillModal()">Bagi 4</button>
            </div>
          </div>
        `}

        <div style="background:#FDF2F8;padding:11px 13px;border-radius:15px;border:1px solid rgba(236,72,153,0.28);margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;">
            <span style="font-weight:800;color:#9D174D;">Tagihan Dibayar Sekarang:</span>
            <span style="font-size:16px;font-weight:900;color:var(--green-deep);">${formatRp(activeSplitTotal)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px;">
            <span>Sisa Tagihan (Otomatis jadi Order Open):</span>
            <span style="font-weight:800;">${formatRp(remainingAfterSplit)}</span>
          </div>
        </div>

        <label class="field-label">Metode Pembayaran Bagian Ini</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
          <button type="button" class="btn ${splitPayMethod === 'Cash' ? 'btn-dark' : 'btn-soft'}" onclick="splitPayMethod='Cash';renderSplitBillModal()">Cash</button>
          <button type="button" class="btn ${splitPayMethod === 'QRIS' ? 'btn-dark' : 'btn-soft'}" onclick="splitPayMethod='QRIS';renderSplitBillModal()">QRIS</button>
          <button type="button" class="btn ${splitPayMethod === 'Transfer' ? 'btn-dark' : 'btn-soft'}" onclick="splitPayMethod='Transfer';renderSplitBillModal()">Transfer</button>
        </div>

        ${splitPayMethod === 'Cash' ? `
          <div style="background:#F8FBFA;padding:11px 13px;border-radius:15px;border:1px solid var(--border-soft);margin-bottom:12px;">
            <label class="field-label">Uang Cash Diterima (Rp)</label>
            <input id="splitCashReceivedInp" type="text" inputmode="numeric" class="styled-input" style="font-size:16px;font-weight:900;background:#FFFFFF;"
              placeholder="${activeSplitTotal.toLocaleString('id-ID')}"
              oninput="formatThousandInput(this); updateSplitCashChange(${activeSplitTotal})" />
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;">
              <button type="button" class="btn btn-soft btn-sm" onclick="fillSplitQuickCash(${activeSplitTotal}, ${activeSplitTotal})">${formatRp(activeSplitTotal)}</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="fillSplitQuickCash(50000, ${activeSplitTotal})">Rp 50.000</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="fillSplitQuickCash(100000, ${activeSplitTotal})">Rp 100.000</button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px dashed var(--border-soft);">
              <span style="font-size:11px;font-weight:800;color:var(--text-muted);">Kembalian</span>
              <span id="splitChangeDisp" style="font-size:15px;font-weight:900;color:#047857;">Rp 0</span>
            </div>
          </div>
        ` : ''}

        <button type="button" class="btn btn-yellow" style="width:100%;padding:13px;font-size:13px;" onclick="finalizeSplitBillPayment()">
          Bayar Bagian Ini & Cetak Struk
        </button>
      `);
    }

    function adjustSplitItemQty(prodId, delta) {
      const item = cart.find(c => c.id === prodId);
      if (!item) return;
      const cur = splitSelectedQty[prodId] || 0;
      splitSelectedQty[prodId] = Math.min(item.qty, Math.max(0, cur + delta));
      renderSplitBillModal();
    }

    function selectAllSplitItems() {
      cart.forEach(item => {
        splitSelectedQty[item.id] = item.qty;
      });
      renderSplitBillModal();
    }

    function fillSplitQuickCash(amt, billTotal) {
      const inp = document.getElementById('splitCashReceivedInp');
      if (!inp) return;
      inp.value = amt > 0 ? amt.toLocaleString('id-ID') : '';
      updateSplitCashChange(billTotal);
    }

    function updateSplitCashChange(billTotal) {
      const inp = document.getElementById('splitCashReceivedInp');
      const disp = document.getElementById('splitChangeDisp');
      if (!inp || !disp) return;
      const rec = parseNum(inp.value);
      if (rec < billTotal) {
        disp.style.color = '#BE185D';
        disp.textContent = 'Kurang ' + formatRp(billTotal - rec);
      } else {
        disp.style.color = '#047857';
        disp.textContent = formatRp(rec - billTotal);
      }
    }

    function finalizeSplitBillPayment() {
      const { subtotal, discount, total } = calculateCartSummary();
      const shift = getOpenShift();
      const baseCustomer = customerName.trim() || 'Pelanggan Umum';

      if (splitMode === 'items') {
        const paidItems = [];
        const remainingItems = [];

        cart.forEach(item => {
          const selQ = splitSelectedQty[item.id] || 0;
          const remQ = item.qty - selQ;
          if (selQ > 0) paidItems.push({ ...item, qty: selQ });
          if (remQ > 0) remainingItems.push({ ...item, qty: remQ });
        });

        if (paidItems.length === 0) {
          showToast('Pilih minimal 1 menu yang akan dibayar!', true);
          return;
        }

        const paidSub = paidItems.reduce((s, i) => s + i.price * i.qty, 0);
        const paidDisc = subtotal > 0 ? Math.round(discount * (paidSub / subtotal)) : 0;
        const paidTotal = Math.max(0, paidSub - paidDisc);

        const rec = splitPayMethod === 'Cash'
          ? parseNum(document.getElementById('splitCashReceivedInp')?.value)
          : paidTotal;

        if (splitPayMethod === 'Cash' && rec < paidTotal) {
          showToast('Nominal uang cash masih kurang!', true);
          return;
        }

        paidItems.forEach(item => {
          const p = db.products.find(x => x.id === item.id);
          if (p) p.stock = Math.max(0, p.stock - item.qty);
        });

        const paidTrx = {
          id: 'TRX-' + Date.now().toString().slice(-5),
          shiftId: shift ? shift.id : 'NO-SHIFT',
          cashier: activeUser.name,
          outlet: db.outlet.name,
          orderType,
          customerName: `${baseCustomer} (Split Menu)`,
          customerPhone: customerPhone.trim(),
          items: paidItems,
          subtotal: paidSub,
          discount: paidDisc,
          total: paidTotal,
          payMethod: splitPayMethod,
          cashReceived: rec,
          change: splitPayMethod === 'Cash' ? rec - paidTotal : 0,
          status: 'paid',
          createdAt: new Date().toISOString(),
          paidAt: new Date().toISOString()
        };
        db.transactions.unshift(paidTrx);

        if (remainingItems.length > 0) {
          const remSub = remainingItems.reduce((s, i) => s + i.price * i.qty, 0);
          const remDisc = Math.max(0, discount - paidDisc);
          const remTotal = Math.max(0, remSub - remDisc);

          if (editingOpenId) {
            const idx = db.transactions.findIndex(t => t.id === editingOpenId);
            if (idx !== -1) {
              db.transactions[idx] = {
                ...db.transactions[idx],
                items: remainingItems,
                subtotal: remSub,
                discount: remDisc,
                total: remTotal,
                status: 'open'
              };
            }
          } else {
            db.transactions.unshift({
              id: 'ORD-' + (Date.now() + 1).toString().slice(-5),
              shiftId: shift ? shift.id : 'NO-SHIFT',
              cashier: activeUser.name,
              outlet: db.outlet.name,
              orderType,
              customerName: `${baseCustomer} (Sisa Split)`,
              customerPhone: customerPhone.trim(),
              items: remainingItems,
              subtotal: remSub,
              discount: remDisc,
              total: remTotal,
              payMethod: 'Belum Bayar',
              cashReceived: 0,
              change: 0,
              status: 'open',
              createdAt: new Date().toISOString()
            });
          }
          saveDB();
          closeModal();
          triggerThermalReceipt(paidTrx, false);
          resetCart();
          posSubView = 'open';
          renderCashierContent();
          showToast('Pembayaran menu terpilih lunas! Sisa menu masuk Daftar Order (Open).');
          pushWebhook({ event: 'SPLIT_BILL_MENU', data: paidTrx });
        } else {
          if (editingOpenId) {
            db.transactions = db.transactions.filter(t => t.id !== editingOpenId);
          }
          saveDB();
          closeModal();
          triggerThermalReceipt(paidTrx, false);
          resetCart();
          renderCashierContent();
          showToast('Seluruh menu berhasil dibayar lunas!');
          pushWebhook({ event: 'SALE_COMPLETED', data: paidTrx });
        }
      } else {
        const payNow = Math.min(total, splitPartAmount);
        if (payNow <= 0) {
          showToast('Masukkan nominal pembayaran split yang valid!', true);
          return;
        }
        const rec = splitPayMethod === 'Cash'
          ? parseNum(document.getElementById('splitCashReceivedInp')?.value)
          : payNow;

        if (splitPayMethod === 'Cash' && rec < payNow) {
          showToast('Nominal uang cash masih kurang!', true);
          return;
        }

        const remBalance = Math.max(0, total - payNow);
        const paidTrx = {
          id: 'TRX-' + Date.now().toString().slice(-5),
          shiftId: shift ? shift.id : 'NO-SHIFT',
          cashier: activeUser.name,
          outlet: db.outlet.name,
          orderType,
          customerName: `${baseCustomer} (Split ${splitPayMethod})`,
          customerPhone: customerPhone.trim(),
          items: remBalance === 0
            ? JSON.parse(JSON.stringify(cart))
            : [{ id: 'split-part', name: `Pembayaran Split (${baseCustomer})`, category: 'Split Bill', price: payNow, cost: 0, qty: 1 }],
          subtotal: payNow,
          discount: 0,
          total: payNow,
          payMethod: splitPayMethod,
          cashReceived: rec,
          change: splitPayMethod === 'Cash' ? rec - payNow : 0,
          status: 'paid',
          createdAt: new Date().toISOString(),
          paidAt: new Date().toISOString()
        };
        db.transactions.unshift(paidTrx);

        if (remBalance > 0) {
          const openPayload = {
            id: editingOpenId || ('ORD-' + (Date.now() + 1).toString().slice(-5)),
            shiftId: shift ? shift.id : 'NO-SHIFT',
            cashier: activeUser.name,
            outlet: db.outlet.name,
            orderType,
            customerName: `${baseCustomer} (Sisa Tagihan)`,
            customerPhone: customerPhone.trim(),
            items: [{ id: 'split-rem', name: `Sisa Tagihan Split (${baseCustomer})`, category: 'Split Bill', price: remBalance, cost: 0, qty: 1 }],
            subtotal: remBalance,
            discount: 0,
            total: remBalance,
            payMethod: 'Belum Bayar',
            cashReceived: 0,
            change: 0,
            status: 'open',
            createdAt: new Date().toISOString()
          };
          if (editingOpenId) {
            const idx = db.transactions.findIndex(t => t.id === editingOpenId);
            if (idx !== -1) db.transactions[idx] = openPayload;
          } else {
            db.transactions.unshift(openPayload);
          }
          saveDB();
          closeModal();
          triggerThermalReceipt(paidTrx, false);
          resetCart();
          posSubView = 'open';
          renderCashierContent();
          showToast(`Split ${formatRp(payNow)} lunas! Sisa ${formatRp(remBalance)} tersimpan di Daftar Order.`);
        } else {
          cart.forEach(item => {
            const p = db.products.find(x => x.id === item.id);
            if (p) p.stock = Math.max(0, p.stock - item.qty);
          });
          if (editingOpenId) {
            db.transactions = db.transactions.filter(t => t.id !== editingOpenId);
          }
          saveDB();
          closeModal();
          triggerThermalReceipt(paidTrx, false);
          resetCart();
          renderCashierContent();
          showToast('Tagihan split selesai dibayar lunas!');
        }
        pushWebhook({ event: 'SPLIT_BILL_AMOUNT', data: paidTrx });
      }
    }

    // ==================== PAYMENT MODAL ====================
    let activePayMethod = 'Cash';

    function openPaymentModal() {
      if (cart.length === 0) {
        showToast('Keranjang masih kosong.', true);
        return;
      }
      if (!getOpenShift()) {
        showToast('Harap Buka Kasir terlebih dahulu!', true);
        promptOpenRegisterModal();
        return;
      }
      const { total } = calculateCartSummary();
      activePayMethod = 'Cash';

      openModal(`
        <div class="modal-head">
          <div>
            <span class="badge-pill badge-yellow">PEMBAYARAN TRANSAKSI</span>
            <h3 style="margin:4px 0 0;font-size:22px;font-weight:900;">${formatRp(total)}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">✕</button>
        </div>

        <label class="field-label">Pilihan Pembayaran</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
          <button type="button" id="pmBtn-Cash" class="btn btn-dark" onclick="selectPaymentMethod('Cash')">Cash</button>
          <button type="button" id="pmBtn-QRIS" class="btn btn-soft" onclick="selectPaymentMethod('QRIS')">QRIS</button>
          <button type="button" id="pmBtn-Transfer" class="btn btn-soft" onclick="selectPaymentMethod('Transfer')">Transfer</button>
        </div>

        <div id="cashPaySection" style="background:#F8FBFA;padding:14px;border-radius:18px;border:1px solid var(--border-soft);margin-bottom:14px;">
          <label class="field-label">Uang Cash Diterima (Rp)</label>
          <input id="payCashInput" type="text" inputmode="numeric" class="styled-input" style="font-size:18px;font-weight:900;background:#FFFFFF;"
            placeholder="0" oninput="formatThousandInput(this); recalcPaymentChange(${total})" />
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;">
            <button type="button" class="btn btn-soft btn-sm" onclick="fillQuickCash(${total}, ${total})">${formatRp(total)}</button>
            <button type="button" class="btn btn-soft btn-sm" onclick="fillQuickCash(${Math.ceil(total / 10000) * 10000}, ${total})">${formatRp(Math.ceil(total / 10000) * 10000)}</button>
            <button type="button" class="btn btn-soft btn-sm" onclick="fillQuickCash(50000, ${total})">Rp 50.000</button>
            <button type="button" class="btn btn-soft btn-sm" onclick="fillQuickCash(100000, ${total})">Rp 100.000</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="fillQuickCash(0, ${total})">Reset</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border-soft);">
            <span style="font-size:12px;font-weight:800;color:var(--text-muted);">Kembalian</span>
            <span id="payChangeDisplay" style="font-size:17px;font-weight:900;color:#047857;">Rp 0</span>
          </div>
        </div>

        <button class="btn btn-yellow" style="width:100%;padding:14px;font-size:13px;" onclick="finalizePayment()">
          Selesaikan Pembayaran & Cetak Struk
        </button>
      `);
    }

    function selectPaymentMethod(method) {
      activePayMethod = method;
      ['Cash', 'QRIS', 'Transfer'].forEach(m => {
        const b = document.getElementById('pmBtn-' + m);
        if (b) b.className = m === method ? 'btn btn-dark' : 'btn btn-soft';
      });
      const sec = document.getElementById('cashPaySection');
      if (sec) sec.classList.toggle('hidden', method !== 'Cash');
    }

    function fillQuickCash(amount, total) {
      const inp = document.getElementById('payCashInput');
      if (!inp) return;
      inp.value = amount > 0 ? amount.toLocaleString('id-ID') : '';
      recalcPaymentChange(total);
    }

    function recalcPaymentChange(total) {
      const inp = document.getElementById('payCashInput');
      const disp = document.getElementById('payChangeDisplay');
      if (!inp || !disp) return;
      const rec = parseNum(inp.value);
      if (rec < total) {
        disp.style.color = '#BE185D';
        disp.textContent = 'Kurang ' + formatRp(total - rec);
      } else {
        disp.style.color = '#047857';
        disp.textContent = formatRp(rec - total);
      }
    }

    function finalizePayment() {
      const { subtotal, discount, total } = calculateCartSummary();
      const rec = activePayMethod === 'Cash'
        ? parseNum(document.getElementById('payCashInput').value)
        : total;

      if (activePayMethod === 'Cash' && rec < total) {
        showToast('Nominal uang cash masih kurang!', true);
        return;
      }

      const change = activePayMethod === 'Cash' ? rec - total : 0;
      const shift = getOpenShift();

      cart.forEach(item => {
        const p = db.products.find(x => x.id === item.id);
        if (p) p.stock = Math.max(0, p.stock - item.qty);
      });

      let trx;
      if (editingOpenId) {
        const idx = db.transactions.findIndex(t => t.id === editingOpenId);
        if (idx !== -1) {
          db.transactions[idx] = {
            ...db.transactions[idx],
            shiftId: shift ? shift.id : db.transactions[idx].shiftId,
            cashier: activeUser.name,
            orderType,
            customerName: customerName.trim() || 'Pelanggan Umum',
            customerPhone: customerPhone.trim(),
            items: JSON.parse(JSON.stringify(cart)),
            subtotal,
            discount,
            total,
            payMethod: activePayMethod,
            cashReceived: rec,
            change,
            status: 'paid',
            paidAt: new Date().toISOString()
          };
          trx = db.transactions[idx];
        }
      } else {
        trx = {
          id: 'TRX-' + Date.now().toString().slice(-5),
          shiftId: shift ? shift.id : 'NO-SHIFT',
          cashier: activeUser.name,
          outlet: db.outlet.name,
          orderType,
          customerName: customerName.trim() || 'Pelanggan Umum',
          customerPhone: customerPhone.trim(),
          items: JSON.parse(JSON.stringify(cart)),
          subtotal,
          discount,
          total,
          payMethod: activePayMethod,
          cashReceived: rec,
          change,
          status: 'paid',
          createdAt: new Date().toISOString(),
          paidAt: new Date().toISOString()
        };
        db.transactions.unshift(trx);
      }

      saveDB();
      closeModal();
      triggerThermalReceipt(trx, false);
      resetCart();
      renderCashierContent();
      showToast('Transaksi Lunas!');
      pushWebhook({ event: 'SALE_COMPLETED', data: trx });
    }

    function triggerThermalReceipt(trx, isProforma) {
      const area = document.getElementById('printArea');
      area.innerHTML = `
        <div style="text-align:center;font-weight:bold;font-size:13px;">${escapeHtml(db.outlet.name)}</div>
        <div style="text-align:center;font-size:10px;">${escapeHtml(db.outlet.address)}</div>
        <div style="text-align:center;font-size:10px;">${isProforma ? '*** TAGIHAN BELUM LUNAS ***' : '*** STRUK PEMBAYARAN ***'}</div>
        <hr/>
        <div>No: ${escapeHtml(trx.id)}</div>
        <div>Tgl: ${new Date(trx.createdAt).toLocaleString('id-ID')}</div>
        <div>Order: ${escapeHtml(trx.orderType)} | Kasir: ${escapeHtml(trx.cashier)}</div>
        <div>Pelanggan: ${escapeHtml(trx.customerName)}</div>
        <hr/>
        ${trx.items.map(i => `<div>${escapeHtml(i.name)}<br/>${i.qty} x ${formatRp(i.price)} = ${formatRp(i.qty * i.price)}</div>`).join('')}

    function getPresetRange(preset) {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

      if (preset === 'yesterday') {
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
      } else if (preset === 'last7') {
        start.setDate(start.getDate() - 6);
      } else if (preset === 'thisWeek') {
        const d = start.getDay();
        start.setDate(start.getDate() - (d === 0 ? 6 : d - 1));
      } else if (preset === 'lastWeek') {
        const d = start.getDay();
        start.setDate(start.getDate() - (d === 0 ? 6 : d - 1) - 7);
        end.setTime(start.getTime());
        end.setDate(end.getDate() + 6);
        end.setHours(23, 59, 59, 999);
      } else if (preset === 'thisMonth') {
        start.setDate(1);
      } else if (preset === 'lastMonth') {
        return {
          start: new Date(now.getFullYear(), now.getMonth() - 1, 1, 0, 0, 0, 0),
          end: new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999)
        };
      }
      return { start, end };
    }

      const itemsText = Object.entries(soldMap).map(([k, v]) => `- ${v}x ${k}`).join('\n') || '- Belum ada';

      return `*LAPORAN TUTUP KASIR — ${db.outlet.name}*\n` +
        `Kasir: ${activeUser.name}\n` +
        `Waktu: ${new Date().toLocaleString('id-ID')}\n\n` +
        `Modal Awal: ${formatRp(shift ? shift.openingCash : 0)}\n` +
        `Cash: ${formatRp(cashSales)}\n` +
        `QRIS: ${formatRp(qrisSales)}\n` +
        `Transfer: ${formatRp(tfSales)}\n` +
        `Ekspektasi Laci: ${formatRp(expectedCash)}\n` +
        `Cash Fisik: ${formatRp(closingCashValue)}\n` +
        `Selisih: ${formatRp(closingCashValue - expectedCash)}\n` +
        `Transaksi Tertunda: ${pendingTrx.length} order\n\n` +
        `*Produk Terjual:*\n${itemsText}`;
    }

    function printClosingReport(expectedCash) {
      const area = document.getElementById('printArea');
      area.innerHTML = `<pre style="white-space:pre-wrap;font-family:monospace;font-size:10px;">${escapeHtml(buildClosingTextSummary(expectedCash).replace(/\*/g, ''))}</pre>`;
      try { window.print(); } catch (e) {}
    }

    function sendClosingToWhatsApp(expectedCash) {
      const msg = buildClosingTextSummary(expectedCash);
      window.open(`https://wa.me/${db.outlet.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function finalizeTutupKasir(expectedCash) {
      const pin = document.getElementById('closingStaffPinInp').value.trim();
      if (pin !== activeUser.pin) {
        showToast('PIN kasir tidak sesuai!', true);
        return;
      }
      const shift = getOpenShift();
      if (shift) {
        shift.closingCash = closingCashValue;
        shift.expectedCash = expectedCash;
        shift.closedAt = new Date().toISOString();
        shift.status = 'closed';
        saveDB();
        pushWebhook({ event: 'CLOSE_SHIFT', data: shift });
      }
      closingCashValue = 0;
      showToast('Tutup Kasir selesai! Mengakhiri sesi...');
      setTimeout(confirmLogoutOnly, 900);
    }

    // 2. OWNER LAPORAN
    function buildOwnerReportsHTML() {
      const paid = db.transactions.filter(t => t.status === 'paid');

      const hpp = paid.reduce((s, t) => s + t.items.reduce((a, i) => a + (i.cost || 0) * i.qty, 0), 0);
      const grossProfit = net - hpp;

      const prodStats = {};
      paid.forEach(t => t.items.forEach(i => {
        if (!prodStats[i.name]) prodStats[i.name] = { name: i.name, qty: 0, omzet: 0, profit: 0 };
        prodStats[i.name].qty += i.qty;
        prodStats[i.name].omzet += i.qty * i.price;

    function applyInventoryAction(itemId, inputElId) {
      const el = document.getElementById(inputElId);
      const val = Number(el.value);
      if (isNaN(val) || el.value === '') {
        showToast('Masukkan angka terlebih dahulu.', true);
        return;
      }
      const item = db.inventory.find(i => i.id === itemId);
      if (!item) return;

      if (invSubTab === 'opname') {
        item.stock = Math.max(0, val);
        showToast(`Stok opname ${item.name} diperbarui ke ${item.stock} ${item.unit}.`);
      } else if (invSubTab === 'mutasi') {
        if (val <= 0) { showToast('Jumlah mutasi harus > 0', true); return; }
        item.stock += val;
        showToast(`+${val} ${item.unit} ${item.name} berhasil ditambahkan.`);
      } else {
        if (val <= 0) { showToast('Jumlah terbuang harus > 0', true); return; }
        item.stock = Math.max(0, item.stock - val);
        showToast(`-${val} ${item.unit} ${item.name} dicatat sebagai stok terbuang.`);
      }
      saveDB();
      renderOwnerContent();
    }

          <button class="btn btn-dark" style="padding:13px;margin-top:4px;" onclick="saveNewInventoryItem()">Simpan Item Stok</button>
        </div>
      `);
    }

    function saveNewInventoryItem() {
      const id = document.getElementById('newInvSku').value.trim() || ('BHN-' + Date.now().toString().slice(-4));
      const name = document.getElementById('newInvName').value.trim();
      const category = document.getElementById('newInvCat').value;
      const unit = document.getElementById('newInvUnit').value.trim() || 'Pcs';
      const stock = Math.max(0, Number(document.getElementById('newInvStock').value) || 0);
      const minStock = Math.max(0, Number(document.getElementById('newInvMin').value) || 0);

      if (!name) {
        showToast('Nama bahan baku wajib diisi!', true);
        return;
      }
      db.inventory.unshift({ id, name, category, unit, stock, minStock });
      saveDB();
      closeModal();
      renderOwnerContent();
      showToast(`${name} berhasil ditambahkan ke Inventori!`);
    }

          ${settingsSubTab === 'outlet' ? buildSettingsOutletHTML() : ''}
        </div>

    function buildSettingsProductsHTML() {
      const indexedCats = db.categories.map((name, idx) => ({
        name,
        idx,
        count: name === 'Favorit'
          ? db.products.filter(p => p.fav).length
          : db.products.filter(p => p.category === name).length

      const filteredCats = indexedCats.filter(c =>
        !catSearch || c.name.toLowerCase().includes(catSearch.toLowerCase())

      const totalCatPages = Math.max(1, Math.ceil(filteredCats.length / catPageSize));
      if (catPage > totalCatPages) catPage = totalCatPages;
      const catSlice = filteredCats.slice((catPage - 1) * catPageSize, catPage * catPageSize);

      const filtered = db.products.filter(p => {
        const matchCat = prodCatFilter === 'Semua' || p.category === prodCatFilter;
        const matchQ = !prodSearch || p.name.toLowerCase().includes(prodSearch.toLowerCase()) || p.sku.toLowerCase().includes(prodSearch.toLowerCase());
        return matchCat && matchQ;
      });
      const totalPages = Math.max(1, Math.ceil(filtered.length / prodPageSize));
      if (prodPage > totalPages) prodPage = totalPages;
      const slice = filtered.slice((prodPage - 1) * prodPageSize, prodPage * prodPageSize);

      const renderPagePills = (current, total, fnName) => {
        let html = '';
        for (let i = 1; i <= total; i++) {
