<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN (CLEAN GLASSMORPHISM) ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background: rgba(11, 46, 35, 0.78);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* POS RESPONSIVE GRID (HP / TAB / DESKTOP) */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
      </div>

      <div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:18px;padding:13px;margin-bottom:14px;">
        <label style="display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;color:#FACC15;text-transform:uppercase;margin-bottom:6px;" for="loginStaffSelect">Pilih Pegawai Bertugas</label>
        <select id="loginStaffSelect" class="login-select" onchange="clearPinPad()"></select>
      </div>

      <div>
        <div style="text-align:center;font-size:11px;font-weight:800;letter-spacing:0.06em;color:#FBCFE8;text-transform:uppercase;">Otentikasi PIN 4-Digit</div>
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <div class="numpad-grid">
          <button type="button" class="num-btn" onclick="pressPin('1')">1</button>
          <button type="button" class="num-btn" onclick="pressPin('2')">2</button>
          <button type="button" class="num-btn" onclick="pressPin('3')">3</button>
          <button type="button" class="num-btn" onclick="pressPin('4')">4</button>
          <button type="button" class="num-btn" onclick="pressPin('5')">5</button>
          <button type="button" class="num-btn" onclick="pressPin('6')">6</button>
          <button type="button" class="num-btn" onclick="pressPin('7')">7</button>
          <button type="button" class="num-btn" onclick="pressPin('8')">8</button>
          <button type="button" class="num-btn" onclick="pressPin('9')">9</button>
          <button type="button" class="num-btn pink" onclick="clearPinPad()">Hapus</button>
          <button type="button" class="num-btn" onclick="pressPin('0')">0</button>
          <button type="button" class="num-btn enter" onclick="submitPinLogin()">Masuk</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <div id="appWorkspace" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-row">
          <div class="outlet-info">
            <div class="outlet-title-row">
              <span class="outlet-title" id="headerOutletName">KOPI JIWARA</span>
              <span id="headerShiftBadge" class="shift-pill closed">Shift Tutup</span>
            </div>
            <div class="outlet-sub" id="headerUserMeta">Staf Aktif</div>
          </div>

    // ==================== HELPERS ====================
    function rp(num) {
      const n = Math.round(Number(num) || 0);
      return (n < 0 ? '-' : '') + 'Rp ' + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatDigits(val) {
      const d = String(val || '').replace(/\D/g, '');
      return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function parseDigits(val) {
      return Number(String(val || '').replace(/\D/g, '')) || 0;
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg, isError = false) {
      const wrap = document.getElementById('toastWrap');
      const box = document.getElementById('toastBox');
      box.className = 'toast-box' + (isError ? ' error' : '');
      box.textContent = msg;
      wrap.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => wrap.classList.add('hidden'), 2600);
    }

      if (c.includes('jihyo') || c.includes('dimsum')) return 'Jihyo';

    // ==================== GOOGLE SHEETS MASTER POS & ERP SYNC ====================
    function syncMasterEvent(eventType, payload) {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url) return;
      try {
        fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source: 'KOPI_JIWARA_POS_ERP',
            eventType,
            timestamp: new Date().toISOString(),
            outlet: db.outlet.name,
            payload
          })
        }).catch(() => {});
      } catch (e) {}
    }

    function syncFullMasterDatabase() {
      const url = (db.outlet && db.outlet.webhookUrl || '').trim();
      if (!url) {
        showToast('Isi Webhook URL Google Apps Script dulu di Pengaturan', true);
        return;
      }
      syncMasterEvent('FULL_MASTER_SYNC', {
        products: db.products,
        inventory: db.inventory,
        staff: db.staff.map(s => ({ id: s.id, name: s.name, role: s.role, active: s.active, dailyWage: s.dailyWage })),
        transactions: db.transactions,
        cashDrawerLogs: db.cashDrawerLogs,
        attendanceLogs: db.attendanceLogs,
        shiftClosings: db.shiftClosings
      });
      showToast('Sinkronisasi penuh ke Master POS & ERP dikirim');
    }

    function getMasterAppsScriptCode() {
      return `function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var body = JSON.parse(e.postData.contents);
  var type = body.eventType;
  var p = body.payload;

  function getOrMakeSheet(name, headers) {
    var sh = ss.getSheetByName(name);
    if (!sh) {
      sh = ss.insertSheet(name);
      sh.appendRow(headers);
    }
    return sh;
  }

  var shTrx = getOrMakeSheet('TRANSAKSI_KASIR', ['ID_Nota','Tanggal','Jenis_Order','Pelanggan','Kasir','Status','Metode','Subtotal','Diskon','Total','HPP','Laba_Kotor','Item_Detail']);
  var shPosTrx = getOrMakeSheet('POS_Transactions', ['ID_Nota','Tanggal','Order_Type','Customer','Cashier','Payment','Total','Cost','Profit']);
  var shSell = getOrMakeSheet('POS_Selling_Product', ['Tanggal','ID_Nota','Brand','SKU','Nama_Produk','Qty','Harga','Total_Penjualan']);
  var shFin = getOrMakeSheet('FINANCE_CASH', ['Tanggal','Tipe','Debit','Kredit','Nomor_Nota','Keterangan','PIC']);
  var shCash = getOrMakeSheet('POS_Cashflow', ['Tanggal','Debit','Kredit','Nomor_Nota','Keterangan','Metode']);
  var shClose = getOrMakeSheet('POS_Tutup_Kasir', ['Tanggal','Kasir','Modal_Awal','Sales_Cash','Sales_QRIS','Sales_Transfer','Total_Sales','Kas_Fisik','Selisih']);
  var shMenu = getOrMakeSheet('MASTER_MENU', ['ID','SKU','Nama_Menu','Kategori','Harga_Jual','HPP','Satuan','Stok']);
  var shGudang = getOrMakeSheet('GUDANG_STOK', ['ID','SKU','Nama_Bahan','Kategori','Stok_Sistem','Min_Stok','Satuan']);
  var shAbsen = getOrMakeSheet('KARYAWAN_ABSENSI', ['ID','Tanggal','Nama_Pegawai','Clock_In','Clock_Out','Upah_Harian','Status']);

  if (type === 'SALE_COMPLETED') {
    var profit = (p.total || 0) - (p.costTotal || 0);
    var itemSummary = (p.items || []).map(function(i){ return i.name + ' x' + i.qty; }).join(', ');
    shTrx.appendRow([p.id, p.date, p.orderType, p.customer || '-', p.cashier, p.status, p.paymentMethod, p.subtotal, p.discount, p.total, p.costTotal, profit, itemSummary]);
    shPosTrx.appendRow([p.id, p.date, p.orderType, p.customer || '-', p.cashier, p.paymentMethod, p.total, p.costTotal, profit]);
    shFin.appendRow([p.date.slice(0,10), 'IN', p.total, 0, p.id, 'Sales ' + p.paymentMethod + ' (' + p.orderType + ')', p.cashier]);
    shCash.appendRow([p.date.slice(0,10), p.total, 0, p.id, 'Sales ' + p.paymentMethod, p.paymentMethod]);
    (p.items || []).forEach(function(it) {
      shSell.appendRow([p.date.slice(0,10), p.id, (p.brandMap && p.brandMap[it.id]) || 'Kopi Jiwara', it.sku, it.name, it.qty, it.price, it.price * it.qty]);
    });
  } else if (type === 'CASH_DRAWER') {
    var debit = p.type === 'IN' ? p.amount : 0;
    var kredit = p.type === 'OUT' ? p.amount : 0;
    shFin.appendRow([p.date.slice(0,10), p.type, debit, kredit, p.id, p.note, p.cashier]);
    shCash.appendRow([p.date.slice(0,10), debit, kredit, p.id, p.note, 'Cash Laci']);
  } else if (type === 'CLOSE_SHIFT') {
    shClose.appendRow([p.closedAt, p.cashier, p.openingCash, p.cashSales, p.qrisSales, p.transferSales, p.totalSales, p.actualCash, p.diff]);
  } else if (type === 'ATTENDANCE') {
    shAbsen.appendRow([p.id, p.date, p.staffName, p.clockIn, p.clockOut || '-', p.wage, p.status]);
  } else if (type === 'FULL_MASTER_SYNC') {
    shMenu.clearContents();
    shMenu.appendRow(['ID','SKU','Nama_Menu','Kategori','Harga_Jual','HPP','Satuan','Stok']);
    (p.products || []).forEach(function(m) {
      shMenu.appendRow([m.id, m.sku, m.name, m.category, m.price, m.cost, m.unit, m.stock]);
    });
    shGudang.clearContents();
    shGudang.appendRow(['ID','SKU','Nama_Bahan','Kategori','Stok_Sistem','Min_Stok','Satuan']);
    (p.inventory || []).forEach(function(g) {
      shGudang.appendRow([g.id, g.sku, g.name, g.category, g.stock, g.minStock, g.unit]);
    });
  }

  return ContentService.createTextOutput(JSON.stringify({ status: 'OK', eventType: type })).setMimeType(ContentService.MimeType.JSON);
}`;
    }

    function initLoginScreen() {
      const sel = document.getElementById('loginStaffSelect');

    function pressPin(d) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += d;
      renderPinDots();
      if (pinBuffer.length === 4) setTimeout(submitPinLogin, 110);
    }

    function clearPinPad() {
      pinBuffer = '';
      renderPinDots();
    }

    function renderPinDots() {
      document.querySelectorAll('#pinDots .pin-dot').forEach((dot, i) => {
        dot.classList.toggle('filled', i < pinBuffer.length);
      });
    }

    function submitPinLogin() {
      const staff = db.staff.find(s => s.id === document.getElementById('loginStaffSelect').value);
      if (!staff) return;
      if (pinBuffer !== staff.pin) {
        showToast('PIN salah. Silakan coba kembali.', true);
        clearPinPad();
        return;
      }
      currentUser = staff;
      clearPinPad();
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appWorkspace').classList.remove('hidden');
      workspaceMode = staff.role === 'Owner' ? 'owner' : 'cashier';
      currentTab = staff.role === 'Owner' ? 'penjualan' : 'kasir';
      renderWorkspace();
      showToast(`Selamat bertugas, ${staff.name}`);
    }

    function toggleWorkspaceMode() {
      if (!currentUser || currentUser.role !== 'Owner') return;
      workspaceMode = workspaceMode === 'owner' ? 'cashier' : 'owner';
      currentTab = workspaceMode === 'owner' ? 'penjualan' : 'kasir';
      renderWorkspace();
    }

    function handleLogoutAction() {
      if (workspaceMode === 'cashier') {
        currentTab = 'keluar_kasir';
        renderWorkspace();
      } else {
        doDirectLogout();
      }
    }

    function doDirectLogout() {
      currentUser = null;
      document.getElementById('appWorkspace').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      initLoginScreen();
      showToast('Berhasil keluar dari sesi.');

            { id: 'absensi', label: 'Absensi' },
            { id: 'keluar_kasir', label: 'Keluar Kasir' }
          ]
        : [
            { id: 'kasir_owner', label: 'Kasir' },
            { id: 'penjualan', label: 'Penjualan' },
            { id: 'laporan', label: 'Laporan' },
            { id: 'inventori', label: 'Inventori' },
            { id: 'pengaturan', label: 'Pengaturan' }
          ];

      nav.innerHTML = tabs.map(t => `<button class="nav-pill ${currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');

      const main = document.getElementById('mainContentArea');
      if (workspaceMode === 'cashier') {
        if (currentTab === 'kasir') renderCashierPOS(main);
        else if (currentTab === 'penjualan_kasir') renderCashierSalesTab(main);
        else if (currentTab === 'laporan_kasir') renderCashierReportTab(main);
        else if (currentTab === 'kas_kasir') renderCashDrawerTab(main);
        else if (currentTab === 'absensi') renderAttendanceTab(main);
        else if (currentTab === 'keluar_kasir') renderCloseRegisterTab(main);
      } else {
        if (currentTab === 'kasir_owner') {
          workspaceMode = 'cashier';
          currentTab = 'kasir';
          renderWorkspace();
          return;
        }
        if (currentTab === 'penjualan') renderOwnerSalesTab(main);
        else if (currentTab === 'laporan') renderOwnerReportsTab(main);
        else if (currentTab === 'inventori') renderOwnerInventoryTab(main);
        else if (currentTab === 'pengaturan') renderOwnerSettingsTab(main);
      }
    }

    function switchTab(id) {
      currentTab = id;
      renderWorkspace();
    }

    // ==================== 1. CASHIER POS + SPLIT BILL ====================
    function renderCashierPOS(container) {
      if (!db.shift.isOpen) {
        container.innerHTML = `
          <div class="bento-card" style="max-width:440px;margin:24px auto;text-align:center;">
            <span class="badge-pill badge-pink" style="margin-bottom:8px;">SHIFT TERKUNCI</span>
            <h2 style="margin:0 0 6px;font-size:19px;">Shift Kasir Belum Dibuka</h2>
            <p style="margin:0 0 16px;font-size:13px;color:var(--text-muted);">Masukkan modal awal uang tunai di laci kasir sebelum memulai transaksi penjualan.</p>
            <div style="text-align:left;margin-bottom:14px;">
              <label class="field-label">Modal Awal Uang Laci (Rp)</label>
              <input id="openShiftCashInput" type="text" inputmode="numeric" class="styled-input" value="300.000" oninput="this.value=formatDigits(this.value)" />
            </div>
            <button class="btn btn-dark" style="width:100%;padding:13px;" onclick="openCashierShift()">Buka Shift Kasir Sekarang</button>
          </div>
        `;
        return;
      }

      const openOrders = db.transactions.filter(t => t.status === 'OPEN');
      const filteredProds = db.products.filter(p => {
        const matchCat = selectedCategory === 'Favorit' ? p.fav : p.category === selectedCategory;
        const q = productSearch.trim().toLowerCase();
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
        return q ? matchQ : matchCat;
      });

      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const promo = db.promos.find(pr => pr.active && pr.code.toLowerCase() === cartPromoCode.trim().toLowerCase());
      const discount = promo ? (promo.type === 'percent' ? Math.round(subtotal * promo.value / 100) : Math.min(subtotal, promo.value)) : 0;
      const grandTotal = Math.max(0, subtotal - discount);

      container.innerHTML = `
        <div class="pos-layout">
          <div class="bento-card">
            <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
              <button class="btn ${posSubTab === 'menu' ? 'btn-dark' : 'btn-soft'}" style="flex:1;min-width:130px;" onclick="posSubTab='menu';renderCashierPOS(document.getElementById('mainContentArea'))">Menu Kasir</button>
              <button class="btn ${posSubTab === 'open' ? 'btn-pink' : 'btn-soft'}" style="flex:1;min-width:150px;" onclick="posSubTab='open';renderCashierPOS(document.getElementById('mainContentArea'))">Daftar Order (Open) • ${openOrders.length}</button>
            </div>

            ${posSubTab === 'open' ? `
              <div>
                <h3 style="margin:0 0 10px;font-size:15px;">Pesanan Belum Dibayar (Open Bill)</h3>
                ${openOrders.length === 0 ? `<p style="font-size:13px;color:var(--text-muted);text-align:center;padding:24px 0;">Tidak ada order tertunda.</p>` : `
                  <div style="display:grid;gap:10px;">
                    ${openOrders.map(o => `
                      <div style="border:1.5px solid var(--border-glass);border-radius:16px;padding:12px;background:#FFFFFF;">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                          <div>
                            <span class="badge-pill badge-yellow">${esc(o.orderType)}</span>
                            <strong style="font-size:14px;margin-left:6px;">${esc(o.customer || o.id)}</strong>
                            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${esc(o.id)} • ${o.items.map(i => `${i.name} x${i.qty}`).join(', ')}</div>
                          </div>
                          <div style="text-align:right;">
                            <div style="font-weight:900;font-size:14px;">${rp(o.total)}</div>
                            <button class="btn btn-dark btn-sm" style="margin-top:6px;" onclick="loadOpenOrderToCart('${esc(o.id)}')">Muat & Bayar</button>
                          </div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            ` : `
              <div style="margin-bottom:10px;">
                <input type="text" class="styled-input" placeholder="Cari nama menu atau kode SKU..." value="${esc(productSearch)}" oninput="productSearch=this.value;renderCashierPOS(document.getElementById('mainContentArea'))" />
              </div>

              <div class="cat-strip no-scroll" style="margin-bottom:12px;">
                ${db.categories.map(c => `
                  <button class="cat-chip ${selectedCategory === c ? 'active' : ''}" onclick="selectedCategory='${esc(c)}';productSearch='';renderCashierPOS(document.getElementById('mainContentArea'))">${esc(c)}</button>
                `).join('')}
              </div>

              <div class="prod-grid">
                ${filteredProds.map(p => {
                  const inCart = cart.find(c => c.id === p.id);
                  return `
                    <button type="button" class="prod-card ${inCart ? 'in-cart' : ''}" onclick="addToCart('${esc(p.id)}')">
                      ${inCart ? `<span class="qty-badge">${inCart.qty}x</span>` : ''}
                      <div>
                        <div style="font-size:10px;font-weight:800;color:var(--text-muted);">${esc(p.sku)} • ${esc(p.category)}</div>
                        <div style="font-size:13px;font-weight:800;color:var(--green-deep);margin-top:4px;line-height:1.25;">${esc(p.name)}</div>
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px;">
                        <span style="font-size:13px;font-weight:900;color:var(--green-deep);">${rp(p.price)}</span>
                        <span class="badge-pill badge-green">${esc(p.unit)}</span>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <div class="bento-card" style="position:sticky;top:86px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <h3 style="margin:0;font-size:16px;">Keranjang Pesanan</h3>
              ${cart.length > 0 ? `<button class="btn btn-danger btn-sm" onclick="clearCart()">Kosongkan</button>` : ''}
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
              <div>
                <label class="field-label">Jenis Order</label>
                <select class="styled-select" style="padding:9px 11px;font-size:12px;" onchange="cartOrderType=this.value">
                  ${ORDER_TYPES.map(ot => `<option value="${esc(ot)}" ${cartOrderType === ot ? 'selected' : ''}>${esc(ot)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">Nama / No. Meja</label>
                <input type="text" class="styled-input" style="padding:9px 11px;font-size:12px;" placeholder="Meja 01 / Nama..." value="${esc(cartCustomer)}" oninput="cartCustomer=this.value" />
              </div>
            </div>

            <div style="max-height:240px;overflow-y:auto;border-top:1px solid var(--border-glass);border-bottom:1px solid var(--border-glass);padding:8px 0;margin-bottom:10px;">
              ${cart.length === 0 ? `
                <div style="text-align:center;padding:24px 10px;color:var(--text-muted);font-size:12px;">Belum ada item dipilih. Ketuk menu di samping untuk menambahkan.</div>
              ` : cart.map(item => `
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border-glass);">
                  <div style="min-width:0;flex:1;">
                    <div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.name)}</div>
                    <div style="font-size:11px;color:var(--text-muted);">${rp(item.price)} x ${item.qty} = <strong>${rp(item.price * item.qty)}</strong></div>
                  </div>
                  <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                    <button class="btn btn-soft btn-sm" style="padding:5px 9px;" onclick="updateCartQty('${esc(item.id)}', -1)">-</button>
                    <span style="font-size:12px;font-weight:900;min-width:18px;text-align:center;">${item.qty}</span>
                    <button class="btn btn-dark btn-sm" style="padding:5px 9px;" onclick="updateCartQty('${esc(item.id)}', 1)">+</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="display:flex;gap:6px;margin-bottom:10px;">
              <input type="text" class="styled-input" style="padding:8px 11px;font-size:12px;" placeholder="Kode Promo (JIWARA10 / HEMAT5K)" value="${esc(cartPromoCode)}" oninput="cartPromoCode=this.value" />
              <button class="btn btn-soft btn-sm" onclick="renderCashierPOS(document.getElementById('mainContentArea'))">Pakai</button>
            </div>

            <div style="font-size:12px;display:grid;gap:4px;margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><strong>${rp(subtotal)}</strong></div>
              ${discount > 0 ? `<div style="display:flex;justify-content:space-between;color:#BE185D;"><span>Diskon Promo</span><strong>-${rp(discount)}</strong></div>` : ''}
              <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:900;padding-top:6px;border-top:1.5px solid var(--green-deep);">
                <span>Total Tagihan</span>
                <span>${rp(grandTotal)}</span>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
              <button class="btn btn-soft" onclick="saveAsOpenOrder()" ${cart.length === 0 ? 'disabled' : ''}>Simpan Open Order</button>
              <button class="btn btn-pink" onclick="openSplitBillModal()" ${cart.length === 0 ? 'disabled' : ''}>Split Bill / Pisah</button>
            </div>
            <button class="btn btn-yellow" style="width:100%;padding:13px;font-size:14px;" onclick="openCheckoutModal(${grandTotal}, ${subtotal}, ${discount})" ${cart.length === 0 ? 'disabled' : ''}>
              Bayar Sekarang (${rp(grandTotal)})
            </button>
          </div>
        </div>
      `;
    }

    function openCashierShift() {
      const cash = parseDigits(document.getElementById('openShiftCashInput').value);
      db.shift = { isOpen: true, cashierName: currentUser.name, openedAt: new Date().toISOString(), openingCash: cash };
      saveDB();
      renderWorkspace();
      showToast(`Shift dibuka dengan modal awal ${rp(cash)}`);
    }

    function addToCart(prodId) {
      const p = db.products.find(x => x.id === prodId);
      if (!p) return;
      const ex = cart.find(c => c.id === prodId);
      if (ex) ex.qty += 1;
      else cart.push({ id: p.id, sku: p.sku, name: p.name, category: p.category, price: p.price, cost: p.cost || 0, qty: 1 });
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function updateCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function clearCart() {
      cart = [];
      editingOpenOrderId = null;
      cartCustomer = '';
      cartPromoCode = '';
      renderCashierPOS(document.getElementById('mainContentArea'));
    }

    function saveAsOpenOrder() {
      if (cart.length === 0) return;
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const costTotal = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const trxId = editingOpenOrderId || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
      const orderObj = {
        id: trxId, date: new Date().toISOString(), orderType: cartOrderType,
        customer: cartCustomer.trim() || 'Pelanggan ' + trxId, cashier: currentUser.name,
        status: 'OPEN', paymentMethod: 'OPEN', subtotal, discount: 0, total: subtotal, costTotal,
        cashPaid: 0, change: 0, items: JSON.parse(JSON.stringify(cart))
      };
      const exIdx = db.transactions.findIndex(t => t.id === trxId);
      if (exIdx >= 0) db.transactions[exIdx] = orderObj;
      else db.transactions.unshift(orderObj);
      saveDB();
      clearCart();
      showToast(`Order ${trxId} disimpan ke Daftar Open`);
    }

    function loadOpenOrderToCart(trxId) {
      const ord = db.transactions.find(t => t.id === trxId);
      if (!ord) return;
      cart = JSON.parse(JSON.stringify(ord.items));
      cartOrderType = ord.orderType;
      cartCustomer = ord.customer;
      editingOpenOrderId = ord.id;
      posSubTab = 'menu';
      renderCashierPOS(document.getElementById('mainContentArea'));
      showToast(`Order ${ord.id} dimuat ke keranjang.`);
    }

    // ==================== SPLIT BILL ====================
    let splitSelectedQty = {};

    function openSplitBillModal() {
      if (cart.length === 0) return;
      splitSelectedQty = {};
      cart.forEach(item => { splitSelectedQty[item.id] = item.qty; });
      renderSplitBillModalContent();
    }

    function renderSplitBillModalContent() {
      const selectedTotal = cart.reduce((s, it) => s + it.price * (splitSelectedQty[it.id] || 0), 0);
      const fullTotal = cart.reduce((s, it) => s + it.price * it.qty, 0);
      const remainingTotal = fullTotal - selectedTotal;

      openModal(`
        <div class="modal-head">
          <div>
            <h3 style="margin:0;font-size:17px;">Split Bill / Pisah Pembayaran</h3>
            <div style="font-size:11px;color:var(--text-muted);">Pilih menu yang ingin dibayar sekarang (sisanya masuk Open Order)</div>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <div style="display:grid;gap:8px;margin-bottom:14px;">
          ${cart.map(item => {
            const selQ = splitSelectedQty[item.id] || 0;
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;border:1.5px solid ${selQ > 0 ? 'var(--green-deep)' : 'var(--border-glass)'};background:${selQ > 0 ? '#F2FAF6' : '#FFF'};">
                <div>
                  <div style="font-size:13px;font-weight:800;">${esc(item.name)}</div>
                  <div style="font-size:11px;color:var(--text-muted);">${rp(item.price)} • Pesanan: ${item.qty}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <button class="btn btn-soft btn-sm" onclick="adjustSplitItem('${esc(item.id)}', -1, ${item.qty})">-</button>
                  <span style="font-size:13px;font-weight:900;min-width:28px;text-align:center;">${selQ}/${item.qty}</span>
                  <button class="btn btn-dark btn-sm" onclick="adjustSplitItem('${esc(item.id)}', 1, ${item.qty})">+</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="kpi-tile dark" style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div class="kpi-label">Nominal Split Dibayar</div>
              <div class="kpi-value">${rp(selectedTotal)}</div>
            </div>
            <div style="text-align:right;">
              <div class="kpi-label">Sisa Belum Dibayar</div>
              <div style="font-size:14px;font-weight:800;color:#FBCFE8;">${rp(remainingTotal)}</div>
            </div>
          </div>
        </div>

        <div style="margin-bottom:12px;">
          <label class="field-label">Metode Pembayaran Split Ini</label>
          <select id="splitPayMethod" class="styled-select">
            <option value="Cash">Cash (Tunai)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer Bank</option>
          </select>
        </div>

        <button class="btn btn-yellow" style="width:100%;padding:13px;font-size:13px;" onclick="processSplitItemCheckout()" ${selectedTotal <= 0 ? 'disabled' : ''}>
          Bayar Menu Terpilih (${rp(selectedTotal)})
        </button>
      `);
    }

    function adjustSplitItem(prodId, delta, maxQty) {
      const cur = splitSelectedQty[prodId] || 0;
      splitSelectedQty[prodId] = Math.max(0, Math.min(maxQty, cur + delta));
      renderSplitBillModalContent();
    }

    function processSplitItemCheckout() {
      const paidItems = [];
      const leftoverItems = [];
      cart.forEach(item => {
        const payQ = splitSelectedQty[item.id] || 0;
        const remQ = item.qty - payQ;
        if (payQ > 0) paidItems.push({ ...item, qty: payQ });
        if (remQ > 0) leftoverItems.push({ ...item, qty: remQ });
      });
      if (paidItems.length === 0) return;

      const payMethod = document.getElementById('splitPayMethod').value;
      const paidTotal = paidItems.reduce((s, i) => s + i.price * i.qty, 0);
      const paidCost = paidItems.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const trxId = 'TRX-' + Math.floor(1000 + Math.random() * 9000);

      const trx = {
        id: trxId, date: new Date().toISOString(), orderType: cartOrderType,
        customer: (cartCustomer || 'Split Bill') + ' (Split)', cashier: currentUser.name,
        status: 'PAID', paymentMethod: payMethod, subtotal: paidTotal, discount: 0,
        total: paidTotal, costTotal: paidCost, cashPaid: paidTotal, change: 0, items: paidItems
      };

      db.transactions.unshift(trx);
      deductProductStock(paidItems);
      const brandMap = {};
      paidItems.forEach(it => { brandMap[it.id] = getBrandFromCategory(it.category); });
      syncMasterEvent('SALE_COMPLETED', { ...trx, brandMap });

      if (leftoverItems.length > 0) {
        const remTotal = leftoverItems.reduce((s, i) => s + i.price * i.qty, 0);
        const remCost = leftoverItems.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
        const openId = editingOpenOrderId || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
        const openOrd = {
          id: openId, date: new Date().toISOString(), orderType: cartOrderType,
          customer: (cartCustomer || 'Sisa Split Bill'), cashier: currentUser.name,
          status: 'OPEN', paymentMethod: 'OPEN', subtotal: remTotal, discount: 0,
          total: remTotal, costTotal: remCost, cashPaid: 0, change: 0, items: leftoverItems
        };
        const exIdx = db.transactions.findIndex(t => t.id === openId);
        if (exIdx >= 0) db.transactions[exIdx] = openOrd;
        else db.transactions.unshift(openOrd);
      } else if (editingOpenOrderId) {
        db.transactions = db.transactions.filter(t => t.id !== editingOpenOrderId);
      }

      saveDB();
      clearCart();
      closeModal();
      printThermalReceipt(trx);
      showToast(`Split Bill ${trxId} lunas`);
    }

    // ==================== CHECKOUT MODAL ====================
    let checkoutMethod = 'Cash';

    function openCheckoutModal(total, subtotal, discount) {
      checkoutMethod = 'Cash';
      const roundUp = Math.ceil(total / 10000) * 10000;
      openModal(`
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);">PEMBAYARAN TRANSAKSI</div>
            <div style="font-size:24px;font-weight:900;color:var(--green-deep);">${rp(total)}</div>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <label class="field-label">Pilihan Metode Pembayaran</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
          <button type="button" id="payOptCash" class="btn btn-dark" onclick="selectCheckoutMethod('Cash', ${total})">Cash</button>
          <button type="button" id="payOptQRIS" class="btn btn-soft" onclick="selectCheckoutMethod('QRIS', ${total})">QRIS</button>
          <button type="button" id="payOptTransfer" class="btn btn-soft" onclick="selectCheckoutMethod('Transfer', ${total})">Transfer</button>
        </div>

        <div id="cashInputPanel" style="background:var(--green-soft);padding:14px;border-radius:16px;margin-bottom:14px;">
          <label class="field-label" for="cashReceivedField">Uang Cash Diterima (Rp)</label>
          <input id="cashReceivedField" type="text" inputmode="numeric" class="styled-input" style="font-size:18px;" value="${formatDigits(total)}" oninput="handleCashReceivedTyping(this, ${total})" />
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
            <button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(${total}, ${total})">Uang Pas (${rp(total)})</button>
            ${roundUp > total ? `<button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(${roundUp}, ${total})">${rp(roundUp)}</button>` : ''}
            <button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(50000, ${total})">Rp 50.000</button>
            <button type="button" class="btn btn-soft btn-sm" style="background:#FFF;" onclick="setQuickCash(100000, ${total})">Rp 100.000</button>
            <button type="button" class="btn btn-pink btn-sm" onclick="setQuickCash(0, ${total})">Reset</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border-glass);">
            <span style="font-size:12px;font-weight:700;">Kembalian:</span>
            <strong id="cashChangeDisplay" style="font-size:18px;color:var(--green-deep);">Rp 0</strong>
          </div>
        </div>

        <button class="btn btn-yellow" style="width:100%;padding:14px;font-size:14px;" onclick="completeCheckout(${total}, ${subtotal}, ${discount})">
          Selesaikan Pembayaran & Cetak Struk
        </button>
      `);
    }

    function selectCheckoutMethod(method, total) {
      checkoutMethod = method;
      ['Cash', 'QRIS', 'Transfer'].forEach(m => {
        const el = document.getElementById('payOpt' + m);
        if (el) el.className = 'btn ' + (m === method ? 'btn-dark' : 'btn-soft');
      });
      const panel = document.getElementById('cashInputPanel');
      if (panel) panel.style.display = method === 'Cash' ? 'block' : 'none';
    }

    function handleCashReceivedTyping(inputEl, total) {
      const formatted = formatDigits(inputEl.value);
      inputEl.value = formatted;
      updateCashChangeUI(parseDigits(formatted), total);

      }
    }

    function updateCashChangeUI(received, total) {
      const disp = document.getElementById('cashChangeDisplay');
      if (!disp) return;
      const diff = received - total;
      if (diff < 0) {
        disp.style.color = '#BE185D';
        disp.textContent = `Kurang ${rp(Math.abs(diff))}`;
      } else {
        disp.style.color = '#0B2E23';
        disp.textContent = rp(diff);
      }
    }

    function completeCheckout(total, subtotal, discount) {
      let cashPaid = total;
      let change = 0;
      if (checkoutMethod === 'Cash') {
        const el = document.getElementById('cashReceivedField');
        cashPaid = parseDigits(el ? el.value : total);
        if (cashPaid < total) {
          showToast('Nominal uang cash diterima masih kurang.', true);
          return;
        }
        change = cashPaid - total;
      }

      const trxId = 'TRX-' + Math.floor(1000 + Math.random() * 9000);
      const costTotal = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const trx = {
        id: trxId, date: new Date().toISOString(), orderType: cartOrderType,
        customer: cartCustomer.trim() || 'Walk-in', cashier: currentUser.name,
        status: 'PAID', paymentMethod: checkoutMethod, subtotal, discount, total, costTotal,
        cashPaid, change, items: JSON.parse(JSON.stringify(cart))
      };

      if (editingOpenOrderId) db.transactions = db.transactions.filter(t => t.id !== editingOpenOrderId);
      db.transactions.unshift(trx);
      deductProductStock(cart);

      const brandMap = {};
      trx.items.forEach(it => { brandMap[it.id] = getBrandFromCategory(it.category); });
      syncMasterEvent('SALE_COMPLETED', { ...trx, brandMap });

      saveDB();
      clearCart();
      closeModal();
      printThermalReceipt(trx);
      showToast(`Transaksi ${trxId} berhasil (${checkoutMethod})`);
    }

    // ==================== 3. LAPORAN KASIR (DROPDOWN PERIODE) ====================
    function filterTransactionsByPreset(preset) {
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const yest = new Date(now);
      yest.setDate(now.getDate() - 1);
      const yestStr = yest.toISOString().slice(0, 10);

      return db.transactions.filter(t => {
        const d = new Date(t.date);
        const dStr = t.date.slice(0, 10);
        if (preset === 'Hari Ini') return dStr === todayStr;
        if (preset === 'Kemarin') return dStr === yestStr;
        if (preset === '7 Hari Terakhir') return (now - d) / (1000 * 60 * 60 * 24) <= 7;
        if (preset === 'Minggu Ini') {
          const s = new Date(now); s.setDate(now.getDate() - now.getDay());
          return d >= s;
        }
        if (preset === 'Minggu Lalu') {
          const st = new Date(now); st.setDate(now.getDate() - now.getDay());
          const sl = new Date(st); sl.setDate(st.getDate() - 7);
          return d >= sl && d < st;
        }
        if (preset === 'Bulan Ini') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        if (preset === 'Bulan Lalu') {
          const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
        }
        return true;
      });
    }

    function updateClosingDiff(el, expectedCash) {
      el.value = formatDigits(el.value);
      const actual = parseDigits(el.value);
      const diff = actual - expectedCash;
      const lbl = document.getElementById('closingDiffLabel');
      if (!lbl) return;
      if (diff === 0) { lbl.style.color = '#065F46'; lbl.textContent = 'Selisih Laci: Rp 0 (Klop / Sesuai)'; }
      else if (diff > 0) { lbl.style.color = '#0B2E23'; lbl.textContent = `Selisih Laci: +${rp(diff)} (Lebih)`; }
      else { lbl.style.color = '#BE185D'; lbl.textContent = `Selisih Laci: -${rp(Math.abs(diff))} (Kurang)`; }
    }

    function fillExpectedCash(val) {
      const el = document.getElementById('closingActualCash');
      if (el) { el.value = val > 0 ? formatDigits(val) : ''; updateClosingDiff(el, val); }
    }

    function sendClosingWhatsApp(totalSales, cashSales, qrisSales, transferSales, expectedCash, openCount) {
      const actual = parseDigits(document.getElementById('closingActualCash')?.value || 0);
      const text = `*LAPORAN TUTUP KASIR — ${db.outlet.name}*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\nKasir: ${currentUser.name}\n• Total Omzet: ${rp(totalSales)}\n• Cash: ${rp(cashSales)}\n• QRIS: ${rp(qrisSales)}\n• Transfer: ${rp(transferSales)}\n• Ekspektasi Laci: ${rp(expectedCash)}\n• Cash Fisik: ${rp(actual)}\n• Transaksi Tertunda: ${openCount} order`;
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }

    function finalizeShiftClosing(totalSales, cashSales, qrisSales, transferSales, expectedCash) {
      const pin = document.getElementById('closingPinVerify').value;
      if (pin !== currentUser.pin) { showToast('PIN Kasir tidak sesuai.', true); return; }
      const actualCash = parseDigits(document.getElementById('closingActualCash').value);
      const rec = {
        id: 'CLS-' + Math.floor(1000 + Math.random() * 9000), closedAt: new Date().toISOString(),
        cashier: currentUser.name, openingCash: db.shift.openingCash, cashSales, qrisSales, transferSales,
        totalSales, expectedCash, actualCash, diff: actualCash - expectedCash
      };
      db.shiftClosings.unshift(rec);
      db.shift.isOpen = false;
      syncMasterEvent('CLOSE_SHIFT', rec);
      saveDB();
      showToast('Shift berhasil ditutup & laporan tersimpan.');
      doDirectLogout();
    }

      saveDB();

    function applyInventoryDelta(sign) {
      const invId = document.getElementById('mutInvSelect').value;
      const qty = Math.max(0, Number(document.getElementById('mutInvQty').value) || 0);
      if (qty <= 0) { showToast('Masukkan jumlah valid.', true); return; }
      const item = db.inventory.find(i => i.id === invId);

      item.stock = Math.max(0, Number(item.stock) + sign * qty);
      saveDB();
      renderOwnerInventoryTab(document.getElementById('mainContentArea'));
      showToast(`Stok ${item.name} sekarang ${item.stock} ${item.unit}`);
