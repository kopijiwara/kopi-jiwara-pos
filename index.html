function doPost(e) {
  setupMasterJiwaraSheets();
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var props = PropertiesService.getScriptProperties();
  var body = JSON.parse(e.postData.contents);
  var type = body.eventType;
  var d = body.data || {};

  if (type === 'OUTLET_PROFILE_UPDATED') {
    props.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(d));
  } else if (type === 'POS_TRANSACTION_PAID') {
    var existingTrx = readSheetObjects(ss, 'POS_TRANSAKSI').some(function(r) { return String(r.No_Nota) === String(d.id); });
    if (!existingTrx) {
      appendRowByHeaders(ss, 'POS_TRANSAKSI',
        ['No_Nota', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Subtotal', 'Diskon', 'Kode_Promo', 'Total_Bayar', 'Metode_Bayar', 'Status'],
        {
          No_Nota: d.id, Tanggal: d.date, Jam: d.time, Tipe_Order: d.orderType,
          Meja_Pelanggan: d.tableOrCustomer || '-', No_WA: d.customerPhone || '',
          Kasir: d.cashier, Subtotal: d.subtotal, Diskon: d.discount || 0,
          Kode_Promo: d.promoCode || '-', Total_Bayar: d.total,
          Metode_Bayar: d.paymentMethod, Status: 'PAID'
        }
      );
      (d.items || []).forEach(function(it) {
        var sub = (it.price || 0) * (it.qty || 1);
        var hpp = (it.cost || 0) * (it.qty || 1);
        var kenaKomisi = it.includeCommissionShare === false ? 'Tidak' : 'Ya';
        var kenaGaji = it.includeSalaryShare === false ? 'Tidak' : 'Ya';
        appendRowByHeaders(ss, 'POS_ITEM_TERJUAL',
          ['No_Nota', 'Tanggal', 'Jam', 'SKU', 'Nama_Menu', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Qty', 'Harga_Satuan', 'HPP_Satuan', 'Subtotal_Item', 'Total_HPP', 'Laba_Kotor_Item'],
          {
            No_Nota: d.id, Tanggal: d.date, Jam: d.time, SKU: it.sku || '-', Nama_Menu: it.name,
            Brand: it.brand || 'Kopi Jiwara', Kena_Komisi_Brand: kenaKomisi, Kena_Komisi: kenaKomisi,
            Hitung_Porsi_Gaji: kenaGaji, Qty: it.qty, Harga_Satuan: it.price, HPP_Satuan: it.cost || 0,
            Subtotal_Item: sub, Total_HPP: hpp, Laba_Kotor_Item: sub - hpp
          }
        );
      });
    }
  } else if (type === 'PAID_TRX_CANCELLED') {
    var sPos2 = ss.getSheetByName('POS_TRANSAKSI');
    if (sPos2 && sPos2.getLastRow() > 1) {
      var hdrs = sPos2.getRange(1, 1, 1, sPos2.getLastColumn()).getValues()[0].map(function(h) { return String(h).trim(); });
      var colNota = hdrs.indexOf('No_Nota') + 1;
      var colStatus = hdrs.indexOf('Status') + 1;
      if (colNota > 0 && colStatus > 0) {
        var vals = sPos2.getRange(2, colNota, sPos2.getLastRow() - 1, 1).getValues();
        for (var r = 0; r < vals.length; r++) {
          if (String(vals[r][0]) === String(d.id)) sPos2.getRange(r + 2, colStatus).setValue('CANCELLED');
        }
      }
    }
  } else if (type === 'CASH_DRAWER_ADDED') {
    var isOut = d.type === 'OUT';
    var noteLower = String(d.note || '').toLowerCase();
    var katKas = isOut ? (noteLower.indexOf('transfer sales') >= 0 ? 'Setoran Brand Owner' : (noteLower.indexOf('setoran') >= 0 ? 'Setoran Kasir' : 'Biaya Operasional')) : 'Kas Masuk Tambahan';
    appendRowByHeaders(ss, 'ARUS_KAS_CASHFLOW',
      ['ID_Kas', 'Tanggal', 'Jam', 'Kategori_Kas', 'Keterangan', 'Terima_Dari_Kepada', 'Debit_Masuk', 'Kredit_Keluar', 'No_Nota_Ref', 'PIC'],
      {
        ID_Kas: d.id, Tanggal: d.date, Jam: d.time, Kategori_Kas: katKas,
        Keterangan: d.note, Terima_Dari_Kepada: d.by || '-',
        Debit_Masuk: isOut ? 0 : d.amount, Kredit_Keluar: isOut ? d.amount : 0,
        No_Nota_Ref: '-', PIC: d.by
      }
    );
  } else if (type === 'ATTENDANCE_CLOCK') {
    var sAtt = ss.getSheetByName('ABSENSI_KARYAWAN');
    var updated = false;
    if (sAtt && sAtt.getLastRow() > 1) {
      var av = sAtt.getRange(2, 1, sAtt.getLastRow() - 1, 6).getValues();
      for (var k = av.length - 1; k >= 0; k--) {
        if (String(av[k][0]) === String(d.date) && String(av[k][1]) === String(d.staffName)) {
          sAtt.getRange(k + 2, 5).setValue(d.clockOut || '');
          updated = true; break;
        }
      }
    }
    if (!updated) {
      appendRowByHeaders(ss, 'ABSENSI_KARYAWAN',
        ['Tanggal', 'Nama_Pegawai', 'Jabatan', 'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian'],
        { Tanggal: d.date, Nama_Pegawai: d.staffName, Jabatan: d.role, Jam_Masuk: d.clockIn, Jam_Pulang: d.clockOut || '', Upah_Harian: d.wage }
      );
    }
  } else if (type === 'SHIFT_CLOSED') {
    appendRowByHeaders(ss, 'CLOSING_SHIFT',
      ['ID_Closing', 'Tanggal', 'Jam', 'Kasir', 'Modal_Awal', 'Sales_Cash', 'Sales_QRIS', 'Sales_Transfer', 'Sales_Online', 'Total_Omzet', 'Ekspektasi_Cash_Laci', 'Uang_Fisik_Laci', 'Selisih_Laci'],
      {
        ID_Closing: d.id, Tanggal: d.date, Jam: d.time, Kasir: d.cashier,
        Modal_Awal: d.openingCash, Sales_Cash: d.cashSales, Sales_QRIS: d.qrisSales,
        Sales_Transfer: d.transferSales, Sales_Online: d.onlineSales, Total_Omzet: d.totalSales,
        Ekspektasi_Cash_Laci: d.expectedCash, Uang_Fisik_Laci: d.actualCash, Selisih_Laci: d.diff
      }
    );
  } else if (type === 'AUDIT_VOID_LOGGED') {
    appendRowByHeaders(ss, 'AUDIT_OTORISASI',
      ['ID_Audit', 'Tanggal', 'Jam', 'No_Order_Nota', 'Tindakan_Item', 'Kasir', 'Otorisasi_Oleh', 'Alasan'],
      { ID_Audit: d.id, Tanggal: d.date, Jam: d.time, No_Order_Nota: d.orderId, Tindakan_Item: d.itemName, Kasir: d.cashier, Otorisasi_Oleh: d.authorizedBy, Alasan: d.reason }
    );
  } else if (type === 'STOCK_LOG_ADDED') {
    appendRowByHeaders(ss, 'LOG_STOK_GUDANG',
      ['ID_Log', 'Tanggal', 'Jam', 'Nama_Bahan', 'Jenis_Mutasi', 'Jumlah', 'Sisa_Stok', 'PIC'],
      { ID_Log: d.id, Tanggal: d.date, Jam: d.time, Nama_Bahan: d.itemName, Jenis_Mutasi: d.type, Jumlah: d.qty, Sisa_Stok: d.afterStock, PIC: d.pic }
    );
  } else if (type === 'BRAND_SETTLEMENT_PAID') {
    appendRowByHeaders(ss, 'SETTLEMENT_BRAND',
      ['ID_Settlement', 'Tanggal', 'Periode_Mingguan', 'Brand', 'Omzet_Kotor', 'Komisi_Pct', 'Potongan_Komisi_Rp', 'Porsi_Beban_Gaji_Rp', 'Net_Wajib_Transfer_Rp', 'Status_Transfer', 'PIC'],
      {
        ID_Settlement: d.id, Tanggal: d.date, Periode_Mingguan: d.periodLabel, Brand: d.brand,
        Omzet_Kotor: d.grossSales, Komisi_Pct: d.commissionPct, Potongan_Komisi_Rp: d.commissionCut,
        Porsi_Beban_Gaji_Rp: d.salaryCut, Net_Wajib_Transfer_Rp: d.netTransfer, Status_Transfer: 'Sudah Transfer', PIC: d.pic
      }
    );
  } else if (type === 'MASTER_MENU_SYNC' && d.products) {
    writeSheetByHeaders(ss, 'MASTER_MENU',
      ['SKU', 'Nama_Menu', 'Kategori', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Satuan_Jual', 'Harga_Jual', 'HPP_Modal', 'Stok_Sistem', 'Favorit'],
      d.products.map(function(p) {
        return {
          SKU: p.sku, Nama_Menu: p.name, Kategori: p.category, Brand: p.brand,
          Kena_Komisi_Brand: p.includeCommissionShare === false ? 'Tidak' : 'Ya',
          Hitung_Porsi_Gaji: p.includeSalaryShare === false ? 'Tidak' : 'Ya',
          Satuan_Jual: p.unit || 'Porsi', Harga_Jual: p.price, HPP_Modal: p.cost,
          Stok_Sistem: p.stock, Favorit: p.fav ? 'Ya' : 'Tidak'
        };
      })
    );
  } else if (type === 'CATEGORIES_BRANDS_SYNC') {
    if (d.brandConfigs) props.setProperty('BRAND_CONFIGS_JSON', JSON.stringify(d.brandConfigs));
    if (d.deletedBrands) props.setProperty('DELETED_BRANDS_JSON', JSON.stringify(d.deletedBrands));
    if (d.categories) {
      writeSheetByHeaders(ss, 'MASTER_KATEGORI', ['Urutan', 'Nama_Kategori'],
        d.categories.map(function(c, i) { return { Urutan: i + 1, Nama_Kategori: c }; })
      );
    }
  } else if (type === 'GUDANG_STOK_SYNC' && d.inventory) {
    writeSheetByHeaders(ss, 'GUDANG_STOK',
      ['Kode_Bahan', 'Nama_Bahan', 'Kategori', 'Stok_Sistem', 'Min_Stok', 'Satuan', 'Status_Stok'],
      d.inventory.map(function(i) {
        return {
          Kode_Bahan: i.sku, Nama_Bahan: i.name, Kategori: i.category,
          Stok_Sistem: i.stock, Min_Stok: i.minStock, Satuan: i.unit,
          Status_Stok: Number(i.stock) <= Number(i.minStock) ? 'Perlu Restock' : 'Aman'
        };
      })
    );
  } else if (type === 'MASTER_PEGAWAI_SYNC' && d.staff) {
    writeSheetByHeaders(ss, 'MASTER_PEGAWAI',
      ['ID_Staf', 'Nama_Pegawai', 'Jabatan', 'PIN_4_Digit', 'Upah_Harian', 'Status'],
      d.staff.map(function(s) {
        return { ID_Staf: s.id, Nama_Pegawai: s.name, Jabatan: s.role, PIN_4_Digit: s.pin, Upah_Harian: s.dailyWage, Status: s.active ? 'Aktif' : 'Nonaktif' };
      })
    );
  } else if (type === 'MASTER_PROMO_SYNC' && d.promos) {
    writeSheetByHeaders(ss, 'MASTER_PROMO',
      ['Kode_Promo', 'Judul_Promo', 'Jenis_Potongan', 'Nilai_Potongan', 'Min_Belanja', 'Berlaku_Sampai', 'Status'],
      d.promos.map(function(p) {
        return { Kode_Promo: p.code, Judul_Promo: p.title, Jenis_Potongan: p.type, Nilai_Potongan: p.value, Min_Belanja: p.minPurchase || 0, Berlaku_Sampai: p.validUntil || '', Status: p.active ? 'Aktif' : 'Nonaktif' };
      })
    );
  } else if (type === 'CRM_PELANGGAN_SYNC' && d.customers) {
    writeSheetByHeaders(ss, 'CRM_PELANGGAN',
      ['ID_Pelanggan', 'Nama_Pelanggan', 'No_WA', 'Tier_Member', 'Poin', 'Voucher_Khusus', 'Potongan_Voucher'],
      d.customers.map(function(c) {
        return { ID_Pelanggan: c.id, Nama_Pelanggan: c.name, No_WA: c.phone || '', Tier_Member: c.tier || 'Regular', Poin: c.points || 0, Voucher_Khusus: c.voucher || '', Potongan_Voucher: c.voucherDiscount || 0 };
      })
    );
  } else if (type === 'OPEN_ORDERS_SYNC' && d.openOrders !== undefined) {
    writeSheetByHeaders(ss, 'OPEN_ORDERS',
      ['ID_Order', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Total_Tagihan', 'JSON_Items'],
      d.openOrders.map(function(o) {
        return { ID_Order: o.id, Tanggal: o.date, Jam: o.time, Tipe_Order: o.orderType, Meja_Pelanggan: o.tableOrCustomer || '', No_WA: o.customerPhone || '', Kasir: o.cashier, Total_Tagihan: o.total, JSON_Items: JSON.stringify(o.items || []) };
      })
    );
  }
  return ContentService.createTextOutput(JSON.stringify({ status: 'ok', eventType: type })).setMimeType(ContentService.MimeType.JSON);
}`;

    function bootstrapApp() {
      renderLoginStaffDropdown();
      try {
        const rawSess = sessionStorage.getItem(SESSION_KEY);
        if (rawSess) {
          const sess = JSON.parse(rawSess);
          const staff = db.staff.find(s => s.id === sess.staffId && s.active);
          if (staff) {
            currentUser = staff;
            workspaceMode = sess.workspaceMode || ((staff.role === 'Owner' || staff.role === 'Manager') ? 'OWNER' : 'KASIR');
            enterWorkspace();
            return;
          }
        }
      } catch (e) {}
      startCloudAutoPullLoop();
      if (db.settings.webhookUrl && navigator.onLine) pullFromCloudMaster(false);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }
