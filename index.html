    function filterByPeriod(dateStr, period) {
      const cleanDate = normalizeCloudDate(dateStr);
      const today = todayISO();
      if (period === 'all') return true;
      if (period === 'today') return cleanDate === today;
      const d = new Date(cleanDate + 'T00:00:00');
      const now = new Date(today + 'T00:00:00');
      const diffDays = (now - d) / (1000 * 60 * 60 * 24);
      if (period === '7d') return diffDays >= 0 && diffDays <= 7;
      if (period === '30d') return diffDays >= 0 && diffDays <= 30;
      return true;
    }

    function confirmVoidPaidTransaction(trxId) {
      const reason = document.getElementById('paidVoidReason').value.trim() || 'Pembatalan nota lunas';
      const pin = document.getElementById('paidVoidPin').value.trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && String(s.pin) === pin);
      if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);

      const trx = db.transactions.find(t => t.id === trxId);
      if (!trx) return;
      trx.status = 'CANCELLED';
      trx.voidReason = reason;
      trx.voidBy = approver.name;

      (trx.items || []).forEach(item => {
        const prod = db.products.find(p => p.id === item.id || p.sku === item.sku);
        if (prod) prod.stock += item.qty;
      });

      const auditEntry = {
        id: 'AUD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderId: trx.id,
        itemName: `VOID NOTA (${formatRp(trx.total)})`,
        cashier: currentUser.name,
        authorizedBy: approver.name,
        reason
      };
      db.auditLogs.unshift(auditEntry);

      saveDB();
      syncMasterEvent('PAID_TRX_CANCELLED', { id: trx.id, reason, voidBy: approver.name });
      syncMasterEvent('AUDIT_VOID_ITEM', auditEntry);
      autoSyncMasterSlices(['products']);
      closeModal();
      renderWorkspace();
      showToast(`Transaksi ${trx.id} dibatalkan (Otorisasi: ${approver.name})`);
    }

    function shareClosingToWhatsApp(totalSales, cashSales, qrisSales, tfSales, onlineSales, expectedCash) {
      const actualCash = Number(document.getElementById('closingActualCash').value) || 0;
      const diff = actualCash - expectedCash;
      const msg =
        `*LAPORAN TUTUP KASIR — ${db.settings.outletName.toUpperCase()}*\n` +
        `Tanggal : ${todayISO()} (${nowTimeStr()})\n` +
        `Kasir   : ${currentUser.name}\n` +
        `--------------------------------\n` +
        `Total Omzet : *${formatRp(totalSales)}*\n` +
        `• Cash      : ${formatRp(cashSales)}\n` +
        `• QRIS      : ${formatRp(qrisSales)}\n` +
        `• Transfer  : ${formatRp(tfSales)}\n` +
        `• Online    : ${formatRp(onlineSales)}\n` +
        `--------------------------------\n` +
        `Ekspektasi Laci : ${formatRp(expectedCash)}\n` +
        `Uang Fisik Laci : ${formatRp(actualCash)}\n` +
        `Selisih         : ${formatRp(diff)}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function submitClosingShift(totalSales, cashSales, qrisSales, tfSales, onlineSales, expectedCash) {
      const pin = document.getElementById('closingPinInput').value.trim();
      if (pin !== String(currentUser.pin)) return showToast('PIN Kasir salah!', true);
      const actualCash = Number(document.getElementById('closingActualCash').value) || 0;
      const diff = actualCash - expectedCash;

      const closingData = {
        id: 'CLS-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        cashier: currentUser.name,
        openingCash: db.shift.openingCash || 0,
        cashSales,
        qrisSales,
        transferSales: tfSales,
        onlineSales,
        totalSales,
        expectedCash,
        actualCash,
        diff
      };

      db.closingHistory.unshift(closingData);
      db.shift = { isOpen: false, openedBy: '', openedAt: '', openingCash: 0 };
      saveDB();
      syncMasterEvent('SHIFT_CLOSED', closingData);
      showToast('Shift kasir berhasil ditutup!');
      forceSwitchUser();
    }

    function getSettlementDateRange() {
      const now = new Date();
      const day = now.getDay();
      const diffToMon = (day === 0 ? -6 : 1 - day);
      const monThis = new Date(now);
      monThis.setDate(now.getDate() + diffToMon);
      const sunThis = new Date(monThis);
      sunThis.setDate(monThis.getDate() + 6);

      const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

      if (settlementPeriodMode === 'this_week') {
        return { start: fmt(monThis), end: fmt(sunThis), label: 'Minggu Ini (Sen–Min)' };
      }
      if (settlementPeriodMode === 'last_week') {
        const monLast = new Date(monThis);
        monLast.setDate(monThis.getDate() - 7);
        const sunLast = new Date(monLast);
        sunLast.setDate(monLast.getDate() + 6);
        return { start: fmt(monLast), end: fmt(sunLast), label: 'Minggu Lalu (Sen–Min)' };
      }
      return { start: settlementCustomStart, end: settlementCustomEnd, label: `${settlementCustomStart} s/d ${settlementCustomEnd}` };
    }

    function renderSettlementSubtab(box) {
      const { start, end, label } = getSettlementDateRange();
      const periodTrx = db.transactions.filter(t => {
        const d = normalizeCloudDate(t.date);
        return t.status === 'PAID' && d >= start && d <= end;
      });

      const autoWageTotal = db.attendance
        .filter(a => {
          const d = normalizeCloudDate(a.date);
          return d >= start && d <= end;
        })
        .reduce((s, a) => s + (a.wageEarned || 0), 0);

      const totalPeriodSalary = (db.manualPeriodSalary !== null && db.manualPeriodSalary !== undefined)
        ? Number(db.manualPeriodSalary)
        : autoWageTotal;

      const activeBrands = getActiveBrands();
      let totalSalaryBasisQty = 0;
      const brandStats = {};
      activeBrands.forEach(b => {
        brandStats[b] = { totalQty: 0, commQty: 0, commGross: 0, salQty: 0, grossSales: 0 };
      });

      periodTrx.forEach(trx => {
        const ratio = trx.subtotal > 0 ? (trx.total / trx.subtotal) : 1;
        (trx.items || []).forEach(it => {
          const bName = it.brand || 'Kopi Jiwara';
          if (!brandStats[bName]) {
            brandStats[bName] = { totalQty: 0, commQty: 0, commGross: 0, salQty: 0, grossSales: 0 };
          }
          const lineNet = Math.round((it.price * it.qty) * ratio);
          brandStats[bName].totalQty += it.qty;
          brandStats[bName].grossSales += lineNet;
          if (it.includeCommissionShare !== false) {
            brandStats[bName].commQty += it.qty;
            brandStats[bName].commGross += lineNet;
          }
          if (it.includeSalaryShare !== false) {
            brandStats[bName].salQty += it.qty;
            totalSalaryBasisQty += it.qty;
          }
        });
      });

      let sumAllGross = 0;
      let sumAllComm = 0;
      let sumAllSalaryCut = 0;
      let sumAllNet = 0;

      const rowsHtml = Object.keys(brandStats).map(b => {
        const st = brandStats[b];
        const cfg = db.brandConfig[b] || { commissionPct: 10, waNumber: '' };
        const commPct = Number(cfg.commissionPct) || 0;
        const commCut = Math.round(st.commGross * commPct / 100);
        const salCut = (totalSalaryBasisQty > 0 && totalPeriodSalary > 0)
          ? Math.round(totalPeriodSalary * (st.salQty / totalSalaryBasisQty))
          : 0;
        const netTransfer = Math.max(0, st.grossSales - commCut - salCut);

        sumAllGross += st.grossSales;
        sumAllComm += commCut;
        sumAllSalaryCut += salCut;
        sumAllNet += netTransfer;

        const isMainBrand = b.toLowerCase() === 'kopi jiwara';
        return `
          <tr>
            <td>
              <strong>${esc(b)}</strong>
              ${!isMainBrand ? `<div style="margin-top:4px;"><button type="button" class="btn btn-danger btn-sm" style="padding:3px 7px;font-size:10px;" onclick="removeInactiveBrand('${esc(b)}')">Hapus Brand</button></div>` : ''}

              <div style="font-size:10px;color:var(--text-muted);">Kena komisi: ${st.commQty} (${formatRp(st.commGross)})</div>
              <div style="font-size:10px;color:var(--text-muted);">Hitung gaji: ${st.salQty} (${totalSalaryBasisQty > 0 ? Math.round((st.salQty / totalSalaryBasisQty) * 100) : 0}%)</div>
            </td>
            <td><strong>${formatRp(st.grossSales)}</strong></td>
            <td>
              <div style="display:flex;align-items:center;gap:4px;">
                <input type="number" class="styled-input" style="width:62px;padding:6px 8px;" value="${commPct}" min="0" max="100" onchange="updateBrandConfigField('${esc(b)}', 'commissionPct', Number(this.value)||0)" />
                <span>%</span>
              </div>
              <div style="font-size:11px;color:#BE185D;margin-top:2px;">-${formatRp(commCut)}</div>
            </td>
            <td style="color:#BE185D;font-weight:800;">-${formatRp(salCut)}</td>
            <td><strong style="font-size:14px;color:var(--green-deep);">${formatRp(netTransfer)}</strong></td>
            <td>
              <input type="tel" class="styled-input" style="padding:6px 8px;margin-bottom:5px;min-width:130px;" placeholder="No. WA Brand Owner..." value="${esc(cfg.waNumber || '')}" onchange="updateBrandConfigField('${esc(b)}', 'waNumber', this.value)" />
              <div style="display:flex;gap:4px;">
                <button class="btn btn-dark btn-sm" onclick="recordBrandSettlement('${esc(b)}', '${esc(label)}', ${st.grossSales}, ${commPct}, ${commCut}, ${salCut}, ${netTransfer})" ${netTransfer <= 0 ? 'disabled' : ''}>Catat Transfer</button>
                <button class="btn btn-pink btn-sm" onclick="sendBrandSettlementWA('${esc(b)}', '${esc(label)}', ${st.totalQty}, ${st.grossSales}, ${commPct}, ${commCut}, ${salCut}, ${netTransfer})" ${netTransfer <= 0 ? 'disabled' : ''}>Kirim WA</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      box.innerHTML = `
        <div class="bento-card" style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <div>
              <h3 style="margin:0;font-size:16px;">Kalkulator Settlement & Bagi Hasil Brand Owner</h3>
              <div style="font-size:12px;color:var(--text-muted);">Otomatis menghitung Omzet Brand, Potongan Komisi (%), dan Proporsi Beban Gaji Karyawan.</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              <button class="btn btn-yellow btn-sm" onclick="promptAddNewBrand()">+ Tambah Brand</button>
              <select class="styled-select" style="width:auto;" onchange="settlementPeriodMode=this.value;renderWorkspace()">
                <option value="this_week" ${settlementPeriodMode === 'this_week' ? 'selected' : ''}>Minggu Ini (Sen–Min)</option>
                <option value="last_week" ${settlementPeriodMode === 'last_week' ? 'selected' : ''}>Minggu Lalu (Sen–Min)</option>
                <option value="custom" ${settlementPeriodMode === 'custom' ? 'selected' : ''}>Pilih Tanggal</option>
              </select>
              ${settlementPeriodMode === 'custom' ? `
                <input type="date" class="styled-input" style="width:auto;" value="${settlementCustomStart}" onchange="settlementCustomStart=this.value;renderWorkspace()" />
                <input type="date" class="styled-input" style="width:auto;" value="${settlementCustomEnd}" onchange="settlementCustomEnd=this.value;renderWorkspace()" />
              ` : ''}
            </div>

          <div class="bento-grid-4" style="margin-bottom:14px;">
            <div class="kpi-tile dark">
              <div class="kpi-label">Total Omzet Semua Brand</div>
              <div class="kpi-value">${formatRp(sumAllGross)}</div>
              <div class="kpi-sub">Periode: ${esc(label)}</div>
            </div>
            <div class="kpi-tile yellow">
              <div class="kpi-label">Total Potongan Komisi Outlet</div>
              <div class="kpi-value">${formatRp(sumAllComm)}</div>
              <div class="kpi-sub">Pendapatan manajemen Dapur Jiwara</div>
            </div>
            <div class="kpi-tile pink">
              <div class="kpi-label">Total Beban Gaji (Manual / Casual)</div>

    function recordBrandSettlement(brand, periodLabel, grossSales, commissionPct, commissionCut, salaryCut, netTransfer) {
      const rec = {
        id: 'STL-' + Date.now().toString().slice(-6),
        date: todayISO(),
        periodLabel,
        brand,
        grossSales,
        commissionPct,
        commissionCut,
        salaryCut,
        netTransfer,
        pic: currentUser.name
      };
      db.brandSettlements.unshift(rec);

      const cfEntry = {
        id: 'CF-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OUT',
        category: 'Transfer Setoran Brand',
        amount: netTransfer,
        note: `Transfer Sales ${brand} (${periodLabel})`,
        pic: currentUser.name
      };
      db.cashflow.unshift(cfEntry);

      saveDB();
      syncMasterEvent('BRAND_SETTLEMENT_PAID', rec);
      syncMasterEvent('CASHFLOW_ADDED', cfEntry);
      renderWorkspace();
      showToast(`Transfer settlement ${brand} (${formatRp(netTransfer)}) dicatat!`);
    }

    function sendBrandSettlementWA(brand, periodLabel, qty, grossSales, commissionPct, commissionCut, salaryCut, netTransfer) {
      const cfg = db.brandConfig[brand] || {};
      let digits = String(cfg.waNumber || '').replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '62' + digits.slice(1);
      else if (digits.startsWith('8')) digits = '62' + digits;

      const msg =
        `*BERITA ACARA SETTLEMENT — ${db.settings.outletName.toUpperCase()}*\n` +
        `Brand   : *${brand}*\n` +
        `Periode : ${periodLabel}\n` +
        `--------------------------------\n` +
        `Item Terjual   : ${qty} porsi\n` +
        `Omzet Kotor    : ${formatRp(grossSales)}\n` +
        `Pot. Komisi (${commissionPct}%) : -${formatRp(commissionCut)}\n` +
        `Porsi Beban Gaji  : -${formatRp(salaryCut)}\n` +
        `--------------------------------\n` +
        `*NET TRANSFER  : ${formatRp(netTransfer)}*\n\n` +
        `Terima kasih atas kerja samanya!`;

      const url = digits ? `https://wa.me/${digits}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    function openAdjustStockModal(invId) {
      const item = db.inventory.find(i => i.id === invId);

      openModal(`

      `);

    function confirmAdjustStock(invId) {
      const item = db.inventory.find(i => i.id === invId);
      if (!item) return;
      const type = document.getElementById('adjStockType').value;
      const qty = Number(document.getElementById('adjStockQty').value) || 0;
      if (type.includes('(+)')) item.stock += qty;
      else if (type.includes('(-)')) item.stock = Math.max(0, item.stock - qty);
      else item.stock = qty;
      item.lastOpname = todayISO();

      const logEntry = {
        id: 'LOG-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        itemName: item.name,
        type,
        qty,
        afterStock: item.stock,
        pic: currentUser.name
      };
      db.stockLogs.unshift(logEntry);
      saveDB();
      syncMasterEvent('INVENTORY_UPDATED', logEntry);
      autoSyncMasterSlices(['inventory']);
      closeModal();
      renderWorkspace();
      showToast('Stok berhasil diperbarui!');

    function copyAutoSyncDeviceLink() {
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      if (!url) return showToast('Simpan URL Google Apps Script terlebih dahulu!', true);
      const baseUrl = window.location.href.split('#')[0].split('?')[0];
      const shareUrl = `${baseUrl}?sync=${encodeURIComponent(url)}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast('Link Auto-Sync disalin! Buka link ini di HP/Tablet kasir agar otomatis terhubung.');
        }).catch(() => {
          window.prompt('Salin link Auto-Sync ini untuk dibuka di HP/Tablet:', shareUrl);
        });
      } else {
        window.prompt('Salin link Auto-Sync ini untuk dibuka di HP/Tablet:', shareUrl);
      }
    }

          acceptAllDevices: true,

    function moveCategoryStep(catName, delta) {
      const list = normalizeUniqueCategories(db.categories);
      const idx = list.indexOf(catName);
      if (idx <= 0) return;
      const targetIdx = idx + delta;
      if (targetIdx < 1 || targetIdx >= list.length) return;
      const temp = list[idx];
      list[idx] = list[targetIdx];
      list[targetIdx] = temp;
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['categories']);
      renderWorkspace();
      showToast('Urutan kategori diperbarui!');
    }

    function moveCategoryToPosition(catName, newZeroIdx) {
      const list = normalizeUniqueCategories(db.categories);
      const oldIdx = list.indexOf(catName);
      if (oldIdx <= 0) return;
      const clamped = Math.max(1, Math.min(list.length - 1, newZeroIdx));
      list.splice(oldIdx, 1);
      list.splice(clamped, 0, catName);
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['categories']);
      renderWorkspace();
      showToast(`Posisi "${catName}" dipindah ke urutan #${clamped + 1}`);
    }

    function promptAddCategory() {

      `);

    function confirmAddCategory() {
      const name = document.getElementById('newCatNameInput').value.trim();
      if (!name) return showToast('Nama kategori wajib diisi!', true);
      const existing = normalizeUniqueCategories(db.categories);
      if (existing.some(c => c.toLowerCase() === name.toLowerCase())) {
        return showToast('Kategori tersebut sudah ada!', true);
      }
      db.categories = [...existing, name];
      saveDB();
      autoSyncMasterSlices(['categories']);
      closeModal();
      renderWorkspace();
      showToast('Kategori baru ditambahkan!');
    }

    function promptRenameCategory(oldName) {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:16px;">Ubah Nama Kategori</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori Baru</label><input id="renameCatInput" type="text" class="styled-input" value="${esc(oldName)}" /></div>
        <button class="btn btn-dark" style="width:100%;" onclick="confirmRenameCategory('${esc(oldName)}')">Simpan Perubahan</button>
      `);
    }

    function confirmRenameCategory(oldName) {
      const newName = document.getElementById('renameCatInput').value.trim();
      if (!newName) return showToast('Nama kategori tidak boleh kosong!', true);
      db.categories = normalizeUniqueCategories(db.categories.map(c => c === oldName ? newName : c));
      db.products.forEach(p => { if (p.category === oldName) p.category = newName; });
      saveDB();
      autoSyncMasterSlices(['categories', 'products']);
      closeModal();
      renderWorkspace();
      showToast('Kategori diperbarui!');
    }

    function deleteCategory(catName) {
      db.categories = normalizeUniqueCategories(db.categories.filter(c => c !== catName));
      const fallback = db.categories[1] || 'Kopi Jiwara';
      db.products.forEach(p => { if (p.category === catName) p.category = fallback; });
      saveDB();
      autoSyncMasterSlices(['categories', 'products']);
      renderWorkspace();
      showToast(`Kategori "${catName}" dihapus.`);

    function saveNewPromo() {
      const code = document.getElementById('prmCodeIn').value.trim().toUpperCase();
      const name = document.getElementById('prmNameIn').value.trim();
      const type = document.getElementById('prmTypeIn').value;
      const value = Number(document.getElementById('prmValIn').value) || 0;
      const minOrder = Number(document.getElementById('prmMinIn').value) || 0;
      const validUntil = document.getElementById('prmExpIn').value || '2026-12-31';
      if (!code || !name || value <= 0) return showToast('Lengkapi data promo!', true);

      db.promos.push({ id: 'PRM-' + Date.now().toString().slice(-4), code, name, type, value, minOrder, validUntil, active: true });
      saveDB();
      autoSyncMasterSlices(['promos']);
      closeModal();
      renderWorkspace();
      showToast('Promo baru ditambahkan!');
    }

    function deletePromo(prmId) {
      db.promos = db.promos.filter(p => p.id !== prmId);
      saveDB();
      autoSyncMasterSlices(['promos']);
      renderWorkspace();
      showToast('Promo dihapus.');
    }

function doGet(e) {
  setupMasterJiwaraSheets();
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var metaProps = PropertiesService.getScriptProperties();

  function readRows(sheetName) {
    var sh = ss.getSheetByName(sheetName);
    if (!sh || sh.getLastRow() < 2) return [];
    return sh.getRange(2, 1, sh.getLastRow() - 1, sh.getLastColumn()).getValues();
  }

  var products = readRows('MASTER_MENU').map(function(r) {
    return {
      sku: r[0], name: r[1], category: r[2], brand: r[3],
      price: Number(r[4]) || 0, cost: Number(r[5]) || 0, stock: Number(r[6]) || 0,
      isFavorite: String(r[7]).toLowerCase() === 'ya',
      active: String(r[8]).toLowerCase() !== 'nonaktif',
      includeCommissionShare: String(r[9]).toLowerCase() !== 'tidak',
      includeSalaryShare: String(r[10]).toLowerCase() !== 'tidak'
    };
  });

  var categories = readRows('MASTER_KATEGORI').map(function(r) { return String(r[1] || '').trim(); }).filter(Boolean);
  var brandsJson = metaProps.getProperty('BRANDS_LIST_JSON');
  var brandConfigJson = metaProps.getProperty('BRAND_CONFIG_JSON');
  var outletProfileJson = metaProps.getProperty('OUTLET_PROFILE_JSON');

  var inventory = readRows('GUDANG_STOK').map(function(r) {
    return { code: r[0], name: r[1], category: r[2], stock: Number(r[3]) || 0, minStock: Number(r[4]) || 0, unit: r[5], lastOpname: String(r[6] || '') };
  });

  var staff = readRows('MASTER_PEGAWAI').map(function(r) {
    return { id: r[0], name: r[1], role: r[2], pin: String(r[3] || '1111'), dailyWage: Number(r[4]) || 0, active: String(r[5]).toLowerCase() !== 'nonaktif' };
  });

  var promos = readRows('MASTER_PROMO').map(function(r) {
    return { code: r[0], name: r[1], type: r[2], value: Number(r[3]) || 0, minOrder: Number(r[4]) || 0, validUntil: String(r[5] || ''), active: String(r[6]).toLowerCase() !== 'nonaktif' };
  });

  var customers = readRows('CRM_PELANGGAN').map(function(r) {
    return { id: r[0], name: r[1], phone: String(r[2] || ''), tier: r[3], visits: Number(r[4]) || 0, totalSpend: Number(r[5]) || 0, specialVoucher: r[6], voucherDiscount: Number(r[7]) || 0, voucherExpiry: String(r[8] || '') };
  });

  var openOrders = readRows('OPEN_ORDERS').map(function(r) {
    var items = [];
    try { items = JSON.parse(r[8] || '[]'); } catch (err) {}
    return { id: r[0], date: String(r[1] || ''), time: String(r[2] || ''), orderType: r[3], tableOrCustomer: r[4], customerPhone: String(r[5] || ''), cashier: r[6], total: Number(r[7]) || 0, items: items };
  });

  var transactions = readRows('POS_TRANSAKSI').slice(-200).map(function(r) {
    return {
      id: r[0], date: String(r[1] || ''), time: String(r[2] || ''), orderType: r[3],
      tableOrCustomer: r[4], cashier: r[5], subtotal: Number(r[7]) || 0,
      discount: Number(r[8]) || 0, promoCode: r[9] === '-' ? '' : r[9],
      total: Number(r[10]) || 0, paymentMethod: r[11], status: r[12] || 'PAID'
    };
  });

  var transactionItems = readRows('POS_ITEM_TERJUAL').slice(-600).map(function(r) {
    return {
      trxId: r[0], sku: r[3], name: r[4], brand: r[5],
      includeCommissionShare: String(r[6]).toLowerCase() !== 'tidak',
      includeSalaryShare: String(r[7]).toLowerCase() !== 'tidak',
      qty: Number(r[8]) || 1, price: Number(r[9]) || 0, totalHpp: Number(r[11]) || 0
    };
  });

  var cashflow = readRows('ARUS_KAS_CASHFLOW').slice(-150).map(function(r) {
    var isIn = String(r[3]).toUpperCase() === 'IN' || (Number(r[5]) || 0) > 0;
    return {
      id: r[0], date: String(r[1] || ''), time: String(r[2] || ''),

  var attendance = readRows('ABSENSI_KARYAWAN').slice(-100).map(function(r) {
    return { date: String(r[0] || ''), staffName: r[1], role: r[2], clockIn: String(r[3] || '-'), clockOut: String(r[4] || '-'), wageEarned: Number(r[5]) || 0, status: r[6] || 'Hadir' };

  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  setupMasterJiwaraSheets();
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var metaProps = PropertiesService.getScriptProperties();
  var body = JSON.parse(e.postData.contents);
  var type = body.eventType;
  var d = body.data || {};

  function getOrCreate(name) { return ss.getSheetByName(name); }

  if (type === 'OUTLET_PROFILE_UPDATED') {
    metaProps.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(d));
  } else if (type === 'POS_TRANSACTION_PAID') {
    var shPos = getOrCreate('POS_TRANSAKSI');
    var shItem = getOrCreate('POS_ITEM_TERJUAL');
    var alreadyExists = false;
    if (shPos.getLastRow() > 1) {
      var existingIds = shPos.getRange(2, 1, shPos.getLastRow() - 1, 1).getValues();
      for (var k = 0; k < existingIds.length; k++) {
        if (String(existingIds[k][0]) === String(d.id)) {
          alreadyExists = true;
          break;
        }
      }
    }
    if (!alreadyExists) {
      var items = d.items || [];
      var totalQty = items.reduce(function(s, i) { return s + (i.qty || 0); }, 0);
      shPos.appendRow([d.id, d.date, d.time, d.orderType, d.tableOrCustomer || '-', d.cashier, totalQty, d.subtotal, d.discount, d.promoCode || '-', d.total, d.paymentMethod, 'PAID']);
      items.forEach(function(it) {
        var sub = (it.price || 0) * (it.qty || 1);
        var hpp = (it.cost || 0) * (it.qty || 1);
        shItem.appendRow([
          d.id, d.date, d.time, it.sku || '-', it.name, it.brand || 'Kopi Jiwara',
          it.includeCommissionShare === false ? 'Tidak' : 'Ya',
          it.includeSalaryShare === false ? 'Tidak' : 'Ya',
          it.qty, it.price, sub, hpp, sub - hpp
        ]);
      });
    }
  } else if (type === 'PAID_TRX_CANCELLED') {
    var shPos2 = getOrCreate('POS_TRANSAKSI');
    if (shPos2.getLastRow() > 1) {
      var vals = shPos2.getRange(2, 1, shPos2.getLastRow() - 1, 13).getValues();
      for (var r = 0; r < vals.length; r++) {
        if (String(vals[r][0]) === String(d.id)) {
          shPos2.getRange(r + 2, 13).setValue('CANCELLED');
        }
      }
    }
  } else if (type === 'CASHFLOW_ADDED') {
    var shCf = getOrCreate('ARUS_KAS_CASHFLOW');
    shCf.appendRow([d.id, d.date, d.time, d.type, d.category, d.type === 'IN' ? d.amount : 0, d.type === 'OUT' ? d.amount : 0, d.note, d.pic]);
  } else if (type === 'ATTENDANCE_CLOCK') {
    var shAtt = getOrCreate('ABSENSI_KARYAWAN');
    shAtt.appendRow([d.date, d.staffName, d.role, d.clockIn, d.clockOut, d.wageEarned, d.status]);
  } else if (type === 'SHIFT_CLOSED') {
    var shCls = getOrCreate('CLOSING_SHIFT');
    shCls.appendRow([d.id, d.date, d.time, d.cashier, d.openingCash, d.cashSales, d.qrisSales, d.transferSales, d.onlineSales, d.totalSales, d.expectedCash, d.actualCash, d.diff]);
  } else if (type === 'AUDIT_VOID_ITEM') {
    var shAud = getOrCreate('AUDIT_OTORISASI');
    shAud.appendRow([d.id, d.date, d.time, d.orderId, d.itemName, d.cashier, d.authorizedBy, d.reason]);
  } else if (type === 'INVENTORY_UPDATED') {
    var shLog = getOrCreate('LOG_STOK_GUDANG');
    shLog.appendRow([d.id, d.date, d.time, d.itemName, d.type, d.qty, d.afterStock, d.pic]);
  } else if (type === 'BRAND_SETTLEMENT_PAID') {
    var shSet = getOrCreate('SETTLEMENT_BRAND');
    shSet.appendRow([d.id, d.date, d.periodLabel, d.brand, d.grossSales, d.commissionPct, d.commissionCut, d.salaryCut, d.netTransfer, d.pic]);
  } else if (type === 'SYNC_MASTER_SNAPSHOT') {
    if (d.brands) metaProps.setProperty('BRANDS_LIST_JSON', JSON.stringify(d.brands));
    if (d.brandConfig) metaProps.setProperty('BRAND_CONFIG_JSON', JSON.stringify(d.brandConfig));
    if (d.products) {
      var shM = getOrCreate('MASTER_MENU');
      if (shM.getLastRow() > 1) shM.getRange(2, 1, shM.getLastRow() - 1, 11).clearContent();
      if (d.products.length > 0) {
        var rowsM = d.products.map(function(p) {
          return [p.sku, p.name, p.category, p.brand, p.price, p.cost, p.stock, p.isFavorite ? 'Ya' : 'Tidak', p.active ? 'Aktif' : 'Nonaktif', p.includeCommissionShare === false ? 'Tidak' : 'Ya', p.includeSalaryShare === false ? 'Tidak' : 'Ya'];
        });
        shM.getRange(2, 1, rowsM.length, 11).setValues(rowsM);
      }
    }
    if (d.categories) {
      var shCat = getOrCreate('MASTER_KATEGORI');
      if (shCat.getLastRow() > 1) shCat.getRange(2, 1, shCat.getLastRow() - 1, 2).clearContent();
      if (d.categories.length > 0) {
        var rowsCat = d.categories.map(function(c, idx) { return [idx + 1, c]; });
        shCat.getRange(2, 1, rowsCat.length, 2).setValues(rowsCat);
      }
    }
    if (d.inventory) {
      var shI = getOrCreate('GUDANG_STOK');
      if (shI.getLastRow() > 1) shI.getRange(2, 1, shI.getLastRow() - 1, 7).clearContent();
      if (d.inventory.length > 0) {
        var rowsI = d.inventory.map(function(i) { return [i.code, i.name, i.category, i.stock, i.minStock, i.unit, i.lastOpname]; });
        shI.getRange(2, 1, rowsI.length, 7).setValues(rowsI);
      }
    }
    if (d.staff) {
      var shS = getOrCreate('MASTER_PEGAWAI');
      if (shS.getLastRow() > 1) shS.getRange(2, 1, shS.getLastRow() - 1, 6).clearContent();
      if (d.staff.length > 0) {
        var rowsS = d.staff.map(function(s) { return [s.id, s.name, s.role, s.pin, s.dailyWage, s.active ? 'Aktif' : 'Nonaktif']; });
        shS.getRange(2, 1, rowsS.length, 6).setValues(rowsS);
      }
    }
    if (d.promos) {
      var shP = getOrCreate('MASTER_PROMO');
      if (shP.getLastRow() > 1) shP.getRange(2, 1, shP.getLastRow() - 1, 7).clearContent();
      if (d.promos.length > 0) {
        var rowsP = d.promos.map(function(p) { return [p.code, p.name, p.type, p.value, p.minOrder, p.validUntil, p.active ? 'Aktif' : 'Nonaktif']; });
        shP.getRange(2, 1, rowsP.length, 7).setValues(rowsP);
      }
    }
    if (d.customers) {
      var shC = getOrCreate('CRM_PELANGGAN');
      if (shC.getLastRow() > 1) shC.getRange(2, 1, shC.getLastRow() - 1, 9).clearContent();
      if (d.customers.length > 0) {
        var rowsC = d.customers.map(function(c) { return [c.id, c.name, c.phone, c.tier, c.visits, c.totalSpend, c.specialVoucher, c.voucherDiscount, c.voucherExpiry]; });
        shC.getRange(2, 1, rowsC.length, 9).setValues(rowsC);
      }
    }
    if (d.openOrders !== undefined) {
      var shO = getOrCreate('OPEN_ORDERS');
      if (shO.getLastRow() > 1) shO.getRange(2, 1, shO.getLastRow() - 1, 9).clearContent();
      if (d.openOrders.length > 0) {
        var rowsO = d.openOrders.map(function(o) { return [o.id, o.date, o.time, o.orderType, o.tableOrCustomer, o.customerPhone || '', o.cashier, o.total, JSON.stringify(o.items || [])]; });
        shO.getRange(2, 1, rowsO.length, 9).setValues(rowsO);
      }
    }
  }

  return ContentService.createTextOutput(JSON.stringify({ status: 'ok', eventType: type })).setMimeType(ContentService.MimeType.JSON);
}`;
