    function addToCart(prodId) {
      if (!db.shift.isOpen) {
        showToast('Buka Shift Kasir terlebih dahulu sebelum input pesanan.', true);
        return;
      }
      const p = db.products.find(x => x.id === prodId);
      if (!p) return;
      const existing = cart.find(c => c.id === prodId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: p.id,
          sku: p.sku,
          name: p.name,
          brand: getProductBrand(p),
          includeCommissionShare: p.includeCommissionShare !== false,
          includeSalaryShare: p.includeSalaryShare !== false,
          price: p.price,
          cost: p.cost || 0,
          qty: 1
        });
      }
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function changeCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;

      if (activeOpenOrderId && delta < 0) {
        const openOrder = db.transactions.find(t => t.id === activeOpenOrderId);
        const origItem = openOrder ? openOrder.items.find(i => i.id === prodId) : null;
        if (origItem && cart[idx].qty <= origItem.qty) {
          requestOwnerAuthForOrderAction('REDUCE_ITEM', activeOpenOrderId, prodId);
          return;
        }
      }

      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function resetCurrentCart() {
      if (activeOpenOrderId) {
        requestOwnerAuthForOrderAction('CANCEL_ORDER', activeOpenOrderId);
        return;
      }
      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      customerPhoneInput = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      onlineDiscountNominal = 0;
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function loadOpenOrderToCart(orderId) {
      const o = db.transactions.find(t => t.id === orderId && t.status === 'OPEN');
      if (!o) return;
      activeOpenOrderId = o.id;
      cart = o.items.map(i => ({ ...i }));
      orderType = o.orderType || 'Meja';
      tableOrCustomerNote = o.tableOrCustomer || '';
      customerPhoneInput = o.customerPhone || '';
      selectedCustomerId = o.customerId || '';
      selectedPromoCode = o.promoCode || '';
      manualDiscountNominal = o.manualDiscount || 0;
      onlineDiscountNominal = o.onlineDiscount || 0;
      if (!selectedPromoCode) {
        if (onlineDiscountNominal > 0) selectedPromoCode = '__ONLINE__';
        else if (manualDiscountNominal > 0) selectedPromoCode = '__MANUAL__';
      }
      renderPosTab(document.getElementById('mainContentArea'));
      showToast(`Open Order ${o.tableOrCustomer || o.id} dimuat ke keranjang.`);
    }

    function computeCurrentCartTotals() {
      const subtotal = cart.reduce((s, item) => s + item.price * item.qty, 0);
      let promoDiscount = 0;
      const activePromo = db.promos.find(pr => pr.code === selectedPromoCode && pr.active);
      if (activePromo && subtotal >= (activePromo.minPurchase || 0)) {
        promoDiscount = activePromo.type === 'PERCENT'
          ? Math.round(subtotal * (activePromo.value / 100))
          : activePromo.value;
      }
      const selectedCust = db.customers.find(c => c.id === selectedCustomerId);
      if (selectedCust && selectedPromoCode === '__CUST_VOUCHER__' && selectedCust.voucherDiscount > 0) {
        promoDiscount = selectedCust.voucherDiscount;
      }
      if (selectedPromoCode === '__MANUAL__') {
        promoDiscount = Math.max(0, Number(manualDiscountNominal) || 0);
      }
      const onlineDiscount = selectedPromoCode === '__ONLINE__' ? Math.max(0, Number(onlineDiscountNominal) || 0) : 0;
      const totalDiscount = Math.min(subtotal, promoDiscount + onlineDiscount);
      const total = Math.max(0, subtotal - totalDiscount);
      const totalCost = cart.reduce((s, item) => s + (item.cost || 0) * item.qty, 0);
      return { subtotal, promoDiscount, onlineDiscount, totalDiscount, total, totalCost };
    }

    function saveAsOpenOrder() {
      if (!db.shift.isOpen) {
        showToast('Buka Shift Kasir terlebih dahulu.', true);
        return;
      }
      if (cart.length === 0) return;
      const totals = computeCurrentCartTotals();
      const custRecord = upsertCustomerToCRM(tableOrCustomerNote, customerPhoneInput, 0, false);
      if (custRecord) {
        selectedCustomerId = custRecord.id;
        autoSyncMasterSlices(['customers']);
      }
      const finalPhone = customerPhoneInput.trim() || (custRecord ? custRecord.phone : '');

      if (activeOpenOrderId) {
        const idx = db.transactions.findIndex(t => t.id === activeOpenOrderId);
        if (idx !== -1) {
          db.transactions[idx] = {
            ...db.transactions[idx],
            orderType,
            tableOrCustomer: tableOrCustomerNote || db.transactions[idx].tableOrCustomer || 'Open Bill',
            customerId: selectedCustomerId,
            customerPhone: finalPhone,
            items: cart.map(i => ({ ...i })),
            subtotal: totals.subtotal,
            discount: totals.totalDiscount,
            promoCode: selectedPromoCode,
            manualDiscount: selectedPromoCode === '__MANUAL__' ? manualDiscountNominal : 0,
            onlineDiscount: selectedPromoCode === '__ONLINE__' ? onlineDiscountNominal : 0,
            total: totals.total,
            totalCost: totals.totalCost
          };
        }
      } else {
        db.transactions.unshift({
          id: 'ORD-' + Date.now().toString().slice(-6),
          status: 'OPEN',
          date: todayISO(),
          time: nowTimeStr(),
          orderType,
          tableOrCustomer: tableOrCustomerNote || 'Open Bill',
          customerId: selectedCustomerId,
          customerPhone: finalPhone,
          cashier: currentUser.name,
          items: cart.map(i => ({ ...i })),
          subtotal: totals.subtotal,
          discount: totals.totalDiscount,
          promoCode: selectedPromoCode,
          manualDiscount: selectedPromoCode === '__MANUAL__' ? manualDiscountNominal : 0,
          onlineDiscount: selectedPromoCode === '__ONLINE__' ? onlineDiscountNominal : 0,
          total: totals.total,
          totalCost: totals.totalCost,
          paymentMethod: ''
        });
      }
      saveDB();
      autoSyncMasterSlices(['openOrders']);
      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      customerPhoneInput = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      onlineDiscountNominal = 0;
      renderPosTab(document.getElementById('mainContentArea'));
      showToast('Open Order berhasil disimpan.');
    }

    // ==================== OWNER PIN AUTHORIZATION ====================
    function requestOwnerAuthForOrderAction(actionType, orderId, itemId = '') {
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:17px;">Otorisasi Owner / Manager</h3>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
          ${actionType === 'CANCEL_ORDER' ? 'Pembatalan Open Order memerlukan PIN Owner atau Manager.' : 'Pengurangan item yang sudah tersimpan pada Open Order memerlukan PIN Owner/Manager.'}
        </p>
        <div style="margin-bottom:10px;">
          <label class="field-label">Alasan Tindakan</label>
          <select id="authReasonSelect" class="styled-select">
            ${CANCEL_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}
          </select>
        </div>
        <div style="margin-bottom:14px;">
          <label class="field-label">PIN 4-Digit Owner / Manager</label>
          <input id="authPinInput" type="password" inputmode="numeric" maxlength="4" class="styled-input" placeholder="Masukkan PIN..." />
        </div>
        <button type="button" class="btn btn-pink" style="width:100%;padding:12px;" onclick="verifyOwnerPinForOrder('${actionType}', '${orderId}', '${itemId}')">Verifikasi & Lanjutkan</button>
      `);
    }

    function verifyOwnerPinForOrder(actionType, orderId, itemId) {
      const pinVal = (document.getElementById('authPinInput')?.value || '').trim();
      const reason = document.getElementById('authReasonSelect')?.value || CANCEL_REASONS[0];
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pinVal);
      if (!approver) {
        showToast('PIN Owner/Manager tidak valid.', true);
        return;
      }

      const orderIdx = db.transactions.findIndex(t => t.id === orderId);
      if (actionType === 'CANCEL_ORDER' && orderIdx !== -1) {
        const removed = db.transactions[orderIdx];
        db.transactions.splice(orderIdx, 1);
        db.auditLogs.unshift({
          id: 'AUD-' + Date.now().toString().slice(-6),
          date: todayISO(),
          time: nowTimeStr(),
          action: 'Batalkan Open Order',
          orderId,
          detail: `${removed.orderType} (${removed.tableOrCustomer}) • ${rp(removed.total)}`,
          reason,
          cashier: currentUser.name,
          approvedBy: approver.name
        });
        syncMasterEvent('AUDIT_AUTH', db.auditLogs[0]);
        autoSyncMasterSlices(['openOrders']);
        cart = [];
        activeOpenOrderId = null;
        tableOrCustomerNote = '';
        customerPhoneInput = '';
        selectedCustomerId = '';
        selectedPromoCode = '';
        manualDiscountNominal = 0;
        onlineDiscountNominal = 0;
        saveDB();
        closeModal();
        renderPosTab(document.getElementById('mainContentArea'));
        showToast(`Open Order dibatalkan (${reason}) atas otorisasi ${approver.name}.`);
      } else if (actionType === 'REDUCE_ITEM') {
        const cIdx = cart.findIndex(c => c.id === itemId);
        if (cIdx !== -1) {
          const itemName = cart[cIdx].name;
          cart[cIdx].qty -= 1;
          if (cart[cIdx].qty <= 0) cart.splice(cIdx, 1);
          db.auditLogs.unshift({
            id: 'AUD-' + Date.now().toString().slice(-6),
            date: todayISO(),
            time: nowTimeStr(),
            action: 'Kurangi Item Open Order',
            orderId,
            detail: `Kurangi 1x ${itemName}`,
            reason,
            cashier: currentUser.name,
            approvedBy: approver.name
          });
          syncMasterEvent('AUDIT_AUTH', db.auditLogs[0]);
          saveDB();
        }
        closeModal();
        renderPosTab(document.getElementById('mainContentArea'));
        showToast(`Pengurangan item disetujui oleh ${approver.name}.`);
      }
    }

    // ==================== ITEMIZED SPLIT BILL & PAYMENT MODAL ====================
    let payModalMode = 'FULL';
    let paySingleMethod = 'Cash';
    let payCashReceived = 0;
    let splitItemQtyMap = {};

    function openPaymentModal() {
      if (!db.shift.isOpen) {
        showToast('Buka Shift Kasir terlebih dahulu sebelum memproses pembayaran.', true);
        return;
      }
      if (cart.length === 0) return;
      const totals = computeCurrentCartTotals();
      payModalMode = 'FULL';
      paySingleMethod = 'Cash';
      payCashReceived = totals.total;
      splitItemQtyMap = {};
      cart.forEach(item => {
        splitItemQtyMap[item.id] = 0;
      });
      renderPaymentModalBody();
    }

    function changeSplitItemQty(prodId, delta) {
      const item = cart.find(c => c.id === prodId);
      if (!item) return;
      const cur = Number(splitItemQtyMap[prodId]) || 0;
      const next = Math.max(0, Math.min(item.qty, cur + delta));
      splitItemQtyMap[prodId] = next;
      const splitSubtotal = getSplitSelectedItems().reduce((s, i) => s + i.price * i.qty, 0);
      payCashReceived = splitSubtotal;
      renderPaymentModalBody();
    }

    function getSplitSelectedItems() {
      return cart
        .map(item => {
          const selQty = Math.min(item.qty, Math.max(0, Number(splitItemQtyMap[item.id]) || 0));
          return selQty > 0 ? { ...item, qty: selQty } : null;
        })
        .filter(Boolean);
    }

    function renderPaymentModalBody() {
      const fullTotals = computeCurrentCartTotals();
      const splitItems = getSplitSelectedItems();
      const splitSubtotal = splitItems.reduce((s, i) => s + i.price * i.qty, 0);
      const totalAllQty = cart.reduce((s, i) => s + i.qty, 0);
      const splitQtyCount = splitItems.reduce((s, i) => s + i.qty, 0);
      const remainingQty = totalAllQty - splitQtyCount;
      const remainingAmount = Math.max(0, fullTotals.subtotal - splitSubtotal);

      const payableAmount = payModalMode === 'FULL' ? fullTotals.total : splitSubtotal;
      const cashChange = Math.max(0, (Number(payCashReceived) || 0) - payableAmount);
      const displayedItems = payModalMode === 'FULL' ? cart : splitItems;

      openModal(`
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Checkout Pembayaran</div>
            <h3 style="margin:2px 0 0;font-size:20px;">${rp(payableAmount)}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
          <button type="button" class="btn ${payModalMode === 'FULL' ? 'btn-dark' : 'btn-soft'}" onclick="payModalMode='FULL';payCashReceived=${fullTotals.total};renderPaymentModalBody()">Bayar Penuh</button>
          <button type="button" class="btn ${payModalMode === 'SPLIT' ? 'btn-pink' : 'btn-soft'}" onclick="payModalMode='SPLIT';payCashReceived=${splitSubtotal};renderPaymentModalBody()">Split Bill (Pilih Produk)</button>
        </div>

        ${payModalMode === 'SPLIT' ? `
          <div style="background:#FDF2F8;border:1.5px solid var(--pink);border-radius:16px;padding:12px;margin-bottom:12px;">
            <div style="font-size:12px;font-weight:900;color:#9D174D;margin-bottom:3px;">Pilih Produk yang Dibayar Sekarang</div>
            <div style="font-size:11px;color:#831843;margin-bottom:8px;">Produk yang tidak dipilih otomatis tetap menjadi <strong>Open Order</strong>.</div>
            <div style="display:grid;gap:6px;max-height:175px;overflow-y:auto;">
              ${cart.map(item => {
                const selQty = Number(splitItemQtyMap[item.id]) || 0;
                return `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFFFFF;padding:8px 10px;border-radius:12px;border:1px solid ${selQty > 0 ? 'var(--pink)' : 'var(--border-glass)'};">
                    <div style="min-width:0;flex:1;">
                      <div style="font-size:12px;font-weight:800;">${esc(item.name)}</div>
                      <div style="font-size:11px;color:var(--text-muted);">${rp(item.price)} • Tersedia ${item.qty}x</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:5px;">
                      <button type="button" class="btn btn-soft btn-sm" style="padding:4px 9px;" onclick="changeSplitItemQty('${item.id}', -1)" ${selQty <= 0 ? 'disabled' : ''}>-</button>
                      <span style="font-size:12px;font-weight:900;min-width:34px;text-align:center;">${selQty}/${item.qty}</span>
                      <button type="button" class="btn btn-dark btn-sm" style="padding:4px 9px;" onclick="changeSplitItemQty('${item.id}', 1)" ${selQty >= item.qty ? 'disabled' : ''}>+</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(157,23,77,0.25);">
              <span>Dibayar: <strong>${splitQtyCount} item (${rp(splitSubtotal)})</strong></span>
              <span>Sisa Open Bill: <strong>${remainingQty} item (${rp(remainingAmount)})</strong></span>
            </div>
          </div>
        ` : ''}

        <!-- RINCIAN PRODUK YANG DIBAYAR -->
        <div style="background:#F8FAFC;border:1px solid var(--border-glass);border-radius:14px;padding:10px 12px;margin-bottom:12px;">
          <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;">
            Rincian Produk yang Dibayar (${displayedItems.reduce((s, i) => s + i.qty, 0)} Item)
          </div>
          ${displayedItems.length === 0
            ? `<div style="font-size:12px;color:#B91C1C;font-weight:700;">Pilih minimal 1 produk di atas untuk dibayar.</div>`
            : `<div style="max-height:110px;overflow-y:auto;">
                ${displayedItems.map(i => `
                  <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--border-glass);">
                    <span>${esc(i.name)} <strong>x${i.qty}</strong></span>
                    <strong>${rp(i.price * i.qty)}</strong>
                  </div>
                `).join('')}
              </div>`
          }
          ${payModalMode === 'FULL' && fullTotals.totalDiscount > 0 ? `
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#BE185D;margin-top:5px;">
              <span>Diskon / Potongan</span><strong>-${rp(fullTotals.totalDiscount)}</strong>
            </div>
          ` : ''}
        </div>

        <div style="margin-bottom:12px;">
          <label class="field-label">Metode Pembayaran</label>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
            ${PAYMENT_METHODS.map(m => `
              <button type="button" class="btn ${paySingleMethod === m ? 'btn-yellow' : 'btn-soft'}" onclick="paySingleMethod='${m}';renderPaymentModalBody()">${m}</button>
            `).join('')}
          </div>
        </div>

        ${paySingleMethod === 'Cash' ? `
          <div style="background:var(--green-soft);border-radius:14px;padding:12px;margin-bottom:14px;">
            <label class="field-label">Uang Tunai Diterima (Rp)</label>
            <input type="number" class="styled-input" value="${payCashReceived}" oninput="payCashReceived=Number(this.value)||0;document.getElementById('cashChangeDisplay').textContent=rp(Math.max(0, payCashReceived - ${payableAmount}))" />
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
              <button type="button" class="btn btn-soft btn-sm" onclick="payCashReceived=${payableAmount};renderPaymentModalBody()">Uang Pas</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="payCashReceived=50000;renderPaymentModalBody()">Rp 50.000</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="payCashReceived=100000;renderPaymentModalBody()">Rp 100.000</button>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px;font-weight:900;">
              <span>Kembalian</span>
              <span id="cashChangeDisplay" style="color:#065F46;">${rp(cashChange)}</span>
            </div>
          </div>
        ` : ''}

        <button type="button" class="btn btn-dark" style="width:100%;padding:13px;font-size:14px;" onclick="completeCheckoutPayment()" ${displayedItems.length === 0 ? 'disabled' : ''}>
          ${payModalMode === 'SPLIT' && remainingQty > 0 ? 'Bayar Produk Terpilih & Simpan Sisa Open Bill' : 'Selesaikan Pembayaran & Cetak Struk'}
        </button>
      `);
    }

    function completeCheckoutPayment() {
      const fullTotals = computeCurrentCartTotals();
      let paidItems = [];
      let paidSubtotal = 0;
      let paidDiscount = 0;
      let paidTotal = 0;
      let paidCost = 0;
      let remainingItems = [];

      if (payModalMode === 'SPLIT') {
        paidItems = getSplitSelectedItems();
        if (paidItems.length === 0) {
          showToast('Pilih minimal 1 produk untuk dibayar pada Split Bill.', true);
          return;
        }
        paidSubtotal = paidItems.reduce((s, i) => s + i.price * i.qty, 0);
        paidCost = paidItems.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);

        cart.forEach(item => {
          const selQty = Math.min(item.qty, Math.max(0, Number(splitItemQtyMap[item.id]) || 0));
          const remQty = item.qty - selQty;
          if (remQty > 0) {
            remainingItems.push({ ...item, qty: remQty });
          }
        });

        if (remainingItems.length === 0) {
          paidDiscount = fullTotals.totalDiscount;
          paidTotal = fullTotals.total;
        } else {
          paidDiscount = 0;
          paidTotal = paidSubtotal;
        }
      } else {
        paidItems = cart.map(i => ({ ...i }));
        paidSubtotal = fullTotals.subtotal;
        paidDiscount = fullTotals.totalDiscount;
        paidTotal = fullTotals.total;
        paidCost = fullTotals.totalCost;
      }

      if (paySingleMethod === 'Cash' && (Number(payCashReceived) || 0) < paidTotal) {
        showToast('Nominal uang tunai kurang dari total yang dibayar.', true);
        return;
      }

      const custRecord = upsertCustomerToCRM(tableOrCustomerNote, customerPhoneInput, paidTotal, true);
      if (custRecord) {
        selectedCustomerId = custRecord.id;
        if (selectedPromoCode === '__CUST_VOUCHER__') {
          custRecord.voucherCode = '';
          custRecord.voucherDiscount = 0;
        }
        autoSyncMasterSlices(['customers']);
      }

      const finalPhone = customerPhoneInput.trim() || (custRecord ? custRecord.phone : '');
      const paidTrxId = 'TRX-' + Date.now().toString().slice(-6);
      const promoLabelParts = [];
      if (selectedPromoCode === '__ONLINE__' && fullTotals.onlineDiscount > 0) promoLabelParts.push('Potongan Online');
      else if (selectedPromoCode === '__MANUAL__' && fullTotals.promoDiscount > 0) promoLabelParts.push('Potongan Manual');
      else if (selectedPromoCode && selectedPromoCode !== '__MANUAL__' && selectedPromoCode !== '__ONLINE__') promoLabelParts.push(selectedPromoCode);

      const trx = {
        id: paidTrxId,
        status: 'PAID',
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote || '',
        customerId: selectedCustomerId,
        customerPhone: finalPhone,
        cashier: currentUser.name,
        items: paidItems,
        subtotal: paidSubtotal,
        discount: paidDiscount,
        promoCode: paidDiscount > 0 ? promoLabelParts.join(' + ') : '',
        total: paidTotal,
        totalCost: paidCost,
        paymentMethod: paySingleMethod,
        cashReceived: paySingleMethod === 'Cash' ? Number(payCashReceived) : paidTotal,
        change: paySingleMethod === 'Cash' ? Math.max(0, Number(payCashReceived) - paidTotal) : 0
      };

      paidItems.forEach(item => {
        const prod = db.products.find(p => p.id === item.id);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
      });

      let remainingOpenOrder = null;
      if (remainingItems.length > 0) {
        const remSubtotal = remainingItems.reduce((s, i) => s + i.price * i.qty, 0);
        const remCost = remainingItems.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
        const remDiscount = Math.min(remSubtotal, fullTotals.totalDiscount);
        const remTotal = Math.max(0, remSubtotal - remDiscount);

        if (activeOpenOrderId) {
          const openIdx = db.transactions.findIndex(t => t.id === activeOpenOrderId && t.status === 'OPEN');
          if (openIdx !== -1) {
            db.transactions[openIdx] = {
              ...db.transactions[openIdx],
              orderType,
              tableOrCustomer: tableOrCustomerNote || db.transactions[openIdx].tableOrCustomer || 'Open Bill',
              customerId: selectedCustomerId,
              customerPhone: finalPhone,
              items: remainingItems,
              subtotal: remSubtotal,
              discount: remDiscount,
              promoCode: selectedPromoCode,
              manualDiscount: selectedPromoCode === '__MANUAL__' ? manualDiscountNominal : 0,
              onlineDiscount: selectedPromoCode === '__ONLINE__' ? onlineDiscountNominal : 0,
              total: remTotal,
              totalCost: remCost
            };
            remainingOpenOrder = db.transactions[openIdx];
          }
        }
        if (!remainingOpenOrder) {
          remainingOpenOrder = {
            id: 'ORD-' + (Date.now() + 1).toString().slice(-6),
            status: 'OPEN',
            date: todayISO(),
            time: nowTimeStr(),
            orderType,
            tableOrCustomer: tableOrCustomerNote || 'Sisa Split Bill',
            customerId: selectedCustomerId,
            customerPhone: finalPhone,
            cashier: currentUser.name,
            items: remainingItems,
            subtotal: remSubtotal,
            discount: remDiscount,
            promoCode: selectedPromoCode,
            manualDiscount: selectedPromoCode === '__MANUAL__' ? manualDiscountNominal : 0,
            onlineDiscount: selectedPromoCode === '__ONLINE__' ? onlineDiscountNominal : 0,
            total: remTotal,
            totalCost: remCost,
            paymentMethod: ''
          };
          db.transactions.unshift(remainingOpenOrder);
        }
      } else if (activeOpenOrderId) {
        db.transactions = db.transactions.filter(t => t.id !== activeOpenOrderId);
      }

      db.transactions.unshift(trx);
      saveDB();

      syncMasterEvent('SALE_COMPLETED', trx);
      autoSyncMasterSlices(['openOrders']);

      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      customerPhoneInput = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      onlineDiscountNominal = 0;

      if (db.settings.printerAutoPrint !== false) {
        printReceiptThermal(trx);
      }
      renderPosTab(document.getElementById('mainContentArea'));
      showPostPaymentReceiptModal(trx, remainingOpenOrder);
    }

    async function printReceiptThermal(trx) {
      if (!trx) return;
      const receiptLines = [
        '--------------------------------',
        `Nota : ${trx.id}`,
        `Tgl  : ${trx.date} ${trx.time}`,
        `Tipe : ${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''}`,
        `Kasir: ${trx.cashier}`,
        '--------------------------------',
        ...trx.items.map(i => `${i.name} (${i.qty}x)  ${rp(i.price * i.qty)}`),
        '--------------------------------',
        `Subtotal : ${rp(trx.subtotal)}`,
        ...(trx.discount > 0 ? [`Diskon   : -${rp(trx.discount)}`] : []),
        `TOTAL    : ${rp(trx.total)}`,
        `Bayar    : ${trx.paymentMethod}`,
        ...(trx.paymentMethod === 'Cash' ? [`Tunai    : ${rp(trx.cashReceived || trx.total)}`, `Kembali  : ${rp(trx.change || 0)}`] : []),
        '--------------------------------',
        db.settings.receiptFooter || 'Terima kasih!'
      ];

      if (btPrinterCharacteristic) {
        try {
          const bytes = buildEscPosBytesFromLines(receiptLines);
          await sendRawBytesToBluetooth(bytes);
          return;
        } catch (e) {
          showToast('Printer BLE terputus, beralih ke dialog cetak browser...', true);
        }
      }

      const area = document.getElementById('printArea');
      area.style.width = (db.settings.printerPaperSize === '80mm') ? '80mm' : '58mm';
      area.innerHTML = `
        <div style="text-align:center;font-weight:bold;">${esc(db.settings.outletName)}</div>
        <div style="text-align:center;font-size:10px;">${esc(db.settings.address)}</div>
        ${db.settings.phone ? `<div style="text-align:center;font-size:10px;">Telp/WA: ${esc(db.settings.phone)}</div>` : ''}
        ${db.settings.socialMedia ? `<div style="text-align:center;font-size:10px;">${esc(db.settings.socialMedia)}</div>` : ''}
        <hr/>
        <div>Nota: ${esc(trx.id)}</div>
        <div>Tgl : ${esc(trx.date)} ${esc(trx.time)}</div>
        <div>Tipe: ${esc(trx.orderType)} ${esc(trx.tableOrCustomer)}</div>
        <div>Kasir: ${esc(trx.cashier)}</div>
        <hr/>
        ${trx.items.map(i => `
          <div style="display:flex;justify-content:space-between;">
            <span>${esc(i.name)} x${i.qty}</span>
            <span>${rp(i.price * i.qty)}</span>
          </div>
        `).join('')}
        <hr/>
        <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>${rp(trx.subtotal)}</span></div>
        ${trx.discount > 0 ? `<div style="display:flex;justify-content:space-between;"><span>Diskon</span><span>-${rp(trx.discount)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between;font-weight:bold;"><span>TOTAL</span><span>${rp(trx.total)}</span></div>
        <div>Bayar: ${esc(trx.paymentMethod)}</div>
        ${trx.paymentMethod === 'Cash' ? `<div>Tunai: ${rp(trx.cashReceived || trx.total)} | Kembali: ${rp(trx.change || 0)}</div>` : ''}
        <hr/>
        <div style="text-align:center;font-size:10px;">${esc(db.settings.receiptFooter)}</div>
      `;
      area.classList.remove('hidden');
      setTimeout(() => {
        window.print();
        area.classList.add('hidden');
      }, 150);
    }

    // ==================== TAB: PENJUALAN (DETAIL POPUP & VOID PIN) ====================
    function openTransactionDetailModal(trxId) {
      const trx = db.transactions.find(t => t.id === trxId);
      if (!trx) {
        showToast('Transaksi tidak ditemukan.', true);
        return;
      }
      const isPaid = trx.status === 'PAID';
      const isCancelled = trx.status === 'CANCELLED';

      openModal(`
        <div class="modal-head">
          <div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="badge-pill ${isCancelled ? 'badge-pink' : isPaid ? 'badge-green' : 'badge-yellow'}">${isCancelled ? 'DIBATALKAN / VOID' : isPaid ? 'LUNAS' : 'OPEN BILL'}</span>
              <span style="font-size:11px;font-weight:800;color:var(--text-muted);">${esc(trx.date)} • ${esc(trx.time)}</span>
            </div>
            <h3 style="margin:5px 0 0;font-size:18px;">Detail Nota ${esc(trx.id)}</h3>
          </div>

      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:17px;color:#B91C1C;">Batalkan Pesanan Lunas (Void)</h3>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        <div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#991B1B;">
          Nota <strong>${esc(trx.id)}</strong> (${rp(trx.total)} • ${esc(trx.paymentMethod)}) akan dibatalkan, stok produk dikembalikan, dan tercatat di log audit.
        </div>
        <div style="margin-bottom:10px;">
          <label class="field-label">Alasan Pembatalan Pesanan</label>
          <select id="voidReasonSelect" class="styled-select">

          </select>
        </div>

          <label class="field-label">Otorisasi PIN 4-Digit Owner / Manager</label>
          <input id="voidPinInput" type="password" inputmode="numeric" maxlength="4" class="styled-input" placeholder="Masukkan PIN Owner atau Manager..." />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px;">

    function executeVoidPaidTransaction(trxId) {
      const pinVal = (document.getElementById('voidPinInput')?.value || '').trim();
      const reason = document.getElementById('voidReasonSelect')?.value || CANCEL_REASONS[0];
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pinVal);
      if (!approver) {
        showToast('PIN Owner atau Manager tidak valid!', true);
        return;
      }

      const trx = db.transactions.find(t => t.id === trxId && t.status === 'PAID');
      if (!trx) return;

      trx.items.forEach(item => {
        const prod = db.products.find(p => p.id === item.id);
        if (prod) prod.stock = (prod.stock || 0) + item.qty;
      });

      trx.status = 'CANCELLED';
      trx.cancelReason = reason;
      trx.cancelledBy = approver.name;
      trx.cancelledAt = `${todayISO()} ${nowTimeStr()}`;

      const auditEntry = {
        id: 'AUD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        action: 'Void Transaksi Lunas',
        orderId: trx.id,
        detail: `${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''} • ${rp(trx.total)} (${trx.paymentMethod})`,
        reason,
        cashier: currentUser.name,
        approvedBy: approver.name
      };
      db.auditLogs.unshift(auditEntry);

      saveDB();
      syncMasterEvent('AUDIT_AUTH', auditEntry);
      syncMasterEvent('PAID_TRX_CANCELLED', {
        id: trx.id,
        reason,
        approvedBy: approver.name,
        cancelledAt: trx.cancelledAt
      });

      closeModal();
      renderWorkspace();
      showToast(`Nota ${trx.id} dibatalkan (${reason}) atas otorisasi ${approver.name}.`);
    }

      const grossSales = paidTrx.reduce((s, t) => s + t.subtotal, 0);
      const totalDiscount = paidTrx.reduce((s, t) => s + (t.discount || 0), 0);
      const netSales = paidTrx.reduce((s, t) => s + t.total, 0);
      const totalHpp = paidTrx.reduce((s, t) => s + (t.totalCost || 0), 0);
      const grossProfit = netSales - totalHpp;
      const opExpenses = cashLogs
        .filter(c => c.type === 'OUT' && !/^setoran/i.test((c.note || '').trim()) && !/^transfer sales/i.test((c.note || '').trim()))
        .reduce((s, c) => s + c.amount, 0);

    // ==================== SETTLEMENT BRAND MINGGUAN ENGINE ====================
    function computeBrandSettlementSummary(bounds) {
      const paidTrx = db.transactions.filter(t => t.status === 'PAID' && isDateInBounds(t.date, bounds));
      const attLogs = db.attendance.filter(a => isDateInBounds(a.date, bounds));
      const cashLogs = db.cashDrawer.filter(c => isDateInBounds(c.date, bounds));

      const attPayroll = attLogs.reduce((s, a) => s + (Number(a.wage) || 0), 0);
      const manualSalaryCashOut = cashLogs
        .filter(c => c.type === 'OUT' && /gaji/i.test(c.note || ''))
        .reduce((s, c) => s + (Number(c.amount) || 0), 0);
      const totalWeeklyPayroll = attPayroll + manualSalaryCashOut;

      const brands = getAllAvailableBrands();
      const brandStats = {};
      brands.forEach(b => {
        const cfg = getBrandConfig(b);
        brandStats[b] = {
          brand: b,
          commissionPct: Number(cfg.commissionPct) ?? 10,
          ownerPhone: cfg.ownerPhone || '',
          totalQty: 0,
          commissionEligibleQty: 0,
          commissionEligibleGross: 0,
          salaryEligibleQty: 0,
          grossSales: 0,
          commissionFee: 0,
          salaryShare: 0,
          netTransfer: 0
        };
      });

      const prodMap = new Map(db.products.map(p => [p.id, p]));

      paidTrx.forEach(t => {
        const trxSub = t.subtotal > 0 ? t.subtotal : t.items.reduce((s, i) => s + i.price * i.qty, 0);
        const trxNetRatio = trxSub > 0 ? (t.total / trxSub) : 1;

        t.items.forEach(item => {
          const prodRef = prodMap.get(item.id);
          const brandName = item.brand || (prodRef ? getProductBrand(prodRef) : 'Kopi Jiwara');
          const incComm = item.includeCommissionShare !== undefined
            ? Boolean(item.includeCommissionShare)
            : (prodRef ? prodRef.includeCommissionShare !== false : true);
          const incSalary = item.includeSalaryShare !== undefined
            ? Boolean(item.includeSalaryShare)
            : (prodRef ? prodRef.includeSalaryShare !== false : true);

          if (!brandStats[brandName]) {
            const cfg = getBrandConfig(brandName);
            brandStats[brandName] = {
              brand: brandName,
              commissionPct: Number(cfg.commissionPct) ?? 10,
              ownerPhone: cfg.ownerPhone || '',
              totalQty: 0,
              commissionEligibleQty: 0,
              commissionEligibleGross: 0,
              salaryEligibleQty: 0,
              grossSales: 0,
              commissionFee: 0,
              salaryShare: 0,
              netTransfer: 0
            };
          }

          const lineSales = Math.round((item.price * item.qty) * trxNetRatio);
          brandStats[brandName].totalQty += item.qty;
          brandStats[brandName].grossSales += lineSales;
          if (incComm) {
            brandStats[brandName].commissionEligibleQty += item.qty;
            brandStats[brandName].commissionEligibleGross += lineSales;
          }
          if (incSalary) {
            brandStats[brandName].salaryEligibleQty += item.qty;
          }
        });
      });

      const rows = Object.values(brandStats);
      const totalSalaryEligibleQtyAllBrands = rows.reduce((s, r) => s + r.salaryEligibleQty, 0);

      rows.forEach(r => {
        r.commissionFee = Math.round(r.commissionEligibleGross * (r.commissionPct / 100));
        const qtyRatio = totalSalaryEligibleQtyAllBrands > 0
          ? (r.salaryEligibleQty / totalSalaryEligibleQtyAllBrands)
          : 0;
        r.salarySharePct = qtyRatio * 100;
        r.salaryShare = Math.round(totalWeeklyPayroll * qtyRatio);
        r.netTransfer = Math.max(0, r.grossSales - r.commissionFee - r.salaryShare);
      });

      return {
        bounds,
        rows,
        totalWeeklyPayroll,
        attPayroll,
        manualSalaryCashOut,
        totalSalaryEligibleQtyAllBrands
      };
    }

    function updateBrandCommissionConfig(brandName, newPct) {
      const cfg = getBrandConfig(brandName);
      cfg.commissionPct = Math.max(0, Math.min(100, Number(newPct) || 0));

      autoSyncMasterSlices(['meta']);
      renderBrandSettlementSubtab(document.getElementById('reportSubContent'));
      showToast(`Komisi brand ${brandName} diubah menjadi ${cfg.commissionPct}%.`);

    function recordBrandSettlementTransfer(brandName) {
      const bounds = getDateRangeBounds(settlePeriod, settleCustomStart, settleCustomEnd);
      const summary = computeBrandSettlementSummary(bounds);
      const row = summary.rows.find(r => r.brand === brandName);
      if (!row || row.netTransfer <= 0) {
        showToast('Tidak ada nominal wajib transfer untuk brand ini pada periode terpilih.', true);
        return;
      }

      const stlEntry = {
        id: 'STL-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        periodLabel: bounds.label,
        brand: row.brand,
        totalQty: row.totalQty,
        salaryEligibleQty: row.salaryEligibleQty,
        grossSales: row.grossSales,
        commissionPct: row.commissionPct,
        commissionFee: row.commissionFee,
        salarySharePct: Number(row.salarySharePct.toFixed(2)),
        salaryShare: row.salaryShare,
        netTransfer: row.netTransfer,
        by: currentUser.name
      };

      const cashEntry = {
        id: 'CSH-' + (Date.now() + 1).toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OUT',
        amount: row.netTransfer,
        note: `Transfer Sales ${row.brand} (${bounds.label})`,
        by: currentUser.name
      };

      db.brandSettlements.unshift(stlEntry);
      db.cashDrawer.unshift(cashEntry);
      saveDB();

      syncMasterEvent('BRAND_SETTLEMENT', stlEntry);
      syncMasterEvent('CASH_DRAWER', cashEntry);
      renderBrandSettlementSubtab(document.getElementById('reportSubContent'));
      showToast(`Transfer Sales ${row.brand} sebesar ${rp(row.netTransfer)} dicatat & tersinkron ke Google Sheets!`);
    }

    function sendBrandSettlementWhatsApp(brandName) {
      const bounds = getDateRangeBounds(settlePeriod, settleCustomStart, settleCustomEnd);
      const summary = computeBrandSettlementSummary(bounds);
      const row = summary.rows.find(r => r.brand === brandName);
      if (!row) return;

      const msgLines = [
        `*REKAP SETTLEMENT PENJUALAN — ${db.settings.outletName.toUpperCase()}*`,
        `Brand Owner : *${row.brand}*`,
        `Periode     : ${bounds.label}`,
        `--------------------------------`,
        `Total Item Terjual : ${row.totalQty} porsi/cup`,
        `Omzet Kotor Brand  : ${rp(row.grossSales)}`,
        `Potongan Komisi (${row.commissionPct}%) : -${rp(row.commissionFee)}`,
        `Porsi Beban Gaji (${row.salarySharePct.toFixed(1)}%) : -${rp(row.salaryShare)}`,
        `--------------------------------`,
        `*NET WAJIB TRANSFER : ${rp(row.netTransfer)}*`,
        ``,
        `Terima kasih atas kerja samanya di ${db.settings.outletName}!`
      ];
      const text = encodeURIComponent(msgLines.join('\n'));
      const cleanPhone = (row.ownerPhone || '').replace(/[^0-9]/g, '');
      const waPhone = cleanPhone.startsWith('0') ? '62' + cleanPhone.slice(1) : cleanPhone;
      const waUrl = waPhone ? `https://wa.me/${waPhone}?text=${text}` : `https://wa.me/?text=${text}`;
      window.open(waUrl, '_blank');
    }

    function saveStockOpname(invId) {
      const item = db.inventory.find(i => i.id === invId);
      if (!item) return;
      const actual = Math.max(0, Number(document.getElementById('opnameActualQty')?.value) || 0);
      const note = (document.getElementById('opnameNote')?.value || '').trim() || 'Penyesuaian stok opname';
      const diff = actual - item.stock;
      item.stock = actual;
      const logEntry = {
        id: 'LOG-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OPNAME',
        itemName: item.name,
        deltaText: `${diff >= 0 ? '+' : ''}${diff} ${item.unit} (Jadi ${actual})`,
        note,
        by: currentUser.name
      };
      db.stockLogs.unshift(logEntry);
      saveDB();
      syncMasterEvent('STOCK_LOG', logEntry);
      autoSyncMasterSlices(['inventory']);
      closeModal();
      renderInventoryTab(document.getElementById('mainContentArea'));
      showToast('Stok opname disimpan & tersinkron ke Google Sheets.');
    }

    function submitInventoryMutation(type) {
      const invId = document.getElementById('mutInvSelect')?.value;
      const qty = Math.max(0, Number(document.getElementById('mutInvQty')?.value) || 0);
      const note = (document.getElementById('mutInvNote')?.value || '').trim();
      const item = db.inventory.find(i => i.id === invId);
      if (!item || qty <= 0) { showToast('Pilih bahan dan isi jumlah yang valid.', true); return; }

      if (type === 'WASTE') {
        item.stock = Math.max(0, item.stock - qty);
      } else {
        item.stock += qty;
      }
      const logEntry = {
        id: 'LOG-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        type: type === 'WASTE' ? 'WASTE' : 'MUTASI MASUK',
        itemName: item.name,
        deltaText: `${type === 'WASTE' ? '-' : '+'}${qty} ${item.unit}`,
        note: note || (type === 'WASTE' ? 'Stok terbuang' : 'Penerimaan stok'),
        by: currentUser.name
      };
      db.stockLogs.unshift(logEntry);
      saveDB();
      syncMasterEvent('STOCK_LOG', logEntry);
      autoSyncMasterSlices(['inventory']);
      invSubTab = 'LOG';
      renderInventoryTab(document.getElementById('mainContentArea'));
      showToast('Mutasi stok dicatat & tersinkron ke Google Sheets.');
    }

    function saveNewInventoryItem() {
      const sku = (document.getElementById('newInvSku')?.value || '').trim();

      const category = document.getElementById('newInvCat')?.value || db.invCategories[0];

    function moveCategoryOrder(catName, direction) {
      db.categories = normalizeUniqueCategories(db.categories);
      const idx = db.categories.findIndex(c => c.toLowerCase() === String(catName || '').toLowerCase());
      if (idx <= 0) return;
      const targetIdx = idx + direction;
      if (targetIdx < 1 || targetIdx >= db.categories.length) return;
      const temp = db.categories[idx];
      db.categories[idx] = db.categories[targetIdx];
      db.categories[targetIdx] = temp;
      saveDB();
      autoSyncMasterSlices(['meta']);
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Urutan kategori "${catName}" diperbarui & disinkronkan.`);
    }

    function setCategoryPositionDirect(catName, newPos1Based) {
      db.categories = normalizeUniqueCategories(db.categories);
      const idx = db.categories.findIndex(c => c.toLowerCase() === String(catName || '').toLowerCase());
      if (idx <= 0) return;
      const maxPos = db.categories.length;
      const clampedTargetIdx = Math.max(1, Math.min(maxPos - 1, (Number(newPos1Based) || 2) - 1));
      if (clampedTargetIdx === idx) return;
      const [moved] = db.categories.splice(idx, 1);
      db.categories.splice(clampedTargetIdx, 0, moved);
      saveDB();
      autoSyncMasterSlices(['meta']);
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Posisi kategori "${catName}" dipindahkan ke urutan #${clampedTargetIdx + 1}.`);
    }

    function saveCategory(oldName) {
      const val = (document.getElementById('catNameInp')?.value || '').trim();
      if (!val) { showToast('Nama kategori wajib diisi.', true); return; }
      const duplicate = db.categories.some(c =>
        c.toLowerCase() === val.toLowerCase() && c.toLowerCase() !== String(oldName || '').toLowerCase()
      );
      if (duplicate) {
        showToast(`Kategori "${val}" sudah ada. Gunakan nama lain agar tidak duplikat.`, true);
        return;
      }
      if (oldName) {
        db.categories = db.categories.map(c => c === oldName ? val : c);
        db.products = db.products.map(p => p.category === oldName ? { ...p, category: val } : p);
      } else {
        db.categories.push(val);
      }
      db.categories = normalizeUniqueCategories(db.categories);
      saveDB();
      autoSyncMasterSlices(['products', 'meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Kategori menu disimpan & disinkronkan ke Google Sheets.');
    }

    function deleteCategory(name) {
      db.categories = db.categories.filter(c => c !== name);
      saveDB();
      autoSyncMasterSlices(['meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Kategori dihapus & disinkronkan.');
    }

    function saveProduct(prodId) {
      const sku = (document.getElementById('pSku')?.value || '').trim();
      const name = (document.getElementById('pName')?.value || '').trim();
      const brand = (document.getElementById('pBrand')?.value || 'Kopi Jiwara').trim();
      const category = document.getElementById('pCat')?.value || 'Kopi Jiwara';
      const unit = (document.getElementById('pUnit')?.value || '').trim() || 'Cup';
      const price = Math.max(0, Number(document.getElementById('pPrice')?.value) || 0);
      const cost = Math.max(0, Number(document.getElementById('pCost')?.value) || 0);
      const includeCommissionShare = Boolean(document.getElementById('pIncComm')?.checked);
      const includeSalaryShare = Boolean(document.getElementById('pIncSalary')?.checked);
      const fav = Boolean(document.getElementById('pFav')?.checked);
      if (!name) { showToast('Nama produk wajib diisi.', true); return; }

      getBrandConfig(brand);

      if (prodId) {
        const idx = db.products.findIndex(x => x.id === prodId);
        if (idx !== -1) {
          db.products[idx] = {
            ...db.products[idx],
            sku, name, brand, category, unit, price, cost, includeCommissionShare, includeSalaryShare, fav
          };
        }
      } else {
        db.products.push({
          id: 'PRD-' + Date.now().toString().slice(-6),
          sku, name, brand, category, unit, price, cost, includeCommissionShare, includeSalaryShare, stock: 50, fav
        });
      }
      saveDB();
      autoSyncMasterSlices(['products', 'meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Data produk disimpan & disinkronkan ke Google Sheets.');
    }

    function deleteProduct(prodId) {
      db.products = db.products.filter(x => x.id !== prodId);
      saveDB();
      autoSyncMasterSlices(['products']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Produk dihapus & disinkronkan ke Google Sheets.');
    }

    function handleOutletLogoUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 256;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          db.settings.logoDataUrl = canvas.toDataURL('image/png', 0.9);
          saveDB();
          renderWorkspace();
          showToast('Logo outlet berhasil diperbarui!');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var metaProps = PropertiesService.getScriptProperties();
  var raw = JSON.parse(e.postData.contents);
  var type = raw.eventType;
  var p = raw.payload || {};

  function ensureSheet(name, headers) {
    var sh = ss.getSheetByName(name);
    if (!sh) {
      sh = ss.insertSheet(name);
      sh.appendRow(headers);
      sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
      sh.setFrozenRows(1);
    }
    return sh;
  }

  function replaceMasterTable(sheetName, headers, rows) {
    var sh = ensureSheet(sheetName, headers);
    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, headers.length).clearContent();
    if (rows && rows.length > 0) sh.getRange(2, 1, rows.length, headers.length).setValues(rows);
  }

  if (p.outletProfile) {
    metaProps.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(p.outletProfile));
    replaceMasterTable('PROFIL_OUTLET', ['Nama_Outlet', 'Alamat', 'Telepon_WA', 'Media_Sosial', 'Footer_Struk'], [[
      p.outletProfile.outletName || '', p.outletProfile.address || '', p.outletProfile.phone || '',
      p.outletProfile.socialMedia || '', p.outletProfile.receiptFooter || ''
    ]]);
  }
  if (p.categories) metaProps.setProperty('CATEGORIES_JSON', JSON.stringify(p.categories));
  if (p.brandConfigs) metaProps.setProperty('BRAND_CONFIGS_JSON', JSON.stringify(p.brandConfigs));
  if (p.deletedBrands) metaProps.setProperty('DELETED_BRANDS_JSON', JSON.stringify(p.deletedBrands));

  if (type === 'SALE_COMPLETED') {
    var shPos = ensureSheet('POS_TRANSAKSI', ['No_Nota', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'Kasir', 'Jumlah_Item', 'Subtotal', 'Diskon', 'Kode_Promo', 'Total_Bayar', 'Metode_Bayar', 'Status']);
    var totalQty = (p.items || []).reduce(function(s, i) { return s + (i.qty || 0); }, 0);
    shPos.appendRow([p.id, p.date, p.time, p.orderType, p.tableOrCustomer, p.cashier, totalQty, p.subtotal, p.discount || 0, p.promoCode || '-', p.total, p.paymentMethod, p.status]);

    var shItems = ensureSheet('POS_ITEM_TERJUAL', ['No_Nota', 'Tanggal', 'Jam', 'SKU', 'Nama_Menu', 'Brand', 'Kena_Komisi', 'Hitung_Porsi_Gaji', 'Qty', 'Harga_Satuan', 'Total_Penjualan', 'Total_HPP', 'Laba_Kotor']);
    (p.items || []).forEach(function(item) {
      var omzet = (item.price || 0) * (item.qty || 0);
      var hpp = (item.cost || 0) * (item.qty || 0);
      shItems.appendRow([
        p.id, p.date, p.time, item.sku || '-', item.name, item.brand || 'Kopi Jiwara',
        item.includeCommissionShare === false ? 'TIDAK' : 'YA',
        item.includeSalaryShare === false ? 'TIDAK' : 'YA',
        item.qty, item.price, omzet, hpp, omzet - hpp
      ]);
    });
  } else if (type === 'CASH_DRAWER') {
    var shCash = ensureSheet('ARUS_KAS_CASHFLOW', ['ID_Mutasi', 'Tanggal', 'Jam', 'Kategori_Kas', 'Keterangan', 'Debit_Masuk', 'Kredit_Keluar', 'PIC']);
    var isSetoran = /^setoran/i.test(p.note || '');
    var isTransferBrand = /^transfer sales/i.test(p.note || '');
    var kat = p.type === 'IN' ? 'Kas Masuk Laci' : (isTransferBrand ? 'Setoran Brand Owner' : (isSetoran ? 'Setoran ke Owner/Finance' : 'Biaya Operasional'));
    shCash.appendRow([p.id, p.date, p.time, kat, p.note, p.type === 'IN' ? p.amount : 0, p.type === 'OUT' ? p.amount : 0, p.by]);
  } else if (type === 'BRAND_SETTLEMENT') {
    var shStl = ensureSheet('SETTLEMENT_BRAND', ['ID_Settlement', 'Tanggal', 'Periode', 'Brand', 'Total_Item', 'Item_Acuan_Gaji', 'Omzet_Kotor', 'Persen_Komisi', 'Potongan_Komisi', 'Porsi_Gaji_Pct', 'Potongan_Gaji', 'Net_Transfer', 'PIC']);
    shStl.appendRow([p.id, p.date, p.periodLabel, p.brand, p.totalQty, p.salaryEligibleQty || 0, p.grossSales, p.commissionPct + '%', p.commissionFee, (p.salarySharePct || 0) + '%', p.salaryShare, p.netTransfer, p.by]);
  } else if (type === 'ATTENDANCE') {
    var shAtt = ensureSheet('ABSENSI_KARYAWAN', ['ID_Absen', 'Tanggal', 'Nama_Staf', 'Jabatan', 'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian']);
    shAtt.appendRow([p.id, p.date, p.staffName, p.role, p.clockIn, p.clockOut || 'Aktif', p.wage || 0]);
  } else if (type === 'CLOSING_SHIFT') {
    var shClose = ensureSheet('CLOSING_SHIFT', ['ID_Closing', 'Tanggal', 'Jam', 'Kasir', 'Modal_Awal', 'Omzet_Cash', 'Omzet_QRIS', 'Omzet_Transfer', 'Omzet_Online', 'Total_Omzet', 'Ekspektasi_Laci', 'Uang_Fisik', 'Selisih']);
    shClose.appendRow([p.id, p.date, p.time, p.closedBy, p.openingCash, p.cashSales, p.qrisSales, p.transferSales, p.onlineSales, p.totalSales, p.expectedCash, p.actualCash, p.diff]);
  } else if (type === 'AUDIT_AUTH') {
    var shAud = ensureSheet('AUDIT_OTORISASI', ['ID_Audit', 'Tanggal', 'Jam', 'Tindakan', 'No_Nota', 'Detail', 'Alasan', 'Kasir', 'Disetujui_Oleh']);
    shAud.appendRow([p.id, p.date, p.time, p.action, p.orderId, p.detail, p.reason, p.cashier, p.approvedBy]);
  } else if (type === 'PAID_TRX_CANCELLED') {
    var shPosVoid = ss.getSheetByName('POS_TRANSAKSI');
    if (shPosVoid && shPosVoid.getLastRow() > 1) {
      var posRows = shPosVoid.getRange(2, 1, shPosVoid.getLastRow() - 1, 13).getValues();
      for (var rIdx = 0; rIdx < posRows.length; rIdx++) {
        if (String(posRows[rIdx][0]) === String(p.id)) {
          shPosVoid.getRange(rIdx + 2, 13).setValue('CANCELLED (' + (p.reason || 'Void') + ')');
          break;
        }
      }
    }
  } else if (type === 'STOCK_LOG') {
    var shLog = ensureSheet('LOG_STOK_GUDANG', ['ID_Log', 'Tanggal', 'Jam', 'Jenis', 'Nama_Bahan', 'Perubahan', 'Keterangan', 'PIC']);
    shLog.appendRow([p.id, p.date, p.time, p.type, p.itemName, p.deltaText, p.note, p.by]);
  }

  if (p.products) {
    replaceMasterTable('MASTER_MENU', ['SKU', 'Nama_Menu', 'Kategori', 'Brand', 'Kena_Komisi', 'Hitung_Porsi_Gaji', 'Satuan', 'Harga_Jual', 'HPP', 'Favorit'],
      p.products.map(function(x) {
        return [
          x.sku, x.name, x.category, x.brand || 'Kopi Jiwara',
          x.includeCommissionShare === false ? 'TIDAK' : 'YA',

          x.unit, x.price, x.cost, x.fav ? 'YA' : 'TIDAK'
        ];
      })
    );
  }
  if (p.inventory) {
    replaceMasterTable('GUDANG_STOK', ['SKU', 'Nama_Bahan', 'Kategori', 'Satuan', 'Sisa_Stok', 'Min_Stok', 'HPP_Satuan'],
      p.inventory.map(function(x) { return [x.sku, x.name, x.category, x.unit, x.stock, x.minStock, x.costPerUnit]; })
    );
  }
  if (p.staff) {
    replaceMasterTable('MASTER_PEGAWAI', ['ID_Staf', 'Nama_Pegawai', 'Jabatan', 'PIN_Login', 'Upah_Harian', 'Status'],
      p.staff.map(function(x) { return [x.id, x.name, x.role, x.pin, x.dailyWage, x.active ? 'Aktif' : 'Nonaktif']; })
    );
  }
  if (p.promos) {
    replaceMasterTable('MASTER_PROMO', ['ID_Promo', 'Kode_Promo', 'Judul', 'Tipe', 'Nilai', 'Min_Belanja', 'Status'],
      p.promos.map(function(x) { return [x.id, x.code, x.title, x.type, x.value, x.minPurchase, x.active ? 'Aktif' : 'Nonaktif']; })
    );
  }
  if (p.customers) {
    replaceMasterTable('CRM_PELANGGAN', ['ID_Pelanggan', 'Nama', 'No_WA', 'Tier', 'Kunjungan', 'Total_Belanja', 'Kode_Voucher', 'Nominal_Voucher'],
      p.customers.map(function(x) { return [x.id, x.name, x.phone, x.tier, x.totalVisits, x.totalSpent, x.voucherCode || '', x.voucherDiscount || 0]; })
    );
  }
  if (p.openOrders !== undefined) {
    replaceMasterTable('OPEN_ORDERS', ['No_Nota', 'Tanggal', 'Jam', 'Tipe', 'Meja_Pelanggan', 'Kasir', 'Total', 'Jumlah_Item', 'JSON_Payload'],
      (p.openOrders || []).map(function(o) {
        var q = (o.items || []).reduce(function(s, i) { return s + (i.qty || 0); }, 0);
        return [o.id, o.date, o.time, o.orderType, o.tableOrCustomer, o.cashier, o.total, q, JSON.stringify(o)];
      })
    );
  }

  return ContentService.createTextOutput(JSON.stringify({ status: 'OK' })).setMimeType(ContentService.MimeType.JSON);
}`;

    // ==================== TAB: KELUAR KASIR (CLOSING SHIFT + WA REPORT) ====================
    function getTodayClosingSummary() {
      const today = todayISO();
      const paidToday = db.transactions.filter(t => t.status === 'PAID' && t.date === today);
      const cashSales = paidToday.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + t.total, 0);
      const qrisSales = paidToday.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0);
      const transferSales = paidToday.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
      const onlineSales = paidToday.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);
      const totalSales = cashSales + qrisSales + transferSales + onlineSales;

      const todayCashLogs = db.cashDrawer.filter(c => c.date === today);
      const extraIn = todayCashLogs.filter(c => c.type === 'IN').reduce((s, c) => s + c.amount, 0);
      const extraOut = todayCashLogs.filter(c => c.type === 'OUT').reduce((s, c) => s + c.amount, 0);
      const openingCash = db.shift.isOpen ? (db.shift.openingCash || 0) : 0;
      const expectedCash = openingCash + cashSales + extraIn - extraOut;

      const itemSummary = {};
      paidToday.forEach(t => {
        t.items.forEach(i => {
          itemSummary[i.name] = (itemSummary[i.name] || 0) + i.qty;
        });
      });

      return {
        today, paidToday, cashSales, qrisSales, transferSales, onlineSales, totalSales,
        openingCash, extraIn, extraOut, expectedCash, itemSummary
      };
    }

        `• Ekspektasi   : ${rp(sum.expectedCash)}`,
        `• Uang Fisik   : ${rp(actualCash)}`,
        `• Selisih      : ${diff === 0 ? 'Rp 0 (Klop)' : rp(diff)}`,
        `--------------------------------`,
        `*PRODUK TERJUAL HARI INI*`,
        itemsLines
      ].join('\n');

      const encoded = encodeURIComponent(msg);
      window.open(`https://wa.me/?text=${encoded}`, '_blank');
    }

    function confirmCloseCashierShift() {
      const pinVal = (document.getElementById('closeStaffPin')?.value || '').trim();
      if (pinVal !== currentUser.pin) {
        showToast('PIN Kasir tidak sesuai.', true);
        return;
      }
      const sum = getTodayClosingSummary();
      const actualCash = Number(document.getElementById('closeActualCash')?.value) || 0;
      const diff = actualCash - sum.expectedCash;

      const closingRecord = {
        id: 'CLS-' + Date.now().toString().slice(-6),
        date: sum.today,
        time: nowTimeStr(),
        closedBy: currentUser.name,
        openingCash: sum.openingCash,
        cashSales: sum.cashSales,
        qrisSales: sum.qrisSales,
        transferSales: sum.transferSales,
        onlineSales: sum.onlineSales,
        totalSales: sum.totalSales,
        expectedCash: sum.expectedCash,
        actualCash,
        diff
      };

      db.shift.closingHistory.unshift(closingRecord);
      db.shift.isOpen = false;
      db.shift.openedBy = '';
      db.shift.openedAt = '';
      db.shift.openingCash = 0;

      const openAtt = db.attendance.find(a => a.date === sum.today && a.staffId === currentUser.id && !a.clockOut);
      if (openAtt) openAtt.clockOut = nowTimeStr();

      saveDB();
      syncMasterEvent('CLOSING_SHIFT', closingRecord);
      showToast('Kasir berhasil ditutup & laporan tersinkron ke Google Sheets.');

      currentUser = null;
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('appWorkspace').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      initLoginScreen();
    }

    // ==================== BOOTSTRAP ====================
    (function bootstrapApp() {
      initLoginScreen();
      const savedSessionUserId = sessionStorage.getItem(SESSION_KEY);
      if (savedSessionUserId) {
        const u = db.staff.find(s => s.id === savedSessionUserId && s.active);
        if (u) {
          currentUser = u;
          enterWorkspace();
        }
      }
    })();
  </script>
</body>
