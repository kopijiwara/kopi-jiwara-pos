function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var metaProps = PropertiesService.getScriptProperties();

  function toIsoDate(val) {
    if (!val) return '';
    if (val instanceof Date && !isNaN(val.getTime())) {
      return Utilities.formatDate(val, Session.getScriptTimeZone() || 'Asia/Jakarta', 'yyyy-MM-dd');
    }
    var s = String(val).trim();
    if (/^\\d{4}-\\d{2}-\\d{2}/.test(s)) return s.slice(0, 10);
    return s;
  }

  function toTimeStr(val) {
    if (!val) return '00:00';
    if (val instanceof Date && !isNaN(val.getTime())) {
      return Utilities.formatDate(val, Session.getScriptTimeZone() || 'Asia/Jakarta', 'HH:mm');
    }
    return String(val).trim();
  }

  var outletProfile = null;
  try {
    var rawOp = metaProps.getProperty('OUTLET_PROFILE_JSON');
    if (rawOp) outletProfile = JSON.parse(rawOp);
  } catch (err) {}

  var products = [];
  var shMenu = ss.getSheetByName('MASTER_MENU');
  if (shMenu && shMenu.getLastRow() > 1) {
    shMenu.getRange(2, 1, shMenu.getLastRow() - 1, 11).getValues().forEach(function(r) {
      if (r[0] && r[2]) {
        products.push({
          id: String(r[0]), sku: String(r[1]), name: String(r[2]), category: String(r[3]),
          brand: String(r[4] || 'Kopi Jiwara'),
          includeCommissionShare: String(r[5]).toUpperCase() !== 'TIDAK',
          includeSalaryShare: String(r[6]).toUpperCase() !== 'TIDAK',
          unit: 'Porsi', price: Number(r[7]) || 0, cost: Number(r[8]) || 0,
          stock: Number(r[9]) || 0, fav: String(r[10]).toUpperCase() === 'YA'
        });
      }
    });
  }

  var categories = [];
  var brandConfigs = [];
  var deletedBrands = [];
  try {
    var rawCats = metaProps.getProperty('MENU_CATEGORIES_JSON');
    if (rawCats) categories = JSON.parse(rawCats);
    var rawBrands = metaProps.getProperty('BRAND_CONFIGS_JSON');
    if (rawBrands) brandConfigs = JSON.parse(rawBrands);
    var rawDelBrands = metaProps.getProperty('DELETED_BRANDS_JSON');
    if (rawDelBrands) deletedBrands = JSON.parse(rawDelBrands);
  } catch (err) {}

  var inventory = [];
  var shInv = ss.getSheetByName('GUDANG_STOK');
  if (shInv && shInv.getLastRow() > 1) {
    shInv.getRange(2, 1, shInv.getLastRow() - 1, 8).getValues().forEach(function(r) {
      if (r[0] && r[2]) {
        inventory.push({
          id: String(r[0]), sku: String(r[1]), name: String(r[2]), category: String(r[3]),
          unit: String(r[4]), stock: Number(r[5]) || 0, minStock: Number(r[6]) || 0, costPerUnit: 0
        });
      }
    });
  }

  var staff = [];
  var shStf = ss.getSheetByName('MASTER_PEGAWAI');
  if (shStf && shStf.getLastRow() > 1) {
    shStf.getRange(2, 1, shStf.getLastRow() - 1, 6).getValues().forEach(function(r) {
      if (r[0] && r[1]) {
        staff.push({
          id: String(r[0]), name: String(r[1]), role: String(r[2]), pin: String(r[3]),
          dailyWage: Number(r[4]) || 0, active: String(r[5]) === 'Aktif'
        });
      }
    });
  }

  var promos = [];
  var shPrm = ss.getSheetByName('MASTER_PROMO');
  if (shPrm && shPrm.getLastRow() > 1) {
    shPrm.getRange(2, 1, shPrm.getLastRow() - 1, 7).getValues().forEach(function(r) {
      if (r[0] && r[1]) {
        promos.push({
          id: String(r[0]), code: String(r[1]), title: String(r[2]), type: String(r[3]),
          value: Number(r[4]) || 0, minPurchase: Number(r[5]) || 0,
          validUntil: '2026-12-31', active: String(r[6]) === 'Aktif'
        });
      }
    });
  }

  var customers = [];
  var shCst = ss.getSheetByName('CRM_PELANGGAN');
  if (shCst && shCst.getLastRow() > 1) {
    shCst.getRange(2, 1, shCst.getLastRow() - 1, 6).getValues().forEach(function(r) {
      if (r[0] && r[1]) {
        customers.push({
          id: String(r[0]), name: String(r[1]), phone: String(r[2] || ''),
          tier: String(r[3] || 'Silver Member'), points: Number(r[4]) || 0, voucher: String(r[5] || '')
        });
      }
    });
  }

  var openOrders = [];
  var shOpen = ss.getSheetByName('OPEN_ORDERS');
  if (shOpen && shOpen.getLastRow() > 1) {
    shOpen.getRange(2, 1, shOpen.getLastRow() - 1, 9).getValues().forEach(function(r) {
      if (r[8]) {
        try { openOrders.push(JSON.parse(String(r[8]))); } catch (err) {}
      }
    });
  }

  var paidTransactions = [];
  var shPos = ss.getSheetByName('POS_TRANSAKSI');
  if (shPos && shPos.getLastRow() > 1) {
    var startRow = Math.max(2, shPos.getLastRow() - 499);
    shPos.getRange(startRow, 1, shPos.getLastRow() - startRow + 1, 13).getValues().forEach(function(r) {
      if (r[0] && String(r[12]).toUpperCase() === 'PAID') {
        paidTransactions.push({
          id: String(r[0]), date: toIsoDate(r[1]), time: toTimeStr(r[2]), orderType: String(r[3]),
          tableOrCustomer: String(r[4]), cashier: String(r[5]), subtotal: Number(r[7]) || 0,
          discount: Number(r[8]) || 0, promoCode: String(r[9] || ''), total: Number(r[10]) || 0,
          paymentMethod: String(r[11] || 'Cash'), items: []
        });
      }
    });
  }

  var paidItems = [];
  var shItems = ss.getSheetByName('POS_ITEM_TERJUAL');
  if (shItems && shItems.getLastRow() > 1) {
    var startItemRow = Math.max(2, shItems.getLastRow() - 1499);
    shItems.getRange(startItemRow, 1, shItems.getLastRow() - startItemRow + 1, 13).getValues().forEach(function(r) {
      if (r[0] && r[4]) {
        var qty = Number(r[8]) || 1;
        var totalHpp = Number(r[11]) || 0;
        paidItems.push({
          trxId: String(r[0]),
          sku: String(r[3] || '-'),
          name: String(r[4]),
          brand: String(r[5] || 'Kopi Jiwara'),
          includeCommissionShare: String(r[6]).toUpperCase() !== 'TIDAK',
          includeSalaryShare: String(r[7]).toUpperCase() !== 'TIDAK',
          qty: qty,
          price: Number(r[9]) || 0,
          cost: qty > 0 ? Math.round(totalHpp / qty) : 0
        });
      }
    });
  }

  var cashDrawer = [];
  var shCash = ss.getSheetByName('ARUS_KAS_CASHFLOW');
  if (shCash && shCash.getLastRow() > 1) {
    var startC = Math.max(2, shCash.getLastRow() - 299);
    shCash.getRange(startC, 1, shCash.getLastRow() - startC + 1, 8).getValues().forEach(function(r) {
      if (r[0]) {
        var debit = Number(r[5]) || 0;
        var kredit = Number(r[6]) || 0;
        cashDrawer.push({
          id: String(r[0]), date: toIsoDate(r[1]), time: toTimeStr(r[2]),
          type: debit > 0 ? 'IN' : 'OUT',
          amount: debit > 0 ? debit : kredit,
          note: String(r[4] || ''), by: String(r[7] || '')
        });
      }
    });
  }

  var attendance = [];
  var shAtt = ss.getSheetByName('ABSENSI_KARYAWAN');
  if (shAtt && shAtt.getLastRow() > 1) {
    var startA = Math.max(2, shAtt.getLastRow() - 299);
    shAtt.getRange(startA, 1, shAtt.getLastRow() - startA + 1, 7).getValues().forEach(function(r) {
      if (r[0]) {
        attendance.push({
          id: String(r[0]), date: toIsoDate(r[1]), staffName: String(r[2] || ''),
          role: String(r[3] || ''), clockIn: toTimeStr(r[4]), clockOut: toTimeStr(r[5]), wage: Number(r[6]) || 0
        });
      }
    });
  }

  var brandSettlements = [];
  var shStl = ss.getSheetByName('SETTLEMENT_BRAND');
  if (shStl && shStl.getLastRow() > 1) {
    var startS = Math.max(2, shStl.getLastRow() - 199);
    shStl.getRange(startS, 1, shStl.getLastRow() - startS + 1, 13).getValues().forEach(function(r) {
      if (r[0]) {
        brandSettlements.push({
          id: String(r[0]), date: toIsoDate(r[1]), periodLabel: String(r[2] || ''), brand: String(r[3] || ''),
          totalQty: Number(r[4]) || 0, salaryEligibleQty: Number(r[5]) || 0, grossSales: Number(r[6]) || 0,
          commissionPct: parseFloat(String(r[7]).replace('%', '')) || 0, commissionFee: Number(r[8]) || 0,
          salarySharePct: parseFloat(String(r[9]).replace('%', '')) || 0, salaryShare: Number(r[10]) || 0,
          netTransfer: Number(r[11]) || 0, by: String(r[12] || '')
        });
      }
    });
  }

  return ContentService.createTextOutput(JSON.stringify({
    status: 'OK',
    outletProfile: outletProfile,
    products: products,
    categories: categories,
    brandConfigs: brandConfigs,
    deletedBrands: deletedBrands,
    inventory: inventory,
    staff: staff,
    promos: promos,
    customers: customers,
    openOrders: openOrders,
    paidTransactions: paidTransactions,
    paidItems: paidItems,
    cashDrawer: cashDrawer,
    attendance: attendance,
    brandSettlements: brandSettlements
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var metaProps = PropertiesService.getScriptProperties();
  var body = JSON.parse(e.postData.contents);
  var type = body.eventType;
  var d = body.data || {};

  function getOrCreate(name) {
    var sh = ss.getSheetByName(name);
    if (!sh) { setupMasterJiwaraSheets(); sh = ss.getSheetByName(name); }
    return sh;
  }

  function replaceMasterTable(sheetName, rows) {
    var sh = getOrCreate(sheetName);
    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, sh.getLastColumn()).clearContent();
    if (rows && rows.length > 0) sh.getRange(2, 1, rows.length, rows[0].length).setValues(rows);
  }

  if (type === 'OUTLET_PROFILE_UPDATED') {
    metaProps.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(d));
  } else if (type === 'POS_TRANSACTION_PAID') {
    var shPos = getOrCreate('POS_TRANSAKSI');
    var shItem = getOrCreate('POS_ITEM_TERJUAL');
    var items = d.items || [];
    var totalQty = items.reduce(function(s, i) { return s + (i.qty || 0); }, 0);
    shPos.appendRow([d.id, d.date, d.time, d.orderType, d.tableOrCustomer || '-', d.cashier, totalQty, d.subtotal, d.discount, d.promoCode || '-', d.total, d.paymentMethod, 'PAID']);
    items.forEach(function(it) {
      var sub = (it.price || 0) * (it.qty || 1);
      var hpp = (it.cost || 0) * (it.qty || 1);
      shItem.appendRow([
        d.id, d.date, d.time, it.sku || '-', it.name, it.brand || 'Kopi Jiwara',
        it.includeCommissionShare === false ? 'Tidak' : 'Ya',
        it.includeSalaryShare === false ? 'Tidak' : 'Ya',
        it.qty, it.price, sub, hpp, sub - hpp
      ]);
    });
  } else if (type === 'PAID_TRX_CANCELLED') {
    var shPosCancel = getOrCreate('POS_TRANSAKSI');
    if (shPosCancel.getLastRow() > 1) {
      var rowsCancel = shPosCancel.getRange(2, 1, shPosCancel.getLastRow() - 1, 13).getValues();
      for (var i = 0; i < rowsCancel.length; i++) {
        if (String(rowsCancel[i][0]) === String(d.trxId)) {
          shPosCancel.getRange(i + 2, 13).setValue('CANCELLED');
          break;
        }
      }
    }
  } else if (type === 'OPEN_ORDERS_SYNC') {
    var oRows = (d.openOrders || []).map(function(o) {
      var summary = (o.items || []).map(function(i) { return i.name + ' (' + i.qty + 'x)'; }).join(', ');
      return [o.id, o.date, o.time, o.orderType, o.tableOrCustomer || '-', o.cashier, o.total, summary, JSON.stringify(o)];
    });
    replaceMasterTable('OPEN_ORDERS', oRows);
  } else if (type === 'CASH_DRAWER_MUTATION') {
    var shCash = getOrCreate('ARUS_KAS_CASHFLOW');
    var noteStr = String(d.note || '');
    var katKas = /^transfer sales/i.test(noteStr)
      ? 'Setoran Brand Owner'
      : (/^setoran/i.test(noteStr) ? 'Setoran Kasir ke Owner' : (d.type === 'IN' ? 'Kas Masuk Tambahan' : 'Biaya Operasional'));
    shCash.appendRow([d.id, d.date, d.time, katKas, noteStr, d.type === 'IN' ? d.amount : 0, d.type === 'OUT' ? d.amount : 0, d.by]);
  } else if (type === 'BRAND_SETTLEMENT_TRANSFER') {
    var shStl = getOrCreate('SETTLEMENT_BRAND');
    shStl.appendRow([d.id, d.date, d.periodLabel, d.brand, d.totalQty, d.salaryEligibleQty || 0, d.grossSales, d.commissionPct + '%', d.commissionFee, d.salarySharePct + '%', d.salaryShare, d.netTransfer, d.by]);
  } else if (type === 'SHIFT_CLOSING_REPORT') {
    var shClose = getOrCreate('CLOSING_SHIFT');
    shClose.appendRow([d.id, d.date, d.time, d.closedBy, d.expectedCash, d.actualCash, d.difference, d.grossSales]);
  } else if (type === 'SECURITY_PIN_AUDIT') {
    var shAud = getOrCreate('AUDIT_OTORISASI');
    shAud.appendRow([d.id, d.date, d.time, d.action, d.requestedBy, d.approvedBy]);
  } else if (type === 'INVENTORY_STOCK_ADJUST') {
    var shLogStk = getOrCreate('LOG_STOK_GUDANG');
    shLogStk.appendRow([d.id, d.date, d.time, d.itemName, d.type === 'IN' ? 'Masuk (+)' : 'Keluar (-)', d.qty, d.note || '-', d.by]);
  } else if (type === 'STAFF_ATTENDANCE') {
    var shAtt = getOrCreate('ABSENSI_KARYAWAN');
    shAtt.appendRow([d.id, d.date, d.staffName, d.role, d.clockIn, d.clockOut || 'Aktif', d.wage || 0]);
  } else if (type === 'CATEGORIES_BRANDS_SYNC') {
    if (d.categories) metaProps.setProperty('MENU_CATEGORIES_JSON', JSON.stringify(d.categories));
    if (d.brandConfigs) metaProps.setProperty('BRAND_CONFIGS_JSON', JSON.stringify(d.brandConfigs));
    if (d.deletedBrands) metaProps.setProperty('DELETED_BRANDS_JSON', JSON.stringify(d.deletedBrands));
  } else if (type === 'MASTER_MENU_SYNC') {
    var mRows = (d.products || []).map(function(p) {
      return [
        p.id, p.sku, p.name, p.category, p.brand,
        p.includeCommissionShare === false ? 'Tidak' : 'Ya',
        p.includeSalaryShare === false ? 'Tidak' : 'Ya',
        p.price, p.cost, p.stock, p.fav ? 'Ya' : 'Tidak'
      ];
    });
    replaceMasterTable('MASTER_MENU', mRows);
  } else if (type === 'GUDANG_STOK_SYNC') {
    var iRows = (d.inventory || []).map(function(i) {
      return [i.id, i.sku, i.name, i.category, i.unit, i.stock, i.minStock, i.stock <= i.minStock ? 'Perlu Restock' : 'Aman'];
    });
    replaceMasterTable('GUDANG_STOK', iRows);
  } else if (type === 'MASTER_PEGAWAI_SYNC') {
    var sRows = (d.staff || []).map(function(s) {
      return [s.id, s.name, s.role, s.pin, s.dailyWage, s.active ? 'Aktif' : 'Nonaktif'];
    });
    replaceMasterTable('MASTER_PEGAWAI', sRows);
  } else if (type === 'MASTER_PROMO_SYNC') {
    var pRows = (d.promos || []).map(function(p) {
      return [p.id, p.code, p.title, p.type, p.value, p.minPurchase, p.active ? 'Aktif' : 'Nonaktif'];
    });
    replaceMasterTable('MASTER_PROMO', pRows);
  } else if (type === 'CRM_PELANGGAN_SYNC') {
    var cRows = (d.customers || []).map(function(c) {
      return [c.id, c.name, c.phone || '-', c.tier, c.points || 0, c.voucher || '-'];
    });
    replaceMasterTable('CRM_PELANGGAN', cRows);
  }

  return ContentService.createTextOutput(JSON.stringify({ status: 'OK' })).setMimeType(ContentService.MimeType.JSON);
}`;
