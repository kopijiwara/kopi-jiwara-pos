function upsertCrmFromPos(custNameRaw, custPhoneRaw, trxTotal) {
  const cleanName = String(custNameRaw || '').trim();
  const cleanPhone = String(custPhoneRaw || '').trim();
  const isTableOnly = !cleanName || /^meja\s*\d*$/i.test(cleanName);
  if (isTableOnly && !cleanPhone) return null;

  let cust = null;
  if (cleanPhone) {
    cust = db.customers.find(c => c.phone && c.phone.replace(/\D/g, '') === cleanPhone.replace(/\D/g, ''));
  }
  if (!cust && !isTableOnly) {
    cust = db.customers.find(c => c.name.toLowerCase() === cleanName.toLowerCase());
  }

  if (cust) {
    if (!isTableOnly && (!cust.name || cust.name === 'Pelanggan')) cust.name = cleanName;
    if (cleanPhone && !cust.phone) cust.phone = cleanPhone;
    cust.visits = (Number(cust.visits) || 0) + 1;
    cust.totalSpend = (Number(cust.totalSpend) || 0) + trxTotal;
    if (cust.totalSpend >= 500000) cust.tier = 'Gold Member';
    else if (cust.totalSpend >= 200000) cust.tier = 'Silver Member';
  } else {
    cust = {
      id: 'CST-' + Date.now().toString().slice(-5),
      name: isTableOnly ? ('Pelanggan ' + cleanPhone) : cleanName,
      phone: cleanPhone,
      tier: trxTotal >= 200000 ? 'Silver Member' : 'Regular',
      visits: 1,
      totalSpend: trxTotal,
      specialVoucher: '',
      voucherDiscount: 0,
      voucherExpiry: '2026-12-31'
    };
    db.customers.unshift(cust);
  }
  autoSyncMasterSlices(['customers']);
  return cust;
}

function completeCheckoutPayment() {
  const { subtotal, totalDiscount, grandTotal, appliedCode } = getPosTotals();

  let paidItems = [];
  let remainingItems = [];
  let paidSubtotal = subtotal;
  let paidDiscount = totalDiscount;
  let paidTotal = grandTotal;

  if (checkoutMode === 'split') {
    posCart.forEach((it, idx) => {
      const payQty = Math.min(it.qty, Math.max(0, Number(splitSelectedQtys[idx]) || 0));
      const remQty = it.qty - payQty;
      if (payQty > 0) paidItems.push({ ...it, qty: payQty });
      if (remQty > 0) remainingItems.push({ ...it, qty: remQty });
    });
    if (paidItems.length === 0) return showToast('Pilih minimal 1 produk untuk dibayar!', true);
    paidSubtotal = paidItems.reduce((s, it) => s + (it.price * it.qty), 0);
    paidDiscount = subtotal > 0 ? Math.min(paidSubtotal, Math.round(totalDiscount * (paidSubtotal / subtotal))) : 0;
    paidTotal = Math.max(0, paidSubtotal - paidDiscount);
  } else {
    paidItems = JSON.parse(JSON.stringify(posCart));
  }

  if (checkoutMethod === 'Cash' && checkoutCashReceived < paidTotal) {
    return showToast('Uang tunai yang diterima kurang!', true);
  }

  const trx = {
    id: 'TRX-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    orderType: posOrderType,
    tableOrCustomer: posTableCustomer.trim() || '-',
    customerPhone: posCustomerPhone.trim(),
    cashier: currentUser.name,
    items: paidItems,
    subtotal: paidSubtotal,
    discount: paidDiscount,
    promoCode: appliedCode,
    total: paidTotal,
    paymentMethod: checkoutMethod,
    cashReceived: checkoutMethod === 'Cash' ? checkoutCashReceived : paidTotal,
    changeAmount: checkoutMethod === 'Cash' ? Math.max(0, checkoutCashReceived - paidTotal) : 0,
    status: 'PAID'
  };

  paidItems.forEach(item => {
    const prod = db.products.find(p => p.id === item.id || p.sku === item.sku);
    if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
  });

  const savedCust = upsertCrmFromPos(posTableCustomer, posCustomerPhone, paidTotal);
  if (savedCust && savedCust.phone && !trx.customerPhone) {
    trx.customerPhone = savedCust.phone;
  }

  db.transactions.unshift(trx);

  if (remainingItems.length > 0) {
    const remSub = remainingItems.reduce((s, it) => s + (it.price * it.qty), 0);
    const remDisc = Math.max(0, totalDiscount - paidDiscount);
    const remTotal = Math.max(0, remSub - remDisc);
    const remOrder = {
      id: editingOpenOrderId || ('ORD-' + Date.now().toString().slice(-6)),
      date: todayISO(),
      time: nowTimeStr(),
      orderType: posOrderType,
      tableOrCustomer: posTableCustomer.trim() || 'Open Bill (Sisa Split)',
      customerPhone: posCustomerPhone.trim(),
      cashier: currentUser.name,
      items: remainingItems,
      subtotal: remSub,
      discount: remDisc,
      promoCode: appliedCode,
      total: remTotal
    };
    if (editingOpenOrderId) {
      const oIdx = db.openOrders.findIndex(o => o.id === editingOpenOrderId);
      if (oIdx >= 0) db.openOrders[oIdx] = remOrder;
      else db.openOrders.unshift(remOrder);
    } else {
      db.openOrders.unshift(remOrder);
    }
    autoSyncMasterSlices(['openOrders']);
  } else if (editingOpenOrderId) {
    db.openOrders = db.openOrders.filter(o => o.id !== editingOpenOrderId);
    autoSyncMasterSlices(['openOrders']);
  }

  saveDB();
  syncMasterEvent('POS_TRANSACTION_PAID', trx);
  autoSyncMasterSlices(['products']);

  const changeAmt = checkoutMethod === 'Cash' ? Math.max(0, checkoutCashReceived - paidTotal) : 0;
  resetPosCart();
  openPostPaymentReceiptModal(trx, changeAmt, remainingItems.length > 0);
}

// ==================== THERMAL RECEIPT PRINT (DIRECT BLE AUTO-RECONNECT) ====================
function buildEscPosReceiptBytes(trx) {
  const encoder = new TextEncoder();
  const lines = [];
  const sep = '--------------------------------\n';
  lines.push('\x1B\x40');
  lines.push('\x1B\x61\x01');
  lines.push('\x1B\x45\x01' + db.settings.outletName.toUpperCase() + '\n\x1B\x45\x00');
  lines.push(db.settings.outletAddress + '\n');
  if (db.settings.outletPhone) lines.push('Telp: ' + db.settings.outletPhone + '\n');
  if (db.settings.outletSocial) lines.push(db.settings.outletSocial + '\n');
  lines.push(sep);
  lines.push('\x1B\x61\x00');
  lines.push(`Nota : ${trx.id}\n`);
  lines.push(`Waktu : ${normalizeCloudDate(trx.date)} ${normalizeCloudTime(trx.time)}\n`);
  lines.push(`Kasir : ${trx.cashier}\n`);
  lines.push(`Tipe : ${trx.orderType} (${trx.tableOrCustomer})\n`);
  lines.push(sep);
  trx.items.forEach(i => {
    lines.push(`${i.name}\n`);
    lines.push(` ${i.qty} x ${formatRp(i.price)} = ${formatRp(i.price * i.qty)}\n`);
  });
  lines.push(sep);
  const totalItems = trx.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
  lines.push(`Total Pesanan: ${totalItems} item\n`);
  lines.push(`Subtotal : ${formatRp(trx.subtotal)}\n`);
  if (trx.discount > 0) lines.push(`Diskon : -${formatRp(trx.discount)}\n`);
  lines.push('\x1B\x45\x01' + `TOTAL : ${formatRp(trx.total)}\n` + '\x1B\x45\x00');
  lines.push(`Bayar : ${trx.paymentMethod}\n`);
  lines.push(sep);
  lines.push('\x1B\x61\x01' + db.settings.receiptFooter + '\n\n\n');
  lines.push('\x1D\x56\x41\x03');
  return encoder.encode(lines.join(''));
}

async function ensureBtPrinterConnected() {
  if (btPrinterCharacteristic && btPrinterDevice && btPrinterDevice.gatt && btPrinterDevice.gatt.connected) {
    return btPrinterCharacteristic;
  }
  if (!navigator.bluetooth) return null;
  try {
    let dev = btPrinterDevice;
    if (!dev && navigator.bluetooth.getDevices && db.settings.printerName) {
      const paired = await navigator.bluetooth.getDevices();
      dev = paired.find(d => d.name === db.settings.printerName) || paired[0] || null;
    }
    if (!dev) return null;
    btPrinterDevice = dev;
    const server = await dev.gatt.connect();
    const services = await server.getPrimaryServices();
    for (const svc of services) {
      const chars = await svc.getCharacteristics();
      for (const ch of chars) {
        if (ch.properties.write || ch.properties.writeWithoutResponse) {
          btPrinterCharacteristic = ch;
          return ch;
        }
      }
    }
  } catch (e) {}
  return null;
}

async function printReceipt(trx) {
  const char = await ensureBtPrinterConnected();
  if (char) {
    try {
      const bytes = buildEscPosReceiptBytes(trx);
      const chunkSize = 100;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        await char.writeValue(bytes.slice(i, i + chunkSize));
      }
      showToast(`Struk dicetak ke ${btPrinterDevice ? btPrinterDevice.name : 'Printer BT'}!`);
      return;
    } catch (e) {
      btPrinterCharacteristic = null;
    }

  const printArea = document.getElementById('printArea');
  const totalItems = trx.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);

    <hr/>
    ${trx.items.map(i => `<div>${esc(i.name)}<br/>${i.qty} x ${formatRp(i.price)} = ${formatRp(i.price * i.qty)}</div>`).join('')}

  printArea.classList.remove('hidden');
  window.print();

function filterByPeriod(dateStr, period) {
  const cleanDate = normalizeCloudDate(dateStr);
  if (!period || period === 'ALL' || period === 'all') return true;
  if (period === 'today') return cleanDate === todayISO();
  if (period === '7d' || period === '30d') {
    const d = new Date(cleanDate + 'T00:00:00');
    const now = new Date(todayISO() + 'T00:00:00');
    const diffDays = (now - d) / (1000 * 60 * 60 * 24);
    return period === '7d' ? (diffDays >= 0 && diffDays <= 7) : (diffDays >= 0 && diffDays <= 30);
  }
  const range = getSalesDateRange(period, reportCustomStart, reportCustomEnd);
  if (range.start && cleanDate < range.start) return false;
  if (range.end && cleanDate > range.end) return false;
  return true;
}

function getSalesDateRange(mode, customStart, customEnd) {
  const now = new Date();
  const toISO = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = toISO(now);
  if (mode === 'TODAY') return { start: today, end: today };
  if (mode === 'YESTERDAY') {
    const yest = new Date(now);
    yest.setDate(now.getDate() - 1);
    const yStr = toISO(yest);
    return { start: yStr, end: yStr };
  }
  if (mode === 'THIS_WEEK') {
    const dayOfWeek = now.getDay();
    const diffToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const mon = new Date(now);
    mon.setDate(now.getDate() + diffToMon);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    return { start: toISO(mon), end: toISO(sun) };
  }
  if (mode === 'LAST_WEEK') {
    const dayOfWeek = now.getDay();
    const diffToMon = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const thisMon = new Date(now);
    thisMon.setDate(now.getDate() + diffToMon);
    const lastMon = new Date(thisMon);
    lastMon.setDate(thisMon.getDate() - 7);
    const lastSun = new Date(thisMon);
    lastSun.setDate(thisMon.getDate() - 1);
    return { start: toISO(lastMon), end: toISO(lastSun) };
  }
  if (mode === 'THIS_MONTH') {
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { start: toISO(first), end: toISO(last) };
  }
  if (mode === 'LAST_MONTH') {
    const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const last = new Date(now.getFullYear(), now.getMonth(), 0);
    return { start: toISO(first), end: toISO(last) };
  }
  if (mode === 'CUSTOM') {
    return {
      start: customStart || today,
      end: customEnd || customStart || today
    };
  }
  return { start: '', end: '' };
}

function requestVoidPaidTransaction(trxId) {
  const trx = db.transactions.find(t => t.id === trxId && t.status === 'PAID');
  if (!trx) return;
  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px;">Pembatalan Transaksi Lunas</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
      Membatalkan nota <strong>${esc(trx.id)}</strong> (${formatRp(trx.total)}) akan mengembalikan stok produk dan membutuhkan PIN Owner / Manager.
    </p>
    <div style="margin-bottom:10px;">
      <label class="field-label">Alasan Pembatalan</label>
      <input id="paidVoidReason" type="text" class="styled-input" placeholder="Contoh: Salah input metode / Batal beli" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="field-label">PIN 4-Digit Owner / Manager</label>
      <input id="paidVoidPin" type="password" maxlength="4" class="styled-input" placeholder="****" />
    </div>
    <button class="btn btn-pink" style="width:100%;" onclick="confirmVoidPaidTransaction('${trx.id}')">Batalkan Transaksi Sekarang</button>
  `);
}

function confirmVoidPaidTransaction(trxId) {
  const reason = document.getElementById('paidVoidReason').value.trim() || 'Pembatalan nota lunas';
  const pin = document.getElementById('paidVoidPin').value.trim();
  const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && String(s.pin) === pin);
  if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);

  const trx = db.transactions.find(t => t.id === trxId);
  if (!trx) return;
  trx.status = 'CANCELLED';
  trx.voidReason = reason;
  trx.voidBy = approver.name;

  (trx.items || []).forEach(item => {
    const prod = db.products.find(p => p.id === item.id || p.sku === item.sku);
    if (prod) prod.stock += item.qty;
  });

  const auditEntry = {
    id: 'AUD-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    orderId: trx.id,
    itemName: `VOID NOTA (${formatRp(trx.total)})`,
    cashier: currentUser.name,
    authorizedBy: approver.name,
    reason
  };
  db.auditLogs.unshift(auditEntry);

  saveDB();
  syncMasterEvent('PAID_TRX_CANCELLED', { id: trx.id, reason, voidBy: approver.name });
  syncMasterEvent('AUDIT_VOID_ITEM', auditEntry);
  autoSyncMasterSlices(['products']);
  closeModal();
  renderWorkspace();
  showToast(`Transaksi ${trx.id} dibatalkan (Otorisasi: ${approver.name})`);
}

function reprintTransaction(trxId) {
  const trx = db.transactions.find(t => t.id === trxId);
  if (trx) printReceipt(trx);
}

function addDrawerMutation() {
  const type = document.getElementById('drawerType').value;
  const category = document.getElementById('drawerCat').value;

  if (!note) return showToast('Isi keterangan mutasi kas!', true);

  const entry = {
    id: 'CF-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    type,
    category,
    amount,
    note,
    pic: currentUser.name
  };
  db.cashflow.unshift(entry);
  saveDB();
  syncMasterEvent('CASHFLOW_ADDED', entry);
  renderWorkspace();
  showToast('Mutasi kas berhasil dicatat!');
}

function clockOutStaff(attId) {

  const tfSales = todayPaid.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
  const onlineSales = todayPaid.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);

  const todayCf = db.cashflow.filter(c => normalizeCloudDate(c.date) === todayISO());
  const drawerIn = todayCf.filter(c => c.type === 'IN').reduce((s, c) => s + c.amount, 0);
  const drawerOut = todayCf.filter(c => c.type === 'OUT').reduce((s, c) => s + c.amount, 0);

  area.innerHTML = `

      <h3 style="margin:0 0 4px;font-size:18px;">Tutup Kasir & Serah Terima Shift</h3>

        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Modal Awal Shift</span><strong>${formatRp(db.shift.openingCash || 0)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Penjualan Tunai (Cash)</span><strong>${formatRp(cashSales)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Penjualan QRIS / Transfer / Online</span><strong>${formatRp(qrisSales + tfSales + onlineSales)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;color:#065F46;"><span>Kas Masuk Tambahan</span><strong>+${formatRp(drawerIn)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:#BE185D;"><span>Kas Keluar / Setoran</span><strong>-${formatRp(drawerOut)}</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:900;border-top:1px solid rgba(11,46,35,0.15);padding-top:6px;">
          <span>Ekspektasi Uang Fisik Laci</span>
          <span>${formatRp(expectedCash)}</span>
        </div>
      </div>

      <div style="margin-bottom:10px;">

        <input id="closingActualCash" type="number" class="styled-input" value="${expectedCash}" oninput="document.getElementById('closingDiffText').textContent=formatRp((Number(this.value)||0)-${expectedCash})" />
      </div>
      <div style="margin-bottom:12px;font-size:13px;font-weight:800;">
        Selisih Kas Laci: <span id="closingDiffText">Rp 0</span>

          <input id="closingPinInput" type="password" maxlength="4" class="styled-input" placeholder="PIN 4-Digit" />

function shareClosingToWhatsApp(totalSales, cashSales, qrisSales, tfSales, onlineSales, expectedCash) {
  const actualCash = Number(document.getElementById('closingActualCash').value) || 0;
  const diff = actualCash - expectedCash;
  const msg =
    `*LAPORAN TUTUP KASIR — ${db.settings.outletName.toUpperCase()}*\n` +
    `Tanggal : ${todayISO()} (${nowTimeStr()})\n` +
    `Kasir : ${currentUser.name}\n` +
    `--------------------------------\n` +
    `Total Omzet : *${formatRp(totalSales)}*\n` +
    `• Cash : ${formatRp(cashSales)}\n` +
    `• QRIS : ${formatRp(qrisSales)}\n` +
    `• Transfer : ${formatRp(tfSales)}\n` +
    `• Online : ${formatRp(onlineSales)}\n` +
    `--------------------------------\n` +
    `Ekspektasi Laci : ${formatRp(expectedCash)}\n` +
    `Uang Fisik Laci : ${formatRp(actualCash)}\n` +
    `Selisih : ${formatRp(diff)}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function submitClosingShift(totalSales, cashSales, qrisSales, tfSales, onlineSales, expectedCash) {
  const pin = document.getElementById('closingPinInput').value.trim();
  if (pin !== String(currentUser.pin)) return showToast('PIN Kasir salah!', true);
  const actualCash = Number(document.getElementById('closingActualCash').value) || 0;
  const diff = actualCash - expectedCash;

  const closingData = {
    id: 'CLS-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    cashier: currentUser.name,
    openingCash: db.shift.openingCash || 0,
    cashSales,
    qrisSales,
    transferSales: tfSales,
    onlineSales,
    totalSales,
    expectedCash,
    actualCash,
    diff
  };

  db.closingHistory.unshift(closingData);
  db.shift = { isOpen: false, openedBy: '', openedAt: '', openingCash: 0 };
  saveDB();
  syncMasterEvent('SHIFT_CLOSED', closingData);
  showToast('Shift kasir berhasil ditutup!');
  forceSwitchUser();
}

function getSettlementDateRange() {
  const now = new Date();
  const day = now.getDay();
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const monThis = new Date(now);
  monThis.setDate(now.getDate() + diffToMon);
  const sunThis = new Date(monThis);
  sunThis.setDate(monThis.getDate() + 6);

  const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const monthNamesId = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  if (settlementPeriodMode === 'this_month') {
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { start: fmt(first), end: fmt(last), label: `Bulan Ini (${monthNamesId[now.getMonth()]} ${now.getFullYear()})` };
  }
  if (settlementPeriodMode === 'last_month') {
    const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const last = new Date(now.getFullYear(), now.getMonth(), 0);
    return { start: fmt(first), end: fmt(last), label: `Bulan Lalu (${monthNamesId[first.getMonth()]} ${first.getFullYear()})` };
  }
  if (settlementPeriodMode === 'pick_month') {
    const ym = settlementSelectedMonth || todayISO().slice(0, 7);
    const parts = ym.split('-');
    const y = Number(parts[0]) || now.getFullYear();
    const mIdx = (Number(parts[1]) || (now.getMonth() + 1)) - 1;
    const first = new Date(y, mIdx, 1);
    const last = new Date(y, mIdx + 1, 0);
    return { start: fmt(first), end: fmt(last), label: `Bulan ${monthNamesId[mIdx]} ${y}` };
  }
  if (settlementPeriodMode === 'this_week') {
    return { start: fmt(monThis), end: fmt(sunThis), label: 'Minggu Ini (Sen–Min)' };
  }
  if (settlementPeriodMode === 'last_week') {
    const monLast = new Date(monThis);
    monLast.setDate(monThis.getDate() - 7);
    const sunLast = new Date(monLast);
    sunLast.setDate(monLast.getDate() + 6);
    return { start: fmt(monLast), end: fmt(sunLast), label: 'Minggu Lalu (Sen–Min)' };
  }
  return { start: settlementCustomStart, end: settlementCustomEnd, label: `${settlementCustomStart} s/d ${settlementCustomEnd}` };
}

function renderSettlementSubtab(box) {
  const { start, end, label } = getSettlementDateRange();

    const d = normalizeCloudDate(t.date);
    return t.status === 'PAID' && d >= start && d <= end;
  });
  const totalPosOmzetPeriod = periodTrx.reduce((s, t) => s + (Number(t.total) || 0), 0);

  const periodCashflow = db.cashflow.filter(c => {
    const d = normalizeCloudDate(c.date);
    return d >= start && d <= end;
  });
  const cfSalesInTotal = periodCashflow
    .filter(c => c.type === 'IN' && (/sales|penjualan|setoran sales/i.test(c.category || '') || /sales|penjualan|setoran sales/i.test(c.note || '')))
    .reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const cfManualSettlements = periodCashflow.filter(c =>
    c.type === 'OUT' && (
      String(c.category || '').toLowerCase().includes('setoran brand') ||
      /transfer sales/i.test(c.note || '')
    )
  );
  const cfManualSettlementTotal = cfManualSettlements.reduce((s, c) => s + (Number(c.amount) || 0), 0);

  const autoWageTotal = db.attendance
    .filter(a => {
      const d = normalizeCloudDate(a.date);
      return d >= start && d <= end;
    })
    .reduce((s, a) => s + (a.wageEarned || 0), 0);
  const totalPeriodSalary = (db.manualPeriodSalary !== null && db.manualPeriodSalary !== undefined && db.manualPeriodSalary !== '')
    ? Number(db.manualPeriodSalary)
    : autoWageTotal;
  const activeBrands = getActiveBrands().filter(b => {
    const cfg = db.brandConfig[b] || {};
    return cfg.active !== false;
  });

  // Peta produk master berdasarkan SKU & Nama agar status Hitung_Porsi_Gaji & Kena_Komisi_Brand selalu akurat
  const prodBySku = new Map();
  const prodByName = new Map();
  (db.products || []).forEach(p => {
    if (p.sku) prodBySku.set(String(p.sku).trim().toLowerCase(), p);
    if (p.name) prodByName.set(String(p.name).trim().toLowerCase(), p);
  });

  const brandStats = activeBrands.map(brand => {
    const cfg = db.brandConfig[brand] || { commissionPct: 10, salarySharePct: 0, waNumber: '' };
    let qty = 0;
    let gross = 0;
    let commissionBase = 0;
    let salaryQtyBase = 0;
    periodTrx.forEach(t => {
      const discRatio = t.subtotal > 0 ? Math.max(0, (t.subtotal - (t.discount || 0)) / t.subtotal) : 1;
      (t.items || []).forEach(i => {
        if ((i.brand || 'Kopi Jiwara').toLowerCase() === brand.toLowerCase()) {
          const masterProd = prodBySku.get(String(i.sku || '').trim().toLowerCase()) || prodByName.get(String(i.name || '').trim().toLowerCase());
          const isCommEligible = masterProd ? (masterProd.includeCommissionShare !== false) : (i.includeCommissionShare !== false);
          const isSalEligible = masterProd ? (masterProd.includeSalaryShare !== false) : (i.includeSalaryShare !== false);
          const itemQty = Number(i.qty) || 0;
          const itemNet = Math.round((i.price * itemQty) * discRatio);
          qty += itemQty;
          gross += itemNet;
          if (isCommEligible) commissionBase += itemNet;
          if (isSalEligible) salaryQtyBase += itemQty;
        }
      });
    });
    const manualBrandPaid = cfManualSettlements
      .filter(c => (c.note || '').toLowerCase().includes(brand.toLowerCase()))
      .reduce((s, c) => s + (Number(c.amount) || 0), 0);
    return { brand, cfg, qty, gross, commissionBase, salaryQtyBase, manualBrandPaid };
  });

  const totalSalaryQtyAll = brandStats.reduce((s, b) => s + b.salaryQtyBase, 0);

  const rows = brandStats.map(b => {
    const commPct = Number(b.cfg.commissionPct) || 0;
    const commCut = Math.round(b.commissionBase * commPct / 100);
    const salPct = (totalSalaryQtyAll > 0 && b.salaryQtyBase > 0)
      ? ((b.salaryQtyBase / totalSalaryQtyAll) * 100)
      : 0;
    const salCut = (totalSalaryQtyAll > 0 && b.salaryQtyBase > 0)
      ? Math.round(totalPeriodSalary * (b.salaryQtyBase / totalSalaryQtyAll))
      : 0;
    const netTransfer = Math.max(0, b.gross - commCut - salCut);
    return { ...b, commPct, commCut, salPct, salCut, netTransfer };
  });

  box.innerHTML = `

        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <button type="button" class="btn btn-pink btn-sm" onclick="openManualCashflowSettlementModal('${esc(label)}')">+ Catat Settlement Manual (Arus Kas)</button>
          <select class="styled-select" style="width:auto;" onchange="settlementPeriodMode=this.value;renderWorkspace()">
            <option value="this_month" ${settlementPeriodMode === 'this_month' ? 'selected' : ''}>Bulan Ini (Default)</option>
            <option value="last_month" ${settlementPeriodMode === 'last_month' ? 'selected' : ''}>Bulan Lalu</option>
            <option value="pick_month" ${settlementPeriodMode === 'pick_month' ? 'selected' : ''}>Pilih Bulan Tertentu</option>
            <option value="this_week" ${settlementPeriodMode === 'this_week' ? 'selected' : ''}>Minggu Ini</option>
            <option value="last_week" ${settlementPeriodMode === 'last_week' ? 'selected' : ''}>Minggu Lalu</option>
            <option value="custom" ${settlementPeriodMode === 'custom' ? 'selected' : ''}>Rentang Tanggal</option>

          ${settlementPeriodMode === 'pick_month' ? `

          ` : ''}
          ${settlementPeriodMode === 'custom' ? `

            <input type="date" class="styled-input" style="width:auto;" value="${settlementCustomEnd}" onchange="settlementCustomEnd=this.value;renderWorkspace()" />

function recalcManualSettlementModal() {
  const brand = document.getElementById('manStlBrand').value;
  const period = document.getElementById('manStlPeriod').value.trim();
  const gross = Number(document.getElementById('manStlGross').value) || 0;
  const commPct = Number(document.getElementById('manStlCommPct').value) || 0;
  const salCut = Number(document.getElementById('manStlSalCut').value) || 0;

  if (gross > 0) {
    const commCut = Math.round(gross * commPct / 100);
    const net = Math.max(0, gross - commCut - salCut);
    document.getElementById('manStlNet').value = net;
  }
  const noteEl = document.getElementById('manStlNote');
  if (noteEl && /^Transfer Sales /i.test(noteEl.value)) {
    noteEl.value = `Transfer Sales ${brand} (${period})`;
  }
}

function submitManualCashflowSettlement() {
  const dateStr = document.getElementById('manStlDate').value || todayISO();
  const brand = document.getElementById('manStlBrand').value;
  const periodLabel = document.getElementById('manStlPeriod').value.trim() || 'Bulanan';
  const grossInput = Number(document.getElementById('manStlGross').value) || 0;
  const commPct = Number(document.getElementById('manStlCommPct').value) || 0;
  const salCut = Number(document.getElementById('manStlSalCut').value) || 0;
  const netTransfer = Number(document.getElementById('manStlNet').value) || 0;
  const note = document.getElementById('manStlNote').value.trim() || `Transfer Sales ${brand} (${periodLabel})`;

  if (netTransfer <= 0) return showToast('Nominal transfer wajib diisi lebih dari Rp 0!', true);

  const commCut = grossInput > 0 ? Math.round(grossInput * commPct / 100) : 0;
  const effectiveGross = grossInput > 0 ? grossInput : (netTransfer + commCut + salCut);

  const rec = {
    id: 'STL-' + Date.now().toString().slice(-6),
    date: dateStr,
    periodLabel,
    brand,
    grossSales: effectiveGross,
    commissionPct: commPct,
    commissionCut: commCut,
    salaryCut: salCut,
    netTransfer,
    pic: currentUser.name
  };
  db.brandSettlements.unshift(rec);

  const cfEntry = {
    id: 'CF-' + Date.now().toString().slice(-6),
    date: dateStr,
    time: nowTimeStr(),
    type: 'OUT',
    category: 'Setoran Brand Owner',
    amount: netTransfer,
    note,
    pic: currentUser.name
  };
  db.cashflow.unshift(cfEntry);

  saveDB();
  syncMasterEvent('BRAND_SETTLEMENT_PAID', rec);
  syncMasterEvent('CASHFLOW_ADDED', cfEntry);
  closeModal();
  renderWorkspace();
  showToast(`Settlement manual ${brand} (${formatRp(netTransfer)}) tercatat ke Arus Kas!`);
}

function confirmEditBrand(oldName) {
  const isMainBrand = oldName.toLowerCase() === 'kopi jiwara';
  const rawNewName = document.getElementById('editBrandNameInput').value.trim();
  const newName = isMainBrand ? oldName : (rawNewName || oldName);
  const comm = Number(document.getElementById('editBrandCommInput').value) || 0;
  const wa = document.getElementById('editBrandWaInput').value.trim();
  const isActive = isMainBrand ? true : (document.getElementById('editBrandStatusInput').value === 'active');

  const list = getActiveBrands();
  if (newName.toLowerCase() !== oldName.toLowerCase() && list.some(b => b.toLowerCase() === newName.toLowerCase())) {
    return showToast(`Nama brand "${newName}" sudah terdaftar!`, true);
  }

  db.brands = list.map(b => b === oldName ? newName : b);
  const prevCfg = db.brandConfig[oldName] || { salarySharePct: 0 };
  if (newName !== oldName) {
    delete db.brandConfig[oldName];
    db.products.forEach(p => {
      if ((p.brand || '').toLowerCase() === oldName.toLowerCase()) p.brand = newName;
    });
  }
  db.brandConfig[newName] = {
    ...prevCfg,
    commissionPct: comm,
    waNumber: wa,
    active: isActive
  };

  saveDB();
  autoSyncMasterSlices(['categories', 'products']);
  closeModal();
  renderWorkspace();
  showToast(`Detail brand "${newName}" diperbarui!`);
}

function sendBrandSettlementWA(brand, periodLabel, qty, grossSales, commissionPct, commissionCut, salaryCut, netTransfer) {
  const cfg = db.brandConfig[brand] || {};
  let digits = String(cfg.waNumber || '').replace(/\D/g, '');
  if (digits.startsWith('0')) digits = '62' + digits.slice(1);
  else if (digits.startsWith('8')) digits = '62' + digits;

  const msg =
    `*BERITA ACARA SETTLEMENT — ${db.settings.outletName.toUpperCase()}*\n` +
    `Brand : *${brand}*\n` +
    `Periode : ${periodLabel}\n` +
    `--------------------------------\n` +
    `Item Terjual : ${qty} porsi\n` +
    `Omzet Kotor : ${formatRp(grossSales)}\n` +
    `Pot. Komisi (${commissionPct}%) : -${formatRp(commissionCut)}\n` +
    `Porsi Beban Gaji : -${formatRp(salaryCut)}\n` +
    `--------------------------------\n` +
    `*NET TRANSFER : ${formatRp(netTransfer)}*\n\n` +
    `Terima kasih atas kerja samanya!`;

  const url = digits ? `https://wa.me/${digits}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

  const item = db.inventory.find(i => i.id === invId);
  if (!item) return;
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Update Stok: ${esc(item.name)}</h3><button class="close-circle" onclick="closeModal()">x</button></div>

      <select id="adjStockType" class="styled-select">
        <option value="Restock Masuk (+)">Restock Masuk (+)</option>
        <option value="Pemakaian / Rusak (-)">Pemakaian / Rusak (-)</option>
        <option value="Set Stok Opname Fisik">Set Stok Opname Fisik (=)</option>
      </select>
    </div>
    <div style="margin-bottom:14px;"><label class="field-label">Jumlah (${esc(item.unit)})</label><input id="adjStockQty" type="number" class="styled-input" min="0" /></div>
    <button class="btn btn-dark" style="width:100%;" onclick="confirmAdjustStock('${item.id}')">Simpan Perubahan Stok</button>
  `);
}

function confirmAdjustStock(invId) {
  const item = db.inventory.find(i => i.id === invId);
  if (!item) return;
  const type = document.getElementById('adjStockType').value;
  const qty = Number(document.getElementById('adjStockQty').value) || 0;
  if (type.includes('(+)')) item.stock += qty;
  else if (type.includes('(-)')) item.stock = Math.max(0, item.stock - qty);
  else item.stock = qty;
  item.lastOpname = todayISO();

  const logEntry = {
    id: 'LOG-' + Date.now().toString().slice(-6),
    date: todayISO(),
    time: nowTimeStr(),
    itemName: item.name,
    type,
    qty,
    afterStock: item.stock,
    pic: currentUser.name
  };
  db.stockLogs.unshift(logEntry);
  saveDB();
  syncMasterEvent('INVENTORY_STOCK_ADJUSTED', logEntry);
  autoSyncMasterSlices(['inventory']);
  closeModal();
  renderWorkspace();
  showToast('Stok berhasil diperbarui!');
}

function handleLogoUpload(e) {
  const file = e.target.files[0];

function cleanDate_(val) {
  if (val === undefined || val === null || val === '') return '';
  if (val instanceof Date) {
    if (val.getFullYear() <= 1900) return '';
    return Utilities.formatDate(val, 'Asia/Jakarta', 'yyyy-MM-dd');
  }
  var s = String(val).trim();
  var m = s.match(/^(\\d{4}-\\d{2}-\\d{2})/);
  return m ? m[1] : s;
}

function cleanTime_(val) {
  if (val === undefined || val === null || val === '') return '';
  if (val instanceof Date) {
    return Utilities.formatDate(val, 'Asia/Jakarta', 'HH:mm');
  }
  var s = String(val).trim();
  if (s === '-') return '-';
  var m = s.match(/(\\d{1,2}):(\\d{2})(?::\\d{2})?/);
  if (m) return ('0' + m[1]).slice(-2) + ':' + ('0' + m[2]).slice(-2);
  return s;
}

function readSheetObjects(ss, name) {
  var sh = ss.getSheetByName(name);
  if (!sh || sh.getLastRow() < 2) return [];
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rows = sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).getValues();
  return rows.map(function(r) {
    var obj = {};
    headers.forEach(function(h, idx) { obj[h] = r[idx]; });
    return obj;
  });
}

function writeSheetByHeaders(ss, name, defaultHeaders, rowsData) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).clearContent();
  }
  if (rowsData && rowsData.length > 0) {
    var matrix = rowsData.map(function(rowObj) {
      return headers.map(function(h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
    });
    var range = sh.getRange(2, 1, matrix.length, headers.length);
    range.setValues(matrix);
    headers.forEach(function(h, idx) {
      if (h === 'Tanggal' || h === 'Jam' || h === 'Jam_Masuk' || h === 'Jam_Pulang') {
        sh.getRange(2, idx + 1, matrix.length, 1).setNumberFormat('@');
      }
    });
  }
}

function appendRowByHeaders(ss, name, defaultHeaders, rowObj) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rowArr = headers.map(function(h) {
    var val = rowObj[h] !== undefined ? rowObj[h] : '';
    if (h === 'Tanggal') return cleanDate_(val);
    if (h === 'Jam' || h === 'Jam_Masuk' || h === 'Jam_Pulang') return cleanTime_(val);
    return val;
  });
  var nextRow = sh.getLastRow() + 1;
  sh.getRange(nextRow, 1, 1, rowArr.length).setValues([rowArr]);
  headers.forEach(function(h, idx) {
    if (h === 'Tanggal' || h === 'Jam' || h === 'Jam_Masuk' || h === 'Jam_Pulang') {
      sh.getRange(nextRow, idx + 1).setNumberFormat('@');
    }
  });
}

  var manualSalaryRaw = props.getProperty('MANUAL_PERIOD_SALARY');

    brands: brandsJson ? JSON.parse(brandsJson) : null,
    brandConfig: brandConfigJson ? JSON.parse(brandConfigJson) : null,
    manualPeriodSalary: (manualSalaryRaw !== null && manualSalaryRaw !== '') ? Number(manualSalaryRaw) : null,
    products: products, categories: categories, inventory: inventory, staff: staff, promos: promos, customers: customers,

    cashflow: cashflow, attendance: attendance, closingHistory: closingHistory, auditLogs: auditLogs, stockLogs: stockLogs, brandSettlements: brandSettlements
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(10000);
  } catch (err) {}
  try {
    setupMasterJiwaraSheets();
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var props = PropertiesService.getScriptProperties();
    var body = JSON.parse(e.postData.contents);
    var type = body.eventType;
    var d = body.data || {};

    if (type === 'OUTLET_PROFILE_UPDATED') {
      props.setProperty('OUTLET_PROFILE_JSON', JSON.stringify(d));
    } else if (type === 'POS_TRANSACTION_PAID') {
      var existing = readSheetObjects(ss, 'POS_TRANSAKSI').some(function(r) { return String(r.No_Nota).trim() === String(d.id).trim(); });
      if (!existing) {
        appendRowByHeaders(ss, 'POS_TRANSAKSI',
          ['No_Nota', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Subtotal', 'Diskon', 'Kode_Promo', 'Total_Bayar', 'Metode_Bayar', 'Status'],
          {
            No_Nota: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Tipe_Order: d.orderType,
            Meja_Pelanggan: d.tableOrCustomer || '-', No_WA: d.customerPhone || '',
            Kasir: d.cashier, Subtotal: d.subtotal, Diskon: d.discount || 0,
            Kode_Promo: d.promoCode || '-', Total_Bayar: d.total, Metode_Bayar: d.paymentMethod, Status: 'PAID'
          }
        );
        (d.items || []).forEach(function(it) {
          var sub = (it.price || 0) * (it.qty || 1);
          var hpp = (it.cost || 0) * (it.qty || 1);
          appendRowByHeaders(ss, 'POS_ITEM_TERJUAL',
            ['No_Nota', 'Tanggal', 'Jam', 'SKU', 'Nama_Menu', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Qty', 'Harga_Satuan', 'HPP_Satuan', 'Subtotal_Item', 'Total_HPP', 'Laba_Kotor_Item'],
            {
              No_Nota: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), SKU: it.sku || '-', Nama_Menu: it.name,
              Brand: it.brand || 'Kopi Jiwara',
              Kena_Komisi_Brand: it.includeCommissionShare === false ? 'Tidak' : 'Ya',
              Hitung_Porsi_Gaji: it.includeSalaryShare === false ? 'Tidak' : 'Ya',
              Qty: it.qty, Harga_Satuan: it.price, HPP_Satuan: it.cost || 0,
              Subtotal_Item: sub, Total_HPP: hpp, Laba_Kotor_Item: sub - hpp
            }
          );
        });
      }
    } else if (type === 'PAID_TRX_CANCELLED') {
      var shTrx = ss.getSheetByName('POS_TRANSAKSI');
      if (shTrx && shTrx.getLastRow() > 1) {
        var hdrs = shTrx.getRange(1, 1, 1, shTrx.getLastColumn()).getValues()[0].map(function(h) { return String(h).trim(); });
        var cNota = hdrs.indexOf('No_Nota') + 1;
        var cStat = hdrs.indexOf('Status') + 1;
        if (cNota > 0 && cStat > 0) {
          var vals = shTrx.getRange(2, cNota, shTrx.getLastRow() - 1, 1).getValues();
          for (var i = 0; i < vals.length; i++) {
            if (String(vals[i][0]).trim() === String(d.id).trim()) shTrx.getRange(i + 2, cStat).setValue('CANCELLED');
          }
        }
      }
    } else if (type === 'CASHFLOW_ADDED') {
      var existingCf = readSheetObjects(ss, 'ARUS_KAS_CASHFLOW').some(function(r) { return String(r.ID_Kas).trim() === String(d.id).trim(); });
      if (!existingCf) {
        var isOut = d.type === 'OUT';
        appendRowByHeaders(ss, 'ARUS_KAS_CASHFLOW',
          ['ID_Kas', 'Tanggal', 'Jam', 'Kategori_Kas', 'Keterangan', 'Terima_Dari_Kepada', 'Debit_Masuk', 'Kredit_Keluar', 'No_Nota_Ref', 'PIC'],
          {
            ID_Kas: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Kategori_Kas: d.category || (isOut ? 'Biaya Operasional' : 'Kas Masuk Tambahan'),
            Keterangan: d.note, Terima_Dari_Kepada: d.pic || '-',
            Debit_Masuk: isOut ? 0 : d.amount, Kredit_Keluar: isOut ? d.amount : 0, No_Nota_Ref: '-', PIC: d.pic
          }
        );
      }
    } else if (type === 'ATTENDANCE_CLOCK_IN') {
      var existingAtt = readSheetObjects(ss, 'ABSENSI_KARYAWAN').some(function(r) {
        return cleanDate_(r.Tanggal) === cleanDate_(d.date) && String(r.Nama_Pegawai).trim() === String(d.staffName).trim();
      });
      if (!existingAtt) {
        appendRowByHeaders(ss, 'ABSENSI_KARYAWAN',
          ['Tanggal', 'Nama_Pegawai', 'Jabatan', 'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian', 'Status'],
          { Tanggal: cleanDate_(d.date), Nama_Pegawai: d.staffName, Jabatan: d.role, Jam_Masuk: cleanTime_(d.clockIn), Jam_Pulang: '-', Upah_Harian: d.wageEarned, Status: 'Hadir' }
        );
      }
    } else if (type === 'ATTENDANCE_CLOCK_OUT') {
      var shAtt = ss.getSheetByName('ABSENSI_KARYAWAN');
      if (shAtt && shAtt.getLastRow() > 1) {
        var av = shAtt.getRange(2, 1, shAtt.getLastRow() - 1, 6).getValues();
        for (var k = av.length - 1; k >= 0; k--) {
          if (cleanDate_(av[k][0]) === cleanDate_(d.date) && String(av[k][1]).trim() === String(d.staffName).trim()) {
            var cellOut = shAtt.getRange(k + 2, 5);
            cellOut.setValue(cleanTime_(d.clockOut));
            cellOut.setNumberFormat('@');
            break;
          }
        }
      }
    } else if (type === 'SHIFT_CLOSED') {
      var existingCls = readSheetObjects(ss, 'CLOSING_SHIFT').some(function(r) { return String(r.ID_Closing).trim() === String(d.id).trim(); });
      if (!existingCls) {
        appendRowByHeaders(ss, 'CLOSING_SHIFT',
          ['ID_Closing', 'Tanggal', 'Jam', 'Kasir', 'Modal_Awal', 'Sales_Cash', 'Sales_QRIS', 'Sales_Transfer', 'Sales_Online', 'Total_Omzet', 'Ekspektasi_Cash_Laci', 'Uang_Fisik_Laci', 'Selisih_Laci'],
          {
            ID_Closing: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Kasir: d.cashier,
            Modal_Awal: d.openingCash, Sales_Cash: d.cashSales, Sales_QRIS: d.qrisSales,
            Sales_Transfer: d.transferSales, Sales_Online: d.onlineSales, Total_Omzet: d.totalSales,
            Ekspektasi_Cash_Laci: d.expectedCash, Uang_Fisik_Laci: d.actualCash, Selisih_Laci: d.diff
          }
        );
      }
    } else if (type === 'AUDIT_VOID_ITEM') {
      var existingAud = readSheetObjects(ss, 'AUDIT_OTORISASI').some(function(r) { return String(r.ID_Audit).trim() === String(d.id).trim(); });
      if (!existingAud) {
        appendRowByHeaders(ss, 'AUDIT_OTORISASI',
          ['ID_Audit', 'Tanggal', 'Jam', 'No_Order_Nota', 'Tindakan_Item', 'Kasir', 'Otorisasi_Oleh', 'Alasan'],
          { ID_Audit: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), No_Order_Nota: d.orderId, Tindakan_Item: d.itemName, Kasir: d.cashier, Otorisasi_Oleh: d.authorizedBy, Alasan: d.reason }
        );
      }
    } else if (type === 'INVENTORY_STOCK_ADJUSTED') {
      var existingLog = readSheetObjects(ss, 'LOG_STOK_GUDANG').some(function(r) { return String(r.ID_Log).trim() === String(d.id).trim(); });
      if (!existingLog) {
        appendRowByHeaders(ss, 'LOG_STOK_GUDANG',
          ['ID_Log', 'Tanggal', 'Jam', 'Nama_Bahan', 'Jenis_Mutasi', 'Jumlah', 'Sisa_Stok', 'PIC'],
          { ID_Log: d.id, Tanggal: cleanDate_(d.date), Jam: cleanTime_(d.time), Nama_Bahan: d.itemName, Jenis_Mutasi: d.type, Jumlah: d.qty, Sisa_Stok: d.afterStock, PIC: d.pic }
        );
      }
    } else if (type === 'BRAND_SETTLEMENT_PAID') {
      var existingStl = readSheetObjects(ss, 'SETTLEMENT_BRAND').some(function(r) { return String(r.ID_Settlement).trim() === String(d.id).trim(); });
      if (!existingStl) {
        appendRowByHeaders(ss, 'SETTLEMENT_BRAND',
          ['ID_Settlement', 'Tanggal', 'Periode_Mingguan', 'Brand', 'Omzet_Kotor', 'Komisi_Pct', 'Potongan_Komisi_Rp', 'Porsi_Beban_Gaji_Rp', 'Net_Wajib_Transfer_Rp', 'Status_Transfer', 'PIC'],
          {
            ID_Settlement: d.id, Tanggal: cleanDate_(d.date), Periode_Mingguan: d.periodLabel, Brand: d.brand,
            Omzet_Kotor: d.grossSales, Komisi_Pct: d.commissionPct, Potongan_Komisi_Rp: d.commissionCut,
            Porsi_Beban_Gaji_Rp: d.salaryCut, Net_Wajib_Transfer_Rp: d.netTransfer, Status_Transfer: 'Sudah Transfer', PIC: d.pic
          }
        );
      }
    } else if (type === 'SYNC_MASTER_SNAPSHOT') {
      if (d.brands) props.setProperty('BRANDS_LIST_JSON', JSON.stringify(d.brands));
      if (d.brandConfig) props.setProperty('BRAND_CONFIG_JSON', JSON.stringify(d.brandConfig));
      if (d.manualPeriodSalary !== undefined) {
        if (d.manualPeriodSalary === null) props.deleteProperty('MANUAL_PERIOD_SALARY');
        else props.setProperty('MANUAL_PERIOD_SALARY', String(d.manualPeriodSalary));
      }
      if (d.products) {
        writeSheetByHeaders(ss, 'MASTER_MENU',
          ['SKU', 'Nama_Menu', 'Kategori', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Satuan_Jual', 'Harga_Jual', 'HPP_Modal', 'Stok_Sistem', 'Favorit', 'Status'],
          d.products.map(function(p) {
            return {
              SKU: p.sku, Nama_Menu: p.name, Kategori: p.category, Brand: p.brand,
              Kena_Komisi_Brand: p.includeCommissionShare === false ? 'Tidak' : 'Ya',
              Hitung_Porsi_Gaji: p.includeSalaryShare === false ? 'Tidak' : 'Ya',
              Satuan_Jual: 'Porsi', Harga_Jual: p.price, HPP_Modal: p.cost,
              Stok_Sistem: p.stock, Favorit: p.isFavorite ? 'Ya' : 'Tidak', Status: p.active === false ? 'Nonaktif' : 'Aktif'
            };
          })
        );
      }
      if (d.categories) {
        writeSheetByHeaders(ss, 'MASTER_KATEGORI', ['Urutan', 'Nama_Kategori'],
          d.categories.map(function(c, i) { return { Urutan: i + 1, Nama_Kategori: c }; })
        );
      }
      if (d.inventory) {
        writeSheetByHeaders(ss, 'GUDANG_STOK',
          ['Kode_Bahan', 'Nama_Bahan', 'Kategori', 'Stok_Sistem', 'Min_Stok', 'Satuan', 'Status_Stok', 'Update_Terakhir'],
          d.inventory.map(function(i) {
            return {
              Kode_Bahan: i.code, Nama_Bahan: i.name, Kategori: i.category,
              Stok_Sistem: i.stock, Min_Stok: i.minStock, Satuan: i.unit,
              Status_Stok: Number(i.stock) <= Number(i.minStock) ? 'Perlu Restock' : 'Aman',
              Update_Terakhir: cleanDate_(i.lastOpname)
            };
          })
        );
      }
      if (d.staff) {
        writeSheetByHeaders(ss, 'MASTER_PEGAWAI',
          ['ID_Staf', 'Nama_Pegawai', 'Jabatan', 'PIN_4_Digit', 'Upah_Harian', 'Status'],
          d.staff.map(function(s) {
            return { ID_Staf: s.id, Nama_Pegawai: s.name, Jabatan: s.role, PIN_4_Digit: s.pin, Upah_Harian: s.dailyWage, Status: s.active === false ? 'Nonaktif' : 'Aktif' };
          })
        );
      }
      if (d.promos) {
        writeSheetByHeaders(ss, 'MASTER_PROMO',
          ['Kode_Promo', 'Judul_Promo', 'Jenis_Potongan', 'Nilai_Potongan', 'Min_Belanja', 'Berlaku_Sampai', 'Status'],
          d.promos.map(function(p) {
            return { Kode_Promo: p.code, Judul_Promo: p.name, Jenis_Potongan: p.type, Nilai_Potongan: p.value, Min_Belanja: p.minOrder || 0, Berlaku_Sampai: cleanDate_(p.validUntil), Status: p.active === false ? 'Nonaktif' : 'Aktif' };
          })
        );
      }
      if (d.customers) {
        writeSheetByHeaders(ss, 'CRM_PELANGGAN',
          ['ID_Pelanggan', 'Nama_Pelanggan', 'No_WA', 'Tier_Member', 'Kunjungan', 'Total_Belanja', 'Voucher_Khusus', 'Potongan_Voucher', 'Berlaku_Sampai'],
          d.customers.map(function(c) {
            return {
              ID_Pelanggan: c.id, Nama_Pelanggan: c.name, No_WA: c.phone || '', Tier_Member: c.tier || 'Regular',
              Kunjungan: c.visits || 0, Total_Belanja: c.totalSpend || 0, Voucher_Khusus: c.specialVoucher || '',
              Potongan_Voucher: c.voucherDiscount || 0, Berlaku_Sampai: cleanDate_(c.voucherExpiry) || '2026-12-31'
            };
          })
        );
      }
      if (d.openOrders !== undefined) {
        writeSheetByHeaders(ss, 'OPEN_ORDERS',
          ['ID_Order', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'No_WA', 'Kasir', 'Total_Tagihan', 'JSON_Items'],
          d.openOrders.map(function(o) {
            return { ID_Order: o.id, Tanggal: cleanDate_(o.date), Jam: cleanTime_(o.time), Tipe_Order: o.orderType, Meja_Pelanggan: o.tableOrCustomer || '-', No_WA: o.customerPhone || '', Kasir: o.cashier, Total_Tagihan: o.total, JSON_Items: JSON.stringify(o.items || []) };
          })
        );
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ status: 'ok', eventType: type })).setMimeType(ContentService.MimeType.JSON);
  } finally {
    try { lock.releaseLock(); } catch (err) {}
  }
}`;

  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px;">Skrip Google Apps Script v3.3 (16 Sheet + Lock Guard)</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
      Tempel kode ini ke <strong>Extensions &rarr; Apps Script</strong> di file Google Sheets Anda, lalu pilih <strong>Deploy &rarr; Manage deployments &rarr; Edit &rarr; Version: New version &rarr; Deploy</strong>.
    </p>
    <textarea id="gasCodeBox" readonly style="width:100%;height:240px;font-family:monospace;font-size:11px;padding:10px;border-radius:12px;border:1px solid var(--border-glass);background:#0B2E23;color:#FACC15;">${esc(scriptCode)}</textarea>
    <button class="btn btn-dark" style="width:100%;margin-top:10px;" onclick="navigator.clipboard.writeText(document.getElementById('gasCodeBox').value);showToast('Skrip Google Sheets v3.3 berhasil disalin!')">Salin Skrip v3.3</button>
  `);
}

                            <button type="button" class="btn btn-soft btn-sm" style="padding:4px 8px;" onclick="moveCategoryOrder(${fullIdx}, -1)" ${fullIdx <= 1 ? 'disabled' : ''}>▲</button>

          <div style="display:flex;gap:6px;">
            <button class="btn btn-soft btn-sm" onclick="if(prodPage>1){prodPage--;renderWorkspace()}" ${prodPage <= 1 ? 'disabled' : ''}>Sebelumnya</button>
            <button class="btn btn-soft btn-sm" onclick="if(prodPage<${prodTotalPages}){prodPage++;renderWorkspace()}" ${prodPage >= prodTotalPages ? 'disabled' : ''}>Berikutnya</button>

function addMenuCategory() {
  const val = document.getElementById('newCatNameInput').value.trim();
  if (!val) return showToast('Masukkan nama kategori!', true);
  db.categories = normalizeUniqueCategories([...db.categories, val]);
  saveDB();
  autoSyncMasterSlices(['categories']);
  renderWorkspace();
  showToast(`Kategori "${val}" ditambahkan!`);
}

function moveCategoryOrder(fromIdx, delta) {
  const arr = normalizeUniqueCategories([...db.categories, ...db.products.map(p => p.category).filter(Boolean)]);
  const toIdx = fromIdx + delta;
  if (fromIdx < 1 || toIdx < 1 || toIdx >= arr.length) return;
  const moved = arr.splice(fromIdx, 1)[0];
  arr.splice(toIdx, 0, moved);
  db.categories = arr;
  saveDB();
  autoSyncMasterSlices(['categories']);
  renderWorkspace();
  showToast(`Urutan "${moved}" diperbarui!`);
}

function jumpCategoryOrder(fromIdx, targetPos1Based) {
  const arr = normalizeUniqueCategories([...db.categories, ...db.products.map(p => p.category).filter(Boolean)]);
  const targetIdx = Math.max(1, Math.min(arr.length - 1, (Number(targetPos1Based) || 2) - 1));
  if (fromIdx < 1 || fromIdx === targetIdx) return;
  const moved = arr.splice(fromIdx, 1)[0];
  arr.splice(targetIdx, 0, moved);
  db.categories = arr;
  saveDB();
  autoSyncMasterSlices(['categories']);
  renderWorkspace();
  showToast(`"${moved}" dipindah ke urutan #${targetIdx + 1}`);
}

function renameMenuCategory(oldName) {
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Ubah Nama Kategori</h3><button class="close-circle" onclick="closeModal()">x</button></div>
    <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori Baru</label><input id="renameCatInput" type="text" class="styled-input" value="${esc(oldName)}" /></div>
    <button class="btn btn-dark" style="width:100%;" onclick="confirmRenameCategory('${esc(oldName)}')">Simpan Nama Baru</button>
  `);
}

function confirmRenameCategory(oldName) {
  const newName = document.getElementById('renameCatInput').value.trim();
  if (!newName) return showToast('Nama tidak boleh kosong!', true);
  db.categories = normalizeUniqueCategories(db.categories.map(c => c === oldName ? newName : c));
  db.products.forEach(p => { if (p.category === oldName) p.category = newName; });
  saveDB();
  autoSyncMasterSlices(['categories', 'products']);
  closeModal();
  renderWorkspace();
  showToast('Nama kategori diperbarui!');
}

function deleteMenuCategory(catName) {
  const fallback = db.categories.find(c => c !== 'Favorit' && c !== catName) || 'Kopi Jiwara';
  db.categories = normalizeUniqueCategories(db.categories.filter(c => c !== catName));
  db.products.forEach(p => { if (p.category === catName) p.category = fallback; });
  saveDB();
  autoSyncMasterSlices(['categories', 'products']);
  renderWorkspace();
  showToast(`Kategori "${catName}" dihapus.`);
}

function openProductFormModal(prodId = null) {
  const p = prodId ? db.products.find(x => x.id === prodId) : null;
  const cats = normalizeUniqueCategories([...db.categories, ...db.products.map(x => x.category)]).filter(c => c !== 'Favorit');
  const brands = getActiveBrands().filter(b => {
    const cfg = db.brandConfig[b] || {};
    return cfg.active !== false || (p && p.brand === b);
  });

  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px;">${p ? 'Edit Produk Menu' : 'Tambah Produk Menu Baru'}</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:10px;">
      <div><label class="field-label">Kode SKU</label><input id="pfSku" type="text" class="styled-input" value="${esc(p ? p.sku : 'KJ-' + (db.products.length + 1))}" /></div>
      <div><label class="field-label">Nama Menu</label><input id="pfName" type="text" class="styled-input" value="${esc(p ? p.name : '')}" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div>
        <label class="field-label">Kategori</label>
        <select id="pfCat" class="styled-select">
          ${cats.map(c => `<option value="${esc(c)}" ${p && p.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="field-label">Brand Owner</label>
        <select id="pfBrand" class="styled-select">
          ${brands.map(b => `<option value="${esc(b)}" ${p && p.brand === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;">
      <div><label class="field-label">Harga Jual (Rp)</label><input id="pfPrice" type="number" class="styled-input" value="${p ? p.price : 18000}" /></div>
      <div><label class="field-label">HPP Modal (Rp)</label><input id="pfCost" type="number" class="styled-input" value="${p ? p.cost : 7000}" /></div>
      <div><label class="field-label">Stok Sistem</label><input id="pfStock" type="number" class="styled-input" value="${p ? p.stock : 50}" /></div>
    </div>
    <div style="background:var(--green-soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:7px;font-size:12px;">
      <label style="display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;">
        <input id="pfFav" type="checkbox" ${p && p.isFavorite ? 'checked' : ''} /> Tampilkan di Tab Favorit Kasir
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;">
        <input id="pfComm" type="checkbox" ${!p || p.includeCommissionShare !== false ? 'checked' : ''} /> Masuk Hitungan Potongan Komisi Brand (%)
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;">
        <input id="pfSal" type="checkbox" ${!p || p.includeSalaryShare !== false ? 'checked' : ''} /> Masuk Hitungan Pembagian % Beban Gaji Brand
      </label>
    </div>
    <button class="btn btn-dark" style="width:100%;" onclick="saveProductForm('${p ? p.id : ''}')">Simpan Produk</button>
  `);
}

function saveProductForm(prodId) {
  const sku = document.getElementById('pfSku').value.trim();
  const name = document.getElementById('pfName').value.trim();
  const category = document.getElementById('pfCat').value;
  const brand = document.getElementById('pfBrand').value;
  const price = Number(document.getElementById('pfPrice').value) || 0;
  const cost = Number(document.getElementById('pfCost').value) || 0;
  const stock = Number(document.getElementById('pfStock').value) || 0;
  const isFavorite = document.getElementById('pfFav').checked;
  const includeCommissionShare = document.getElementById('pfComm').checked;
  const includeSalaryShare = document.getElementById('pfSal').checked;

  if (!name) return showToast('Nama menu wajib diisi!', true);

  if (prodId) {
    const p = db.products.find(x => x.id === prodId);
    if (p) {
      Object.assign(p, { sku, name, category, brand, price, cost, stock, isFavorite, includeCommissionShare, includeSalaryShare, active: true });
    }
  } else {
    db.products.push({
      id: 'PRD-' + Date.now().toString().slice(-6),
      sku, name, category, brand, price, cost, stock, isFavorite, includeCommissionShare, includeSalaryShare, active: true
    });
  }
  saveDB();
  autoSyncMasterSlices(['products']);
  closeModal();
  renderWorkspace();
  showToast('Data produk disimpan & disinkronkan!');
}

function deleteProduct(prodId) {
  db.products = db.products.filter(p => p.id !== prodId);
  saveDB();
  autoSyncMasterSlices(['products']);
  renderWorkspace();
  showToast('Produk dihapus.');
}

function saveStaffForm(staffId) {
  const name = document.getElementById('sfName').value.trim();
  const role = document.getElementById('sfRole').value;
  const pin = document.getElementById('sfPin').value.trim().padStart(4, '0').slice(0, 4);
  const dailyWage = Number(document.getElementById('sfWage').value) || 0;
  const active = document.getElementById('sfActive').checked;
  if (!name) return showToast('Nama pegawai wajib diisi!', true);

  if (staffId) {
    const s = db.staff.find(x => x.id === staffId);
    if (s) Object.assign(s, { name, role, pin, dailyWage, active });
  } else {
    db.staff.push({ id: 'STF-' + Date.now().toString().slice(-5), name, role, pin, dailyWage, active });
  }
  saveDB();
  autoSyncMasterSlices(['staff']);
  closeModal();
  renderWorkspace();
  showToast('Data pegawai tersimpan!');
}

function renderSettingsPromosSubtab(box) {

    <div class="bento-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

      <div><label class="field-label">Nilai Potongan</label><input id="pmVal" type="number" class="styled-input" value="10" /></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
      <div><label class="field-label">Min. Belanja (Rp)</label><input id="pmMin" type="number" class="styled-input" value="25000" /></div>
      <div><label class="field-label">Berlaku Sampai</label><input id="pmExp" type="date" class="styled-input" value="2026-12-31" /></div>
    </div>

  `);

function saveNewPromo() {
  const code = document.getElementById('pmCode').value.trim().toUpperCase();
  const name = document.getElementById('pmName').value.trim();
  const type = document.getElementById('pmType').value;
  const value = Number(document.getElementById('pmVal').value) || 0;
  const minOrder = Number(document.getElementById('pmMin').value) || 0;
  const validUntil = document.getElementById('pmExp').value || '2026-12-31';
  if (!code || !name) return showToast('Kode dan judul promo wajib diisi!', true);

  db.promos.push({ id: 'PRM-' + Date.now(), code, name, type, value, minOrder, validUntil, active: true });
  saveDB();
  autoSyncMasterSlices(['promos']);
  closeModal();
  renderWorkspace();
  showToast('Promo baru ditambahkan!');
}

function deletePromo(promoId) {
  db.promos = db.promos.filter(p => p.id !== promoId);
  saveDB();
  autoSyncMasterSlices(['promos']);
  renderWorkspace();
  showToast('Promo dihapus.');
}

function initApp() {
  renderLoginStaffDropdown();
  checkExistingSession();
  startCloudAutoPullLoop();
  if ((db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim() && navigator.onLine) {
    pullFromCloudMaster(false);
  }
}

initApp();
</script>
