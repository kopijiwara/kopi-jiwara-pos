              <h3 style="margin:0;font-size:16px;">Daftar Kategori Menu</h3>
              <div style="font-size:11px;color:var(--text-muted);">Kelola kategori menu yang tampil di layar kasir</div>
            </div>
            <button class="btn btn-pink btn-sm" onclick="openAddMenuCategoryModal()">+ Tambah Kategori</button>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <input type="text" class="styled-input" style="flex:1;min-width:180px;padding:8px 11px;font-size:12px;" placeholder="Cari kategori..." value="${esc(catSearch)}" oninput="catSearch=this.value;catPage=1;renderSettingsProdukKategori(document.getElementById('settingsSubBody'))" />
            <select class="styled-select" style="width:auto;padding:8px 11px;font-size:12px;" onchange="catPageSize=Number(this.value);catPage=1;renderSettingsProdukKategori(document.getElementById('settingsSubBody'))">
              ${[10, 20, 50, 100].map(sz => `<option value="${sz}" ${catPageSize === sz ? 'selected' : ''}>Tampil: ${sz}</option>`).join('')}
            </select>
          </div>

          <div class="table-box">
            <table class="compact-table">
              <thead><tr><th>No</th><th>Nama Kategori</th><th>Jumlah Menu</th><th>Aksi</th></tr></thead>
              <tbody>
                ${pagedCats.map((cat, i) => {
                  const count = cat === 'Favorit' ? db.products.filter(p => p.fav).length : db.products.filter(p => p.category === cat).length;
                  return `
                    <tr>
                      <td>${(catPage - 1) * catPageSize + i + 1}</td>
                      <td><strong>${esc(cat)}</strong></td>
                      <td>${count} Produk</td>
                      <td>${cat === 'Favorit' ? `<span style="font-size:11px;color:var(--text-muted);">Default</span>` : `<button class="btn btn-soft btn-sm" onclick="openEditMenuCategoryModal('${esc(cat)}')">Edit</button>`}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;">
            <span>Halaman ${catPage} / ${totalCatPages} (${filteredCats.length} kategori)</span>
            <div style="display:flex;gap:5px;flex-wrap:wrap;">
              <button class="btn btn-soft btn-sm" onclick="catPage=Math.max(1,catPage-1);renderSettingsProdukKategori(document.getElementById('settingsSubBody'))" ${catPage <= 1 ? 'disabled' : ''}>Sebelumnya</button>
              <button class="btn btn-soft btn-sm" onclick="catPage=Math.min(${totalCatPages},catPage+1);renderSettingsProdukKategori(document.getElementById('settingsSubBody'))" ${catPage >= totalCatPages ? 'disabled' : ''}>Selanjutnya</button>
            </div>
          </div>
        </div>

        <div class="bento-card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <div>
              <h3 style="margin:0;font-size:16px;">Daftar Produk Jual</h3>
              <div style="font-size:11px;color:var(--text-muted);">Klik Edit atau baris produk untuk ubah harga, kategori, atau hapus</div>
            </div>
            <button class="btn btn-yellow btn-sm" onclick="openProductFormModal(null)">+ Tambah Produk</button>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <input type="text" class="styled-input" style="flex:2;min-width:180px;padding:8px 11px;font-size:12px;" placeholder="Cari nama produk atau SKU..." value="${esc(prodSearch)}" oninput="prodSearch=this.value;prodPage=1;renderSettingsProdukKategori(document.getElementById('settingsSubBody'))" />
            <select class="styled-select" style="flex:1;min-width:140px;padding:8px 11px;font-size:12px;" onchange="prodCatFilter=this.value;prodPage=1;renderSettingsProdukKategori(document.getElementById('settingsSubBody'))">
              <option value="ALL" ${prodCatFilter === 'ALL' ? 'selected' : ''}>Semua Kategori</option>
              ${db.categories.filter(c => c !== 'Favorit').map(c => `<option value="${esc(c)}" ${prodCatFilter === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
            <select class="styled-select" style="width:auto;padding:8px 11px;font-size:12px;" onchange="prodPageSize=Number(this.value);prodPage=1;renderSettingsProdukKategori(document.getElementById('settingsSubBody'))">
              ${[10, 20, 50, 100].map(sz => `<option value="${sz}" ${prodPageSize === sz ? 'selected' : ''}>Tampil: ${sz}</option>`).join('')}
            </select>
          </div>

          <div class="table-box">
            <table class="compact-table">
              <thead><tr><th>SKU</th><th>Nama Produk</th><th>Kategori</th><th>Harga Jual</th><th>Satuan</th><th>Aksi</th></tr></thead>
              <tbody>
                ${pagedProds.map(p => `
                  <tr style="cursor:pointer;" onclick="openProductFormModal('${esc(p.id)}')">
                    <td><strong>${esc(p.sku)}</strong></td>
                    <td><strong>${esc(p.name)}</strong> ${p.fav ? '<span class="badge-pill badge-yellow">Fav</span>' : ''}</td>
                    <td><span class="badge-pill badge-green">${esc(p.category)}</span></td>
                    <td><strong>${rp(p.price)}</strong></td>
                    <td>${esc(p.unit)}</td>
                    <td><button type="button" class="btn btn-soft btn-sm" onclick="event.stopPropagation();openProductFormModal('${esc(p.id)}')">Edit</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;">
            <span>Halaman ${prodPage} / ${totalProdPages} (${filteredProds.length} produk)</span>
            <div style="display:flex;gap:5px;flex-wrap:wrap;">
              <button class="btn btn-soft btn-sm" onclick="prodPage=Math.max(1,prodPage-1);renderSettingsProdukKategori(document.getElementById('settingsSubBody'))" ${prodPage <= 1 ? 'disabled' : ''}>Sebelumnya</button>
              ${Array.from({ length: totalProdPages }, (_, idx) => idx + 1).map(pg => `
                <button class="btn ${pg === prodPage ? 'btn-dark' : 'btn-soft'} btn-sm" onclick="prodPage=${pg};renderSettingsProdukKategori(document.getElementById('settingsSubBody'))">${pg}</button>
              `).join('')}
              <button class="btn btn-soft btn-sm" onclick="prodPage=Math.min(${totalProdPages},prodPage+1);renderSettingsProdukKategori(document.getElementById('settingsSubBody'))" ${prodPage >= totalProdPages ? 'disabled' : ''}>Selanjutnya</button>
            </div>
          </div>
        </div>
      `;
    }

    function openAddMenuCategoryModal() {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">+ Tambah Kategori Menu</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori Baru</label><input id="newCatInput" class="styled-input" placeholder="Contoh: Non-Kopi & Mocktail" /></div>
        <button class="btn btn-pink" style="width:100%;padding:12px;" onclick="saveNewMenuCategory()">Simpan Kategori</button>
      `);
    }

    function saveNewMenuCategory() {
      const val = document.getElementById('newCatInput').value.trim();
      if (!val) return;
      if (db.categories.includes(val)) { showToast('Kategori sudah ada.', true); return; }
      db.categories.push(val);
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${val}" ditambahkan.`);
    }

    function openEditMenuCategoryModal(oldName) {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">Edit Kategori Menu</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori</label><input id="editCatInput" class="styled-input" value="${esc(oldName)}" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn btn-danger" onclick="deleteMenuCategory('${esc(oldName)}')">Hapus</button>
          <button class="btn btn-dark" onclick="updateMenuCategory('${esc(oldName)}')">Simpan</button>
        </div>
      `);
    }

    function updateMenuCategory(oldName) {
      const nextName = document.getElementById('editCatInput').value.trim();
      if (!nextName) return;
      const idx = db.categories.indexOf(oldName);
      if (idx >= 0) db.categories[idx] = nextName;
      db.products.forEach(p => { if (p.category === oldName) p.category = nextName; });
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Kategori diperbarui.');
    }

    function deleteMenuCategory(catName) {
      db.categories = db.categories.filter(c => c !== catName);
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${catName}" dihapus.`);
    }

    function openProductFormModal(prodId) {
      const prod = prodId ? db.products.find(p => p.id === prodId) : null;
      const cats = db.categories.filter(c => c !== 'Favorit');
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">${prod ? 'Edit Detail Produk' : '+ Tambah Produk Baru'}</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="display:grid;gap:10px;margin-bottom:14px;">
          <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;">
            <div><label class="field-label">SKU</label><input id="pfSku" class="styled-input" value="${esc(prod ? prod.sku : 'JW-' + (db.products.length + 1))}" /></div>
            <div><label class="field-label">Nama Produk</label><input id="pfName" class="styled-input" value="${esc(prod ? prod.name : '')}" placeholder="Nama menu..." /></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div><label class="field-label">Kategori</label><select id="pfCat" class="styled-select">${cats.map(c => `<option value="${esc(c)}" ${prod && prod.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
            <div><label class="field-label">Satuan</label><input id="pfUnit" class="styled-input" value="${esc(prod ? prod.unit : 'Cup')}" /></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div><label class="field-label">Harga Jual (Rp)</label><input id="pfPrice" type="text" inputmode="numeric" class="styled-input" value="${prod ? formatDigits(prod.price) : ''}" oninput="this.value=formatDigits(this.value)" /></div>
            <div><label class="field-label">HPP / Modal (Rp)</label><input id="pfCost" type="text" inputmode="numeric" class="styled-input" value="${prod ? formatDigits(prod.cost) : ''}" oninput="this.value=formatDigits(this.value)" /></div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;">
            <input id="pfFav" type="checkbox" ${prod && prod.fav ? 'checked' : ''} /> Tampilkan di Kategori Favorit
          </label>
        </div>
        <div style="display:grid;grid-template-columns:${prod ? '1fr 1.5fr' : '1fr'};gap:8px;">
          ${prod ? `<button class="btn btn-danger" onclick="deleteProductById('${esc(prod.id)}')">Hapus Produk</button>` : ''}
          <button class="btn btn-yellow" onclick="saveProductForm('${prod ? esc(prod.id) : ''}')">Simpan Produk</button>
        </div>
      `);
    }

    function saveProductForm(prodId) {
      const sku = document.getElementById('pfSku').value.trim();
      const name = document.getElementById('pfName').value.trim();
      const category = document.getElementById('pfCat').value;
      const unit = document.getElementById('pfUnit').value.trim() || 'Cup';
      const price = parseDigits(document.getElementById('pfPrice').value);
      const cost = parseDigits(document.getElementById('pfCost').value);
      const fav = document.getElementById('pfFav').checked;
      if (!name || price <= 0) { showToast('Nama produk dan harga jual wajib diisi.', true); return; }
      if (prodId) {
        const idx = db.products.findIndex(p => p.id === prodId);
        if (idx >= 0) db.products[idx] = { ...db.products[idx], sku, name, category, unit, price, cost, fav };
      } else {
        db.products.unshift({ id: 'prd-' + Date.now(), sku, name, category, unit, price, cost, fav, stock: 50 });
      }
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Data produk disimpan.');
    }

    function deleteProductById(prodId) {
      db.products = db.products.filter(p => p.id !== prodId);
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Produk dihapus.');
    }

    function renderSettingsStaff(body) {
      body.innerHTML = `
        <div class="bento-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
            <div>
              <h3 style="margin:0;font-size:16px;">Manajemen Pegawai & PIN</h3>
              <div style="font-size:11px;color:var(--text-muted);">Atur PIN 4-digit & upah harian staf</div>
            </div>
            <button class="btn btn-yellow btn-sm" onclick="openAddStaffModal()">+ Tambah Staf</button>
          </div>
          <div class="table-box">
            <table class="compact-table">
              <thead><tr><th>Nama</th><th>Role</th><th>Upah Harian</th><th>PIN Baru</th><th>Aksi</th></tr></thead>
              <tbody>
                ${db.staff.map(s => `
                  <tr>
                    <td><strong>${esc(s.name)}</strong></td>
                    <td><span class="badge-pill ${s.role === 'Owner' ? 'badge-yellow' : 'badge-green'}">${esc(s.role)}</span></td>
                    <td>${rp(s.dailyWage)}</td>
                    <td><input id="pinInp_${esc(s.id)}" type="password" maxlength="4" inputmode="numeric" class="styled-input" style="width:84px;padding:6px 8px;font-size:12px;" placeholder="••••" /></td>
                    <td><button class="btn btn-dark btn-sm" onclick="updateStaffPin('${esc(s.id)}')">Simpan PIN</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateStaffPin(staffId) {
      const val = document.getElementById('pinInp_' + staffId).value.trim();
      if (!/^\d{4}$/.test(val)) { showToast('PIN harus 4 digit angka.', true); return; }
      const st = db.staff.find(s => s.id === staffId);
      if (st) st.pin = val;
      saveDB();
      showToast(`PIN untuk ${st.name} berhasil diperbarui.`);
    }

    function openAddStaffModal() {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">+ Tambah Pegawai Baru</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="display:grid;gap:10px;margin-bottom:14px;">
          <div><label class="field-label">Nama Pegawai</label><input id="stNewName" class="styled-input" /></div>
          <div><label class="field-label">Jabatan</label><select id="stNewRole" class="styled-select"><option value="Kasir">Kasir</option><option value="Owner">Owner</option></select></div>
          <div><label class="field-label">PIN 4-Digit</label><input id="stNewPin" maxlength="4" inputmode="numeric" class="styled-input" value="1234" /></div>
          <div><label class="field-label">Upah Harian (Rp)</label><input id="stNewWage" inputmode="numeric" class="styled-input" value="70.000" oninput="this.value=formatDigits(this.value)" /></div>
        </div>
        <button class="btn btn-yellow" style="width:100%;padding:12px;" onclick="saveNewStaff()">Simpan Pegawai</button>
      `);
    }

    function saveNewStaff() {
      const name = document.getElementById('stNewName').value.trim();
      const role = document.getElementById('stNewRole').value;
      const pin = document.getElementById('stNewPin').value.trim();
      const dailyWage = parseDigits(document.getElementById('stNewWage').value);
      if (!name || !/^\d{4}$/.test(pin)) { showToast('Isi nama dan PIN 4 digit angka.', true); return; }
      db.staff.push({ id: 'stf-' + Date.now(), name, role, pin, active: true, dailyWage });
      saveDB();
      closeModal();
      renderSettingsStaff(document.getElementById('settingsSubBody'));
      showToast(`Pegawai ${name} ditambahkan.`);
    }

    function renderSettingsPromo(body) {
      body.innerHTML = `
        <div class="bento-card">
          <h3 style="margin:0 0 10px;font-size:16px;">Daftar Kode Promo Aktif</h3>
          <div class="table-box">
            <table class="compact-table">
              <thead><tr><th>Kode</th><th>Nama Promo</th><th>Potongan</th><th>Status</th></tr></thead>
              <tbody>
                ${db.promos.map(pr => `<tr><td><strong>${esc(pr.code)}</strong></td><td>${esc(pr.name)}</td><td>${pr.type === 'percent' ? pr.value + '%' : rp(pr.value)}</td><td><span class="badge-pill badge-green">${pr.active ? 'Aktif' : 'Nonaktif'}</span></td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSettingsOutletSync(body) {
      body.innerHTML = `
        <div class="bento-card" style="margin-bottom:14px;">
          <h3 style="margin:0 0 10px;font-size:16px;">Info Outlet & Sinkronisasi Master POS & ERP</h3>
          <div style="display:grid;gap:10px;margin-bottom:12px;">
            <div><label class="field-label">Nama Outlet</label><input id="outNameInp" class="styled-input" value="${esc(db.outlet.name)}" /></div>
            <div><label class="field-label">Alamat Outlet</label><input id="outAddrInp" class="styled-input" value="${esc(db.outlet.address)}" /></div>
            <div><label class="field-label">Google Apps Script Webhook URL (Master POS & ERP - KOPI JIWARA)</label><input id="outWebhookInp" class="styled-input" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(db.outlet.webhookUrl || '')}" /></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-dark" onclick="saveOutletIntegration()">Simpan Pengaturan & URL</button>
            <button class="btn btn-yellow" onclick="syncFullMasterDatabase()">Sync Semua Data ke Master</button>
            <button class="btn btn-pink" onclick="openMasterScriptModal()">Skrip Google Sheets (Master POS & ERP)</button>
          </div>
        </div>
      `;
    }

    function saveOutletIntegration() {
      db.outlet.name = document.getElementById('outNameInp').value.trim() || 'KOPI JIWARA';
      db.outlet.address = document.getElementById('outAddrInp').value.trim();
      db.outlet.webhookUrl = document.getElementById('outWebhookInp').value.trim();
      saveDB();
      renderWorkspace();
      showToast('Pengaturan Outlet & URL Master Sheets disimpan.');
    }

    function openMasterScriptModal() {
      const code = getMasterAppsScriptCode();
      openModal(`
        <div class="modal-head">
          <div>
            <h3 style="margin:0;font-size:16px;">Google Apps Script — Master POS & ERP</h3>
            <div style="font-size:11px;color:var(--text-muted);">Tempel di Extensions → Apps Script pada file Master POS & ERP - KOPI JIWARA</div>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        <textarea id="appsScriptBox" readonly style="width:100%;height:240px;font-family:monospace;font-size:11px;padding:10px;border-radius:12px;border:1px solid var(--border-glass);background:#0B2E23;color:#FACC15;margin-bottom:10px;">${esc(code)}</textarea>
        <button class="btn btn-yellow" style="width:100%;padding:12px;" onclick="copyMasterScript()">Salin Kode Apps Script</button>
      `);
    }

    function copyMasterScript() {
      const ta = document.getElementById('appsScriptBox');
      if (!ta) return;
      ta.select();
      document.execCommand('copy');
      showToast('Kode Google Apps Script berhasil disalin.');
    }

    initLoginScreen();
  </script>
</body>
</html>
