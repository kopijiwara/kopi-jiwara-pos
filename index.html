<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background-color: #0B2E23;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .login-select option {
      background-color: #0B2E23;
      color: #FFFFFF;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* CRM SUGGESTION DROPDOWN */
    .crm-suggest-box {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #FFFFFF;
      border: 1.5px solid var(--green-deep);
      border-radius: 14px;
      box-shadow: var(--shadow-float);
      z-index: 60;
      max-height: 170px;
      overflow-y: auto;
    }
    .crm-suggest-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .crm-suggest-item:last-child { border-bottom: none; }
    .crm-suggest-item:hover { background: var(--green-soft); }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
        <div style="width:54px;height:54px;border-radius:16px;background:#093814;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.28);">
          <svg viewBox="0 0 100 100" width="52" height="52">

    function renderJiwaraPngIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

    (function setupOfflineServiceWorker() {
      try {
        const startUrl = window.location.href.split('#')[0].split('?')[0];
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v15';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              if (e.request.url.includes('script.google.com')) return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});

    function getDateBounds(period, customStart, customEnd) {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      let label = 'Hari Ini';

      if (period === 'YESTERDAY') {
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
        label = 'Kemarin';
      } else if (period === 'THIS_WEEK') {
        const day = start.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        start.setDate(start.getDate() + diffToMon);
        label = 'Minggu Ini (Sen–Min)';
      } else if (period === 'LAST_WEEK') {
        const day = start.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        start.setDate(start.getDate() + diffToMon - 7);
        end.setTime(start.getTime());
        end.setDate(start.getDate() + 6);
        end.setHours(23, 59, 59);
        label = 'Minggu Lalu';
      } else if (period === '7D') {
        start.setDate(start.getDate() - 6);
        label = '7 Hari Terakhir';
      } else if (period === 'MONTH') {
        start.setDate(1);
        label = 'Bulan Ini';
      } else if (period === 'CUSTOM') {
        const s = customStart || todayISO();
        const e = customEnd || todayISO();
        const sd = new Date(s + 'T00:00:00');
        const ed = new Date(e + 'T23:59:59');
        return { start: sd, end: ed, label: `${s} s/d ${e}` };
      }
      return { start, end, label };
    }

    function isDateInBounds(isoDateStr, bounds) {
      if (!isoDateStr) return false;
      const norm = normalizeCloudDate(isoDateStr);
      const d = new Date(norm + 'T12:00:00');
      return d >= bounds.start && d <= bounds.end;
    }

    function normalizeCloudDate(rawDate) {
      if (!rawDate) return todayISO();
      const s = String(rawDate).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
        const dt = new Date(s);
        if (!isNaN(dt.getTime())) {
          return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        }
        return s.slice(0, 10);
      }
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (dmy) {
        return `${dmy[3]}-${String(dmy[2]).padStart(2, '0')}-${String(dmy[1]).padStart(2, '0')}`;
      }
      const parsed = new Date(s);
      if (!isNaN(parsed.getTime())) {
        return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
      }
      return todayISO();
    }

        body: JSON.stringify(envelope)

    function applyCloudPullData(data) {
      if (!data || typeof data !== 'object') return false;
      let changed = false;

      if (data.outletProfile && typeof data.outletProfile === 'object') {
        const op = data.outletProfile;
        if (op.outletName && op.outletName !== db.settings.outletName) { db.settings.outletName = op.outletName; changed = true; }
        if (op.address && op.address !== db.settings.address) { db.settings.address = op.address; changed = true; }
        if (op.phone !== undefined && op.phone !== db.settings.phone) { db.settings.phone = op.phone; changed = true; }
        if (op.socialMedia !== undefined && op.socialMedia !== db.settings.socialMedia) { db.settings.socialMedia = op.socialMedia; changed = true; }
        if (op.receiptFooter !== undefined && op.receiptFooter !== db.settings.receiptFooter) { db.settings.receiptFooter = op.receiptFooter; changed = true; }
      }

      if (Array.isArray(data.deletedBrands)) {
        const mergedDeleted = Array.from(new Set([...(db.deletedBrands || []), ...data.deletedBrands]));
        if (JSON.stringify(mergedDeleted) !== JSON.stringify(db.deletedBrands || [])) {
          db.deletedBrands = mergedDeleted;
          changed = true;
        }
      }

      if (Array.isArray(data.products) && data.products.length > 0) {
        const deletedSet = new Set((db.deletedBrands || []).map(b => b.toLowerCase()));
        const cleanProds = data.products.map(p => ({
          ...p,
          brand: (p.brand && !deletedSet.has(String(p.brand).toLowerCase())) ? p.brand : 'Kopi Jiwara',
          includeCommissionShare: p.includeCommissionShare !== false,
          includeSalaryShare: p.includeSalaryShare !== false
        }));
        if (JSON.stringify(cleanProds) !== JSON.stringify(db.products)) {
          db.products = cleanProds;
          changed = true;
        }
      }

      if (Array.isArray(data.categories) && data.categories.length > 0) {
        const mergedCats = normalizeUniqueCategories([
          ...data.categories,
          ...db.products.map(p => p.category).filter(Boolean)
        ]);
        if (JSON.stringify(mergedCats) !== JSON.stringify(db.categories)) {
          db.categories = mergedCats;
          changed = true;
        }
      }

      if (Array.isArray(data.brandConfigs) && data.brandConfigs.length > 0) {
        const deletedSet = new Set((db.deletedBrands || []).map(b => b.toLowerCase()));
        const filteredBrands = data.brandConfigs.filter(b => b && b.brand && !deletedSet.has(String(b.brand).toLowerCase()));
        if (filteredBrands.length > 0 && JSON.stringify(filteredBrands) !== JSON.stringify(db.brandConfigs)) {
          db.brandConfigs = filteredBrands;
          changed = true;
        }
      }

      if (Array.isArray(data.inventory) && data.inventory.length > 0) {
        if (JSON.stringify(data.inventory) !== JSON.stringify(db.inventory)) {
          db.inventory = data.inventory;
          changed = true;
        }
      }

      if (Array.isArray(data.staff) && data.staff.length > 0) {
        if (JSON.stringify(data.staff) !== JSON.stringify(db.staff)) {
          db.staff = data.staff;
          changed = true;
        }
      }

      if (Array.isArray(data.promos)) {
        if (JSON.stringify(data.promos) !== JSON.stringify(db.promos)) {
          db.promos = data.promos;
          changed = true;
        }
      }

      if (Array.isArray(data.customers)) {
        if (JSON.stringify(data.customers) !== JSON.stringify(db.customers)) {
          db.customers = data.customers;
          changed = true;
        }
      }

      if (Array.isArray(data.openOrders)) {
        const nonOpen = db.transactions.filter(t => t.status !== 'OPEN');
        const currentOpen = db.transactions.filter(t => t.status === 'OPEN');
        const cloudOpen = data.openOrders.map(o => ({ ...o, status: 'OPEN', date: normalizeCloudDate(o.date) }));
        if (JSON.stringify(cloudOpen) !== JSON.stringify(currentOpen)) {
          db.transactions = [...nonOpen, ...cloudOpen];
          changed = true;
        }
      }

      if (Array.isArray(data.paidTransactions)) {
        const localMap = new Map(db.transactions.map(t => [t.id, t]));
        const itemsByTrx = {};
        if (Array.isArray(data.paidItems)) {
          data.paidItems.forEach(it => {
            if (!it || !it.trxId) return;
            if (!itemsByTrx[it.trxId]) itemsByTrx[it.trxId] = [];
            itemsByTrx[it.trxId].push({
              id: it.id || ('PRD-' + (it.sku || it.name)),
              sku: it.sku || '-',
              name: it.name || 'Menu',
              brand: it.brand || 'Kopi Jiwara',
              includeCommissionShare: it.includeCommissionShare !== false,
              includeSalaryShare: it.includeSalaryShare !== false,
              qty: Number(it.qty) || 1,
              price: Number(it.price) || 0,
              cost: Number(it.cost) || 0
            });
          });
        }

        data.paidTransactions.forEach(pt => {
          if (!pt || !pt.id) return;
          const normDate = normalizeCloudDate(pt.date);
          const cloudItems = itemsByTrx[pt.id] || (Array.isArray(pt.items) ? pt.items : []);
          const cloudCost = cloudItems.reduce((s, i) => s + (Number(i.cost) || 0) * (Number(i.qty) || 1), 0);
          const existing = localMap.get(pt.id);
          const cloudStatus = String(pt.status || 'PAID').toUpperCase() === 'CANCELLED' ? 'CANCELLED' : 'PAID';

          if (!existing) {
            db.transactions.push({
              id: pt.id,
              status: cloudStatus,
              date: normDate,
              time: pt.time || '00:00',
              orderType: pt.orderType || 'Meja',
              tableOrCustomer: pt.tableOrCustomer || '',
              customerPhone: pt.customerPhone || '',
              customerId: '',
              cashier: pt.cashier || 'Cloud',
              items: cloudItems,
              subtotal: Number(pt.subtotal) || Number(pt.total) || 0,
              discount: Number(pt.discount) || 0,
              promoCode: pt.promoCode || '',
              total: Number(pt.total) || 0,
              totalCost: cloudCost,
              paymentMethod: pt.paymentMethod || 'Cash',
              cashReceived: Number(pt.total) || 0,
              change: 0
            });
            changed = true;
          } else {
            if (existing.status === 'OPEN' || (cloudStatus === 'CANCELLED' && existing.status !== 'CANCELLED')) {
              existing.status = cloudStatus;
              existing.paymentMethod = pt.paymentMethod || existing.paymentMethod;
              existing.total = Number(pt.total) || existing.total;
              changed = true;
            }
            if (existing.date !== normDate) {
              existing.date = normDate;
              changed = true;
            }
            if ((!existing.items || existing.items.length === 0) && cloudItems.length > 0) {
              existing.items = cloudItems;
              existing.totalCost = cloudCost;
              changed = true;
            }
          }
        });
      }

      if (Array.isArray(data.cashDrawer)) {
        const localCashIds = new Set(db.cashDrawer.map(c => c.id));
        data.cashDrawer.forEach(cc => {
          if (cc && cc.id && !localCashIds.has(cc.id)) {
            db.cashDrawer.push({
              id: cc.id,
              date: normalizeCloudDate(cc.date),
              time: cc.time || '00:00',
              type: cc.type === 'OUT' ? 'OUT' : 'IN',
              amount: Number(cc.amount) || 0,
              note: cc.note || '',
              by: cc.by || 'Cloud'
            });
            changed = true;
          }
        });
      }

      if (Array.isArray(data.attendance)) {
        const localAttMap = new Map(db.attendance.map(a => [`${normalizeCloudDate(a.date)}_${a.staffName}`, a]));
        data.attendance.forEach(ca => {
          if (!ca || !ca.staffName) return;
          const normD = normalizeCloudDate(ca.date);
          const k = `${normD}_${ca.staffName}`;
          const ex = localAttMap.get(k);
          const outVal = ca.clockOut === 'Aktif' ? '' : (ca.clockOut || '');
          if (!ex) {
            db.attendance.push({
              id: ca.id || ('ATT-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5)),
              date: normD,
              staffId: ca.staffId || '',
              staffName: ca.staffName || '',
              role: ca.role || '',
              clockIn: ca.clockIn || '',
              clockOut: outVal,
              wage: Number(ca.wage) || 0
            });
            changed = true;
          } else if (!ex.clockOut && outVal) {
            ex.clockOut = outVal;
            changed = true;
          }
        });
      }

      if (Array.isArray(data.brandSettlements)) {
        const localStlIds = new Set((db.brandSettlements || []).map(s => s.id));
        data.brandSettlements.forEach(cs => {
          if (cs && cs.id && !localStlIds.has(cs.id)) {
            db.brandSettlements.push({
              ...cs,
              date: normalizeCloudDate(cs.date)
            });
            changed = true;
          }
        });
      }

      if (changed) saveDB();
      return changed;
    }

    async function pullFromCloudMaster(manualTrigger = false) {
      const url = (db.settings.webhookUrl || '').trim();
      if (!url) {
        if (manualTrigger) showToast('Isi URL Webhook Google Apps Script terlebih dahulu.', true);
        return;
      }
      if (!navigator.onLine) {
        updateLiveSyncIndicator('Offline', false);
        if (manualTrigger) showToast('Perangkat sedang offline.', true);
        return;
      }
      if (isPullingCloud) return;
      if (!manualTrigger && (Date.now() - lastLocalMutationAt) < 5500) return;

      isPullingCloud = true;
      updateLiveSyncIndicator('Menyinkron...', true);
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=pull&t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
        const json = await res.json();
        const hasChanges = applyCloudPullData(json);
        const nowStr = nowTimeStr();
        updateLiveSyncIndicator(`Live • ${nowStr}`, false);
        if (manualTrigger) {
          showToast(hasChanges ? 'Data terbaru dari Cloud berhasil ditarik!' : 'Semua perangkat sudah sinkron (terbaru).');
        }
        if (hasChanges) {
          if (currentUser && !isUserActivelyTyping()) {
            const modalOpen = !document.getElementById('modalBackdrop')?.classList.contains('hidden');
            if (!modalOpen) renderWorkspace();
          } else if (!currentUser) {
            renderLoginStaffDropdown();
          }
        }
      } catch (err) {
        updateLiveSyncIndicator('Sync Error', false);
        if (manualTrigger) {
          showToast('Gagal menarik data. Pastikan Apps Script sudah di-deploy dengan fungsi doGet().', true);
        }
      } finally {
        isPullingCloud = false;
      }
    }

    function startCloudAutoPullLoop() {
      if (autoPullTimer) clearInterval(autoPullTimer);
      const sec = Math.max(10, Number(db.settings.autoPullIntervalSec) || 15);
      autoPullTimer = setInterval(() => {
        if (db.settings.webhookUrl && db.settings.autoPullEnabled !== false) {
          pullFromCloudMaster(false);
        }

    // ==================== BLUETOOTH THERMAL PRINTER ENGINE ====================
    let btPrinterDevice = null;
    let btPrinterCharacteristic = null;

    function buildEscPosReceiptBytes(trx) {
      const encoder = new TextEncoder();
      const lineWidth = db.settings.printerPaperSize === '80mm' ? 42 : 32;
      const hr = '-'.repeat(lineWidth) + '\n';
      const center = (txt) => {
        const s = String(txt || '').slice(0, lineWidth);
        const pad = Math.max(0, Math.floor((lineWidth - s.length) / 2));
        return ' '.repeat(pad) + s + '\n';
      };
      const lr = (left, right) => {
        const l = String(left || '');
        const r = String(right || '');
        const space = Math.max(1, lineWidth - l.length - r.length);
        return l + ' '.repeat(space) + r + '\n';
      };

      const isDraft = Boolean(trx.isDraftBill);
      const totalQty = (trx.items || []).reduce((s, i) => s + (Number(i.qty) || 0), 0);

      let out = '\x1B\x40';
      out += '\x1B\x61\x01\x1B\x45\x01' + (db.settings.outletName || 'KOPI JIWARA') + '\n\x1B\x45\x00';
      if (isDraft) {
        out += '\x1B\x45\x01*** CEK PESANAN / TAGIHAN ***\n\x1B\x45\x00';
      }
      out += (db.settings.address || '') + '\n';
      if (db.settings.phone) out += 'Telp/WA: ' + db.settings.phone + '\n';
      if (db.settings.socialMedia) out += db.settings.socialMedia + '\n';
      out += '\x1B\x61\x00' + hr;
      out += `Nota  : ${trx.id}\n`;
      out += `Waktu : ${trx.date} ${trx.time}\n`;
      out += `Tipe  : ${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''}\n`;
      out += `Kasir : ${trx.cashier}\n` + hr;

      trx.items.forEach(item => {
        out += `${item.name}\n`;
        out += lr(`  ${item.qty} x ${item.price.toLocaleString('id-ID')}`, (item.qty * item.price).toLocaleString('id-ID'));
      });

      out += hr;
      out += lr('Total Pesanan', `${totalQty} Item`);
      out += lr('Subtotal', rp(trx.subtotal));
      if (trx.discount > 0) out += lr('Diskon', '-' + rp(trx.discount));
      out += '\x1B\x45\x01' + lr(isDraft ? 'TOTAL TAGIHAN' : 'TOTAL', rp(trx.total)) + '\x1B\x45\x00';
      if (isDraft) {
        out += lr('Status', 'BELUM LUNAS (DRAFT)');
      } else {
        out += lr('Bayar (' + trx.paymentMethod + ')', rp(trx.cashReceived || trx.total));
        if (trx.paymentMethod === 'Cash') out += lr('Kembalian', rp(trx.change || 0));
      }
      out += hr + center(isDraft ? 'Struk sementara untuk pengecekan' : (db.settings.receiptFooter || 'Terima kasih!'));
      out += '\n\n\n\x1D\x56\x41\x03';
      return encoder.encode(out);
    }

    async function connectAndLockBluetoothPrinter() {
      if (!navigator.bluetooth) {
        showToast('Browser ini tidak mendukung Web Bluetooth langsung. Gunakan Chrome Android/Desktop.', true);
        return;
      }
      try {
        showToast('Memindai printer thermal Bluetooth...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb',
            '49535343-fe7d-4ae5-8fa9-9fafd205e455',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '0000ff00-0000-1000-8000-00805f9b34fb'
          ]
        });
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        let writeChar = null;
        for (const svc of services) {
          const chars = await svc.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.write || ch.properties.writeWithoutResponse) {
              writeChar = ch;
              break;
            }
          }
          if (writeChar) break;
        }
        if (!writeChar) {
          showToast('Karakteristik tulis printer tidak ditemukan.', true);
          return;
        }
        btPrinterDevice = device;
        btPrinterCharacteristic = writeChar;
        db.settings.printerName = device.name || 'Thermal Printer BT';
        db.settings.printerDeviceId = device.id || 'BT-LOCKED';
        db.settings.printerLocked = true;
        saveDB();
        renderWorkspace();
        showToast(`Printer "${db.settings.printerName}" berhasil terhubung & dikunci!`);
      } catch (err) {
        showToast('Koneksi Bluetooth dibatalkan atau gagal.', true);
      }
    }

    function unlockBluetoothPrinter() {
      btPrinterDevice = null;
      btPrinterCharacteristic = null;
      db.settings.printerLocked = false;
      db.settings.printerName = '';
      db.settings.printerDeviceId = '';
      saveDB();
      renderWorkspace();
      showToast('Kunci printer Bluetooth dilepas.');
    }

    async function ensureBtPrinterConnected() {
      if (btPrinterCharacteristic && btPrinterDevice && btPrinterDevice.gatt && btPrinterDevice.gatt.connected) {
        return btPrinterCharacteristic;
      }
      if (!navigator.bluetooth || !db.settings.printerLocked) return null;
      try {
        let dev = btPrinterDevice;
        if (!dev && navigator.bluetooth.getDevices && db.settings.printerName) {
          const paired = await navigator.bluetooth.getDevices();
          dev = paired.find(d => d.name === db.settings.printerName) || paired[0] || null;
        }
        if (!dev) return null;
        btPrinterDevice = dev;
        const server = await dev.gatt.connect();
        const services = await server.getPrimaryServices();
        for (const svc of services) {
          const chars = await svc.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.write || ch.properties.writeWithoutResponse) {
              btPrinterCharacteristic = ch;
              return ch;
            }
          }
        }
      } catch (e) {}
      return null;
    }

    async function writeBytesToBtPrinter(bytes) {
      const char = await ensureBtPrinterConnected();
      if (!char) return false;
      try {
        const chunkSize = 100;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const slice = bytes.slice(i, i + chunkSize);
          await char.writeValue(slice);
        }
        return true;
      } catch (e) {
        btPrinterCharacteristic = null;
        return false;
      }
    }

    function renderWorkspace() {
      renderHeaderAndNav();
      const area = document.getElementById('mainContentArea');
      if (activeTab === 'pos') return renderPosTab(area);
      if (activeTab === 'penjualan') return renderSalesTab(area);
      if (activeTab === 'kas_kasir') return renderCashDrawerTab(area);
      if (activeTab === 'absensi') return renderAttendanceTab(area);
      if (activeTab === 'keluar_kasir') return renderClosingTab(area);
      if (activeTab === 'laporan') return renderReportsTab(area);
      if (activeTab === 'pelanggan') return renderCustomerTab(area);
      if (activeTab === 'inventori') return renderInventoryTab(area);
      if (activeTab === 'pengaturan') return renderSettingsTab(area);
    }

    // ==================== TAB 1: POS / KASIR ====================
    function getCartTotals() {
      const subtotal = cart.reduce((s, it) => s + (it.price * it.qty), 0);
      let promoDiscount = 0;
      let appliedCode = '';

      if (selectedPromoCode && selectedPromoCode !== 'MANUAL' && selectedPromoCode !== 'ONLINE') {
        if (selectedPromoCode.startsWith('CRM:')) {
          const cid = selectedPromoCode.slice(4);
          const cust = db.customers.find(c => c.id === cid);
          if (cust && cust.voucher && Number(cust.voucherDiscount) > 0) {
            promoDiscount = Math.min(subtotal, Number(cust.voucherDiscount));
            appliedCode = cust.voucher;
          }
        } else {
          const prm = db.promos.find(p => p.code === selectedPromoCode && p.active);
          if (prm && subtotal >= (prm.minPurchase || 0) && (!prm.validUntil || prm.validUntil >= todayISO())) {
            promoDiscount = prm.type === 'PERCENT' ? Math.round(subtotal * prm.value / 100) : prm.value;
            appliedCode = prm.code;
          }
        }
      } else if (selectedPromoCode === 'MANUAL' && manualDiscountNominal > 0) {
        promoDiscount = Number(manualDiscountNominal) || 0;
        appliedCode = 'POTONGAN MANUAL';
      } else if (selectedPromoCode === 'ONLINE' && onlineDiscountNominal > 0) {
        promoDiscount = Number(onlineDiscountNominal) || 0;
        appliedCode = 'POTONGAN ONLINE';
      }

      const discount = Math.min(subtotal, promoDiscount);
      const total = Math.max(0, subtotal - discount);
      return { subtotal, discount, total, appliedCode };
    }

    function handlePosCustomerInput(val) {
      tableOrCustomerNote = val;
      selectedCustomerId = '';
      const box = document.getElementById('posCrmSuggestBox');
      if (!box) return;
      const q = val.trim().toLowerCase();
      if (q.length < 2) {
        box.classList.add('hidden');
        return;
      }
      const matches = db.customers.filter(c =>
        c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(q))
      ).slice(0, 5);
      if (matches.length === 0) {
        box.classList.add('hidden');
        return;
      }
      box.innerHTML = matches.map(c => `
        <div class="crm-suggest-item" onmousedown="pickCrmCustomer('${esc(c.id)}')">
          <div><strong>${esc(c.name)}</strong> <span class="badge-pill badge-green">${esc(c.tier)}</span></div>
          <span style="font-size:11px;color:var(--text-muted);">${esc(c.phone || 'Tanpa WA')}</span>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function pickCrmCustomer(custId) {
      const cust = db.customers.find(c => c.id === custId);
      if (!cust) return;
      selectedCustomerId = cust.id;
      tableOrCustomerNote = cust.name;
      if (cust.phone) customerPhoneInput = cust.phone;
      if (cust.voucher && Number(cust.voucherDiscount) > 0) {
        selectedPromoCode = 'CRM:' + cust.id;
      }
      renderWorkspace();
      showToast(`Member CRM dipilih: ${cust.name}`);
    }

    function openCashierShift() {
      const val = Number(document.getElementById('openShiftCashInp').value) || 0;
      db.shift.isOpen = true;
      db.shift.openedBy = currentUser.name;
      db.shift.openedAt = `${todayISO()} ${nowTimeStr()}`;
      db.shift.openingCash = val;
      saveDB();
      renderWorkspace();
      showToast(`Shift dibuka dengan modal ${rp(val)}`);
    }

    function addToCart(prodId) {
      const prod = db.products.find(p => p.id === prodId);
      if (!prod) return;
      const existing = cart.find(c => c.id === prod.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: prod.id,
          sku: prod.sku,
          name: prod.name,
          brand: prod.brand,
          includeCommissionShare: prod.includeCommissionShare !== false,
          includeSalaryShare: prod.includeSalaryShare !== false,
          price: prod.price,
          cost: prod.cost,
          qty: 1
        });
      }
      renderWorkspace();
      showToast(`+1 ${prod.name}`);
    }

    function updateCartItemQty(idx, delta) {
      const item = cart[idx];
      if (!item) return;
      if (delta < 0 && activeOpenOrderId) {
        openModal(`
          <div class="modal-head">
            <h3 style="margin:0;font-size:16px;">Otorisasi Pengurangan Open Order</h3>
            <button class="close-circle" onclick="closeModal()">x</button>
          </div>
          <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
            Mengurangi <strong>${esc(item.name)}</strong> dari Open Order membutuhkan PIN Owner / Manager.
          </p>
          <div style="margin-bottom:10px;">
            <label class="field-label">Alasan</label>
            <select id="voidItemReasonSel" class="styled-select">
              ${CANCEL_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}
            </select>
          </div>
          <div style="margin-bottom:14px;">
            <label class="field-label">PIN 4-Digit Owner / Manager</label>
            <input id="voidItemPinInp" type="password" maxlength="4" class="styled-input" placeholder="****" />
          </div>
          <button type="button" class="btn btn-pink" style="width:100%;" onclick="confirmAuthorizedOpenItemVoid(${idx})">Verifikasi & Kurangi</button>
        `);
        return;
      }
      item.qty += delta;
      if (item.qty <= 0) cart.splice(idx, 1);
      renderWorkspace();
    }

    function confirmAuthorizedOpenItemVoid(idx) {
      const reason = document.getElementById('voidItemReasonSel').value;
      const pin = document.getElementById('voidItemPinInp').value.trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pin);
      if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);

      const item = cart[idx];
      const audit = {
        id: 'AUD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderId: activeOpenOrderId,
        itemName: item.name,
        cashier: currentUser.name,
        authorizedBy: approver.name,
        reason
      };
      db.auditLogs.unshift(audit);
      syncMasterEvent('AUDIT_VOID_LOGGED', audit);

      item.qty -= 1;
      if (item.qty <= 0) cart.splice(idx, 1);
      saveDB();
      closeModal();
      renderWorkspace();
      showToast(`Item dikurangi (Otorisasi: ${approver.name})`);
    }

    function resetCart() {
      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      customerPhoneInput = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      onlineDiscountNominal = 0;
      renderWorkspace();
    }

    function printDraftCartBill() {
      if (cart.length === 0) return showToast('Keranjang masih kosong!', true);
      const { subtotal, discount, total, appliedCode } = getCartTotals();
      printReceiptThermal({
        id: activeOpenOrderId || ('BILL-' + Date.now().toString().slice(-6)),
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote.trim() || '-',
        cashier: currentUser.name,
        items: JSON.parse(JSON.stringify(cart)),
        subtotal,
        discount,
        promoCode: appliedCode,
        total,
        isDraftBill: true
      });
    }

    function saveOpenOrder() {
      if (cart.length === 0) return;
      const { subtotal, discount, total, appliedCode } = getCartTotals();
      const totalCost = cart.reduce((s, it) => s + ((it.cost || 0) * it.qty), 0);
      const orderObj = {
        id: activeOpenOrderId || ('ORD-' + Date.now().toString().slice(-6)),
        status: 'OPEN',
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote.trim() || 'Open Bill',
        customerPhone: customerPhoneInput.trim(),
        customerId: selectedCustomerId,
        cashier: currentUser.name,
        items: JSON.parse(JSON.stringify(cart)),
        subtotal,
        discount,
        promoCode: appliedCode,
        total,
        totalCost,
        paymentMethod: 'Belum Bayar'
      };

      if (activeOpenOrderId) {
        const idx = db.transactions.findIndex(t => t.id === activeOpenOrderId);
        if (idx >= 0) db.transactions[idx] = orderObj;
        else db.transactions.unshift(orderObj);
      } else {
        db.transactions.unshift(orderObj);
      }

      saveDB();
      autoSyncMasterSlices(['OPEN_ORDERS']);
      resetCart();
      showToast('Open Order berhasil disimpan!');
    }

    function openActiveOrdersModal() {
      const openOrders = db.transactions.filter(t => t.status === 'OPEN');
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:16px;">Order Aktif Belum Dibayar (${openOrders.length})</h3>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        ${openOrders.length === 0
          ? `<div style="text-align:center;padding:24px 10px;color:var(--text-muted);font-size:13px;">Tidak ada Open Order saat ini.</div>`
          : `<div style="display:flex;flex-direction:column;gap:8px;">
              ${openOrders.map(o => `
                <div style="border:1.5px solid var(--border-glass);border-radius:16px;padding:12px;background:#F8FAFC;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <div>
                      <strong style="font-size:13px;">${esc(o.orderType)} • ${esc(o.tableOrCustomer || 'Open Bill')}</strong>
                      <div style="font-size:11px;color:var(--text-muted);">${o.id} • Pukul ${o.time}</div>
                    </div>
                    <strong style="font-size:14px;color:var(--green-deep);">${rp(o.total)}</strong>
                  </div>
                  <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                    ${(o.items || []).map(i => `${esc(i.name)} (${i.qty}x)`).join(', ')}
                  </div>
                  <button type="button" class="btn btn-dark btn-sm" style="width:100%;" onclick="closeModal();loadOpenOrderToCart('${esc(o.id)}')">Buka & Proses Pesanan Ini</button>
                </div>
              `).join('')}
            </div>`
        }
      `);
    }

    function loadOpenOrderToCart(orderId) {
      const ord = db.transactions.find(t => t.id === orderId && t.status === 'OPEN');
      if (!ord) return;
      activeOpenOrderId = ord.id;
      orderType = ord.orderType || 'Meja';
      tableOrCustomerNote = ord.tableOrCustomer === 'Open Bill' ? '' : (ord.tableOrCustomer || '');
      customerPhoneInput = ord.customerPhone || '';
      selectedCustomerId = ord.customerId || '';
      selectedPromoCode = ord.promoCode === 'POTONGAN MANUAL' ? 'MANUAL' : (ord.promoCode === 'POTONGAN ONLINE' ? 'ONLINE' : (ord.promoCode || ''));
      manualDiscountNominal = ord.promoCode === 'POTONGAN MANUAL' ? (ord.discount || 0) : 0;
      onlineDiscountNominal = ord.promoCode === 'POTONGAN ONLINE' ? (ord.discount || 0) : 0;
      cart = JSON.parse(JSON.stringify(ord.items || []));
      renderWorkspace();
      showToast(`Memuat Open Order ${ord.tableOrCustomer}`);
    }

    // ==================== PAYMENT MODAL (FULL & ITEMIZED SPLIT BILL) ====================
    function openPaymentModal() {
      if (cart.length === 0) return;
      const { total } = getCartTotals();
      payModalMode = 'FULL';
      singlePayMethod = 'Cash';
      cashReceivedInput = total;
      splitSelectedItems = {};
      cart.forEach((it, idx) => { splitSelectedItems[idx] = 0; });
      renderPaymentModalBody();
    }

    function adjustSplitQty(idx, delta) {
      const maxQ = cart[idx] ? cart[idx].qty : 0;
      const cur = Number(splitSelectedItems[idx]) || 0;
      splitSelectedItems[idx] = Math.max(0, Math.min(maxQ, cur + delta));
      renderPaymentModalBody();
    }

    function autoUpsertCrmCustomer(custNameRaw, custPhoneRaw, trxTotal) {
      const cleanName = String(custNameRaw || '').trim();
      const cleanPhone = String(custPhoneRaw || '').trim();
      const isTableOnly = !cleanName || /^meja\s*\d*$/i.test(cleanName);
      if (isTableOnly && !cleanPhone) return selectedCustomerId || '';

      const waDigits = sanitizeWaPhone(cleanPhone);
      let cust = db.customers.find(c =>
        (selectedCustomerId && c.id === selectedCustomerId) ||
        (waDigits && sanitizeWaPhone(c.phone) === waDigits) ||
        (!isTableOnly && c.name.toLowerCase() === cleanName.toLowerCase())
      );

      const addedPts = Math.floor((Number(trxTotal) || 0) / 10000);
      if (cust) {
        if (!isTableOnly && (!cust.name || cust.name.startsWith('Pelanggan '))) cust.name = cleanName;
        if (cleanPhone && !cust.phone) cust.phone = cleanPhone;
        cust.points = (Number(cust.points) || 0) + addedPts;
        if (cust.points >= 50) cust.tier = 'Gold Member';
        else if (cust.points >= 20) cust.tier = 'Silver Member';
      } else {
        cust = {
          id: 'CST-' + Date.now().toString().slice(-5),
          name: isTableOnly ? (`Pelanggan ${cleanPhone.slice(-4)}`) : cleanName,
          phone: cleanPhone,
          tier: addedPts >= 20 ? 'Silver Member' : 'Regular',
          points: addedPts,
          voucher: '',
          voucherDiscount: 0
        };
        db.customers.unshift(cust);
      }
      autoSyncMasterSlices(['CUSTOMERS']);
      return cust.id;
    }

    function finalizeCheckoutPayment() {
      const { subtotal, discount, total, appliedCode } = getCartTotals();
      let paidItems = [];
      let remItems = [];
      let paidSub = subtotal;
      let paidDisc = discount;
      let paidTotal = total;

      if (payModalMode === 'SPLIT') {
        cart.forEach((it, idx) => {
          const payQ = Math.min(it.qty, Math.max(0, Number(splitSelectedItems[idx]) || 0));
          const remQ = it.qty - payQ;
          if (payQ > 0) paidItems.push({ ...it, qty: payQ });
          if (remQ > 0) remItems.push({ ...it, qty: remQ });
        });
        if (paidItems.length === 0) return showToast('Pilih minimal 1 produk untuk dibayar!', true);
        paidSub = paidItems.reduce((s, it) => s + (it.price * it.qty), 0);
        paidDisc = subtotal > 0 ? Math.min(paidSub, Math.round(discount * (paidSub / subtotal))) : 0;
        paidTotal = Math.max(0, paidSub - paidDisc);
      } else {
        paidItems = JSON.parse(JSON.stringify(cart));
      }

      if (singlePayMethod === 'Cash' && cashReceivedInput < paidTotal) {
        return showToast('Uang tunai yang diterima kurang!', true);
      }

      const custId = autoUpsertCrmCustomer(tableOrCustomerNote, customerPhoneInput, paidTotal);
      const totalCost = paidItems.reduce((s, it) => s + ((it.cost || 0) * it.qty), 0);
      const changeAmt = singlePayMethod === 'Cash' ? Math.max(0, cashReceivedInput - paidTotal) : 0;

      const trx = {
        id: 'TRX-' + Date.now().toString().slice(-6),
        status: 'PAID',
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote.trim() || '-',
        customerPhone: customerPhoneInput.trim(),
        customerId: custId,
        cashier: currentUser.name,
        items: paidItems,
        subtotal: paidSub,
        discount: paidDisc,
        promoCode: appliedCode,
        total: paidTotal,
        totalCost,
        paymentMethod: singlePayMethod,
        cashReceived: singlePayMethod === 'Cash' ? cashReceivedInput : paidTotal,
        change: changeAmt
      };

      paidItems.forEach(item => {
        const prod = db.products.find(p => p.id === item.id || p.sku === item.sku);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
      });

      db.transactions.unshift(trx);

      if (remItems.length > 0) {
        const remSub = remItems.reduce((s, it) => s + (it.price * it.qty), 0);
        const remDisc = Math.max(0, discount - paidDisc);
        const remTotal = Math.max(0, remSub - remDisc);
        const remCost = remItems.reduce((s, it) => s + ((it.cost || 0) * it.qty), 0);
        const remOrder = {
          id: activeOpenOrderId || ('ORD-' + Date.now().toString().slice(-6)),
          status: 'OPEN',
          date: todayISO(),
          time: nowTimeStr(),
          orderType,
          tableOrCustomer: tableOrCustomerNote.trim() || 'Open Bill (Sisa Split)',
          customerPhone: customerPhoneInput.trim(),
          customerId: custId,
          cashier: currentUser.name,
          items: remItems,
          subtotal: remSub,
          discount: remDisc,
          promoCode: appliedCode,
          total: remTotal,
          totalCost: remCost,
          paymentMethod: 'Belum Bayar'
        };
        if (activeOpenOrderId) {
          const idx = db.transactions.findIndex(t => t.id === activeOpenOrderId);
          if (idx >= 0) db.transactions[idx] = remOrder;
          else db.transactions.unshift(remOrder);
        } else {
          db.transactions.unshift(remOrder);
        }
        autoSyncMasterSlices(['OPEN_ORDERS']);
      } else if (activeOpenOrderId) {
        db.transactions = db.transactions.filter(t => t.id !== activeOpenOrderId);
        autoSyncMasterSlices(['OPEN_ORDERS']);
      }

      saveDB();
      syncMasterEvent('POS_TRANSACTION_PAID', trx);
      autoSyncMasterSlices(['MENU']);

      const prefillWa = customerPhoneInput.trim();
      resetCart();
      openPostCheckoutSuccessModal(trx, prefillWa, remItems.length > 0);
    }

    function requestVoidPaidTrx(trxId) {
      const t = db.transactions.find(x => x.id === trxId && x.status === 'PAID');

      openModal(`
        <div class="modal-head">

    function confirmVoidPaidTrx(trxId) {
      const reason = document.getElementById('paidVoidReasonSel').value;
      const pin = document.getElementById('paidVoidPinInp').value.trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pin);
      if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);

      const t = db.transactions.find(x => x.id === trxId);
      if (!t) return;
      t.status = 'CANCELLED';
      t.voidReason = reason;
      t.voidBy = approver.name;
      (t.items || []).forEach(it => {
        const p = db.products.find(x => x.id === it.id || x.sku === it.sku);
        if (p) p.stock += it.qty;
      });

      const audit = {
        id: 'AUD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderId: t.id,
        itemName: `VOID NOTA (${rp(t.total)})`,
        cashier: currentUser.name,
        authorizedBy: approver.name,
        reason
      };
      db.auditLogs.unshift(audit);

      saveDB();
      syncMasterEvent('PAID_TRX_CANCELLED', { id: t.id, reason, voidBy: approver.name });
      syncMasterEvent('AUDIT_VOID_LOGGED', audit);
      autoSyncMasterSlices(['MENU']);
      closeModal();
      renderWorkspace();
      showToast(`Nota ${t.id} berhasil dibatalkan!`);
    }

    // ==================== TAB 5: KELUAR KASIR (CLOSING SHIFT) ====================
    function getDailyClosingStats() {
      const todayBounds = getDateBounds('TODAY');
      const paid = db.transactions.filter(t => t.status === 'PAID' && isDateInBounds(t.date, todayBounds));
      const grossSales = paid.reduce((s, t) => s + t.total, 0);
      const cashSales = paid.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + t.total, 0);
      const qrisSales = paid.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0);
      const tfSales = paid.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
      const onlineSales = paid.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);

      const drawerToday = db.cashDrawer.filter(c => isDateInBounds(c.date, todayBounds));
      const cashIn = drawerToday.filter(c => c.type === 'IN').reduce((s, c) => s + c.amount, 0);
      const cashOut = drawerToday.filter(c => c.type === 'OUT').reduce((s, c) => s + c.amount, 0);
      const expectedCash = (db.shift.openingCash || 0) + cashSales + cashIn - cashOut;

      const prodMap = {};
      let totalQtySold = 0;
      paid.forEach(t => {
        (t.items || []).forEach(it => {
          prodMap[it.name] = (prodMap[it.name] || 0) + (Number(it.qty) || 0);
          totalQtySold += (Number(it.qty) || 0);
        });
      });
      const soldProductsList = Object.entries(prodMap).map(([name, qty]) => ({ name, qty })).sort((a, b) => b.qty - a.qty);

      return { count: paid.length, grossSales, cashSales, qrisSales, tfSales, onlineSales, cashIn, cashOut, expectedCash, soldProductsList, totalQtySold };
    }

    function renderReportPnlSubtab(box) {
      const bounds = getDateBounds(reportPeriod, reportCustomStart, reportCustomEnd);
      const paid = db.transactions.filter(t => t.status === 'PAID' && isDateInBounds(t.date, bounds));
      const gross = paid.reduce((s, t) => s + (t.subtotal || t.total), 0);
      const disc = paid.reduce((s, t) => s + (t.discount || 0), 0);
      const netSales = paid.reduce((s, t) => s + t.total, 0);
      const hpp = paid.reduce((s, t) => s + (t.totalCost || (t.items || []).reduce((si, i) => si + ((i.cost || 0) * i.qty), 0)), 0);
      const grossProfit = netSales - hpp;

      const opsOut = db.cashDrawer.filter(c => c.type === 'OUT' && isDateInBounds(c.date, bounds) && !c.note.toLowerCase().includes('setoran') && !c.note.toLowerCase().includes('transfer sales')).reduce((s, c) => s + c.amount, 0);
      const wages = db.attendance.filter(a => isDateInBounds(a.date, bounds)).reduce((s, a) => s + (a.wage || 0), 0);
      const netProfit = grossProfit - opsOut - wages;
      const margin = netSales > 0 ? Math.round((netProfit / netSales) * 100) : 0;

      box.innerHTML = `
        <div class="bento-grid-4" style="margin-bottom:14px;">

            <div class="kpi-label">Biaya Ops & Gaji Staf</div>
            <div class="kpi-value">${rp(opsOut + wages)}</div>
            <div class="kpi-sub">Ops ${rp(opsOut)} • Gaji ${rp(wages)}</div>
          </div>
          <div class="kpi-tile yellow">
            <div class="kpi-label">Laba Bersih (Net Profit)</div>
            <div class="kpi-value">${rp(netProfit)}</div>
            <div class="kpi-sub">Margin ${margin}%</div>
          </div>
        </div>
      `;
    }

    function renderReportSettlementSubtab(box) {
      const bounds = getDateBounds(settlePeriod, settleCustomStart, settleCustomEnd);
      const periodTrx = db.transactions.filter(t => t.status === 'PAID' && isDateInBounds(t.date, bounds));
      const autoPayroll = db.attendance.filter(a => isDateInBounds(a.date, bounds)).reduce((s, a) => s + (a.wage || 0), 0);
      const activePayroll = settleManualPayrollInput !== null ? Number(settleManualPayrollInput) : autoPayroll;

      const deletedSet = new Set((db.deletedBrands || []).map(b => b.toLowerCase()));
      const activeBrands = (db.brandConfigs || []).filter(b => b && b.brand && !deletedSet.has(b.brand.toLowerCase()));

      let totalSalaryBasisQty = 0;
      const statsMap = {};
      activeBrands.forEach(b => {
        statsMap[b.brand] = { totalQty: 0, commQty: 0, commGross: 0, salQty: 0, grossSales: 0 };
      });

      periodTrx.forEach(t => {
        const ratio = t.subtotal > 0 ? (t.total / t.subtotal) : 1;
        (t.items || []).forEach(it => {
          const bName = (it.brand && !deletedSet.has(it.brand.toLowerCase())) ? it.brand : 'Kopi Jiwara';
          if (!statsMap[bName]) statsMap[bName] = { totalQty: 0, commQty: 0, commGross: 0, salQty: 0, grossSales: 0 };
          const lineNet = Math.round((it.price * it.qty) * ratio);
          statsMap[bName].totalQty += it.qty;
          statsMap[bName].grossSales += lineNet;
          if (it.includeCommissionShare !== false) {
            statsMap[bName].commQty += it.qty;
            statsMap[bName].commGross += lineNet;
          }
          if (it.includeSalaryShare !== false) {
            statsMap[bName].salQty += it.qty;
            totalSalaryBasisQty += it.qty;
          }
        });

    function confirmDeleteBrandOwner(brandName) {
      db.brandConfigs = (db.brandConfigs || []).filter(b => b.brand.toLowerCase() !== brandName.toLowerCase());
      if (!db.deletedBrands) db.deletedBrands = [];
      if (!db.deletedBrands.some(b => b.toLowerCase() === brandName.toLowerCase())) db.deletedBrands.push(brandName);
      db.products.forEach(p => { if ((p.brand || '').toLowerCase() === brandName.toLowerCase()) p.brand = 'Kopi Jiwara'; });
      saveDB();
      autoSyncMasterSlices(['CATEGORIES_BRANDS', 'MENU']);
      closeModal();
      renderWorkspace();
      showToast(`Brand "${brandName}" dihapus!`);
    }

    function saveBrandSettlement(brand, periodLabel, grossSales, commissionPct, commissionCut, salaryCut, netTransfer) {
      const rec = {
        id: 'STL-' + Date.now().toString().slice(-6),
        date: todayISO(),
        periodLabel,
        brand,
        grossSales,
        commissionPct,
        commissionCut,
        salaryCut,
        netTransfer,
        pic: currentUser.name
      };
      db.brandSettlements.unshift(rec);
      const cd = {
        id: 'CD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OUT',
        amount: netTransfer,
        note: `Transfer Sales ${brand} (${periodLabel})`,
        by: currentUser.name
      };
      db.cashDrawer.unshift(cd);
      saveDB();
      syncMasterEvent('BRAND_SETTLEMENT_PAID', rec);
      syncMasterEvent('CASH_DRAWER_ADDED', cd);
      renderWorkspace();
      showToast(`Settlement ${brand} (${rp(netTransfer)}) dicatat!`);
    }

        `*BERITA ACARA SETTLEMENT — ${db.settings.outletName.toUpperCase()}*`,

        `────────────────────`,

      window.open(digits ? `https://wa.me/${digits}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function confirmAdjInv(invId) {
      const it = db.inventory.find(x => x.id === invId);
      if (!it) return;
      const type = document.getElementById('invAdjType').value;
      const qty = Number(document.getElementById('invAdjQty').value) || 0;
      if (type.includes('(+)')) it.stock += qty;
      else if (type.includes('(-)')) it.stock = Math.max(0, it.stock - qty);
      else it.stock = qty;

      const log = {
        id: 'LOG-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        itemName: it.name,
        type,
        qty,
        afterStock: it.stock,
        pic: currentUser.name
      };
      db.stockLogs.unshift(log);
      saveDB();
      syncMasterEvent('STOCK_LOG_ADDED', log);
      autoSyncMasterSlices(['INVENTORY']);
      closeModal();
      renderWorkspace();
      showToast('Stok diperbarui!');
    }

    function moveCatStep(catName, delta) {
      const list = normalizeUniqueCategories(db.categories);
      const idx = list.indexOf(catName);
      if (idx <= 0) return;
      const target = idx + delta;
      if (target < 1 || target >= list.length) return;
      [list[idx], list[target]] = [list[target], list[idx]];
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['CATEGORIES_BRANDS']);
      renderWorkspace();
      showToast('Urutan kategori diperbarui!');
    }

    function moveCatPos(catName, zeroIdx) {
      const list = normalizeUniqueCategories(db.categories);
      const oldIdx = list.indexOf(catName);
      if (oldIdx <= 0) return;
      const clamped = Math.max(1, Math.min(list.length - 1, zeroIdx));
      list.splice(oldIdx, 1);
      list.splice(clamped, 0, catName);
      db.categories = list;
      saveDB();
      autoSyncMasterSlices(['CATEGORIES_BRANDS']);
      renderWorkspace();
      showToast(`"${catName}" dipindah ke urutan #${clamped + 1}`);
    }

    'MASTER_KATEGORI': ['Urutan', 'Nama_Kategori'],
    'GUDANG_STOK': ['Kode_Bahan', 'Nama_Bahan', 'Kategori', 'Stok_Sistem', 'Min_Stok', 'Satuan', 'Status_Stok'],
    'LOG_STOK_GUDANG': ['ID_Log', 'Tanggal', 'Jam', 'Nama_Bahan', 'Jenis_Mutasi', 'Jumlah', 'Sisa_Stok', 'PIC'],
    'MASTER_PEGAWAI': ['ID_Staf', 'Nama_Pegawai', 'Jabatan', 'PIN_4_Digit', 'Upah_Harian', 'Status'],
    'MASTER_PROMO': ['Kode_Promo', 'Judul_Promo', 'Jenis_Potongan', 'Nilai_Potongan', 'Min_Belanja', 'Berlaku_Sampai', 'Status'],
    'ABSENSI_KARYAWAN': ['Tanggal', 'Nama_Pegawai', 'Jabatan', 'Jam_Masuk', 'Jam_Pulang', 'Upah_Harian']
  };
  Object.keys(specs).forEach(function(name) {
    var sh = ss.getSheetByName(name) || ss.insertSheet(name);
    if (sh.getLastRow() === 0) {
      sh.appendRow(specs[name]);
      sh.getRange(1, 1, 1, specs[name].length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
    }
  });
}

function readSheetObjects(ss, name) {
  var sh = ss.getSheetByName(name);
  if (!sh || sh.getLastRow() < 2) return [];
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rows = sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).getValues();
  return rows.map(function(r) {
    var obj = {};
    headers.forEach(function(h, idx) { obj[h] = r[idx]; });
    return obj;
  });
}

function writeSheetByHeaders(ss, name, defaultHeaders, rowsData) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  if (sh.getLastRow() > 1) {
    sh.getRange(2, 1, sh.getLastRow() - 1, lastCol).clearContent();
  }
  if (rowsData && rowsData.length > 0) {
    var matrix = rowsData.map(function(rowObj) {
      return headers.map(function(h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
    });
    sh.getRange(2, 1, matrix.length, headers.length).setValues(matrix);
  }
}

function appendRowByHeaders(ss, name, defaultHeaders, rowObj) {
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(defaultHeaders);
    sh.getRange(1, 1, 1, defaultHeaders.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
  }
  var lastCol = sh.getLastColumn();
  var headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function(h) { return String(h).trim(); });
  var rowArr = headers.map(function(h) { return rowObj[h] !== undefined ? rowObj[h] : ''; });
  sh.appendRow(rowArr);
}
