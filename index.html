    function sendPostPaymentWhatsApp(trxId) {
      const trx = db.transactions.find(t => t.id === trxId);
      if (!trx) return;
      const rawPhone = (document.getElementById('postPayWaPhone')?.value || '').trim();
      let cleanDigits = rawPhone.replace(/\D/g, '');
      if (!cleanDigits || cleanDigits.length < 8) {
        showToast('Masukkan nomor WhatsApp pelanggan yang valid terlebih dahulu.', true);
        const inp = document.getElementById('postPayWaPhone');
        if (inp) inp.focus();
        return;
      }

      trx.customerPhone = rawPhone;
      const crmSaved = upsertCRMCustomerFromOrder(trx.customer, rawPhone, 0, '');
      saveDB();
      if (crmSaved) autoSyncMasterSlices(['customers']);

      let intlPhone = cleanDigits;
      if (intlPhone.startsWith('0')) intlPhone = '62' + intlPhone.slice(1);
      else if (intlPhone.startsWith('8')) intlPhone = '62' + intlPhone;

      const text = formatWhatsAppReceiptText(trx);
      window.open(`https://wa.me/${intlPhone}?text=${encodeURIComponent(text)}`, '_blank');
      showToast(`Mengirim bukti pembayaran ${trx.id} ke WhatsApp...`);
    }

    function completeCheckout(total, subtotal, discount) {
      let cashPaid = total;
      let change = 0;
      if (checkoutMethod === 'Cash') {
        const el = document.getElementById('cashReceivedField');
        cashPaid = parseDigits(el ? el.value : total);
        if (cashPaid < total) {
          showToast('Nominal uang cash diterima masih kurang.', true);
          return;
        }
        change = cashPaid - total;
      }

      const isSplitFlow = Boolean(pendingSplitContext);
      const rawItems = isSplitFlow ? pendingSplitContext.paidItems : JSON.parse(JSON.stringify(cart));
      const itemsToPay = rawItems.map(it => ({
        ...it,
        brand: getProductBrand(it),
        includeCommissionShare: isProductIncludedInCommission(it),
        includeSalaryShare: isProductIncludedInSalaryShare(it)
      }));
      const leftoverItems = isSplitFlow ? pendingSplitContext.leftoverItems : [];

      const trxId = 'TRX-' + Math.floor(1000 + Math.random() * 9000);
      const costTotal = itemsToPay.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
      const customerLabel = isSplitFlow
        ? ((cartCustomer.trim() || 'Split Bill') + ' (Split)')
        : (cartCustomer.trim() || 'Walk-in');
      const promoLabel = cartPromoCode === '__MANUAL__' ? 'MANUAL' : cartPromoCode;

      const trx = {
        id: trxId, date: new Date().toISOString(), orderType: cartOrderType,
        customer: customerLabel,
        customerPhone: cartCustomerPhone.trim(),
        promoCode: promoLabel,
        cashier: currentUser.name,
        status: 'PAID', paymentMethod: checkoutMethod, subtotal, discount, total, costTotal,
        cashPaid, change, items: itemsToPay
      };

      db.transactions.unshift(trx);
      deductProductStock(itemsToPay);
      const crmUpdated = upsertCRMCustomerFromOrder(cartCustomer.trim(), cartCustomerPhone.trim(), total, promoLabel);

      const brandMap = {};
      trx.items.forEach(it => { brandMap[it.id] = getProductBrand(it); });
      syncMasterEvent('SALE_COMPLETED', { ...trx, brandMap });

      if (isSplitFlow && leftoverItems.length > 0) {
        const remTotal = leftoverItems.reduce((s, i) => s + i.price * i.qty, 0);
        const remCost = leftoverItems.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
        const openId = editingOpenOrderId || ('ORD-' + Math.floor(1000 + Math.random() * 9000));
        const preservedDate = editingOpenOrderDate || new Date().toISOString();
        const openOrd = {
          id: openId, date: preservedDate, orderType: cartOrderType,
          customer: (cartCustomer.trim() || 'Sisa Split Bill'), cashier: currentUser.name,
          status: 'OPEN', paymentMethod: 'OPEN', subtotal: remTotal, discount: 0,
          total: remTotal, costTotal: remCost, cashPaid: 0, change: 0, items: leftoverItems
        };
        const exIdx = db.transactions.findIndex(t => t.id === openId);
        if (exIdx >= 0) db.transactions[exIdx] = openOrd;
        else db.transactions.unshift(openOrd);
      } else if (editingOpenOrderId) {
        db.transactions = db.transactions.filter(t => t.id !== editingOpenOrderId);
      }

      const slicesToSync = ['openOrders'];
      if (crmUpdated) slicesToSync.push('customers');
      autoSyncMasterSlices(slicesToSync);

      pendingSplitContext = null;
      saveDB();
      clearCart();
      printThermalReceipt(trx);
      if (db.outlet && db.outlet.printerAutoPrint && db.outlet.printerLocked) {
        sendReceiptToBluetoothPrinter(trx, true);
      }
      openPaymentSuccessModal(trx, isSplitFlow);
    }

    function deductProductStock(items) {
      items.forEach(it => {
        const prod = db.products.find(p => p.id === it.id);
        if (prod) prod.stock = Math.max(0, (Number(prod.stock) || 0) - it.qty);
      });
    }

    function printThermalReceipt(trx) {
      const area = document.getElementById('printArea');
      const receiptLogo = db.outlet.logoDataUrl || DEFAULT_JIWARA_LOGO_URL;
      area.innerHTML = `
        <div style="text-align:center;margin-bottom:4px;"><img src="${receiptLogo}" style="width:52px;height:52px;object-fit:contain;border-radius:12px;" /></div>
        <div style="text-align:center;font-weight:bold;font-size:14px;">${esc(db.outlet.name)}</div>
        <div style="text-align:center;font-size:10px;">${esc(db.outlet.address)}</div>
        ${db.outlet.phone ? `<div style="text-align:center;font-size:10px;">Telp: ${esc(db.outlet.phone)}</div>` : ''}
        ${db.outlet.socialMedia ? `<div style="text-align:center;font-size:10px;">IG/Sosmed: ${esc(db.outlet.socialMedia)}</div>` : ''}
        <hr style="border-top:1px dashed #000;" />
        <div>No: ${esc(trx.id)}</div>
        <div>Tgl: ${new Date(trx.date).toLocaleString('id-ID')}</div>
        <div>Kasir: ${esc(trx.cashier)} | ${esc(trx.orderType)}</div>

    // ==================== 3. LAPORAN KASIR ====================
    function filterTransactionsByPreset(preset, customStart = '', customEnd = '') {
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const yest = new Date(now);
      yest.setDate(now.getDate() - 1);
      const yestStr = yest.toISOString().slice(0, 10);

      return db.transactions.filter(t => {
        const d = new Date(t.date);
        const dStr = t.date.slice(0, 10);
        if (preset === 'Custom Date') {
          if (customStart && dStr < customStart) return false;
          if (customEnd && dStr > customEnd) return false;
          return true;
        }
        if (preset === 'Hari Ini') return dStr === todayStr;
        if (preset === 'Kemarin') return dStr === yestStr;
        if (preset === '7 Hari Terakhir') return (now - d) / (1000 * 60 * 60 * 24) <= 7;
        if (preset === 'Minggu Ini') {
          const s = new Date(now); s.setDate(now.getDate() - now.getDay());
          s.setHours(0, 0, 0, 0);
          return d >= s;
        }
        if (preset === 'Minggu Lalu') {
          const st = new Date(now); st.setDate(now.getDate() - now.getDay());
          st.setHours(0, 0, 0, 0);
          const sl = new Date(st); sl.setDate(st.getDate() - 7);
          return d >= sl && d < st;
        }
        if (preset === 'Bulan Ini') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        if (preset === 'Bulan Lalu') {
          const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
        }
        return true;
      });
    }

    function filterDateStringByPreset(dateStr, preset, customStart = '', customEnd = '') {
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const yest = new Date(now);
      yest.setDate(now.getDate() - 1);
      const yestStr = yest.toISOString().slice(0, 10);
      const d = new Date(dateStr + 'T00:00:00');

      if (preset === 'Custom Date') {
        if (customStart && dateStr < customStart) return false;
        if (customEnd && dateStr > customEnd) return false;
        return true;
      }
      if (preset === 'Hari Ini') return dateStr === todayStr;
      if (preset === 'Kemarin') return dateStr === yestStr;
      if (preset === '7 Hari Terakhir') return (now - d) / (1000 * 60 * 60 * 24) <= 7;
      if (preset === 'Minggu Ini') {
        const s = new Date(now); s.setDate(now.getDate() - now.getDay());
        s.setHours(0, 0, 0, 0);
        return d >= s;
      }
      if (preset === 'Minggu Lalu') {
        const st = new Date(now); st.setDate(now.getDate() - now.getDay());
        st.setHours(0, 0, 0, 0);
        const sl = new Date(st); sl.setDate(st.getDate() - 7);
        return d >= sl && d < st;
      }
      if (preset === 'Bulan Ini') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (preset === 'Bulan Lalu') {
        const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
      }
      return true;
    }

    function getTodayClosingSummary() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayTrx = db.transactions.filter(t => t.date.slice(0, 10) === todayStr);
      const paidTrx = todayTrx.filter(t => t.status === 'PAID');
      const openTrx = todayTrx.filter(t => t.status === 'OPEN');

      const cashSales = paidTrx.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + t.total, 0);
      const qrisSales = paidTrx.filter(t => t.paymentMethod === 'QRIS').reduce((s, t) => s + t.total, 0);
      const transferSales = paidTrx.filter(t => t.paymentMethod === 'Transfer').reduce((s, t) => s + t.total, 0);
      const onlineFoodSales = paidTrx.filter(t => t.paymentMethod === 'Online Food').reduce((s, t) => s + t.total, 0);
      const totalSales = cashSales + qrisSales + transferSales + onlineFoodSales;

      const todayCashIn = db.cashDrawerLogs.filter(c => c.date.slice(0, 10) === todayStr && c.type === 'IN').reduce((s, c) => s + c.amount, 0);
      const todayCashOut = db.cashDrawerLogs.filter(c => c.date.slice(0, 10) === todayStr && c.type === 'OUT').reduce((s, c) => s + c.amount, 0);
      const expectedCash = (db.shift.openingCash || 0) + cashSales + todayCashIn - todayCashOut;

      const itemMap = {};
      paidTrx.forEach(t => (t.items || []).forEach(it => {
        if (!itemMap[it.name]) itemMap[it.name] = { name: it.name, qty: 0, total: 0 };
        itemMap[it.name].qty += Number(it.qty) || 0;
        itemMap[it.name].total += (Number(it.price) || 0) * (Number(it.qty) || 0);
      }));
      const soldItems = Object.values(itemMap).sort((a, b) => b.qty - a.qty);
      const totalItemsQty = soldItems.reduce((s, i) => s + i.qty, 0);

      return {
        todayStr, paidTrx, openTrx, cashSales, qrisSales, transferSales,
        onlineFoodSales, totalSales, todayCashIn, todayCashOut, expectedCash,
        soldItems, totalItemsQty
      };
    }

    function buildCashflowEntries(period, customStart, customEnd) {
      const entries = [];
      const paidTrx = filterTransactionsByPreset(period, customStart, customEnd).filter(t => t.status === 'PAID');
      paidTrx.forEach(t => {
        entries.push({
          id: t.id,
          date: t.date,
          debit: t.total,
          kredit: 0,
          category: 'Penjualan POS',
          method: t.paymentMethod,
          note: `Sales ${t.paymentMethod} (${t.orderType}) — ${t.customer || 'Walk-in'}`,
          pic: t.cashier
        });
      });

      (db.cashDrawerLogs || []).forEach(c => {
        if (filterDateStringByPreset(c.date.slice(0, 10), period, customStart, customEnd)) {
          const isSetoran = String(c.note || '').toLowerCase().startsWith('setoran');
          entries.push({
            id: c.id,
            date: c.date,
            debit: c.type === 'IN' ? c.amount : 0,
            kredit: c.type === 'OUT' ? c.amount : 0,
            category: c.type === 'IN' ? 'Kas Masuk Laci' : (isSetoran ? 'Setoran ke Owner/Finance' : 'Biaya Operasional'),
            method: 'Cash Laci',
            note: c.note,
            pic: c.cashier
          });
        }
      });

      (db.brandSettlements || []).forEach(st => {
        if (filterDateStringByPreset(st.date.slice(0, 10), period, customStart, customEnd)) {
          entries.push({
            id: st.id,
            date: st.date,
            debit: 0,
            kredit: st.netTransfer,
            category: 'Setoran Brand Owner',
            method: 'Transfer Bank',
            note: `Transfer Sales ${st.brand} (${st.periodLabel}) — Komisi ${st.commissionPct}% & Gaji`,
            pic: st.pic
          });
        }
      });

      return entries.sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function computeBrandSettlementData(period, customStart, customEnd) {
      const paidList = filterTransactionsByPreset(period, customStart, customEnd).filter(t => t.status === 'PAID');
      const attWages = (db.attendanceLogs || [])
        .filter(a => filterDateStringByPreset(a.date, period, customStart, customEnd))
        .reduce((s, a) => s + (Number(a.wage) || 0), 0);

      const salaryPool = settlementCustomSalaryPool !== null ? settlementCustomSalaryPool : attWages;
      const brands = getAllAvailableBrands();
      const map = {};
      brands.forEach(b => {
        const cfg = getBrandConfig(b);
        map[b] = {
          brand: b,
          commissionPct: Number(cfg.commissionPct) || 0,
          salaryShareActive: cfg.salaryShareActive !== false,
          ownerPhone: cfg.ownerPhone || '',
          totalQty: 0,
          commissionQty: 0,
          qualifyingQty: 0,
          grossSales: 0,
          commissionableSales: 0,
          qualifyingSales: 0
        };
      });

      paidList.forEach(t => {
        const trxSub = t.subtotal > 0 ? t.subtotal : (t.items || []).reduce((s, x) => s + x.price * x.qty, 0);
        const trxDiscount = Number(t.discount) || 0;

        (t.items || []).forEach(it => {
          const b = getProductBrand(it);
          if (!map[b]) {
            const cfg = getBrandConfig(b);
            map[b] = {
              brand: b,
              commissionPct: Number(cfg.commissionPct) || 10,
              salaryShareActive: cfg.salaryShareActive !== false,
              ownerPhone: cfg.ownerPhone || '',
              totalQty: 0,
              commissionQty: 0,
              qualifyingQty: 0,
              grossSales: 0,
              commissionableSales: 0,
              qualifyingSales: 0
            };
          }
          const lineGross = (Number(it.price) || 0) * (Number(it.qty) || 0);
          const linePropDiscount = trxSub > 0 ? Math.round(trxDiscount * (lineGross / trxSub)) : 0;
          const lineNet = Math.max(0, lineGross - linePropDiscount);
          const qty = Number(it.qty) || 0;

          const incComm = isProductIncludedInCommission(it);
          const incSalary = isProductIncludedInSalaryShare(it) && map[b].salaryShareActive;

          map[b].totalQty += qty;
          map[b].grossSales += lineNet;

          if (incComm) {
            map[b].commissionQty += qty;
            map[b].commissionableSales += lineNet;
          }
          if (incSalary) {
            map[b].qualifyingQty += qty;
            map[b].qualifyingSales += lineNet;
          }
        });
      });

      const rows = Object.values(map);
      const totalQualifyingQty = rows.reduce((s, r) => s + r.qualifyingQty, 0);
      const totalQualifyingSales = rows.reduce((s, r) => s + r.qualifyingSales, 0);

      rows.forEach(r => {
        r.commissionAmount = Math.round(r.commissionableSales * (r.commissionPct / 100));
        if (salaryPool > 0) {
          if (settlementBasisMode === 'sales' && totalQualifyingSales > 0) {
            r.salaryShareRatio = r.qualifyingSales / totalQualifyingSales;
          } else if (totalQualifyingQty > 0) {
            r.salaryShareRatio = r.qualifyingQty / totalQualifyingQty;
          } else {
            r.salaryShareRatio = 0;
          }
        } else {
          r.salaryShareRatio = 0;
        }
        r.salaryDeduction = Math.round(salaryPool * r.salaryShareRatio);
        r.netTransfer = Math.max(0, r.grossSales - r.commissionAmount - r.salaryDeduction);
      });

      return { rows, salaryPool, attWages, totalQualifyingQty, totalQualifyingSales };
    }

    function saveCRMCustomerForm(custId) {
      const name = document.getElementById('crmFormName').value.trim();
      const phone = document.getElementById('crmFormPhone').value.trim();
      const tier = document.getElementById('crmFormTier').value;
      const specialVoucher = document.getElementById('crmFormVoucher').value;
      const notes = document.getElementById('crmFormNotes').value.trim();
      if (!name) { showToast('Nama pelanggan wajib diisi.', true); return; }
      if (!db.customers) db.customers = [];
      if (custId) {
        const idx = db.customers.findIndex(c => c.id === custId);
        if (idx >= 0) db.customers[idx] = { ...db.customers[idx], name, phone, tier, specialVoucher, notes };
      } else {
        db.customers.unshift({
          id: 'CRM-' + Math.floor(100 + Math.random() * 900),
          name, phone, tier, totalVisits: 0, totalSpent: 0,
          lastVisit: new Date().toISOString(), notes, specialVoucher
        });
      }
      saveDB();
      autoSyncMasterSlices(['customers']);
      closeModal();
      renderOwnerCRMTab(document.getElementById('mainContentArea'));
      showToast(`Data pelanggan ${name} tersimpan & disinkronkan ke CRM_PELANGGAN.`);
    }

    function deleteCRMCustomer(custId) {
      db.customers = (db.customers || []).filter(c => c.id !== custId);
      saveDB();
      autoSyncMasterSlices(['customers']);
      closeModal();
      renderOwnerCRMTab(document.getElementById('mainContentArea'));
      showToast('Pelanggan dihapus dari database CRM.');

    function saveCRMVoucherCampaign() {
      const code = document.getElementById('crmVchCode').value.trim().toUpperCase();
      const name = document.getElementById('crmVchName').value.trim();
      const type = document.getElementById('crmVchType').value;
      const value = Number(document.getElementById('crmVchVal').value) || 0;
      const startDate = document.getElementById('crmVchStart').value;
      const endDate = document.getElementById('crmVchEnd').value;
      const target = document.getElementById('crmVchTarget').value;
      if (!code || !name || value <= 0) { showToast('Lengkapi kode, nama, dan nilai voucher.', true); return; }

      db.promos.unshift({ id: 'prm-' + Date.now(), code, name, type, value, startDate, endDate, active: true });
      if (target === 'ALL') {
        (db.customers || []).forEach(c => { c.specialVoucher = code; });
      } else if (target === 'VIP_GOLD') {
        (db.customers || []).forEach(c => { if (c.tier === 'VIP Member' || c.tier === 'Gold Member') c.specialVoucher = code; });
      }
      saveDB();
      autoSyncMasterSlices(['customers', 'promos']);
      closeModal();
      renderOwnerCRMTab(document.getElementById('mainContentArea'));
      showToast(`Voucher CRM ${code} berhasil dibuat & disinkronkan!`);
    }

    function sendCRMVoucherWhatsApp(custId) {
      const cust = (db.customers || []).find(c => c.id === custId);
      if (!cust || !cust.phone) return;
      let waPhone = cust.phone.replace(/\D/g, '');
      if (waPhone.startsWith('0')) waPhone = '62' + waPhone.slice(1);
      const promoObj = db.promos.find(p => p.code === cust.specialVoucher);
      const voucherLine = promoObj
        ? `Gunakan kode voucher khusus *${promoObj.code}* (${promoObj.name} - potongan ${promoObj.type === 'percent' ? promoObj.value + '%' : rp(promoObj.value)}) pada kunjungan Anda berikutnya!`
        : `Terima kasih telah menjadi pelanggan setia *${db.outlet.name}*!`;
      const msg = `Halo Kak *${cust.name}* (${cust.tier || 'Member'}),\n\nSalam hangat dari *${db.outlet.name}*.\n${voucherLine}\n\nKami tunggu kedatangannya kembali ya!`;
      window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function updateInventoryStock(invId, val) {
      const item = db.inventory.find(i => i.id === invId);
      if (!item) return;
      item.stock = Math.max(0, Number(val) || 0);
      saveDB();
      autoSyncMasterSlices(['inventory']);
      showToast(`Stok ${item.name} diperbarui menjadi ${item.stock} ${item.unit}`);
    }

    function applyInventoryDelta(sign) {
      const invId = document.getElementById('mutInvSelect').value;
      const qty = Math.max(0, Number(document.getElementById('mutInvQty').value) || 0);
      if (qty <= 0) { showToast('Masukkan jumlah valid.', true); return; }
      const item = db.inventory.find(i => i.id === invId);
      if (!item) return;
      item.stock = Math.max(0, Number(item.stock) + sign * qty);
      saveDB();
      autoSyncMasterSlices(['inventory']);
      renderOwnerInventoryTab(document.getElementById('mainContentArea'));
      showToast(`Stok ${item.name} sekarang ${item.stock} ${item.unit} & tersinkron ke Sheets.`);
    }

        return matchCat && matchBrand && matchQ;

    function openAddMenuCategoryModal() {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">+ Tambah Kategori Menu</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori Baru</label><input id="newCatInput" class="styled-input" placeholder="Contoh: Non-Kopi & Mocktail" /></div>
        <button class="btn btn-pink" style="width:100%;padding:12px;" onclick="saveNewMenuCategory()">Simpan Kategori</button>
      `);
    }

    function saveNewMenuCategory() {
      const val = document.getElementById('newCatInput').value.trim();
      if (!val) return;
      if (db.categories.includes(val)) { showToast('Kategori sudah ada.', true); return; }
      db.categories.push(val);
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${val}" ditambahkan.`);
    }

    function openEditMenuCategoryModal(oldName) {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">Edit Kategori Menu</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="margin-bottom:14px;"><label class="field-label">Nama Kategori</label><input id="editCatInput" class="styled-input" value="${esc(oldName)}" /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn btn-danger" onclick="deleteMenuCategory('${esc(oldName)}')">Hapus</button>
          <button class="btn btn-dark" onclick="updateMenuCategory('${esc(oldName)}')">Simpan</button>
        </div>
      `);
    }

    function updateMenuCategory(oldName) {
      const nextName = document.getElementById('editCatInput').value.trim();
      if (!nextName) return;
      const idx = db.categories.indexOf(oldName);
      if (idx >= 0) db.categories[idx] = nextName;
      db.products.forEach(p => { if (p.category === oldName) p.category = nextName; });
      saveDB();
      autoSyncMasterSlices(['products']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Kategori diperbarui & disinkronkan.');
    }

    function deleteMenuCategory(catName) {
      db.categories = db.categories.filter(c => c !== catName);
      saveDB();
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${catName}" dihapus.`);
    }

    function openProductFormModal(prodId) {
      const prod = prodId ? db.products.find(p => p.id === prodId) : null;
      const cats = db.categories.filter(c => c !== 'Favorit');
      const brands = getAllAvailableBrands();
      const curBrand = prod ? getProductBrand(prod) : 'Kopi Jiwara';
      const curIncludeComm = prod ? isProductIncludedInCommission(prod) : true;
      const curIncludeSalary = prod ? isProductIncludedInSalaryShare(prod) : true;

      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">${prod ? 'Edit Detail Produk' : '+ Tambah Produk Baru'}</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <div style="display:grid;gap:10px;margin-bottom:14px;">
          <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;">
            <div><label class="field-label">SKU</label><input id="pfSku" class="styled-input" value="${esc(prod ? prod.sku : 'JW-' + (db.products.length + 1))}" /></div>
            <div><label class="field-label">Nama Produk</label><input id="pfName" class="styled-input" value="${esc(prod ? prod.name : '')}" placeholder="Nama menu..." /></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div>
              <label class="field-label">Brand Pemilik Produk</label>
              <input id="pfBrand" list="brandChoiceList" class="styled-input" value="${esc(curBrand)}" placeholder="Pilih atau ketik brand..." />
              <datalist id="brandChoiceList">
                ${brands.map(b => `<option value="${esc(b)}"></option>`).join('')}
              </datalist>
            </div>
            <div><label class="field-label">Kategori Menu</label><select id="pfCat" class="styled-select">${cats.map(c => `<option value="${esc(c)}" ${prod && prod.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
            <div><label class="field-label">Satuan</label><input id="pfUnit" class="styled-input" value="${esc(prod ? prod.unit : 'Cup')}" /></div>
            <div><label class="field-label">Harga Jual (Rp)</label><input id="pfPrice" type="text" inputmode="numeric" class="styled-input" value="${prod ? formatDigits(prod.price) : ''}" oninput="this.value=formatDigits(this.value)" /></div>
            <div><label class="field-label">HPP / Modal (Rp)</label><input id="pfCost" type="text" inputmode="numeric" class="styled-input" value="${prod ? formatDigits(prod.cost) : ''}" oninput="this.value=formatDigits(this.value)" /></div>
          </div>
          <div style="background:var(--green-soft);padding:10px 12px;border-radius:14px;display:grid;gap:8px;">
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;">
              <input id="pfIncludeComm" type="checkbox" ${curIncludeComm ? 'checked' : ''} />
              Masuk Hitungan Potongan Komisi Brand (%)
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;">
              <input id="pfIncludeSalary" type="checkbox" ${curIncludeSalary ? 'checked' : ''} />
              Masuk Hitungan Pembagian % Beban Gaji Brand
            </label>
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;cursor:pointer;">
              <input id="pfFav" type="checkbox" ${prod && prod.fav ? 'checked' : ''} />
              Tampilkan di Kategori Favorit Kasir
            </label>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:${prod ? '1fr 1.5fr' : '1fr'};gap:8px;">
          ${prod ? `<button class="btn btn-danger" onclick="deleteProductById('${esc(prod.id)}')">Hapus Produk</button>` : ''}
          <button class="btn btn-yellow" onclick="saveProductForm('${prod ? esc(prod.id) : ''}')">Simpan Produk</button>
        </div>
      `);
    }

    function saveProductForm(prodId) {
      const sku = document.getElementById('pfSku').value.trim();
      const name = document.getElementById('pfName').value.trim();
      const brand = document.getElementById('pfBrand').value.trim() || 'Kopi Jiwara';
      const category = document.getElementById('pfCat').value;
      const unit = document.getElementById('pfUnit').value.trim() || 'Cup';
      const price = parseDigits(document.getElementById('pfPrice').value);
      const cost = parseDigits(document.getElementById('pfCost').value);
      const includeCommissionShare = document.getElementById('pfIncludeComm').checked;
      const includeSalaryShare = document.getElementById('pfIncludeSalary').checked;
      const fav = document.getElementById('pfFav').checked;
      if (!name || price <= 0) { showToast('Nama produk dan harga jual wajib diisi.', true); return; }

      getBrandConfig(brand);

      if (prodId) {
        const idx = db.products.findIndex(p => p.id === prodId);
        if (idx >= 0) db.products[idx] = { ...db.products[idx], sku, name, brand, category, unit, price, cost, includeCommissionShare, includeSalaryShare, fav };
      } else {
        db.products.unshift({ id: 'prd-' + Date.now(), sku, name, brand, category, unit, price, cost, includeCommissionShare, includeSalaryShare, fav, stock: 50 });
      }
      saveDB();
      autoSyncMasterSlices(['products']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Data produk & aturan Komisi/Gaji disimpan.');
    }

    function deleteProductById(prodId) {
      db.products = db.products.filter(p => p.id !== prodId);
      saveDB();
      autoSyncMasterSlices(['products']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Produk dihapus & MASTER_MENU diperbarui.');
    }

    function updateStaffPin(staffId) {
      const val = document.getElementById('pinInp_' + staffId).value.trim();
      if (!/^\d{4}$/.test(val)) { showToast('PIN harus 4 digit angka.', true); return; }
      const st = db.staff.find(s => s.id === staffId);
      if (st) st.pin = val;
      saveDB();
      autoSyncMasterSlices(['staff']);
      document.getElementById('pinInp_' + staffId).value = '';
      showToast(`PIN untuk ${st.name} diperbarui & disinkronkan ke MASTER_PEGAWAI.`);
    }

      const st = staffId ? db.staff.find(s => s.id === staffId) : null;
      openModal(`
        <div class="modal-head">

          <button class="close-circle" onclick="closeModal()">x</button>

        <div style="display:grid;gap:10px;margin-bottom:14px;">

        </div>

    function saveStaffForm(staffId) {
      const name = document.getElementById('stFormName').value.trim();
      const role = document.getElementById('stFormRole').value;
      const pin = document.getElementById('stFormPin').value.trim();
      const dailyWage = parseDigits(document.getElementById('stFormWage').value);
      const active = document.getElementById('stFormActive').checked;
      if (!name || !/^\d{4}$/.test(pin)) { showToast('Isi nama dan PIN 4 digit angka.', true); return; }
      if (staffId) {
        const idx = db.staff.findIndex(s => s.id === staffId);
        if (idx >= 0) db.staff[idx] = { ...db.staff[idx], name, role, pin, dailyWage, active };
      } else {
        db.staff.push({ id: 'stf-' + Date.now(), name, role, pin, active, dailyWage });
      }
      saveDB();
      autoSyncMasterSlices(['staff']);
      closeModal();
      renderSettingsStaff(document.getElementById('settingsSubBody'));
      showToast(`Data pegawai ${name} disimpan & disinkronkan ke MASTER_PEGAWAI.`);
    }

    function deleteStaffMember(staffId) {
      if (staffId === 'stf-1') { showToast('Akun Owner utama tidak dapat dihapus.', true); return; }
      db.staff = db.staff.filter(s => s.id !== staffId);
      saveDB();
      autoSyncMasterSlices(['staff']);
      renderSettingsStaff(document.getElementById('settingsSubBody'));
      showToast('Data pegawai berhasil dihapus & MASTER_PEGAWAI diperbarui.');
    }

    function handleOutletLogoUpload(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 220;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          db.outlet.logoDataUrl = canvas.toDataURL('image/png', 0.9);
          saveDB();
          renderWorkspace();
          showToast('Logo outlet berhasil diperbarui.');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function scanAndConnectBluetoothPrinter() {
      if (db.outlet.printerLocked) {
        showToast('Perangkat printer sedang terkunci. Buka kunci terlebih dahulu untuk mengganti.', true);
        return;
      }
      if (!navigator.bluetooth) {
        showToast('Browser tidak mendukung Web Bluetooth langsung. Gunakan pasangan manual / Bluetooth OS.', true);
        openManualPrinterPairModal();
        return;
      }
      try {
        showToast('Memindai perangkat printer Bluetooth terdekat...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb',
            '49535343-fe7d-4ae5-8fa9-9fafd205e455',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '0000ffe0-0000-1000-8000-00805f9b34fb'
          ]
        });
        btPrinterDevice = device;
        btPrinterCharacteristic = null;
        btPrinterConnected = false;

        if (device.gatt) {
          const server = await device.gatt.connect();
          const services = await server.getPrimaryServices();
          for (const svc of services) {
            const chars = await svc.getCharacteristics();
            const writable = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
            if (writable) {
              btPrinterCharacteristic = writable;
              btPrinterConnected = true;
              break;
            }
          }
          device.addEventListener('gattserverdisconnected', () => {
            btPrinterConnected = false;
            if (settingsSubTab === 'sinkronisasi' && currentTab === 'pengaturan') {
              renderSettingsSystemSync(document.getElementById('settingsSubBody'));
            }
          });
        }

        db.outlet.printerName = device.name || 'Thermal Printer BT';
        db.outlet.printerDeviceId = device.id || ('BT-' + Date.now());
        db.outlet.printerLocked = true;
        if (db.outlet.printerAutoPrint === undefined) db.outlet.printerAutoPrint = true;
        saveDB();
        renderSettingsSystemSync(document.getElementById('settingsSubBody'));
        showToast(`Printer "${db.outlet.printerName}" berhasil terhubung & dikunci!`);
      } catch (err) {
        if (err && err.name !== 'NotFoundError') {
          showToast('Gagal menyambungkan BLE. Anda dapat memasangkan via Pengaturan Bluetooth HP/Tablet.', true);
        }
      }
    }

    function buildEscPosBytes(trx) {
      const enc = new TextEncoder();
      const sep = '--------------------------------\n';
      let lines = '\x1B\x40\x1B\x61\x01';
      lines += (db.outlet.name || 'KOPI JIWARA') + '\n';
      if (db.outlet.address) lines += db.outlet.address + '\n';
      if (db.outlet.phone) lines += 'Telp: ' + db.outlet.phone + '\n';
      lines += sep + '\x1B\x61\x00';
      lines += `No   : ${trx.id}\n`;
      lines += `Tgl  : ${new Date(trx.date).toLocaleString('id-ID')}\n`;
      lines += `Kasir: ${trx.cashier} (${trx.orderType})\n`;
      lines += `Pel  : ${trx.customer || 'Walk-in'}\n`;
      lines += sep;
      (trx.items || []).forEach(it => {
        lines += `${it.name}\n`;
        lines += `  ${it.qty} x ${rp(it.price)} = ${rp(it.price * it.qty)}\n`;
      });
      lines += sep;
      if (trx.discount > 0) lines += `Diskon : -${rp(trx.discount)}\n`;
      lines += `TOTAL (${trx.paymentMethod}) : ${rp(trx.total)}\n`;
      if (trx.paymentMethod === 'Cash') {
        lines += `Bayar  : ${rp(trx.cashPaid)}\n`;
        lines += `Kembali: ${rp(trx.change)}\n`;
      }
      lines += sep + '\x1B\x61\x01';
      lines += (db.outlet.receiptFooter || 'Terima kasih!') + '\n\n\n\x1D\x56\x41\x03';
      return enc.encode(lines);
    }

    async function sendReceiptToBluetoothPrinter(trx, silentFallback = false) {
      if (btPrinterCharacteristic) {
        try {
          const bytes = buildEscPosBytes(trx);
          const chunkSize = 100;
          for (let i = 0; i < bytes.length; i += chunkSize) {
            const slice = bytes.slice(i, i + chunkSize);
            if (btPrinterCharacteristic.properties.writeWithoutResponse) {
              await btPrinterCharacteristic.writeValueWithoutResponse(slice);
            } else {
              await btPrinterCharacteristic.writeValue(slice);
            }
          }
          showToast(`Struk berhasil dicetak ke ${db.outlet.printerName}`);
          return;
        } catch (e) {
          btPrinterConnected = false;
        }
      }
      if (!silentFallback) {
        window.print();
      }
    }

      const sampleTrx = {

    flushOfflineSyncQueue();
