<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background: rgba(11, 46, 35, 0.78);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>
          <div style="font-size:12px;color:#A7F3D0;margin-top:2px;">Sistem Kasir & Manajemen Outlet</div>
        </div>
        <div style="width:54px;height:54px;border-radius:16px;background:#093814;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.28);">
          <svg viewBox="0 0 100 100" width="52" height="52">
            <rect width="100" height="100" fill="#093814"/>
            <circle cx="50" cy="50" r="35" fill="#FFFFFF"/>
            <path d="M 33 53 C 32 69, 37 78, 52 78 C 66 78, 70 69, 72 44 C 73 29, 68 25, 48 25 C 33 25, 29 30, 30 35 C 31 41, 41 44, 52 43 C 60 42, 62 37, 58 34 C 54 31, 45 32, 44 36" fill="none" stroke="#093814" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:18px;padding:13px;margin-bottom:14px;">
        <label style="display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;color:#FACC15;text-transform:uppercase;margin-bottom:6px;" for="loginStaffSelect">Pilih Pegawai Bertugas</label>
        <select id="loginStaffSelect" class="login-select" onchange="clearPinPad()"></select>
      </div>

      <div>

    function renderJiwaraPngIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

      try {
        const startUrl = window.location.href.split('#')[0];
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v9';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              if (e.request.url.includes('script.google.com')) return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const seed = getInitialSeedDB();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
          return seed;
        }
        const parsed = JSON.parse(raw);
        const seed = getInitialSeedDB();
        const merged = {
          ...seed,
          ...parsed,
          settings: { ...seed.settings, ...(parsed.settings || {}) },
          shift: { ...seed.shift, ...(parsed.shift || {}) }
        };
        merged.categories = normalizeUniqueCategories(merged.categories);
        if (!Array.isArray(merged.brandConfigs) || merged.brandConfigs.length === 0) {
          merged.brandConfigs = getDefaultBrandConfigs();
        }
        if (!Array.isArray(merged.deletedBrands)) {
          merged.deletedBrands = [];
        }
        if (!Array.isArray(merged.brandSettlements)) {
          merged.brandSettlements = [];
        }
        return merged;
      } catch (e) {
        return getInitialSeedDB();
      }
    }

      if (p.brand) return p.brand;
      const c = (p.category || '').toLowerCase();
      if (c.includes('ayam') || c.includes('baba')) return 'Ayam Baba Jay';
      if (c.includes('jovangel')) return 'Jovangels';
      if (c.includes('jihyo')) return 'Jihyo';
      return 'Kopi Jiwara';
    }

    function getAllAvailableBrands() {
      const deletedSet = new Set((db.deletedBrands || []).map(b => String(b).toLowerCase()));
      const set = new Set();
      (db.brandConfigs || []).forEach(b => {
        if (b.brand && b.active !== false && !deletedSet.has(b.brand.toLowerCase())) {
          set.add(b.brand);
        }
      });
      (db.products || []).forEach(p => {
        if (p.brand && !deletedSet.has(p.brand.toLowerCase())) {
          set.add(p.brand);
        }
      });
      if (set.size === 0) set.add('Kopi Jiwara');
      return Array.from(set);
    }

      if (!db.brandConfigs) db.brandConfigs = getDefaultBrandConfigs();

      if (!cfg) {

    function formatWhatsAppPhone(rawPhone) {
      let clean = String(rawPhone || '').replace(/[^0-9]/g, '');
      if (!clean) return '';
      if (clean.startsWith('0')) clean = '62' + clean.slice(1);
      else if (clean.startsWith('8')) clean = '62' + clean;
      return clean;
    }

    function buildWhatsAppReceiptText(trx) {
      const lines = [
        `*STRUK PEMBAYARAN — ${db.settings.outletName}*`,
        `No. Nota : ${trx.id}`,
        `Tanggal  : ${trx.date} (${trx.time})`,
        `Pesanan  : ${trx.orderType}${trx.tableOrCustomer ? ' • ' + trx.tableOrCustomer : ''}`,
        `Kasir    : ${trx.cashier || '-'}`,
        `--------------------------------`,
        ...trx.items.map(i => `• ${i.name} (${i.qty}x) = ${rp(i.price * i.qty)}`),
        `--------------------------------`,
        `Subtotal : ${rp(trx.subtotal)}`
      ];
      if ((trx.discount || 0) > 0) {
        lines.push(`Potongan : -${rp(trx.discount)}`);
      }
      lines.push(`*TOTAL BAYAR : ${rp(trx.total)}*`);
      lines.push(`Metode Bayar : ${trx.paymentMethod}`);
      if (trx.paymentMethod === 'Cash' && (trx.cashReceived || 0) > 0) {
        lines.push(`Tunai Diterima : ${rp(trx.cashReceived)}`);
        lines.push(`Kembalian      : ${rp(trx.change || 0)}`);
      }
      lines.push(`Status : *LUNAS*`);
      lines.push(``);
      lines.push(`${db.settings.receiptFooter || 'Terima kasih telah berbelanja di Kopi Jiwara!'}`);
      return lines.join('\n');
    }

    function getDateRangeBounds(period, customStart, customEnd) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const endOfToday = new Date(today);
      endOfToday.setHours(23, 59, 59, 999);

      if (period === 'TODAY') {
        return { start: today, end: endOfToday, label: 'Hari Ini' };
      }
      if (period === 'YESTERDAY') {
        const y1 = new Date(today);
        y1.setDate(y1.getDate() - 1);
        const y2 = new Date(y1);
        y2.setHours(23, 59, 59, 999);
        return { start: y1, end: y2, label: 'Kemarin' };
      }
      if (period === 'THIS_WEEK') {
        const w1 = new Date(today);
        const day = w1.getDay();
        const diffToMon = (day === 0 ? -6 : 1 - day);
        w1.setDate(w1.getDate() + diffToMon);
        return { start: w1, end: endOfToday, label: 'Minggu Ini (Sen–Min)' };
      }
      if (period === 'LAST_WEEK') {
        const w1 = new Date(today);
        const day = w1.getDay();
        const diffToMon = (day === 0 ? -6 : 1 - day) - 7;
        w1.setDate(w1.getDate() + diffToMon);
        const w2 = new Date(w1);
        w2.setDate(w1.getDate() + 6);
        w2.setHours(23, 59, 59, 999);
        return { start: w1, end: w2, label: 'Minggu Lalu' };
      }
      if (period === '7D') {
        const d7 = new Date(today);
        d7.setDate(d7.getDate() - 6);
        return { start: d7, end: endOfToday, label: '7 Hari Terakhir' };
      }
      if (period === 'MONTH') {
        const m1 = new Date(today.getFullYear(), today.getMonth(), 1);
        return { start: m1, end: endOfToday, label: 'Bulan Ini' };
      }
      const cs = customStart ? new Date(customStart + 'T00:00:00') : today;
      const ce = customEnd ? new Date(customEnd + 'T23:59:59') : endOfToday;
      return { start: cs, end: ce, label: `${customStart || todayISO()} s/d ${customEnd || todayISO()}` };
    }

    function isDateInBounds(isoDateStr, bounds) {
      if (!isoDateStr) return false;
      const d = new Date(isoDateStr + 'T12:00:00');
      return d >= bounds.start && d <= bounds.end;
    }

    let isPullingFromCloud = false;

    function syncMasterEvent(eventType, payload) {
      const url = (db.settings.webhookUrl || '').trim();
      const record = {
        eventType,
        outlet: db.settings.outletName,
        timestamp: new Date().toISOString(),
        payload
      };
      if (!url) return;

      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record)
      }).catch(() => {
        db.offlineQueue.push(record);
        saveDB();
      });
    }

    function autoSyncMasterSlices(slices = []) {
      const url = (db.settings.webhookUrl || '').trim();
      if (!url) return;
      const data = {};
      if (slices.includes('products')) {
        data.products = db.products.map(p => ({
          ...p,
          brand: getProductBrand(p),
          includeCommissionShare: p.includeCommissionShare !== false,
          includeSalaryShare: p.includeSalaryShare !== false
        }));
      }
      if (slices.includes('inventory')) data.inventory = db.inventory;
      if (slices.includes('staff')) data.staff = db.staff;
      if (slices.includes('promos')) data.promos = db.promos;
      if (slices.includes('customers')) data.customers = db.customers;
      if (slices.includes('openOrders')) {
        data.openOrders = (db.transactions || []).filter(t => t.status === 'OPEN');
      }
      if (slices.includes('meta') || slices.includes('products')) {
        db.categories = normalizeUniqueCategories(db.categories);
        data.categories = db.categories;
        data.brandConfigs = db.brandConfigs || [];
        data.deletedBrands = db.deletedBrands || [];
      }
      syncMasterEvent('SYNC_MASTER_TABLES', data);
    }

    async function pullFromCloudMaster(manualTrigger = false) {
      const url = (db.settings.webhookUrl || '').trim();
      if (!url) {
        if (manualTrigger) showToast('Isi & simpan URL Webhook terlebih dahulu.', true);
        return;
      }
      if (isPullingFromCloud) return;
      isPullingFromCloud = true;
      updateHeaderCloudSyncBadge(true);

      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=pull&t=${Date.now()}`, { method: 'GET' });
        const data = await res.json();
        if (!data || data.status !== 'OK') {
          throw new Error(data?.message || 'Respons cloud belum valid');
        }

        const changed = applyCloudPullData(data);
        const now = new Date();
        lastCloudSyncTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        updateHeaderCloudSyncBadge(false);

        if (manualTrigger) {
          showToast(changed ? 'Data terbaru dari Cloud berhasil diterapkan!' : 'Semua data di perangkat ini sudah paling mutakhir.');
          if (currentUser) renderWorkspace();
        } else if (changed && currentUser && document.getElementById('modalBackdrop')?.classList.contains('hidden') && !isUserActivelyTyping()) {
          renderWorkspace();
        }
      } catch (err) {
        updateHeaderCloudSyncBadge(false, 'Sync Retry');
        if (manualTrigger) {

    function applyCloudPullData(data) {
      let changed = false;

      if (Array.isArray(data.products) && data.products.length > 0) {
        const prevStr = JSON.stringify(db.products);
        const oldMap = new Map(db.products.map(p => [p.sku, p]));
        db.products = data.products.map((cp, idx) => {

          return {

            sku: cp.sku,
            name: cp.name,
            category: String(cp.category || 'Kopi Jiwara').trim(),

            includeCommissionShare: cp.includeCommissionShare !== false,
            includeSalaryShare: cp.includeSalaryShare !== false,
            unit: cp.unit || 'Cup',
            price: Number(cp.price) || 0,
            cost: Number(cp.cost) || 0,
            fav: Boolean(cp.fav),
            stock: old ? old.stock : 50
          };
        });

        const prevCats = JSON.stringify(db.categories);
        const rawMergedCats = Array.isArray(data.categories) && data.categories.length > 0
          ? [...data.categories, ...db.products.map(p => p.category)]
          : [...(db.categories || []), ...db.products.map(p => p.category)];
        db.categories = normalizeUniqueCategories(rawMergedCats);
        if (JSON.stringify(db.categories) !== prevCats) changed = true;

        if (Array.isArray(data.brandConfigs) && data.brandConfigs.length > 0) {
          const prevBr = JSON.stringify(db.brandConfigs);
          db.brandConfigs = data.brandConfigs;
          if (Array.isArray(data.deletedBrands)) db.deletedBrands = data.deletedBrands;
          if (JSON.stringify(db.brandConfigs) !== prevBr) changed = true;
        }

        if (JSON.stringify(db.products) !== prevStr) changed = true;
      } else if (Array.isArray(data.categories) && data.categories.length > 0) {
        const prevCats = JSON.stringify(db.categories);
        db.categories = normalizeUniqueCategories(data.categories);
        if (JSON.stringify(db.categories) !== prevCats) changed = true;
      }

      if (Array.isArray(data.inventory) && data.inventory.length > 0) {
        const prevStr = JSON.stringify(db.inventory);
        const oldInvMap = new Map(db.inventory.map(i => [i.sku, i]));
        db.inventory = data.inventory.map((ci, idx) => {
          const old = oldInvMap.get(ci.sku);
          return {
            id: old ? old.id : ('INV-' + (idx + 1) + '-' + ci.sku),
            sku: ci.sku,
            name: ci.name,
            category: ci.category || 'Bahan Baku',
            unit: ci.unit || 'Pcs',
            stock: Number(ci.stock) || 0,
            minStock: Number(ci.minStock) || 0,
            costPerUnit: Number(ci.costPerUnit) || 0
          };
        });
        if (JSON.stringify(db.inventory) !== prevStr) changed = true;
      }

      if (Array.isArray(data.staff) && data.staff.length > 0) {
        const prevStr = JSON.stringify(db.staff);
        db.staff = data.staff.map((cs, idx) => ({
          id: cs.id || ('STF-' + (idx + 1)),
          name: cs.name,
          role: cs.role || 'Kasir & Barista',
          pin: String(cs.pin || '1111').padStart(4, '0'),
          dailyWage: Number(cs.dailyWage) || 0,
          active: cs.active !== false
        }));
        if (JSON.stringify(db.staff) !== prevStr) changed = true;
      }

      if (Array.isArray(data.promos)) {
        const prevStr = JSON.stringify(db.promos);
        db.promos = data.promos.map((cp, idx) => ({
          id: cp.id || ('PRM-' + (idx + 1)),
          code: cp.code,
          title: cp.title,
          type: cp.type === 'NOMINAL' ? 'NOMINAL' : 'PERCENT',
          value: Number(cp.value) || 0,
          minPurchase: Number(cp.minPurchase) || 0,
          validUntil: cp.validUntil || '2026-12-31',
          active: cp.active !== false
        }));
        if (JSON.stringify(db.promos) !== prevStr) changed = true;
      }

      if (Array.isArray(data.customers) && data.customers.length > 0) {
        const prevStr = JSON.stringify(db.customers);
        db.customers = data.customers.map((cc, idx) => ({
          id: cc.id || ('CST-' + (idx + 1)),
          name: cc.name,
          phone: String(cc.phone || ''),
          tier: cc.tier || 'Regular',
          totalVisits: Number(cc.totalVisits) || 0,
          totalSpent: Number(cc.totalSpent) || 0,
          voucherCode: cc.voucherCode || '',
          voucherDiscount: Number(cc.voucherDiscount) || 0
        }));
        if (JSON.stringify(db.customers) !== prevStr) changed = true;
      }

      if (Array.isArray(data.openOrders)) {
        const localPaidIds = new Set(db.transactions.filter(t => t.status === 'PAID' || t.status === 'CANCELLED').map(t => t.id));
        const localOpenMap = new Map(db.transactions.filter(t => t.status === 'OPEN').map(t => [t.id, t]));
        const cloudOpenIds = new Set();

        data.openOrders.forEach(co => {
          if (!co || !co.id || localPaidIds.has(co.id)) return;
          cloudOpenIds.add(co.id);
          const existing = localOpenMap.get(co.id);
          if (!existing || JSON.stringify(existing.items) !== JSON.stringify(co.items) || existing.total !== co.total) {
            db.transactions = db.transactions.filter(t => t.id !== co.id);
            db.transactions.unshift({
              ...co,
              status: 'OPEN'
            });
            changed = true;
          }
        });

        const beforeLen = db.transactions.length;
        db.transactions = db.transactions.filter(t => t.status !== 'OPEN' || cloudOpenIds.has(t.id) || t.id === activeOpenOrderId);
        if (db.transactions.length !== beforeLen) changed = true;
      }

      if (Array.isArray(data.paidTransactions)) {
        const localMap = new Map(db.transactions.map(t => [t.id, t]));
        data.paidTransactions.forEach(pt => {
          if (!pt || !pt.id) return;
          const existing = localMap.get(pt.id);
          if (!existing) {
            db.transactions.push({
              id: pt.id,
              status: 'PAID',
              date: pt.date || todayISO(),
              time: pt.time || '00:00',
              orderType: pt.orderType || 'Meja',
              tableOrCustomer: pt.tableOrCustomer || '',
              customerId: '',
              cashier: pt.cashier || 'Cloud',
              items: Array.isArray(pt.items) ? pt.items : [],
              subtotal: Number(pt.subtotal) || Number(pt.total) || 0,
              discount: Number(pt.discount) || 0,
              promoCode: pt.promoCode || '',
              total: Number(pt.total) || 0,
              paymentMethod: pt.paymentMethod || 'Cash',
              cashReceived: Number(pt.total) || 0,
              change: 0
            });
            changed = true;
          } else if (existing.status === 'OPEN') {
            existing.status = 'PAID';
            existing.paymentMethod = pt.paymentMethod || existing.paymentMethod;
            existing.total = Number(pt.total) || existing.total;
            changed = true;
          }
        });
      }

      if (Array.isArray(data.cashDrawer)) {
        const localCashIds = new Set(db.cashDrawer.map(c => c.id));
        data.cashDrawer.forEach(cc => {
          if (cc && cc.id && !localCashIds.has(cc.id)) {
            db.cashDrawer.push({
              id: cc.id,
              date: cc.date || todayISO(),
              time: cc.time || '00:00',
              type: cc.type === 'OUT' ? 'OUT' : 'IN',
              amount: Number(cc.amount) || 0,
              note: cc.note || '',
              by: cc.by || 'Cloud'
            });
            changed = true;
          }
        });
      }

      if (changed) saveDB();
      return changed;
    }

    // ==================== BLUETOOTH THERMAL PRINTER ENGINE ====================
    let btPrinterDevice = null;
    let btPrinterCharacteristic = null;

    function buildEscPosBytesFromLines(lines) {
      const encoder = new TextEncoder();
      const chunks = [];
      chunks.push(new Uint8Array([0x1B, 0x40]));
      chunks.push(new Uint8Array([0x1B, 0x61, 0x01]));
      chunks.push(new Uint8Array([0x1B, 0x45, 0x01]));
      chunks.push(encoder.encode((db.settings.outletName || 'KOPI JIWARA') + '\n'));
      chunks.push(new Uint8Array([0x1B, 0x45, 0x00]));
      chunks.push(encoder.encode((db.settings.address || '') + '\n'));
      chunks.push(new Uint8Array([0x1B, 0x61, 0x00]));

      lines.forEach(line => {
        chunks.push(encoder.encode(String(line) + '\n'));
      });
      chunks.push(encoder.encode('\n\n\n'));
      chunks.push(new Uint8Array([0x1D, 0x56, 0x42, 0x00]));

      const totalLen = chunks.reduce((sum, arr) => sum + arr.length, 0);
      const merged = new Uint8Array(totalLen);
      let offset = 0;
      chunks.forEach(arr => {
        merged.set(arr, offset);
        offset += arr.length;
      });
      return merged;
    }

    async function sendRawBytesToBluetooth(bytes) {
      if (!btPrinterCharacteristic) return false;
      const chunkSize = 100;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const slice = bytes.slice(i, i + chunkSize);
        if (btPrinterCharacteristic.writeValueWithoutResponse) {
          await btPrinterCharacteristic.writeValueWithoutResponse(slice);
        } else {
          await btPrinterCharacteristic.writeValue(slice);
        }
        await new Promise(r => setTimeout(r, 25));
      }
      return true;
    }

    async function scanAndLockBluetoothPrinter() {
      if (!navigator.bluetooth) {
        showToast('Browser ini belum mendukung Web Bluetooth langsung. Gunakan Chrome Android/Desktop atau sambungkan printer via Pengaturan Bluetooth perangkat.', true);
        return;
      }
      try {
        showToast('Memindai perangkat Printer Bluetooth terdekat...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '000018f0-0000-1000-8000-00805f9b34fb',
            '49535343-fe7d-4ae5-8fa9-9fafd205e455',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '0000ff00-0000-1000-8000-00805f9b34fb'
          ]
        });
        if (!device) return;

        showToast(`Menyambungkan ke ${device.name || 'Printer Bluetooth'}...`);
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        let foundChar = null;

        for (const srv of services) {
          const chars = await srv.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.write || ch.properties.writeWithoutResponse) {
              foundChar = ch;
              break;
            }
          }
          if (foundChar) break;
        }

        if (!foundChar) {
          showToast('Perangkat tersambung, namun kanal cetak ESC/POS tidak ditemukan.', true);
          return;
        }

        btPrinterDevice = device;
        btPrinterCharacteristic = foundChar;
        db.settings.printerName = device.name || 'Printer Thermal BT';
        db.settings.printerDeviceId = device.id || '';
        db.settings.printerLocked = true;
        saveDB();

        device.addEventListener('gattserverdisconnected', () => {
          btPrinterCharacteristic = null;
          if (currentUser && activeTab === 'settings' && settingsSubTab === 'SINKRON') {
            renderSettingsSinkron(document.getElementById('settingsSubBody'));
          }
        });

        renderSettingsSinkron(document.getElementById('settingsSubBody'));
        showToast(`Printer "${db.settings.printerName}" berhasil terhubung & dikunci!`);
      } catch (err) {
        if (err && err.name !== 'NotFoundError') {
          showToast('Gagal menyambungkan printer Bluetooth: ' + (err.message || 'Coba ulangi'), true);
        }
      }
    }

      const lines = [

      container.innerHTML = `
        ${!db.shift.isOpen ? `
          <div class="bento-card" style="background:linear-gradient(135deg,#FEFCE8,#FEF08A);border:1.5px solid #EAB308;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <div>
              <strong style="font-size:14px;color:var(--green-deep);">Laci Kasir Belum Dibuka</strong>
              <div style="font-size:12px;color:#713F12;">Masukkan modal awal uang tunai laci sebelum memulai transaksi penjualan.</div>
            </div>
            <button type="button" class="btn btn-dark" onclick="openShiftModal()">Buka Shift Kasir</button>
          </div>
        ` : ''}

        <div class="pos-layout">
          <div>
            ${openOrders.length > 0 ? `
              <div class="bento-card" style="margin-bottom:12px;padding:12px 14px;">
                <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin-bottom:7px;">Open Order Aktif (${openOrders.length})</div>
                <div style="display:flex;gap:8px;overflow-x:auto;" class="no-scroll">
                  ${openOrders.map(o => `
                    <button type="button" class="btn ${activeOpenOrderId === o.id ? 'btn-pink' : 'btn-soft'} btn-sm" onclick="loadOpenOrderToCart('${o.id}')">
                      ${esc(o.orderType)} ${o.tableOrCustomer ? '• ' + esc(o.tableOrCustomer) : ''} (${rp(o.total)})
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="bento-card" style="margin-bottom:12px;padding:13px;">
              <input type="text" class="styled-input" placeholder="Cari nama menu atau kode SKU..." value="${esc(productSearch)}" oninput="productSearch=this.value;renderPosTab(document.getElementById('mainContentArea'))" style="margin-bottom:10px;" />
              <div class="cat-strip no-scroll">
                ${normalizeUniqueCategories(db.categories).map(cat => `
                  <button type="button" class="cat-chip ${selectedCategory === cat ? 'active' : ''}" onclick="selectedCategory='${esc(cat)}';renderPosTab(document.getElementById('mainContentArea'))">${esc(cat)}</button>
                `).join('')}
              </div>
            </div>

            <div class="prod-grid">
              ${filteredProducts.map(p => {
                const inCartItem = cart.find(c => c.id === p.id);
                return `
                  <button type="button" class="prod-card ${inCartItem ? 'in-cart' : ''}" onclick="addToCart('${p.id}')">
                    ${inCartItem ? `<span class="qty-badge">${inCartItem.qty}x</span>` : ''}
                    <div>
                      <div style="font-size:10px;font-weight:800;color:var(--text-muted);">${esc(getProductBrand(p))}</div>
                      <div style="font-size:13px;font-weight:800;color:var(--green-deep);margin-top:2px;line-height:1.25;">${esc(p.name)}</div>
                    </div>
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;width:100%;">
                      <strong style="font-size:13px;color:var(--green-deep);">${rp(p.price)}</strong>
                      <span style="font-size:10px;color:var(--text-muted);">Stok ${p.stock}</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bento-card" style="position:sticky;top:108px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <div>
                <div style="font-size:15px;font-weight:900;">${activeOpenOrderId ? 'Edit Open Order' : 'Keranjang Pesanan'}</div>
                <div style="font-size:11px;color:var(--text-muted);">${activeOpenOrderId ? 'Perubahan jumlah/hapus item butuh PIN Owner' : 'Pesanan baru siap diproses'}</div>
              </div>
              ${cart.length > 0 ? `<button type="button" class="btn btn-soft btn-sm" onclick="resetCurrentCart()">Reset</button>` : ''}
            </div>

            <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-bottom:10px;">
              <div>
                <label class="field-label">Tipe Pesanan</label>
                <select class="styled-select" onchange="orderType=this.value">
                  ${ORDER_TYPES.map(t => `<option value="${t}" ${orderType === t ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">No. Meja / Nama</label>
                <input type="text" class="styled-input" placeholder="Meja 04 / Budi" value="${esc(tableOrCustomerNote)}" oninput="tableOrCustomerNote=this.value" />
              </div>
            </div>

            <div style="margin-bottom:10px;">
              <label class="field-label">Pelanggan CRM (Opsional)</label>
              <select class="styled-select" onchange="selectCustomerForOrder(this.value)">
                <option value="">-- Pelanggan Umum --</option>
                ${db.customers.map(c => `<option value="${c.id}" ${selectedCustomerId === c.id ? 'selected' : ''}>${esc(c.name)} (${esc(c.tier)})${c.voucherCode ? ' • Voucher ' + c.voucherCode : ''}</option>`).join('')}
              </select>
            </div>

            <div style="max-height:240px;overflow-y:auto;border-top:1px solid var(--border-glass);border-bottom:1px solid var(--border-glass);padding:8px 0;margin-bottom:10px;">
              ${cart.length === 0 ? `<div style="text-align:center;padding:24px 8px;font-size:12px;color:var(--text-muted);">Pilih menu di sebelah kiri untuk mulai mencatat pesanan.</div>` : cart.map(item => `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border-glass);">
                  <div style="min-width:0;flex:1;">
                    <div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.name)}</div>
                    <div style="font-size:11px;color:var(--text-muted);">${rp(item.price)} x ${item.qty} = <strong>${rp(item.price * item.qty)}</strong></div>
                  </div>
                  <div style="display:flex;align-items:center;gap:5px;">
                    <button type="button" class="btn btn-soft btn-sm" style="padding:4px 9px;" onclick="changeCartQty('${item.id}', -1)">-</button>
                    <span style="font-size:12px;font-weight:900;min-width:18px;text-align:center;">${item.qty}</span>
                    <button type="button" class="btn btn-dark btn-sm" style="padding:4px 9px;" onclick="changeCartQty('${item.id}', 1)">+</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-bottom:10px;">
              <div>
                <label class="field-label">Kode Promo / Voucher</label>
                <select class="styled-select" onchange="selectedPromoCode=this.value;renderPosTab(document.getElementById('mainContentArea'))">
                  <option value="">-- Tanpa Promo --</option>
                  ${selectedCust && selectedCust.voucherCode ? `<option value="__CUST_VOUCHER__" ${selectedPromoCode === '__CUST_VOUCHER__' ? 'selected' : ''}>Voucher ${esc(selectedCust.voucherCode)} (-${rp(selectedCust.voucherDiscount)})</option>` : ''}
                  ${db.promos.filter(p => p.active).map(pr => `<option value="${pr.code}" ${selectedPromoCode === pr.code ? 'selected' : ''}>${esc(pr.code)} (${pr.type === 'PERCENT' ? pr.value + '%' : rp(pr.value)})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="field-label">Potongan Manual (Rp)</label>
                <input type="number" class="styled-input" min="0" value="${manualDiscountNominal || ''}" placeholder="0" onchange="manualDiscountNominal=Math.max(0,Number(this.value)||0);renderPosTab(document.getElementById('mainContentArea'))" />
              </div>
            </div>

            <div style="background:var(--green-soft);border-radius:14px;padding:11px 13px;margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
                <span>Subtotal</span><strong>${rp(subtotal)}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:12px;color:#BE185D;margin-bottom:6px;">
                <span>Total Diskon</span><strong>-${rp(totalDiscount)}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:900;border-top:1px solid var(--border-glass);padding-top:6px;">
                <span>Total Tagihan</span><span>${rp(grandTotal)}</span>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1.25fr;gap:8px;">
              <button type="button" class="btn btn-soft" onclick="saveAsOpenOrder()" ${cart.length === 0 ? 'disabled' : ''}>Simpan Open Order</button>
              <button type="button" class="btn btn-yellow" onclick="openPaymentModal()" ${cart.length === 0 ? 'disabled' : ''}>Bayar Sekarang</button>
            </div>
            ${activeOpenOrderId ? `
              <button type="button" class="btn btn-danger btn-sm" style="width:100%;margin-top:8px;" onclick="requestOwnerAuthForOrderAction('CANCEL_ORDER', '${activeOpenOrderId}')">Batalkan Open Order (PIN Owner)</button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function addToCart(prodId) {
      if (!db.shift.isOpen) {
        showToast('Buka Shift Kasir terlebih dahulu sebelum input pesanan.', true);
        return;
      }
      const p = db.products.find(x => x.id === prodId);
      if (!p) return;
      const existing = cart.find(c => c.id === prodId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: p.id,
          sku: p.sku,
          name: p.name,
          brand: getProductBrand(p),
          includeCommissionShare: p.includeCommissionShare !== false,
          includeSalaryShare: p.includeSalaryShare !== false,
          price: p.price,
          cost: p.cost || 0,
          qty: 1
        });
      }
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function changeCartQty(prodId, delta) {
      const idx = cart.findIndex(c => c.id === prodId);
      if (idx === -1) return;

      if (activeOpenOrderId && delta < 0) {
        const openOrder = db.transactions.find(t => t.id === activeOpenOrderId);
        const origItem = openOrder ? openOrder.items.find(i => i.id === prodId) : null;
        if (origItem && cart[idx].qty <= origItem.qty) {
          requestOwnerAuthForOrderAction('REDUCE_ITEM', activeOpenOrderId, prodId);
          return;
        }
      }

      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function resetCurrentCart() {
      if (activeOpenOrderId) {
        requestOwnerAuthForOrderAction('CANCEL_ORDER', activeOpenOrderId);
        return;
      }
      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function loadOpenOrderToCart(orderId) {
      const o = db.transactions.find(t => t.id === orderId && t.status === 'OPEN');
      if (!o) return;
      activeOpenOrderId = o.id;
      cart = o.items.map(i => ({ ...i }));
      orderType = o.orderType || 'Meja';
      tableOrCustomerNote = o.tableOrCustomer || '';
      selectedCustomerId = o.customerId || '';
      selectedPromoCode = o.promoCode || '';
      manualDiscountNominal = o.manualDiscount || 0;
      renderPosTab(document.getElementById('mainContentArea'));
      showToast(`Open Order ${o.tableOrCustomer || o.id} dimuat ke keranjang.`);
    }

    function selectCustomerForOrder(custId) {
      selectedCustomerId = custId;
      const c = db.customers.find(x => x.id === custId);
      if (c) {
        if (!tableOrCustomerNote) tableOrCustomerNote = c.name;
        if (c.voucherCode && c.voucherDiscount > 0) {
          selectedPromoCode = '__CUST_VOUCHER__';
        }
      }
      renderPosTab(document.getElementById('mainContentArea'));
    }

    function computeCurrentCartTotals() {
      const subtotal = cart.reduce((s, item) => s + item.price * item.qty, 0);
      let promoDiscount = 0;
      const activePromo = db.promos.find(pr => pr.code === selectedPromoCode && pr.active);
      if (activePromo && subtotal >= (activePromo.minPurchase || 0)) {
        promoDiscount = activePromo.type === 'PERCENT'
          ? Math.round(subtotal * (activePromo.value / 100))
          : activePromo.value;
      }
      const selectedCust = db.customers.find(c => c.id === selectedCustomerId);
      if (selectedCust && selectedPromoCode === '__CUST_VOUCHER__' && selectedCust.voucherDiscount > 0) {
        promoDiscount = selectedCust.voucherDiscount;
      }
      const totalDiscount = Math.min(subtotal, promoDiscount + (Number(manualDiscountNominal) || 0));
      const total = Math.max(0, subtotal - totalDiscount);
      const totalCost = cart.reduce((s, item) => s + (item.cost || 0) * item.qty, 0);
      return { subtotal, promoDiscount, totalDiscount, total, totalCost };
    }

    function saveAsOpenOrder() {
      if (!db.shift.isOpen) { showToast('Buka Shift Kasir terlebih dahulu.', true); return; }
      if (cart.length === 0) return;
      const totals = computeCurrentCartTotals();
      const cust = db.customers.find(c => c.id === selectedCustomerId);

      if (activeOpenOrderId) {
        const idx = db.transactions.findIndex(t => t.id === activeOpenOrderId);
        if (idx >= 0) {
          db.transactions[idx] = {
            ...db.transactions[idx],
            orderType,
            tableOrCustomer: tableOrCustomerNote,
            customerId: selectedCustomerId,
            customerPhone: cust ? cust.phone : (db.transactions[idx].customerPhone || ''),
            items: cart.map(i => ({ ...i })),
            subtotal: totals.subtotal,
            discount: totals.totalDiscount,
            promoCode: selectedPromoCode,
            manualDiscount: manualDiscountNominal,
            total: totals.total,
            totalCost: totals.totalCost
          };
        }
      } else {
        db.transactions.unshift({
          id: 'ORD-' + Date.now().toString().slice(-6),
          status: 'OPEN',
          date: todayISO(),
          time: nowTimeStr(),
          orderType,
          tableOrCustomer: tableOrCustomerNote || 'Open Bill',
          customerId: selectedCustomerId,
          customerPhone: cust ? cust.phone : '',
          cashier: currentUser.name,
          items: cart.map(i => ({ ...i })),
          subtotal: totals.subtotal,
          discount: totals.totalDiscount,
          promoCode: selectedPromoCode,
          manualDiscount: manualDiscountNominal,
          total: totals.total,
          totalCost: totals.totalCost,
          paymentMethod: ''
        });
      }
      saveDB();
      autoSyncMasterSlices(['openOrders']);
      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;
      renderPosTab(document.getElementById('mainContentArea'));
      showToast('Open Order berhasil disimpan & disinkronkan.');
    }

    // ==================== OWNER PIN AUTHORIZATION FOR OPEN ORDER ====================
    function requestOwnerAuthForOrderAction(actionType, orderId, targetProdId = null) {
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:17px;color:#BE185D;">Otorisasi PIN Owner / Manager</h3>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
          ${actionType === 'CANCEL_ORDER'
            ? 'Pembatalan Open Order yang sudah tersimpan memerlukan PIN Owner/Manager.'
            : 'Pengurangan atau penghapusan item pada Open Order memerlukan PIN Owner/Manager.'}
        </p>
        <div style="margin-bottom:10px;">
          <label class="field-label">Alasan Perubahan / Pembatalan</label>
          <input type="text" id="authReasonInput" class="styled-input" placeholder="Contoh: Pelanggan ganti menu / salah input" />
        </div>
        <div style="margin-bottom:14px;">
          <label class="field-label">PIN 4-Digit Owner / Manager</label>
          <input type="password" id="authPinInput" class="styled-input" maxlength="4" inputmode="numeric" placeholder="••••" />
        </div>
        <button type="button" class="btn btn-pink" style="width:100%;padding:12px;" onclick="confirmOwnerOrderAuth('${actionType}','${orderId}','${targetProdId || ''}')">Verifikasi & Jalankan</button>
      `);
    }

    function confirmOwnerOrderAuth(actionType, orderId, targetProdId) {
      const reason = document.getElementById('authReasonInput').value.trim();
      const pin = document.getElementById('authPinInput').value.trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && s.pin === pin);
      if (!approver) {
        showToast('PIN Owner/Manager tidak valid.', true);
        return;
      }
      if (!reason) {
        showToast('Alasan perubahan wajib diisi.', true);
        return;
      }

      const orderIdx = db.transactions.findIndex(t => t.id === orderId);
      if (orderIdx >= 0) {
        if (actionType === 'CANCEL_ORDER') {
          db.transactions.splice(orderIdx, 1);
          cart = [];
          activeOpenOrderId = null;
          tableOrCustomerNote = '';
        } else if (actionType === 'REDUCE_ITEM') {
          const cIdx = cart.findIndex(c => c.id === targetProdId);
          if (cIdx >= 0) {
            cart[cIdx].qty -= 1;
            if (cart[cIdx].qty <= 0) cart.splice(cIdx, 1);
          }
          const totals = computeCurrentCartTotals();
          if (cart.length === 0) {
            db.transactions.splice(orderIdx, 1);
            activeOpenOrderId = null;
          } else {
            db.transactions[orderIdx].items = cart.map(i => ({ ...i }));
            db.transactions[orderIdx].subtotal = totals.subtotal;
            db.transactions[orderIdx].discount = totals.totalDiscount;
            db.transactions[orderIdx].total = totals.total;
          }
        }
      }

      const auditEntry = {
        id: 'AUD-' + Date.now(),
        date: todayISO(),
        time: nowTimeStr(),
        actionType,
        orderId,
        reason,
        approvedBy: approver.name,
        requestedBy: currentUser.name
      };
      db.auditLogs.unshift(auditEntry);
      saveDB();
      syncMasterEvent('ORDER_VOID_AUTHORIZED', auditEntry);
      autoSyncMasterSlices(['openOrders']);
      closeModal();
      renderPosTab(document.getElementById('mainContentArea'));
      showToast(`Diotorisasi oleh ${approver.name}.`);
    }

    // ==================== PAYMENT & SPLIT BILL MODAL ====================
    let payMode = 'FULL';
    let selectedPayMethod = 'Cash';
    let cashTendered = 0;
    let splitPayments = [];

    function openPaymentModal() {
      if (!db.shift.isOpen) { showToast('Buka Shift Kasir terlebih dahulu.', true); return; }
      const totals = computeCurrentCartTotals();
      payMode = 'FULL';
      selectedPayMethod = 'Cash';
      cashTendered = totals.total;
      splitPayments = [
        { method: 'Cash', amount: Math.ceil(totals.total / 2) },
        { method: 'QRIS', amount: totals.total - Math.ceil(totals.total / 2) }
      ];
      renderPaymentModalBody();
    }

    function renderPaymentModalBody() {
      const totals = computeCurrentCartTotals();
      const change = Math.max(0, (Number(cashTendered) || 0) - totals.total);
      const splitSum = splitPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
      const splitDiff = totals.total - splitSum;

      openModal(`
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Checkout Pembayaran</div>
            <h3 style="margin:2px 0 0;font-size:20px;color:var(--green-deep);">${rp(totals.total)}</h3>
          </div>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
          <button type="button" class="btn ${payMode === 'FULL' ? 'btn-dark' : 'btn-soft'}" onclick="payMode='FULL';renderPaymentModalBody()">Bayar Penuh</button>
          <button type="button" class="btn ${payMode === 'SPLIT' ? 'btn-pink' : 'btn-soft'}" onclick="payMode='SPLIT';renderPaymentModalBody()">Split Bill</button>
        </div>

        ${payMode === 'FULL' ? `
          <label class="field-label">Pilih Metode Pembayaran</label>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;">
            ${PAYMENT_METHODS.map(m => `
              <button type="button" class="btn ${selectedPayMethod === m ? 'btn-yellow' : 'btn-soft'}" onclick="selectedPayMethod='${m}';renderPaymentModalBody()">${m}</button>
            `).join('')}
          </div>

          ${selectedPayMethod === 'Cash' ? `
            <div style="background:var(--green-soft);padding:12px;border-radius:14px;margin-bottom:12px;">
              <label class="field-label">Uang Tunai Diterima (Rp)</label>
              <input type="number" class="styled-input" value="${cashTendered}" oninput="cashTendered=Number(this.value)||0;document.getElementById('changePreviewText').textContent=rp(Math.max(0,cashTendered-${totals.total}))" />
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
                <button type="button" class="btn btn-soft btn-sm" onclick="cashTendered=${totals.total};renderPaymentModalBody()">Uang Pas</button>
                <button type="button" class="btn btn-soft btn-sm" onclick="cashTendered=50000;renderPaymentModalBody()">Rp 50.000</button>
                <button type="button" class="btn btn-soft btn-sm" onclick="cashTendered=100000;renderPaymentModalBody()">Rp 100.000</button>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px;font-weight:900;">
                <span>Kembalian:</span>
                <span id="changePreviewText" style="color:#065F46;">${rp(change)}</span>
              </div>
            </div>
          ` : ''}
        ` : `
          <div style="background:var(--green-soft);padding:12px;border-radius:14px;margin-bottom:12px;">
            <div style="font-size:12px;font-weight:800;margin-bottom:8px;">Rincian Split Pembayaran</div>
            ${splitPayments.map((sp, idx) => `
              <div style="display:grid;grid-template-columns:1fr 1.2fr auto;gap:6px;margin-bottom:6px;">
                <select class="styled-select" onchange="splitPayments[${idx}].method=this.value">
                  ${PAYMENT_METHODS.map(m => `<option value="${m}" ${sp.method === m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
                <input type="number" class="styled-input" value="${sp.amount}" onchange="splitPayments[${idx}].amount=Number(this.value)||0;renderPaymentModalBody()" />
                ${splitPayments.length > 2 ? `<button type="button" class="btn btn-danger btn-sm" onclick="splitPayments.splice(${idx},1);renderPaymentModalBody()">x</button>` : '<span></span>'}
              </div>
            `).join('')}
            <button type="button" class="btn btn-soft btn-sm" onclick="splitPayments.push({method:'Cash',amount:0});renderPaymentModalBody()">+ Tambah Metode</button>
            <div style="margin-top:8px;font-size:12px;font-weight:800;color:${splitDiff === 0 ? '#065F46' : '#BE185D'};">
              ${splitDiff === 0 ? 'Total Split Sesuai Tagihan!' : 'Selisih Split: ' + rp(splitDiff)}
            </div>
          </div>
        `}

        <button type="button" class="btn btn-dark" style="width:100%;padding:13px;font-size:14px;" onclick="finalizePaymentTransaction()">Selesaikan Pembayaran & Cetak Struk</button>
      `);
    }

    function finalizePaymentTransaction() {
      const totals = computeCurrentCartTotals();
      if (payMode === 'FULL' && selectedPayMethod === 'Cash' && cashTendered < totals.total) {
        showToast('Nominal uang tunai kurang dari total tagihan.', true);
        return;
      }
      if (payMode === 'SPLIT') {
        const splitSum = splitPayments.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        if (splitSum !== totals.total) {
          showToast('Total split bill harus sama persis dengan total tagihan.', true);
          return;
        }
      }

      const finalMethodLabel = payMode === 'FULL'
        ? selectedPayMethod
        : splitPayments.map(s => `${s.method} (${rp(s.amount)})`).join(' + ');

      const cust = db.customers.find(c => c.id === selectedCustomerId);
      const trx = {
        id: activeOpenOrderId || ('TRX-' + Date.now().toString().slice(-6)),
        status: 'PAID',
        date: todayISO(),
        time: nowTimeStr(),
        orderType,
        tableOrCustomer: tableOrCustomerNote,
        customerId: selectedCustomerId,
        customerPhone: cust ? cust.phone : '',
        cashier: currentUser.name,
        items: cart.map(i => ({ ...i })),
        subtotal: totals.subtotal,
        discount: totals.totalDiscount,
        promoCode: selectedPromoCode === '__MANUAL__' ? 'Potongan Manual' : selectedPromoCode,
        total: totals.total,
        totalCost: totals.totalCost,
        paymentMethod: finalMethodLabel,
        splitDetails: payMode === 'SPLIT' ? splitPayments : null,
        cashReceived: payMode === 'FULL' && selectedPayMethod === 'Cash' ? cashTendered : totals.total,
        change: payMode === 'FULL' && selectedPayMethod === 'Cash' ? Math.max(0, cashTendered - totals.total) : 0
      };

      trx.items.forEach(item => {
        const prod = db.products.find(p => p.id === item.id);
        if (prod) prod.stock = Math.max(0, (prod.stock || 0) - item.qty);
      });

      if (selectedCustomerId) {
        const cust = db.customers.find(c => c.id === selectedCustomerId);
        if (cust) {
          cust.totalVisits = (cust.totalVisits || 0) + 1;
          cust.totalSpent = (cust.totalSpent || 0) + totals.total;
          if (selectedPromoCode === '__CUST_VOUCHER__') {
            cust.voucherCode = '';
            cust.voucherDiscount = 0;
          }
          if (cust.totalVisits >= 10) cust.tier = 'VIP Jiwara';
          else if (cust.totalVisits >= 5) cust.tier = 'Loyal';
        }
      }

      if (activeOpenOrderId) {
        const idx = db.transactions.findIndex(t => t.id === activeOpenOrderId);
        if (idx >= 0) db.transactions[idx] = trx;
        else db.transactions.unshift(trx);
      } else {
        db.transactions.unshift(trx);
      }

      saveDB();
      syncMasterEvent('SALE_COMPLETED', trx);
      autoSyncMasterSlices(['products', 'customers', 'openOrders']);

      cart = [];
      activeOpenOrderId = null;
      tableOrCustomerNote = '';
      selectedCustomerId = '';
      selectedPromoCode = '';
      manualDiscountNominal = 0;

      renderPosTab(document.getElementById('mainContentArea'));
      if (db.settings.printerAutoPrint !== false) {
        printReceiptThermal(trx);
      }
      showPostPaymentReceiptModal(trx);
    }

    async function printReceiptThermal(trx) {
      if (!trx) return;
      const lines = [
        '--------------------------------',
        `Nota   : ${trx.id}`,
        `Waktu  : ${trx.date} ${trx.time}`,
        `Tipe   : ${trx.orderType}${trx.tableOrCustomer ? ' (' + trx.tableOrCustomer + ')' : ''}`,
        `Kasir  : ${trx.cashier}`,
        '--------------------------------',
        ...trx.items.map(i => `${i.name} (${i.qty}x)  ${rp(i.price * i.qty)}`),
        '--------------------------------',
        `Subtotal : ${rp(trx.subtotal)}`,
        ...(trx.discount > 0 ? [`Diskon   : -${rp(trx.discount)}`] : []),
        `TOTAL    : ${rp(trx.total)}`,
        `Bayar    : ${trx.paymentMethod}`,
        ...(trx.paymentMethod === 'Cash' ? [`Kembali  : ${rp(trx.change || 0)}`] : []),
        '--------------------------------',
        db.settings.receiptFooter || 'Terima kasih!'
      ];

      if (btPrinterCharacteristic) {
        try {
          const bytes = buildEscPosBytesFromLines(lines);
          await sendRawBytesToBluetooth(bytes);
          return;
        } catch (e) {}
      }

      const area = document.getElementById('printArea');
      area.style.width = (db.settings.printerPaperSize === '80mm') ? '80mm' : '58mm';
      area.innerHTML = `
        <div style="text-align:center;font-weight:bold;">${esc(db.settings.outletName)}</div>
        <div style="text-align:center;font-size:10px;">${esc(db.settings.address)}</div>
        <hr/>
        <div>Nota: ${esc(trx.id)}</div>
        <div>Tgl : ${esc(trx.date)} ${esc(trx.time)}</div>
        <div>Tipe: ${esc(trx.orderType)} ${esc(trx.tableOrCustomer)}</div>
        <div>Kasir: ${esc(trx.cashier)}</div>
        <hr/>
        ${trx.items.map(i => `
          <div style="display:flex;justify-content:space-between;">
            <span>${esc(i.name)} x${i.qty}</span>
            <span>${rp(i.price * i.qty)}</span>
          </div>
        `).join('')}
        <hr/>
        <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>${rp(trx.subtotal)}</span></div>
        ${trx.discount > 0 ? `<div style="display:flex;justify-content:space-between;"><span>Diskon</span><span>-${rp(trx.discount)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between;font-weight:bold;"><span>TOTAL</span><span>${rp(trx.total)}</span></div>
        <div>Bayar: ${esc(trx.paymentMethod)}</div>
        ${trx.paymentMethod === 'Cash' ? `<div>Kembali: ${rp(trx.change)}</div>` : ''}
        <hr/>
        <div style="text-align:center;font-size:10px;">${esc(db.settings.receiptFooter)}</div>
      `;
      area.classList.remove('hidden');
      setTimeout(() => {
        window.print();
        area.classList.add('hidden');
      }, 150);
    }

    // ==================== MULTI-BRAND WEEKLY SETTLEMENT CALCULATOR ====================
    function calculateBrandSettlementSummary(bounds) {
      const paidTrx = db.transactions.filter(t => t.status === 'PAID' && isDateInBounds(t.date, bounds));
      const allBrands = getAllAvailableBrands();

      const brandStats = {};
      allBrands.forEach(b => {
        brandStats[b] = {
          brand: b,
          grossSales: 0,
          commissionableSales: 0,
          commissionQty: 0,
          qualifyingSales: 0,
          qualifyingQty: 0,
          totalQty: 0
        };
      });

      let totalQualifyingQtyAll = 0;

      paidTrx.forEach(t => {
        const sub = t.subtotal || t.items.reduce((s, i) => s + i.price * i.qty, 0) || 1;
        const netRatio = Math.max(0, (t.total || 0) / sub);

        t.items.forEach(item => {
          const prodRef = db.products.find(p => p.id === item.id || p.sku === item.sku);
          const brandName = item.brand || (prodRef ? getProductBrand(prodRef) : 'Kopi Jiwara');
          if (!brandStats[brandName]) {
            brandStats[brandName] = {
              brand: brandName,
              grossSales: 0,
              commissionableSales: 0,
              commissionQty: 0,
              qualifyingSales: 0,
              qualifyingQty: 0,
              totalQty: 0
            };
          }
          const itemNetSales = Math.round((item.price * item.qty) * netRatio);
          brandStats[brandName].grossSales += itemNetSales;
          brandStats[brandName].totalQty += item.qty;

          const isCommissionable = item.includeCommissionShare !== undefined
            ? item.includeCommissionShare
            : (prodRef ? prodRef.includeCommissionShare !== false : true);
          if (isCommissionable) {
            brandStats[brandName].commissionableSales += itemNetSales;
            brandStats[brandName].commissionQty += item.qty;
          }

          const isQualifying = item.includeSalaryShare !== undefined
            ? item.includeSalaryShare
            : (prodRef ? prodRef.includeSalaryShare !== false : true);
          if (isQualifying) {
            brandStats[brandName].qualifyingSales += itemNetSales;
            brandStats[brandName].qualifyingQty += item.qty;
            totalQualifyingQtyAll += item.qty;
          }
        });
      });

      const periodAttendance = db.attendance.filter(a => isDateInBounds(a.date, bounds));
      const wageFromAttendance = periodAttendance.reduce((s, a) => s + (a.wage || 0), 0);
      const periodCashOut = db.cashDrawer.filter(c => c.type === 'OUT' && isDateInBounds(c.date, bounds));
      const wageFromCashOut = periodCashOut
        .filter(c => (c.note || '').toLowerCase().includes('gaji') || (c.note || '').toLowerCase().includes('helper'))
        .reduce((s, c) => s + (c.amount || 0), 0);
      const totalPeriodSalaryPool = wageFromAttendance + wageFromCashOut;

      const rows = Object.values(brandStats).map(st => {
        const cfg = getBrandConfig(st.brand);
        const commPct = Number(cfg.commissionPct) || 0;
        const commissionAmount = Math.round(st.commissionableSales * (commPct / 100));
        const shareRatio = (cfg.salaryShareActive && totalQualifyingQtyAll > 0)
          ? (st.qualifyingQty / totalQualifyingQtyAll)
          : 0;
        const salaryDeduction = Math.round(totalPeriodSalaryPool * shareRatio);
        const netTransfer = Math.max(0, st.grossSales - commissionAmount - salaryDeduction);

        return {
          ...st,
          commissionPct: commPct,
          commissionAmount,
          salaryShareRatio: shareRatio,
          salaryDeduction,
          netTransfer,
          ownerPhone: cfg.ownerPhone || ''
        };
      });

      return {
        rows,
        totalGrossAll: rows.reduce((s, r) => s + r.grossSales, 0),
        totalCommissionAll: rows.reduce((s, r) => s + r.commissionAmount, 0),
        totalPeriodSalaryPool,
        totalQualifyingQtyAll,
        totalNetTransferAll: rows.reduce((s, r) => s + r.netTransfer, 0)
      };
    }

    function updateBrandCommissionSetting(brandName, newPct) {
      const cfg = getBrandConfig(brandName);
      cfg.commissionPct = Math.max(0, Math.min(100, Number(newPct) || 0));
      saveDB();
      autoSyncMasterSlices(['meta']);
