    function recordBrandSettlementTransfer(brandName) {
      const bounds = getDateRangeBounds(settlePeriod, settleCustomStart, settleCustomEnd);
      const calc = calculateBrandSettlementSummary(bounds);
      const row = calc.rows.find(r => r.brand === brandName);
      if (!row || row.grossSales <= 0) {
        showToast('Belum ada penjualan untuk brand ini pada periode terpilih.', true);
        return;
      }

      const settleRecord = {
        id: 'STL-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        periodLabel: bounds.label,
        brand: row.brand,
        totalQty: row.totalQty,
        commissionQty: row.commissionQty,
        commissionableSales: row.commissionableSales,
        qualifyingQty: row.qualifyingQty,
        grossSales: row.grossSales,
        commissionPct: row.commissionPct,
        commissionAmount: row.commissionAmount,
        salarySharePct: Number((row.salaryShareRatio * 100).toFixed(1)),
        salaryDeduction: row.salaryDeduction,
        netTransfer: row.netTransfer,
        recordedBy: currentUser.name
      };

      db.brandSettlements.unshift(settleRecord);
      db.cashDrawer.unshift({
        id: 'CSH-' + Date.now(),
        date: todayISO(),
        time: nowTimeStr(),
        type: 'OUT',
        amount: row.netTransfer,
        note: `Transfer Sales ${row.brand} (${bounds.label})`,
        by: currentUser.name
      });
      saveDB();

      syncMasterEvent('BRAND_SETTLEMENT_RECORDED', settleRecord);
      renderReportTab(document.getElementById('mainContentArea'));
      showToast(`Setoran ${row.brand} (${rp(row.netTransfer)}) tercatat di Arus Kas & Google Sheets!`);
    }

    function sendBrandSettlementWhatsApp(brandName) {
      const bounds = getDateRangeBounds(settlePeriod, settleCustomStart, settleCustomEnd);
      const calc = calculateBrandSettlementSummary(bounds);
      const row = calc.rows.find(r => r.brand === brandName);
      if (!row) return;

      const phoneClean = formatWhatsAppPhone(row.ownerPhone);
      const msg = [
        `*LAPORAN SETTLEMENT MINGGUAN — ${db.settings.outletName}*`,
        `Brand Owner : *${row.brand}*`,
        `Periode     : ${bounds.label}`,
        `--------------------------------`,
        `Total Item Terjual : ${row.totalQty} porsi/cup`,
        `Item Kena Komisi   : ${row.commissionQty} porsi/cup (${rp(row.commissionableSales)})`,
        `Item Acuan Gaji    : ${row.qualifyingQty} porsi/cup (${(row.salaryShareRatio * 100).toFixed(1)}%)`,
        `Omzet Kotor Brand  : ${rp(row.grossSales)}`,
        `Potongan Komisi (${row.commissionPct}%) : -${rp(row.commissionAmount)}`,
        `Porsi Beban Gaji   : -${rp(row.salaryDeduction)}`,
        `--------------------------------`,
        `*NET WAJIB TRANSFER : ${rp(row.netTransfer)}*`,
        `--------------------------------`,
        `Terima kasih atas kerja samanya!`
      ].join('\n');

      const encoded = encodeURIComponent(msg);
      const waUrl = phoneClean ? `https://wa.me/${phoneClean}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
      window.open(waUrl, '_blank');
    }

      const grossSales = paidTrx.reduce((s, t) => s + t.subtotal, 0);

      const grossProfit = netSales - totalCogs;

    function saveCustomerForm(custId) {
      const name = document.getElementById('custNameInp').value.trim();
      const phone = document.getElementById('custPhoneInp').value.trim();
      const voucherCode = document.getElementById('custVoucherCodeInp').value.trim().toUpperCase();

      if (!name) { showToast('Nama pelanggan wajib diisi.', true); return; }

      if (custId) {

        if (idx >= 0) {
          db.customers[idx] = { ...db.customers[idx], name, phone, voucherCode, voucherDiscount };

        db.customers.unshift({
          id: 'CST-' + Date.now(),
          name,
          phone,
          tier: 'Regular',
          totalVisits: 0,
          totalSpent: 0,
          voucherCode,
          voucherDiscount

      closeModal();

    function openStockMovementModal(mode, preselectId = '') {
      openModal(`

            </select>
          </div>

          </div>

    function saveStockMovement(mode) {
      const id = document.getElementById('stkItemSel').value;
      const qty = Number(document.getElementById('stkQtyInp').value) || 0;
      const note = document.getElementById('stkNoteInp').value.trim() || mode;
      const item = db.inventory.find(i => i.id === id);
      if (!item || qty < 0) return;

      if (mode === 'IN') item.stock += qty;
      else if (mode === 'WASTE') item.stock = Math.max(0, item.stock - qty);
      else if (mode === 'OPNAME') item.stock = qty;

      db.stockLogs.unshift({
        id: 'LOG-' + Date.now(),
        date: todayISO(),
        time: nowTimeStr(),
        type: mode,
        itemName: item.name,
        qty,
        unit: item.unit,
        note,
        by: currentUser.name
      });
      saveDB();
      autoSyncMasterSlices(['inventory']);
      closeModal();
      renderInventoryTab(document.getElementById('mainContentArea'));
      showToast('Stok gudang diperbarui & disinkronkan.');
    }

      openModal(`

      `);
    }

    function saveNewMenuCategory() {
      const val = document.getElementById('newCatInput').value.trim();
      if (!val) return;
      if (db.categories.some(c => c.toLowerCase() === val.toLowerCase())) {
        showToast('Kategori dengan nama tersebut sudah ada.', true);
        return;
      }
      db.categories.push(val);
      saveDB();
      autoSyncMasterSlices(['meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${val}" ditambahkan & disinkronkan ke layar Kasir.`);
    }

    function moveCategoryOrder(catName, direction) {
      const idx = db.categories.indexOf(catName);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= db.categories.length) return;
      const temp = db.categories[idx];
      db.categories[idx] = db.categories[targetIdx];
      db.categories[targetIdx] = temp;
      saveDB();
      autoSyncMasterSlices(['meta']);
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Urutan kategori "${catName}" dipindahkan ke posisi #${targetIdx + 1}.`);
    }

    function setCategoryExactPosition(catName, newPosOneBased) {
      const idx = db.categories.indexOf(catName);
      if (idx === -1) return;
      const targetIdx = Math.max(0, Math.min(db.categories.length - 1, (Number(newPosOneBased) || 1) - 1));
      if (targetIdx === idx) return;
      db.categories.splice(idx, 1);
      db.categories.splice(targetIdx, 0, catName);
      saveDB();
      autoSyncMasterSlices(['meta']);
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${catName}" diatur ke urutan #${targetIdx + 1}.`);
    }

    function openEditMenuCategoryModal(oldName) {
      openModal(`
        <div class="modal-head"><h3 style="margin:0;font-size:17px;">Edit Kategori: ${esc(oldName)}</h3><button class="close-circle" onclick="closeModal()">x</button></div>
        <input id="editCatInput" class="styled-input" value="${esc(oldName)}" style="margin-bottom:12px;" />
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn btn-danger" onclick="deleteMenuCategory('${esc(oldName)}')">Hapus Kategori</button>
          <button class="btn btn-dark" onclick="updateMenuCategory('${esc(oldName)}')">Simpan Perubahan</button>
        </div>
      `);
    }

    function updateMenuCategory(oldName) {
      const nextName = document.getElementById('editCatInput').value.trim();
      if (!nextName) return;
      const idx = db.categories.indexOf(oldName);
      if (idx >= 0) db.categories[idx] = nextName;
      db.products.forEach(p => { if (p.category === oldName) p.category = nextName; });
      saveDB();
      autoSyncMasterSlices(['products', 'meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Kategori diperbarui & disinkronkan.');
    }

    function deleteMenuCategory(catName) {
      db.categories = db.categories.filter(c => c.toLowerCase() !== String(catName).toLowerCase());
      saveDB();
      autoSyncMasterSlices(['meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast(`Kategori "${catName}" dihapus.`);
    }

    function saveProductForm(prodId) {
      const name = document.getElementById('pNameInp').value.trim();
      if (!name) { showToast('Nama produk wajib diisi.', true); return; }
      const brandSel = document.getElementById('pBrandSel').value;
      const brandCustom = (document.getElementById('pBrandCustomInp')?.value || '').trim();
      const brand = brandSel === '__CUSTOM__' ? (brandCustom || 'Kopi Jiwara') : brandSel;
      db.deletedBrands = (db.deletedBrands || []).filter(b => b.toLowerCase() !== brand.toLowerCase());
      getBrandConfig(brand);

      const data = {
        sku: document.getElementById('pSkuInp').value.trim() || ('PRD-' + (db.products.length + 1)),
        name,
        category: document.getElementById('pCatInp').value,
        brand,
        includeCommissionShare: document.getElementById('pCommShareChk').checked,
        includeSalaryShare: document.getElementById('pSalaryShareChk').checked,
        price: Math.max(0, Number(document.getElementById('pPriceInp').value) || 0),
        cost: Math.max(0, Number(document.getElementById('pCostInp').value) || 0),
        unit: document.getElementById('pUnitInp').value.trim() || 'Pcs',
        fav: document.getElementById('pFavChk').checked
      };
      if (prodId) {
        const idx = db.products.findIndex(x => x.id === prodId);
        if (idx >= 0) db.products[idx] = { ...db.products[idx], ...data };
      } else {
        db.products.unshift({ id: 'PRD-' + Date.now(), stock: 50, ...data });
      }
      saveDB();
      autoSyncMasterSlices(['products', 'meta']);
      closeModal();
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Produk tersimpan & disinkronkan ke Google Sheets.');
    }

    function deleteProductItem(prodId) {
      db.products = db.products.filter(p => p.id !== prodId);
      saveDB();
      autoSyncMasterSlices(['products']);
      renderSettingsProdukKategori(document.getElementById('settingsSubBody'));
      showToast('Produk dihapus & disinkronkan.');
    }

    function handleOutletLogoUpload(e) {

        db.settings.logoDataUrl = ev.target.result;
        saveDB();
        renderWorkspace();
        showToast('Logo outlet berhasil diperbarui.');

      reader.readAsDataURL(file);
    }

    function submitCashDrawerEntry(fromModal = false) {
      const type = document.getElementById('kasTypeSel').value;
      const amount = Math.max(0, Number(document.getElementById('kasAmountInp').value) || 0);
      const note = document.getElementById('kasNoteInp').value.trim();
      if (amount <= 0 || !note) { showToast('Nominal dan keterangan wajib diisi.', true); return; }

      const entry = {
        id: 'CSH-' + Date.now(),
        date: todayISO(),
        time: nowTimeStr(),
        type,
        amount,
        note,
        by: currentUser.name
      };
      db.cashDrawer.unshift(entry);
      saveDB();
      syncMasterEvent('CASH_MOVEMENT', entry);
      if (fromModal) closeModal();
      renderWorkspace();
      showToast('Mutasi kas berhasil dicatat.');
    }

    function renderKeluarKasirTab(container) {
      const todayPaid = db.transactions.filter(t => t.status === 'PAID' && t.date === todayISO());
      const todayCashLogs = db.cashDrawer.filter(c => c.date === todayISO());

      let cashSales = 0, qrisSales = 0, transferSales = 0, onlineSales = 0;
      todayPaid.forEach(t => {
        if (t.splitDetails) {
          t.splitDetails.forEach(sp => {
            if (sp.method === 'Cash') cashSales += sp.amount;
            else if (sp.method === 'QRIS') qrisSales += sp.amount;
            else if (sp.method === 'Transfer') transferSales += sp.amount;
            else onlineSales += sp.amount;
          });
        } else {
          if (t.paymentMethod === 'Cash') cashSales += t.total;
          else if (t.paymentMethod === 'QRIS') qrisSales += t.total;
          else if (t.paymentMethod === 'Transfer') transferSales += t.total;
          else onlineSales += t.total;
        }
      });

      const cashIn = todayCashLogs.filter(c => c.type === 'IN').reduce((s, c) => s + c.amount, 0);
      const cashOut = todayCashLogs.filter(c => c.type === 'OUT').reduce((s, c) => s + c.amount, 0);
      const expectedCash = (db.shift.openingCash || 0) + cashSales + cashIn - cashOut;

      const soldMap = {};
      todayPaid.forEach(t => t.items.forEach(i => { soldMap[i.name] = (soldMap[i.name] || 0) + i.qty; }));
      const soldSummaryLines = Object.entries(soldMap).map(([n, q]) => `• ${n}: ${q}x`).join('\n') || 'Belum ada item terjual';

      const waReportText = [
        `*LAPORAN TUTUP KASIR — ${db.settings.outletName}*`,
        `Tanggal : ${todayISO()} (${nowTimeStr()})`,
        `Kasir   : ${currentUser.name}`,
        `--------------------------`,
        `Modal Awal     : ${rp(db.shift.openingCash || 0)}`,
        `Penjualan Cash : ${rp(cashSales)}`,
        `Penjualan QRIS : ${rp(qrisSales)}`,
        `Transfer Bank  : ${rp(transferSales)}`,
        `Online Food    : ${rp(onlineSales)}`,
        `Total Omzet    : ${rp(cashSales + qrisSales + transferSales + onlineSales)}`,
        `--------------------------`,
        `Kas Masuk Laci : ${rp(cashIn)}`,
        `Kas Keluar     : ${rp(cashOut)}`,
        `Ekspektasi Cash Laci: ${rp(expectedCash)}`,
        `--------------------------`,
        `*Rincian Produk Terjual:*`,
        soldSummaryLines
      ].join('\n');

      container.innerHTML = `
        <div class="bento-card" style="max-width:740px;margin:0 auto;">
          <h3 style="margin:0 0 6px;font-size:18px;">Keluar Kasir & Tutup Shift (Closing Report)</h3>
          <p style="font-size:12px;color:var(--text-muted);margin-top:0;">Hitung uang tunai fisik di laci, kirim ringkasan via WhatsApp, lalu tutup kasir dengan PIN Anda.</p>

    }

    function finalizeShiftClosing(expectedCash, totalOmzet) {
      const actualCash = Math.max(0, Number(document.getElementById('actualCashCloseInp').value) || 0);
      const pin = document.getElementById('closeShiftPinInp').value.trim();
      if (pin !== currentUser.pin) {
        showToast('PIN Kasir tidak sesuai.', true);
        return;
      }

      const closingRecord = {
        id: 'CLS-' + Date.now(),
        date: todayISO(),
        closedAt: nowTimeStr(),
        closedBy: currentUser.name,
        openingCash: db.shift.openingCash || 0,
        expectedCash,
        actualCash,
        variance: actualCash - expectedCash,
        totalOmzet
      };

      db.shift.closingHistory.unshift(closingRecord);
      db.shift.isOpen = false;
      db.shift.openedBy = '';
      db.shift.openingCash = 0;
      saveDB();

      syncMasterEvent('SHIFT_CLOSED', closingRecord);
      showToast('Shift kasir berhasil ditutup. Terima kasih atas kerja keras hari ini!');

      currentUser = null;
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('appWorkspace').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      initLoginScreen();
    }

    var result = {
      status: 'OK',
      serverTime: new Date().toISOString(),
      products: readMenuSheet(ss),

      brandConfigs: meta.brandConfigs,
      deletedBrands: meta.deletedBrands,

function readMenuSheet(ss) {
  var sh = ss.getSheetByName('MASTER_MENU');
  if (!sh || sh.getLastRow() <= 1) return [];
  var rows = sh.getDataRange().getValues();
  var out = [];
  for (var r = 1; r < rows.length; r++) {
    if (!rows[r][2]) continue;
    out.push({
      sku: String(rows[r][1] || ''),
      name: String(rows[r][2] || ''),
      category: String(rows[r][3] || 'Kopi Jiwara'),
      brand: String(rows[r][4] || 'Kopi Jiwara'),
      includeCommissionShare: String(rows[r][5] || 'Ya') !== 'Tidak',
      includeSalaryShare: String(rows[r][6] || 'Ya') !== 'Tidak',
      unit: String(rows[r][7] || 'Cup'),
      price: Number(rows[r][8]) || 0,
      cost: Number(rows[r][9]) || 0,
      fav: String(rows[r][12] || '') === 'Ya'
    });
  }
  return out;
}

function readCategoryBrandSheet(ss) {
  var sh = ss.getSheetByName('MASTER_KATEGORI_BRAND');
  var categories = [];
  var brandConfigs = [];
  var deletedBrands = [];
  if (!sh || sh.getLastRow() <= 1) {
    return { categories: categories, brandConfigs: brandConfigs, deletedBrands: deletedBrands };
  }
  var rows = sh.getDataRange().getValues();
  for (var r = 1; r < rows.length; r++) {
    var tipe = String(rows[r][1] || '').toUpperCase();
    var nama = String(rows[r][3] || '').trim();
    var status = String(rows[r][6] || 'Aktif');
    if (!nama) continue;
    if (tipe === 'KATEGORI') {
      categories.push(nama);
    } else if (tipe === 'BRAND') {
      if (status.toLowerCase() === 'dihapus' || status.toLowerCase() === 'nonaktif') {
        deletedBrands.push(nama);
      } else {
        brandConfigs.push({
          brand: nama,
          commissionPct: Number(rows[r][4]) || 10,
          ownerPhone: String(rows[r][5] || ''),
          salaryShareActive: true,
          active: true
        });
      }
    }
  }
  return { categories: categories, brandConfigs: brandConfigs, deletedBrands: deletedBrands };
}

      time: String(rows[r][4] || ''),

function readRecentCashDrawer(ss, limit) {
  var sh = ss.getSheetByName('ARUS_KAS_CASHFLOW');
  if (!sh || sh.getLastRow() <= 1) return [];
  var rows = sh.getDataRange().getValues();
  var start = Math.max(1, rows.length - limit);
  var out = [];
  for (var r = start; r < rows.length; r++) {
    if (!rows[r][1]) continue;
    var debit = Number(rows[r][5]) || 0;
    var kredit = Number(rows[r][6]) || 0;
    out.push({
      id: String(rows[r][1]),
      date: String(rows[r][2] || ''),
      time: String(rows[r][3] || ''),
      type: debit > 0 ? 'IN' : 'OUT',
      amount: debit > 0 ? debit : kredit,
      note: String(rows[r][7] || ''),
      by: String(rows[r][8] || '')
    });
  }
  return out;
}

function doPost(e) {
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var body = JSON.parse(e.postData.contents);
    var type = body.eventType;
    var p = body.payload || {};
    var ts = body.timestamp || new Date().toISOString();

    if (type === 'SALE_COMPLETED') {
      writeSingleSale(ss, ts, body.outlet, p);
    } else if (type === 'CASH_MOVEMENT') {
      var shKas = ss.getSheetByName('ARUS_KAS_CASHFLOW');
      var isIn = p.type === 'IN';
      shKas.appendRow([ts, p.id, p.date, p.time, isIn ? 'Kas Masuk' : 'Kas Keluar', isIn ? p.amount : 0, isIn ? 0 : p.amount, p.note, p.by]);
    } else if (type === 'BRAND_SETTLEMENT_RECORDED') {
      var shSettle = getOrCreateSheet(ss, 'SETTLEMENT_BRAND', [
        'Timestamp', 'ID_Settlement', 'Tanggal_Transfer', 'Periode', 'Brand',
        'Total_Item_Terjual', 'Item_Kena_Komisi', 'Omzet_Kena_Komisi', 'Item_Acuan_Gaji',
        'Omzet_Kotor_Brand', 'Persen_Komisi', 'Potongan_Komisi', 'Persen_Porsi_Gaji',
        'Potongan_Gaji', 'Net_Wajib_Transfer', 'PIC'
      ]);
      shSettle.appendRow([
        ts, p.id, p.date, p.periodLabel, p.brand,
        p.totalQty || 0, p.commissionQty || 0, p.commissionableSales || 0, p.qualifyingQty || 0,
        p.grossSales || 0, p.commissionPct || 10, p.commissionAmount || 0,
        p.salarySharePct || 0, p.salaryDeduction || 0, p.netTransfer || 0, p.recordedBy || ''
      ]);
    } else if (type === 'SHIFT_CLOSED') {
      var shClose = ss.getSheetByName('CLOSING_SHIFT');
      shClose.appendRow([ts, p.id, p.date, p.closedAt, p.closedBy, p.openingCash, p.totalOmzet, p.expectedCash, p.actualCash, p.variance]);
    } else if (type === 'ORDER_VOID_AUTHORIZED' || type === 'PAID_TRX_CANCELLED') {
      var shAudit = ss.getSheetByName('AUDIT_OTORISASI');
      shAudit.appendRow([ts, p.id, p.date, p.time, p.actionType, p.orderId, p.reason, p.approvedBy, p.requestedBy]);
    } else if (type === 'STAFF_CLOCK_IN' || type === 'STAFF_CLOCK_OUT') {
      var shAbs = ss.getSheetByName('ABSENSI_KARYAWAN');
      shAbs.appendRow([ts, p.id, p.date, p.staffName, p.clockIn, p.clockOut || 'Aktif', p.wage]);
    } else if (type === 'SYNC_MASTER_TABLES' || type === 'FULL_MASTER_SYNC') {
      syncMasterTables(ss, ts, body.outlet, p);
    }

    return ContentService.createTextOutput(JSON.stringify({ status: 'OK', eventType: type }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'ERROR', message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function writeSingleSale(ss, ts, outlet, trx) {
  var shTrx = ss.getSheetByName('POS_TRANSAKSI');
  var shItem = ss.getSheetByName('POS_ITEM_TERJUAL');
  var labaKotor = (Number(trx.total) || 0) - (Number(trx.totalCost) || 0);
  shTrx.appendRow([
    ts, outlet, trx.id, trx.date, trx.time, trx.orderType,
    trx.tableOrCustomer || '-', trx.cashier, trx.paymentMethod,
    trx.subtotal, trx.discount || 0, trx.promoCode || '-',
    trx.total, trx.totalCost || 0, labaKotor, trx.status,
    JSON.stringify(trx.items || [])
  ]);
  (trx.items || []).forEach(function(it) {
    var subJual = (Number(it.price) || 0) * (Number(it.qty) || 0);
    var totHpp = (Number(it.cost) || 0) * (Number(it.qty) || 0);
    shItem.appendRow([
      trx.date, trx.time, trx.id, trx.orderType, it.brand || 'Kopi Jiwara',
      it.includeCommissionShare === false ? 'Tidak' : 'Ya',
      it.includeSalaryShare === false ? 'Tidak' : 'Ya',
      it.sku || '-', it.name, it.qty, it.price, subJual, it.cost || 0, totHpp, subJual - totHpp
    ]);
  });
}

function syncMasterTables(ss, ts, outlet, p) {
  if (p.products) {
    var shMenu = ss.getSheetByName('MASTER_MENU');
    shMenu.clearContents();
    shMenu.appendRow(['Update_Time', 'SKU', 'Nama_Produk', 'Kategori', 'Brand', 'Kena_Komisi_Brand', 'Hitung_Porsi_Gaji', 'Satuan', 'Harga_Jual', 'HPP_Modal', 'Margin_Rp', 'Margin_Persen', 'Menu_Favorit']);
    p.products.forEach(function(pr) {
      var mRp = (Number(pr.price) || 0) - (Number(pr.cost) || 0);
      var mPct = pr.price > 0 ? Math.round((mRp / pr.price) * 100) + '%' : '0%';
      shMenu.appendRow([ts, pr.sku, pr.name, pr.category, pr.brand || 'Kopi Jiwara', pr.includeCommissionShare === false ? 'Tidak' : 'Ya', pr.includeSalaryShare === false ? 'Tidak' : 'Ya', pr.unit, pr.price, pr.cost || 0, mRp, mPct, pr.fav ? 'Ya' : 'Tidak']);
    });
  }
  if (p.categories || p.brandConfigs || p.deletedBrands) {
    var shMeta = getOrCreateSheet(ss, 'MASTER_KATEGORI_BRAND', [
      'Update_Time', 'Tipe_Data', 'Urutan', 'Nama_Item', 'Komisi_Persen', 'No_WA_Owner', 'Status'
    ]);
    shMeta.clearContents();
    shMeta.appendRow(['Update_Time', 'Tipe_Data', 'Urutan', 'Nama_Item', 'Komisi_Persen', 'No_WA_Owner', 'Status']);
    (p.categories || []).forEach(function(cat, idx) {
      shMeta.appendRow([ts, 'KATEGORI', idx + 1, cat, '', '', 'Aktif']);
    });
    (p.brandConfigs || []).forEach(function(bc, idx) {
      shMeta.appendRow([ts, 'BRAND', idx + 1, bc.brand, bc.commissionPct || 10, bc.ownerPhone || '', 'Aktif']);
    });
    (p.deletedBrands || []).forEach(function(dbName, idx) {
      shMeta.appendRow([ts, 'BRAND', idx + 1, dbName, 0, '', 'Dihapus']);
    });
  }
  if (p.inventory) {
    var shInv = ss.getSheetByName('GUDANG_STOK');
    shInv.clearContents();
    shInv.appendRow(['Update_Time', 'SKU', 'Nama_Bahan', 'Kategori', 'Satuan', 'Stok_Saat_Ini', 'Stok_Minimum', 'Status_Stok', 'Harga_Beli_Satuan', 'Nilai_Aset_Stok']);
    p.inventory.forEach(function(inv) {
      var status = inv.stock <= inv.minStock ? 'MENIPIS' : 'AMAN';
      shInv.appendRow([ts, inv.sku, inv.name, inv.category, inv.unit, inv.stock, inv.minStock, status, inv.costPerUnit || 0, (inv.stock || 0) * (inv.costPerUnit || 0)]);
    });
  }
  if (p.staff) {
    var shStf = ss.getSheetByName('MASTER_PEGAWAI');
    shStf.clearContents();
    shStf.appendRow(['Update_Time', 'ID_Pegawai', 'Nama_Pegawai', 'Jabatan_Role', 'PIN_Akses', 'Upah_Harian', 'Status']);
    p.staff.forEach(function(st) {
      shStf.appendRow([ts, st.id, st.name, st.role, st.pin, st.dailyWage || 0, st.active ? 'Aktif' : 'Nonaktif']);
    });
  }
  if (p.promos) {
    var shPrm = ss.getSheetByName('MASTER_PROMO');
    shPrm.clearContents();
    shPrm.appendRow(['Update_Time', 'ID_Promo', 'Kode_Promo', 'Nama_Program', 'Tipe_Diskon', 'Nilai_Potongan', 'Min_Belanja', 'Berlaku_Sampai', 'Status']);
    p.promos.forEach(function(pr) {
      shPrm.appendRow([ts, pr.id, pr.code, pr.title, pr.type, pr.value, pr.minPurchase || 0, pr.validUntil || '-', pr.active ? 'Aktif' : 'Nonaktif']);
    });
  }
  if (p.customers) {
    var shCrm = ss.getSheetByName('CRM_PELANGGAN');
    shCrm.clearContents();
    shCrm.appendRow(['Update_Time', 'ID_Pelanggan', 'Nama_Pelanggan', 'No_WhatsApp', 'Tier_Member', 'Total_Kunjungan', 'Total_Belanja', 'Kode_Voucher', 'Nilai_Voucher']);
    p.customers.forEach(function(c) {
      shCrm.appendRow([ts, c.id, c.name, c.phone || '-', c.tier, c.totalVisits || 0, c.totalSpent || 0, c.voucherCode || '-', c.voucherDiscount || 0]);
    });
  }
  if (p.openOrders) {
    var shOpen = ss.getSheetByName('OPEN_ORDERS');
    shOpen.clearContents();
    shOpen.appendRow(['Update_Time', 'No_Nota', 'Tanggal', 'Jam', 'Tipe_Order', 'Meja_Pelanggan', 'Kasir', 'Subtotal', 'Diskon', 'Total_Tagihan', 'Detail_Item_JSON']);
    p.openOrders.forEach(function(o) {
      shOpen.appendRow([ts, o.id, o.date, o.time, o.orderType, o.tableOrCustomer || '-', o.cashier, o.subtotal, o.discount || 0, o.total, JSON.stringify(o.items || [])]);
    });
  }
}

function getOrCreateSheet(ss, name, headers) {
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  if (sh.getLastRow() === 0 && headers && headers.length > 0) {
    sh.appendRow(headers);
    sh.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#0B2E23').setFontColor('#FACC15');
    sh.setFrozenRows(1);
  }
  return sh;
}
