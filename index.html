  <title>KOPI JIWARA — POS & Management System</title>
  <script>
    // Dynamic PWA Manifest & Service Worker Generator for Single-File GitHub Pages Installability
    (function setupInstallablePWA() {
      try {
        function createPngIcon(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0B2E23';
          ctx.fillRect(0, 0, size, size);

          // Decorative accents
          ctx.fillStyle = '#FACC15';
          ctx.beginPath();
          ctx.arc(size * 0.78, size * 0.22, size * 0.08, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#EC4899';
          ctx.beginPath();
          ctx.arc(size * 0.22, size * 0.78, size * 0.065, 0, Math.PI * 2);
          ctx.fill();

          // Brand Monogram
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `900 ${Math.round(size * 0.34)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('KJ', size * 0.5, size * 0.48);

          ctx.fillStyle = '#FACC15';
          ctx.font = `800 ${Math.round(size * 0.11)}px sans-serif`;
          ctx.fillText('POS', size * 0.5, size * 0.74);

          return canvas.toDataURL('image/png');
        }

        const icon192 = createPngIcon(192);
        const icon512 = createPngIcon(512);

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = icon192;
        document.head.appendChild(appleIcon);

        const manifestObj = {
          name: 'KOPI JIWARA POS & Management',
          short_name: 'Kopi Jiwara',
          description: 'Sistem Kasir POS & ERP All-in-One Kopi Jiwara',
          start_url: window.location.href,
          scope: window.location.origin + '/',
          display: 'standalone',
          orientation: 'any',
          background_color: '#0B2E23',
          theme_color: '#0B2E23',
          icons: [
            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
          const swCode = `
            self.addEventListener('install', function(e) { self.skipWaiting(); });
            self.addEventListener('activate', function(e) { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', function(e) {
              e.respondWith(fetch(e.request).catch(function() { return caches.match(e.request); }));
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});
        }
      } catch (err) {
        console.warn('PWA init warning:', err);
      }
    })();
  </script>
  <style>

    .mt-1 { margin-top: 4px; }

    async function syncToGoogleSheets(eventType, payload, showFeedback = false) {
      const url = (db.outletInfo.webhookUrl || '').trim();
      if (!url) {
        if (showFeedback) showToast('Masukkan URL Google Apps Script Webhook terlebih dahulu!', 'error');
        return;
      }

      let sheetTarget = 'POS_Transactions';
      let cashflowRow = null;
      let sellingProductBreakdown = null;

      if (eventType === 'SALE_COMPLETED' && payload) {
        sheetTarget = 'Selling Product & Cashflow';
        const brandTotals = {
          kopiJiwara: 0,
          ayamBabaJay: 0,
          jovangels: 0,
          jihyo: 0
        };
        (payload.items || []).forEach(it => {
          const prod = db.products.find(p => p.id === it.productId);
          const cat = (prod ? prod.category : '').toLowerCase();
          const lineTotal = (it.price || 0) * (it.qty || 1);
          if (cat.includes('ayam')) brandTotals.ayamBabaJay += lineTotal;
          else if (cat.includes('jovangel')) brandTotals.jovangels += lineTotal;
          else if (cat.includes('jihyo') || cat.includes('dimsum')) brandTotals.jihyo += lineTotal;
          else brandTotals.kopiJiwara += lineTotal;
        });

        sellingProductBreakdown = {
          date: payload.date,
          channel: payload.orderType,
          paymentMethod: payload.paymentMethod,
          orderCount: 1,
          grossSales: payload.subtotal,
          discount: payload.discountAmount,
          netSales: payload.total,
          hpp: payload.totalHpp || 0,
          profit: (payload.total || 0) - (payload.totalHpp || 0),
          brands: brandTotals
        };

        cashflowRow = {
          debit: payload.total,
          kredit: 0,
          tgl: payload.date,
          nomorNota: payload.id,
          pihak: payload.customerName || 'Pelanggan Umum',
          keterangan: payload.paymentMethod === 'Cash' ? 'Sales Cash' : `Sales ${payload.paymentMethod}`,
          kategoriAkun: 'Pendapatan Penjualan Tunai'
        };
      } else if (eventType === 'CASH_DRAWER' && payload) {
        sheetTarget = 'Cashflow';
        cashflowRow = {
          debit: payload.type === 'in' ? payload.amount : 0,
          kredit: payload.type === 'out' ? payload.amount : 0,
          tgl: payload.date,
          nomorNota: payload.id,
          pihak: payload.staff || 'Kasir',
          keterangan: payload.note || payload.category,
          kategoriAkun: payload.type === 'in' ? 'Kas Masuk' : 'Biaya Operasional Warung'
        };
      } else if (eventType === 'CLOSE_SHIFT' && payload) {
        sheetTarget = 'Jiwara Chart Reports & Cashflow';
      }

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            timestamp: new Date().toISOString(),
            merchant: 'Dapur Jiwara',
            brand: db.outletInfo.name,
            outlet: db.outletInfo.branch,
            sheetTarget,
            eventType,
            payload,
            sellingProductBreakdown,
            cashflowRow
          })
        });
        db.outletInfo.lastSyncAt = new Date().toLocaleString('id-ID');
        db.outletInfo.lastSyncStatus = `Terkirim (${eventType})`;
        saveState();
        if (showFeedback) {
          showToast('Sinkronisasi berhasil dikirim ke Google Sheets Dapur Jiwara!');
          render();
        }
      } catch (err) {
        db.outletInfo.lastSyncStatus = 'Gagal Terhubung';
        saveState();
        if (showFeedback) {
          showToast('Gagal mengirim ke Google Sheets Webhook.', 'error');
          render();
        }
      }
    }

    window.exportDapurJiwaraCsv = function(type) {
      let csvContent = '';
      let filename = '';
      if (type === 'cashflow') {
        csvContent = 'Debit (Pemasukan),Kredit (Pengeluaran),Tgl,Nomor Nota,Terima dari/dibayarkan kepada,Keterangan\n';
        db.completedOrders.filter(o => o.status === 'Selesai').forEach(o => {
          const ket = o.paymentMethod === 'Cash' ? 'Sales Cash' : `Sales ${o.paymentMethod}`;
          csvContent += `${o.total},0,${o.date},${o.id},"${o.customerName}","${ket} (${o.orderType})"\n`;
        });
        db.cashDrawerLogs.forEach(c => {
          const deb = c.type === 'in' ? c.amount : 0;
          const kre = c.type === 'out' ? c.amount : 0;
          csvContent += `${deb},${kre},${c.date},${c.id},"${c.staff}","${c.note}"\n`;
        });
        filename = `Dapur_Jiwara_Cashflow_${getTodayStr(0)}.csv`;
      } else {
        csvContent = 'Date,Channel,No Nota,Kopi Jiwara,Ayam Baba Jay,Jovangels,Jihyo,Total Order,Total Sales,Total Profit\n';
        db.completedOrders.filter(o => o.status === 'Selesai').forEach(o => {
          let kj = 0, abj = 0, jvg = 0, jhy = 0;
          o.items.forEach(it => {
            const p = db.products.find(x => x.id === it.productId);
            const cat = (p ? p.category : '').toLowerCase();
            const sub = it.price * it.qty;
            if (cat.includes('ayam')) abj += sub;
            else if (cat.includes('jovangel')) jvg += sub;
            else if (cat.includes('jihyo') || cat.includes('dimsum')) jhy += sub;
            else kj += sub;
          });
          const profit = o.total - (o.totalHpp || 0);
          csvContent += `${o.date},${o.orderType},${o.id},${kj},${abj},${jvg},${jhy},1,${o.total},${profit}\n`;
        });
        filename = `Dapur_Jiwara_Selling_Product_${getTodayStr(0)}.csv`;
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast(`File ${filename} berhasil diunduh!`);
    };

    function formatDigitsWithDots(rawVal) {
      const digits = String(rawVal || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function parseFormattedNumber(rawVal) {
      const digits = String(rawVal || '').replace(/\D/g, '');
      return digits ? Number(digits) : null;
    }

    function showToast(message, type = 'success') {
      ui.toast = { message, type };
      render();
      setTimeout(() => {

          render();
        }
      }, 3000);
    }

    function getCartTotals(items = ui.cart, promoId = ui.selectedPromoId, manType = ui.manualDiscountType, manVal = ui.manualDiscountValue) {
      const subtotal = items.reduce((sum, it) => sum + (it.price * it.qty), 0);
      let promoDiscount = 0;
      if (promoId) {
        const promo = db.promos.find(p => p.id === promoId);
        if (promo) {
          promoDiscount = promo.type === 'percent'
            ? Math.round(subtotal * (Number(promo.value) / 100))
            : (Number(promo.value) || 0);
        }
      }
      const rawMan = Math.max(0, Number(manVal) || 0);
      const manualDiscount = manType === 'percent'
        ? Math.round(subtotal * (Math.min(100, rawMan) / 100))
        : rawMan;
      const discountAmount = Math.min(subtotal, promoDiscount + manualDiscount);
      const total = Math.max(0, subtotal - discountAmount);
      return { subtotal, promoDiscount, manualDiscount, discountAmount, total };
    }

    function upsertCRMCustomer(name, phone, spent) {
      const cleanName = (name || '').trim();
      const cleanPhone = (phone || '').trim();
      if (!cleanName && !cleanPhone) return;
      const existing = db.customers.find(c =>
        (cleanPhone && cleanPhone !== '-' && c.phone === cleanPhone) ||
        (cleanName && c.name.toLowerCase() === cleanName.toLowerCase())
      );
      if (existing) {
        existing.visits += 1;
        existing.totalSpent += spent;
        if (cleanPhone && (!existing.phone || existing.phone === '-')) existing.phone = cleanPhone;
      } else {
        db.customers.unshift({
          id: 'CRM-' + Date.now().toString().slice(-4),
          name: cleanName || 'Pelanggan Umum',
          phone: cleanPhone || '-',
          visits: 1,
          totalSpent: spent
        });
      }
    }

    function deductStockOnSale(items) {
      items.forEach(item => {
        const prod = db.products.find(p => p.id === item.productId);
        if (prod && typeof prod.stock === 'number') {
          prod.stock = Math.max(0, prod.stock - item.qty);
        }
        if (prod && prod.unit === 'Cup') {
          const cup = db.inventory.find(i => i.sku === 'BHN-06');
          const blend = db.inventory.find(i => i.sku === 'BHN-01');
          if (cup) cup.stock = Math.max(0, cup.stock - item.qty);
          if (blend) blend.stock = Math.max(0, blend.stock - (18 * item.qty));
        } else if (prod && prod.category.includes('Ayam')) {
          const ayam = db.inventory.find(i => i.sku === 'BHN-07');
          if (ayam) ayam.stock = Math.max(0, ayam.stock - item.qty);
        } else if (prod && prod.category.includes('Dimsum')) {
          const dimsum = db.inventory.find(i => i.sku === 'BHN-08');
          if (dimsum) dimsum.stock = Math.max(0, dimsum.stock - (4 * item.qty));
        }
      });
    }

    function updatePaymentChangeBanner(total) {
      const box = document.getElementById('paymentChangeDisplay');
      if (!box) return;
      const tenderedNum = parseFormattedNumber(ui.cashTendered);
      if (tenderedNum === null) {
        box.innerHTML = `<span class="font-extrabold text-lg" style="color:var(--text-muted);">Rp 0</span>`;
        return;
      }
      if (tenderedNum < total) {
        const kurang = total - tenderedNum;

      } else {

      }

    window.completePaymentTransaction = function() {
      const src = ui.paymentOrderSource;
      const now = new Date();
      const today = getTodayStr(0);
      const timeStr = now.toTimeString().slice(0, 5);

      let items, orderType, tableNote, customerName, customerPhone, subtotal, discountAmount, total;
      if (src) {
        items = src.items;
        orderType = src.orderType;
        tableNote = src.tableNote;
        customerName = src.customerName;
        customerPhone = src.customerPhone;
        subtotal = src.subtotal;
        discountAmount = src.discountAmount;
        total = src.total;
      } else {
        const totals = getCartTotals();
        items = JSON.parse(JSON.stringify(ui.cart));
        orderType = ui.orderType;
        tableNote = ui.tableNote;
        customerName = ui.customerName.trim() || 'Pelanggan Umum';
        customerPhone = ui.customerPhone.trim() || '-';
        subtotal = totals.subtotal;
        discountAmount = totals.discountAmount;
        total = totals.total;
      }

      const parsedTendered = parseFormattedNumber(ui.cashTendered);
      if (ui.paymentMethod === 'Cash' && parsedTendered !== null && parsedTendered < total) {
        showToast(`Uang cash diterima kurang ${formatRp(total - parsedTendered)}!`, 'error');
        return;
      }

      const cashRec = ui.paymentMethod === 'Cash' ? (parsedTendered !== null ? parsedTendered : total) : total;
      const change = ui.paymentMethod === 'Cash' ? Math.max(0, cashRec - total) : 0;
      const totalHpp = items.reduce((s, it) => s + ((it.hpp || 0) * it.qty), 0);
      const itemComm = items.reduce((s, it) => s + ((it.commission || 0) * it.qty), 0);
      const trxComm = ui.currentUser ? (ui.currentUser.commissionRate || 0) : 0;

      const completedTrx = {
        id: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
        date: today,
        time: timeStr,
        orderType,
        tableNote,
        customerName,
        customerPhone,
        cashierName: ui.currentUser.name,
        outlet: db.outletInfo.branch,
        paymentMethod: ui.paymentMethod,
        cashReceived: cashRec,
        change,
        status: 'Selesai',
        items,
        subtotal,
        discountAmount,
        total,
        totalHpp,
        commissionTotal: itemComm + trxComm
      };

      db.completedOrders.unshift(completedTrx);
      deductStockOnSale(items);
      upsertCRMCustomer(customerName, customerPhone, total);

      const removeId = src ? src.id : ui.editingOpenOrderId;
      if (removeId) {
        db.openOrders = db.openOrders.filter(o => o.id !== removeId);
      }

      if (!src) window.clearCart();
      ui.showPaymentModal = false;
      ui.paymentOrderSource = null;
      ui.receiptModalData = {
        title: 'Struk Pembayaran Lunas',
        isProforma: false,
        order: completedTrx
      };

      saveState();
      syncToGoogleSheets('SALE_COMPLETED', completedTrx);
      showToast(`Pembayaran ${completedTrx.id} Lunas (${ui.paymentMethod})!`);
      render();
    };

    function getActiveShiftMetrics() {
      const today = getTodayStr(0);
      const shift = db.activeShift || {
        id: 'SHF-ACTIVE',
        date: today,
        openedAt: '08:00',
        cashierName: ui.currentUser ? ui.currentUser.name : 'Kasir',
        outlet: db.outletInfo.branch,
        openingCash: 0,
        status: 'Belum Tutup Kasir'
      };

      const todaySales = db.completedOrders.filter(o => o.date === shift.date && o.status === 'Selesai');
      const cashSales = todaySales.filter(o => o.paymentMethod === 'Cash').reduce((s, o) => s + o.total, 0);
      const qrisSales = todaySales.filter(o => o.paymentMethod === 'QRIS').reduce((s, o) => s + o.total, 0);
      const transferSales = todaySales.filter(o => o.paymentMethod === 'Transfer').reduce((s, o) => s + o.total, 0);
      const totalSales = cashSales + qrisSales + transferSales;

      const todayCashLogs = db.cashDrawerLogs.filter(l => l.date === shift.date);
      const cashIn = todayCashLogs.filter(l => l.type === 'in').reduce((s, l) => s + l.amount, 0);
      const cashOut = todayCashLogs.filter(l => l.type === 'out').reduce((s, l) => s + l.amount, 0);
      const expectedCash = (shift.openingCash || 0) + cashSales + cashIn - cashOut;

      return { shift, todaySales, cashSales, qrisSales, transferSales, totalSales, cashIn, cashOut, expectedCash };
    }

    window.handleClockAction = function(actionType) {
      const today = getTodayStr(0);
      const nowTime = new Date().toTimeString().slice(0, 5);
      const activeRecord = db.attendance.find(a => a.date === today && a.staffId === ui.currentUser.id && !a.clockOut);

      if (actionType === 'in') {
        if (activeRecord) {
          showToast('Anda sudah melakukan Clock In hari ini!', 'warning');
          return;
        }
        const rec = {
          id: 'ATT-' + Date.now().toString().slice(-4),
          date: today,
          staffId: ui.currentUser.id,
          staffName: ui.currentUser.name,
          role: ui.currentUser.role,
          clockIn: nowTime,
          clockOut: null,
          duration: 'Aktif Shift',
          wage: ui.currentUser.dailyWage || 60000
        };
        db.attendance.unshift(rec);
        saveState();
        syncToGoogleSheets('CLOCK_IN', rec);
        showToast(`Clock In berhasil pukul ${nowTime}`);
      } else {
        if (!activeRecord) {
          showToast('Belum ada sesi Clock In aktif untuk di-Clock Out.', 'error');
          return;
        }
        activeRecord.clockOut = nowTime;
        const [h1, m1] = activeRecord.clockIn.split(':').map(Number);
        const [h2, m2] = nowTime.split(':').map(Number);
        const diffMins = Math.max(1, (h2 * 60 + m2) - (h1 * 60 + m1));
        activeRecord.duration = `${Math.floor(diffMins / 60)}j ${diffMins % 60}m`;
        saveState();
        syncToGoogleSheets('CLOCK_OUT', activeRecord);
        showToast(`Clock Out berhasil pukul ${nowTime}`);
      }
      render();
    };

    window.finalizeCloseRegister = function(actionAfter = 'close') {
      const m = getActiveShiftMetrics();
      const actualCash = parseFormattedNumber(ui.closingActualCash);
      if (actualCash === null || isNaN(actualCash) || actualCash < 0) {
        ui.closingPinError = 'Masukkan total uang cash fisik yang dihitung di laci.';
        render();
        return;
      }
      const validPin = ui.closingStaffPin === ui.currentUser.pin || db.staff.some(s => s.isManager && s.active !== false && s.pin === ui.closingStaffPin);
      if (!validPin) {
        ui.closingPinError = `PIN salah! Masukkan PIN ${ui.currentUser.name} untuk konfirmasi Tutup Kasir.`;
        render();
        return;
      }

      const soldMap = {};
      m.todaySales.forEach(o => {
        o.items.forEach(it => {
          if (!soldMap[it.name]) soldMap[it.name] = { name: it.name, qty: 0, total: 0 };
          soldMap[it.name].qty += it.qty;
          soldMap[it.name].total += it.price * it.qty;
        });
      });
      const soldProducts = Object.values(soldMap).sort((a, b) => b.qty - a.qty);
      const pendingOrders = db.openOrders.map(o => ({
        id: o.id,
        customerName: o.customerName,
        orderType: o.orderType,
        total: o.total
      }));
      const pendingTotal = pendingOrders.reduce((s, o) => s + o.total, 0);

      const closedShift = {
        ...m.shift,
        closedAt: new Date().toTimeString().slice(0, 5),
        cashSales: m.cashSales,
        qrisSales: m.qrisSales,
        transferSales: m.transferSales,
        cashCount: m.todaySales.filter(o => o.paymentMethod === 'Cash').length,
        qrisCount: m.todaySales.filter(o => o.paymentMethod === 'QRIS').length,
        transferCount: m.todaySales.filter(o => o.paymentMethod === 'Transfer').length,
        cashIn: m.cashIn,
        cashOut: m.cashOut,
        expectedCash: m.expectedCash,
        actualCash,
        variance: actualCash - m.expectedCash,
        soldProducts,
        pendingOrders,
        pendingTotal,
        status: 'Tutup Kasir'
      };

      const soldLines = soldProducts.length > 0
        ? soldProducts.map(p => `• ${p.name} (${p.qty}x) = ${formatRp(p.total)}`).join('\n')
        : '• Tidak ada produk terjual';

      const pendingLines = pendingOrders.length > 0
        ? pendingOrders.map(p => `• ${p.id} - ${p.customerName} (${p.orderType}): ${formatRp(p.total)}`).join('\n')
        : '• Tidak ada transaksi tertunda';

      const waText = [
        `*LAPORAN TUTUP KASIR — ${db.outletInfo.name}*`,
        `Outlet: ${closedShift.outlet}`,
        `Tanggal: ${closedShift.date} (${closedShift.openedAt} - ${closedShift.closedAt})`,
        `Kasir Bertugas: ${closedShift.cashierName}`,
        `--------------------------------`,
        `*RINGKASAN PEMBAYARAN*`,
        `Modal Awal Laci: ${formatRp(closedShift.openingCash)}`,
        `Pembayaran Cash (${closedShift.cashCount}x): ${formatRp(closedShift.cashSales)}`,
        `Pembayaran QRIS (${closedShift.qrisCount}x): ${formatRp(closedShift.qrisSales)}`,
        `Pembayaran Transfer (${closedShift.transferCount}x): ${formatRp(closedShift.transferSales)}`,
        `Total Omzet Lunas: ${formatRp(m.totalSales)}`,
        `Kas Masuk / Keluar: +${formatRp(closedShift.cashIn)} / -${formatRp(closedShift.cashOut)}`,
        `--------------------------------`,
        `*REKONSILIASI LACI TUNAI*`,
        `Ekspektasi Cash Laci: ${formatRp(closedShift.expectedCash)}`,
        `Aktual Cash Fisik: ${formatRp(closedShift.actualCash)}`,
        `Selisih Cash: ${formatRp(closedShift.variance)}`,
        `--------------------------------`,
        `*TRANSAKSI TERTUNDA (${pendingOrders.length} Order — ${formatRp(pendingTotal)})*`,
        pendingLines,
        `--------------------------------`,
        `*LIST PRODUK TERJUAL*`,
        soldLines
      ].join('\n');

      db.shifts.unshift(closedShift);
      db.activeShift = null;
      ui.closingActualCash = '';
      ui.closingStaffPin = '';
      ui.closingPinError = '';
      saveState();
      syncToGoogleSheets('CLOSE_SHIFT', closedShift);

      if (actionAfter === 'wa') {
        window.open(`https://wa.me/?text=${encodeURIComponent(waText)}`, '_blank');
      } else if (actionAfter === 'print') {
        ui.receiptModalData = {
          title: 'Laporan Tutup Kasir Harian',
          isProforma: false,
          isClosingSummary: true,
          closingData: closedShift
        };
        render();
        setTimeout(() => window.triggerThermalPrint(), 250);
        return;
      }

      showToast('Tutup Kasir berhasil disimpan!');
      ui.currentUser = null;
      ui.screen = 'login';
      render();
    };

        ui.kasirReportStart = getTodayStr(-new Date().getDay() - 7); ui.kasirReportEnd = getTodayStr(-new Date().getDay() - 1);

        itemName: item.name,
        qty: diff,

    window.submitInventoryMutasiOrWaste = function(type) {
      const prefix = type === 'Terima Mutasi' ? 'mut' : 'wst';
      const itemId = document.getElementById(`${prefix}-item-id`).value;
      const rawQty = Number(document.getElementById(`${prefix}-qty`).value);
      const note = document.getElementById(`${prefix}-note`).value.trim();

      const item = db.inventory.find(i => i.id === itemId);
      if (!item || !rawQty || rawQty <= 0) {
        showToast('Pilih bahan dan masukkan jumlah kuantitas yang valid!', 'error');
        return;
      }

      const delta = type === 'Terima Mutasi' ? rawQty : -Math.abs(rawQty);
      item.stock = Math.max(0, item.stock + delta);
      db.inventoryLogs.unshift({
        id: 'LOG-' + Date.now().toString().slice(-4),
        date: getTodayStr(0),
        type,
        itemName: item.name,
        qty: delta,
        unit: item.unit,
        note: note || type,
        pic: ui.currentUser.name
      });
      saveState();
      showToast(`${type} untuk ${item.name} berhasil dicatat!`);
      render();
    };

    function renderKasirKeluarTab() {
      const m = getActiveShiftMetrics();
      const actualNum = parseFormattedNumber(ui.closingActualCash);

      const cashCount = m.todaySales.filter(o => o.paymentMethod === 'Cash').length;

          soldMap[it.name].qty += it.qty;

    function getFilteredSettingsProducts() {
      const q = ui.settingsProdSearch.trim().toLowerCase();
      return db.products.filter(p => {
        const matchCat = ui.settingsProdCategory === 'Semua Kategori' || p.category === ui.settingsProdCategory;
        if (!matchCat) return false;
        if (!q) return true;
        return p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
      });
    }

    function buildCompactProductTableHtml() {
      const filteredProds = getFilteredSettingsProducts();
      const totalItems = filteredProds.length;
      const pageSize = Number(ui.settingsProdPageSize) || 10;
      const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
      if (ui.settingsProdPage > totalPages) ui.settingsProdPage = totalPages;
      if (ui.settingsProdPage < 1) ui.settingsProdPage = 1;

      const startIdx = (ui.settingsProdPage - 1) * pageSize;
      const pageItems = filteredProds.slice(startIdx, startIdx + pageSize);
      const showFrom = totalItems === 0 ? 0 : startIdx + 1;
      const showTo = Math.min(totalItems, startIdx + pageSize);

      const rowsHtml = pageItems.length === 0
        ? `<tr><td colspan="6" class="text-center text-muted" style="padding:24px;">Produk tidak ditemukan pada filter saat ini.</td></tr>`
        : pageItems.map(p => `
            <tr onclick="openEditProductModal('${p.id}')" style="cursor:pointer;">
              <td class="font-mono font-bold nowrap">${escapeHtml(p.sku)}</td>
              <td class="font-bold">
                ${escapeHtml(p.name)}
                ${p.isFavorite ? '<span class="badge badge-yellow" style="padding:1px 6px;font-size:10px;margin-left:4px;">★</span>' : ''}
              </td>
              <td class="nowrap"><span class="badge badge-green" style="padding:2px 8px;font-size:10.5px;">${escapeHtml(p.category)}</span></td>
              <td class="font-extrabold nowrap">${formatRp(p.price)}</td>
              <td class="nowrap font-semibold">${p.stock !== undefined ? p.stock : '-'}</td>
              <td class="nowrap text-muted">${escapeHtml(p.unit)}</td>
            </tr>
          `).join('');

      return `
        <div class="table-wrap table-wrap-compact">
          <table class="table-compact">
            <thead>
              <tr>
                <th class="nowrap">SKU</th>
                <th>Nama Produk</th>
                <th class="nowrap">Kategori</th>
                <th class="nowrap">Harga Jual</th>
                <th class="nowrap">Stok</th>
                <th class="nowrap">Satuan</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 mt-3 pt-2" style="border-top:1px solid var(--border);">
          <div class="text-xs text-muted">
            Menampilkan <strong>${showFrom}–${showTo}</strong> dari <strong>${totalItems}</strong> produk
          </div>
          <div class="flex items-center gap-1">
            <button type="button" onclick="changeSettingsProdPage(${ui.settingsProdPage - 1})" class="btn btn-sm btn-outline" ${ui.settingsProdPage <= 1 ? 'disabled style="opacity:0.45;pointer-events:none;padding:5px 10px;"' : 'style="padding:5px 10px;"'}>
              ‹ Sebelumnya
            </button>
            <span class="badge badge-dark" style="padding:5px 10px;">Hal ${ui.settingsProdPage} / ${totalPages}</span>
            <button type="button" onclick="changeSettingsProdPage(${ui.settingsProdPage + 1})" class="btn btn-sm btn-outline" ${ui.settingsProdPage >= totalPages ? 'disabled style="opacity:0.45;pointer-events:none;padding:5px 10px;"' : 'style="padding:5px 10px;"'}>
              Berikutnya ›
            </button>
          </div>
        </div>
      `;
    }

    function renderReportTop10() {
      const topTypes = [
        { id: 'produk_terlaris', label: 'Produk Terlaris' },
        { id: 'laba_kotor', label: 'Laba Kotor' },
        { id: 'stok_terendah', label: 'Stok Terendah' },
        { id: 'stok_minimum', label: 'Stok Minimum' },
        { id: 'komisi_produk', label: 'Komisi Produk' },
        { id: 'komisi_transaksi', label: 'Komisi Transaksi' },
        { id: 'jenis_order', label: 'Jenis Order' }
      ];

      const validOrders = db.completedOrders.filter(o => o.status === 'Selesai');
      const prodMap = {};
      validOrders.forEach(o => {
        o.items.forEach(it => {
          if (!prodMap[it.name]) {
            prodMap[it.name] = { name: it.name, qty: 0, revenue: 0, profit: 0, commission: 0 };
          }
          prodMap[it.name].qty += it.qty;
          prodMap[it.name].revenue += it.price * it.qty;
          prodMap[it.name].profit += (it.price - (it.hpp || 0)) * it.qty;
          prodMap[it.name].commission += (it.commission || 0) * it.qty;
        });
      });
      const prodList = Object.values(prodMap);

      let headHtml = '';
      let bodyHtml = '';

      if (ui.ownerTopReportType === 'produk_terlaris') {
        const sorted = [...prodList].sort((a, b) => b.qty - a.qty).slice(0, 10);
        headHtml = '<th>Nama Produk</th><th>Qty Terjual</th><th>Total Omzet</th>';
        bodyHtml = sorted.map(r => `<tr><td class="font-bold">${escapeHtml(r.name)}</td><td class="font-extrabold">${r.qty}</td><td>${formatRp(r.revenue)}</td></tr>`).join('');
      } else if (ui.ownerTopReportType === 'laba_kotor') {
        const sorted = [...prodList].sort((a, b) => b.profit - a.profit).slice(0, 10);
        headHtml = '<th>Nama Produk</th><th>Qty</th><th>Laba Kotor</th>';
        bodyHtml = sorted.map(r => `<tr><td class="font-bold">${escapeHtml(r.name)}</td><td>${r.qty}</td><td class="font-extrabold" style="color:var(--green-700);">${formatRp(r.profit)}</td></tr>`).join('');
      } else if (ui.ownerTopReportType === 'stok_terendah') {
        const sorted = [...db.inventory].sort((a, b) => a.stock - b.stock).slice(0, 10);
        headHtml = '<th>Bahan / Item Gudang</th><th>Sisa Stok</th><th>Minimum Stok</th>';
        bodyHtml = sorted.map(r => `<tr><td class="font-bold">${escapeHtml(r.name)}</td><td class="font-extrabold">${r.stock} ${escapeHtml(r.unit)}</td><td>${r.minStock} ${escapeHtml(r.unit)}</td></tr>`).join('');
      } else if (ui.ownerTopReportType === 'stok_minimum') {
        const below = db.inventory.filter(i => i.stock <= i.minStock).slice(0, 10);
        headHtml = '<th>SKU</th><th>Bahan / Item</th><th>Stok Aktual</th><th>Minimum</th><th>Status</th>';
        bodyHtml = below.length === 0
          ? '<tr><td colspan="5" class="text-center font-bold" style="padding:24px;">Semua stok aman di atas batas minimum!</td></tr>'
          : below.map(r => `<tr><td class="font-mono">${escapeHtml(r.sku)}</td><td class="font-bold">${escapeHtml(r.name)}</td><td class="font-extrabold" style="color:var(--pink-600);">${r.stock} ${escapeHtml(r.unit)}</td><td>${r.minStock} ${escapeHtml(r.unit)}</td><td><span class="badge badge-pink-solid">RESTOCK</span></td></tr>`).join('');
      } else if (ui.ownerTopReportType === 'komisi_produk') {
        const sorted = [...prodList].filter(p => p.commission > 0).sort((a, b) => b.commission - a.commission).slice(0, 10);
        headHtml = '<th>Nama Produk</th><th>Qty Terjual</th><th>Total Komisi Produk</th>';
        bodyHtml = sorted.map(r => `<tr><td class="font-bold">${escapeHtml(r.name)}</td><td>${r.qty}</td><td class="font-extrabold">${formatRp(r.commission)}</td></tr>`).join('');
      } else if (ui.ownerTopReportType === 'komisi_transaksi') {
        const staffMap = {};
        validOrders.forEach(o => {
          if (!staffMap[o.cashierName]) staffMap[o.cashierName] = { name: o.cashierName, count: 0, total: 0 };
          staffMap[o.cashierName].count += 1;
          staffMap[o.cashierName].total += (o.commissionTotal || 0);
        });
        const sorted = Object.values(staffMap).sort((a, b) => b.total - a.total).slice(0, 10);
        headHtml = '<th>Nama Pegawai</th><th>Jumlah Transaksi</th><th>Total Komisi Transaksi</th>';
        bodyHtml = sorted.map(r => `<tr><td class="font-bold">${escapeHtml(r.name)}</td><td>${r.count} Struk</td><td class="font-extrabold">${formatRp(r.total)}</td></tr>`).join('');
      } else if (ui.ownerTopReportType === 'jenis_order') {
        const typeMap = {};
        validOrders.forEach(o => {
          if (!typeMap[o.orderType]) typeMap[o.orderType] = { type: o.orderType, count: 0, total: 0 };
          typeMap[o.orderType].count += 1;
          typeMap[o.orderType].total += o.total;
        });
        const sorted = Object.values(typeMap).sort((a, b) => b.total - a.total).slice(0, 10);
        headHtml = '<th>Jenis Order</th><th>Jumlah Order</th><th>Total Omzet</th>';
        bodyHtml = sorted.map(r => `<tr><td class="font-bold">${escapeHtml(r.type)}</td><td>${r.count} Order</td><td class="font-extrabold">${formatRp(r.total)}</td></tr>`).join('');
      }

      return `
        <div>
          <div class="flex flex-wrap gap-2 mb-4">
            ${topTypes.map(tt => `
              <button type="button" onclick="ui.ownerTopReportType='${tt.id}'; render();" class="btn btn-sm ${ui.ownerTopReportType === tt.id ? 'btn-yellow' : 'btn-outline'}">
                ${tt.label}
              </button>
            `).join('')}
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>${headHtml}</tr></thead>
              <tbody>${bodyHtml || '<tr><td colspan="3" class="text-center text-muted" style="padding:24px;">Belum ada data transaksi.</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    ]);
