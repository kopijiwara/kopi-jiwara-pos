<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background-color: #0B2E23;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }
    .login-select option {
      background-color: #0B2E23;
      color: #FFFFFF;
      font-weight: 700;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-sync-pill.offline {
      border-color: var(--pink);
      color: #FBCFE8;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }
    .live-sync-pill.offline .live-dot {
      background: var(--pink);
      box-shadow: 0 0 6px var(--pink);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* CRM SUGGESTION DROPDOWN */
    .crm-suggest-box {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #FFFFFF;
      border: 1.5px solid var(--green-deep);
      border-radius: 14px;
      box-shadow: var(--shadow-float);
      z-index: 60;
      max-height: 170px;
      overflow-y: auto;
    }
    .crm-suggest-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .crm-suggest-item:last-child { border-bottom: none; }
    .crm-suggest-item:hover { background: var(--green-soft); }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .prod-card > * {
      pointer-events: none;
    }
    .prod-card:active {
      transform: scale(0.97);
      border-color: var(--green-deep);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

  <div id="toastWrap" class="toast-wrap hidden">
    <div id="toastBox" class="toast-box"></div>
  </div>

  <div id="printArea" class="hidden"></div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="login-bg">
    <div class="login-glass-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
        <div>
          <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="badge-chip-yellow">POS & ERP</span>
            <span class="badge-chip-pink">Jiwara Ecosystem</span>
          </div>
          <div style="font-size:22px;font-weight:900;letter-spacing:-0.02em;color:#FFFFFF;">KOPI JIWARA</div>

    function renderJiwaraPngIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#093814';
      ctx.fillRect(0, 0, size, size);
      const s = size / 100;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#093814';
      ctx.lineWidth = 5.8 * s;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(33 * s, 53 * s);
      ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
      ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
      ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
      ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
      ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
      ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
      ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
      ctx.stroke();
      return c.toDataURL('image/png');
    }

          const swCode = `
            const CACHE_NAME = 'kopi-jiwara-offline-v20';
            const APP_URL = ${JSON.stringify(startUrl)};
            self.addEventListener('install', function(e) {
              e.waitUntil(
                caches.open(CACHE_NAME).then(function(cache) {
                  return cache.addAll([APP_URL, './']).catch(function() {});
                })
              );
              self.skipWaiting();
            });
            self.addEventListener('activate', function(e) {
              e.waitUntil(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.filter(function(k) { return k !== CACHE_NAME; }).map(function(k) { return caches.delete(k); }));
                }).then(function() { return self.clients.claim(); })
              );
            });
            self.addEventListener('fetch', function(e) {
              if (e.request.method !== 'GET') return;
              if (e.request.url.includes('script.google.com')) return;
              e.respondWith(
                fetch(e.request).then(function(res) {
                  if (res && res.status === 200) {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, copy); });
                  }
                  return res;
                }).catch(function() {
                  return caches.match(e.request).then(function(cached) {
                    return cached || caches.match(APP_URL) || caches.match('./');
                  });
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});

    function normalizeCloudDate(rawVal) {
      if (!rawVal) return todayISO();
      const s = String(rawVal).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;

      return s.slice(0, 10);

        (!isNaN(Number(p.brand)) && String(p.brand).trim() !== '')
      );
      if (looksCorrupted) return [...seedProds];
      const fixed = prods.map((p, idx) => ({
        id: p.id || ('PRD-' + (idx + 1)),
        sku: String(p.sku || ('SKU-' + (idx + 1))).trim(),
        name: String(p.name || 'Menu').trim(),

      if (fixed.filter(p => p.active).length === 0) {
        fixed.forEach(p => { p.active = true; });
      }
      return fixed;
    }

          localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));

        const parsed = JSON.parse(raw);

          ...seed,
          ...parsed,
          settings: { ...seed.settings, ...(parsed.settings || {}) },
          shift: { ...seed.shift, ...(parsed.shift || {}) }

        }
        if (!merged.settings.webhookUrl && DEFAULT_CLOUD_WEBHOOK_URL) {
          merged.settings.webhookUrl = DEFAULT_CLOUD_WEBHOOK_URL;
        }
        if (!Array.isArray(merged.staff) || merged.staff.filter(s => s && s.active !== false).length === 0) {
          merged.staff = [...seed.staff];

        merged.products = sanitizeCorruptedProducts(merged.products, seed.products);
        const prodCats = merged.products.map(p => p.category).filter(Boolean);
        merged.categories = normalizeUniqueCategories([...(merged.categories || seed.categories), ...prodCats]);
        if (!Array.isArray(merged.brands) || merged.brands.length === 0) {
          merged.brands = [...DEFAULT_BRAND_LIST];
        }
        return merged;
      } catch (e) {
        return createCleanSeedDB();
      }
    }

      }

    function syncMasterEvent(eventType, payloadObj) {
      markLocalMutation();
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      const envelope = {
        eventType,
        timestamp: new Date().toISOString(),
        outlet: db.settings.outletName,
        user: currentUser ? currentUser.name : 'System',
        data: payloadObj
      };
      if (!url || !navigator.onLine) {
        db.offlineQueue.push(envelope);
        saveDB();
        return;
      }
      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(envelope)
      }).catch(() => {
        db.offlineQueue.push(envelope);
        saveDB();
      });
    }

    function flushOfflineQueue(silent = false) {
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      if (!url) {
        if (!silent) showToast('URL Google Apps Script belum diatur di Pengaturan.', true);
        return;
      }
      if (!navigator.onLine) {
        if (!silent) showToast('Perangkat sedang offline.', true);
        return;
      }
      if (db.offlineQueue.length === 0) {
        if (!silent) showToast('Tidak ada antrean tertunda. Semua sudah tersinkron!');
        return;
      }
      const pending = [...db.offlineQueue];
      db.offlineQueue = [];
      saveDB();
      pending.forEach(item => {
        fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          keepalive: true,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(item)
        }).catch(() => {
          db.offlineQueue.push(item);
          saveDB();
        });
      });
      if (!silent) showToast(`${pending.length} data antrean dikirim ke Google Sheets!`);
    }

    function autoSyncMasterSlices(slices) {
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      if (!url) return;
      const payload = { syncedAt: new Date().toISOString() };
      if (slices.includes('products')) payload.products = db.products;
      if (slices.includes('categories')) {

        payload.brands = getActiveBrands();

      if (slices.includes('inventory')) payload.inventory = db.inventory;

      if (slices.includes('customers')) payload.customers = db.customers;

      syncMasterEvent('SYNC_MASTER_SNAPSHOT', payload);

    function pushAllLocalTransactionsToCloud() {
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      if (!url) return showToast('URL Google Apps Script belum diatur di Pengaturan.', true);
      if (!db.transactions || db.transactions.length === 0) {
        return showToast('Tidak ada transaksi lokal di perangkat ini.');
      }
      let sent = 0;
      db.transactions.forEach(t => {
        if (t.status === 'PAID') {
          syncMasterEvent('POS_TRANSACTION_PAID', t);
          sent++;
        } else if (t.status === 'CANCELLED') {
          syncMasterEvent('PAID_TRX_CANCELLED', { id: t.id, reason: t.voidReason || 'Dibatalkan', voidBy: t.voidBy || 'Owner' });
        }
      });
      showToast(`${sent} transaksi lokal dikirim ulang ke Google Sheets (Anti-Duplikat aktif)!`);
    }

    function isUserActivelyTyping() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    async function pullFromCloudMaster(manualTrigger = false) {
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      if (!url) {
        updateSyncBadgeUI('offline', 'Belum Sync');
        if (manualTrigger) showToast('URL Google Apps Script belum diatur.', true);
        return;
      }
      if (!navigator.onLine) {
        updateSyncBadgeUI('offline', 'Offline');
        if (manualTrigger) showToast('Perangkat sedang offline.', true);
        return;
      }
      if (isCloudPulling) return;
      if (!manualTrigger && (Date.now() - lastLocalMutationAt) < 5500) return;
      if (!manualTrigger && isUserActivelyTyping()) return;
      if (!manualTrigger && !document.getElementById('modalBackdrop').classList.contains('hidden')) return;

      isCloudPulling = true;
      updateSyncBadgeUI('syncing', 'Menyinkron...');
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=pull&t=${Date.now()}`, { method: 'GET', cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const cloud = await res.json();
        if (cloud && cloud.status === 'ok') {
          applyCloudPullData(cloud);
          lastCloudSyncTime = nowTimeStr();
          updateSyncBadgeUI('online', `Live • ${lastCloudSyncTime}`);
          if (manualTrigger) showToast('Data MASTER_MENU & database berhasil disinkronkan!');
        } else {
          updateSyncBadgeUI('online', lastCloudSyncTime ? `Live • ${lastCloudSyncTime}` : 'Live Sync');
          if (manualTrigger) showToast('Gunakan Skrip Google Sheets v3.0 agar 2-Way Sync aktif.', true);
        }
      } catch (err) {
        updateSyncBadgeUI('offline', 'Gagal Sync');
        if (manualTrigger) showToast('Gagal menarik data Cloud. Cek izin deploy Web App (Anyone).', true);
      } finally {
        isCloudPulling = false;
      }
    }

    function normalizePulledProductRow(cp, idx, existingMap) {
      let sku = String(cp.sku || '').trim();
      let name = String(cp.name || '').trim();
      let category = String(cp.category || '').trim();
      let brand = String(cp.brand || '').trim();
      let price = Number(cp.price);
      let cost = Number(cp.cost);
      let stock = Number(cp.stock);
      let favRaw = cp.isFavorite;
      let actRaw = cp.active;
      let commRaw = cp.includeCommissionShare;
      let salRaw = cp.includeSalaryShare;

      if (/^\d{4}-\d{2}-\d{2}T/.test(sku) || (!isNaN(Number(brand)) && brand !== '' && Number(brand) >= 1000)) {
        const shiftedSku = name;
        const shiftedName = category;
        const shiftedCat = brand;
        const shiftedBrand = String(cp.price || 'Kopi Jiwara').trim();
        const shiftedPrice = Number(cp.cost) || 0;
        const shiftedCost = Number(cp.stock) || 0;
        const shiftedStock = Number(cp.isFavorite) || 0;
        const shiftedFav = cp.active;
        const shiftedAct = cp.includeCommissionShare;
        const shiftedComm = cp.includeSalaryShare;

        sku = shiftedSku || ('SKU-' + (idx + 1));
        name = shiftedName || 'Menu';
        category = shiftedCat || 'Kopi Jiwara';
        brand = shiftedBrand || 'Kopi Jiwara';
        price = shiftedPrice;
        cost = shiftedCost;
        stock = shiftedStock;
        favRaw = shiftedFav;
        actRaw = shiftedAct;
        commRaw = shiftedComm;
        salRaw = true;
      }

      if (!sku) sku = 'SKU-' + (idx + 1);
      if (!name) name = 'Menu';
      if (!category || category === '-' || /^\d+$/.test(category)) category = 'Kopi Jiwara';
      if (!brand || brand === '-' || /^\d+$/.test(brand)) brand = 'Kopi Jiwara';

      const prev = existingMap.get(sku);
      const isFavBool = favRaw === true || ['ya', 'true', 'yes', '1'].includes(String(favRaw || '').trim().toLowerCase());
      const actStr = String(actRaw === undefined || actRaw === null ? 'aktif' : actRaw).trim().toLowerCase();
      const isActiveBool = actRaw !== false && !['nonaktif', 'tidak', 'false', '0'].includes(actStr);
      const isCommBool = commRaw !== false && !['tidak', 'nonaktif', 'false', '0'].includes(String(commRaw || 'ya').trim().toLowerCase());
      const isSalBool = salRaw !== false && !['tidak', 'nonaktif', 'false', '0'].includes(String(salRaw || 'ya').trim().toLowerCase());

      return {
        id: prev ? prev.id : ('PRD-C-' + (idx + 1)),
        sku: sku,
        name: name,
        category: category,
        brand: brand,
        price: isNaN(price) ? 0 : price,
        cost: isNaN(cost) ? 0 : cost,
        stock: isNaN(stock) ? 0 : stock,
        isFavorite: isFavBool,
        active: isActiveBool,
        includeCommissionShare: isCommBool,
        includeSalaryShare: isSalBool
      };
    }

    function applyCloudPullData(cloud) {
      let changed = false;

      if (cloud.outletProfile && typeof cloud.outletProfile === 'object') {
        const op = cloud.outletProfile;
        if (op.outletName && op.outletName !== db.settings.outletName) { db.settings.outletName = op.outletName; changed = true; }
        if (op.outletAddress && op.outletAddress !== db.settings.outletAddress) { db.settings.outletAddress = op.outletAddress; changed = true; }
        if (op.outletPhone !== undefined && op.outletPhone !== db.settings.outletPhone) { db.settings.outletPhone = op.outletPhone; changed = true; }
        if (op.outletSocial !== undefined && op.outletSocial !== db.settings.outletSocial) { db.settings.outletSocial = op.outletSocial; changed = true; }
        if (op.receiptFooter && op.receiptFooter !== db.settings.receiptFooter) { db.settings.receiptFooter = op.receiptFooter; changed = true; }
      }

      if (Array.isArray(cloud.products) && cloud.products.length > 0) {
        const existingMap = new Map(db.products.map(p => [p.sku, p]));
        const nextProds = cloud.products.map((cp, idx) => normalizePulledProductRow(cp, idx, existingMap));
        if (nextProds.filter(p => p.active).length === 0) {
          nextProds.forEach(p => { p.active = true; });
        }
        if (JSON.stringify(nextProds) !== JSON.stringify(db.products)) {
          db.products = nextProds;
          changed = true;
        }
      }

      const productDerivedCats = db.products.map(p => p.category).filter(Boolean);
      if (Array.isArray(cloud.categories) && cloud.categories.length > 0) {
        const mergedCats = normalizeUniqueCategories([...cloud.categories, ...productDerivedCats]);
        if (JSON.stringify(mergedCats) !== JSON.stringify(db.categories)) {
          db.categories = mergedCats;
          changed = true;
        }
      } else if (productDerivedCats.length > 0) {
        const mergedCats = normalizeUniqueCategories([...db.categories, ...productDerivedCats]);
        if (JSON.stringify(mergedCats) !== JSON.stringify(db.categories)) {
          db.categories = mergedCats;
          changed = true;
        }
      }

      const productDerivedBrands = db.products.map(p => p.brand).filter(b => b && b !== '-' && isNaN(Number(b)));
      if (Array.isArray(cloud.brands) && cloud.brands.length > 0) {
        const cleanBrands = Array.from(new Set([...cloud.brands, ...productDerivedBrands].map(b => String(b || '').trim()).filter(b => b && b !== '-' && isNaN(Number(b)))));
        if (cleanBrands.length > 0 && JSON.stringify(cleanBrands) !== JSON.stringify(db.brands)) {
          db.brands = cleanBrands;
          changed = true;
        }
      } else if (productDerivedBrands.length > 0) {
        const cleanBrands = Array.from(new Set([...getActiveBrands(), ...productDerivedBrands]));
        if (JSON.stringify(cleanBrands) !== JSON.stringify(db.brands)) {
          db.brands = cleanBrands;
          changed = true;
        }
      }

      if (cloud.brandConfig && typeof cloud.brandConfig === 'object') {
        const mergedCfg = { ...db.brandConfig, ...cloud.brandConfig };
        if (JSON.stringify(mergedCfg) !== JSON.stringify(db.brandConfig)) {
          db.brandConfig = mergedCfg;
          changed = true;
        }
      }

      if (Array.isArray(cloud.inventory) && cloud.inventory.length > 0) {
        const existingInv = new Map(db.inventory.map(i => [i.code, i]));
        const nextInv = cloud.inventory.map((ci, idx) => {
          const prev = existingInv.get(ci.code);
          return {
            id: prev ? prev.id : ('INV-C-' + (idx + 1)),
            code: String(ci.code || ('BHN-' + (idx + 1))),
            name: String(ci.name || 'Bahan'),
            category: String(ci.category || 'Bahan Baku'),
            stock: Number(ci.stock) || 0,
            minStock: Number(ci.minStock) || 0,
            unit: String(ci.unit || 'pcs'),
            lastOpname: normalizeCloudDate(ci.lastOpname || todayISO())
          };
        });
        if (JSON.stringify(nextInv) !== JSON.stringify(db.inventory)) {
          db.inventory = nextInv;
          changed = true;
        }
      }

      if (Array.isArray(cloud.staff) && cloud.staff.length > 0) {
        const nextStaff = cloud.staff.map((cs, idx) => ({
          id: String(cs.id || ('STF-' + (idx + 1))),
          name: String(cs.name || 'Staf'),
          role: String(cs.role || 'Kasir & Barista'),
          pin: String(cs.pin || '1111').trim().padStart(4, '0'),
          dailyWage: Number(cs.dailyWage) || 0,
          active: cs.active !== false && String(cs.active).toLowerCase() !== 'nonaktif'
        }));
        if (nextStaff.filter(s => s.active).length > 0 && JSON.stringify(nextStaff) !== JSON.stringify(db.staff)) {
          db.staff = nextStaff;
          changed = true;
        }
      }

      if (Array.isArray(cloud.promos) && cloud.promos.length > 0) {
        const nextPromos = cloud.promos.map((cp, idx) => ({
          id: String(cp.id || ('PRM-C-' + (idx + 1))),
          code: String(cp.code || 'PROMO').trim().toUpperCase(),
          name: String(cp.name || 'Promo').trim(),
          type: String(cp.type || 'PERCENT').toUpperCase().includes('NOM') ? 'nominal' : 'percent',
          value: Number(cp.value) || 0,
          minOrder: Number(cp.minOrder) || 0,
          validUntil: (!cp.validUntil || String(cp.validUntil).trim() === '-') ? '' : normalizeCloudDate(cp.validUntil),
          active: cp.active !== false && String(cp.active).toLowerCase() !== 'nonaktif'
        }));
        if (JSON.stringify(nextPromos) !== JSON.stringify(db.promos)) {
          db.promos = nextPromos;
          changed = true;
        }
      }

      if (Array.isArray(cloud.customers) && cloud.customers.length > 0) {
        const nextCust = cloud.customers.map((cc, idx) => ({
          id: String(cc.id || ('CST-C-' + (idx + 1))),
          name: String(cc.name || 'Pelanggan'),
          phone: String(cc.phone || ''),
          tier: String(cc.tier || 'Regular'),
          visits: Number(cc.visits) || 0,
          totalSpend: Number(cc.totalSpend) || 0,
          specialVoucher: String(cc.specialVoucher || ''),
          voucherDiscount: Number(cc.voucherDiscount) || 0,
          voucherExpiry: normalizeCloudDate(cc.voucherExpiry || '2026-12-31')
        }));
        if (JSON.stringify(nextCust) !== JSON.stringify(db.customers)) {
          db.customers = nextCust;
          changed = true;
        }
      }

      if (Array.isArray(cloud.openOrders)) {
        const nextOpen = cloud.openOrders.map(co => ({
          id: String(co.id),
          date: normalizeCloudDate(co.date || todayISO()),
          time: String(co.time || '00:00'),
          orderType: String(co.orderType || 'Meja'),
          tableOrCustomer: String(co.tableOrCustomer || '-'),
          customerPhone: String(co.customerPhone || ''),
          cashier: String(co.cashier || 'Kasir'),
          items: Array.isArray(co.items) ? co.items : [],
          subtotal: Number(co.subtotal) || 0,
          discount: Number(co.discount) || 0,
          promoCode: String(co.promoCode || ''),
          total: Number(co.total) || 0
        }));
        if (JSON.stringify(nextOpen) !== JSON.stringify(db.openOrders)) {
          db.openOrders = nextOpen;
          changed = true;
        }
      }

      if (Array.isArray(cloud.transactions) && cloud.transactions.length > 0) {
        const localTrxMap = new Map(db.transactions.map(t => [t.id, t]));
        const itemsByTrx = new Map();
        if (Array.isArray(cloud.transactionItems)) {
          cloud.transactionItems.forEach(ci => {
            const tid = String(ci.trxId || '');
            if (!tid) return;
            if (!itemsByTrx.has(tid)) itemsByTrx.set(tid, []);
            const qty = Number(ci.qty) || 1;
            const totalHpp = Number(ci.totalHpp) || 0;
            itemsByTrx.get(tid).push({
              sku: String(ci.sku || '-'),
              name: String(ci.name || 'Menu'),
              category: String(ci.category || ''),
              brand: String(ci.brand || 'Kopi Jiwara'),
              includeCommissionShare: ci.includeCommissionShare !== false && String(ci.includeCommissionShare).toLowerCase() !== 'tidak',
              includeSalaryShare: ci.includeSalaryShare !== false && String(ci.includeSalaryShare).toLowerCase() !== 'tidak',
              qty: qty,
              price: Number(ci.price) || 0,
              cost: Number(ci.unitCost) || (qty > 0 ? Math.round(totalHpp / qty) : 0)
            });
          });
        }

        cloud.transactions.forEach(ct => {
          const cid = String(ct.id || '');
          if (!cid) return;
          const existing = localTrxMap.get(cid);
          const cloudStatus = String(ct.status || 'PAID').toUpperCase();
          const cloudItems = (Array.isArray(ct.items) && ct.items.length > 0) ? ct.items : itemsByTrx.get(cid);
          if (!existing) {
            localTrxMap.set(cid, {
              id: cid,
              date: normalizeCloudDate(ct.date || todayISO()),
              time: String(ct.time || '00:00'),
              orderType: String(ct.orderType || 'Meja'),
              tableOrCustomer: String(ct.tableOrCustomer || '-'),
              customerPhone: String(ct.customerPhone || ''),
              cashier: String(ct.cashier || 'Kasir'),
              items: (cloudItems && cloudItems.length > 0) ? cloudItems : [],
              subtotal: Number(ct.subtotal) || Number(ct.total) || 0,
              discount: Number(ct.discount) || 0,
              promoCode: ct.promoCode === '-' ? '' : String(ct.promoCode || ''),
              total: Number(ct.total) || 0,
              paymentMethod: String(ct.paymentMethod || 'Cash'),
              cashReceived: Number(ct.cashReceived) || Number(ct.total) || 0,
              changeAmount: Number(ct.changeAmount) || 0,
              status: cloudStatus === 'CANCELLED' ? 'CANCELLED' : 'PAID'
            });
            changed = true;
          } else {
            if (cloudStatus === 'CANCELLED' && existing.status !== 'CANCELLED') {
              existing.status = 'CANCELLED';
              changed = true;
            }
            if ((!existing.items || existing.items.length === 0) && cloudItems && cloudItems.length > 0) {
              existing.items = cloudItems;
              changed = true;
            }
          }
        });

        db.transactions = Array.from(localTrxMap.values()).sort((a, b) => {
          const da = `${a.date} ${a.time}`;
          const dbStr = `${b.date} ${b.time}`;
          return dbStr.localeCompare(da);
        });
      }

      if (Array.isArray(cloud.cashflow) && cloud.cashflow.length > 0) {
        const localCfIds = new Set(db.cashflow.map(c => c.id));
        cloud.cashflow.forEach(ccf => {
          const cfId = String(ccf.id || '');
          if (cfId && !localCfIds.has(cfId)) {
            db.cashflow.unshift({
              id: cfId,
              date: normalizeCloudDate(ccf.date || todayISO()),
              time: String(ccf.time || '00:00'),
              type: String(ccf.type || 'OUT') === 'IN' ? 'IN' : 'OUT',
              category: String(ccf.category || 'Operasional'),
              amount: Number(ccf.amount) || 0,
              note: String(ccf.note || ''),
              pic: String(ccf.pic || 'System')
            });
            changed = true;
          }
        });
      }

      if (Array.isArray(cloud.attendance) && cloud.attendance.length > 0) {
        const localAttMap = new Map(db.attendance.map(a => [`${normalizeCloudDate(a.date)}_${a.staffName}`, a]));
        cloud.attendance.forEach((ca, idx) => {
          const dStr = normalizeCloudDate(ca.date || todayISO());
          const sName = String(ca.staffName || '');
          const key = `${dStr}_${sName}`;
          if (!sName) return;
          const existing = localAttMap.get(key);
          if (!existing) {
            db.attendance.unshift({
              id: 'ATT-C-' + (idx + 1) + '-' + Date.now(),
              date: dStr,
              staffId: '',
              staffName: sName,
              role: String(ca.role || 'Staf'),
              clockIn: String(ca.clockIn || '-'),
              clockOut: String(ca.clockOut || '-'),
              wageEarned: Number(ca.wageEarned) || 0,
              status: String(ca.status || 'Hadir')
            });
            changed = true;
          } else if (existing.clockOut === '-' && ca.clockOut && String(ca.clockOut) !== '-') {
            existing.clockOut = String(ca.clockOut);
            changed = true;
          }
        });
      }

      if (Array.isArray(cloud.closingHistory) && cloud.closingHistory.length > 0) {
        const localClsIds = new Set(db.closingHistory.map(c => c.id));
        cloud.closingHistory.forEach(ccl => {
          const cid = String(ccl.id || '');
          if (cid && !localClsIds.has(cid)) {
            db.closingHistory.unshift({
              id: cid,
              date: normalizeCloudDate(ccl.date || todayISO()),
              time: String(ccl.time || '00:00'),
              cashier: String(ccl.cashier || 'Kasir'),
              openingCash: Number(ccl.openingCash) || 0,
              cashSales: Number(ccl.cashSales) || 0,
              qrisSales: Number(ccl.qrisSales) || 0,
              transferSales: Number(ccl.transferSales) || 0,
              onlineSales: Number(ccl.onlineSales) || 0,
              totalSales: Number(ccl.totalSales) || 0,
              expectedCash: Number(ccl.expectedCash) || 0,
              actualCash: Number(ccl.actualCash) || 0,
              diff: Number(ccl.diff) || 0
            });
            changed = true;
          }
        });
      }

      if (Array.isArray(cloud.auditLogs) && cloud.auditLogs.length > 0) {
        const localAudIds = new Set(db.auditLogs.map(a => a.id));
        cloud.auditLogs.forEach(cau => {
          const aid = String(cau.id || '');
          if (aid && !localAudIds.has(aid)) {
            db.auditLogs.unshift({
              id: aid,
              date: normalizeCloudDate(cau.date || todayISO()),
              time: String(cau.time || '00:00'),
              orderId: String(cau.orderId || '-'),
              itemName: String(cau.itemName || '-'),
              cashier: String(cau.cashier || '-'),
              authorizedBy: String(cau.authorizedBy || '-'),
              reason: String(cau.reason || '-')
            });
            changed = true;
          }
        });
      }

      if (Array.isArray(cloud.stockLogs) && cloud.stockLogs.length > 0) {
        const localLogIds = new Set(db.stockLogs.map(l => l.id));
        cloud.stockLogs.forEach(csl => {
          const lid = String(csl.id || '');
          if (lid && !localLogIds.has(lid)) {
            db.stockLogs.unshift({
              id: lid,
              date: normalizeCloudDate(csl.date || todayISO()),
              time: String(csl.time || '00:00'),
              itemName: String(csl.itemName || '-'),
              type: String(csl.type || '-'),
              qty: Number(csl.qty) || 0,
              afterStock: Number(csl.afterStock) || 0,
              pic: String(csl.pic || '-')
            });
            changed = true;
          }
        });
      }

      if (Array.isArray(cloud.brandSettlements) && cloud.brandSettlements.length > 0) {
        const localSetIds = new Set(db.brandSettlements.map(s => s.id));
        cloud.brandSettlements.forEach(cs => {
          const sid = String(cs.id || '');
          if (sid && !localSetIds.has(sid)) {
            db.brandSettlements.unshift({
              id: sid,
              date: normalizeCloudDate(cs.date || todayISO()),
              periodLabel: String(cs.periodLabel || ''),
              brand: String(cs.brand || ''),
              grossSales: Number(cs.grossSales) || 0,
              commissionPct: Number(cs.commissionPct) || 10,
              commissionCut: Number(cs.commissionCut) || 0,
              salaryCut: Number(cs.salaryCut) || 0,
              netTransfer: Number(cs.netTransfer) || 0,
              pic: String(cs.pic || 'Owner')
            });
            changed = true;
          }
        });
      }

      if (changed) {
        saveDB();
        if (currentUser) renderWorkspace();
        else renderLoginStaffDropdown();
      }
    }

    function startCloudAutoPullLoop() {
      if (cloudSyncTimer) clearInterval(cloudSyncTimer);
      const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
      if (!url) {
        updateSyncBadgeUI('offline', 'Belum Sync');
        return;
      }
      updateSyncBadgeUI('online', lastCloudSyncTime ? `Live • ${lastCloudSyncTime}` : 'Live Sync');
      if (db.settings.autoPullEnabled === false) return;
      const intervalMs = Math.max(10, Number(db.settings.autoPullIntervalSec) || 15) * 1000;
      cloudSyncTimer = setInterval(() => {
        if (navigator.onLine) pullFromCloudMaster(false);
      }, intervalMs);
    }

    window.addEventListener('online', () => {
      flushOfflineQueue(true);
      pullFromCloudMaster(false);
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && navigator.onLine) {
        flushOfflineQueue(true);
        pullFromCloudMaster(false);
      }
    });

    // ==================== LOGIN & SESSION ====================
    function renderLoginStaffDropdown() {
      const sel = document.getElementById('loginStaffSelect');
      if (!sel) return;
      const prevSelected = sel.value;
      let activeStaff = (db.staff || []).filter(s => s && s.active !== false);
      if (activeStaff.length === 0) {
        db.staff = createCleanSeedDB().staff;
        saveDB();
        activeStaff = db.staff;
      }
      sel.innerHTML = activeStaff.map(s =>
        `<option value="${esc(s.id)}">${esc(s.name)} • ${esc(s.role)}</option>`
      ).join('');
      if (prevSelected && activeStaff.some(s => s.id === prevSelected)) {
        sel.value = prevSelected;
      } else if (activeStaff.length > 0) {
        sel.value = activeStaff[0].id;
      }
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('#pinDots .pin-dot');
      dots.forEach((d, idx) => d.classList.toggle('filled', idx < pinBuffer.length));
    }

    function pressPin(digit) {
      if (pinBuffer.length >= 4) return;
      pinBuffer += digit;
      updatePinDots();
      if (pinBuffer.length === 4) {
        setTimeout(submitPinLogin, 120);
      }
    }

    function clearPinPad() {
      pinBuffer = '';
      updatePinDots();
    }

    function submitPinLogin() {
      const staffId = document.getElementById('loginStaffSelect').value;
      const staff = db.staff.find(s => s.id === staffId);
      if (!staff) return showToast('Pilih pegawai terlebih dahulu', true);
      const expectedPin = String(staff.pin || '').trim().padStart(4, '0');
      if (pinBuffer !== expectedPin) {
        clearPinPad();
        return showToast('PIN salah! Silakan coba lagi.', true);
      }
      currentUser = staff;
      sessionStorage.setItem(SESSION_KEY, staff.id);
      workspaceMode = (staff.role === 'Owner' || staff.role === 'Manager') ? 'owner' : 'kasir';
      activeTab = 'pos';
      clearPinPad();

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appWorkspace').classList.remove('hidden');
      renderWorkspace();
      startCloudAutoPullLoop();
      if (db.settings.webhookUrl) pullFromCloudMaster(false);
      showToast(`Selamat bertugas, ${staff.name}!`);
    }

    function checkExistingSession() {
      const savedId = sessionStorage.getItem(SESSION_KEY);
      if (!savedId) return;
      const staff = db.staff.find(s => s.id === savedId && s.active);
      if (staff) {
        currentUser = staff;
        workspaceMode = (staff.role === 'Owner' || staff.role === 'Manager') ? 'owner' : 'kasir';
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appWorkspace').classList.remove('hidden');
        renderWorkspace();
        startCloudAutoPullLoop();
        if (db.settings.webhookUrl) pullFromCloudMaster(false);
      }
    }

    function toggleWorkspaceMode() {
      workspaceMode = workspaceMode === 'kasir' ? 'owner' : 'kasir';

    }

    // ==================== TAB 1: POS / KASIR ====================
    function getPosTotals() {
      const subtotal = posCart.reduce((s, item) => s + (item.price * item.qty), 0);
      let promoDisc = 0;
      let appliedCode = '';
      if (posPromoSelection && posPromoSelection !== 'MANUAL' && posPromoSelection !== 'ONLINE') {
        if (posPromoSelection.startsWith('CRM:')) {
          const custId = posPromoSelection.slice(4);
          const cust = db.customers.find(c => c.id === custId);
          if (cust && cust.specialVoucher && cust.voucherDiscount > 0) {
            if (!cust.voucherExpiry || cust.voucherExpiry >= todayISO()) {
              promoDisc = Math.min(subtotal, cust.voucherDiscount);
              appliedCode = cust.specialVoucher;
            }
          }
        } else {
          const prm = db.promos.find(p => p.code === posPromoSelection && p.active);
          if (prm && subtotal >= prm.minOrder && (!prm.validUntil || prm.validUntil >= todayISO())) {
            promoDisc = prm.type === 'percent' ? Math.round(subtotal * prm.value / 100) : prm.value;
            appliedCode = prm.code;
          }
        }
      } else if (posPromoSelection === 'MANUAL' && posManualDiscount > 0) {
        appliedCode = 'POTONGAN MANUAL';
      } else if (posPromoSelection === 'ONLINE' && posOnlineDiscount > 0) {
        appliedCode = 'POTONGAN ONLINE';
      }
      const extraDisc = posPromoSelection === 'MANUAL'
        ? (Number(posManualDiscount) || 0)
        : (posPromoSelection === 'ONLINE' ? (Number(posOnlineDiscount) || 0) : 0);
      const totalDiscount = Math.min(subtotal, promoDisc + extraDisc);
      const grandTotal = Math.max(0, subtotal - totalDiscount);
      return { subtotal, totalDiscount, grandTotal, appliedCode };
    }

    function renderPosProductCardsHtml(filteredProds) {
      if (filteredProds.length === 0) {
        return `<div class="bento-card" style="grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:13px;">Menu tidak ditemukan pada kategori ini.</div>`;
      }
      return filteredProds.map(p => {
        const inCart = posCart.find(c => String(c.id) === String(p.id) || (p.sku && String(c.sku) === String(p.sku)));
        return `
          <div role="button" tabindex="0" data-prod-id="${esc(p.id)}" data-prod-sku="${esc(p.sku)}" class="prod-card ${inCart ? 'in-cart' : ''}">
            ${inCart ? `<span class="qty-badge">${inCart.qty}x</span>` : ''}
            <div>
              <div style="font-size:10px;font-weight:800;color:var(--text-muted);">${esc(p.sku)} • ${esc(p.brand)}</div>
              <div style="font-size:13px;font-weight:800;margin-top:3px;line-height:1.25;">${esc(p.name)}</div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
              <span style="font-size:13px;font-weight:900;color:var(--green-deep);">${formatRp(p.price)}</span>
              <span style="font-size:10px;color:var(--text-muted);">Stok ${p.stock}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPosProductGridOnly() {
      const grid = document.getElementById('posProductGrid');
      if (!grid) return;
      const filteredProds = db.products.filter(p => {
        if (p.active === false) return false;
        const matchSearch = !posSearch || p.name.toLowerCase().includes(posSearch.toLowerCase()) || p.sku.toLowerCase().includes(posSearch.toLowerCase());
        if (!matchSearch) return false;
        if (posCategory === 'Favorit') return p.isFavorite;
        return p.category === posCategory;
      });
      grid.innerHTML = renderPosProductCardsHtml(filteredProds);
    }

    function bindPosDelegatedEvents() {
      const catStrip = document.getElementById('posCatStrip');
      if (catStrip) {
        catStrip.onclick = function(e) {
          const btn = e.target.closest('[data-cat]');
          if (!btn) return;
          posCategory = btn.getAttribute('data-cat');
          renderWorkspace();
        };
      }
      const grid = document.getElementById('posProductGrid');
      if (grid) {
        grid.onclick = function(e) {
          const card = e.target.closest('[data-prod-id]');
          if (!card) return;
          const pid = card.getAttribute('data-prod-id');
          const psku = card.getAttribute('data-prod-sku');
          addToCart(pid, psku);
        };
      }
    }

    function handleCustomerNameTyping(val) {
      posTableCustomer = val;
      const box = document.getElementById('crmSuggestDropdown');
      if (!box) return;
      const q = val.trim().toLowerCase();
      if (q.length < 2) {
        box.classList.add('hidden');
        return;
      }
      const matches = db.customers.filter(c =>
        c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(q))
      ).slice(0, 5);
      if (matches.length === 0) {
        box.classList.add('hidden');
        return;
      }
      box.innerHTML = matches.map(c => `
        <div class="crm-suggest-item" onmousedown="selectCrmSuggestion('${esc(c.id)}')">
          <div><strong>${esc(c.name)}</strong> <span class="badge-pill badge-green">${esc(c.tier)}</span></div>
          <span style="font-size:11px;color:var(--text-muted);">${esc(c.phone || 'Tanpa WA')}</span>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function selectCrmSuggestion(custId) {
      const cust = db.customers.find(c => c.id === custId);
      if (!cust) return;
      posTableCustomer = cust.name;
      if (cust.phone) posCustomerPhone = cust.phone;
      if (cust.specialVoucher && cust.voucherDiscount > 0 && (!cust.voucherExpiry || cust.voucherExpiry >= todayISO())) {
        posPromoSelection = 'CRM:' + cust.id;
      }
      renderWorkspace();
      showToast(`Pelanggan CRM dipilih: ${cust.name}`);
    }

    function handlePosPromoSelect(val) {
      posPromoSelection = val;
      if (val !== 'MANUAL') posManualDiscount = 0;
      if (val !== 'ONLINE') posOnlineDiscount = 0;
      renderWorkspace();
    }

    function openCashierShift() {
      const val = Number(document.getElementById('openingCashInput').value) || 0;
      db.shift = {
        isOpen: true,
        openedBy: currentUser.name,
        openedAt: `${todayISO()} ${nowTimeStr()}`,

      };
      saveDB();
      renderWorkspace();
      showToast(`Shift dibuka dengan modal ${formatRp(val)}`);
    }

    function addToCart(prodId, prodSku) {
      const prod = db.products.find(p =>
        String(p.id) === String(prodId) || (prodSku && String(p.sku) === String(prodSku))
      );
      if (!prod) return;
      const existing = posCart.find(c => String(c.id) === String(prod.id) || (prod.sku && String(c.sku) === String(prod.sku)));
      if (existing) {
        existing.qty += 1;
      } else {
        posCart.push({
          id: prod.id,
          sku: prod.sku,
          name: prod.name,
          category: prod.category || '',
          brand: prod.brand,
          price: prod.price,
          cost: prod.cost,
          includeCommissionShare: prod.includeCommissionShare !== false,
          includeSalaryShare: prod.includeSalaryShare !== false,
          qty: 1
        });
      }
      renderWorkspace();
      showToast(`+1 ${prod.name}`);
    }

    function changeCartQty(idx, delta) {
      const item = posCart[idx];
      if (!item) return;
      if (delta < 0 && editingOpenOrderId) {
        requestOwnerPinForItemReduction(idx);
        return;
      }
      item.qty += delta;
      if (item.qty <= 0) posCart.splice(idx, 1);
      renderWorkspace();
    }

    function requestOwnerPinForItemReduction(idx) {
      const item = posCart[idx];
      openModal(`
        <div class="modal-head">
          <h3 style="margin:0;font-size:16px;">Otorisasi Pengurangan Open Order</h3>
          <button class="close-circle" onclick="closeModal()">x</button>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
          Mengurangi atau menghapus <strong>${esc(item.name)}</strong> dari Open Order membutuhkan persetujuan PIN Owner / Manager.
        </p>
        <div style="margin-bottom:10px;">
          <label class="field-label">Alasan Pengurangan</label>
          <input id="voidReasonInput" type="text" class="styled-input" placeholder="Contoh: Salah input / Pelanggan ganti menu" />
        </div>
        <div style="margin-bottom:14px;">
          <label class="field-label">PIN 4-Digit Owner / Manager</label>
          <input id="voidPinInput" type="password" maxlength="4" class="styled-input" placeholder="****" />
        </div>
        <button class="btn btn-pink" style="width:100%;" onclick="confirmAuthorizedItemReduction(${idx})">Verifikasi & Kurangi Item</button>
      `);
    }

    function confirmAuthorizedItemReduction(idx) {
      const reason = document.getElementById('voidReasonInput').value.trim() || 'Pengurangan Open Order';
      const pin = document.getElementById('voidPinInput').value.trim();
      const approver = db.staff.find(s => s.active && (s.role === 'Owner' || s.role === 'Manager') && String(s.pin) === pin);
      if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);

      const item = posCart[idx];
      const auditEntry = {
        id: 'AUD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderId: editingOpenOrderId,
        itemName: item.name,
        cashier: currentUser.name,
        authorizedBy: approver.name,
        reason
      };
      db.auditLogs.unshift(auditEntry);
      syncMasterEvent('AUDIT_VOID_ITEM', auditEntry);

      item.qty -= 1;
      if (item.qty <= 0) posCart.splice(idx, 1);
      saveDB();
      closeModal();
      renderWorkspace();
      showToast(`Item dikurangi (Otorisasi: ${approver.name})`);
    }

    function resetPosCart() {
      posCart = [];
      posTableCustomer = '';
      posCustomerPhone = '';
      posPromoSelection = '';
      posPromoCode = '';
      posManualDiscount = 0;
      posOnlineDiscount = 0;
      editingOpenOrderId = null;
      renderWorkspace();
    }

    function printProformaCartReceipt() {
      if (posCart.length === 0) return showToast('Keranjang masih kosong!', true);
      const { subtotal, totalDiscount, grandTotal, appliedCode } = getPosTotals();
      const draftOrder = {
        id: editingOpenOrderId || ('BILL-' + Date.now().toString().slice(-6)),
        date: todayISO(),
        time: nowTimeStr(),
        orderType: posOrderType,
        tableOrCustomer: posTableCustomer.trim() || '-',
        cashier: currentUser.name,
        items: JSON.parse(JSON.stringify(posCart)),
        subtotal,
        discount: totalDiscount,
        promoCode: appliedCode,
        total: grandTotal,
        paymentMethod: 'BELUM LUNAS (TAGIHAN)',
        isProforma: true
      };
      printReceipt(draftOrder);
    }

    function saveAsOpenOrder() {
      if (posCart.length === 0) return;
      const { subtotal, totalDiscount, grandTotal, appliedCode } = getPosTotals();
      const orderObj = {
        id: editingOpenOrderId || ('ORD-' + Date.now().toString().slice(-6)),
        date: todayISO(),
        time: nowTimeStr(),
        orderType: posOrderType,
        tableOrCustomer: posTableCustomer.trim() || 'Open Bill',
        customerPhone: posCustomerPhone.trim(),
        cashier: currentUser.name,
        items: JSON.parse(JSON.stringify(posCart)),
        subtotal,
        discount: totalDiscount,
        promoCode: appliedCode,
        total: grandTotal
      };

      if (editingOpenOrderId) {
        const idx = db.openOrders.findIndex(o => o.id === editingOpenOrderId);
        if (idx >= 0) db.openOrders[idx] = orderObj;
      } else {
        db.openOrders.unshift(orderObj);
      }

      saveDB();
      autoSyncMasterSlices(['openOrders']);
      resetPosCart();
      showToast('Open Order berhasil disimpan & disinkronkan!');
    }

    function loadOpenOrder(orderId) {
      const ord = db.openOrders.find(o => o.id === orderId);
      if (!ord) return;
      editingOpenOrderId = ord.id;
      posOrderType = ord.orderType;
      posTableCustomer = ord.tableOrCustomer === 'Open Bill' ? '' : ord.tableOrCustomer;
      posCustomerPhone = ord.customerPhone || '';
      posPromoSelection = ord.promoCode === 'POTONGAN MANUAL' ? 'MANUAL' : (ord.promoCode === 'POTONGAN ONLINE' ? 'ONLINE' : (ord.promoCode || ''));
      posPromoCode = ord.promoCode || '';
      posManualDiscount = ord.promoCode === 'POTONGAN MANUAL' ? (ord.discount || 0) : 0;
      posOnlineDiscount = ord.promoCode === 'POTONGAN ONLINE' ? (ord.discount || 0) : 0;
      posCart = JSON.parse(JSON.stringify(ord.items));
      renderWorkspace();
      showToast(`Memuat pesanan ${ord.tableOrCustomer}`);
    }

    // ==================== CHECKOUT MODAL (BAYAR PENUH & ITEMIZED SPLIT BILL) ====================
    let checkoutMode = 'full';
    let checkoutMethod = 'Cash';
    let checkoutCashReceived = 0;
    let splitSelectedQtys = {};

    function openCheckoutModal() {
      if (posCart.length === 0) return;
      const { grandTotal } = getPosTotals();
      checkoutMode = 'full';
      checkoutMethod = 'Cash';
      checkoutCashReceived = grandTotal;
      splitSelectedQtys = {};
      posCart.forEach((it, idx) => { splitSelectedQtys[idx] = 0; });
      renderCheckoutModalContent();
    }

    function adjustSplitItemQty(idx, delta) {
      const maxQty = posCart[idx] ? posCart[idx].qty : 0;
      const cur = Number(splitSelectedQtys[idx]) || 0;
      splitSelectedQtys[idx] = Math.max(0, Math.min(maxQty, cur + delta));
      renderCheckoutModalContent();
    }

    function renderCheckoutModalContent() {
      const { subtotal, totalDiscount, grandTotal } = getPosTotals();

      let activeItems = posCart;
      let activeTotal = grandTotal;
      let remainingOpenCount = 0;

      if (checkoutMode === 'split') {
        activeItems = posCart.map((it, idx) => ({
          ...it,
          qty: Number(splitSelectedQtys[idx]) || 0
        })).filter(it => it.qty > 0);
        const splitSub = activeItems.reduce((s, it) => s + (it.price * it.qty), 0);
        const propDisc = subtotal > 0 ? Math.round(totalDiscount * (splitSub / subtotal)) : 0;
        activeTotal = Math.max(0, splitSub - propDisc);
        remainingOpenCount = posCart.reduce((s, it, idx) => s + (it.qty - (Number(splitSelectedQtys[idx]) || 0)), 0);
      }

      if (checkoutMethod === 'Cash' && checkoutCashReceived < activeTotal) {
        checkoutCashReceived = activeTotal;
      }
      const change = Math.max(0, checkoutCashReceived - activeTotal);

      openModal(`
        <div class="modal-head">
          <div>
            <span style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Checkout Pembayaran</span>
            <h2 style="margin:2px 0 0;font-size:22px;">${formatRp(activeTotal)}</h2>
          </div>
          <button type="button" class="close-circle" onclick="closeModal()">x</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
          <button type="button" class="btn ${checkoutMode === 'full' ? 'btn-dark' : 'btn-soft'}" onclick="checkoutMode='full';renderCheckoutModalContent()">Bayar Penuh</button>
          <button type="button" class="btn ${checkoutMode === 'split' ? 'btn-pink' : 'btn-soft'}" onclick="checkoutMode='split';renderCheckoutModalContent()">Split Bill (Pilih Produk)</button>
        </div>

        ${checkoutMode === 'full' ? `
          <div style="background:#F8FAFC;border:1px solid var(--border-glass);border-radius:14px;padding:10px 12px;margin-bottom:12px;">
            <div style="font-size:11px;font-weight:800;color:var(--text-muted);margin-bottom:6px;">RINCIAN PRODUK YANG DIBAYAR (${posCart.reduce((s, i) => s + i.qty, 0)} ITEM)</div>
            ${posCart.map(it => `
              <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed rgba(11,46,35,0.08);">
                <span><strong>${esc(it.name)}</strong> x${it.qty}</span>
                <strong>${formatRp(it.price * it.qty)}</strong>
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="background:#FDF2F8;border:1.5px solid rgba(244,114,182,0.45);border-radius:16px;padding:12px;margin-bottom:12px;">
            <div style="font-size:11px;font-weight:800;color:#9D174D;margin-bottom:6px;">PILIH PRODUK YANG DIBAYAR SEKARANG (SISA JADI OPEN ORDER)</div>
            ${posCart.map((it, idx) => {
              const selQty = Number(splitSelectedQtys[idx]) || 0;
              return `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(157,23,77,0.18);">
                  <div style="min-width:0;flex:1;">
                    <div style="font-size:12px;font-weight:800;">${esc(it.name)}</div>
                    <div style="font-size:11px;color:var(--text-muted);">Pesanan: ${it.qty}x • ${formatRp(it.price)}/item</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;">
                    <button type="button" class="btn btn-soft btn-sm" style="width:28px;padding:4px 0;" onclick="adjustSplitItemQty(${idx}, -1)">-</button>
                    <span style="font-size:13px;font-weight:900;min-width:24px;text-align:center;">${selQty}/${it.qty}</span>
                    <button type="button" class="btn btn-dark btn-sm" style="width:28px;padding:4px 0;" onclick="adjustSplitItemQty(${idx}, 1)">+</button>
                  </div>
                </div>
              `;
            }).join('')}
            <div style="margin-top:8px;font-size:11px;font-weight:800;color:var(--green-deep);">
              Sisa belum dibayar: ${remainingOpenCount} item (otomatis tersimpan ke Order Aktif)
            </div>
          </div>
        `}

        <div style="margin-bottom:12px;">
          <label class="field-label">Metode Pembayaran</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            ${PAYMENT_METHODS.map(m => `
              <button type="button" class="btn ${checkoutMethod === m ? 'btn-yellow' : 'btn-soft'}" onclick="checkoutMethod='${m}';renderCheckoutModalContent()">${m}</button>
            `).join('')}
          </div>
        </div>

        ${checkoutMethod === 'Cash' ? `
          <div style="background:var(--green-soft);border-radius:16px;padding:12px;margin-bottom:14px;">
            <label class="field-label">Uang Tunai Diterima (Rp)</label>
            <input type="number" class="styled-input" value="${checkoutCashReceived}" oninput="checkoutCashReceived=Number(this.value)||0;document.getElementById('changeAmtText').textContent=formatRp(Math.max(0, checkoutCashReceived - ${activeTotal}))" />
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
              <button type="button" class="btn btn-soft btn-sm" onclick="checkoutCashReceived=${activeTotal};renderCheckoutModalContent()">Uang Pas</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="checkoutCashReceived=50000;renderCheckoutModalContent()">Rp 50.000</button>
              <button type="button" class="btn btn-soft btn-sm" onclick="checkoutCashReceived=100000;renderCheckoutModalContent()">Rp 100.000</button>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:15px;font-weight:900;">
              <span>Kembalian</span>
              <span id="changeAmtText" style="color:var(--green-deep);">${formatRp(change)}</span>
            </div>
          </div>
        ` : ''}

        <button type="button" class="btn btn-dark" style="width:100%;padding:13px;font-size:14px;" onclick="completeCheckoutPayment()" ${activeItems.length === 0 ? 'disabled' : ''}>
          Selesaikan Pembayaran
        </button>
      `);
    }

    function upsertCrmFromPos(custNameRaw, custPhoneRaw, trxTotal) {
      const cleanName = String(custNameRaw || '').trim();
      const cleanPhone = String(custPhoneRaw || '').trim();
      const isTableOnly = !cleanName || /^meja\s*\d*$/i.test(cleanName);
      if (isTableOnly && !cleanPhone) return null;

      let cust = null;
      if (cleanPhone) {
        cust = db.customers.find(c => c.phone && c.phone.replace(/\D/g, '') === cleanPhone.replace(/\D/g, ''));
      }
      if (!cust && !isTableOnly) {
        cust = db.customers.find(c => c.name.toLowerCase() === cleanName.toLowerCase());
      }

      if (cust) {
        if (!isTableOnly && (!cust.name || cust.name === 'Pelanggan')) cust.name = cleanName;
        if (cleanPhone && !cust.phone) cust.phone = cleanPhone;
        cust.visits = (Number(cust.visits) || 0) + 1;
        cust.totalSpend = (Number(cust.totalSpend) || 0) + trxTotal;
        if (cust.totalSpend >= 500000) cust.tier = 'Gold Member';
        else if (cust.totalSpend >= 200000) cust.tier = 'Silver Member';
      } else {
        cust = {
          id: 'CST-' + Date.now().toString().slice(-5),
          name: isTableOnly ? ('Pelanggan ' + cleanPhone) : cleanName,
          phone: cleanPhone,
          tier: trxTotal >= 200000 ? 'Silver Member' : 'Regular',
          visits: 1,
          totalSpend: trxTotal,
          specialVoucher: '',
          voucherDiscount: 0,
          voucherExpiry: '2026-12-31'
        };
        db.customers.unshift(cust);
      }
      autoSyncMasterSlices(['customers']);
      return cust;
    }

    function completeCheckoutPayment() {
      const { subtotal, totalDiscount, grandTotal, appliedCode } = getPosTotals();

      let paidItems = [];
      let remainingItems = [];
      let paidSubtotal = subtotal;
      let paidDiscount = totalDiscount;
      let paidTotal = grandTotal;

      if (checkoutMode === 'split') {
        posCart.forEach((it, idx) => {
          const payQty = Math.min(it.qty, Math.max(0, Number(splitSelectedQtys[idx]) || 0));
          const remQty = it.qty - payQty;
          if (payQty > 0) paidItems.push({ ...it, qty: payQty });
          if (remQty > 0) remainingItems.push({ ...it, qty: remQty });
        });
        if (paidItems.length === 0) return showToast('Pilih minimal 1 produk untuk dibayar!', true);
        paidSubtotal = paidItems.reduce((s, it) => s + (it.price * it.qty), 0);
        paidDiscount = subtotal > 0 ? Math.min(paidSubtotal, Math.round(totalDiscount * (paidSubtotal / subtotal))) : 0;
        paidTotal = Math.max(0, paidSubtotal - paidDiscount);
      } else {
        paidItems = JSON.parse(JSON.stringify(posCart));
      }

      if (checkoutMethod === 'Cash' && checkoutCashReceived < paidTotal) {
        return showToast('Uang tunai yang diterima kurang!', true);
      }

      const trx = {
        id: 'TRX-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderType: posOrderType,
        tableOrCustomer: posTableCustomer.trim() || '-',
        customerPhone: posCustomerPhone.trim(),
        cashier: currentUser.name,
        items: paidItems,
        subtotal: paidSubtotal,
        discount: paidDiscount,
        promoCode: appliedCode,
        total: paidTotal,
        paymentMethod: checkoutMethod,
        cashReceived: checkoutMethod === 'Cash' ? checkoutCashReceived : paidTotal,
        changeAmount: checkoutMethod === 'Cash' ? Math.max(0, checkoutCashReceived - paidTotal) : 0,
        status: 'PAID'
      };

      paidItems.forEach(item => {
        const prod = db.products.find(p => p.id === item.id || p.sku === item.sku);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
      });

      const savedCust = upsertCrmFromPos(posTableCustomer, posCustomerPhone, paidTotal);
      if (savedCust && savedCust.phone && !trx.customerPhone) {
        trx.customerPhone = savedCust.phone;
      }

      db.transactions.unshift(trx);

      if (remainingItems.length > 0) {
        const remSub = remainingItems.reduce((s, it) => s + (it.price * it.qty), 0);
        const remDisc = Math.max(0, totalDiscount - paidDiscount);
        const remTotal = Math.max(0, remSub - remDisc);
        const remOrder = {
          id: editingOpenOrderId || ('ORD-' + Date.now().toString().slice(-6)),
          date: todayISO(),
          time: nowTimeStr(),
          orderType: posOrderType,
          tableOrCustomer: posTableCustomer.trim() || 'Open Bill (Sisa Split)',
          customerPhone: posCustomerPhone.trim(),
          cashier: currentUser.name,
          items: remainingItems,
          subtotal: remSub,
          discount: remDisc,
          promoCode: appliedCode,
          total: remTotal
        };
        if (editingOpenOrderId) {
          const oIdx = db.openOrders.findIndex(o => o.id === editingOpenOrderId);
          if (oIdx >= 0) db.openOrders[oIdx] = remOrder;
          else db.openOrders.unshift(remOrder);
        } else {
          db.openOrders.unshift(remOrder);
        }
        autoSyncMasterSlices(['openOrders']);
      } else if (editingOpenOrderId) {
        db.openOrders = db.openOrders.filter(o => o.id !== editingOpenOrderId);
        autoSyncMasterSlices(['openOrders']);
      }

      saveDB();
      syncMasterEvent('POS_TRANSACTION_PAID', trx);
      autoSyncMasterSlices(['products']);

      const changeAmt = checkoutMethod === 'Cash' ? Math.max(0, checkoutCashReceived - paidTotal) : 0;
      resetPosCart();
      openPostPaymentReceiptModal(trx, changeAmt, remainingItems.length > 0);
    }
