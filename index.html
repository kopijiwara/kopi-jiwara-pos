<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B2E23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kopi Jiwara" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>KOPI JIWARA — POS & ERP Management System</title>
  <style>
    :root {
      --green-deep: #0B2E23;
      --green-mid: #134636;
      --green-soft: #E9F3EE;
      --yellow: #FACC15;
      --yellow-glow: rgba(250, 204, 21, 0.35);
      --pink: #F472B6;
      --pink-glow: rgba(244, 114, 182, 0.32);
      --bg-canvas: #EEF3F0;
      --glass-surface: rgba(255, 255, 255, 0.90);
      --glass-solid: #FFFFFF;
      --text-main: #0B2E23;
      --text-muted: #526B62;
      --border-glass: rgba(11, 46, 35, 0.11);
      --radius-bento: 22px;
      --radius-tile: 18px;
      --radius-pill: 999px;
      --shadow-bento: 0 10px 28px -10px rgba(11, 46, 35, 0.11), 0 2px 6px rgba(11, 46, 35, 0.04);
      --shadow-float: 0 24px 48px -12px rgba(7, 31, 23, 0.30);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 0% 0%, rgba(250, 204, 21, 0.13), transparent 34%),
        radial-gradient(circle at 100% 12%, rgba(244, 114, 182, 0.13), transparent 36%),
        var(--bg-canvas);
      color: var(--text-main);
    }

    button, input, select, textarea { font-family: inherit; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }

    /* TOAST */
    .toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      max-width: 92vw;
      pointer-events: none;
    }
    .toast-box {
      background: rgba(11, 46, 35, 0.96);
      backdrop-filter: blur(12px);
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .toast-box.error {
      background: #881337;
      color: #FFFFFF;
      border-color: var(--pink);
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-bg {
      min-height: 100dvh;
      width: 100%;
      background:
        radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22), transparent 38%),
        radial-gradient(circle at 85% 85%, rgba(244, 114, 182, 0.24), transparent 40%),
        linear-gradient(150deg, #071F17 0%, #0B2E23 50%, #134636 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-glass-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 28px;
      padding: 24px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.40);
      color: #FFFFFF;
    }
    .badge-chip-yellow {
      background: var(--yellow);
      color: var(--green-deep);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-chip-pink {
      background: rgba(244, 114, 182, 0.22);
      color: #FBCFE8;
      border: 1px solid rgba(244, 114, 182, 0.50);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      border: 1.5px solid rgba(250, 204, 21, 0.55);
      background-color: #0B2E23;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }
    .login-select option {
      background-color: #0B2E23;
      color: #FFFFFF;
      font-weight: 700;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 16px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--yellow);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--yellow);
      box-shadow: 0 0 10px var(--yellow);
      transform: scale(1.15);
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      padding: 13px 0;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .num-btn:active {
      transform: scale(0.96);
      background: rgba(250, 204, 21, 0.25);
    }
    .num-btn.pink {
      background: var(--pink);
      color: var(--green-deep);
      border-color: var(--pink);
      font-size: 13px;
    }
    .num-btn.enter {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      font-size: 13px;
    }

    /* ==================== TOP HEADER & GLASS NAV ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, rgba(11, 46, 35, 0.97) 0%, rgba(19, 70, 54, 0.96) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      padding: 12px 14px;
      border-bottom: 1.5px solid rgba(250, 204, 21, 0.32);
      box-shadow: 0 10px 28px rgba(11, 46, 35, 0.20);
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .outlet-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .outlet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .outlet-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    @media (min-width: 768px) {
      .outlet-title { font-size: 17px; }
    }
    .outlet-sub {
      font-size: 11px;
      color: #A7F3D0;
      font-weight: 600;
    }
    .shift-pill {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .shift-pill.open { background: var(--yellow); color: var(--green-deep); }
    .shift-pill.closed { background: var(--pink); color: var(--green-deep); }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      border: 1px solid rgba(167, 243, 208, 0.35);
      background: rgba(255, 255, 255, 0.10);
      color: #A7F3D0;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-sync-pill.syncing {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .live-sync-pill.offline {
      border-color: var(--pink);
      color: #FBCFE8;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 6px #34D399;
    }
    .live-sync-pill.syncing .live-dot {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }
    .live-sync-pill.offline .live-dot {
      background: var(--pink);
      box-shadow: 0 0 6px var(--pink);
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    @media (min-width: 768px) {
      .nav-bar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 8px;
      }
    }
    .nav-pill {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ECFDF5;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-pill.active {
      background: var(--yellow);
      color: var(--green-deep);
      border-color: var(--yellow);
      box-shadow: 0 4px 12px var(--yellow-glow);
    }

    /* ==================== RESPONSIVE BENTO GRID & CARDS ==================== */
    .main-wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 72px;
    }
    @media (min-width: 768px) {
      .main-wrap { padding: 18px 22px 72px; }
    }
    .bento-card {
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-bento);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .bento-card { padding: 20px; }
    }
    .bento-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 768px) {
      .bento-grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }
    .kpi-tile {
      background: var(--glass-solid);
      border-radius: var(--radius-tile);
      padding: 14px 15px;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-bento);
      min-width: 0;
    }
    .kpi-tile.dark {
      background: linear-gradient(145deg, var(--green-deep) 0%, var(--green-mid) 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
    }
    .kpi-tile.pink {
      background: linear-gradient(145deg, #FDF2F8 0%, #FCE7F3 100%);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
    }
    .kpi-tile.yellow {
      background: linear-gradient(145deg, #FEFCE8 0%, #FEF08A 100%);
      border: 1.5px solid rgba(250, 204, 21, 0.70);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-label { color: #A7F3D0; }
    .kpi-tile.pink .kpi-label { color: #9D174D; }
    .kpi-value {
      font-size: 16px;
      font-weight: 900;
      margin-top: 5px;
      word-break: break-word;
    }
    @media (min-width: 640px) {
      .kpi-value { font-size: 20px; }
    }
    .kpi-tile.dark .kpi-value { color: var(--yellow); }
    .kpi-tile.pink .kpi-value { color: #BE185D; }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }
    .kpi-tile.dark .kpi-sub { color: #D1FAE5; }

    /* INPUTS & BUTTONS */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .styled-select, .styled-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 13px;
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .styled-select:focus, .styled-input:focus {
      border-color: var(--green-deep);
      box-shadow: 0 0 0 3px rgba(11, 46, 35, 0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-dark { background: var(--green-deep); color: var(--yellow); }
    .btn-yellow { background: var(--yellow); color: var(--green-deep); box-shadow: 0 4px 12px var(--yellow-glow); }
    .btn-pink { background: var(--pink); color: var(--green-deep); box-shadow: 0 4px 12px var(--pink-glow); }
    .btn-soft { background: var(--green-soft); color: var(--green-deep); border: 1px solid var(--border-glass); }
    .btn-danger { background: #FEE2E2; color: #B91C1C; }
    .btn-sm { padding: 7px 11px; font-size: 11px; border-radius: 10px; }

    /* CRM SUGGESTION DROPDOWN */
    .crm-suggest-box {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #FFFFFF;
      border: 1.5px solid var(--green-deep);
      border-radius: 14px;
      box-shadow: var(--shadow-float);
      z-index: 60;
      max-height: 170px;
      overflow-y: auto;
    }
    .crm-suggest-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .crm-suggest-item:last-child { border-bottom: none; }
    .crm-suggest-item:hover { background: var(--green-soft); }

    /* POS RESPONSIVE GRID */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 768px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 16px;
      }
    }
    @media (min-width: 1200px) {
      .pos-layout {
        grid-template-columns: minmax(0, 1.55fr) minmax(370px, 0.9fr);
      }
    }
    .cat-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 3px 0;
    }
    @media (min-width: 1024px) {
      .cat-strip { flex-wrap: wrap; overflow-x: visible; }
    }
    .cat-chip {
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-glass);
      background: #FFFFFF;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    .cat-chip.active {
      background: var(--green-deep);
      color: var(--yellow);
      border-color: var(--green-deep);
    }
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 600px) {
      .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .prod-card {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 12px 13px;
      border: 1.5px solid var(--border-glass);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 108px;
      position: relative;
      box-shadow: 0 4px 12px rgba(11, 46, 35, 0.04);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .prod-card > * {
      pointer-events: none;
    }
    .prod-card:active {
      transform: scale(0.97);
      border-color: var(--green-deep);
    }
    .prod-card.in-cart {
      border-color: var(--green-deep);
      background: #F2FAF6;
    }
    .qty-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--pink);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 2px solid #FFFFFF;
    }

    /* TABLES */
    .table-box {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      background: #FFFFFF;
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compact-table thead th {
      position: sticky;
      top: 0;
      background: var(--green-deep);
      color: var(--yellow);
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .compact-table tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-glass);
      vertical-align: middle;
    }
    .compact-table tbody tr:hover { background: #F4FAF7; }

    /* SUBTABS */
    .subtab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.88);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-glass);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .subtab-bar { flex-wrap: wrap; overflow-x: visible; }
    }
    .subtab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--green-deep);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--green-deep);
      color: var(--yellow);
    }

    .badge-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
    }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-pink { background: #FCE7F3; color: #9D174D; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 31, 23, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal-card {
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      box-shadow: var(--shadow-float);
      border-top: 3px solid var(--yellow);
    }
    @media (min-width: 640px) {
      .modal-card { border-radius: 26px; border: 2px solid var(--yellow); }
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .close-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 900;
      cursor: pointer;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: fixed;
        left: 0;
        top: 0;
        width: 58mm;
        padding: 4mm;
        font-family: monospace;
        font-size: 11px;
        color: #000;
        background: #fff;
      }
    }
  </style>
</head>
<body>

<div id="toastWrap" class="toast-wrap hidden">
  <div id="toastBox" class="toast-box"></div>
</div>

<div id="printArea" class="hidden"></div>

<!-- ==================== LOGIN SCREEN ==================== -->
<div id="loginScreen" class="login-bg">
  <div class="login-glass-card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
      <div>
        <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
          <span class="badge-chip-yellow">POS & ERP</span>
          <span class="badge-chip-pink">Jiwara Ecosystem</span>

function renderJiwaraPngIcon(size) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#093814';
  ctx.fillRect(0, 0, size, size);
  const s = size / 100;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(50 * s, 50 * s, 35 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#093814';
  ctx.lineWidth = 5.8 * s;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(33 * s, 53 * s);
  ctx.bezierCurveTo(32 * s, 69 * s, 37 * s, 78 * s, 52 * s, 78 * s);
  ctx.bezierCurveTo(66 * s, 78 * s, 70 * s, 69 * s, 72 * s, 44 * s);
  ctx.bezierCurveTo(73 * s, 29 * s, 68 * s, 25 * s, 48 * s, 25 * s);
  ctx.bezierCurveTo(33 * s, 25 * s, 29 * s, 30 * s, 30 * s, 35 * s);
  ctx.bezierCurveTo(31 * s, 41 * s, 41 * s, 44 * s, 52 * s, 43 * s);
  ctx.bezierCurveTo(60 * s, 42 * s, 62 * s, 37 * s, 58 * s, 34 * s);
  ctx.bezierCurveTo(54 * s, 31 * s, 45 * s, 32 * s, 44 * s, 36 * s);
  ctx.stroke();
  return c.toDataURL('image/png');
}

function normalizeRecipeList(rawRecipe) {

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function normalizeCloudDate(rawVal) {
  if (!rawVal) return todayISO();
  const s = String(rawVal).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const isoPrefix = s.match(/^(\d{4}-\d{2}-\d{2})/);
  if (isoPrefix) return isoPrefix[1];
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
  const parsed = new Date(s);
  if (!isNaN(parsed.getTime()) && parsed.getFullYear() > 1970) {
    return parsed.getFullYear() + '-' + String(parsed.getMonth() + 1).padStart(2, '0') + '-' + String(parsed.getDate()).padStart(2, '0');
  }
  return s.slice(0, 10);
}

function normalizeCloudTime(rawVal) {
  if (rawVal === undefined || rawVal === null) return '';
  const s = String(rawVal).trim();
  if (!s) return '';
  if (s === '-') return '-';
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) {
    const parts = s.split(':');
    return parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0');
  }
  const match1899 = s.match(/(?:1899|1900|GMT|T)\D*(\d{1,2}):(\d{2})(?::\d{2})?/i);
  if (match1899) {
    return match1899[1].padStart(2, '0') + ':' + match1899[2].padStart(2, '0');
  }
  const matchAny = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
  if (matchAny) {
    return matchAny[1].padStart(2, '0') + ':' + matchAny[2].padStart(2, '0');
  }
  return s;
}

function nowTimeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function formatRp(num) {
  const n = Math.round(Number(num) || 0);
  const sign = n < 0 ? '-' : '';
  return sign + 'Rp ' + Math.abs(n).toLocaleString('id-ID');
}

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function sanitizeCorruptedProducts(prods, seedProds) {
  if (!Array.isArray(prods) || prods.length === 0) return [...seedProds];
  const looksCorrupted = prods.some(p =>
    /^\d{4}-\d{2}-\d{2}T/.test(String(p.sku || '')) ||
    (!isNaN(Number(p.brand)) && String(p.brand).trim() !== '')
  );
  if (looksCorrupted) return [...seedProds];
  const fixed = prods.map((p, idx) => ({
    id: p.id || ('PRD-' + (idx + 1)),
    sku: String(p.sku || ('SKU-' + (idx + 1))).trim(),
    name: String(p.name || 'Menu').trim(),
    category: String(p.category || 'Kopi Jiwara').trim(),
    brand: String(p.brand || 'Kopi Jiwara').trim(),
    price: Number(p.price) || 0,
    cost: Number(p.cost) || 0,
    stock: Number(p.stock) || 0,
    isFavorite: p.isFavorite === true || String(p.isFavorite).toLowerCase() === 'ya',
    active: p.active !== false && String(p.active).toLowerCase() !== 'nonaktif',
    includeCommissionShare: p.includeCommissionShare !== false && String(p.includeCommissionShare).toLowerCase() !== 'tidak',
    includeSalaryShare: p.includeSalaryShare !== false && String(p.includeSalaryShare).toLowerCase() !== 'tidak',
    recipe: normalizeRecipeList(p.recipe)
  }));
  if (fixed.filter(p => p.active).length === 0) {
    fixed.forEach(p => { p.active = true; });
  }
  return fixed;
}

function loadDB() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const autoSyncParam = urlParams.get('sync');
    const raw = localStorage.getItem(STORAGE_KEY);
    const seed = createCleanSeedDB();
    if (!raw) {
      if (autoSyncParam && autoSyncParam.startsWith('https://')) {
        seed.settings.webhookUrl = autoSyncParam.trim();
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
      return seed;
    }
    const parsed = JSON.parse(raw);
    const merged = {
      ...seed,
      ...parsed,
      settings: { ...seed.settings, ...(parsed.settings || {}) },
      shift: { ...seed.shift, ...(parsed.shift || {}) }
    };
    if (autoSyncParam && autoSyncParam.startsWith('https://')) {
      merged.settings.webhookUrl = autoSyncParam.trim();
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    if (!merged.settings.webhookUrl && DEFAULT_CLOUD_WEBHOOK_URL) {
      merged.settings.webhookUrl = DEFAULT_CLOUD_WEBHOOK_URL;
    }
    if (!Array.isArray(merged.staff) || merged.staff.filter(s => s && s.active !== false).length === 0) {
      merged.staff = [...seed.staff];
    }
    merged.products = sanitizeCorruptedProducts(merged.products, seed.products);
    const prodCats = merged.products.map(p => p.category).filter(Boolean);
    merged.categories = normalizeUniqueCategories([...(merged.categories || seed.categories), ...prodCats]);
    if (!Array.isArray(merged.brands) || merged.brands.length === 0) {
      merged.brands = [...DEFAULT_BRAND_LIST];
    }
    merged.inventory = (merged.inventory || []).map(inv => {
      const isPre = inv.itemType === 'PREBATCH' ||
        String(inv.code || '').toUpperCase().startsWith('PRE-') ||
        /pre-?batch|setengah jadi/i.test(String(inv.category || '') + ' ' + String(inv.name || ''));
      return {
        ...inv,
        itemType: isPre ? 'PREBATCH' : 'RAW',
        costPerUnit: Number(inv.costPerUnit) || 0
      };
    });
    merged.batchRecipes = Array.isArray(merged.batchRecipes) ? merged.batchRecipes.map((br, idx) => ({
      id: String(br.id || ('BTH-' + (idx + 1))),
      name: String(br.name || 'Formula Batch'),
      outputInvCode: String(br.outputInvCode || ''),
      targetYield: Number(br.targetYield) || 1,
      ingredients: normalizeRecipeList(br.ingredients),
      notes: String(br.notes || '')
    })) : seed.batchRecipes;
    merged.batchLogs = Array.isArray(merged.batchLogs) ? merged.batchLogs : [];
    merged.transactions = (merged.transactions || []).map(t => ({
      ...t,
      date: normalizeCloudDate(t.date),
      time: normalizeCloudTime(t.time)
    }));
    merged.openOrders = (merged.openOrders || []).map(o => ({
      ...o,
      date: normalizeCloudDate(o.date),
      time: normalizeCloudTime(o.time)
    }));
    merged.cashflow = (merged.cashflow || []).map(c => ({
      ...c,
      date: normalizeCloudDate(c.date),
      time: normalizeCloudTime(c.time)
    }));
    merged.attendance = (merged.attendance || []).map(a => ({
      ...a,
      date: normalizeCloudDate(a.date),
      clockIn: normalizeCloudTime(a.clockIn) || '-',
      clockOut: normalizeCloudTime(a.clockOut) || '-'
    }));
    return merged;
  } catch (e) {
    return createCleanSeedDB();
  }
}

// ==================== AUTO-DEDUCT RECIPE / BOM ENGINE ====================
function applyRecipeInventoryAdjustment(items, direction = -1, refLabel = '') {
  if (!Array.isArray(items) || items.length === 0) return false;
  let inventoryChanged = false;
  const aggDeductions = new Map();

  items.forEach(item => {
    const prod = db.products.find(p =>
      (item.id && String(p.id) === String(item.id)) ||
      (item.sku && String(p.sku) === String(item.sku)) ||
      (item.name && String(p.name).toLowerCase() === String(item.name).toLowerCase())
    );
    const recipe = normalizeRecipeList(prod ? prod.recipe : item.recipe);
    const itemQty = Number(item.qty) || 0;
    if (itemQty <= 0 || recipe.length === 0) return;

    recipe.forEach(ing => {
      const codeKey = String(ing.invCode || '').trim().toLowerCase();
      if (!codeKey) return;
      const totalIngQty = (Number(ing.qty) || 0) * itemQty;
      if (totalIngQty <= 0) return;
      aggDeductions.set(codeKey, (aggDeductions.get(codeKey) || 0) + totalIngQty);
    });
  });

  aggDeductions.forEach((rawQty, codeKey) => {
    const invItem = db.inventory.find(i => String(i.code || '').trim().toLowerCase() === codeKey);
    if (!invItem) return;
    const cleanQty = Math.round(rawQty * 1000) / 1000;
    if (cleanQty <= 0) return;

    if (direction < 0) {
      invItem.stock = Math.max(0, Math.round((invItem.stock - cleanQty) * 1000) / 1000);
    } else {
      invItem.stock = Math.round((invItem.stock + cleanQty) * 1000) / 1000;
    }
    invItem.lastOpname = todayISO();
    inventoryChanged = true;

    const logEntry = {
      id: 'LOG-' + Date.now().toString().slice(-6) + '-' + Math.floor(Math.random() * 90 + 10),
      date: todayISO(),
      time: nowTimeStr(),
      itemName: invItem.name,
      type: direction < 0 ? `Auto-Deduct Resep (${refLabel})` : `Retur Void Resep (${refLabel})`,
      qty: cleanQty,
      afterStock: invItem.stock,
      pic: currentUser ? currentUser.name : 'System'
    };
    db.stockLogs.unshift(logEntry);
    syncMasterEvent('INVENTORY_STOCK_ADJUSTED', logEntry);
  });

  return inventoryChanged;
}

// ==================== CLOUD 2-WAY REALTIME SYNC ====================
function updateHeaderCloudIndicator(state = 'idle', labelText = '') {
  const btn = document.getElementById('headerCloudSyncBtn');
  const lbl = document.getElementById('headerCloudSyncLabel');
  if (!btn || !lbl) return;
  const hasUrl = Boolean((db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim());
  btn.classList.remove('syncing', 'offline');
  if (!hasUrl) {
    btn.classList.add('offline');
    lbl.textContent = 'Belum Sync';
    return;
  }
  if (!navigator.onLine) {
    btn.classList.add('offline');
    lbl.textContent = `Offline (${db.offlineQueue.length})`;
    return;
  }
  if (state === 'syncing') {
    btn.classList.add('syncing');
    lbl.textContent = labelText || 'Menyinkron...';
  } else {
    lbl.textContent = labelText || (lastCloudPullStr ? `Live • ${lastCloudPullStr}` : 'Live Sync');
  }
}

function handleHeaderSyncClick() {
  const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
  if (!url) {
    if (isOwnerOrManager()) {
      workspaceMode = 'owner';
      activeTab = 'settings';
      settingsSubtab = 'outlet';
      renderWorkspace();
      showToast('Tempel URL Web App Google Apps Script untuk mengaktifkan sinkronisasi multi-device.');
    } else {
      showToast('URL Sync belum diatur oleh Owner.', true);
    }
    return;
  }
  pullFromCloudMaster(true);
}

function isUserActivelyTyping() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

async function pullFromCloudMaster(manual = false) {
  const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
  if (!url || !navigator.onLine || isCloudSyncing) return;
  if (!manual && Date.now() - lastLocalMutationAt < 5500) return;

  isCloudSyncing = true;
  updateHeaderCloudIndicator('syncing', manual ? 'Menarik Data...' : 'Sync...');

  try {
    const fetchUrl = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
    const res = await fetch(fetchUrl, { method: 'GET' });
    const text = await res.text();
    let payload = null;
    try { payload = JSON.parse(text); } catch (e) {}

    if (payload && payload.status === 'ok') {
      applyCloudPullData(payload);
      lastCloudPullStr = nowTimeStr();
      if (manual) showToast('Sinkronisasi 2 arah berhasil! Semua perangkat diperbarui.');
    } else if (manual) {
      showToast('Format respon Cloud belum sesuai. Pastikan Apps Script sudah di-deploy sebagai Web App (Anyone).', true);
    }
  } catch (err) {
    if (manual) showToast('Gagal menarik data dari Google Sheets. Periksa koneksi internet & izin Web App.', true);
  } finally {
    isCloudSyncing = false;
    updateHeaderCloudIndicator('idle');
  }
}

function applyCloudPullData(payload) {
  if (payload.outletProfile && typeof payload.outletProfile === 'object') {
    const op = payload.outletProfile;
    if (op.outletName) db.settings.outletName = op.outletName;
    if (op.outletAddress !== undefined) db.settings.outletAddress = op.outletAddress;
    if (op.outletPhone !== undefined) db.settings.outletPhone = op.outletPhone;
    if (op.outletSocial !== undefined) db.settings.outletSocial = op.outletSocial;
    if (op.receiptFooter !== undefined) db.settings.receiptFooter = op.receiptFooter;
    if (op.logoDataUrl !== undefined) db.settings.logoDataUrl = op.logoDataUrl;
  }

  if (Array.isArray(payload.brands) && payload.brands.length > 0) {
    db.brands = payload.brands.map(b => String(b || '').trim()).filter(Boolean);
  }
  if (payload.brandConfig && typeof payload.brandConfig === 'object') {
    db.brandConfig = { ...db.brandConfig, ...payload.brandConfig };
  }
  if (Array.isArray(payload.batchRecipes)) {
    db.batchRecipes = payload.batchRecipes.map((br, idx) => ({
      id: String(br.id || ('BTH-' + (idx + 1))),
      name: String(br.name || 'Formula Batch'),
      outputInvCode: String(br.outputInvCode || ''),
      targetYield: Number(br.targetYield) || 1,
      ingredients: normalizeRecipeList(br.ingredients),
      notes: String(br.notes || '')
    }));
  }
  if (payload.manualPeriodSalary !== undefined) {
    db.manualPeriodSalary = payload.manualPeriodSalary === null ? null : Number(payload.manualPeriodSalary);
  }

  if (Array.isArray(payload.products) && payload.products.length > 0) {
    const validProducts = sanitizeCorruptedProducts(payload.products, db.products);
    db.products = validProducts.map((p, idx) => {
      const existing = db.products.find(x => x.sku === p.sku || x.name.toLowerCase() === p.name.toLowerCase());
      const cloudRec = normalizeRecipeList(p.recipe);
      return {
        id: existing ? existing.id : ('PRD-' + (idx + 1) + '-' + p.sku),
        sku: p.sku,
        name: p.name,
        category: p.category,
        brand: p.brand,
        price: p.price,
        cost: p.cost,
        stock: p.stock,
        isFavorite: p.isFavorite,
        active: p.active,
        includeCommissionShare: p.includeCommissionShare,
        includeSalaryShare: p.includeSalaryShare,
        recipe: cloudRec.length > 0 ? cloudRec : (existing ? normalizeRecipeList(existing.recipe) : [])
      };
    });
  }

  const cloudCats = Array.isArray(payload.categories) ? payload.categories : [];
  const productCats = db.products.map(p => p.category).filter(Boolean);
  if (cloudCats.length > 0 || productCats.length > 0) {
    db.categories = normalizeUniqueCategories([...cloudCats, ...productCats]);
  }

  if (Array.isArray(payload.inventory) && payload.inventory.length > 0) {
    db.inventory = payload.inventory.map((inv, idx) => {
      const ex = db.inventory.find(x => x.code === inv.code || x.name === inv.name);
      const isPre = inv.itemType === 'PREBATCH' ||
        String(inv.code || '').toUpperCase().startsWith('PRE-') ||
        /pre-?batch|setengah jadi/i.test(String(inv.category || '') + ' ' + String(inv.name || ''));
      return {
        id: ex ? ex.id : ('INV-' + (idx + 1)),
        code: String(inv.code || ('BHN-' + (idx + 1))),
        name: String(inv.name || 'Bahan'),
        category: String(inv.category || (isPre ? 'Pre-Batch' : 'Bahan Mentah')),
        itemType: isPre ? 'PREBATCH' : 'RAW',
        costPerUnit: Number(inv.costPerUnit) || (ex ? Number(ex.costPerUnit) || 0 : 0),
        stock: Number(inv.stock) || 0,
        minStock: Number(inv.minStock) || 0,
        unit: String(inv.unit || 'pcs'),
        lastOpname: normalizeCloudDate(inv.lastOpname)
      };
    });
  }

  if (Array.isArray(payload.staff) && payload.staff.length > 0) {
    const validStaff = payload.staff.filter(s => s && s.name && String(s.pin || '').trim().length >= 4);
    if (validStaff.some(s => s.active !== false)) {
      db.staff = validStaff.map((s, idx) => ({
        id: String(s.id || ('STF-' + (idx + 1))),
        name: String(s.name),
        role: String(s.role || 'Kasir & Barista'),
        pin: String(s.pin || '1111'),
        dailyWage: Number(s.dailyWage) || 0,
        active: s.active !== false
      }));
    }
  }

  if (Array.isArray(payload.promos)) {
    db.promos = payload.promos.map((p, idx) => ({
      id: p.id || ('PRM-' + (idx + 1)),
      code: String(p.code || '').toUpperCase(),
      name: String(p.name || 'Promo'),
      type: p.type === 'nominal' ? 'nominal' : 'percent',
      value: Number(p.value) || 0,
      minOrder: Number(p.minOrder) || 0,
      validUntil: normalizeCloudDate(p.validUntil || '2026-12-31'),
      active: p.active !== false
    }));
  }

  if (Array.isArray(payload.customers)) {
    db.customers = payload.customers.map((c, idx) => ({
      id: String(c.id || ('CST-' + (idx + 1))),
      name: String(c.name || 'Pelanggan'),
      phone: String(c.phone || ''),
      tier: String(c.tier || 'Regular'),
      visits: Number(c.visits) || 0,
      totalSpend: Number(c.totalSpend) || 0,
      specialVoucher: String(c.specialVoucher || ''),
      voucherDiscount: Number(c.voucherDiscount) || 0,
      voucherExpiry: normalizeCloudDate(c.voucherExpiry || '2026-12-31')
    }));
  }

  if (Array.isArray(payload.openOrders)) {
    db.openOrders = payload.openOrders.map(o => ({
      id: String(o.id),
      date: normalizeCloudDate(o.date),
      time: normalizeCloudTime(o.time) || nowTimeStr(),
      orderType: String(o.orderType || 'Meja'),
      tableOrCustomer: String(o.tableOrCustomer || '-'),
      customerPhone: String(o.customerPhone || ''),
      cashier: String(o.cashier || 'Kasir'),
      items: Array.isArray(o.items) ? o.items : [],
      subtotal: Number(o.subtotal) || Number(o.total) || 0,
      discount: Number(o.discount) || 0,
      promoCode: String(o.promoCode || ''),
      total: Number(o.total) || 0
    }));
  }

  if (Array.isArray(payload.transactions)) {
    const cloudItems = Array.isArray(payload.transactionItems) ? payload.transactionItems : [];
    const localTrxMap = new Map(db.transactions.map(t => [t.id, t]));
    const cloudTrxIds = new Set();

    payload.transactions.forEach(ct => {
      const id = String(ct.id);
      cloudTrxIds.add(id);
      const localExisting = localTrxMap.get(id);
      const matchedItems = cloudItems.filter(it => String(it.trxId) === id).map(it => ({
        sku: it.sku || '-',
        name: it.name || 'Menu',
        brand: it.brand || 'Kopi Jiwara',
        includeCommissionShare: it.includeCommissionShare !== false,
        includeSalaryShare: it.includeSalaryShare !== false,
        qty: Number(it.qty) || 1,
        price: Number(it.price) || 0,
        cost: Number(it.unitCost) || 0
      }));
      localTrxMap.set(id, {
        id,
        shiftId: localExisting ? (localExisting.shiftId || '') : '',
        date: normalizeCloudDate(ct.date),
        time: normalizeCloudTime(ct.time),
        orderType: String(ct.orderType || 'Meja'),
        tableOrCustomer: String(ct.tableOrCustomer || '-'),
        customerPhone: String(ct.customerPhone || ''),
        cashier: String(ct.cashier || 'Kasir'),
        subtotal: Number(ct.subtotal) || 0,
        discount: Number(ct.discount) || 0,
        promoCode: String(ct.promoCode || ''),
        total: Number(ct.total) || 0,
        paymentMethod: String(ct.paymentMethod || 'Cash'),
        status: String(ct.status || 'PAID'),
        items: matchedItems.length > 0 ? matchedItems : (localExisting ? localExisting.items : [])
      });
    });

    const queuedIds = new Set(db.offlineQueue.map(q => q.data && q.data.id).filter(Boolean));
    db.transactions = Array.from(localTrxMap.values())
      .filter(t => cloudTrxIds.has(t.id) || queuedIds.has(t.id))
      .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }

  if (Array.isArray(payload.cashflow)) {
    const cfMap = new Map(db.cashflow.map(c => [c.id, c]));
    payload.cashflow.forEach((cc, idx) => {
      const cfId = String(cc.id || `CF-CLOUD-${cc.date || ''}-${idx}`);
      const existingCf = cfMap.get(cfId);
      cfMap.set(cfId, {
        id: cfId,
        shiftId: existingCf ? (existingCf.shiftId || '') : '',
        date: normalizeCloudDate(cc.date),
        time: normalizeCloudTime(cc.time) || '00:00',
        type: cc.type === 'OUT' ? 'OUT' : 'IN',
        category: String(cc.category || 'Operasional'),
        amount: Number(cc.amount) || 0,
        note: String(cc.note || ''),
        pic: String(cc.pic || 'System')
      });
    });
    db.cashflow = Array.from(cfMap.values()).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }

  if (Array.isArray(payload.attendance)) {
    const attMap = new Map(db.attendance.map(a => [a.date + '|' + a.staffName, a]));
    payload.attendance.forEach(ca => {
      const cDate = normalizeCloudDate(ca.date);
      const key = cDate + '|' + ca.staffName;
      attMap.set(key, {
        id: 'ATT-' + key,
        date: cDate,
        staffName: String(ca.staffName),
        role: String(ca.role || ''),
        clockIn: normalizeCloudTime(ca.clockIn) || '-',
        clockOut: normalizeCloudTime(ca.clockOut) || '-',
        wageEarned: Number(ca.wageEarned) || 0,
        status: String(ca.status || 'Hadir')
      });
    });
    db.attendance = Array.from(attMap.values());
  }

  if (Array.isArray(payload.closingHistory)) {
    const clsMap = new Map(db.closingHistory.map(c => [c.id, c]));
    payload.closingHistory.forEach(cc => {
      clsMap.set(String(cc.id), {
        id: String(cc.id),
        date: normalizeCloudDate(cc.date),
        time: normalizeCloudTime(cc.time) || '23:59',
        cashier: String(cc.cashier || 'Kasir'),
        openingCash: Number(cc.openingCash) || 0,
        cashSales: Number(cc.cashSales) || 0,
        qrisSales: Number(cc.qrisSales) || 0,
        transferSales: Number(cc.transferSales) || 0,
        onlineSales: Number(cc.onlineSales) || 0,
        totalSales: Number(cc.totalSales) || 0,
        expectedCash: Number(cc.expectedCash) || 0,
        actualCash: Number(cc.actualCash) || 0,
        diff: Number(cc.diff) || 0
      });
    });
    db.closingHistory = Array.from(clsMap.values()).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }

  if (Array.isArray(payload.auditLogs)) {
    const audMap = new Map(db.auditLogs.map(a => [a.id, a]));
    payload.auditLogs.forEach(ca => {
      audMap.set(String(ca.id), {
        id: String(ca.id),
        date: normalizeCloudDate(ca.date),
        time: normalizeCloudTime(ca.time),
        orderId: String(ca.orderId || '-'),
        itemName: String(ca.itemName || '-'),
        cashier: String(ca.cashier || '-'),
        authorizedBy: String(ca.authorizedBy || '-'),
        reason: String(ca.reason || '-')
      });
    });
    db.auditLogs = Array.from(audMap.values()).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }

  if (Array.isArray(payload.stockLogs)) {
    const slMap = new Map(db.stockLogs.map(s => [s.id, s]));
    payload.stockLogs.forEach(cs => {
      slMap.set(String(cs.id), {
        id: String(cs.id),
        date: normalizeCloudDate(cs.date),
        time: normalizeCloudTime(cs.time),
        itemName: String(cs.itemName || '-'),
        type: String(cs.type || '-'),
        qty: Number(cs.qty) || 0,
        afterStock: Number(cs.afterStock) || 0,
        pic: String(cs.pic || '-')
      });
    });
    db.stockLogs = Array.from(slMap.values()).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }

  if (Array.isArray(payload.batchLogs)) {
    const blMap = new Map(db.batchLogs.map(b => [b.id, b]));
    payload.batchLogs.forEach(cb => {
      blMap.set(String(cb.id), {
        id: String(cb.id),
        date: normalizeCloudDate(cb.date),
        time: normalizeCloudTime(cb.time),
        batchName: String(cb.batchName || ''),
        outputName: String(cb.outputName || ''),
        targetYield: Number(cb.targetYield) || 0,
        actualYield: Number(cb.actualYield) || 0,
        unit: String(cb.unit || 'ml'),
        totalCost: Number(cb.totalCost) || 0,
        hppPerUnit: Number(cb.hppPerUnit) || 0,
        ingredientsSummary: String(cb.ingredientsSummary || ''),
        calibrationNote: String(cb.calibrationNote || ''),
        pic: String(cb.pic || '-')
      });
    });
    db.batchLogs = Array.from(blMap.values()).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }

  if (Array.isArray(payload.brandSettlements)) {
    const stlMap = new Map(db.brandSettlements.map(s => [s.id, s]));
    payload.brandSettlements.forEach(cs => {
      stlMap.set(String(cs.id), {
        id: String(cs.id),
        date: normalizeCloudDate(cs.date),
        periodLabel: String(cs.periodLabel || ''),
        brand: String(cs.brand || ''),
        grossSales: Number(cs.grossSales) || 0,
        commissionPct: Number(cs.commissionPct) || 10,
        commissionCut: Number(cs.commissionCut) || 0,
        salaryCut: Number(cs.salaryCut) || 0,
        netTransfer: Number(cs.netTransfer) || 0,
        pic: String(cs.pic || 'Owner')
      });
    });
    db.brandSettlements = Array.from(stlMap.values()).sort((a, b) => b.date.localeCompare(a.date));
  }

  saveDB();

  const modalOpen = !document.getElementById('modalBackdrop').classList.contains('hidden');
  if (!currentUser) {
    renderLoginStaffDropdown();
  } else if (!modalOpen && !isUserActivelyTyping() && !(activeTab === 'pos' && posCart.length > 0)) {
    renderWorkspace();
  } else if (currentUser) {
    updateTopBarHeader();
  }
}

function startCloudAutoPullLoop() {
  if (autoPullTimer) clearInterval(autoPullTimer);
  autoPullTimer = setInterval(() => {
    const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
    if (url && db.settings.autoPullEnabled !== false && navigator.onLine) {
      if (db.offlineQueue.length > 0) flushOfflineQueue();
      pullFromCloudMaster(false);
    }
  }, (Number(db.settings.autoPullIntervalSec) || 15) * 1000);

function syncMasterEvent(eventType, data) {
  lastLocalMutationAt = Date.now();
  const payload = {
    eventType,
    timestamp: new Date().toISOString(),
    outlet: db.settings.outletName,
    staff: currentUser ? currentUser.name : 'System',
    data
  };
  db.offlineQueue.push(payload);
  saveDB();
  updateHeaderCloudIndicator();
  flushOfflineQueue();
}

function autoSyncMasterSlices(slices = []) {
  const snap = {};
  if (slices.includes('brands')) {
    snap.brands = db.brands;
    snap.brandConfig = db.brandConfig;
  }
  if (slices.includes('brandConfig')) snap.brandConfig = db.brandConfig;
  if (slices.includes('manualPeriodSalary')) snap.manualPeriodSalary = db.manualPeriodSalary;
  if (slices.includes('products')) snap.products = db.products;
  if (slices.includes('categories')) snap.categories = db.categories;
  if (slices.includes('inventory')) snap.inventory = db.inventory;
  if (slices.includes('batchRecipes')) snap.batchRecipes = db.batchRecipes;
  if (slices.includes('staff')) snap.staff = db.staff;
  if (slices.includes('promos')) snap.promos = db.promos;
  if (slices.includes('customers')) snap.customers = db.customers;
  if (slices.includes('openOrders')) snap.openOrders = db.openOrders;
  syncMasterEvent('SYNC_MASTER_SNAPSHOT', snap);
}

async function flushOfflineQueue() {
  const url = (db.settings.webhookUrl || DEFAULT_CLOUD_WEBHOOK_URL || '').trim();
  if (!url || !navigator.onLine || db.offlineQueue.length === 0) return;
  const remaining = [];
  for (const item of db.offlineQueue) {
    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(item)
      });
    } catch (e) {
      remaining.push(item);
    }
  }
  db.offlineQueue = remaining;
  saveDB();
  updateHeaderCloudIndicator();
}

window.addEventListener('online', () => {
  showToast('Koneksi internet kembali online! Menyinkronkan data...');
  flushOfflineQueue();
  pullFromCloudMaster(false);
});
window.addEventListener('offline', () => {
  updateHeaderCloudIndicator();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && navigator.onLine) {
    flushOfflineQueue();
    pullFromCloudMaster(false);
  }
});

function renderLoginStaffDropdown() {

  sel.innerHTML = activeStaff.map(s =>

function pressPin(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updatePinDotsUI();
  if (pinBuffer.length === 4) {
    setTimeout(submitPinLogin, 120);
  }
}

function clearPinPad() {
  pinBuffer = '';
  updatePinDotsUI();
}

function updatePinDotsUI() {
  const dots = document.querySelectorAll('#pinDots .pin-dot');
  dots.forEach((d, idx) => d.classList.toggle('filled', idx < pinBuffer.length));
}

function submitPinLogin() {
  const staffId = document.getElementById('loginStaffSelect').value;
  const staff = db.staff.find(s => s.id === staffId && s.active);
  if (!staff) return showToast('Pilih pegawai terlebih dahulu!', true);
  if (pinBuffer !== String(staff.pin)) {
    clearPinPad();
    return showToast('PIN salah! Silakan coba kembali.', true);
  }
  currentUser = staff;
  clearPinPad();
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    staffId: staff.id,
    workspaceMode: isOwnerOrManager(staff) ? 'owner' : 'kasir',
    activeTab: isOwnerOrManager(staff) ? 'reports' : 'pos'
  }));
  workspaceMode = isOwnerOrManager(staff) ? 'owner' : 'kasir';
  activeTab = isOwnerOrManager(staff) ? 'reports' : 'pos';

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appWorkspace').classList.remove('hidden');

  const todayStr = todayISO();
  const alreadyAtt = db.attendance.find(a => a.date === todayStr && a.staffName === staff.name);
  if (!alreadyAtt) {
    const att = {
      id: 'ATT-' + Date.now(),
      date: todayStr,
      staffName: staff.name,
      role: staff.role,
      clockIn: nowTimeStr(),
      clockOut: '-',
      wageEarned: staff.dailyWage,
      status: 'Hadir'
    };
    db.attendance.unshift(att);
    saveDB();
    syncMasterEvent('ATTENDANCE_CLOCK_IN', att);
  }

  renderWorkspace();
  if (!isOwnerOrManager(staff) && !db.shift.isOpen) {
    promptOpenShiftModal();
  }
}

function checkExistingSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    const sess = JSON.parse(raw);
    const staff = db.staff.find(s => s.id === sess.staffId && s.active);
    if (!staff) return;
    currentUser = staff;
    workspaceMode = isOwnerOrManager(staff) ? (sess.workspaceMode || 'owner') : 'kasir';
    activeTab = sess.activeTab || (workspaceMode === 'owner' ? 'reports' : 'pos');

// ==================== SHIFT MANAGEMENT ====================
function getActiveShiftId() {
  if (!db.shift.isOpen) return '';
  if (!db.shift.shiftId) {
    db.shift.shiftId = 'SHF-' + (db.shift.openedAt || todayISO() + ' ' + nowTimeStr()).replace(/[^0-9]/g, '');
    saveDB();
  }
  return db.shift.shiftId;
}

function getActiveShiftStartTimestamp() {
  if (!db.shift.isOpen || !db.shift.openedAt) return '';
  return String(db.shift.openedAt).trim();
}

function isRecordInActiveShift(rec) {
  if (!db.shift.isOpen || !rec) return false;
  const activeId = getActiveShiftId();
  if (rec.shiftId) {
    return String(rec.shiftId) === String(activeId);
  }
  const startTs = getActiveShiftStartTimestamp();
  const recTs = `${rec.date || todayISO()} ${rec.time || '00:00'}`;
  if (startTs) {
    return recTs >= startTs;
  }
  return rec.date === todayISO();
}

function getDrawerLiveCashState() {
  const lastClosing = db.closingHistory && db.closingHistory.length > 0 ? db.closingHistory[0] : null;
  if (!db.shift.isOpen) {
    return {
      isOpen: false,
      shiftId: '',
      openedBy: '-',
      openedAt: '-',
      openingCash: 0,
      cashSales: 0,
      nonCashSales: 0,
      cashIn: 0,
      cashOut: 0,
      expectedCash: lastClosing ? (Number(lastClosing.actualCash) || 0) : 0,
      lastClosing
    };
  }
  const shiftTrxs = db.transactions.filter(t => t.status === 'PAID' && isRecordInActiveShift(t));
  const cashSales = shiftTrxs.filter(t => t.paymentMethod === 'Cash').reduce((s, t) => s + (Number(t.total) || 0), 0);
  const nonCashSales = shiftTrxs.filter(t => t.paymentMethod !== 'Cash').reduce((s, t) => s + (Number(t.total) || 0), 0);
  const shiftCashflows = db.cashflow.filter(c => isRecordInActiveShift(c));
  const cashIn = shiftCashflows.filter(c => c.type === 'IN').reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const cashOut = shiftCashflows.filter(c => c.type === 'OUT').reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const openingCash = Number(db.shift.openingCash) || 0;
  const expectedCash = openingCash + cashSales + cashIn - cashOut;
  return {
    isOpen: true,
    shiftId: getActiveShiftId(),
    openedBy: db.shift.openedBy || '-',
    openedAt: db.shift.openedAt || '-',
    openingCash,
    cashSales,
    nonCashSales,
    cashIn,
    cashOut,
    expectedCash,
    lastClosing
  };
}

function promptOpenShiftModal() {
  const lastClosing = db.closingHistory && db.closingHistory.length > 0 ? db.closingHistory[0] : null;
  const lastCloseRefHtml = lastClosing
    ? `<div style="background:#FEFCE8;border:1.5px solid rgba(250,204,21,0.7);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:12px;">
        <strong>Referensi Tutup Shift Terakhir (${esc(lastClosing.cashier)} • ${esc(lastClosing.date)} ${esc(lastClosing.time)}):</strong><br/>
        Sisa Uang Fisik Laci Tercatat: <strong style="color:#0B2E23;">${formatRp(lastClosing.actualCash)}</strong>
      </div>`
    : '';
  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:17px;">Buka Shift Kasir Baru</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:0;">
      Shift baru akan dimulai dari <strong>Rp 0 transaksi</strong> (terpisah dari penjualan tunai shift sebelumnya agar tidak terjadi double input). Masukkan modal uang fisik di laci saat ini.
    </p>
    ${lastCloseRefHtml}
    <div style="margin-bottom:14px;">
      <label class="field-label">Modal Uang Tunai Laci Shift Ini (Rp)</label>
      <input id="openShiftCashInput" type="number" class="styled-input" value="0" placeholder="Contoh: 200000" />
    </div>
    <button class="btn btn-dark" style="width:100%;" onclick="confirmOpenShift()">Mulai Buka Shift Kasir</button>
  `);
}

function confirmOpenShift() {
  const val = Math.max(0, Number(document.getElementById('openShiftCashInput').value) || 0);
  const ts = todayISO() + ' ' + nowTimeStr();
  db.shift = {
    isOpen: true,
    shiftId: 'SHF-' + Date.now(),
    openedBy: currentUser.name,
    openedAt: ts,
    openingCash: val
  };
  salesShiftScope = 'ACTIVE';
  saveDB();
  closeModal();
  renderWorkspace();
  showToast('Shift kasir baru dibuka! Modal laci: ' + formatRp(val));
}

function handlePosCustomerInput(val) {
  posTableCustomer = val;
  const box = document.getElementById('crmSuggestDropdown');
  if (!box) return;
  const q = val.trim().toLowerCase();
  if (!q) {
    box.classList.add('hidden');
    return;
  }
  const matches = db.customers.filter(c =>
    c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(q))
  ).slice(0, 5);
  if (matches.length === 0) {
    box.classList.add('hidden');
    return;
  }
  box.innerHTML = matches.map(c => `
    <div class="crm-suggest-item" onclick="selectCrmCustomerForPos('${esc(c.id)}')">
      <div>
        <strong>${esc(c.name)}</strong> <span class="badge-pill badge-yellow">${esc(c.tier)}</span>
        <div style="font-size:10px;color:var(--text-muted);">${esc(c.phone || 'Tanpa No. WA')} • ${c.visits}x Kunjungan</div>
      </div>
      ${c.specialVoucher ? `<span class="badge-pill badge-pink">${esc(c.specialVoucher)}</span>` : ''}
    </div>
  `).join('');
  box.classList.remove('hidden');
}

function handlePosPhoneInput(val) {
  posCustomerPhone = val;
  const clean = val.replace(/\D/g, '');
  if (clean.length >= 6) {
    const found = db.customers.find(c => c.phone && c.phone.replace(/\D/g, '').includes(clean));
    if (found && !posTableCustomer.trim()) {
      posTableCustomer = found.name;
      const nameInp = document.getElementById('posCustomerNameInput');
      if (nameInp) nameInp.value = found.name;
    }
  }
}

function selectCrmCustomerForPos(custId) {
  const c = db.customers.find(x => x.id === custId);
  if (!c) return;
  posTableCustomer = c.name;
  posCustomerPhone = c.phone || '';
  const nameInp = document.getElementById('posCustomerNameInput');
  const phoneInp = document.getElementById('posCustomerPhoneInput');
  if (nameInp) nameInp.value = posTableCustomer;
  if (phoneInp) phoneInp.value = posCustomerPhone;
  const box = document.getElementById('crmSuggestDropdown');
  if (box) box.classList.add('hidden');

  if (c.specialVoucher && !posPromoCode) {
    posPromoSelection = '__CUSTOM__';
    posPromoCode = c.specialVoucher;
    const sel = document.getElementById('posPromoSelect');
    const customInp = document.getElementById('posCustomPromoInput');
    if (sel) sel.value = '__CUSTOM__';
    if (customInp) {
      customInp.classList.remove('hidden');
      customInp.value = c.specialVoucher;
    }
    recalcPosTotals();
    showToast(`Member ${c.name} dipilih! Voucher ${c.specialVoucher} otomatis diterapkan.`);
  }
}

function upsertCrmFromOrder(nameVal, phoneVal, orderTotal) {
  const cleanName = String(nameVal || '').trim();
  const cleanPhone = String(phoneVal || '').trim();
  if (!cleanPhone && (!cleanName || /^meja\s*\d*/i.test(cleanName))) return;

  let cust = null;
  if (cleanPhone) {
    const digits = cleanPhone.replace(/\D/g, '');
    cust = db.customers.find(c => c.phone && c.phone.replace(/\D/g, '') === digits);
  }
  if (!cust && cleanName && !/^meja\s*\d*/i.test(cleanName)) {
    cust = db.customers.find(c => c.name.toLowerCase() === cleanName.toLowerCase());
  }

  if (cust) {
    if (cleanName && !/^meja\s*\d*/i.test(cleanName)) cust.name = cleanName;
    if (cleanPhone) cust.phone = cleanPhone;
    cust.visits = (Number(cust.visits) || 0) + 1;
    cust.totalSpend = (Number(cust.totalSpend) || 0) + (Number(orderTotal) || 0);
    if (cust.visits >= 10) cust.tier = 'VIP Jiwa';
    else if (cust.visits >= 4) cust.tier = 'Member Aktif';
  } else {
    db.customers.unshift({
      id: 'CST-' + Date.now().toString().slice(-6),
      name: cleanName || ('Pelanggan ' + cleanPhone.slice(-4)),
      phone: cleanPhone,
      tier: 'Regular',
      visits: 1,
      totalSpend: Number(orderTotal) || 0,
      specialVoucher: '',
      voucherDiscount: 0,
      voucherExpiry: '2026-12-31'
    });
  }
}

function onOrderTypeChange(val) {
  posOrderType = val;
  if (!['GoFood', 'GrabFood', 'ShopeeFood'].includes(val)) {
    posOnlineDiscount = 0;
  }
  const box = document.getElementById('onlineDiscountBox');
  if (box) {
    box.classList.toggle('hidden', !['GoFood', 'GrabFood', 'ShopeeFood'].includes(val));
  }
  recalcPosTotals();
}

function handlePosPromoSelect(val) {
  posPromoSelection = val;
  const customInp = document.getElementById('posCustomPromoInput');
  if (val === '__CUSTOM__') {
    posPromoCode = customInp ? customInp.value.trim().toUpperCase() : '';
    if (customInp) {
      customInp.classList.remove('hidden');
      customInp.focus();
    }
  } else {
    posPromoCode = val;
    if (customInp) customInp.classList.add('hidden');
  }
  recalcPosTotals();
}

function addProductToCart(prodId) {
  const prod = db.products.find(p => p.id === prodId);
  if (!prod) return;
  const existing = posCart.find(c => c.id === prodId);
  if (existing) {
    existing.qty += 1;
  } else {
    posCart.push({
      id: prod.id,
      sku: prod.sku,
      name: prod.name,
      brand: prod.brand,
      includeCommissionShare: prod.includeCommissionShare !== false,
      includeSalaryShare: prod.includeSalaryShare !== false,
      price: prod.price,
      cost: prod.cost,
      qty: 1,
      isSavedOpenItem: false
    });
  }
  updatePosCatalogOnly();
  renderPosCartItems();
}

function adjustCartItemQty(idx, delta) {
  const item = posCart[idx];
  if (!item) return;

  if (delta < 0 && editingOpenOrderId && item.isSavedOpenItem) {
    requestManagerPinAuthorization(
      `Pengurangan item "${item.name}" pada Open Order ${editingOpenOrderId}`,
      (authorizerName, reason) => {
        const audit = {
          id: 'AUD-' + Date.now().toString().slice(-6),
          date: todayISO(),
          time: nowTimeStr(),
          orderId: editingOpenOrderId,
          itemName: `${item.name} (-1 qty)`,
          cashier: currentUser.name,
          authorizedBy: authorizerName,
          reason
        };
        db.auditLogs.unshift(audit);
        syncMasterEvent('AUDIT_VOID_ITEM', audit);

        item.qty -= 1;
        if (item.qty <= 0) posCart.splice(idx, 1);
        updatePosCatalogOnly();
        renderPosCartItems();
        showToast('Item dikurangi dengan otorisasi PIN ' + authorizerName);
      }
    );
    return;
  }

  item.qty += delta;
  if (item.qty <= 0) posCart.splice(idx, 1);
  updatePosCatalogOnly();
  renderPosCartItems();
}

function calculateCartFinancials(cartList = posCart) {
  const subtotal = cartList.reduce((sum, it) => sum + (it.price * it.qty), 0);
  let promoDisc = 0;

  if (posPromoCode) {
    const codeUpper = posPromoCode.trim().toUpperCase();
    const promo = db.promos.find(p => p.active && p.code.toUpperCase() === codeUpper);
    if (promo && subtotal >= (promo.minOrder || 0)) {
      promoDisc = promo.type === 'percent'
        ? Math.round(subtotal * (promo.value / 100))
        : promo.value;
    } else {
      const custVoucher = db.customers.find(c => c.specialVoucher && c.specialVoucher.toUpperCase() === codeUpper);
      if (custVoucher) {
        promoDisc = Number(custVoucher.voucherDiscount) || 0;
      }
    }
  }

  const totalDiscount = Math.min(subtotal, promoDisc + posManualDiscount + posOnlineDiscount);
  const grandTotal = Math.max(0, subtotal - totalDiscount);
  return { subtotal, promoDisc, totalDiscount, grandTotal };
}

function renderPosCartItems() {
  const box = document.getElementById('posCartItemsList');
  if (!box) return;
  if (posCart.length === 0) {
    box.innerHTML = `<div style="text-align:center;padding:24px 10px;color:var(--text-muted);font-size:12px;">Belum ada item dipilih. Tap kartu menu di sebelah kiri.</div>`;
  } else {
    box.innerHTML = posCart.map((it, idx) => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--border-glass);">
        <div style="min-width:0;flex:1;">
          <div style="font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(it.name)}</div>
          <div style="font-size:11px;color:var(--text-muted);">${formatRp(it.price)} x ${it.qty} = <strong>${formatRp(it.price * it.qty)}</strong></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button type="button" class="btn btn-soft btn-sm" style="padding:4px 9px;" onclick="adjustCartItemQty(${idx}, -1)">-</button>
          <span style="font-size:12px;font-weight:900;min-width:16px;text-align:center;">${it.qty}</span>
          <button type="button" class="btn btn-dark btn-sm" style="padding:4px 9px;" onclick="adjustCartItemQty(${idx}, 1)">+</button>
        </div>
      </div>
    `).join('');
  }
  recalcPosTotals();
}

function recalcPosTotals() {
  const sumBox = document.getElementById('posTotalsSummary');
  if (!sumBox) return;
  const { subtotal, totalDiscount, grandTotal } = calculateCartFinancials();
  sumBox.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">
      <span>Subtotal (${posCart.reduce((s, i) => s + i.qty, 0)} item)</span>
      <strong>${formatRp(subtotal)}</strong>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#BE185D;margin-bottom:6px;">
      <span>Total Diskon / Promo</span>
      <strong>-${formatRp(totalDiscount)}</strong>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:900;border-top:1px solid var(--border-glass);padding-top:6px;">
      <span>TOTAL TAGIHAN</span>
      <span>${formatRp(grandTotal)}</span>
    </div>
  `;
}

function resetCurrentCart() {
  posCart = [];
  editingOpenOrderId = null;
  posTableCustomer = '';
  posCustomerPhone = '';
  posPromoSelection = '';
  posPromoCode = '';
  posManualDiscount = 0;
  posOnlineDiscount = 0;
  renderWorkspace();
}

// ==================== OPEN ORDERS & PIN AUTHORIZATION ====================
function saveAsOpenOrder() {
  if (!db.shift.isOpen) return promptOpenShiftModal();
  if (posCart.length === 0) return showToast('Keranjang masih kosong!', true);

  const label = posTableCustomer.trim() || `${posOrderType} #${db.openOrders.length + 1}`;
  const phone = posCustomerPhone.trim();
  const { subtotal, totalDiscount, grandTotal } = calculateCartFinancials();
  const savedItems = posCart.map(it => ({ ...it, isSavedOpenItem: true }));

  if (editingOpenOrderId) {
    const ord = db.openOrders.find(o => o.id === editingOpenOrderId);
    if (ord) {
      ord.orderType = posOrderType;
      ord.tableOrCustomer = label;
      ord.customerPhone = phone;
      ord.items = savedItems;
      ord.subtotal = subtotal;
      ord.discount = totalDiscount;
      ord.promoCode = posPromoCode;
      ord.total = grandTotal;
    }
  } else {
    db.openOrders.unshift({
      id: 'ORD-' + Date.now().toString().slice(-6),
      date: todayISO(),
      time: nowTimeStr(),
      orderType: posOrderType,
      tableOrCustomer: label,
      customerPhone: phone,
      cashier: currentUser.name,
      items: savedItems,
      subtotal,
      discount: totalDiscount,
      promoCode: posPromoCode,
      total: grandTotal
    });
  }

  saveDB();
  autoSyncMasterSlices(['openOrders']);
  showToast(`Order "${label}" tersimpan di daftar Open Order!`);
  resetCurrentCart();
}

function openActiveOrdersModal() {
  const listHtml = db.openOrders.length === 0
    ? `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">Tidak ada Open Order aktif saat ini.</div>`
    : db.openOrders.map(ord => `
      <div style="background:var(--green-soft);border:1px solid var(--border-glass);border-radius:16px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <strong>${esc(ord.tableOrCustomer)} (${esc(ord.orderType)})</strong>
          <span class="badge-pill badge-yellow">${formatRp(ord.total)}</span>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">${ord.id} • Jam ${ord.time} • ${ord.items.length} menu ${ord.customerPhone ? '• WA: ' + esc(ord.customerPhone) : ''}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-dark btn-sm" onclick="loadOpenOrderToPos('${ord.id}')">Buka / Bayar</button>
          <button class="btn btn-danger btn-sm" onclick="cancelEntireOpenOrder('${ord.id}')">Batalkan Order (PIN)</button>
        </div>
      </div>
    `).join('');

  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px;">Daftar Open Order Aktif</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    ${listHtml}
  `);
}

function loadOpenOrderToPos(orderId) {
  const ord = db.openOrders.find(o => o.id === orderId);
  if (!ord) return;
  editingOpenOrderId = ord.id;
  posOrderType = ord.orderType;
  posTableCustomer = ord.tableOrCustomer;
  posCustomerPhone = ord.customerPhone || '';
  posPromoCode = ord.promoCode || '';
  posPromoSelection = posPromoCode
    ? (db.promos.some(p => p.code === posPromoCode) ? posPromoCode : '__CUSTOM__')
    : '';
  posManualDiscount = 0;
  posOnlineDiscount = 0;
  posCart = ord.items.map(it => ({ ...it, isSavedOpenItem: true }));
  closeModal();
  renderWorkspace();
  showToast('Order dimuat ke layar kasir.');
}

function cancelEntireOpenOrder(orderId) {
  const ord = db.openOrders.find(o => o.id === orderId);
  if (!ord) return;
  requestManagerPinAuthorization(`Pembatalan seluruh Open Order ${ord.id} (${ord.tableOrCustomer})`, (authorizer, reason) => {
    const audit = {
      id: 'AUD-' + Date.now().toString().slice(-6),
      date: todayISO(),
      time: nowTimeStr(),
      orderId: ord.id,
      itemName: 'Batal Seluruh Order (' + ord.tableOrCustomer + ')',
      cashier: currentUser.name,
      authorizedBy: authorizer,
      reason
    };
    db.auditLogs.unshift(audit);
    syncMasterEvent('AUDIT_VOID_ITEM', audit);

    db.openOrders = db.openOrders.filter(o => o.id !== orderId);
    if (editingOpenOrderId === orderId) resetCurrentCart();
    saveDB();
    autoSyncMasterSlices(['openOrders']);
    closeModal();
    renderWorkspace();
    showToast('Open Order dibatalkan & tercatat di Log Audit.');
  });
}

function requestManagerPinAuthorization(actionLabel, onSuccessCallback) {
  openModal(`
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px;color:#BE185D;">Otorisasi PIN Owner / Manager</h3>
      <button class="close-circle" onclick="closeModal()">x</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:0;">Tindakan: <strong>${esc(actionLabel)}</strong></p>
    <div style="margin-bottom:10px;">
      <label class="field-label">Alasan Pengurangan / Pembatalan</label>
      <input id="authReasonInput" type="text" class="styled-input" placeholder="Contoh: Salah input / Pelanggan batal" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="field-label">Masukkan PIN 4-Digit Owner / Manager</label>
      <input id="authPinInput" type="password" maxlength="4" class="styled-input" placeholder="****" />
    </div>
    <button class="btn btn-pink" style="width:100%;" id="confirmAuthBtn">Verifikasi & Lanjutkan</button>
  `);
  document.getElementById('confirmAuthBtn').onclick = () => {
    const reason = document.getElementById('authReasonInput').value.trim() || 'Koreksi Order';
    const pin = document.getElementById('authPinInput').value.trim();
    const approver = db.staff.find(s => s.active && isOwnerOrManager(s) && String(s.pin) === pin);
    if (!approver) return showToast('PIN Owner/Manager tidak valid!', true);
    closeModal();
    onSuccessCallback(approver.name, reason);
  };
}

  sec.classList.toggle('hidden', method !== 'Cash');

}

function setCashQuick(amt, total) {
  document.getElementById('cashReceivedInput').value = amt;
  updateCashChange(total);
}

function updateCashChange(total) {
  const rec = Number(document.getElementById('cashReceivedInput').value) || 0;
  const diff = rec - total;
  const el = document.getElementById('cashChangeDisplay');
  el.textContent = diff >= 0 ? `Kembalian: ${formatRp(diff)}` : `Kurang Bayar: ${formatRp(Math.abs(diff))}`;
  el.style.color = diff >= 0 ? '#0B2E23' : '#BE185D';
}

function finalizeTransaction() {
  const method = document.getElementById('payMethodSel').value;
  const { subtotal, totalDiscount, grandTotal } = calculateCartFinancials();
  if (method === 'Cash') {
    const rec = Number(document.getElementById('cashReceivedInput').value) || 0;
    if (rec < grandTotal) return showToast('Uang tunai diterima kurang dari total tagihan!', true);
  }

  const custLabel = posTableCustomer.trim() || posOrderType;
  const custPhone = posCustomerPhone.trim();

  const trx = {
    id: 'TRX-' + Date.now().toString().slice(-7),
    shiftId: getActiveShiftId(),
    date: todayISO(),
    time: nowTimeStr(),
    orderType: posOrderType,
    tableOrCustomer: custLabel,
    customerPhone: custPhone,
    cashier: currentUser.name,
    items: posCart.map(it => ({ ...it })),
    subtotal,
    discount: totalDiscount,
    promoCode: posPromoCode,
    total: grandTotal,
    paymentMethod: method,
    status: 'PAID'
  };

  trx.items.forEach(it => {
    const p = db.products.find(x => x.id === it.id);
    if (p) p.stock = Math.max(0, p.stock - it.qty);
  });

  const invDeducted = applyRecipeInventoryAdjustment(trx.items, -1, trx.id);

  if (editingOpenOrderId) {
    db.openOrders = db.openOrders.filter(o => o.id !== editingOpenOrderId);
  }

  upsertCrmFromOrder(custLabel, custPhone, grandTotal);

  db.transactions.unshift(trx);
  saveDB();
  syncMasterEvent('POS_TRANSACTION_PAID', trx);
  const slicesToSync = ['products', 'customers'];
  if (invDeducted) slicesToSync.push('inventory');
  if (editingOpenOrderId) slicesToSync.push('openOrders');
  autoSyncMasterSlices(slicesToSync);

  resetCurrentCart();
  showPostPaymentSuccessModal(trx);
}

function formatWaPhoneIndonesia(rawPhone) {
  let digits = String(rawPhone || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('0')) digits = '62' + digits.slice(1);
  else if (digits.startsWith('8')) digits = '62' + digits;
  return digits;
}

let splitSelectedQuantities = {};

function openSplitBillModal() {
  if (!db.shift.isOpen) return promptOpenShiftModal();
  if (posCart.length === 0) return showToast('Keranjang masih kosong!', true);

  splitSelectedQuantities = {};
  posCart.forEach((it, idx) => {

  });

}

function adjustSplitItemQty(idx, delta) {
  const item = posCart[idx];
  if (!item) return;
  const cur = splitSelectedQuantities[idx] || 0;
  const next = Math.max(0, Math.min(item.qty, cur + delta));
  splitSelectedQuantities[idx] = next;
  renderSplitBillModalContent();
}

function renderSplitBillModalContent() {
  let splitSubtotal = 0;
  let splitCount = 0;
  posCart.forEach((it, idx) => {
    const q = splitSelectedQuantities[idx] || 0;
    splitSubtotal += it.price * q;
    splitCount += q;
  });

  openModal(`

function confirmItemizedSplitBill() {
  const paidItems = [];
  const remainingItems = [];

  posCart.forEach((it, idx) => {
    const payQ = splitSelectedQuantities[idx] || 0;
    const remQ = it.qty - payQ;
    if (payQ > 0) paidItems.push({ ...it, qty: payQ });
    if (remQ > 0) remainingItems.push({ ...it, qty: remQ, isSavedOpenItem: true });
  });

  if (paidItems.length === 0) return showToast('Pilih minimal 1 item untuk dibayar!', true);

  const method = document.getElementById('splitPayMethod').value;
  const payerExtra = document.getElementById('splitPayerName').value.trim();
  const baseLabel = posTableCustomer.trim() || posOrderType;
  const splitLabel = payerExtra ? `${baseLabel} - ${payerExtra}` : `${baseLabel} (Split)`;
  const splitTotal = paidItems.reduce((s, i) => s + i.price * i.qty, 0);

  const trx = {
    id: 'TRX-' + Date.now().toString().slice(-7),
    shiftId: getActiveShiftId(),
    date: todayISO(),
    time: nowTimeStr(),
    orderType: posOrderType,
    tableOrCustomer: splitLabel,
    customerPhone: posCustomerPhone.trim(),
    cashier: currentUser.name,
    items: paidItems,
    subtotal: splitTotal,
    discount: 0,
    promoCode: '',
    total: splitTotal,
    paymentMethod: method,
    status: 'PAID'
  };

  paidItems.forEach(it => {
    const p = db.products.find(x => x.id === it.id);
    if (p) p.stock = Math.max(0, p.stock - it.qty);
  });

  const invDeducted = applyRecipeInventoryAdjustment(paidItems, -1, trx.id);

  db.transactions.unshift(trx);
  syncMasterEvent('POS_TRANSACTION_PAID', trx);

  if (remainingItems.length > 0) {
    const remTotal = remainingItems.reduce((s, i) => s + i.price * i.qty, 0);
    if (editingOpenOrderId) {
      const ord = db.openOrders.find(o => o.id === editingOpenOrderId);
      if (ord) {
        ord.items = remainingItems;
        ord.subtotal = remTotal;
        ord.total = remTotal;
      }
    } else {
      db.openOrders.unshift({
        id: 'ORD-' + Date.now().toString().slice(-6),
        date: todayISO(),
        time: nowTimeStr(),
        orderType: posOrderType,
        tableOrCustomer: baseLabel,
        customerPhone: posCustomerPhone.trim(),
        cashier: currentUser.name,
        items: remainingItems,
        subtotal: remTotal,
        discount: 0,
        promoCode: '',
        total: remTotal
      });
    }
    saveDB();
    const slicesToSync = ['products', 'openOrders'];
    if (invDeducted) slicesToSync.push('inventory');
    autoSyncMasterSlices(slicesToSync);
    resetCurrentCart();
    showToast(`Split Bill ${formatRp(splitTotal)} lunas! Sisa item otomatis tersimpan di Open Order.`);
    showPostPaymentSuccessModal(trx);
  } else {
    if (editingOpenOrderId) {
      db.openOrders = db.openOrders.filter(o => o.id !== editingOpenOrderId);
    }
    saveDB();
    const slicesToSync = ['products'];
    if (invDeducted) slicesToSync.push('inventory');
    if (editingOpenOrderId) slicesToSync.push('openOrders');
    autoSyncMasterSlices(slicesToSync);
    resetCurrentCart();
    showPostPaymentSuccessModal(trx);
  }
}
